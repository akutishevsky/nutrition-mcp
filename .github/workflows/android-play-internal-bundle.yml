name: Android internal Play bundle

on:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    build:
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        timeout-minutes: 40
        env:
            MUNCH_ANDROID_VERSION_CODE: ${{ github.run_number }}
            # ADS-FOUNDATION: the real Munch AdMob IDs (public — the
            # publisher ID is published in app-ads.txt). This workflow
            # previously pinned Google's SAMPLE IDs, so signed release
            # bundles silently carried sample ad configuration.
            MUNCH_ADMOB_APP_ID: ca-app-pub-2708638041809482~4540309917
            MUNCH_ADMOB_BANNER_AD_UNIT_ID: ca-app-pub-2708638041809482/4316948636
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: "21"
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Verify installed-app architecture
              run: bun scripts/mobile-shell-smoke.ts
            - name: Build local mobile web bundle
              run: bun run mobile:web
            - name: Synchronize Capacitor Android project
              run: |
                  npx cap sync android
                  bun scripts/configure-mobile-android.ts
            - name: Prepare Firebase configuration
              env:
                  FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
              run: |
                  set -euo pipefail
                  if [ -z "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
                    echo "::error::Missing FIREBASE_ANDROID_CONFIG_JSON repository secret."
                    exit 1
                  fi
                  printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
                  jq -e --arg project "munch-android-bf1cd" --arg package "business.munch.app" \
                    '.project_info.project_id == $project and any(.client[]; .client_info.android_client_info.package_name == $package)' \
                    android/app/google-services.json > /dev/null
            - name: Prepare stable upload signing key
              env:
                  MUNCH_ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.MUNCH_ANDROID_UPLOAD_KEYSTORE_BASE64 }}
                  MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
              run: |
                  set -euo pipefail
                  if [ -z "$MUNCH_ANDROID_UPLOAD_KEYSTORE_BASE64" ] || [ -z "$MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD" ]; then
                    echo "::error::Set MUNCH_ANDROID_UPLOAD_KEYSTORE_BASE64 and MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD repository secrets before dispatching this workflow."
                    exit 1
                  fi
                  keystore_path="$RUNNER_TEMP/munch-upload.p12"
                  password_path="$RUNNER_TEMP/munch-upload-password"
                  printf '%s' "$MUNCH_ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
                  chmod 600 "$keystore_path"
                  umask 077
                  printf '%s' "$MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD" > "$password_path"
                  key_listing="$(keytool -list -v -keystore "$keystore_path" -storetype PKCS12 -storepass:file "$password_path" 2>/dev/null)"
                  key_alias="$(printf '%s\n' "$key_listing" | sed -n 's/^Alias name: //p' | head -n 1)"
                  if [ -z "$key_alias" ] || ! printf '%s\n' "$key_listing" | grep -q 'Entry type: PrivateKeyEntry'; then
                    echo "::error::Upload keystore must contain a private-key entry."
                    exit 1
                  fi
                  echo "MUNCH_ANDROID_UPLOAD_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
                  echo "MUNCH_ANDROID_UPLOAD_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
                  rm -f "$password_path"
            - name: Verify native project is reproducible
              run: git diff --exit-code -- android package.json bun.lock
            - name: Lint, unit test, and build signed internal AAB
              working-directory: android
              env:
                  MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
              run: ./gradlew lintRelease testReleaseUnitTest bundleRelease
            - name: Upload internal-test AAB artifact
              uses: actions/upload-artifact@v4
              with:
                  name: munch-android-internal-aab
                  path: android/app/build/outputs/bundle/release/app-release.aab
                  if-no-files-found: error
                  retention-days: 30
            - name: Remove temporary signing material
              if: always()
              run: |
                  if [ -n "${MUNCH_ANDROID_UPLOAD_KEYSTORE_PATH:-}" ]; then
                    rm -f -- "$MUNCH_ANDROID_UPLOAD_KEYSTORE_PATH"
                  fi
                  rm -f -- "$RUNNER_TEMP/munch-upload-password" android/app/google-services.json
