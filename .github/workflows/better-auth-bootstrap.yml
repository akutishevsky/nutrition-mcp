name: Better Auth Bootstrap

on:
  push:
    branches:
      - feat/better-auth-foundation

permissions:
  contents: write

jobs:
  finalize:
    if: "${{ !contains(github.event.head_commit.message, 'chore: finalize Better Auth foundation') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/better-auth-foundation
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install pinned dependencies and update lockfile
        run: bun install

      - name: Wire feature-gated Better Auth runtime
        shell: python
        run: |
          from pathlib import Path

          index = Path("src/index.ts")
          source = index.read_text()
          auth_import = 'import { registerBetterAuthRoutes } from "./auth/routes.js";\n'
          anchor = 'import { createBillingRouter } from "./billing/routes.js";\n'
          if auth_import not in source:
              source = source.replace(anchor, anchor + auth_import)
          route_anchor = 'registerDiscoveryRoutes(app);\napp.route("/", createAccountRouter());'
          if 'registerBetterAuthRoutes(app);' not in source:
              source = source.replace(
                  route_anchor,
                  'registerDiscoveryRoutes(app);\nregisterBetterAuthRoutes(app);\napp.route("/", createAccountRouter());',
              )
          index.write_text(source)

          config = Path("src/operations/config.ts")
          source = config.read_text()
          flag_anchor = '''    const railwayData = present("MUNCH_RAILWAY_DATA_ENABLED") === "true";\n'''
          flag_block = '''    const authBackend = present("MUNCH_AUTH_BACKEND") || "custom";\n    if (authBackend !== "custom" && authBackend !== "better_auth") {\n        issues.push({\n            key: "MUNCH_AUTH_BACKEND",\n            message: "Authentication backend must be custom or better_auth",\n        });\n    }\n\n'''
          if flag_block not in source:
              source = source.replace(flag_anchor, flag_anchor + flag_block)

          requirement_anchor = '''    if (production && present("MUNCH_DEV_EXPOSE_LOGIN_LINK") === "true") {\n'''
          better_auth_block = '''    if (authBackend === "better_auth") {\n        requireValue(issues, "BETTER_AUTH_SECRET");\n        const secret = present("BETTER_AUTH_SECRET");\n        if (secret && secret.length < 32) {\n            issues.push({\n                key: "BETTER_AUTH_SECRET",\n                message: "Better Auth secret must contain at least 32 characters",\n            });\n        }\n        requireValue(issues, "MUNCH_EMAIL_DELIVERY_ENDPOINT");\n        requireValue(issues, "MUNCH_EMAIL_DELIVERY_SECRET");\n    }\n\n'''
          if better_auth_block not in source:
              source = source.replace(requirement_anchor, better_auth_block + requirement_anchor)
          config.write_text(source)

          env_file = Path(".env.example")
          env = env_file.read_text()
          section = '''\n# Authentication implementation. Keep `custom` until the Better Auth staging\n# certification matrix has passed, then switch the exact certified release.\nMUNCH_AUTH_BACKEND=custom\nBETTER_AUTH_SECRET=replace-with-at-least-32-random-characters\nMUNCH_AUTH_DB_POOL_SIZE=5\nMUNCH_MAGIC_LINK_TTL_SECONDS=600\n\n# Better Auth transactional magic-link delivery. During migration, the runtime\n# can fall back to the legacy MUNCH_LOGIN_DELIVERY_* values, but production\n# should configure these explicit variables.\nMUNCH_EMAIL_DELIVERY_ENDPOINT=\nMUNCH_EMAIL_DELIVERY_SECRET=\nMUNCH_EMAIL_FROM=\n'''
          if "MUNCH_AUTH_BACKEND=" not in env:
              marker = "# Passwordless login delivery."
              env = env.replace(marker, section + "\n" + marker)
          env_file.write_text(env)

      - name: Format source
        run: bunx prettier --write package.json src/auth src/index.ts src/operations/config.ts

      - name: Validate foundation
        run: |
          bun run format:check
          bun run typecheck
          bun test

      - name: Remove one-use workflow and commit
        run: |
          rm .github/workflows/better-auth-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock .env.example src/index.ts src/operations/config.ts src/auth .github/workflows/better-auth-bootstrap.yml
          git commit -m "chore: finalize Better Auth foundation"
          git push origin HEAD:feat/better-auth-foundation
