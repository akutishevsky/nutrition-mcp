name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format:check
      - name: Enforce cross-surface capability contracts
        run: bun scripts/capability-manifest-check.ts
      - name: Enforce connection commerce boundary
        run: bun run commerce:check
      - name: Verify brand assets (no stock placeholder art)
        run: bun run brand:check
      - name: Verify OpenAI submission package
        run: bun run submission:check
      - name: Verify responsive UI surfaces
        run: bun scripts/ui-surface-smoke.ts
      - name: Verify connect page routes do not shadow OAuth
        run: bun scripts/connect-route-smoke.ts
      - name: Verify premium Pantry web surface
        run: bun scripts/pantry-ui-smoke.ts
      - name: Verify ChatGPT widget contracts
        run: bun scripts/widget-contract-smoke.ts
      - name: Typecheck server
        run: bun run typecheck
      - name: Run tests and architecture invariants
        run: bun test --coverage --coverage-reporter=text --coverage-reporter=lcov --coverage-dir=coverage
      - name: Enforce guided-nutrition domain coverage floor
        run: bun scripts/guidance-coverage-check.ts
      - name: Upload LCOV coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-lcov
          path: coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  ai-fixture:
    # S0 (Full Parity App Program): recorded OpenRouter responses replayed
    # through the real AI modules with the transport mocked. Deterministic,
    # secret-free, zero live spend — the per-PR AI contract gate. Live
    # behaviour stays with the manual/nightly OpenRouter smoke workflows.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Replay recorded AI fixtures (vision, meal ideas, recipe import, guidance)
        run: bun test tests/ai-fixtures/

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_test
      MUNCH_APP_BASE_URL: https://munch.example
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESEND_API_KEY: re_test_schema
      MUNCH_EMAIL_FROM: Munch <support@munch.example>
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install fresh canonical schema
        run: bun run db:migrate
      - name: Verify canonical schema is idempotent
        run: bun run db:migrate
      - name: Verify Better Auth schema is current
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-schema-smoke.ts
      - name: Exercise Better Auth dynamic client registration
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-oauth-http-smoke.ts
      - name: Exercise Google social sign-in initiation
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-google-sign-in-smoke.ts
      - name: Exercise Apple social sign-in provider wiring and linking readiness
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-apple-sign-in-smoke.ts
      - name: Exercise sign-in methods read model, link initiation, and unlink guardrails
        env:
          NODE_ENV: test
        run: bun scripts/better-auth-sign-in-methods-smoke.ts
      - name: Exercise Better Auth connection listing and revocation
        run: bun scripts/better-auth-connections-smoke.ts
      - name: Provision and exercise marketplace reviewer account
        env:
          NODE_ENV: test
        run: |
          REVIEWER_PASSWORD="$(openssl rand -hex 24)"
          REVIEWER_EMAIL="reviewer-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.test"
          MUNCH_REVIEWER_EMAIL="$REVIEWER_EMAIL" MUNCH_REVIEWER_PASSWORD="$REVIEWER_PASSWORD" bun scripts/provision-reviewer.ts
          MUNCH_REVIEWER_EMAIL="$REVIEWER_EMAIL" MUNCH_REVIEWER_PASSWORD="$REVIEWER_PASSWORD" bun scripts/reviewer-readiness-smoke.ts
      - name: Exercise nutrition persistence, idempotency, and RLS
        run: bun scripts/nutrition-platform-smoke.ts
      - name: Exercise persistent food catalog ingestion, cache locality, freshness, and idempotency
        run: bun scripts/food-catalog-ingestion-smoke.ts
      - name: Benchmark food catalog local search and batched writes
        env:
          MUNCH_FOOD_BENCHMARK_ITERATIONS: "60"
        run: bun scripts/food-catalog-benchmark.ts
      - name: Exercise Railway service facilities
        run: bun scripts/service-platform-smoke.ts
      - name: Exercise structured meal items, totals, idempotency, and RLS
        run: bun scripts/structured-meal-smoke.ts
      - name: Exercise saved foods, personal history, and RLS
        run: bun scripts/saved-foods-smoke.ts
      - name: Exercise household membership, invitations, and RLS
        run: bun scripts/household-rls-smoke.ts
      - name: Exercise household transfer, leave, and dissolution
        run: bun scripts/household-lifecycle-smoke.ts
      - name: Exercise recipes, planning, groceries, idempotency, and RLS
        run: bun scripts/recipe-planning-smoke.ts
      - name: Exercise guided nutrition, goal history, plan review, groceries, swaps, and RLS
        run: bun scripts/guided-nutrition-smoke.ts
      - name: Exercise Cooks persistence, media, timeline, RLS, and side-effect boundaries
        run: bun scripts/cooks-platform-smoke.ts
      - name: Exercise parsed recipe save, read-back, and meal logging
        run: bun scripts/recipe-import-save-roundtrip-smoke.ts
      - name: Exercise Pantry inventory, receipt reconciliation, and RLS
        run: bun scripts/pantry-platform-smoke.ts
      - name: Exercise Pantry planning profiles, ranking, and RLS
        env:
          MUNCH_PANTRY_PLANNING_ENABLED: "true"
        run: bun scripts/pantry-planning-smoke.ts
      - name: Exercise complete account export and household privacy
        run: bun scripts/account-export-smoke.ts
      - name: Exercise meal draft state, confirmation, idempotency, and RLS
        run: bun scripts/meal-drafts-smoke.ts
      - name: Exercise S8 chat v2 gate per rail, MCP parity enumeration, tool-grounded drafts, persistence, and RLS
        run: bun scripts/chat-v2-smoke.ts
      - name: Exercise atomic meal review, edits, confirmation, and RLS
        run: bun scripts/atomic-meal-review-smoke.ts
      - name: Benchmark meal review database paths
        env:
          MUNCH_BENCHMARK_ITERATIONS: 3
        run: bun scripts/meal-review-benchmark.ts
      - name: Exercise Better Auth account deletion and cascade cleanup
        run: bun scripts/account-deletion-smoke.ts
      - name: Exercise shared Pantry retention after member account deletion
        run: bun scripts/pantry-account-deletion-smoke.ts
      - name: Exercise readiness endpoints and maintenance
        run: bun scripts/operations-smoke.ts

  website-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      PORT: 8080
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_e2e
      MUNCH_APP_BASE_URL: http://127.0.0.1:8080
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      RESEND_API_KEY: re_test_schema
      MUNCH_EMAIL_FROM: "Munch <support@munch.example>"
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_test_placeholder
      STRIPE_PRICE_ID: price_test_placeholder
      STRIPE_HOUSEHOLD_MEMBER_PRICE_ID: price_household_test_placeholder
      OFF_USER_AGENT: "Munch E2E (test@example.test)"
      USDA_FDC_API_KEY: test-placeholder
      # The suite's browser tests all sign in through the real form from
      # one loopback IP; without this, Better Auth's production sign-in
      # limit (5/min/IP) refuses the schedule's sixth sign-in with a 429
      # (PR #236). Test-job only — production never sets this.
      MUNCH_AUTH_SIGN_IN_RATE_LIMIT_MAX: "100"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install fresh canonical schema
        run: bun run db:migrate
      - name: Install Chromium and Linux dependencies
        run: bunx playwright install --with-deps chromium
      - name: Build packaged mobile web bundle
        run: bun run mobile:web
      - name: Run packaged mobile bundle e2e at Pixel 7 size
        run: bunx playwright test --config playwright.mobile.config.ts
      # Grocery captures upload here, before the browser-journey run:
      # a later Playwright run wipes test-results/, which would take
      # the mobile lane's captures with it.
      - name: Upload grocery captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-grocery-captures
          path: test-results/grocery-captures/
          if-no-files-found: ignore
          retention-days: 14
      - name: Provision isolated reviewer account and run browser journeys
        run: |
          REVIEWER_EMAIL="e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT@example.test"
          REVIEWER_PASSWORD="$(openssl rand -hex 24)"
          MUNCH_REVIEWER_EMAIL="$REVIEWER_EMAIL" MUNCH_REVIEWER_PASSWORD="$REVIEWER_PASSWORD" bun scripts/provision-reviewer.ts
          MUNCH_REVIEWER_EMAIL="$REVIEWER_EMAIL" MUNCH_REVIEWER_PASSWORD="$REVIEWER_PASSWORD" bun run test:e2e
      - name: Upload Trends captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-trends-captures
          path: |
            test-results/trends-captures/
            test-results/trends-mobile-custom-dashboard.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload browser traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: munch-website-e2e
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag munch-ci:${{ github.sha }} .
