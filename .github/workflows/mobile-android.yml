name: Android

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Keep each main-branch run independent so every merge gets a distribution attempt.
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUNCH_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify installed-app architecture
        run: bun scripts/mobile-shell-smoke.ts
      - name: Build local mobile web bundle
        run: bun run mobile:web
      - name: Synchronize Capacitor Android project
        run: |
          npx cap sync android
          bun scripts/configure-mobile-android.ts
      - name: Prepare Firebase config for trusted main build
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            echo "::error::Missing FIREBASE_ANDROID_CONFIG_JSON repository secret."
            exit 1
          fi
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > android/app/google-services.json
          jq -e --arg project "munch-android-bf1cd" --arg package "business.munch.app" \
            '.project_info.project_id == $project and any(.client[]; .client_info.android_client_info.package_name == $package)' \
            android/app/google-services.json > /dev/null
          echo "Using the Firebase app config from the Actions secret."
      - name: Prepare Firebase fixture for pull requests
        if: github.event_name == 'pull_request'
        run: cp android/app/src/test/fixtures/google-services.json android/app/google-services.json
      - name: Prepare stable internal debug signer
        if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        env:
          MUNCH_ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.MUNCH_ANDROID_DEBUG_KEYSTORE_BASE64 }}
          MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD: ${{ secrets.MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$MUNCH_ANDROID_DEBUG_KEYSTORE_BASE64" ] && [ -z "$MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "Stable internal debug signing secrets are not configured; using the runner-generated debug key."
            exit 0
          fi
          if [ -z "$MUNCH_ANDROID_DEBUG_KEYSTORE_BASE64" ] || [ -z "$MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set both MUNCH_ANDROID_DEBUG_KEYSTORE_BASE64 and MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD repository secrets."
            exit 1
          fi
          keystore_path="$RUNNER_TEMP/munch-internal-debug.p12"
          password_path="$RUNNER_TEMP/munch-internal-debug-password"
          printf '%s' "$MUNCH_ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          umask 077
          printf '%s' "$MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD" > "$password_path"
          key_listing="$(keytool -list -v -keystore "$keystore_path" -storetype PKCS12 -storepass:file "$password_path" 2>/dev/null)"
          key_alias="$(printf '%s\n' "$key_listing" | sed -n 's/^Alias name: //p' | head -n 1)"
          if [ -z "$key_alias" ] || ! printf '%s\n' "$key_listing" | grep -q 'Entry type: PrivateKeyEntry'; then
            echo "::error::Debug keystore must contain a private-key entry."
            exit 1
          fi
          echo "MUNCH_ANDROID_DEBUG_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"
          echo "MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD=$MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "MUNCH_ANDROID_DEBUG_KEY_ALIAS=$key_alias" >> "$GITHUB_ENV"
          rm -f "$password_path"
      - name: Verify native project is reproducible
        run: git diff --exit-code -- android package.json bun.lock
      - name: Lint, unit test, and assemble Android debug app
        working-directory: android
        run: ./gradlew lintDebug testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Enforce APK size budget and bundle contents
        run: bun scripts/android-apk-report.ts
      - name: Upload APK size report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-apk-report
          path: apk-size-report/
          if-no-files-found: warn
          retention-days: 14
      - name: Remove temporary debug signing material
        if: always()
        run: |
          if [ -n "${MUNCH_ANDROID_DEBUG_KEYSTORE_PATH:-}" ]; then
            rm -f -- "$MUNCH_ANDROID_DEBUG_KEYSTORE_PATH"
          fi
          rm -f -- "$RUNNER_TEMP/munch-internal-debug-password"

  boot:
    # S0 (Full Parity App Program) gap 1: an Android lane that actually
    # BOOTS the packaged app. The validate job stops at lint + JVM tests +
    # assemble; this job installs the debug APK on an emulator and runs
    # the instrumented AppBootSmokeTest (cold start -> Capacitor WebView
    # -> packaged .mobile-web bundle renders a Munch document), then
    # captures a screenshot + logcat as boot evidence.
    #
    # Lane choice: GH-hosted emulator on PRs. Firebase Test Lab is the
    # brief's preference for the nightly/release smoke suite, but Test
    # Lab needs GCP credentials that are not wired as PR-available CI
    # secrets in this repo (the Firebase service-account secret is only
    # consumed on main by the distribute job), so PRs cannot use it.
    # The Gradle-connected test structure added in this PR
    # (AppBootSmokeTest) is exactly what Test Lab consumes, so a nightly
    # Test Lab lane can adopt it without rework once credentials exist.
    name: Android boot smoke (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MUNCH_ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify installed-app architecture
        run: bun scripts/mobile-shell-smoke.ts
      - name: Build local mobile web bundle
        run: bun run mobile:web
      - name: Synchronize Capacitor Android project
        run: |
          npx cap sync android
          bun scripts/configure-mobile-android.ts
      - name: Prepare Firebase fixture config
        run: cp android/app/src/test/fixtures/google-services.json android/app/google-services.json
      - name: Verify native project is reproducible
        run: git diff --exit-code -- android package.json bun.lock
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot packaged app on emulator and run instrumented smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            cd android && ./gradlew assembleDebug assembleDebugAndroidTest && cd ..
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n business.munch.app/.MainActivity
            sleep 10
            adb exec-out screencap -p > boot-screenshot.png
            adb logcat -d > boot-logcat.txt || true
            cd android && ./gradlew connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=business.munch.app.AppBootSmokeTest
      - name: Upload boot evidence (screenshot, logcat, test results)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: munch-android-boot-evidence
          path: |
            boot-screenshot.png
            boot-logcat.txt
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/androidTests/
          if-no-files-found: warn
          retention-days: 14

  distribute:
    name: Firebase App Distribution
    needs: validate
    if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      GCP_DISTRIBUTION_SERVICE_ACCOUNT: ${{ vars.GCP_DISTRIBUTION_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: munch-android-debug
          path: artifacts
      - name: Validate Google Cloud authentication settings
        run: |
          set -euo pipefail
          if { [ -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -z "$GCP_DISTRIBUTION_SERVICE_ACCOUNT" ]; } ||
             { [ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ] && [ -n "$GCP_DISTRIBUTION_SERVICE_ACCOUNT" ]; }; then
            echo "::error::Set both GCP_WORKLOAD_IDENTITY_PROVIDER and GCP_DISTRIBUTION_SERVICE_ACCOUNT, or leave both empty during migration."
            exit 1
          fi
      - name: Extract Firebase Android app ID
        id: firebase
        env:
          FIREBASE_ANDROID_CONFIG_JSON: ${{ secrets.FIREBASE_ANDROID_CONFIG_JSON }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_ANDROID_CONFIG_JSON" ]; then
            echo "::error::Missing FIREBASE_ANDROID_CONFIG_JSON repository secret."
            exit 1
          fi
          config_path="$RUNNER_TEMP/google-services.json"
          printf '%s' "$FIREBASE_ANDROID_CONFIG_JSON" > "$config_path"
          trap 'rm -f "$config_path"' EXIT
          jq -e --arg project "munch-android-bf1cd" --arg package "business.munch.app" \
            '.project_info.project_id == $project and any(.client[]; .client_info.android_client_info.package_name == $package)' \
            "$config_path" > /dev/null
          firebase_app_id="$(jq -er '.client[] | select(.client_info.android_client_info.package_name == "business.munch.app") | .client_info.mobilesdk_app_id' "$config_path")"
          echo "app_id=$firebase_app_id" >> "$GITHUB_OUTPUT"
      - name: Install Firebase CLI
        run: |
          npm install --global firebase-tools
          firebase --version
      - name: Authenticate to Google Cloud with Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DISTRIBUTION_SERVICE_ACCOUNT != '' }}
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DISTRIBUTION_SERVICE_ACCOUNT }}
          project_id: munch-android-bf1cd
          create_credentials_file: true
          export_environment_variables: true
      - name: Distribute Android APK with Workload Identity Federation
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GCP_DISTRIBUTION_SERVICE_ACCOUNT != '' }}
        env:
          FIREBASE_APP_ID: ${{ steps.firebase.outputs.app_id }}
        run: |
          set -euo pipefail
          firebase appdistribution:distribute "artifacts/app-debug.apk" \
            --app "$FIREBASE_APP_ID" \
            --project "munch-android-bf1cd" \
            --testers "michaelhmiv@gmail.com" \
            --release-notes "Automated Android build from commit $(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
      - name: Distribute Android APK with the existing Firebase key
        if: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER == '' && vars.GCP_DISTRIBUTION_SERVICE_ACCOUNT == '' }}
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_APP_ID: ${{ steps.firebase.outputs.app_id }}
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON repository secret. Keep it until a WIF distribution succeeds."
            exit 1
          fi
          service_account_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$service_account_file"
          chmod 600 "$service_account_file"
          trap 'rm -f "$service_account_file"' EXIT
          export GOOGLE_APPLICATION_CREDENTIALS="$service_account_file"
          firebase appdistribution:distribute "artifacts/app-debug.apk" \
            --app "$FIREBASE_APP_ID" \
            --project "munch-android-bf1cd" \
            --testers "michaelhmiv@gmail.com" \
            --release-notes "Automated Android build from commit $(printf '%s' "$GITHUB_SHA" | cut -c1-7)"
# No cancellation group is used, so merged main commits each retain a release run.
