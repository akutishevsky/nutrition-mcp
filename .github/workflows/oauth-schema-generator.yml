name: OAuth Schema Generator

on:
  push:
    branches:
      - feat/better-auth-oauth

permissions:
  contents: write

jobs:
  generate:
    if: "${{ !contains(github.event.head_commit.message, 'chore: capture Better Auth OAuth schema') }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch
      MUNCH_APP_BASE_URL: https://munch.example
      MUNCH_AUTH_BACKEND: better_auth
      BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      MUNCH_EMAIL_DELIVERY_ENDPOINT: https://email.example/deliver
      MUNCH_EMAIL_DELIVERY_SECRET: test-delivery-secret
    steps:
      - name: Check out OAuth branch
        uses: actions/checkout@v4
        with:
          ref: feat/better-auth-oauth
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install pinned dependencies
        run: bun install --frozen-lockfile

      - name: Generate exact Better Auth schema
        run: >-
          bunx auth@1.6.25 generate
          --config src/auth/auth.ts
          --output docs/generated/better-auth-oauth.sql
          --yes

      - name: Commit generated schema
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/generated/better-auth-oauth.sql
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: capture Better Auth OAuth schema"
          git push origin HEAD:feat/better-auth-oauth
