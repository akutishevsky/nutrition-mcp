name: OpenRouter Pantry Planning Smoke

on:
    workflow_dispatch:
        inputs:
            model:
                description: "Shared Munch website OpenRouter model ID"
                required: false
                default: "meta/muse-ember"
                type: string

permissions:
    contents: read

concurrency:
    group: openrouter-pantry-planning-smoke
    cancel-in-progress: true

jobs:
    live:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        services:
            postgres:
                image: public.ecr.aws/docker/library/postgres:17
                env:
                    POSTGRES_USER: postgres
                    POSTGRES_PASSWORD: postgres
                    POSTGRES_DB: munch_planning_live
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd "pg_isready -U postgres -d munch_planning_live"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_planning_live
            MUNCH_APP_BASE_URL: https://munch.business
            MUNCH_PANTRY_PLANNING_ENABLED: "true"
            MUNCH_AI_MODEL: ${{ inputs.model }}
            MUNCH_PANTRY_PLANNING_TIMEOUT_MS: "60000"
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            NODE_ENV: test
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Verify OpenRouter secret is available
              shell: bash
              run: |
                  if [ -z "$OPENROUTER_API_KEY" ]; then
                    echo "OPENROUTER_API_KEY is unavailable to this workflow" >&2
                    exit 1
                  fi
            - name: Install canonical schema
              run: bun run db:migrate
            - name: Run live Pantry culinary-quality corpus
              run: bun scripts/openrouter-pantry-planning-live-smoke.ts
