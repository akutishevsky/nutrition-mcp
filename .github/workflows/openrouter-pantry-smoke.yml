name: OpenRouter Pantry Vision Smoke

on:
    workflow_dispatch:
        inputs:
            model:
                description: "Shared Munch website OpenRouter model ID"
                required: false
                default: "meta/muse-ember"
                type: string

permissions:
    contents: read

concurrency:
    group: openrouter-pantry-smoke
    cancel-in-progress: true

jobs:
    live:
        name: Live Pantry and receipt vision smoke
        runs-on: ubuntu-latest
        timeout-minutes: 8
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            MUNCH_PANTRY_VISION_ENABLED: "true"
            MUNCH_AI_MODEL: ${{ inputs.model }}
            MUNCH_PANTRY_VISION_TIMEOUT_MS: "30000"
            MUNCH_APP_BASE_URL: "https://munch.business"
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Verify OpenRouter secret is available
              shell: bash
              run: |
                  if [ -z "$OPENROUTER_API_KEY" ]; then
                    echo "OPENROUTER_API_KEY is unavailable to this workflow" >&2
                    exit 1
                  fi
            - name: Create synthetic non-personal vision fixtures
              shell: bash
              run: |
                  python3 -m pip install --disable-pip-version-check --quiet pillow
                  python3 - <<'PY'
                  from PIL import Image, ImageDraw, ImageFont

                  def font(size):
                      try:
                          return ImageFont.truetype("DejaVuSans.ttf", size)
                      except Exception:
                          return ImageFont.load_default()

                  receipt = Image.new("RGB", (900, 1150), "white")
                  draw = ImageDraw.Draw(receipt)
                  draw.text((245, 55), "SYNTHETIC MARKET", fill="black", font=font(44))
                  rows = [
                      ("GRANULATED SUGAR 5 LB", "$4.99"),
                      ("GREEK YOGURT 32 OZ", "$6.49"),
                      ("AVOCADO 3 COUNT", "$3.00"),
                      ("PAPER TOWELS 2 ROLLS", "$5.99"),
                  ]
                  y = 180
                  for label, price in rows:
                      draw.text((70, y), label, fill="black", font=font(34))
                      draw.text((690, y), price, fill="black", font=font(34))
                      y += 120
                  draw.line((60, y, 840, y), fill="black", width=3)
                  y += 45
                  for label, price in [("SUBTOTAL", "$20.47"), ("TAX", "$1.23"), ("TOTAL", "$21.70")]:
                      draw.text((70, y), label, fill="black", font=font(34))
                      draw.text((690, y), price, fill="black", font=font(34))
                      y += 85
                  receipt.save("/tmp/munch-pantry-receipt.png", "PNG")

                  pantry = Image.new("RGB", (1000, 760), (238, 233, 220))
                  draw = ImageDraw.Draw(pantry)
                  draw.text((250, 35), "PANTRY / FRIDGE SCAN", fill="black", font=font(42))
                  draw.rectangle((60, 170, 940, 200), fill=(120, 90, 60))
                  draw.rectangle((60, 465, 940, 495), fill=(120, 90, 60))
                  items = [
                      ((90, 225, 300, 445), (248, 248, 248), "COTTAGE\nCHEESE"),
                      ((350, 250, 515, 445), (120, 180, 90), "AVOCADO"),
                      ((570, 230, 850, 445), (190, 85, 85), "GROUND\nBEEF"),
                      ((160, 520, 380, 710), (245, 245, 245), "OLIVE OIL"),
                      ((520, 535, 820, 710), (80, 155, 75), "SPINACH"),
                  ]
                  for box, color, label in items:
                      draw.rounded_rectangle(box, radius=18, fill=color, outline="black", width=3)
                      cx = (box[0] + box[2]) // 2
                      cy = (box[1] + box[3]) // 2
                      draw.multiline_text((cx, cy), label, fill="black", font=font(30), anchor="mm", align="center")
                  pantry.save("/tmp/munch-pantry-scan.png", "PNG")
                  PY
            - name: Run live OpenRouter Pantry vision smoke
              run: bun scripts/openrouter-pantry-live-smoke.ts
