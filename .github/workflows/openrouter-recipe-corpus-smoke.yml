name: Manual OpenRouter Recipe Corpus Smoke

on:
    workflow_dispatch:
        inputs:
            model:
                description: "Shared Munch website OpenRouter model ID"
                required: false
                default: "meta/muse-ember"
                type: string
            limit:
                description: "Number of corpus URLs to exercise"
                required: false
                default: "20"
                type: string
            timeout_ms:
                description: "Per-call timeout in milliseconds"
                required: false
                default: "30000"
                type: string

permissions:
    contents: read

concurrency:
    group: openrouter-recipe-corpus-smoke
    cancel-in-progress: true

jobs:
    live:
        name: Live website recipe AI corpus smoke
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            MUNCH_AI_MODEL: ${{ inputs.model || 'meta/muse-ember' }}
            MUNCH_RECIPE_IMPORT_AI_ENABLED: "true"
            MUNCH_RECIPE_IMPORT_AI_RESPONSE_FORMAT: "json_object"
            MUNCH_RECIPE_IMPORT_AI_RESPONSE_HEALING: "true"
            MUNCH_RECIPE_IMPORT_AI_TIMEOUT_MS: ${{ inputs.timeout_ms || '30000' }}
            MUNCH_RECIPE_IMPORT_AI_MAX_CALLS_PER_IMPORT: "2"
            MUNCH_RECIPE_IMPORT_AI_MAX_TOKENS: "4000"
            MUNCH_RECIPE_IMPORT_CORPUS_LIMIT: ${{ inputs.limit || '20' }}
            MUNCH_RECIPE_IMPORT_CORPUS_CONCURRENCY: "2"
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run live OpenRouter recipe corpus smoke
              run: bun scripts/openrouter-recipe-corpus-smoke.ts
