name: Photo Eval (live Ember)

# S3 (Full Parity App Program, brief §3 CI split): nightly LIVE Ember
# evaluation of the meal-photo decider pipeline against all 40 golden
# fixtures, scored against the §3 bars (item recall ≥90%; ≥80% of items
# provider-grounded; portions within ±30% for ≥70% of items; ZERO
# fabricated provider IDs or nutrition values; calorie total within
# ±25% on ≥75% of fixtures). The per-PR deterministic lane is
# fixtures/photo-eval/photo-eval.test.ts (recorded responses).
#
# Scores are reported SPLIT by fixture source (synthetic | real). The
# set is 100% synthetic illustrations today; ship readiness additionally
# requires a real-photo subset that exists AND passes — with zero real
# fixtures that criterion is UNMET by construction and the report says
# so plainly (it does not fail this run; the §3 accuracy bars do).
#
# Known issue (2026-11-09): the Actions OPENROUTER_API_KEY secret is the
# pre-rotation key and returns HTTP 401 until the owner updates it; the
# Railway production key is the rotated one. A 401 here is that known
# secret issue, not a pipeline defect.

on:
    schedule:
        - cron: "17 7 * * *"
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: photo-eval-${{ github.ref }}
    cancel-in-progress: false

jobs:
    photo-eval:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        env:
            OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
            USDA_FDC_API_KEY: ${{ secrets.USDA_FDC_API_KEY }}
            OFF_USER_AGENT: "Munch Photo Eval (photo-eval@munch.business)"
        steps:
            - name: Check out repository
              uses: actions/checkout@v4
            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1
            - name: Install dependencies
              run: bun install --frozen-lockfile
            - name: Run live photo eval against all 40 fixtures
              run: bun scripts/photo-eval-live.ts
            - name: Publish report to the run summary
              if: always()
              run: |
                  if [ -f photo-eval-report/report.md ]; then
                    cat photo-eval-report/report.md >> "$GITHUB_STEP_SUMMARY"
                  else
                    echo "Photo eval produced no report (see job log)." >> "$GITHUB_STEP_SUMMARY"
                  fi
            - name: Upload eval report + trend artifacts
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: photo-eval-report
                  path: photo-eval-report/
                  if-no-files-found: warn
                  retention-days: 30
