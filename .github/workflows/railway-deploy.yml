name: Railway Deploy

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA to verify and deploy
        required: true
      environment:
        description: GitHub/Railway environment name
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: railway-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      commit_sha: ${{ steps.pin.outputs.commit_sha }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: munch_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d munch_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/munch_release
      MUNCH_APP_BASE_URL: https://munch.example
    steps:
      - name: Validate immutable release input
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "commit_sha must be a full 40-character Git commit SHA." >&2
            exit 1
          fi

      - name: Check out requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0

      - name: Pin verified commit
        id: pin
        shell: bash
        env:
          REQUESTED_COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "${REQUESTED_COMMIT_SHA,,}" != "$actual" ]]; then
            echo "Checkout mismatch: requested $REQUESTED_COMMIT_SHA but resolved $actual." >&2
            exit 1
          fi
          echo "commit_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "Verified release commit: $actual"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

      - name: Typecheck server
        run: bun run typecheck

      - name: Run unit tests
        run: bun test

      - name: Apply migrations
        run: bun run db:migrate

      - name: Verify migrations are idempotent
        run: bun run db:migrate

      - name: Verify Better Auth schema is current
        env:
          NODE_ENV: test
          MUNCH_AUTH_BACKEND: better_auth
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MUNCH_EMAIL_DELIVERY_ENDPOINT: https://email.example/deliver
          MUNCH_EMAIL_DELIVERY_SECRET: test-delivery-secret
        run: bun scripts/better-auth-schema-smoke.ts

      - name: Exercise account, billing, and OAuth persistence
        run: bun scripts/platform-smoke.ts

      - name: Exercise OAuth HTTP routes and subscription enforcement
        run: bun scripts/oauth-http-smoke.ts

      - name: Exercise nutrition persistence, idempotency, and RLS
        run: bun scripts/nutrition-platform-smoke.ts

      - name: Exercise service facilities and coherent backend selection
        run: bun scripts/service-platform-smoke.ts

      - name: Exercise structured meal items, totals, idempotency, and RLS
        run: bun scripts/structured-meal-smoke.ts

      - name: Exercise saved foods, personal history, and RLS
        run: bun scripts/saved-foods-smoke.ts

      - name: Exercise meal draft state, confirmation, idempotency, and RLS
        run: bun scripts/meal-drafts-smoke.ts

      - name: Exercise account portal, preferences, exports, and connections
        run: bun scripts/account-portal-smoke.ts

      - name: Exercise readiness endpoints and maintenance
        run: bun scripts/operations-smoke.ts

      - name: Build production container
        env:
          VERIFIED_COMMIT_SHA: ${{ steps.pin.outputs.commit_sha }}
        run: docker build --tag "munch-release:$VERIFIED_COMMIT_SHA" .

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}
    env:
      TARGET_COMMIT_SHA: ${{ needs.verify.outputs.commit_sha }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ vars.RAILWAY_PROJECT_ID }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_ENVIRONMENT_ID: ${{ vars.RAILWAY_ENVIRONMENT_ID }}
      MUNCH_CERTIFICATION_BASE_URL: ${{ vars.MUNCH_CERTIFICATION_BASE_URL }}
    steps:
      - name: Check out verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit_sha }}
          fetch-depth: 0

      - name: Confirm deployment checkout
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [[ "$actual" != "$TARGET_COMMIT_SHA" ]]; then
            echo "Deployment checkout mismatch: expected $TARGET_COMMIT_SHA but resolved $actual." >&2
            exit 1
          fi

      - name: Validate deployment environment
        shell: bash
        run: |
          set -euo pipefail
          required=(
            RAILWAY_TOKEN
            RAILWAY_PROJECT_ID
            RAILWAY_SERVICE_ID
            RAILWAY_ENVIRONMENT_ID
            MUNCH_CERTIFICATION_BASE_URL
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub environment value: $name" >&2
              exit 1
            fi
          done

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Upload exact verified source
        run: >-
          railway up --ci
          --project "$RAILWAY_PROJECT_ID"
          --service "$RAILWAY_SERVICE_ID"
          --environment "$RAILWAY_ENVIRONMENT_ID"
          --message "GitHub Actions deploy $TARGET_COMMIT_SHA"

      - name: Public readiness and OAuth discovery
        run: bun scripts/certification/public.ts "$MUNCH_CERTIFICATION_BASE_URL"
