apply plugin: 'com.android.application'

def firebaseConfig = file('google-services.json')
def firebaseConfigAvailable = firebaseConfig.exists() && firebaseConfig.length() > 0
def releaseTaskRequested = gradle.startParameter.taskNames.any {
    it.toLowerCase().contains('release')
}
def internalDebugKeystorePath = (System.getenv('MUNCH_ANDROID_DEBUG_KEYSTORE_PATH') ?: '').trim()
def internalDebugStorePassword = (System.getenv('MUNCH_ANDROID_DEBUG_KEYSTORE_PASSWORD') ?: '').trim()
def internalDebugKeyAlias = (System.getenv('MUNCH_ANDROID_DEBUG_KEY_ALIAS') ?: '').trim()
def internalDebugSigningReady =
    internalDebugKeystorePath && internalDebugStorePassword && internalDebugKeyAlias &&
    file(internalDebugKeystorePath).exists()
def internalDebugSigningRequested =
    internalDebugKeystorePath || internalDebugStorePassword || internalDebugKeyAlias
def uploadKeystorePath = (System.getenv('MUNCH_ANDROID_UPLOAD_KEYSTORE_PATH') ?: '').trim()
def uploadStorePassword = (System.getenv('MUNCH_ANDROID_UPLOAD_KEYSTORE_PASSWORD') ?: '').trim()
def uploadKeyAlias = (System.getenv('MUNCH_ANDROID_UPLOAD_KEY_ALIAS') ?: '').trim()
def uploadSigningReady =
    uploadKeystorePath && uploadStorePassword && uploadKeyAlias &&
    file(uploadKeystorePath).exists()
def configuredVersionCode = (System.getenv('MUNCH_ANDROID_VERSION_CODE') ?: '').trim()
def androidVersionCode = 1
if (configuredVersionCode) {
    try {
        androidVersionCode = Integer.parseInt(configuredVersionCode)
    } catch (NumberFormatException ignored) {
        throw new GradleException('MUNCH_ANDROID_VERSION_CODE must be between 1 and 2100000000.')
    }
    if (androidVersionCode < 1 || androidVersionCode > 2100000000) {
        throw new GradleException('MUNCH_ANDROID_VERSION_CODE must be between 1 and 2100000000.')
    }
}
def sampleAdMobAppId = 'ca-app-pub-3940256099942544~3347511713'
def sampleBannerAdUnitId = 'ca-app-pub-3940256099942544/9214589741'
def configuredReleaseAdMobAppId =
    (project.findProperty('munchAdMobAppId') ?: System.getenv('MUNCH_ADMOB_APP_ID') ?: '').trim()
def configuredReleaseBannerAdUnitId =
    (project.findProperty('munchAdMobBannerAdUnitId') ?: System.getenv('MUNCH_ADMOB_BANNER_AD_UNIT_ID') ?: '').trim()
def releaseAdMobAppId = configuredReleaseAdMobAppId ?: sampleAdMobAppId

if (releaseTaskRequested && !firebaseConfigAvailable) {
    throw new GradleException(
        "Android release builds require android/app/google-services.json so Crashlytics is included."
    )
}
if (internalDebugSigningRequested && !internalDebugSigningReady) {
    throw new GradleException(
        "Stable Android debug signing is partially configured; provide the keystore path, password, and alias together."
    )
}
if (releaseTaskRequested && !uploadSigningReady) {
    throw new GradleException(
        "Android release builds require the stable upload keystore, password, and alias from the protected signing workflow."
    )
}

android {
    namespace = "business.munch.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "business.munch.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [munchAdMobAppId: sampleAdMobAppId]
        resValue "string", "munch_admob_banner_unit_id", ""
        versionCode androidVersionCode
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platforms/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        // AppIdentityUnitTest asserts the packaged identity from the
        // generated BuildConfig; AGP 8 does not generate it by default.
        buildConfig true
    }
    signingConfigs {
        if (internalDebugSigningReady) {
            internalDebug {
                storeFile file(internalDebugKeystorePath)
                storePassword internalDebugStorePassword
                keyAlias internalDebugKeyAlias
                keyPassword internalDebugStorePassword
                storeType 'PKCS12'
            }
        }
        if (uploadSigningReady) {
            upload {
                storeFile file(uploadKeystorePath)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadStorePassword
                storeType 'PKCS12'
            }
        }
    }
    buildTypes {
        debug {
            manifestPlaceholders = [munchAdMobAppId: sampleAdMobAppId]
            resValue "string", "munch_admob_banner_unit_id", sampleBannerAdUnitId
            if (internalDebugSigningReady) {
                signingConfig signingConfigs.internalDebug
            }
        }
        release {
            manifestPlaceholders = [munchAdMobAppId: releaseAdMobAppId]
            resValue "string", "munch_admob_banner_unit_id", configuredReleaseBannerAdUnitId
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (uploadSigningReady) {
                signingConfig signingConfigs.upload
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation "com.android.billingclient:billing:9.1.0"
    implementation "com.google.android.gms:play-services-ads:25.5.0"
    implementation "com.google.android.ump:user-messaging-platform:4.0.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.1"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    if (firebaseConfigAvailable) {
        implementation platform('com.google.firebase:firebase-bom:34.19.0')
        implementation 'com.google.firebase:firebase-crashlytics'
    }
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

if (firebaseConfigAvailable) {
    apply plugin: 'com.google.gms.google-services'
    apply plugin: 'com.google.firebase.crashlytics'
} else {
    logger.lifecycle(
        'Firebase config is absent; Crashlytics is disabled for this local/debug build.'
    )
}
