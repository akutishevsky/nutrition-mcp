<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width,initial-scale=1,viewport-fit=cover"
        />
        <meta name="robots" content="noindex,nofollow" />
        <meta name="referrer" content="no-referrer" />
        <meta name="theme-color" content="#f6f8f6" />
        <title>Munch</title>
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/styles.css" />
        <link rel="stylesheet" href="/app-overrides.css" />
        <link rel="stylesheet" href="/account-settings.css" />
    </head>
    <body class="app-page">
        <a class="skip-link" href="#app-content">Skip to content</a>
        <div class="app-shell">
            <aside class="app-sidebar">
                <a class="brand" href="/app"
                    ><img
                        class="brand-logo"
                        src="/brand/munch-mark.svg"
                        alt=""
                    /><span>Munch</span></a
                >
                <nav class="app-nav" aria-label="Application navigation">
                    <a data-route="today" href="/app"
                        ><span class="nav-icon">◉</span><span>Today</span></a
                    >
                    <a data-route="log" href="/app/log"
                        ><span class="nav-icon">▤</span><span>History</span></a
                    >
                    <a data-route="trends" href="/app/trends"
                        ><span class="nav-icon">↗</span><span>Trends</span></a
                    >
                    <!-- Chat v2 placement (Contextual only): there is
                         deliberately NO global Chat nav entry — the
                         agent is reached from the Today, Meal Plan,
                         Pantry, and Trends entry rows only. -->
                    <a data-route="recipes" href="/app/recipes"
                        ><span class="nav-icon">◇</span><span>Recipes</span></a
                    >
                    <a data-route="cooks" href="/app/cooks"
                        ><span class="nav-icon">♨</span><span>Cooks</span></a
                    >
                    <a data-route="plan" href="/app/plan"
                        ><span class="nav-icon">□</span
                        ><span>Meal Plan</span></a
                    >
                    <a data-route="groceries" href="/app/groceries"
                        ><span class="nav-icon">✓</span
                        ><span>Groceries</span></a
                    >
                    <a data-route="pantry" href="/app/pantry"
                        ><span class="nav-icon">▦</span><span>Pantry</span></a
                    >
                    <a data-route="household" href="/app/household"
                        ><span class="nav-icon">⌂</span
                        ><span>Household</span></a
                    >
                </nav>
                <div class="sidebar-bottom">
                    <nav class="app-nav" aria-label="Account navigation">
                        <a data-route="settings" href="/app/settings"
                            ><span class="nav-icon">⚙</span
                            ><span>Settings</span></a
                        >
                        <a href="/help"
                            ><span class="nav-icon">?</span><span>Help</span></a
                        >
                    </nav>
                </div>
            </aside>
            <main class="app-main">
                <div class="app-content" id="app-content" tabindex="-1">
                    <div class="loading-state">
                        <div>
                            <div
                                class="skeleton"
                                style="width: 180px; height: 18px"
                            ></div>
                            <div
                                class="skeleton spacer-top"
                                style="width: 280px; height: 54px"
                            ></div>
                            <p class="spacer-top">
                                Loading your Munch workspace…
                            </p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
        <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
            <a data-route="today" href="/app"
                ><span>◉</span><span>Today</span></a
            >
            <a data-route="plan" href="/app/plan"
                ><span>□</span><span>Plan</span></a
            >
            <a data-route="recipes" href="/app/recipes"
                ><span>◇</span><span>Recipes</span></a
            >
            <a data-route="groceries" href="/app/groceries"
                ><span>✓</span><span>Groceries</span></a
            >
            <a data-route="pantry" href="/app/pantry"
                ><span>▦</span><span>Pantry</span></a
            >
            <a data-route="more" href="/app/more"
                ><span>•••</span><span>More</span></a
            >
        </nav>
        <div
            class="toast-region"
            id="toast-region"
            aria-live="polite"
            aria-atomic="true"
        ></div>
        <dialog id="app-dialog"></dialog>
        <script type="module" src="/app-integrity.js"></script>
        <script type="module" src="/app.js"></script>
        <script type="module" src="/app-patches.js"></script>
        <script>
            // S4 startup honesty: if the app bundle or the first data
            // load never resolves, the skeleton must not spin forever.
            // After 12s with the loading state still on screen, swap in
            // an honest failure state with a reload action. A stored
            // session is untouched by this — it stays on the device.
            window.setTimeout(() => {
                const content = document.getElementById("app-content");
                if (!content || !content.querySelector(".loading-state")) {
                    return;
                }
                content.innerHTML =
                    '<div class="error-state" data-testid="startup-failure-state"><div><h2>Munch is taking too long to load</h2><p>The app did not finish loading — the bundle or the Munch service did not respond. Check your connection, then reload. Your session stays saved on this device.</p><button class="button button-primary spacer-top" type="button" id="startup-reload">Reload Munch</button></div></div>';
                document
                    .getElementById("startup-reload")
                    ?.addEventListener("click", () => location.reload());
            }, 12000);
        </script>
    </body>
</html>
