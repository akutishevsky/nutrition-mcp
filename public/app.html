<!doctype html>

        <meta name="referrer" content="no-referrer" />

                    >
                    <a data-route="insights" href="/app/insights"
                        ><span class="nav-icon">↗</span><span>Insights</span></a
                    >
                    <a data-route="recipes" href="/app/recipes"
                        ><span class="nav-icon">◇</span><span>Recipes</span></a
                    >
                    <a data-route="cooks" href="/app/cooks"
                        ><span class="nav-icon">♨</span><span>Cooks</span></a
                    >
                    <a data-route="plan" href="/app/plan"
                        ><span class="nav-icon">□</span
                        ><span>Meal Plan</span></a
                    >
                    <a data-route="groceries" href="/app/groceries"
                        ><span class="nav-icon">✓</span
                        ><span>Groceries</span></a
                    >
                    <a href="/app/pantry"
                        ><span class="nav-icon">▦</span><span>Pantry</span></a
                    >
                    <a data-route="household" href="/app/household"
                        ><span class="nav-icon">⌂</span
                        ><span>Household</span></a

                </nav>
                <div class="sidebar-bottom">
                    <nav class="app-nav" aria-label="Account navigation">
                        <a data-route="settings" href="/app/settings"
                            ><span class="nav-icon">⚙</span
                            ><span>Settings</span></a
                        >
                        <a href="/help"
                            ><span class="nav-icon">?</span><span>Help</span></a

                    </nav>
                </div>
            </aside>
            <main class="app-main">
                <header class="app-topbar">
                    <div>
                        <p class="section-kicker" id="page-kicker">Munch</p>
                        <h1 id="page-title">Today</h1>
                    </div>
                    <div class="topbar-actions">
                        <button
                            class="button button-secondary button-small"
                            id="refresh-button"
                            type="button"
                        >
                            Refresh
                        </button>
                        <button
                            class="button button-primary button-small"
                            id="quick-action"
                            type="button"
                        >
                            Use with your AI
                        </button>
                    </div>
                </header>
                <div class="app-content" id="app-content" tabindex="-1">
                    <div class="loading-state">
                        <div>
                            <div
                                class="skeleton"
                                style="width: 180px; height: 18px"
                            ></div>
                            <div
                                class="skeleton spacer-top"
                                style="width: 280px; height: 54px"
                            ></div>
                            <p class="spacer-top">

        <div
            class="toast-region"
            id="toast-region"
            aria-live="polite"
            aria-atomic="true"
        ></div>

        <script type="module" src="/app-integrity.js"></script>
        <script type="module" src="/app.js"></script>
        <script type="module" src="/app-patches.js"></script>
        <script type="module">
            // Progressive disclosure for structured meal cards. The canonical
            // item rows stay visible for fast scanning; verbose descriptions,
            // notes, secondary nutrients and source/estimate metadata remain
            // available on demand instead of competing with the diary itself.
            const mealRoot = document.getElementById("app-content");

            function enhanceMealCard(card) {
                if (!(card instanceof HTMLElement)) return;
                if (card.dataset.densityReady === "true") return;
                card.dataset.densityReady = "true";

                const foodItems = card.querySelector(".food-items");
                if (!foodItems) return;
                const rows = [
                    ...foodItems.querySelectorAll(":scope > .food-row"),
                ];
                const isLegacy =
                    rows.length === 0 ||
                    rows.some((row) =>
                        row.textContent?.includes("Legacy aggregate entry"),
                    );
                if (isLegacy) return;

                card.classList.add("is-structured");
                const heading = card.querySelector(".meal-card-head h4");
                const originalDescription = heading?.textContent?.trim() || "";
                if (heading) {
                    heading.textContent = `${rows.length} food${rows.length === 1 ? "" : "s"}`;
                    heading.title = originalDescription;
                }

                const audit = document.createElement("details");
                audit.className = "meal-audit";
                const auditSummary = document.createElement("summary");
                auditSummary.textContent = "Log details";
                auditSummary.setAttribute(
                    "aria-label",
                    "Show original meal description and additional log details",
                );
                const auditBody = document.createElement("div");
                auditBody.className = "meal-audit-body";
                if (originalDescription) {
                    const description = document.createElement("div");
                    const label = document.createElement("strong");
                    label.textContent = "Original description";
                    const text = document.createElement("div");
                    text.textContent = originalDescription;
                    description.append(label, text);
                    auditBody.append(description);
                }

                const meta = card.querySelector(".meal-meta");
                const metaItems = meta ? [...meta.children] : [];
                if (metaItems.length > 2) {
                    const notes = document.createElement("div");
                    const label = document.createElement("strong");
                    label.textContent = "Notes";
                    const text = document.createElement("div");
                    text.textContent = metaItems
                        .slice(2)
                        .map((item) => item.textContent?.trim())
                        .filter(Boolean)
                        .join(" · ");
                    notes.append(label, text);
                    auditBody.append(notes);
                    metaItems.slice(2).forEach((item) => item.remove());
                }

                const macros = card.querySelector(".meal-macros");
                const macroItems = macros ? [...macros.children] : [];
                if (macroItems.length > 3) {
                    const secondary = document.createElement("div");
                    const label = document.createElement("strong");
                    label.textContent = "Additional nutrients";
                    const text = document.createElement("div");
                    text.textContent = macroItems
                        .slice(3)
                        .map((item) => item.textContent?.trim())
                        .filter(Boolean)
                        .join(" · ");
                    secondary.append(label, text);
                    auditBody.append(secondary);
                    macroItems.slice(3).forEach((item) => item.remove());
                }

                rows.forEach((row) => {
                    const source = row.querySelector(".demo-source-row");
                    if (!source) return;
                    const assumption =
                        source.nextElementSibling?.tagName === "SMALL"
                            ? source.nextElementSibling
                            : null;
                    const details = document.createElement("details");
                    details.className = "food-audit";
                    const summary = document.createElement("summary");
                    summary.textContent = "Source & estimate";
                    const body = document.createElement("div");
                    body.className = "food-audit-body";
                    body.append(source);
                    if (assumption) body.append(assumption);
                    details.append(summary, body);
                    row.querySelector(":scope > div")?.append(details);
                });

                audit.append(auditSummary, auditBody);
                const actions = card.querySelector(":scope > .auth-actions");
                card.insertBefore(audit, actions || null);
            }

            function enhanceMeals() {
                mealRoot
                    ?.querySelectorAll(".meal-card[data-meal-id]")
                    .forEach(enhanceMealCard);
            }

            const mealObserver = new MutationObserver(enhanceMeals);
            if (mealRoot) {
                mealObserver.observe(mealRoot, {
                    childList: true,
                    subtree: true,
                });
                enhanceMeals();
            }
        </script>
        <script>
            // S4 startup honesty: if the app bundle or the first data
            // load never resolves, the skeleton must not spin forever.
            // After 12s with the loading state still on screen, swap in
            // an honest failure state with a reload action. A stored
            // session is untouched by this — it stays on the device.
            window.setTimeout(() => {
                const content = document.getElementById("app-content");
                if (!content || !content.querySelector(".loading-state")) {
                    return;
                }
                content.innerHTML =
                    '<div class="error-state" data-testid="startup-failure-state"><div><h2>Munch is taking too long to load</h2><p>The app did not finish loading — the bundle or the Munch service did not respond. Check your connection, then reload. Your session stays saved on this device.</p><button class="button button-primary spacer-top" type="button" id="startup-reload">Reload Munch</button></div></div>';
                document
                    .getElementById("startup-reload")
                    ?.addEventListener("click", () => location.reload());
            }, 12000);
        </script>
    </body>
</html>
