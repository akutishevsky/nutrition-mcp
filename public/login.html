<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <meta name="robots" content="noindex,nofollow" />
        <meta name="referrer" content="no-referrer" />
        <title>Sign in to Munch</title>
        <meta
            name="description"
            content="Use a secure, single-use email link to sign in to Munch."
        />
        <meta name="theme-color" content="#176b3a" />
        <link rel="icon" href="/favicon.ico" />
        <link rel="stylesheet" href="/styles.css" />
    </head>
    <body class="auth-page">
        <main class="auth-main">
            <section class="auth-card" aria-labelledby="login-title">
                <a class="brand" href="/" aria-label="Munch home"
                    ><img
                        class="brand-logo"
                        src="/brand/munch-mark.svg"
                        alt=""
                    /><span>Munch</span></a
                >
                <p class="section-kicker spacer-top">Secure sign in</p>
                <h1 id="login-title">Continue to Munch</h1>
                <p>
                    Enter your email and we will send a secure, single-use
                    sign-in link. No password is created or stored.
                </p>
                <p
                    id="message"
                    class="message-bar"
                    role="status"
                    aria-live="polite"
                ></p>
                <form id="login-form" class="auth-form">
                    <label class="field" for="email"
                        ><span>Email address</span
                        ><input
                            id="email"
                            name="email"
                            type="email"
                            inputmode="email"
                            autocomplete="email"
                            maxlength="320"
                            required
                    /></label>
                    <button class="button button-primary" type="submit">
                        Send sign-in link
                    </button>
                </form>
                <p class="auth-footnote">
                    By continuing, you agree to the
                    <a href="/terms">Terms</a> and acknowledge the
                    <a href="/privacy">Privacy Policy</a>.
                </p>
                <p class="auth-footnote"><a href="/">Return to Munch</a></p>
            </section>
        </main>
        <script>
            (function () {
                const form = document.getElementById("login-form");
                const message = document.getElementById("message");
                const params = new URLSearchParams(location.search);
                const returnTo = params.get("return_to") || "/app";
                form.addEventListener("submit", async (event) => {
                    event.preventDefault();
                    const button = form.querySelector("button");
                    button.disabled = true;
                    button.setAttribute("aria-busy", "true");
                    message.className = "message-bar is-visible";
                    message.textContent = "Sending your sign-in link…";
                    try {
                        const response = await fetch("/account/login/request", {
                            method: "POST",
                            headers: { "content-type": "application/json" },
                            body: JSON.stringify({
                                email: document.getElementById("email").value,
                                returnTo,
                            }),
                        });
                        const data = await response.json().catch(() => ({}));
                        if (!response.ok)
                            throw new Error(
                                data.error === "login_delivery_unavailable"
                                    ? "Email delivery is temporarily unavailable."
                                    : "Unable to send the sign-in link.",
                            );
                        form.hidden = true;
                        message.textContent =
                            "Check your email. Open the single-use Munch link on this device to continue.";
                        if (data.developmentLoginUrl) {
                            const link = document.createElement("a");
                            link.href = data.developmentLoginUrl;
                            link.textContent = "Development sign-in link";
                            link.className =
                                "button button-secondary spacer-top";
                            message.after(link);
                        }
                    } catch (error) {
                        message.classList.add("message-error");
                        message.textContent = error.message;
                        button.disabled = false;
                        button.removeAttribute("aria-busy");
                    }
                });
            })();
        </script>
    </body>
</html>
