<!doctype html>
<!--
  Component gallery — DEV ONLY.

  Every shared component on one page so the light/dark and narrow-width passes
  that STYLE_GUIDE.md requires can actually be done. Deliberately registered as
  a WIDGET_TEMPLATES entry but with NO ui:// resource and NO tool, so it is
  assembled and covered by src/widgets.test.ts yet unreachable by any client.

  View it with:  bun run harness   ->  http://localhost:8787/host?widget=component-gallery
-->
<html lang="en">

            .gal {
                padding: 16px;
                display: grid;
                /* minmax(0, 1fr), not the implicit auto column: an auto column is
                   sized by its widest content, so the nowrap preview table would
                   stretch every sibling card and scroll the page sideways. */
                grid-template-columns: minmax(0, 1fr);
                gap: 18px;
            }
            .gal section {
                padding: 14px;
            }
            .gal h3 {
                margin: 0 0 10px;
                font-size: 11.5px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // macros.js needs these two in scope (same contract as every widget).
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            /*@include shared/macros.js@*/

            /*@include shared/period.js@*/

            // Period rows (trends' Week / Month / Quarter / Year view), one of
            // each state: the partial current period, a goal change with
            // possibly-incomplete days, an inner period with nothing logged,
            // and one predating goals history. Shaped like PeriodRow in
            // src/periods.ts and run through the widget's own parser.
            const PT_A = { calories: 2200, protein: 160, carbs: 220, fat: 70 };
            const PT_B = { calories: 2400, protein: 150, carbs: 280, fat: 80 };
            const prow = (key, start, end, days, logged, avg, t, extra) =>
                Object.assign(
                    {
                        key,
                        start,
                        end,
                        days,
                        partial: false,
                        logged_days: logged,
                        avg,
                        targets: t,
                        targets_changed: false,
                        targets_assumed: false,
                        on_target_days: t ? 0 : null,
                        incomplete_days: t ? 0 : null,
                    },
                    extra,
                );
            const PERIOD_GALLERY = periodsFrom({
                [PERIOD_META_KEY]: {
                    v: 1,
                    end_date: "2026-07-15",
                    group_by: "month",
                    targets_from: "2026-03-10",
                    periods: {
                        week: [],
                        quarter: [],
                        year: [],
                        month: [
                            prow(
                                "2026-07",
                                "2026-07-01",
                                "2026-07-31",
                                15,
                                12,
                                {
                                    calories: 2140.4,
                                    protein: 148.2,
                                    carbs: 231,
                                    fat: 71,
                                },
                                PT_A,
                                {
                                    partial: true,
                                    on_target_days: 7,
                                    incomplete_days: 0,
                                },
                            ),
                            prow(
                                "2026-06",
                                "2026-06-01",
                                "2026-06-30",
                                30,
                                23,
                                {
                                    calories: 1830,
                                    protein: 132,
                                    carbs: 204,
                                    fat: 62.5,
                                },
                                PT_A,
                                {
                                    targets_changed: true,
                                    on_target_days: 9,
                                    incomplete_days: 2,
                                },
                            ),
                            prow(
                                "2026-05",
                                "2026-05-01",
                                "2026-05-31",
                                31,
                                0,
                                null,
                                PT_B,
                            ),
                            prow(
                                "2026-03",
                                "2026-03-01",
                                "2026-03-31",
                                31,
                                26,
                                {
                                    calories: 2390,
                                    protein: 171,

            });
            const PERIOD_NO_TARGETS = PERIOD_GALLERY.periods.month.map((r) =>
                Object.assign({}, r, {
                    targets: null,

            // One day's worth of fixture data for the macro components below.

                [ADDED_SUGAR_META_KEY]: {

                    goal: 25,
                    days: { "2026-10-04": 35 },
                    meals: { m1: 4.8, m2: 0, m3: 1.2, m4: null },

            const AS = addedSugarPayload(GALLERY_META[ADDED_SUGAR_META_KEY]);
            const STRIP = withAddedSugar(
                AS,
                addedSugarFor(AS, ["2026-10-04"]),
                TOTALS,
                GOALS,
                MEALS,
            );
            const ITEMS = mealItemsPayload(GALLERY_META[MEAL_ITEMS_META_KEY]);
            const STRIP_MEALS = withMealItems(ITEMS, STRIP.meals);
            const ITEM_MEALS = withMealItems(ITEMS, MEALS);
            // The breakdown with its first expandable row pinned open, as a
            // tap would leave it (mealRowToggle), so the open state is on
            // screen without one.
            function pinFirstMealRow(html) {
                return html
                    .replace(
                        '<li class="md-row has-items">',
                        '<li class="md-row has-items open">',
                    )
                    .replace(
                        'aria-expanded="false" aria-controls="md-items-',
                        'aria-expanded="true" aria-controls="md-items-',
                    )
                    .replace(
                        /(<ul class="md-items" id="[^"]+"[^>]*?) hidden>/,
                        "$1>",
                    );
            }
            const CARBS = MACROS.find((m) => m.key === "carbs_g");
            const ADDED_SUGAR = MACROS.find((m) => m.key === "added_sugar_g");
            const ALCOHOL = MACROS.find((m) => m.key === "alcohol_g");
            const CAFFEINE = MACROS.find((m) => m.key === "caffeine_mg");
            // The alcohol line in each of its states, including the two that
            // are easy to conflate: null (tracking off → nothing renders) and
            // 0 (a tracked, alcohol-free day → the line stays).
            const alcoholStates = [
                ["over the limit", { alcohol_g: 27.7 }, GOALS],
                ["under the limit", { alcohol_g: 9.9 }, GOALS],
                ["no limit set", { alcohol_g: 13.9 }, null],
                ["tracked, zero", { alcohol_g: 0 }, GOALS],
                [
                    "tracking off (null → renders nothing)",
                    { alcohol_g: null },
                    GOALS,
                ],
            ];
            // The same line without the drink gloss, in milligrams. Caffeine
            // has no opt-in flag, so the null row is the ONLY thing standing
            // between a user who has never logged caffeine and a fabricated
            // "0 mg of 400 mg" — worth being able to look at.
            const caffeineStates = [
                ["over the limit", { caffeine_mg: 470 }, GOALS],
                ["under the limit", { caffeine_mg: 185 }, GOALS],
                ["no limit set", { caffeine_mg: 95 }, null],
                ["recorded, zero", { caffeine_mg: 0 }, GOALS],
                [
                    "a limit of 0 mg — a real limit, and any dose is over it",
                    { caffeine_mg: 95 },
                    { ...GOALS, caffeine_mg: 0 },
                ],
                [
                    "never recorded (null → renders nothing)",
                    { caffeine_mg: null },
                    GOALS,
                ],
            ];

            // Added sugar: a day that did not record it reaches the strip as
            // undefined (the merge leaves it out) — a "not recorded" cell when
            // a limit is set, nothing otherwise — and a recorded 0 prints as
            // 0 (zeroIsValue), never "none logged". 0 is a real limit.
            const addedSugarStates = [
                [
                    "over the limit",
                    { added_sugar_g: 35 },
                    { added_sugar_g: 25 },
                ],
                [
                    "under the limit",
                    { added_sugar_g: 12.4 },
                    { added_sugar_g: 25 },
                ],
                ["no limit set", { added_sugar_g: 18 }, null],
                [
                    "a limit of 0 g — any added sugar is over it",
                    { added_sugar_g: 6 },
                    { added_sugar_g: 0 },
                ],
                [
                    "recorded 0, limit set",
                    { added_sugar_g: 0 },
                    { added_sugar_g: 25 },
                ],
                ["recorded 0, no limit (hidden)", { added_sugar_g: 0 }, null],
                [
                    "not recorded, limit set → 'not recorded'",
                    {},
                    { added_sugar_g: 25 },
                ],
                [
                    "not recorded, limit of 0 g → 'not recorded', not 'at limit'",
                    {},
                    { added_sugar_g: 0 },
                ],
                ["not recorded, no limit → renders nothing", {}, null],
            ];

            // A limit cell is a grid item; on its own it needs a one-column
            // grid to sit in. An empty string is the gate having suppressed
            // the cell, which is itself a state worth seeing.
            function limitRow(cell) {
                return cell
                    ? `<div class="mgrid lim" style="--lc:1;--lcw:1;margin-bottom:12px">${cell}</div>`
                    : '<div class="hint" style="opacity:.6;margin-bottom:20px">(nothing)</div>';
            }

            function render() {
                document.getElementById("root").innerHTML = `
          <div class="gal">
            <section class="card">
              <h3>Buttons</h3>
              <div class="actions" style="margin-top:0">
                <button class="btn btn-primary">Import 42 meals</button>
                <button class="btn">Back</button>
                <button class="btn btn-danger">Discard</button>
                <button class="btn btn-sm">Small</button>

            <section class="card">
              <h3>Fields</h3>

              </div>
            </section>

            <section class="card">
              <h3>File drop</h3>
              <label class="drop">
                <span class="big">📄</span>
                <strong>Choose your export file</strong><br />or drag it here
                <input type="file" class="drop-input" accept=".csv" />

            </section>

            <section class="card">

          </div>`;

            initWidget({
                name: "component-gallery",
                loading: '<div class="empty">Loading gallery…</div>',
                coerce: () => ({ gallery: true }),
                render,
                sample: { gallery: true },

            render();
