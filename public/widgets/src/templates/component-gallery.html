<!doctype html>
<!--
  Component gallery — DEV ONLY.

  Every shared primitive on one page, in every state, so the light/dark and
  320px passes STYLE_GUIDE.md requires can actually be done. Registered in
  WIDGET_TEMPLATES so it is assembled and covered by src/widgets.test.ts, but
  with NO ui:// resource and NO tool, so no client can reach it.

  A primitive that is not on this page cannot be reviewed in dark mode or at a
  phone width, so ADDING A PRIMITIVE INCLUDES ADDING IT HERE.

  Every specimen that has an emitter is emitted by the real shared code —
  macroPanel / macroChip / macroLimit / waterChip / focusPanel / focusApply /
  macroDetailBody from shared/macros.js, sparkMarkup / chartableKeys from
  shared/spark.js, calendarSlots / hairlineSlot / chPoints / chPath /
  chMarksMarkup from shared/svg.js, rangeLabel / dayHeader / daysLoggedCaption
  from shared/date.js, icon() / glyph() from shared/icon.js. Hand-written
  specimens stop tracking the code they are supposed to be reviewing the moment
  it changes; only the primitives with no emitter at all (.more, .seg, the
  form controls, the table, goal-progress' weight row) are written out here.

  ONE LIVE STRIP. "The whole card" at the top is nutrition-summary's card,
  built exactly the way that template builds it, and it is the only thing on
  the page that responds to a tap. Every other strip is built with
  `stash: false` (so it cannot overwrite the live card's ctx) and passed
  through inertPanel (so it cannot be operated, announce a state it cannot
  change, or collide with the live card's ids).

  The payload carries `locale` and `water_unit` like any widget's, so
  `?locale=uk` and `?waterUnit=us_fl_oz` in the harness re-render every
  specimen in that language and unit.

  ONE THING IS DEMOTED FROM THE PRODUCTION MARKUP, on purpose: a specimen card's
  `.ctitle` is an <h3>, not the <h1> a shipping widget's card carries. Each
  widget is its own iframe document with exactly one h1; nine of them stacked
  into this one document were nine competing level-1 headings, each nested
  inside the level-2 section holding it, on the page a screen reader browses by
  heading. `.ctitle` is styled by class alone, so the level costs nothing
  visually. The page's own <h1> is the `.gtitle` at the top of `.gal`.

  View it with:  bun run harness   ->  http://localhost:8787/host?widget=component-gallery
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Component Gallery</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/chip.css@*/

            /*@include shared/chart.css@*/

            /*@include shared/form.css@*/

            /*@include shared/table.css@*/

            /* Gallery scaffolding — dev-only page chrome, deliberately unlike
               any widget surface so a shared rule can never be reviewed
               against gallery styling by mistake. Nothing below is a
               primitive; every primitive on this page comes from the partials
               above. */
            .gal {
                display: grid;
                /* minmax(0, 1fr), not the implicit auto column: an auto column
                   is sized by its widest content, so the nowrap preview table
                   would stretch every sibling and scroll the page sideways. */
                grid-template-columns: minmax(0, 1fr);
                gap: 22px;
            }
            .gsec {
                min-width: 0;
            }
            /* The page's own name, and the document's only <h1>. Specimen cards
               keep production markup verbatim except for their heading LEVEL:
               nine widget headers stacked into one document would be nine
               competing level-1s, each nested inside the level-2 section that
               contains it, so the page a screen reader browses by heading had no
               outline at all. `.ctitle` is styled by class alone (base.css), so
               the demotion to <h3> costs nothing visually — do not "restore" it. */
            .gtitle {
                margin: 0;
                font-size: 15px;
                font-weight: 800;
                letter-spacing: -0.02em;
                color: var(--ink);
            }
            .gh {
                margin: 0 0 4px;
                font-family: var(--mono);
                font-size: 10.5px;
                font-weight: 500;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--acc-text);
            }
            .gcap {
                margin: 0 0 10px;
                font-size: 11.5px;
                line-height: 1.45;
                color: var(--ink3);
            }
            .glab {
                font-family: var(--mono);
                font-size: 9.5px;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--ink3);
            }
            .grow {
                display: flex;
                flex-wrap: wrap;
                align-items: flex-start;
                gap: 12px;
            }
            .gitem {
                display: grid;
                justify-items: start;
                gap: 5px;
                min-width: 0;
            }
            /* A FULL-WIDTH specimen. `.gitem` shrinks its content to fit
               (justify-items: start), which is right for a chip and wrong for
               a strip: the tiered rails lay themselves out by VIEWPORT media
               queries, so a strip narrower than the viewport would take the
               four-across rule into a box that cannot hold "187/400 mg" and
               clip it here while production never does. */
            .gstack {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 14px;
            }
            .gwide {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                gap: 5px;
                min-width: 0;
            }
            .ggrid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 12px;
            }
            /* 232px is roughly a chat card's inner width on a phone: it makes
               a 480-unit chart stretch hardest and a header's meta take its
               second row — which is exactly what needs eyeballing. Never a
               strip in here, flat or tiered: both lay their rails out by
               viewport media queries (see .gstack). */
            .gnarrow {
                width: 232px;
                max-width: 100%;
            }
            .gicons {
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
            }
            .gicon {
                display: grid;
                justify-items: center;
                align-content: start;
                gap: 5px;
                width: 62px;
            }
            /* The stroked UI set is drawn in ink. The filled nutrient glyphs
               need no rule: `.gi` (base.css) reads --c, and each `.gicon` in
               the glyph grid carries its metric's role class — the same
               indirection every tile uses, so a glyph shown here is coloured
               exactly as it is on the card. */
            .gicon .ic {
                color: var(--ink);
            }
        </style>
    </head>
    <body>
        <div class="wrap page" id="root"></div>
        <script>
            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /* shortDate (drawer rows), the header's rangeLabel / dayHeader /
               daysLoggedCaption, and the UTC day arithmetic the calendar x
               axis (calendarSlots, shared/svg.js) steps with. After i18n.js,
               whose T / tpl / plural it reads; before svg.js, whose calendar
               helpers read it when they run. */
            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/svg.js@*/

            /*@include shared/bridge.js@*/

            // macros.js needs these two in scope (same contract as every
            // widget), and this is nutrition-summary's fmt, not a gallery
            // variant: the page is the reference surface, so a figure it
            // prints must be grouped in WIDGET_LOCALE exactly as the shipping
            // card groups it — `toLocaleString()` with no argument reads the
            // host browser's language instead, which is how a German card once
            // printed "2,035" beside "58,2".
            function fmt(n, decimals) {
                const x = Number(n);
                if (n == null || !Number.isFinite(x)) return "0";
                const r = decimals ? x.toFixed(decimals) : Math.round(x);
                try {
                    return Number(r).toLocaleString(WIDGET_LOCALE || "en");
                } catch (_) {
                    return Number(r).toLocaleString();
                }
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // ---- fixtures --------------------------------------------------
            // Deliberately mixed: protein under its floor, carbs past one (a
            // floor passed is not a breach, so no --over), sugar / alcohol /
            // caffeine past their ceilings (which is), fiber short of its own.
            const GOALS = {
                calories: 2200,
                protein_g: 160,
                carbs_g: 220,
                fat_g: 70,
                fiber_g: 30,
                sugar_g: 45,
                alcohol_g: 20,
                caffeine_mg: 400,
                water_ml: 2500,
            };
            const TOTALS = {
                calories: 1980,
                protein_g: 148,
                carbs_g: 231,
                fat_g: 74,
                fiber_g: 24.6,
                sugar_g: 61.3,
                alcohol_g: 27.7,
                caffeine_mg: 470,
                water_ml: 2100,
            };
            const MEALS = [
                {
                    description: "Overnight oats with berries",
                    meal_type: "breakfast",
                    date: null,
                    calories: 420,
                    protein_g: 18,
                    carbs_g: 62,
                    fat_g: 12,
                    fiber_g: 9.4,
                    sugar_g: 24.6,
                    alcohol_g: 0,
                    caffeine_mg: null,
                },
                {
                    description: "Grilled chicken & rice bowl",
                    meal_type: "lunch",
                    date: null,
                    calories: 650,
                    protein_g: 52,
                    carbs_g: 78,
                    fat_g: 16,
                    fiber_g: 6.2,
                    sugar_g: 9.4,
                    alcohol_g: 0,
                    caffeine_mg: null,
                },
                {
                    description: "Salmon with quinoa & veg",
                    meal_type: "dinner",
                    date: null,
                    calories: 900,
                    protein_g: 56,
                    carbs_g: 77,
                    fat_g: 32,
                    fiber_g: 7.9,
                    sugar_g: 14.7,
                    alcohol_g: 27.7,
                    caffeine_mg: null,
                },
                {
                    description: "Double espresso",
                    meal_type: "snack",
                    date: null,
                    calories: 10,
                    protein_g: 0,
                    carbs_g: 1,
                    fat_g: 0,
                    fiber_g: 0,
                    sugar_g: 0,
                    alcohol_g: 0,
                    caffeine_mg: 470,
                },
            ];
            // Eleven contributing rows, so the drawer's 8-row cap AND its
            // "+3 more" tail are both visible. Only the four fields a drawer
            // row reads are filled in; mealList ignores everything else.
            const MEALS_MANY = [
                ["Overnight oats with berries", "breakfast", 62],
                ["Grilled chicken & rice bowl", "lunch", 78],
                ["Salmon with quinoa & veg", "dinner", 77],
                ["Banana", "snack", 27],
                ["Sourdough toast & jam", "breakfast", 44],
                ["Lentil soup", "lunch", 31],
                ["Greek yoghurt with honey", "snack", 19],
                ["Handful of almonds", "snack", 6],
                ["Orange juice", "snack", 26],
                ["Dark chocolate, two squares", "snack", 11],
                ["Double espresso", "snack", 1],
            ].map(([description, meal_type, carbs_g]) => ({
                description,
                meal_type,
                date: null,
                carbs_g,
            }));

            // THE CURRENT YEAR COMES FROM THE CLOCK. rangeLabel prints a year
            // whenever a range does not end in the current one, so a fixture
            // hard-coded to one year shows the no-year case only during that
            // year — from the next January every "this year" specimen would
            // quietly grow a year and the case the Dates table exists to show
            // would vanish without anyone noticing. Only the deliberately
            // past-year and year-crossing cases are literals: those stay past
            // and crossing forever.
            const YEAR = new Date().getFullYear();
            function thisYear(md) {
                return `${YEAR}-${md}`;
            }

            // ---- the live card's payload -----------------------------------
            // A get_nutrition_summary structuredContent, built so every figure
            // on the card can be DERIVED from what sits under it: each day's
            // totals are summed from that day's meals, and the averages from
            // the days, by the server's own rules (rangeAverages and
            // totalsPayloadOf in src/mcp.ts). A reference card whose tile
            // average cannot be reproduced from its own sparkline would read
            // as an averaging bug.
            //
            // [description, meal_type, kcal, protein, carbs, fat, fiber, sugar,
            //  alcohol, caffeine]. Alcohol is ONE coherent case: tracking is on
            // (drink_unit "us"), every meal records its alcohol, most as 0, so
            // a dry day is a recorded 0 and the wine days carry it. Caffeine is
            // null on every meal that is not a coffee — the partial-nutrient
            // case the strip must not average as zero.
            const MEAL_POOL = {
                oats: [
                    "Overnight oats with berries",
                    "breakfast",
                    420,
                    18,
                    62,
                    12,
                    9.4,
                    24.6,
                    0,
                    null,
                ],
                toast: [
                    "Egg & avocado toast",
                    "breakfast",
                    480,
                    24,
                    42,
                    26,
                    5.4,
                    3.1,
                    0,
                    null,
                ],
                bowl: [
                    "Grilled chicken & rice bowl",
                    "lunch",
                    650,
                    52,
                    78,
                    16,
                    6.2,
                    9.4,
                    0,
                    null,
                ],
                wrap: [
                    "Turkey & hummus wrap",
                    "lunch",
                    560,
                    44,
                    58,
                    18,
                    6.9,
                    11.2,
                    0,
                    null,
                ],
                salmon: [
                    "Salmon with quinoa & veg",
                    "dinner",
                    640,
                    55,
                    74,
                    30,
                    7.1,
                    6.8,
                    0,
                    null,
                ],
                burrito: [
                    "Steak burrito",
                    "dinner",
                    720,
                    48,
                    66,
                    30,
                    8.2,
                    7.9,
                    0,
                    null,
                ],
                yogurt: [
                    "Greek yogurt & almonds",
                    "snack",
                    260,
                    22,
                    14,
                    14,
                    1.1,
                    12.6,
                    0,
                    null,
                ],
                shake: [
                    "Protein shake",
                    "snack",
                    210,
                    40,
                    8,
                    3,
                    0.8,
                    4.2,
                    0,
                    null,
                ],
                wine: [
                    "Glass of red wine",
                    "dinner",
                    125,
                    0,
                    4,
                    0,
                    0,
                    0.9,
                    13.9,
                    null,
                ],
                flat: ["Flat white", "snack", 120, 7, 10, 6, 0, 9.8, 0, 130],
                espresso: [
                    "Double espresso",
                    "snack",
                    10,
                    0,
                    1,
                    0,
                    0,
                    0,
                    0,
                    125,
                ],
            };
            const MEAL_FIELDS = [
                "calories",
                "protein_g",
                "carbs_g",
                "fat_g",
                "fiber_g",
                "sugar_g",
                "alcohol_g",
                "caffeine_mg",
            ];
            // Nine logged days in a fourteen-day window: "9 of 14 days
            // logged", five calendar gaps for the sparkline to break across,
            // one day that logged only water (meal_count 0 — a gap on every
            // food series, a reading on water), and caffeine null on three
            // days (the 3rd and 13th had no coffee; the 8th had no meals).
            const SUMMARY_LOG = [
                ["07-02", 2400, ["oats", "bowl", "salmon", "flat"]],
                ["07-03", 1800, ["toast", "wrap", "burrito", "wine"]],
                ["07-05", 2100, ["oats", "bowl", "yogurt", "espresso"]],
                ["07-06", 2600, ["toast", "salmon", "wine", "flat"]],
                ["07-08", 1500, []],
                ["07-09", 2200, ["oats", "wrap", "burrito", "espresso"]],
                ["07-11", 2800, ["shake", "bowl", "salmon", "espresso"]],
                ["07-13", 1900, ["toast", "wrap", "yogurt"]],
                ["07-15", 2300, ["oats", "burrito", "wine", "flat"]],
            ];
            const tenth = (x) => Math.round(x * 10) / 10;
            function mealOf(key, date) {
                const r = MEAL_POOL[key];
                const meal = { description: r[0], meal_type: r[1], date };
                MEAL_FIELDS.forEach((k, i) => (meal[k] = r[2 + i]));
                return meal;
            }
            // One day as the server ships it: the four energy fields are sums
            // (a meal-less day is 0 kcal, and seriesValue is what turns that
            // into a gap), the four limits are null on a day no meal recorded
            // them — the null-not-a-summed-0 rule of get_nutrition_summary's
            // days[].
            function dayOf(date, water_ml, meals) {
                const day = { date, meal_count: meals.length, water_ml };
                MEAL_FIELDS.forEach((k, i) => {
                    const got = meals.filter((m) => m[k] != null);
                    const sum = got.reduce((a, m) => a + m[k], 0);
                    day[k] =
                        i < 4
                            ? k === "calories"
                                ? Math.round(sum)
                                : tenth(sum)
                            : got.length
                              ? tenth(sum)
                              : null;
                });
                return day;
            }
            // rangeAverages (src/mcp.ts): the energy fields and water over
            // EVERY logged day, water-only days included; the four limits
            // over the days that recorded them. Rounded as totalsPayloadOf
            // rounds (whole kcal and ml, tenths otherwise).
            function averagesOf(days) {
                const n = days.length || 1;
                const out = {};
                [
                    "calories",
                    "protein_g",
                    "carbs_g",
                    "fat_g",
                    "water_ml",
                ].forEach((k) => {
                    const s =
                        days.reduce((a, d) => a + (Number(d[k]) || 0), 0) / n;
                    out[k] =
                        k === "calories" || k === "water_ml"
                            ? Math.round(s)
                            : tenth(s);
                });
                ["fiber_g", "sugar_g", "alcohol_g", "caffeine_mg"].forEach(
                    (k) => {
                        const got = days.filter((d) => d[k] != null);
                        out[k] = got.length
                            ? tenth(
                                  got.reduce((a, d) => a + d[k], 0) /
                                      got.length,
                              )
                            : null;
                    },
                );
                return out;
            }
            const SUMMARY = (() => {
                const meals = [];
                const days = SUMMARY_LOG.map(([md, water, keys]) => {
                    const date = thisYear(md);
                    const dm = keys.map((k) => mealOf(k, date));
                    meals.push(...dm);
                    return dayOf(date, water, dm);
                });
                return {
                    start_date: thisYear("07-02"),
                    end_date: thisYear("07-15"),
                    logged_days: days.length,
                    days_in_range: 14,
                    drink_unit: "us",
                    goals: GOALS,
                    averages: averagesOf(days),
                    days,
                    meals,
                };
            })();

            // ---- the trends · weight-trends chart grammar ------------------
            // A week of every series, for the standalone .cwrap + .cfoot
            // charts further down — the grammar weight-trends and the older
            // trends card draw, kept under review beside the focus panel's
            // sparkline that replaces it on nutrition-summary.
            const SERIES = {
                calories: [2180, 1890, 2320, 1760, 2050, 2440, 1980],
                protein_g: [152, 131, 168, 118, 145, 173, 148],
                carbs_g: [244, 198, 265, 186, 221, 279, 231],
                fat_g: [71, 62, 84, 55, 68, 91, 74],
                sugar_g: [58.4, 44.1, 71.2, 39.6, 52.8, 79.3, 61.3],
                alcohol_g: [0, 14, 0, 0, 28, 42, 27.7],
                caffeine_mg: [320, 180, 410, 95, 265, 520, 470],
                fiber_g: [26.1, 21.4, 29.8, 18.9, 24.2, 31.5, 24.6],
                water_ml: [2400, 1900, 2600, 1500, 2200, 2800, 2100],
            };
            const CHART_KEYS = Object.keys(SERIES);
            const SERIES_START = thisYear("07-09");
            const SERIES_END = thisYear("07-15");
            const WEIGHTS = [82.4, 82.1, 81.9, 82.0, 81.6, 81.4, 81.2];
            const WEIGHT_TARGET = 78;
            // Weigh-ins on six of fourteen days: the calendar axis spaces
            // them by date, the line bridges the days in between, and each
            // reading gets its own mark so the bridge cannot pass for daily
            // data (weight-trends' grammar).
            const WEIGH_INS = [
                ["07-02", 82.4],
                ["07-05", 82.0],
                ["07-06", 81.9],
                ["07-09", 81.6],
                ["07-13", 81.3],
                ["07-15", 81.2],
            ];

            // The size each icon actually ships at, so a path that only breaks
            // when it is scaled down shows up here. Keyed by name and iterated
            // from ICONS itself below, so an icon added to the table appears
            // (at 16px) without anyone remembering to add it here.
            const ICON_SIZES = {
                chev: [8, 10],
                x: [12],
                check: [16],
                warn: [16],
                info: [16],
                up: [14],
                down: [14],
                file: [24],
                point: [12],
            };
            // Every size a nutrient glyph ships at: 13 (the old tile size, and
            // glyph()'s default), 17 (a limit tile), 18 (the drawer head), 20
            // (a macro tile and the water bar) — see `.gi` in chip.css.
            const GLYPH_SIZES = [13, 17, 18, 20];

            // ---- chart specimens -------------------------------------------
            // Built from shared/svg.js rather than from copied coordinates, so
            // a change to the geometry shows up on this page.
            // `filled` is the zero-based/data-scaled distinction the two live
            // charts make, carried as a parameter rather than inferred from
            // lo === 0 — weight-trends' floor is a padded minimum that could
            // in principle be 0 too, and the area is only ever legitimate when
            // the caller knows the axis starts at zero (see .carea, chart.css).
            function chartSvg(vals, lo, hi, goal, label, filled) {
                const pts = chPoints(vals, lo, hi);
                const last = pts[pts.length - 1];
                const gy = goal == null ? null : chY(goal, lo, hi).toFixed(1);
                const goalLine =
                    gy == null
                        ? ""
                        : `<line class="cgoal" x1="${CH_PL}" y1="${gy}" x2="${CH_W - CH_PR}" y2="${gy}"></line>`;
                const area = filled ? chAreaMarkup(chArea(pts)) : "";
                return `<svg viewBox="0 0 ${CH_W} ${CH_H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${goalLine}${area}<path class="cline" d="${chPath(pts)}"></path>${chDotMarkup(last[0], last[1])}</svg>`;
            }
            function macroOf(key) {
                return MACROS.find((m) => m.key === key);
            }
            // The svg's name, as trends names it: the calorie chart has a key
            // of its own and every other metric fills {metric}. {range} is a
            // DAY COUNT (7/14/30) in both — a date label there read "…over the
            // last 9–15 Jul days".
            function overRangeLabel(m, days) {
                return m.role === "cal"
                    ? tpl(T.trends.caloriesOverRange, { range: days })
                    : tpl(T.trends.metricOverRange, {
                          metric: macroLabel(m),
                          range: days,
                      });
            }
            // A nutrient total is zero-based: its distance from zero is the
            // thing being read.
            function seriesChart(key) {
                const m = macroOf(key);
                const vals = SERIES[key];
                const hi =
                    Math.max.apply(null, vals.concat([GOALS[key] || 0, 1])) *
                    1.15;
                return chartSvg(
                    vals,
                    0,
                    hi,
                    GOALS[key],
                    overRangeLabel(m, vals.length),
                    true,
                );
            }
            // A figure and its unit for a .cfoot, the unit in its own `.u`:
            // the foot is an uppercase eyebrow and SI symbols are
            // case-sensitive (see `.cfoot .u` in chart.css).
            function footAmount(m, v) {
                return `${esc(macroNum(m, v))} <span class="u">${esc(macroUnit(m))}</span>`;
            }
            // The grammar's three-span foot: first day, the series' average
            // (and goal), last day. Every figure through macroNum/macroUnit,
            // the ONE place a metric's display unit is decided — selecting
            // water here once printed "avg 2,100 ml" under a chip saying
            // "2.1 L". The words are the dictionary's, so ?locale=uk leaves no
            // English inside the card.
            function grammarFoot(key, first, last) {
                const vals = SERIES[key];
                return valuesFoot(
                    key,
                    vals.reduce((a, b) => a + b, 0) / vals.length,
                    GOALS[key],
                    first,
                    last,
                );
            }
            // The same foot for a specimen whose values are not in SERIES. It
            // exists so there is no second foot-builder to drift: two of the
            // charts below printed their average through raw fmt() — no unit
            // span and no metric name — two cells from a foot reading "Calories
            // avg 2,089 kcal", on the section that is supposed to BE the
            // reference for "every figure goes through macroNum / macroUnit".
            // The goal keeps grammarFoot's bare `macroNum` (no unit span): one
            // unit per foot, on the figure that carries it.
            function valuesFoot(key, avg, goal, first, last) {
                const m = macroOf(key);
                const g =
                    goal == null
                        ? ""
                        : ` · <b>${esc(T.nutritionSummary.goal)}</b> ${esc(macroNum(m, goal))}`;
                return `<span>${esc(first)}</span><span><b>${esc(macroLabel(m))} ${esc(T.nutritionSummary.avg)}</b> ${footAmount(m, avg)}${g}</span><span>${esc(last)}</span>`;
            }
            // "Target 78.0 kg" with the unit in its `.u` (see footAmount).
            // The template is filled with a marker and the marker swapped for
            // markup AFTER escaping, so the dictionary string is escaped and
            // the span is not.
            // A visible marker, not a control character: an invisible one in
            // source is one careless edit from silently matching nothing.
            const TARGET_SLOT = "@@value@@";
            function targetFoot(v) {
                return esc(
                    tpl(T.weightTrends.target, { value: TARGET_SLOT }),
                ).replace(
                    TARGET_SLOT,
                    `${esc(macroDecimal(v, 1))} <span class="u">${esc(unitLabel("kg"))}</span>`,
                );
            }
            // The case the area fill exists for, and the one that has to be
            // reviewed whenever the chart changes: a week that barely moves,
            // sitting just under its goal. Before the fill this drew a nearly
            // straight line at 80% height with an empty 60% of the box under it
            // and a dashed goal line ~3 viewBox units above it — two hairlines
            // the eye could not separate.
            function flatChart() {
                const vals = [2030, 2048, 2022, 2041, 2035, 2029, 2045];
                return chartSvg(
                    vals,
                    0,
                    2200 * 1.15,
                    2200,
                    overRangeLabel(macroOf("calories"), vals.length),
                    true,
                );
            }
            // Weight is data-scaled instead: a 1 kg move over an 80 kg baseline
            // is the whole story, and zero-basing it would draw a flat line.
            function weightDomain(vals) {
                let lo = Math.min.apply(null, vals.concat([WEIGHT_TARGET]));
                let hi = Math.max.apply(null, vals.concat([WEIGHT_TARGET]));
                // A week at one weight would otherwise collapse onto a single
                // row of pixels.
                if (hi - lo < 0.2) {
                    lo -= 1;
                    hi += 1;
                }
                const pad = (hi - lo) * 0.18;
                return [lo - pad, hi + pad];
            }
            function weightLabel(from, to, latest) {
                return tpl(T.weightTrends.chartAriaLabel, {
                    from: shortDate(from),
                    to: shortDate(to),
                    latest: `${macroDecimal(latest, 1)} ${unitLabel("kg")}`,
                });
            }
            function weightChart() {
                const [lo, hi] = weightDomain(WEIGHTS);
                return chartSvg(
                    WEIGHTS,
                    lo,
                    hi,
                    WEIGHT_TARGET,
                    weightLabel(
                        SERIES_START,
                        SERIES_END,
                        WEIGHTS[WEIGHTS.length - 1],
                    ),
                    // No area: the floor of this box is a padded minimum, not
                    // zero, so a fill would draw a quantity nobody has.
                    false,
                );
            }
            // weight-trends' calendar grammar: one slot per DAY of the window
            // (calendarSlots), the line BRIDGING the days nobody stepped on
            // the scale — a weight is a sampled quantity, so an unweighed day
            // is a gap in the sampling, not in the weight — and a mark on
            // every reading (chMarksMarkup), so six readings in a fortnight
            // can never pass for fourteen. Paint order as weight-trends
            // paints it: day rules → line → target → marks → last-reading dot.
            //
            // `readings` defaults to WEIGH_INS; pass [] for the range-empty
            // state, which keeps the chart BOX — the day rules and the target —
            // so a range toggle never changes the card's height.
            function bridgedWeightChart(start, end, readings) {
                const days = (readings || WEIGH_INS).map(([md, w]) => ({
                    date: thisYear(md),
                    weight: w,
                }));
                const slots = calendarSlots(days, start, end);
                const [lo, hi] = weightDomain(
                    days.length
                        ? days.map((d) => d.weight)
                        : [WEIGHT_TARGET - 1, WEIGHT_TARGET + 1],
                );
                const all = chPoints(
                    slots.map((s) => (s.day ? s.day.weight : lo)),
                    lo,
                    hi,
                );
                const pts = all.map((p, i) => (slots[i].day ? p : null));
                const read = pts.filter(Boolean);
                const last = read[read.length - 1] || null;
                const gy = chY(WEIGHT_TARGET, lo, hi).toFixed(1);
                const rules = chDayLines(
                    all.filter((_, i) =>
                        hairlineSlot(slots[i], i, slots.length),
                    ),
                );
                const label = days.length
                    ? weightLabel(start, end, days[days.length - 1].weight)
                    : tpl(T.weightTrends.rangeEmpty, { range: slots.length });
                return `<svg viewBox="0 0 ${CH_W} ${CH_H}" preserveAspectRatio="none" role="img" aria-label="${esc(label)}">${rules}<path class="cline" d="${chPath(read)}"></path><line class="cgoal" x1="${CH_PL}" y1="${gy}" x2="${CH_W - CH_PR}" y2="${gy}"></line>${chMarksMarkup(pts)}${last ? chDotMarkup(last[0], last[1]) : ""}</svg>`;
            }

            // ---- sparkline specimens ---------------------------------------
            // A deterministic wobble, not Math.random: two loads of the page
            // must draw the same line, or a before/after comparison is noise.
            function wobble(i) {
                return Math.round(
                    2050 +
                        260 * Math.sin(i * 1.3) +
                        140 * Math.sin(i * 0.37 + 1),
                );
            }
            // Calorie-only days over a window from `start` (or dateless, for
            // the fallback axis), logged where `logged(i)` says so. `kcal(i)`
            // overrides the wobble for the on-goal / over-goal weeks.
            function calDays(start, n, logged, kcal) {
                const out = [];
                for (let i = 0; i < n; i++) {
                    if (!logged(i)) continue;
                    out.push({
                        date: start ? shiftDay(start, i) : null,
                        meal_count: 1,
                        calories: kcal ? kcal(i) : wobble(i),
                    });
                }
                return out;
            }
            // One focus panel with its sparkline, built exactly as
            // nutrition-summary builds its own — focusPanel, then focusApply
            // for a non-calorie metric, then sparkMarkup into `.fspark` — but
            // with sparkMarkup called PURELY rather than through sparkPaint.
            // sparkPaint owns the page's one SPARK state and reads the stashed
            // ctx, both of which belong to the live card. `still`: a specimen
            // is looked at, not entered; the live card is where the draw-in
            // is reviewed.
            //
            // MEALS, not null: nutrition-summary's calorie panel has meals
            // behind it, so it is a <button> — the 26px chevron gutter and the
            // 3:1 --edge border. Built meal-less these specimens were spans at
            // a 9px gutter and the soft --line, which drew the line 17px WIDER
            // than the card they claim to reproduce, on the one section whose
            // whole subject is that line's shape. inertPanel then takes the
            // hooks and the tab stop back off, as every other specimen does.
            function sparkSpecimen(days, start, end, key, goals, vals) {
                const ctx = macroCtxOf(
                    vals || averagesOf(days),
                    goals,
                    undefined,
                    MEALS,
                    {
                        drinkUnit: "us",
                        calLabel: T.nutritionSummary.dailyAvgLoggedDays,
                    },
                );
                const m = macroOf(key);
                const box = document.createElement("div");
                box.innerHTML = focusPanel(macroOf("calories"), ctx);
                const fx = box.firstElementChild;
                if (m.role !== "cal") focusApply(fx, m, ctx, false);
                fx.querySelector(".fspark").innerHTML = sparkMarkup({
                    slots: calendarSlots(days, start, end),
                    key,
                    goals,
                    still: true,
                });
                return `<div class="card c-cal"><div class="strip tiered">${inertPanel(box.innerHTML)}</div></div>`;
            }

            // ---- page helpers ----------------------------------------------
            function sect(title, note, body) {
                return `<section class="gsec"><h2 class="gh">${title}</h2>${note ? `<p class="gcap">${note}</p>` : ""}${body}</section>`;
            }
            function spec(label, body) {
                return `<div class="gitem"><span class="glab">${label}</span>${body}</div>`;
            }
            function wide(label, body) {
                return `<div class="gwide"><span class="glab">${label}</span>${body}</div>`;
            }
            // The open chip is the real emitter's markup with the one attribute
            // a tap would have flipped. A hand-written open chip would stop
            // tracking chipMarkup the moment it changed.
            function opened(html) {
                return html.replace(
                    'aria-expanded="false"',
                    'aria-expanded="true"',
                );
            }
            function pressed(html) {
                return html.replace(
                    'aria-pressed="false"',
                    'aria-pressed="true"',
                );
            }

            // MAKE A SPECIMEN INERT. Everything on this page except the live
            // card passes through here.
            //
            // macroToggle() reads the ONE stashed ctx and resolves its drawer
            // inside the nearest [data-macro-panel]; the delegated handlers
            // match [data-macro], [data-macro-extra], [data-macro-return] and
            // [data-macro-close] document-wide. A specimen carrying any of
            // them is a second strip wired to the first strip's data — the
            // review surface lying about the primitive it exists to review.
            // So every hook the handlers key on is removed, and so is
            // data-widget-foot (see the live card for where the bridge's note
            // goes instead).
            //
            // A SPECIMEN IS LOOKED AT, NOT OPERATED, so nothing in it is a
            // tab stop: every button gets tabindex="-1". A disclosure that can
            // never open, announcing "collapsed" with aria-controls naming a
            // region it will never show, is exactly what "aria-expanded means
            // something expands" forbids, so aria-controls always goes and
            // the state attributes go too — unless `keepState`, for a specimen
            // whose whole point IS the state (an open chip, a pressed toggle),
            // where CSS keys the look on aria-expanded / aria-pressed and the
            // tabindex keeps it out of the keyboard's path. Hover still
            // responds; keyboard focus is reviewed on the live card.
            //
            // Ids get a per-call suffix (and aria-labelledby follows), because
            // an inert drawer's head still carries macro-drawer-name and two
            // regions must never share a name source.
            const INERT_ATTRS = [
                "data-macro",
                "data-macro-panel",
                "data-macro-return",
                "data-macro-hint",
                "data-macro-extra",
                "data-macro-close",
                "data-widget-foot",
                "aria-controls",
            ];
            let INERT_N = 0;
            function inertPanel(html, keepState) {
                const suffix = `g${++INERT_N}`;
                const box = document.createElement("div");
                box.innerHTML = html;
                box.querySelectorAll("[id]").forEach((el) => {
                    const next = `${el.id}-${suffix}`;
                    box.querySelectorAll(
                        `[aria-labelledby="${el.id}"]`,
                    ).forEach((c) => c.setAttribute("aria-labelledby", next));
                    el.id = next;
                });
                const attrs = keepState
                    ? INERT_ATTRS
                    : INERT_ATTRS.concat(["aria-expanded", "aria-pressed"]);
                box.querySelectorAll("*").forEach((el) => {
                    attrs.forEach((a) => el.removeAttribute(a));
                    if (el.tagName === "BUTTON")
                        el.setAttribute("tabindex", "-1");
                });
                return box.innerHTML;
            }

            // Run `fn` with another locale in effect, and ALWAYS put the page's
            // back — the Dates table and the long-locale header visit every
            // locale, and a throw halfway through must not leave the rest of
            // the page (and the live card's later repaints) in Japanese.
            function inLocale(code, fn) {
                const was = WIDGET_LOCALE;
                try {
                    setLocale(code);
                    return fn();
                } finally {
                    setLocale(was);
                }
            }

            // The segmented control has no emitter (trends and weight-trends
            // each write their own), so this copies their markup contract:
            // a named group, a day count per button, aria-pressed. Out of the
            // tab order like every specimen control (see inertPanel).
            function segControl(active) {
                const seg = [7, 14, 30]
                    .map(
                        (d) =>
                            `<button type="button" tabindex="-1" aria-pressed="${d === active}" aria-label="${esc(tpl(T.trends.rangeDaysAriaLabel, { n: d }))}">${d}</button>`,
                    )
                    .join("");
                return `<div class="seg" role="group" aria-label="${esc(T.trends.windowAriaLabel)}">${seg}</div>`;
            }
            // The section-sized disclosure bar, off the strip.
            function moreRow(open, label, value) {
                return `<button class="more" type="button" tabindex="-1" aria-expanded="${open}"><span class="dot c-acc"></span>${esc(label)}<span class="mv">${value}</span><span class="chev">${icon("chev", 12)}</span></button>`;
            }
            // goal-progress' weight row as that template hands it to
            // macroPanel through opts.extra: the role class on the BUTTON, so
            // --c (and the dot, and the open ring) resolve from it; the arrow
            // kept visible ("78.4 → 75.0 kg"), every figure through
            // macroDecimal so a trailing zero survives; the name from the
            // dictionary's weightAria with its own separator in
            // lastLoggedSuffix. inertPanel strips the hooks afterwards.
            function weightRow(i, open) {
                const u = unitLabel("kg");
                const cur = macroDecimal(78.4, 1);
                const tgt = macroDecimal(75, 1);
                const aria = tpl(T.goalProgress.weightAria, {
                    current: `${cur} ${u}`,
                    target: `${tgt} ${u}`,
                    state: tpl(T.goalProgress.toLose, {
                        amount: `${macroDecimal(3.4, 1)} ${u}`,
                    }),
                    metaSuffix: tpl(T.goalProgress.lastLoggedSuffix, {
                        date: dayHeader(thisYear("07-14")),
                    }),
                });
                return `<button class="more mextra c-acc" type="button" data-macro-extra="weight" aria-expanded="${open}" aria-controls="${MACRO_DRAWER_ID}" aria-label="${esc(aria)}" style="--i:${i}"><span class="dot"></span>${esc(T.goalProgress.weightLabel)}<span class="mv">${esc(cur)} → ${esc(tgt)} ${esc(u)}</span><span class="chev">${icon("chev", 10)}</span></button>`;
            }
            function notice(variant, iconName, text) {
                return `<div class="notice${variant ? " notice-" + variant : ""}">${icon(iconName, 16)}<span>${esc(text)}</span></div>`;
            }

            // ---- weight-trends' stand-alone panel ---------------------------
            // Hand-written, like `.more` and `.seg` above: `.focus.solo` has no
            // emitter — weight-trends writes this markup itself — so without a
            // specimen the whole three-line grammar it ships (`.fdelta.fline`,
            // `.fsince`, `.fgive`) could not be reviewed in dark mode, at a
            // phone width or in a long locale. Which is exactly what those
            // classes are for: a translated tail once printed across the
            // panel's border, and the ellipsis that fixed it only fires on a
            // narrow card in de/uk/ja.
            //
            // The two-part line is split AT THE PLACEHOLDER, as weight-trends
            // splits it (figureLine): the figure is its own element and stays
            // whole, the prose either side goes in the class that may give.
            // Split, not assumed to start with the figure — ja writes
            // "{date}から{change}".
            function soloLine(template, key, figure, vars, give) {
                const cls = give ? "fgive" : "fsince";
                const parts = String(template).split(`{${key}}`);
                if (parts.length !== 2) {
                    return `<b class="fdelta fline"><span class="${cls}">${esc(tpl(template, Object.assign({}, vars, { [key]: figure })))}</span></b>`;
                }
                const prose = (s) =>
                    s ? `<span class="${cls}">${esc(tpl(s, vars))}</span>` : "";
                return `<b class="fdelta fline">${prose(parts[0])}<span>${esc(figure)}</span>${prose(parts[1])}</b>`;
            }
            // A line with no figure in it (needTwo, rangeEmpty, noTarget):
            // muted, and still guarded, since a long translation is what has to
            // give here.
            function soloQuiet(text) {
                return `<b class="fdelta fline mute"><span class="fsince">${esc(text)}</span></b>`;
            }
            // The figure slot. The em dash is a placeholder holding the box
            // open in the state with no reading, so it is decorative and marked
            // as such — the panel is a <span>, so its children are announced.
            function soloFigure(v) {
                return v == null
                    ? '<span class="v" aria-hidden="true">—</span>'
                    : `<span class="v">${esc(macroDecimal(v, 1))}<span class="u bare"> ${esc(unitLabel("kg"))}</span></span>`;
            }
            // Line 3: the gap to target, then the target itself in `.fgive` —
            // the reference, and the part that ellipsises first. With no
            // reading the target stands alone, so there is no separator either.
            function soloTargetLine(latest) {
                const kg = unitLabel("kg");
                const target = esc(
                    tpl(T.weightTrends.target, {
                        value: `${macroDecimal(WEIGHT_TARGET, 1)} ${kg}`,
                    }),
                );
                if (latest == null) {
                    return `<b class="fdelta fline"><span class="fgive">${target}</span></b>`;
                }
                const gap = Math.round((latest - WEIGHT_TARGET) * 10) / 10;
                const gapText =
                    gap === 0
                        ? T.weightTrends.atTarget
                        : tpl(
                              gap > 0
                                  ? T.weightTrends.toLose
                                  : T.weightTrends.toGain,
                              {
                                  amount: `${macroDecimal(Math.abs(gap), 1)} ${kg}`,
                              },
                          );
                return `<b class="fdelta fline"><span>${esc(gapText)}</span><span class="fgive"> · ${target}</span></b>`;
            }
            function soloPanel(figure, label, line2, line3, chart) {
                return `<span class="focus c-acc solo"><span class="fmain">${figure}<span class="fmeta"><span class="flabel">${esc(label)}</span>${line2}${line3}</span></span><span class="fspark">${chart}</span></span>`;
            }

            let __widgetApi = null;

            function render(data) {
                // Every specimen with an emitter carries translated strings
                // and water figures, so the locale and the water unit are
                // resolved before anything is built — the same two calls, in
                // the same order, every shipping template makes.
                setLocaleFrom(data, __widgetApi);
                const waterUnit = data && data.water_unit;
                setWaterUnit(waterUnit);
                const pageLocale = WIDGET_LOCALE;

                // WHAT WAS OPEN on the live card, and where focus was, read
                // before the page is thrown away — a host may re-deliver the
                // tool result while a drawer is open. Scoped to the live card,
                // not the page: it is the only strip macroRestore could reopen.
                const was = macroSnapshot(document.getElementById("g-live"));

                const CAL = macroOf("calories");
                const PRO = macroOf("protein_g");
                const SUG = macroOf("sugar_g");
                const ALC = macroOf("alcohol_g");
                const WAT = macroOf("water_ml");
                const CARBS = macroOf("carbs_g");
                const firstDay = shortDate(SERIES_START);
                const lastDay = shortDate(SERIES_END);

                // ---- the live card -------------------------------------------
                // nutrition-summary's card, built the way its render() builds
                // it: the tiered strip, the calorie label naming its
                // denominator, chartKeys from the days, and an onSeries that
                // hands the whole focus panel — figure, ring, colour, line — to
                // the tapped metric. The panel is found inside #g-live, never
                // document-wide: the page holds dozens of `.focus` panels.
                //
                // THE ONLY STASHED STRIP. Every other macroPanel call on this
                // page passes `stash: false`, so the delegated handlers always
                // read this card's ctx — before that flag, the Rail specimen
                // built after this one took the slot and a tap here opened a
                // drawer from a meal-less specimen's data.
                //
                // data-widget-foot is stripped from this strip too, so the
                // bridge's settings note falls back to #root and sits at the
                // very END of the page, under the last specimen — see footSlot
                // in shared/bridge.js. The foot keeps only the tap hint.
                // "2–15 Jul · 9 of 14 days logged", in whatever locale is in
                // effect when it is called (the long-locale header calls it
                // inside inLocale).
                const metaOf = () =>
                    `${rangeLabel(SUMMARY.start_date, SUMMARY.end_date)} · ${daysLoggedCaption(SUMMARY.logged_days, SUMMARY.days_in_range)}`;
                const liveMeta = metaOf();
                const liveStrip = macroPanel(
                    SUMMARY.averages,
                    SUMMARY.goals,
                    undefined,
                    SUMMARY.meals,
                    {
                        tiers: true,
                        drinkUnit: SUMMARY.drink_unit,
                        calLabel: T.nutritionSummary.dailyAvgLoggedDays,
                        chartKeys: chartableKeys(SUMMARY.days),
                        onSeries: (key, isOpen) =>
                            sparkPaint(
                                document.querySelector("#g-live .focus"),
                                isOpen ? key : "calories",
                                isOpen,
                            ),
                    },
                ).replace(" data-widget-foot", "");
                const summaryHead = (meta) =>
                    `<header class="chead"><h3 class="ctitle">${esc(T.nutritionSummary.title)}</h3><span class="cmeta">${esc(meta)}</span></header>`;

                // ---- contexts for the loose chip / drawer specimens ----------
                // Three species of chip: meals + a chart behind it, nothing
                // behind it, and a day where alcohol was tracked but none was
                // drunk.
                const live = macroCtxOf(TOTALS, GOALS, undefined, MEALS, {
                    drinkUnit: "us",
                    chartKeys: CHART_KEYS,
                });
                const flat = macroCtxOf(TOTALS, GOALS, undefined, null, {
                    drinkUnit: "us",
                });
                const dry = macroCtxOf(
                    { ...TOTALS, alcohol_g: 0 },
                    GOALS,
                    undefined,
                    null,
                    { drinkUnit: "us" },
                );
                // The fourth species: chartKeys but NO meals, which is trends'
                // whole rail. macroTappable is true (it drives the chart)
                // while macroHasDetail is false, so tapAttrs emits
                // aria-pressed instead of aria-expanded and chipMarkup drops
                // the chevron.
                const toggles = macroCtxOf(TOTALS, GOALS, undefined, null, {
                    drinkUnit: "us",
                    chartKeys: CHART_KEYS,
                });
                const chipSpec = (html) => inertPanel(html, true);

                // ---- focus panel specimens -----------------------------------
                // Reviewed on the surface it ships on, inside a strip (flat or
                // tiered, since `.strip.tiered` is what splits the meta line
                // into label · delta), inside a card: its selected tint and
                // over state color-mix against --panel, which is not honest on
                // the page ground.
                const heroIn = (vals, goal, o) => {
                    o = o || {};
                    const ctx = macroCtxOf(vals, goal, undefined, o.meals, {
                        drinkUnit: "us",
                        calLabel:
                            o.calLabel || T.nutritionSummary.dailyAvgLoggedDays,
                    });
                    return `<div class="card"><div class="strip${o.tiered ? " tiered" : ""}">${inertPanel(focusPanel(CAL, ctx))}</div></div>`;
                };
                const heroStates = (tiered) =>
                    [
                        [
                            "0% of goal",
                            heroIn({ ...TOTALS, calories: 0 }, GOALS, {
                                tiered,
                            }),
                        ],
                        [
                            "62% of goal",
                            heroIn({ ...TOTALS, calories: 1364 }, GOALS, {
                                tiered,
                            }),
                        ],
                        [
                            "over goal",
                            heroIn({ ...TOTALS, calories: 2480 }, GOALS, {
                                tiered,
                            }),
                        ],
                        ["no goal set", heroIn(TOTALS, null, { tiered })],
                        [
                            "a button (meals behind it)",
                            heroIn(TOTALS, GOALS, { tiered, meals: MEALS }),
                        ],
                    ]
                        .map(([l, b]) =>
                            spec(`${tiered ? "tiered" : "flat"} · ${l}`, b),
                        )
                        .join("");
                // The panel handed another metric, as a tap on the live card
                // hands it one: focusApply in mirror mode — the protein
                // figure, colour, ring and sparkline, the ✕ in the chevron's
                // slot, and a name that says what it is showing.
                // data-macro-return goes with the rest of the hooks.
                const mirrorSpec = (() => {
                    const ctx = macroCtxOf(
                        SUMMARY.averages,
                        GOALS,
                        undefined,
                        SUMMARY.meals,
                        {
                            drinkUnit: "us",
                            calLabel: T.nutritionSummary.dailyAvgLoggedDays,
                            chartKeys: chartableKeys(SUMMARY.days),
                        },
                    );
                    const box = document.createElement("div");
                    box.innerHTML = focusPanel(CAL, ctx);
                    const fx = box.firstElementChild;
                    focusApply(fx, PRO, ctx, true);
                    fx.querySelector(".fspark").innerHTML = sparkMarkup({
                        slots: calendarSlots(
                            SUMMARY.days,
                            SUMMARY.start_date,
                            SUMMARY.end_date,
                        ),
                        key: "protein_g",
                        goals: GOALS,
                        still: true,
                    });
                    return `<div class="card"><div class="strip tiered">${inertPanel(box.innerHTML)}</div></div>`;
                })();

                // ---- sparkline specimens -------------------------------------
                const W7 = thisYear("07-09");
                const onGoal = calDays(
                    W7,

            ${sect(

                `<div class="gstack">

            ${sect(
                "Charts — trends · weight-trends grammar",
                'The standalone .cwrap + .cfoot grammar, each in a 232px column — the width where preserveAspectRatio="none" stretches hardest, so a missing vector-effect shows as a thin vertical segment. A zero-based chart carries the area fill and a data-scaled one must not: compare the first two. The calendar weight chart bridges the days nobody weighed in and marks every reading, so six readings in a fortnight never pass for fourteen.',
                `<div class="grow">

                       "zero-based · goal line · area",
                       `<div class="card gnarrow c-cal"><div class="cwrap c-cal">${seriesChart("calories")}</div><div class="cfoot">${grammarFoot("calories", firstDay, lastDay)}</div></div>`,

                       `<div class="card gnarrow c-acc"><div class="cwrap c-acc">${weightChart()}</div><div class="cfoot"><span>${esc(plural(T.weightTrends.weighIns, WEIGHTS.length))}</span><span>${targetFoot(WEIGHT_TARGET)}</span></div></div>`,

            ${sect(
                "Fields & buttons",

                `<div class="card">
                   <div class="field">

                     <select class="select" id="g-sel">

                     <button class="btn" type="button">${esc(T.importMeals.backToMapping)}</button>
                     <button class="btn btn-danger" type="button">${esc(T.importMeals.chooseAnotherButton)}</button>
                     <button class="btn btn-sm" type="button">${esc(T.importMeals.previewButton)}</button>
                     <button class="btn" type="button" disabled>${esc(T.importMeals.importingEllipsis)}</button>
                   </div>
                 </div>`,
            )}

            ${sect(
                "Drop zone",
                "The .over state is what a file being dragged across it looks like; it cannot be produced by hovering, so it is shown beside the resting one.",
                `<div class="ggrid">
                   ${spec(
                       "resting",
                       `<label class="drop">${icon("file", 24)}<strong>${esc(T.importMeals.dropChoose)}</strong>${esc(T.importMeals.dropOr)}<input type="file" class="drop-input" accept=".csv" /></label>`,
                   )}
                   ${spec(
                       // NO INPUT IN THE STATE SPECIMEN. Both copies carried a

                       // reachable), so Tab hit two file pickers announcing the

                       "file over it",
                       `<div class="drop over">${icon("file", 24)}<strong>${esc(T.importMeals.dropChoose)}</strong>${esc(T.importMeals.dropOr)}</div>`,

            ${sect(
                "Notices — every severity",

                   ${notice("warn", "warn", plural(T.importMeals.noTimeWarning, 12))}

                `<div class="tscroll" role="region" tabindex="0" aria-label="${esc(T.importMeals.previewHeading)}">
                   <table class="tbl">
                     <thead><tr>
                       <th>${esc(T.importMeals.tableLine)}</th><th class="wide">${esc(T.importMeals.tableFood)}</th><th>${esc(T.importMeals.tableWhen)}</th>

                     <tbody>
                       <tr><td class="dim">2</td><td class="wide">Oatmeal (1 cup dry) with banana</td>
                           <td>2026-01-15 08:30</td><td>${esc(mealTypeLabel("breakfast"))}</td><td class="num">300</td>
                           <td><span class="pill pill-ok">create</span></td></tr>
                       <tr><td class="dim">3</td><td class="wide">Rice, cooked</td>
                           <td>2026-01-15 13:00</td><td>${esc(mealTypeLabel("lunch"))}</td><td class="num">400</td>
                           <td><span class="pill pill-dim">duplicate</span></td></tr>
                       <tr class="muted"><td class="dim">4</td><td class="wide">${esc(T.importMeals.noNameFallback)}</td>
                           <td>2026-01-16 12:00</td><td>${esc(mealTypeLabel("breakfast"))}</td><td class="num">250</td>
                           <td><span class="pill pill-warn">noon</span></td></tr>
                       <tr class="bad"><td class="dim">5</td><td class="wide">Soup</td>
                           <td class="dim">2026-13-01</td><td class="dim">—</td><td class="num dim">—</td>
                           <td><span class="pill pill-bad">error</span></td></tr>
                     </tbody>
                   </table>
                   <div class="tmore">${esc(plural(T.importMeals.showingRows, 412, { shown: 4, total: 412 }))}</div>
                 </div>`,
            )}

            ${sect(
                "Icons",
                "Every path in shared/icon.js at the size it ships at — a path that only breaks when it is scaled down breaks here. Listed from ICONS itself, so a new icon appears without anyone updating this section.",
                `<div class="card"><div class="gicons">${Object.keys(ICONS)
                    .map((name) =>
                        (ICON_SIZES[name] || [16])
                            .map(
                                (size) =>
                                    `<span class="gicon">${icon(name, size)}<span class="glab">${name} ${size}</span></span>`,
                            )
                            .join(""),
                    )
                    .join("")}</div></div>`,
            )}

            ${sect(
                "Nutrient glyphs",
                "The filled set, one per metric that names a drawing, at 13 / 17 / 18 / 20px — the sizes a tile, a limit tile, the drawer head and the water bar ship at — each in its own metric's colour through the role class (--c), exactly as a tile colours it. Listed from MACROS, so a new metric's glyph appears here with it.",
                `<div class="card"><div class="gicons">${MACROS.filter(
                    (m) => m.glyph,
                )
                    .map((m) =>
                        GLYPH_SIZES.map(
                            (size) =>
                                `<span class="gicon ${m.color}">${glyph(m.glyph, size)}<span class="glab">${m.glyph} ${size}</span></span>`,
                        ).join(""),
                    )
                    .join("")}</div></div>`,
            )}

          </div>`;

                const liveRoot = document.getElementById("g-live");
                // A new card: its axis, calories, and the draw-in owed again,
                // then the first paint into the panel's `.fspark` — as
                // nutrition-summary does after writing its root.
                sparkReset(
                    calendarSlots(
                        SUMMARY.days,
                        SUMMARY.start_date,
                        SUMMARY.end_date,
                    ),
                    SUMMARY.goals,
                );
                sparkPaint(liveRoot.querySelector(".focus"), "calories", false);

                // The tap hint is the one thing macroPanel builds inline, with
                // no emitter to call — so the specimen is the live strip's own
                // node rather than a copy that would stop tracking it. Taken
                // BEFORE macroRestore, which may hide the original under a
                // reopened drawer, and stripped of data-macro-hint, the hook
                // macroToggle hides it by.
                const ghost = liveRoot.querySelector("[data-macro-hint]");
                const slot = document.getElementById("g-ghost");
                if (ghost && slot) {
                    const copy = ghost.cloneNode(true);
                    copy.removeAttribute("data-macro-hint");
                    copy.hidden = false;
                    slot.replaceWith(copy);
                }

                // LAST, after the first sparkline paint: reopening a tile goes
                // through macroToggle, whose onSeries repaints the panel for
                // that metric. The locale and water unit are the page's again
                // by now (inLocale and the water loop both put them back).
                if (WIDGET_LOCALE !== pageLocale) setLocale(pageLocale);
                macroRestore(liveRoot, was);
            }

            /*@include shared/macros.js@*/

            /* The focus panel's sparkline: seriesValue, chartableKeys,
               sparkMarkup, sparkReset and sparkPaint. After macros.js, whose
               MACROS, focusApply and macroCtx it calls — and included from
               here, never from inside another partial. */
            /*@include shared/spark.js@*/

            initWidget({
                name: "component-gallery",
                // Gallery chrome, not a shipping widget's line, so it stays
                // English; the dictionary's own loading lines are reviewed as
                // a specimen under "Empty states".
                loading:
                    '<div class="empty"><div class="big">🧩</div><div>Loading gallery…</div></div>',
                // No tool feeds the gallery, but the harness sends it a
                // payload carrying locale and water_unit like any widget's
                // (so ?locale= and ?waterUnit= reach it). Anything else still
                // paints the page — a bare { probe: true } included.
                coerce: (p) => {
                    const s = p && (p.structuredContent || p);
                    return {
                        gallery: true,
                        locale: s && s.locale,
                        water_unit: s && s.water_unit,
                    };
                },
                render,
                sample: { gallery: true, locale: "en", water_unit: "l" },
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
