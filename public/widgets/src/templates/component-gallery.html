<!doctype html>
<!--
  Component gallery — DEV ONLY.

  Every shared component on one page so the light/dark and narrow-width passes
  that STYLE_GUIDE.md requires can actually be done. Deliberately registered as
  a WIDGET_TEMPLATES entry but with NO ui:// resource and NO tool, so it is
  assembled and covered by src/widgets.test.ts yet unreachable by any client.

  View it with:  bun run harness   ->  http://localhost:8787/host?widget=component-gallery
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Component Gallery</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/seg.css@*/

            /*@include shared/form.css@*/

            /*@include shared/table.css@*/

            /*@include shared/trend.css@*/

            /*@include shared/ring.css@*/

            /*@include shared/macros.css@*/

            .gal {
                padding: 16px;
                display: grid;
                /* minmax(0, 1fr), not the implicit auto column: an auto column is
                   sized by its widest content, so the nowrap preview table would
                   stretch every sibling card and scroll the page sideways. */
                grid-template-columns: minmax(0, 1fr);
                gap: 18px;
            }
            .gal section {
                padding: 14px;
            }
            .gal h3 {
                margin: 0 0 10px;
                font-size: 11.5px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // macros.js needs these two in scope (same contract as every widget).
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            /*@include shared/macros.js@*/

            // One day's worth of fixture data for the macro components below.
            const GOALS = {
                calories: 2200,
                protein_g: 160,
                carbs_g: 220,
                fat_g: 70,
                fiber_g: 30,
                sugar_g: 45,
                alcohol_g: 20,
                caffeine_mg: 400,
                water_ml: 2500,
            };
            const TOTALS = {
                calories: 1980,
                protein_g: 148,
                carbs_g: 231,
                fat_g: 74,
                fiber_g: 24.6,
                sugar_g: 61.3,
                alcohol_g: 27.7,
                caffeine_mg: 470,
                water_ml: 2100,
            };
            const MEALS = [
                {
                    description: "Overnight oats with berries",
                    meal_type: "breakfast",
                    date: null,
                    calories: 420,
                    protein_g: 18,
                    carbs_g: 62,
                    fat_g: 12,
                    fiber_g: 9.4,
                    sugar_g: 24.6,
                    alcohol_g: 0,
                    caffeine_mg: null,
                },
                {
                    description: "Grilled chicken & rice bowl",
                    meal_type: "lunch",
                    date: null,
                    calories: 650,
                    protein_g: 52,
                    carbs_g: 78,
                    fat_g: 16,
                    fiber_g: 6.2,
                    sugar_g: 9.4,
                    alcohol_g: 0,
                    caffeine_mg: null,
                },
                {
                    description: "Salmon with quinoa & veg",
                    meal_type: "dinner",
                    date: null,
                    calories: 650,
                    protein_g: 56,
                    carbs_g: 77,
                    fat_g: 32,
                    fiber_g: 7.9,
                    sugar_g: 14.7,
                    alcohol_g: 27.7,
                    caffeine_mg: null,
                },
                {
                    description: "Double espresso",
                    meal_type: "snack",
                    date: null,
                    calories: 10,
                    protein_g: 0,
                    carbs_g: 1,
                    fat_g: 0,
                    fiber_g: 0,
                    sugar_g: 0,
                    alcohol_g: 0,
                    caffeine_mg: 470,
                },
            ];
            const CARBS = MACROS.find((m) => m.key === "carbs_g");
            const ALCOHOL = MACROS.find((m) => m.key === "alcohol_g");
            const CAFFEINE = MACROS.find((m) => m.key === "caffeine_mg");
            // The alcohol line in each of its states, including the two that
            // are easy to conflate: null (tracking off → nothing renders) and
            // 0 (a tracked, alcohol-free day → the line stays).
            const alcoholStates = [
                ["over the limit", { alcohol_g: 27.7 }, GOALS],
                ["under the limit", { alcohol_g: 9.9 }, GOALS],
                ["no limit set", { alcohol_g: 13.9 }, null],
                ["tracked, zero", { alcohol_g: 0 }, GOALS],
                [
                    "tracking off (null → renders nothing)",
                    { alcohol_g: null },
                    GOALS,
                ],
            ];
            // The same line without the drink gloss, in milligrams. Caffeine
            // has no opt-in flag, so the null row is the ONLY thing standing
            // between a user who has never logged caffeine and a fabricated
            // "0 mg of 400 mg" — worth being able to look at.
            const caffeineStates = [
                ["over the limit", { caffeine_mg: 470 }, GOALS],
                ["under the limit", { caffeine_mg: 185 }, GOALS],
                ["no limit set", { caffeine_mg: 95 }, null],
                ["recorded, zero", { caffeine_mg: 0 }, GOALS],
                [
                    "a limit of 0 mg — a real limit, and any dose is over it",
                    { caffeine_mg: 95 },
                    { ...GOALS, caffeine_mg: 0 },
                ],
                [
                    "never recorded (null → renders nothing)",
                    { caffeine_mg: null },
                    GOALS,
                ],
            ];

            // A limit cell is a grid item; on its own it needs a one-column
            // grid to sit in. An empty string is the gate having suppressed
            // the cell, which is itself a state worth seeing.
            function limitRow(cell) {
                return cell
                    ? `<div class="mgrid lim" style="--lc:1;--lcw:1;margin-bottom:12px">${cell}</div>`
                    : '<div class="hint" style="opacity:.6;margin-bottom:20px">(nothing)</div>';
            }

            function render() {
                document.getElementById("root").innerHTML = `
          <div class="gal">
            <section class="card">
              <h3>Buttons</h3>
              <div class="actions" style="margin-top:0">
                <button class="btn btn-primary">Import 42 meals</button>
                <button class="btn">Back</button>
                <button class="btn btn-danger">Discard</button>
                <button class="btn btn-sm">Small</button>
                <button class="btn" disabled>Disabled</button>
              </div>
            </section>

            <section class="card">
              <h3>Fields</h3>
              <div class="field">
                <label class="label" for="g-sel">Map column: Calories</label>
                <select class="select" id="g-sel">
                  <option>calories</option>
                  <option>protein_g</option>
                  <option>(ignore this column)</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="g-in">Source app</label>
                <input class="input" id="g-in" placeholder="myfitnesspal" />
                <span class="hint">Used to label rows that have no food name.</span>
              </div>
              <div class="field">
                <label class="label" for="g-bad">Expected row count</label>
                <input class="input invalid" id="g-bad" value="-3" />
                <span class="field-error">Must be a positive whole number.</span>
              </div>
            </section>

            <section class="card">
              <h3>File drop</h3>
              <label class="drop">
                <span class="big">📄</span>
                <strong>Choose your export file</strong><br />or drag it here
                <input type="file" class="drop-input" accept=".csv" />
              </label>
            </section>

            <section class="card">
              <h3>Notices</h3>
              <div class="notice notice-ok"><span>✓</span><span>All 42 rows mapped cleanly.</span></div>
              <div class="notice notice-warn"><span>!</span><span>12 rows had a date but no time; they will be logged at local noon.</span></div>
              <div class="notice notice-error"><span>✕</span><span>expected_row_count is 40 but 42 rows were parsed.</span></div>
              <div class="notice" style="margin-bottom:0"><span>i</span><span>Neutral note on the same surface.</span></div>
            </section>

            <section class="card">
              <h3>Progress &amp; steps</h3>
              <div class="steps">
                <span class="step done"><span class="dot">1</span>File</span><span class="step-sep">→</span>
                <span class="step active"><span class="dot">2</span>Map columns</span><span class="step-sep">→</span>
                <span class="step"><span class="dot">3</span>Preview</span><span class="step-sep">→</span>
                <span class="step"><span class="dot">4</span>Import</span>
              </div>
              <div class="bar"><span style="width:62%"></span></div>
              <div class="hint" style="margin-top:6px">Chunk 5 of 8 — 250 of 400 rows</div>
            </section>

            <section class="card">
              <h3>Segmented control — full and pill scale</h3>
              <div class="seg" style="margin-bottom:12px">
                <button class="seg-btn active">7d</button>
                <button class="seg-btn">14d</button>
                <button class="seg-btn">30d</button>
              </div>
              <div class="seg seg-sm">
                <button class="seg-btn active">7</button>
                <button class="seg-btn">14</button>
                <button class="seg-btn">30</button>
              </div>
            </section>

            <section class="card">
              <h3>Panel shell — the header line every widget opens with</h3>
              <div class="panel">
                <div class="phead">
                  <div class="ptitle">Meal logged</div>
                  <div class="psub">Сир кисломолочний "Сирна Традиція" (President), 300 г · lunch</div>
                  <div class="pmeta kcal">+195 kcal</div>
                </div>
                <div class="chart psec">
                  <div class="chead"><span class="ctitle">Calories / day</span><span class="cmeta">avg 2,035 · goal 2,200</span></div>
                  <svg viewBox="0 0 480 54" role="img" aria-label="Calories per day">
                    <line class="axis" x1="8" y1="48" x2="472" y2="48"></line>
                    <line class="goalline" x1="8" y1="14" x2="472" y2="14"></line>
                    <path d="M8 48 L8 16 L240 30 L472 22 L472 48 Z" fill="var(--calories)" opacity="0.16"></path>
                    <path d="M8 16 L240 30 L472 22" fill="none" stroke="var(--calories)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></path>
                  </svg>
                </div>
              </div>
            </section>

            <section class="card">
              <h3>Macro strip — calorie ring, macro bars, limits row, water line</h3>
              <div class="panel">${macroPanel(TOTALS, GOALS, undefined, MEALS)}</div>
            </section>

            <section class="card">
              <h3>Carbs breakdown (shown open — tap carbs above for the real thing)</h3>
              <div class="panel"><div class="macro-detail">${macroDetailBody(
                  CARBS,
                  macroCtxOf(TOTALS, GOALS, undefined, MEALS),
              )}</div></div>
            </section>

            <section class="card">
              <h3>Alcohol limit cell — every state</h3>
              ${alcoholStates
                  .map(
                      ([caption, vals, goal]) =>
                          `<div class="hint" style="margin-bottom:6px">${caption}</div>${limitRow(
                              macroLimit(ALCOHOL, macroCtxOf(vals, goal)),
                          )}`,
                  )
                  .join("")}
            </section>

            <section class="card">
              <h3>Caffeine limit cell — every state</h3>
              ${caffeineStates
                  .map(
                      ([caption, vals, goal]) =>
                          `<div class="hint" style="margin-bottom:6px">${caption}</div>${limitRow(
                              macroLimit(CAFFEINE, macroCtxOf(vals, goal)),
                          )}`,
                  )
                  .join("")}
            </section>

            <section class="card">
              <h3>Preview table</h3>
              <div class="tscroll">
                <table class="tbl">
                  <thead><tr>
                    <th>Line</th><th class="wide">Description</th><th>When</th>
                    <th>Meal</th><th class="num">kcal</th><th>Status</th>
                  </tr></thead>
                  <tbody>
                    <tr><td class="dim">2</td><td class="wide">Oatmeal (1 cup dry) with banana</td>
                        <td>2026-01-15 08:30</td><td>breakfast</td><td class="num">300</td>
                        <td><span class="pill pill-ok">create</span></td></tr>
                    <tr><td class="dim">3</td><td class="wide">Rice, cooked</td>
                        <td>2026-01-15 13:00</td><td>lunch</td><td class="num">400</td>
                        <td><span class="pill pill-dim">duplicate</span></td></tr>
                    <tr class="muted"><td class="dim">4</td><td class="wide">Breakfast (imported from MyFitnessPal)</td>
                        <td>2026-01-16 12:00</td><td>breakfast</td><td class="num">250</td>
                        <td><span class="pill pill-warn">noon</span></td></tr>
                    <tr class="bad"><td class="dim">5</td><td class="wide">Soup</td>
                        <td class="dim">2026-13-01</td><td class="dim">—</td><td class="num dim">—</td>
                        <td><span class="pill pill-bad">error</span></td></tr>
                  </tbody>
                </table>
                <div class="tmore">Showing 4 of 412 rows</div>
              </div>
            </section>
          </div>`;
            }

            initWidget({
                name: "component-gallery",
                loading: '<div class="empty">Loading gallery…</div>',
                coerce: () => ({ gallery: true }),
                render,
                sample: { gallery: true },
            });

            render();
        </script>
    </body>
</html>
