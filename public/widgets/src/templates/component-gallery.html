<!doctype html>
<!--
  Component gallery — DEV ONLY.

  Every shared component on one page so the light/dark and narrow-width passes
  that STYLE_GUIDE.md requires can actually be done. Deliberately registered as
  a WIDGET_TEMPLATES entry but with NO ui:// resource and NO tool, so it is
  assembled and covered by src/widgets.test.ts yet unreachable by any client.

  View it with:  bun run harness   ->  http://localhost:8787/host?widget=component-gallery
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Component Gallery</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/seg.css@*/

            /*@include shared/form.css@*/

            /*@include shared/table.css@*/

            /*@include shared/ring.css@*/

            /*@include shared/macros.css@*/

            /*@include shared/facts.css@*/

            .gal {
                padding: 16px;
                display: grid;
                /* minmax(0, 1fr), not the implicit auto column: an auto column is
                   sized by its widest content, so the nowrap preview table would
                   stretch every sibling card and scroll the page sideways. */
                grid-template-columns: minmax(0, 1fr);
                gap: 18px;
            }
            .gal section {
                padding: 14px;
            }
            .gal h3 {
                margin: 0 0 10px;
                font-size: 11.5px;
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.06em;
                color: var(--accent);
            }
        </style>
    </head>
    <body>
        <div id="root"></div>
        <script>
            /*@include shared/bridge.js@*/

            // macros.js needs these two in scope (same contract as every widget).
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            /*@include shared/macros.js@*/

            // facts.js needs these two in scope (same contract as ui.js).
            function pct(value, goal) {
                if (value == null || goal == null || Number(goal) <= 0)
                    return null;
                return Math.round((Number(value) / Number(goal)) * 100);
            }
            function clamp(value, min, max) {
                return Math.max(min, Math.min(max, value));
            }

            /*@include shared/facts.js@*/

            // One day's worth of fixture data for the macro components below.
            const GOALS = {
                calories: 2200,
                protein_g: 160,
                carbs_g: 220,
                fat_g: 70,
                fiber_g: 30,
                sugar_g: 45,
                alcohol_g: 20,
                water_ml: 2500,
            };
            const TOTALS = {
                calories: 1980,
                protein_g: 148,
                carbs_g: 231,
                fat_g: 74,
                fiber_g: 24.6,
                sugar_g: 61.3,
                alcohol_g: 27.7,
                water_ml: 2100,
            };
            const MEALS = [
                {
                    description: "Overnight oats with berries",
                    meal_type: "breakfast",
                    date: null,
                    calories: 420,
                    protein_g: 18,
                    carbs_g: 62,
                    fat_g: 12,
                    fiber_g: 9.4,
                    sugar_g: 24.6,
                    alcohol_g: 0,
                },
                {
                    description: "Grilled chicken & rice bowl",
                    meal_type: "lunch",
                    date: null,
                    calories: 650,
                    protein_g: 52,
                    carbs_g: 78,
                    fat_g: 16,
                    fiber_g: 6.2,
                    sugar_g: 9.4,
                    alcohol_g: 0,
                },
                {
                    description: "Salmon with quinoa & veg",
                    meal_type: "dinner",
                    date: null,
                    calories: 650,
                    protein_g: 56,
                    carbs_g: 77,
                    fat_g: 32,
                    fiber_g: 7.9,
                    sugar_g: 14.7,
                    alcohol_g: 27.7,
                },
            ];
            const CARBS = MACROS.find((m) => m.key === "carbs_g");
            const ALCOHOL = MACROS.find((m) => m.key === "alcohol_g");
            // The alcohol line in each of its states, including the two that
            // are easy to conflate: null (tracking off → nothing renders) and
            // 0 (a tracked, alcohol-free day → the line stays).
            const alcoholStates = [
                ["over the limit", { alcohol_g: 27.7 }, GOALS],
                ["under the limit", { alcohol_g: 9.9 }, GOALS],
                ["no limit set", { alcohol_g: 13.9 }, null],
                ["tracked, zero", { alcohol_g: 0 }, GOALS],
                [
                    "tracking off (null → renders nothing)",
                    { alcohol_g: null },
                    GOALS,
                ],
            ];

            function render() {
                document.getElementById("root").innerHTML = `
          <div class="gal">
            <section class="card">
              <h3>Buttons</h3>
              <div class="actions" style="margin-top:0">
                <button class="btn btn-primary">Import 42 meals</button>
                <button class="btn">Back</button>
                <button class="btn btn-danger">Discard</button>
                <button class="btn btn-sm">Small</button>
                <button class="btn" disabled>Disabled</button>
              </div>
            </section>

            <section class="card">
              <h3>Fields</h3>
              <div class="field">
                <label class="label" for="g-sel">Map column: Calories</label>
                <select class="select" id="g-sel">
                  <option>calories</option>
                  <option>protein_g</option>
                  <option>(ignore this column)</option>
                </select>
              </div>
              <div class="field">
                <label class="label" for="g-in">Source app</label>
                <input class="input" id="g-in" placeholder="myfitnesspal" />
                <span class="hint">Used to label rows that have no food name.</span>
              </div>
              <div class="field">
                <label class="label" for="g-bad">Expected row count</label>
                <input class="input invalid" id="g-bad" value="-3" />
                <span class="field-error">Must be a positive whole number.</span>
              </div>
            </section>

            <section class="card">
              <h3>File drop</h3>
              <label class="drop">
                <span class="big">📄</span>
                <strong>Choose your export file</strong><br />or drag it here
                <input type="file" class="drop-input" accept=".csv" />
              </label>
            </section>

            <section class="card">
              <h3>Notices</h3>
              <div class="notice notice-ok"><span>✓</span><span>All 42 rows mapped cleanly.</span></div>
              <div class="notice notice-warn"><span>!</span><span>12 rows had a date but no time; they will be logged at local noon.</span></div>
              <div class="notice notice-error"><span>✕</span><span>expected_row_count is 40 but 42 rows were parsed.</span></div>
              <div class="notice" style="margin-bottom:0"><span>i</span><span>Neutral note on the same surface.</span></div>
            </section>

            <section class="card">
              <h3>Progress &amp; steps</h3>
              <div class="steps">
                <span class="step done"><span class="dot">1</span>File</span><span class="step-sep">→</span>
                <span class="step active"><span class="dot">2</span>Map columns</span><span class="step-sep">→</span>
                <span class="step"><span class="dot">3</span>Preview</span><span class="step-sep">→</span>
                <span class="step"><span class="dot">4</span>Import</span>
              </div>
              <div class="bar"><span style="width:62%"></span></div>
              <div class="hint" style="margin-top:6px">Chunk 5 of 8 — 250 of 400 rows</div>
            </section>

            <section class="card">
              <h3>Segmented control (existing)</h3>
              <div class="seg" style="margin-bottom:0">
                <button class="seg-btn active">7d</button>
                <button class="seg-btn">14d</button>
                <button class="seg-btn">30d</button>
              </div>
            </section>

            <section class="card">
              <h3>Macro panel — hero ring, ring row, water bar, alcohol stat line</h3>
              ${macroPanel(TOTALS, GOALS, undefined, MEALS)}
            </section>

            <section class="card">
              <h3>Carbs disclosure (shown open — tap carbs above for the real thing)</h3>
              <div class="macro-detail" style="margin-bottom:0">${macroDetailBody(
                  CARBS,
                  macroCtxOf(TOTALS, GOALS, undefined, MEALS),
              )}</div>
            </section>

            <section class="card">
              <h3>Alcohol stat line — every state</h3>
              ${alcoholStates
                  .map(
                      ([caption, vals, goal]) =>
                          `<div class="hint" style="margin-bottom:6px">${caption}</div>${
                              macroStat(ALCOHOL, macroCtxOf(vals, goal)) ||
                              '<div class="hint" style="opacity:.6;margin-bottom:20px">(nothing)</div>'
                          }`,
                  )
                  .join("")}
            </section>

            <section class="card">
              <h3>Facts Panel: band, hero, rule cascade</h3>
              ${factsBand("Component gallery", "Facts Panel", "span")}
              <div class="f-body">
                ${factsHero('2,035 <span class="f-hero-unit">kcal</span>', "average per logged day", "6 of 7", "days logged")}
                <div class="f-src">Source · <b>Your logged meals</b></div>
                <div class="f-rule-heavy"></div>
                <div class="f-note" style="margin-top:8px">8px heavy rule above, hairlines between rows, 3px rule below.</div>
                <div class="f-rule-med"></div>
              </div>
            </section>

            <section class="card">
              <h3>Facts Panel: label rows (with bar, over, no target, target-only)</h3>
              <div class="f-body" style="padding-top:0">
                ${factsLabelRow({ name: "Protein", ofText: "of 160 g", valueText: "148 g", value: 148, goal: 160, source: "Your logged meals" })}
                ${factsLabelRow({ name: "Sugar", ofText: "of 45 g limit", valueText: "51 g", value: 51, goal: 45, source: "Your logged meals" })}
                ${factsLabelRow({ name: "Fiber", ofText: "no target set", valueText: "24.6 g", value: 24.6, goal: null, source: "Your logged meals" })}
                ${factsTargetRow({ name: "Calories", ofText: "per day", valueText: "2,200 kcal", source: "Goals you set in Munch" })}
              </div>
            </section>

            <section class="card">
              <h3>Facts Panel: compact rows and more row</h3>
              <div class="f-body" style="padding-top:0">
                ${factsCompactRow({ name: "Aug 5", meta: "4 meals", valueText: "1,905 kcal" })}
                ${factsCompactRow({ name: "Grilled chicken and rice bowl", meta: "lunch", valueText: "650 kcal" })}
                <button class="f-more-row">…and 9 more</button>
              </div>
            </section>

            <section class="card">
              <h3>Facts Panel: sticky action bar (confirm copy lives in the bar)</h3>
              ${factsStickyBar("g-primary", "Log meal", "g-secondary", "Adjust", "<b>Nothing is saved until you tap Log meal.</b> Check the items above first.")}
            </section>

            <section class="card">
              <h3>Facts Panel: state blocks and banners</h3>
              ${factsBand("States", "Facts Panel", "span")}
              ${factsState("empty", "Nothing logged yet", "Your first meal or water entry will appear here.")}
              ${factsState("error", "Could not load this view", "Something went wrong reading your log. Try again in chat.")}
              <div class="f-body" style="padding-top:0">
                ${factsBanner("warn", "<b>Partial — 6 of 7 days logged.</b> Averages cover logged days only.")}
                ${factsBanner("", "A neutral banner on the same surface.")}
              </div>
              <div class="f-foot"><span>Every number traces to its source</span><span>Logged meals · USDA FoodData Central · Open Food Facts</span></div>
            </section>

            <section class="card">
              <h3>Preview table</h3>
              <div class="tscroll">
                <table class="tbl">
                  <thead><tr>
                    <th>Line</th><th class="wide">Description</th><th>When</th>
                    <th>Meal</th><th class="num">kcal</th><th>Status</th>
                  </tr></thead>
                  <tbody>
                    <tr><td class="dim">2</td><td class="wide">Oatmeal (1 cup dry) with banana</td>
                        <td>2026-01-15 08:30</td><td>breakfast</td><td class="num">300</td>
                        <td><span class="pill pill-ok">create</span></td></tr>
                    <tr><td class="dim">3</td><td class="wide">Rice, cooked</td>
                        <td>2026-01-15 13:00</td><td>lunch</td><td class="num">400</td>
                        <td><span class="pill pill-dim">duplicate</span></td></tr>
                    <tr class="muted"><td class="dim">4</td><td class="wide">Breakfast (imported from MyFitnessPal)</td>
                        <td>2026-01-16 12:00</td><td>breakfast</td><td class="num">250</td>
                        <td><span class="pill pill-warn">noon</span></td></tr>
                    <tr class="bad"><td class="dim">5</td><td class="wide">Soup</td>
                        <td class="dim">2026-13-01</td><td class="dim">—</td><td class="num dim">—</td>
                        <td><span class="pill pill-bad">error</span></td></tr>
                  </tbody>
                </table>
                <div class="tmore">Showing 4 of 412 rows</div>
              </div>
            </section>
          </div>`;
            }

            initWidget({
                name: "component-gallery",
                loading: '<div class="empty">Loading gallery…</div>',
                coerce: () => ({ gallery: true }),
                render,
                sample: { gallery: true },
            });

            render();
        </script>
    </body>
</html>
