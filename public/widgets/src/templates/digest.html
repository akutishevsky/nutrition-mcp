<!doctype html>
<!--
  Nutrition digest widget (MCP Apps), shown after get_digest.

  Assembled from shared partials at server startup (see src/widgets.ts): the
  tokens, the base shell, the i18n helpers and the host bridge. Everything
  else — the half-donut calorie gauge, the daily bars, the trend small
  multiples, the nutrient table, the water and weight cards — is digest-local
  and lives in this file, so no other widget changes when it does. Fully
  self-contained: inline CSS + JS, zero network requests.

  Data: structuredContent is minimal (period, dates, averages, goals; frozen
  from the first deploy). Everything the card draws arrives in the result's
  `_meta` under "nutrition-mcp.com/digest" (DigestMeta, src/digest.ts) as codes
  and numbers, and every sentence is assembled here from WIDGET_STRINGS
  (`digest` namespace), so the card renders in the user's language. `_meta`
  is untrusted: each field is read through A()/O()/N()/S(), unknown metric
  keys are dropped, and a host that drops `_meta` gets the averages-only view
  built from structuredContent (fallbackMeta).

  Layout follows the iframe's own width (one media query at 640px): below it,
  one column in the mobile order; above it, the two-column desktop grid. The
  DOM is written in desktop order and `display: contents` plus `order` flatten
  it on a phone. Theme follows data-theme / prefers-color-scheme through the
  shared tokens. Every entry animation (digit reels, the gauge sweep, bars)
  is off under prefers-reduced-motion.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition digest</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* ===== digest ===== */
            .digest {
                display: flex;
                flex-direction: column;
                /* The entry and collapse animations translate sections by a
                   few pixels; clipped here so they never add a scrollbar. */
                overflow: clip;
                padding: 16px 16px 4px;
                font-family:
                    -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            }
            .digest .num {
                font-variant-numeric: tabular-nums;
            }
            .digest button {
                font: inherit;
                color: inherit;
            }
            .digest :where(button.reset) {
                all: unset;
                box-sizing: border-box;
                cursor: pointer;
                text-align: left;
            }
            .digest button.reset:focus-visible,
            .digest .gseg:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
                border-radius: 10px;
            }
            .digest .vh {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
            .digest h2,
            .digest h3 {
                margin: 0;
                font: inherit;
            }
            /* status palette: --sc mark colour, --si text ink */
            .s-over {
                --sc: var(--status-over);
                --si: var(--status-over-ink);
            }
            .s-near {
                --sc: var(--status-near);
                --si: var(--status-near-ink);
            }
            .s-togo {
                --sc: var(--status-togo);
                --si: var(--status-togo-ink);
            }
            .s-ok {
                --sc: var(--status-ok);
                --si: var(--status-ok-ink);
            }
            .s-nr {
                --sc: var(--status-nr);
                --si: var(--status-nr-ink);
            }
            /* metric ink: the metric colour pulled toward the text colour,
               so it reads on the tinted card in either theme */
            .digest [style*="--mc"] {
                --mk: color-mix(in oklab, var(--mc) 72%, var(--text));
            }

            /* ===== reels and keyframes ===== */
            .rl {
                display: inline-block;
                height: 1em;
                line-height: 1;
                overflow: hidden;
                vertical-align: top;
            }
            .rs {
                display: flex;
                flex-direction: column;
                transform: translateY(calc(var(--d) * -1em));
            }
            .rs span {
                display: block;
                height: 1em;
                line-height: 1;
                text-align: center;
            }
            .a-entry .rs {
                animation: reel var(--dur, 1.6s) cubic-bezier(0.22, 1, 0.36, 1)
                    var(--dl, 0s) both;
            }
            @keyframes reel {
                from {
                    transform: translateY(0);
                }
            }
            @keyframes gRise {
                0% {
                    opacity: 0;
                    transform: translateY(14px) scale(0.98);
                    filter: blur(2px);
                }
                60% {
                    opacity: 1;
                    filter: blur(0);
                }
                100% {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
            }
            @keyframes gUp {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }
            }
            @keyframes gIn {
                from {
                    opacity: 0;
                }
            }
            @keyframes gDrop {
                0% {
                    opacity: 0;
                    transform: translateY(-6px);
                }
                100% {
                    opacity: 1;
                    transform: none;
                }
            }
            @keyframes gPop {
                0% {
                    opacity: 0;
                    transform: scale(0.4) rotate(-12deg);
                }
                70% {
                    opacity: 1;
                    transform: scale(1.15) rotate(4deg);
                }
                100% {
                    transform: none;
                }
            }
            @keyframes barUp {
                from {
                    transform: scaleY(0);
                    opacity: 0;
                }
            }
            @keyframes gSweep {
                from {
                    stroke-dasharray: 0 100;
                }
                to {
                    stroke-dasharray: 100 0;
                }
            }
            @keyframes gOut {
                0% {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
                100% {
                    opacity: 0;
                    transform: translateY(-14px) scale(0.95);
                    filter: blur(2px);
                }
            }
            .a-entry .sec {
                animation: gRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
                animation-delay: calc(var(--i) * 90ms + 80ms);
            }
            .a-expand .xsec {
                animation: gRise 0.75s cubic-bezier(0.22, 1, 0.36, 1) both;
                animation-delay: calc((var(--i) - 2) * 50ms + 40ms);
            }
            .gcard.closing .xsec {
                animation: gOut 0.42s cubic-bezier(0.55, 0, 0.75, 0.3) both;
                animation-delay: calc((9 - var(--i)) * 25ms);
            }
            .gcard.closing .collall {
                animation: gOut 0.3s ease both;
            }
            .sb-anim {
                animation: gDrop 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ===== header ===== */
            .hdr {
                display: flex;
                flex-direction: column;
                gap: 4px;
            }
            .eyb2 {
                font-size: 12.5px;
                font-weight: 600;
                color: var(--text-dim);
                letter-spacing: 0.01em;
            }
            .eyb2 .num {
                white-space: nowrap;
            }
            .hdr .t {
                font-size: 17px;
                font-weight: 650;
                line-height: 1.3;
                letter-spacing: -0.01em;
                color: var(--text);
                text-wrap: balance;
                overflow-wrap: anywhere;
            }
            .score {
                align-self: flex-start;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-height: 24px;
                padding: 0 10px 0 9px;
                margin-top: 6px;
                border-radius: 12px;
                background: color-mix(in srgb, var(--sc) 12%, var(--panel));
                color: var(--si);
                font-size: 12.5px;
                font-weight: 750;
            }
            .score::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 4px;
                background: var(--sc);
                flex: none;
            }
            .nogoals {
                font-size: 12.5px;
                color: var(--text-dim);
                margin-top: 6px;
            }

            /* ===== sections ===== */
            .sec {
                margin-top: 24px;
            }
            .hdr.sec {
                margin-top: 0;
            }
            .sh {
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 10px;
                min-height: 34px;
                box-sizing: border-box;
                margin-bottom: 10px;
                padding-bottom: 6px;
                border-bottom: 1px solid var(--panel-border);
            }
            .st {
                font-size: 11.5px;
                font-weight: 750;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            .sm {
                font-size: 12px;
                font-weight: 600;
                color: var(--text-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
            }
            .shh {
                margin: 0;
            }
            .digest .shb {
                display: flex;
                align-items: center;
                gap: 8px;
                width: 100%;
                cursor: pointer;
                border-radius: 0;
            }
            .digest .shb:focus-visible {
                outline-offset: -2px;
                border-radius: 6px;
            }
            .shb .st {
                flex: none;
            }
            .shb .sm {
                flex: 1 1 auto;
                text-align: right;
            }
            .shb:hover .st {
                color: var(--text);
            }
            .schev {
                flex: none;
                color: var(--text-dim);
                transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .schev.open {
                transform: rotate(180deg);
            }
            .sec.folded .sh {
                margin-bottom: 0;
            }
            .sec.folded .sm {
                color: var(--text);
                font-weight: 600;
                white-space: normal;
                overflow: visible;
                line-height: 1.35;
            }

            /* ===== calories: day gauge ===== */
            .gw {
                position: relative;
                width: 100%;
                max-width: 330px;
                margin: 4px auto 0;
                aspect-ratio: 278 / 160;
            }
            .gw > svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                overflow: visible;
            }
            .gtrk {
                stroke: var(--gauge-track);
            }
            .gw.nogoal .gtrk {
                stroke: var(--track);
            }
            .gadd {
                stroke: var(--gauge-fill);
            }
            .gcap {
                stroke: var(--gauge-cap);
                filter: drop-shadow(0 1px 2px rgba(10, 80, 40, 0.35));
            }
            :root[data-theme="dark"] .gcap {
                filter: none;
            }
            @media (prefers-color-scheme: dark) {
                :root:not([data-theme="light"]) .gcap {
                    filter: none;
                }
            }
            .gw.over .gtrk {
                stroke: var(--gauge-over-track);
            }
            .gw.over .gadd {
                stroke: var(--gauge-over-fill);
            }
            .gw svg .gseg {
                cursor: pointer;
                fill: var(--gauge-fill);
                stroke: none;
                transition:
                    opacity 0.3s cubic-bezier(0.22, 1, 0.36, 1),
                    filter 0.2s;
                outline: none;
            }
            .gw.over svg .gseg {
                fill: var(--gauge-over-fill);
            }
            .gw svg .gseg:hover {
                filter: brightness(1.1) saturate(1.1);
            }
            .gw svg .gseg:focus-visible {
                outline: none;
                stroke: var(--focus);
                stroke-width: 3;
            }
            .gw.picked .gseg {
                opacity: 0.4;
            }
            .gw.picked .gseg.on {
                opacity: 1;
                filter: drop-shadow(0 2px 4px rgba(10, 80, 40, 0.35));
            }
            .gw svg .gtrk,
            .gw svg .gcap {
                pointer-events: none;
            }
            .gmask {
                fill: none;
                stroke: #fff;
                stroke-width: 46;
                stroke-linecap: round;
            }
            .a-entry .gmask {
                animation: gSweep 2.4s cubic-bezier(0.22, 1, 0.36, 1) 0.15s both;
            }
            .gpt2 {
                position: absolute;
                display: inline-flex;
                height: 1em;
                font-size: 12.5px;
                font-weight: 800;
                line-height: 1;
                color: var(--gauge-ink);
                white-space: nowrap;
                pointer-events: none;
                z-index: 2;
            }
            .a-entry .gpt2 {
                animation: gIn 0.5s ease 1.4s both;
            }
            .gw.over .gpt2 {
                color: var(--gauge-over-ink);
            }
            .gctr {
                position: absolute;
                left: 20%;
                right: 20%;
                top: 26%;
                bottom: 9%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: flex-end;
                pointer-events: none;
            }
            .gemo {
                font-size: 22px;
                line-height: 1;
                margin-bottom: 3px;
                display: inline-block;
            }
            .a-entry .gemo {
                animation: gPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
            }
            .gnum {
                display: inline-flex;
                height: 1em;
                font-size: 38px;
                font-weight: 800;
                letter-spacing: -0.03em;
                color: var(--text);
                line-height: 1;
            }
            .gw.over .gnum {
                color: var(--over);
            }
            .glab {
                font-size: 13.5px;
                color: var(--text-dim);
                margin-top: 4px;
                white-space: nowrap;
            }
            .gdelta {
                text-align: center;
                font-size: 13.5px;
                color: var(--text-dim);
                margin-top: 10px;
                line-height: 1.45;
            }
            .gdelta b {
                color: var(--text);
                font-weight: 750;
            }
            .gdelta b.over {
                color: var(--over);
            }
            .ghint {
                text-align: center;
                font-size: 12px;
                color: var(--text-dim);
                margin-top: 2px;
            }
            /* popovers (meal piece / day bar) */
            .pop {
                margin-top: 12px;
                border-radius: 16px;
                padding: 4px 12px 10px;
                background: color-mix(
                    in srgb,
                    var(--gauge-fill) 8%,
                    var(--panel)
                );
                box-shadow: inset 0 0 0 2px
                    color-mix(in srgb, var(--gauge-fill) 32%, var(--panel));
                animation: gDrop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
                overflow: hidden;
            }
            .pop.over {
                background: color-mix(
                    in srgb,
                    var(--status-over) 7%,
                    var(--panel)
                );
                box-shadow: inset 0 0 0 2px
                    color-mix(in srgb, var(--status-over) 30%, var(--panel));
            }
            .poph {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto 28px;
                gap: 10px;
                align-items: center;
                padding: 8px 0 6px;
            }
            .bpop .poph {
                grid-template-columns: minmax(0, 1fr) 28px;
            }
            .popt {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }
            .popt b {
                font-size: 14.5px;
                font-weight: 700;
                color: var(--text);
                line-height: 1.3;
                overflow-wrap: anywhere;
            }
            .popt span {
                font-size: 12.5px;
                color: var(--text-dim);
            }
            .popk {
                font-size: 16px;
                font-weight: 800;
                color: var(--text);
                white-space: nowrap;
            }
            .popk small {
                font-size: 12px;
                font-weight: 600;
                color: var(--text-dim);
            }
            .digest .popx {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 14px;
                background: var(--surface-inset);
                color: var(--text);
            }
            .itl {
                background: var(--surface-inset);
                border-radius: 12px;
                padding: 2px 10px;
            }
            .itr {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto auto;
                gap: 10px;
                align-items: baseline;
                padding: 7px 0;
                border-top: 1px solid var(--panel-border);
                font-size: 13px;
                color: var(--text);
            }
            .itr:first-child {
                border-top: none;
            }
            .itr .in {
                overflow-wrap: anywhere;
                line-height: 1.35;
            }
            .itr .ia {
                font-size: 12px;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .itr .ik {
                font-weight: 700;
                white-space: nowrap;
                min-width: 34px;
                text-align: right;
            }
            .bpop .itr {
                grid-template-columns: 42px minmax(0, 1fr) auto;
            }

            /* ===== calories: range bars ===== */
            .chero {
                display: flex;
                align-items: baseline;
                justify-content: center;
                gap: 6px;
                margin-top: 2px;
            }
            .avgw {
                font-size: 15px;
                font-weight: 650;
                color: var(--text-dim);
            }
            .cbig {
                display: inline-flex;
                height: 1em;
                font-size: 44px;
                font-weight: 800;
                letter-spacing: -0.03em;
                line-height: 1;
                color: var(--text);
            }
            .cu {
                font-size: 15px;
                font-weight: 650;
                color: var(--text-dim);
            }
            .csub {
                text-align: center;
                font-size: 13.5px;
                color: var(--text-dim);
                margin-top: 6px;
            }
            .csub b {
                font-weight: 750;
                color: var(--gauge-ink);
            }
            .csub b.over {
                color: var(--over);
            }
            .csub b.lo {
                color: var(--status-togo-ink);
            }
            .ch {
                --ct: var(--gauge-track);
                --cf: var(--gauge-fill);
                --cs: color-mix(in oklab, var(--gauge-fill) 70%, var(--text));
                --co: var(--status-over);
                --cos: color-mix(in oklab, var(--status-over) 70%, var(--text));
                --cl: var(--status-togo);
                --cls: color-mix(in oklab, var(--status-togo) 70%, var(--text));
                --cg: color-mix(in srgb, var(--text) 72%, transparent);
                --bw: 24px;
                --hw: 4px;
                display: flex;
                flex-direction: column;
                margin-top: 14px;
            }
            .ch.ng {
                --ct: var(--track);
                --cf: color-mix(in oklab, var(--calories) 85%, var(--text));
                --cs: color-mix(in oklab, var(--calories) 60%, var(--text));
            }
            .ch.n30 {
                --bw: 6px;
                --hw: 2px;
            }
            .cbody {
                display: grid;
                grid-template-columns: 38px minmax(0, 1fr);
                column-gap: 6px;
            }
            .cyl {
                position: relative;
                height: 150px;
            }
            .cyl span {
                position: absolute;
                right: 0;
                transform: translateY(50%);
                font-size: 11px;
                font-weight: 700;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .cplot {
                position: relative;
                height: 150px;
            }
            .cband {
                position: absolute;
                left: -4px;
                right: -4px;
                background: color-mix(
                    in srgb,
                    var(--gauge-fill) 15%,
                    transparent
                );
                border-radius: 3px;
                pointer-events: none;
            }
            .cgoal {
                position: absolute;
                left: -4px;
                right: -4px;
                height: 0;
                border-top: 2px dashed var(--cg);
                z-index: 3;
                pointer-events: none;
            }
            .cbars {
                position: absolute;
                inset: 0;
                display: grid;
            }
            .digest .cb {
                display: flex;
                justify-content: center;
                height: 100%;
                border-radius: 8px;
                min-width: 0;
            }
            .ctrk {
                position: relative;
                display: block;
                width: var(--bw);
                max-width: 100%;
                height: 100%;
                border-radius: calc(var(--bw) / 2);
                background: var(--ct);
                box-shadow: 0 0 0 var(--hw) var(--ct);
            }
            .ch.n30 .ctrk {
                background: transparent;
                box-shadow: none;
            }
            .cfill {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                min-height: min(var(--bw), 100%);
                border-radius: calc(var(--bw) / 2);
                background: var(--cf);
                transform-origin: 50% 100%;
            }
            .a-entry .cfill {
                animation: barUp 0.9s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .cb.ov .cfill {
                background: var(--co);
            }
            .cb.lo .cfill {
                background: var(--cl);
            }
            .cb.sel .cfill {
                background: var(--cs);
            }
            .cb.sel.ov .cfill {
                background: var(--cos);
            }
            .cb.sel.lo .cfill {
                background: var(--cls);
            }
            .cb.sel .ctrk {
                box-shadow: 0 0 0 var(--hw) var(--cf);
            }
            .cb.sel.ov .ctrk {
                box-shadow: 0 0 0 var(--hw) var(--co);
            }
            .cb.sel.lo .ctrk {
                box-shadow: 0 0 0 var(--hw) var(--cl);
            }
            .ch.n30 .cb.sel .ctrk {
                box-shadow: none;
                background: color-mix(in srgb, var(--cf) 18%, transparent);
            }
            .cb.nr .ctrk {
                background: transparent;
                box-shadow: none;
            }
            .cb.nr .cfill {
                display: none;
            }
            .cb.nr .ctrk::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 0;
                width: 6px;
                height: 6px;
                margin-left: -3px;
                border-radius: 3px;
                background: var(--status-nr);
            }
            .cx {
                display: grid;
                margin: 8px 0 0 44px;
                height: 14px;
                font-size: 11px;
                font-weight: 600;
                color: var(--text-dim);
            }
            .cx span {
                white-space: nowrap;
                justify-self: center;
                line-height: 14px;
            }
            .cx span.last {
                font-weight: 800;
                color: var(--text);
            }
            .ch.n30 .cx span.last {
                justify-self: end;
            }
            .cleg {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4px 12px;
                font-size: 12px;
                color: var(--text-dim);
                margin-top: 12px;
            }
            .cleg span {
                display: inline-flex;
                align-items: center;
                gap: 5px;
                white-space: nowrap;
            }
            .lg {
                display: inline-block;
                width: 10px;
                height: 10px;
                border-radius: 5px;
            }
            .lg.on {
                background: var(--gauge-fill);
            }
            .lg.lo {
                background: var(--status-togo);
            }
            .lg.ov {
                background: var(--status-over);
            }
            .lgz {
                display: inline-block;
                width: 14px;
                height: 10px;
                border-radius: 3px;
                background: color-mix(
                    in srgb,
                    var(--gauge-fill) 20%,
                    var(--panel)
                );
                box-shadow: inset 0 -2px 0 0 var(--cg, var(--text-dim));
                vertical-align: middle;
            }
            .cfoot {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                justify-content: center;
                gap: 2px 6px;
                font-size: 12.5px;
                color: var(--text-dim);
                margin-top: 6px;
                text-align: center;
            }
            .cfoot b {
                color: var(--si);
                font-weight: 800;
            }
            .cprev {
                text-align: center;
                font-size: 12.5px;
                color: var(--text-dim);
                margin-top: 4px;
            }

            /* ===== goals ===== */
            .glist {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .gline {
                display: flex;
                gap: 8px;
                align-items: baseline;
                font-size: 13.5px;
                line-height: 1.4;
                color: var(--text);
                padding: 8px 10px;
                border-radius: 12px;
                background: color-mix(in srgb, var(--sc) 10%, var(--panel));
            }
            .gline b {
                flex: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                min-width: 96px;
                font-size: 12.5px;
                font-weight: 750;
                color: var(--si);
            }
            .gline b::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 4px;
                background: var(--sc);
                flex: none;
            }
            .gline .gn {
                font-weight: 800;
            }
            .rgrp {
                display: flex;
                flex-direction: column;
                gap: 7px;
                margin-top: 10px;
            }
            .rgrp:first-child {
                margin-top: 0;
            }
            .gpill {
                align-self: flex-start;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 24px;
                padding: 0 10px 0 9px;
                border-radius: 12px;
                background: color-mix(in srgb, var(--sc) 12%, var(--panel));
                color: var(--si);
                font-size: 12.5px;
                font-weight: 750;
                white-space: nowrap;
            }
            .gpill::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 4px;
                background: var(--sc);
            }
            .rgi {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
            }
            .gi {
                display: inline-flex;
                align-items: baseline;
                gap: 5px;
                padding: 6px 10px 6px 8px;
                border-radius: 12px;
                background: var(--surface-soft);
                font-size: 13px;
                font-weight: 600;
                color: var(--text);
                white-space: nowrap;
            }
            .gi b {
                font-weight: 800;
                color: var(--si);
            }
            .gi small {
                font-size: 11.5px;
                font-weight: 600;
                color: var(--text-dim);
                margin-left: -3px;
            }
            .gi .ge {
                font-size: 13px;
                align-self: center;
            }
            .nrnote {
                font-size: 12.5px;
                color: var(--text-dim);
                margin-top: 10px;
                line-height: 1.4;
            }
            .sbody > .nrnote:first-child {
                margin-top: 0;
            }
            .gmini {
                display: none;
            }

            /* ===== nutrients table ===== */
            .tbl {
                display: flex;
                flex-direction: column;
            }
            .tr {
                display: grid;
                grid-template-columns: 22px minmax(0, 1fr) auto minmax(
                        78px,
                        auto
                    );
                column-gap: 8px;
                align-items: center;
                box-sizing: border-box;
                min-height: 40px;
                padding: 3px 0;
                border-top: 1px solid var(--panel-border);
            }
            .tbl .tr:first-child {
                border-top: none;
            }
            .te {
                font-size: 16px;
                line-height: 1;
                text-align: center;
            }
            .tn {
                font-size: 13.5px;
                font-weight: 700;
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.25;
            }
            .tv {
                font-size: 12px;
                color: var(--text-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
                text-align: right;
                line-height: 1.25;
            }
            .tv b {
                font-size: 13.5px;
                font-weight: 750;
                color: var(--text);
            }
            .td {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                text-align: right;
                line-height: 1.2;
            }
            .td b {
                font-size: 12.5px;
                font-weight: 750;
                color: var(--si);
                white-space: nowrap;
            }
            .td small {
                font-size: 11px;
                font-weight: 650;
                color: var(--si);
                white-space: nowrap;
            }
            .tr.nr .tn,
            .tr.nr .tv b {
                color: var(--text-mute);
            }
            .tr.nr .td b {
                font-weight: 600;
            }

            /* ===== water & weight cards ===== */
            .cards2 {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .dcard {
                display: flex;
                flex-direction: column;
                justify-content: flex-start;
                gap: 6px;
                padding: 12px;
                border-radius: 18px;
                background: color-mix(in srgb, var(--mc) 10%, var(--panel));
                min-width: 0;
            }
            .ch2 {
                display: flex;
                align-items: center;
                gap: 6px;
                font-size: 13px;
                font-weight: 750;
                color: var(--mk);
            }
            .dbig {
                display: flex;
                align-items: baseline;
                gap: 5px;
                flex-wrap: wrap;
            }
            .bn {
                display: inline-flex;
                height: 1em;
                font-size: 28px;
                font-weight: 800;
                letter-spacing: -0.02em;
                line-height: 1;
                color: var(--text);
            }
            .bu {
                font-size: 13px;
                font-weight: 650;
                color: var(--text-dim);
            }
            .cmeta {
                font-size: 12px;
                color: var(--text-dim);
                line-height: 1.35;
            }
            .cnone {
                font-size: 13px;
                color: var(--text-dim);
                line-height: 1.4;
                padding: 4px 0;
            }
            .wcells {
                display: grid;
                grid-template-columns: repeat(10, minmax(0, 1fr));
                gap: 3px;
                margin-top: auto;
                padding-top: 6px;
            }
            .wc {
                display: block;
                height: 16px;
                border-radius: 4px;
                background: color-mix(in srgb, var(--water) 20%, var(--panel));
            }
            .wc.on {
                background: color-mix(in oklab, var(--water) 80%, var(--text));
            }
            .wc.half {
                background: linear-gradient(
                    to top,
                    color-mix(in oklab, var(--water) 80%, var(--text)) 50%,
                    color-mix(in srgb, var(--water) 20%, var(--panel)) 50%
                );
            }
            .wdots {
                display: grid;
                gap: 3px;
                align-items: center;
                justify-items: center;
                margin-top: auto;
                padding-top: 6px;
            }
            .wdot {
                display: block;
                width: 100%;
                max-width: 13px;
                aspect-ratio: 1;
                border-radius: 50%;
                box-sizing: border-box;
                border: 2px solid
                    color-mix(in oklab, var(--water) 80%, var(--text));
            }
            .wdot.on {
                background: color-mix(in oklab, var(--water) 80%, var(--text));
            }
            .wdot.nl {
                border: none;
                background: var(--status-nr);
                transform: scale(0.45);
            }
            .wrow {
                display: flex;
                align-items: baseline;
                gap: 6px;
                flex-wrap: wrap;
            }
            .wchg {
                font-size: 13px;
                font-weight: 800;
                color: var(--si);
                white-space: nowrap;
            }

            /* ===== meals ===== */
            .mls {
                display: flex;
                flex-direction: column;
            }
            .ml {
                border-top: 1px solid var(--panel-border);
            }
            .ml:first-child {
                border-top: none;
            }
            .digest .mlh {
                display: grid;
                grid-template-columns: 42px minmax(0, 1fr) auto 14px;
                column-gap: 10px;
                align-items: start;
                width: 100%;
                padding: 9px 2px;
            }
            .mt {
                font-size: 13px;
                font-weight: 750;
                color: var(--text);
                padding-top: 1px;
            }
            .mn {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }
            .mnn {
                font-size: 14px;
                font-weight: 650;
                color: var(--text);
                line-height: 1.3;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                overflow-wrap: anywhere;
            }
            .ml.open .mnn {
                display: block;
            }
            .mm {
                font-size: 12px;
                color: var(--text-dim);
            }
            .mk {
                font-size: 14px;
                font-weight: 800;
                color: var(--text);
                white-space: nowrap;
                padding-top: 1px;
            }
            .mk small {
                font-size: 11.5px;
                font-weight: 600;
                color: var(--text-dim);
            }
            .chv {
                color: var(--text-mute);
                margin-top: 3px;
                transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .ml.open .chv {
                transform: rotate(180deg);
                color: var(--text);
            }
            .ml .itl {
                margin: 0 0 10px 52px;
                background: var(--surface-soft);
                animation: gDrop 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
                overflow: hidden;
            }
            .mstats {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .ms {
                display: flex;
                flex-direction: column;
                gap: 3px;
                padding: 10px 12px;
                border-radius: 14px;
                background: var(--surface-soft);
            }
            .ms b {
                font-size: 18px;
                font-weight: 800;
                color: var(--text);
            }
            .msl {
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            .mtimes {
                display: flex;
                flex-direction: column;
                gap: 4px;
                margin-top: 10px;
            }
            .mtl {
                display: flex;
                flex-wrap: wrap;
                gap: 4px 14px;
                font-size: 13px;
                color: var(--text-dim);
            }
            .mtl b {
                color: var(--text);
                font-weight: 750;
            }
            .mlab {
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--text-dim);
                margin-top: 14px;
            }
            .tops {
                display: flex;
                flex-direction: column;
                margin-top: 4px;
            }
            .topr {
                display: grid;
                grid-template-columns: 22px minmax(0, 1fr) auto;
                gap: 8px;
                align-items: baseline;
                padding: 7px 0;
                border-top: 1px solid var(--panel-border);
                font-size: 13.5px;
            }
            .topr:first-child {
                border-top: none;
            }
            .rk {
                font-size: 12px;
                font-weight: 800;
                color: var(--text-dim);
                text-align: center;
            }
            .tnm {
                color: var(--text);
                font-weight: 600;
                line-height: 1.35;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
                overflow: hidden;
                overflow-wrap: anywhere;
            }
            .tnm small {
                font-size: 12px;
                font-weight: 700;
                color: var(--text-dim);
            }
            .topr b {
                font-weight: 800;
                color: var(--text);
                white-space: nowrap;
            }
            .bt {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
                margin-top: 12px;
            }
            .digest .btc {
                display: flex;
                flex-direction: column;
                gap: 3px;
                padding: 10px 12px 11px;
                border-radius: 14px;
                background: color-mix(in srgb, var(--sc) 10%, var(--panel));
                min-width: 0;
            }
            .digest .btc:hover {
                background: color-mix(in srgb, var(--sc) 15%, var(--panel));
            }
            .btl {
                font-size: 11.5px;
                font-weight: 750;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--si);
            }
            .btc b {
                font-size: 14.5px;
                font-weight: 750;
                color: var(--text);
            }
            .bts {
                font-size: 12.5px;
                font-weight: 700;
                color: var(--text);
            }
            .btw {
                font-size: 12px;
                color: var(--text-dim);
                line-height: 1.35;
            }

            /* ===== highlights ===== */
            .hl {
                list-style: none;
                margin: 0;
                padding: 0;
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .hl li {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                font-size: 13.5px;
                line-height: 1.45;
                color: var(--text);
                padding: 10px 12px;
                border-radius: 14px;
                background: var(--surface-soft);
                overflow-wrap: anywhere;
            }
            .hl .hi {
                flex: none;
                font-size: 16px;
                line-height: 1.3;
            }
            .hl b {
                font-weight: 750;
            }

            /* ===== rest of today ===== */
            .rest {
                padding: 12px 14px;
                border-radius: 16px;
                background: var(--surface-soft);
            }
            .kv {
                display: grid;
                grid-template-columns: minmax(0, 1fr);
                column-gap: 16px;
            }
            .kvr {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 10px;
                min-width: 0;
                padding: 9px 0 8px;
                border-top: 1px solid var(--panel-border);
            }
            .kvr:first-child {
                border-top: none;
                padding-top: 2px;
            }
            .kk {
                font-size: 12.5px;
                color: var(--text-dim);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .kk .ke {
                margin-right: 5px;
            }
            .kvv {
                font-size: 16px;
                font-weight: 800;
                line-height: 1.1;
                color: var(--si);
                white-space: nowrap;
            }
            .hint {
                display: flex;
                gap: 8px;
                margin-top: 4px;
                padding-top: 10px;
                border-top: 1px solid var(--panel-border);
                font-size: 13.5px;
                line-height: 1.45;
                color: var(--text);
                overflow-wrap: anywhere;
            }
            .rest > .hint:first-child {
                margin-top: 0;
                padding-top: 0;
                border-top: none;
            }
            .hint .hi {
                flex: none;
            }
            .hint b {
                font-weight: 750;
            }

            /* ===== empty ===== */
            .dempty {
                display: flex;
                gap: 10px;
                align-items: flex-start;
                padding: 12px 14px;
                border-radius: 14px;
                background: var(--surface-soft);
                font-size: 13.5px;
                line-height: 1.5;
                color: var(--text-dim);
            }

            /* ===== collapsed facts, show more, collapse all ===== */
            .gcard {
                display: flex;
                flex-direction: column;
                width: 100%;
            }
            .facts {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
                margin-top: 14px;
            }
            .fact {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 28px;
                padding: 0 11px 0 9px;
                border-radius: 14px;
                background: var(--surface-soft);
                font-size: 13px;
                font-weight: 650;
                color: var(--text);
                white-space: nowrap;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .digest .bigchev {
                display: flex;
                align-self: center;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 40px;
                padding: 0 18px 0 20px;
                margin-top: 16px;
                border-radius: 20px;
                background: var(--pill-bg);
                font-size: 15px;
                font-weight: 800;
                color: var(--text);
                transition:
                    background-color 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .a-entry .bigchev,
            .a-entry .collall {
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.5s both;
            }
            .digest .bigchev:hover {
                background: var(--pill-bg-hover);
            }
            .digest .bigchev:active {
                transform: scale(0.94);
            }
            .nchev {
                transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
                flex: none;
            }
            .nchev.open {
                transform: rotate(180deg);
            }
            .digest .collall {
                display: flex;
                align-self: center;
                align-items: center;
                gap: 8px;
                height: 40px;
                padding: 0 20px;
                margin-top: 22px;
                margin-bottom: 4px;
                border-radius: 20px;
                background: var(--surface-soft);
                color: var(--text);
                font-size: 14.5px;
                font-weight: 700;
                transition:
                    background-color 0.25s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .digest .collall:hover {
                background: var(--track);
            }
            .digest .collall:active {
                transform: scale(0.95);
            }

            /* ===== trends (small multiples) ===== */
            .tgrid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 8px;
            }
            .tcd {
                display: flex;
                flex-direction: column;
                gap: 4px;
                padding: 10px;
                border-radius: 14px;
                background: var(--surface-soft);
                min-width: 0;
                --mkb: color-mix(in oklab, var(--mc) 78%, var(--text));
            }
            .tch {
                display: grid;
                grid-template-columns: auto minmax(0, 1fr);
                column-gap: 5px;
                row-gap: 1px;
                align-items: center;
                min-width: 0;
            }
            .tch .tdir {
                grid-column: 1 / -1;
            }
            .tce {
                font-size: 13px;
                line-height: 1;
            }
            .tcn {
                font-size: 13px;
                font-weight: 750;
                color: var(--text);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
            }
            .tdir {
                font-size: 12px;
                font-weight: 750;
                color: var(--si);
                white-space: nowrap;
            }
            .tcb {
                position: relative;
                height: 50px;
                margin: 6px 0 4px;
            }
            .tcbs {
                position: absolute;
                inset: 0;
                display: grid;
                column-gap: 2px;
                align-items: end;
            }
            .tb {
                position: relative;
                display: block;
                height: 100%;
            }
            .tb i {
                position: absolute;
                bottom: 0;
                display: block;
                border-radius: 2px 2px 1px 1px;
                transform-origin: bottom;
            }
            .a-expand .tb i,
            .sb-anim .tb i {
                animation: barUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
            }
            .tgh {
                left: 0;
                right: 0;
                background: color-mix(in srgb, var(--text) 13%, transparent);
            }
            .tv2 {
                left: 18%;
                right: 18%;
                background: var(--mkb);
            }
            .tb.rep .tv2 {
                background: var(--text);
            }
            .tb.sofar .tv2 {
                background: repeating-linear-gradient(
                    135deg,
                    var(--mkb) 0 2px,
                    transparent 2px 4px
                );
                box-shadow: inset 0 0 0 1.5px var(--mkb);
            }
            .tb.nl::after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 0;
                width: 3px;
                height: 3px;
                margin-left: -1.5px;
                border-radius: 2px;
                background: var(--status-nr);
            }
            .tcg {
                position: absolute;
                left: -2px;
                right: -2px;
                height: 0;
                border-top: 1.5px dashed
                    color-mix(in srgb, var(--text) 70%, transparent);
                z-index: 2;
                pointer-events: none;
            }
            .tcw {
                display: grid;
                grid-template-columns: 26px minmax(0, 1fr);
                column-gap: 4px;
                height: 50px;
                margin: 6px 0 4px;
            }
            .wy {
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                align-items: flex-end;
                font-size: 10.5px;
                font-weight: 700;
                color: var(--text-dim);
                line-height: 1;
                margin: -5px 0;
            }
            .wpl {
                position: relative;
            }
            .wpl svg {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
                overflow: visible;
            }
            .wgr {
                fill: none;
                stroke: var(--panel-border);
                stroke-width: 1;
            }
            .wln {
                fill: none;
                stroke: color-mix(in oklab, var(--weight) 88%, var(--text));
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            .wdt {
                fill: none;
                stroke: color-mix(in oklab, var(--weight) 88%, var(--text));
                stroke-width: 5;
                stroke-linecap: round;
                opacity: 0.55;
            }
            .tgl {
                fill: none;
                stroke: color-mix(in srgb, var(--weight) 45%, transparent);
                stroke-dasharray: 3 3;
            }
            .wend {
                position: absolute;
                width: 11px;
                height: 11px;
                margin: -5.5px 0 0 -5.5px;
                border-radius: 50%;
                box-sizing: border-box;
                background: var(--bg);
                border: 3px solid

            /* ===== layout: phone order (one column) ===== */

                .dB .cards2 .dcard {
                    display: grid;
                    grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr);
                    column-gap: 12px;
                    align-items: start;

                .dB .dcard > * {
                    grid-column: 1;
                }
                .dB .dcard > .wcells,
                .dB .dcard > .wdots {
                    grid-column: 2;
                    grid-row: 1 / span 4;

                    margin-top: 0;

                .dB .dcard.tcard {
