            /* ===== reduced motion ===== */
            @media (prefers-reduced-motion: reduce) {
                .digest *,
                .digest *::before,
                .digest *::after {
                    animation: none !important;
                    transition: none !important;
                }
            }
        </style>
    </head>
    <body>
        <div id="root"></div>

        <script>
            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // ---------- constants ----------
            // The _meta key this widget reads (DIGEST_META_KEY in
            // src/widgets.ts). Repeated as a literal because a template
            // cannot import; src/mcp.test.ts checks it is here.
            const DIGEST_KEY = "nutrition-mcp.com/digest";
            // Grams of ethanol per standard drink (src/alcohol.ts).
            const DRINK_G = { us: 14, uk: 7.893 };
            const METRICS = [
                "calories",
                "protein_g",
                "carbs_g",
                "fat_g",
                "fiber_g",
                "sugar_g",
                "added_sugar_g",
                "saturated_fat_g",
                "trans_fat_g",
                "sodium_mg",
                "caffeine_mg",
                "alcohol_g",
                "water_ml",
            ];
            // Each metric's kind once a goal is set (src/digest.ts KIND); only
            // the no-_meta fallback needs it, to label a goal it passes through.
            const KIND = {
                calories: "budget",
                protein_g: "target",
                carbs_g: "target",
                fat_g: "target",
                fiber_g: "target",
                sugar_g: "limit",
                added_sugar_g: "limit",
                saturated_fat_g: "limit",
                trans_fat_g: "none",
                sodium_mg: "limit",
                caffeine_mg: "limit",
                alcohol_g: "limit",
                water_ml: "target",
            };
            const UNIT = {
                calories: "kcal",
                protein_g: "g",
                carbs_g: "g",
                fat_g: "g",
                fiber_g: "g",
                sugar_g: "g",
                added_sugar_g: "g",
                saturated_fat_g: "g",
                trans_fat_g: "g",
                sodium_mg: "mg",
                caffeine_mg: "mg",
                alcohol_g: "g",
                water_ml: "L",
            };
            const EMOJI = {
                calories: "🔥",
                protein_g: "🥩",
                carbs_g: "🍞",
                fat_g: "🥑",
                fiber_g: "🌾",
                sugar_g: "🍬",
                added_sugar_g: "🍭",
                saturated_fat_g: "🧈",
                trans_fat_g: "🍟",
                sodium_mg: "🧂",
                caffeine_mg: "☕",
                alcohol_g: "🍷",
                water_ml: "💧",
                weight: "⚖️",
            };
            const CSSVAR = {
                calories: "calories",
                protein_g: "protein",
                carbs_g: "carbs",
                fat_g: "fat",
                fiber_g: "fiber",
                sugar_g: "sugar",
                added_sugar_g: "added-sugar",
                saturated_fat_g: "saturated",
                trans_fat_g: "trans",
                sodium_mg: "sodium",
                caffeine_mg: "caffeine",
                alcohol_g: "alcohol",
                water_ml: "water",
                weight: "weight",
            };
            const STATUSES = ["over", "near", "togo", "ok", "nr", "none"];

            // ---------- untrusted-input readers ----------
            const A = (x) => (Array.isArray(x) ? x : []);
            const O = (x) =>
                x && typeof x === "object" && !Array.isArray(x) ? x : {};
            const N = (x) =>
                typeof x === "number" && Number.isFinite(x) ? x : null;
            const S = (x) => (typeof x === "string" ? x : "");
            const isKey = (k) => METRICS.includes(k);
            const isTKey = (k) => isKey(k) || k === "weight";
            const keys = (x) => A(x).filter(isKey);

            function esc(s) {
                return String(s == null ? "" : s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }
            // tpl() over an escaped template, with pre-built HTML values.
            function tplH(s, vars) {
                return esc(s).replace(/\{(\w+)\}/g, (_, k) =>
                    vars && vars[k] != null ? vars[k] : "",
                );
            }
            const cap = (x) =>
                x
                    ? x.charAt(0).toLocaleUpperCase(WIDGET_LOCALE) + x.slice(1)
                    : x;

            // ---------- formatting ----------
            function nfmt(v, dec) {
                try {
                    return new Intl.NumberFormat(WIDGET_LOCALE, {
                        minimumFractionDigits: dec,
                        maximumFractionDigits: dec,
                    }).format(v);
                } catch (_) {
                    return v.toFixed(dec);
                }
            }
            const nf0 = (v) => nfmt(Math.round(v), 0);
            let DU = null; // drink unit, null = alcohol tracking off
            let WU = "kg";
            function fmtNum(key, v) {
                if (key === "alcohol_g" && DU) return nfmt(v / DRINK_G[DU], 1);
                const u = UNIT[key];
                if (u === "L") return nfmt(v / 1000, 1);
                if (u === "kcal" || u === "mg") return nf0(v);
                return Math.abs(v) < 10 && Math.abs(v - Math.round(v)) > 0.05
                    ? nfmt(v, 1)
                    : nf0(v);
            }
            function unitOf(key) {
                if (key === "weight") return T.digest.units[WU] || WU;
                if (key === "alcohol_g" && DU) return T.digest.drinkLabels[DU];
                return T.digest.units[UNIT[key]];
            }
            const wu = (key, v) =>
                key === "weight"
                    ? nfmt(v, 1) + " " + unitOf("weight")
                    : fmtNum(key, v) + " " + unitOf(key);
            const label = (k) => T.digest.labels[k] || k;
            const inl = (k) => T.digest.inline[k] || k;
            function lst(arr) {
                try {
                    return new Intl.ListFormat(WIDGET_LOCALE, {
                        type: "conjunction",
                    }).format(arr);
                } catch (_) {
                    return arr.join(", ");
                }
            }
            const SEP = () => T.digest.sep;

            function utc(iso) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(S(iso));
                return m ? Date.UTC(+m[1], +m[2] - 1, +m[3]) : null;
            }
            function dfmt(iso, opts) {
                const t = utc(iso);
                if (t == null) return S(iso);
                try {
                    return new Intl.DateTimeFormat(
                        WIDGET_LOCALE,
                        Object.assign({ timeZone: "UTC" }, opts),
                    ).format(t);
                } catch (_) {
                    return S(iso);
                }
            }
            const dS = (iso) =>
                dfmt(iso, { weekday: "short", day: "numeric", month: "short" });
            const dDM = (iso) => dfmt(iso, { day: "numeric", month: "short" });
            const dWD = (iso) => dfmt(iso, { weekday: "short" });
            function dRange(a, b) {
                const ta = utc(a);
                const tb = utc(b);
                if (ta == null || tb == null) return dDM(a) + " – " + dDM(b);
                try {
                    const f = new Intl.DateTimeFormat(WIDGET_LOCALE, {
                        day: "numeric",
                        month: "short",
                        timeZone: "UTC",
                    });
                    if (f.formatRange) return f.formatRange(ta, tb);
                } catch (_) {}
                return dDM(a) + " – " + dDM(b);
            }
            function tm(hhmm) {
                const m = /^(\d{2}):(\d{2})$/.exec(S(hhmm));
                if (!m) return S(hhmm);
                try {
                    return new Intl.DateTimeFormat(WIDGET_LOCALE, {
                        hour: "2-digit",
                        minute: "2-digit",
                        hourCycle: "h23",
                        timeZone: "UTC",
                    }).format(Date.UTC(2000, 0, 1, +m[1], +m[2]));
                } catch (_) {
                    return S(hhmm);
                }
            }
            const REDUCED = () => {
                try {
                    return window.matchMedia("(prefers-reduced-motion: reduce)")
                        .matches;
                } catch (_) {
                    return false;
                }
            };

            // Odometer digits: every digit rolls to its value, the first
            // stopping at `first` of the roll and later ones spread after
            // it. A 0 rolls to the strip's trailing 0 so it moves too.
            function reels(str, first) {
                const digits = (str.match(/[0-9]/g) || []).length;
                const step = digits > 1 ? (1 - first) / (digits - 1) : 0;
                let di = 0;
                let out = "";
                for (const ch of str) {
                    if (!/[0-9]/.test(ch)) {
                        out += "<span>" + esc(ch) + "</span>";
                        continue;
                    }
                    const stop = Math.min(first + step * di++, 1);
                    const d = +ch === 0 ? 10 : +ch;
                    out +=
                        '<span class="rl"><span class="rs" style="--d:' +
                        d +
                        ";--dur:" +
                        (2.6 * stop).toFixed(2) +
                        's">' +
                        "<span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span>";
                }
                return out;
            }
            const chev = (cls) =>
                '<svg class="' +
                cls +
                '" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M6 9l6 6 6-6"/></svg>';
            const XICON =
                '<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

            // ---------- state ----------
            let API = null;
            let ST = null;
            function freshState(data, d) {
                return {
                    data,
                    d,
                    level: 0,
                    fold: {},
                    gm: null,
                    mo: null,
                    bar: null,
                    closing: false,
                    anim: "entry",
                    animFold: null,
                    focus: null,
                };
            }

            // ---------- payload ----------
            // The averages-only view when a host dropped `_meta`: the same
            // shape, built from the frozen structuredContent. Goals pass
            // through with their kind, but nothing gets a status (no met or
            // over claims), and html() draws only what this can back: the
            // header, calories, the nutrient table and water — never goals,
            // trends, weight, meals or highlights, whose empty defaults would
            // read as facts ("No weigh-ins yet", "Not enough logged days").
            function fallbackMeta(data) {
                const av = O(data.averages);
                const gl = O(data.goals);
                const day =
                    data.period === "today" || data.period === "yesterday";
                const metrics = METRICS.filter(
                    (k) => k !== "alcohol_g" || N(av.alcohol_g) != null,
                ).map((k) => ({
                    key: k,
                    kind: N(gl[k]) != null ? KIND[k] : "none",
                    value: N(av[k]),
                    goal: N(gl[k]),
                    status: N(av[k]) == null ? "nr" : "none",
                    recorded_days: 0,
                    met_days: 0,
                    over_days: 0,
                }));
                const logged = N(data.logged_days) || 0;
                return {
                    v: 1,
                    fallback: true,
                    period: S(data.period),
                    mode: day ? "day" : "range",
                    start_date: S(data.start_date),
                    end_date: S(data.end_date),
                    as_of: null,
                    days_in_range: N(data.days_in_range) || 1,
                    logged_days: logged,
                    has_data: logged > 0,
                    has_goals: data.goals != null,
                    sparse: false,
                    drink_unit: null,
                    weight_unit: "kg",
                    metrics,
                    score: null,
                    verdict: null,
                    not_recorded: [],
                    partial: [],
                    groups: {},
                    calories: {
                        value: N(av.calories),
                        goal: N(gl.calories),
                        status: "none",
                    },
                    days: [],
                    trends: {},
                    water: {
                        value_ml: N(av.water_ml),
                        goal_ml: N(gl.water_ml),
                    },
                    weight: {},
                    meals: [],
                    habits: null,
                    highlights: [],
                    rest: null,
                };
            }
            function readMeta(meta, data) {
                const m = O(meta)[DIGEST_KEY];
                if (
                    !m ||
                    typeof m !== "object" ||
                    m.v !== 1 ||
                    (m.mode !== "day" && m.mode !== "range") ||
                    !Array.isArray(m.metrics)
                )
                    return fallbackMeta(data);
                return m;
            }

            // ---------- derived ----------
            function ctx() {
                const d = ST.d;
                const isDay = d.mode === "day";
                const isToday = S(d.period) === "today";
                const rows = A(d.metrics)
                    .map(O)
                    .filter((r) => isKey(r.key))
                    .filter((r) => r.key !== "alcohol_g" || DU);
                const R = {};
                for (const r of rows) R[r.key] = r;
                return {
                    d,
                    isDay,
                    isRange: !isDay,
                    isToday,
                    past: !isToday,
                    rows,
                    R,
                    n: N(d.days_in_range) || 1,
                    logged: N(d.logged_days) || 0,
                };
            }
            const stCls = (st) =>
                "s-" +
                (st === "over" || st === "near" || st === "togo" || st === "ok"
                    ? st
                    : "nr");

            // ---------- header ----------
            function verdictText(c) {
                const V = T.digest.verdict;
                const out = [];
                for (const p0 of A(c.d.verdict)) {
                    const p = O(p0);
                    const ks = keys(p.keys);
                    switch (p.c) {
                        case "cal_over":
                            out.push(c.past ? V.calOverPast : V.calOverToday);
                            break;
                        case "cal_on_track":
                            out.push(V.calOnTrack);
                            break;
                        case "cal_on_target":
                            out.push(V.calOnTarget);
                            break;
                        case "cal_just_under":
                            out.push(V.calJustUnder);
                            break;
                        case "cal_under":
                            out.push(V.calUnder);
                            break;
                        case "cal_mostly_on_target":
                            out.push(V.calMostly);
                            break;
                        case "cal_over_most":
                            out.push(V.calOverMost);
                            break;
                        case "cal_under_most":
                            out.push(V.calUnderMost);
                            break;
                        case "cal_some":
                            out.push(V.calSome);
                            break;
                        case "over":
                            if (!ks.length) break;
                            out.push(
                                ks.length <= 2
                                    ? tpl(c.past ? V.overPast : V.overToday, {
                                          list: lst(ks.map(inl)),
                                      })
                                    : plural(V.limitsOver, ks.length),
                            );
                            break;
                        case "short":
                            if (!ks.length) break;
                            out.push(
                                ks.length <= 2
                                    ? tpl(c.past ? V.shortPast : V.shortToday, {
                                          list: lst(ks.map(inl)),
                                      })
                                    : plural(
                                          c.past
                                              ? V.targetsShortPast
                                              : V.targetsShortToday,
                                          ks.length,
                                      ),
                            );
                            break;
                        case "all_met":
                            out.push(c.past ? V.allMetPast : V.allMetToday);
                            break;
                        case "no_miss":
                            out.push(V.noMiss);
                            break;
                        case "trend":
                            if (!isTKey(p.key)) break;
                            if (p.key === "alcohol_g" && !DU) break;
                            out.push(
                                tpl(p.dir === "rising" ? V.rising : V.falling, {
                                    label: inl(p.key),
                                }),
                            );
                            break;
                        case "logged":
                            out.push(
                                tpl(V.logged, {
                                    n: N(p.n) || 0,
                                    of: N(p.of) || 0,
                                }),
                            );
                            break;
                        case "miss":
                            if (!isKey(p.key)) break;
                            out.push(
                                tpl(
                                    p.kind === "target"
                                        ? V.missTarget
                                        : V.missLimit,
                                    { label: inl(p.key) },
                                ),
                            );
                            break;
                    }
                }
                return out.length ? cap(out.join(SEP())) : "";
            }
            function titleText(c) {
                const D = T.digest;
                if (!c.d.has_data) {
                    return c.isToday
                        ? D.emptyTitle.today
                        : c.isDay
                          ? D.emptyTitle.yesterday
                          : tpl(D.emptyTitle.range, { n: c.n });
                }
                const v = verdictText(c);
                if (v) return v;
                const kc = N(O(c.d.calories).value);
                if (c.isDay)
                    return tpl(D.intakeDay, {
                        kcal: nf0(kc || 0),
                        meals: plural(D.mealCount, A(c.d.meals).length),
                    });
                return tpl(D.intakeRange, {
                    kcal: nf0(kc || 0),
                    n: c.logged,
                    of: c.n,
                });
            }
            function header(c) {
                const D = T.digest;
                const range = c.isDay
                    ? c.isToday && c.d.as_of
                        ? tpl(D.daySoFar, {
                              date: dS(c.d.start_date),
                              time: tm(c.d.as_of),
                          })
                        : dS(c.d.start_date)
                    : tpl(D.rangeEnds, {
                          range: dRange(c.d.start_date, c.d.end_date),
                      });
                const eyebrow = tplH(D.eyebrow, {
                    range: '<span class="num">' + esc(range) + "</span>",
                });
                let pill = "";
                const sc = O(c.d.score);
                if (c.d.has_data && c.d.has_goals && N(sc.of)) {
                    const met = N(sc.met) || 0;
                    const of = N(sc.of);
                    let txt = tpl(
                        c.isRange
                            ? D.score.mostly
                            : c.past
                              ? D.score.met
                              : D.score.onTrack,
                        { n: met, of },
                    );
                    if (c.d.sparse) txt = tpl(D.score.partial, { score: txt });
                    const sh = met / of;
                    const cls = c.d.sparse
                        ? "s-nr"
                        : sh >= 0.7
                          ? "s-ok"
                          : sh >= 0.4
                            ? "s-near"
                            : "s-over";
                    pill =
                        '<span class="score num ' +
                        cls +
                        '">' +
                        esc(txt) +
                        "</span>";
                } else if (c.d.has_data && !c.d.has_goals) {
                    pill =
                        '<span class="nogoals">' + esc(D.noGoals) + "</span>";
                }
                return (
                    '<div class="hdr sec" style="--i:0"><span class="eyb2">' +
                    eyebrow +
                    '</span><h2 class="t">' +
                    esc(titleText(c)) +
                    "</h2>" +
                    pill +
                    "</div>"
                );
            }

            // ---------- calories: day gauge ----------
            const SG = { cx: 150, cy: 146, r: 120, w: 14, rc: 4 };
            function sgP(r, p) {
                const an = ((180 + 1.8 * p) * Math.PI) / 180;
                return (
                    (SG.cx + r * Math.cos(an)).toFixed(2) +
                    " " +
                    (SG.cy + r * Math.sin(an)).toFixed(2)
                );
            }
            const sgD = (r) => ((SG.rc / r) * 180) / Math.PI / 1.8;
            function sgPath(p0, p1, rs, re) {
                const Ro = SG.r + SG.w;
                const Ri = SG.r - SG.w;
                const W = SG.w;
                const RC = SG.rc;
                const os = rs ? sgP(Ro, p0) : sgP(Ro, p0 + sgD(Ro));
                let d =
                    "M " +
                    os +
                    " A " +
                    Ro +
                    " " +
                    Ro +
                    " 0 0 1 " +
                    (re ? sgP(Ro, p1) : sgP(Ro, p1 - sgD(Ro)));
                d += re
                    ? " A " + W + " " + W + " 0 0 1 " + sgP(Ri, p1)
                    : " Q " +
                      sgP(Ro, p1) +
                      " " +
                      sgP(Ro - RC, p1) +
                      " L " +
                      sgP(Ri + RC, p1) +
                      " Q " +
                      sgP(Ri, p1) +
                      " " +
                      sgP(Ri, p1 - sgD(Ri));
                d +=
                    " A " +
                    Ri +
                    " " +
                    Ri +
                    " 0 0 0 " +
                    (rs ? sgP(Ri, p0) : sgP(Ri, p0 + sgD(Ri)));
                d += rs
                    ? " A " + W + " " + W + " 0 0 1 " + os
                    : " Q " +
                      sgP(Ri, p0) +
                      " " +
                      sgP(Ri + RC, p0) +
                      " L " +
                      sgP(Ro - RC, p0) +
                      " Q " +
                      sgP(Ro, p0) +
                      " " +
                      os;
                return d + " Z";
            }
            function dayMeals(c) {
                return A(c.d.meals)
                    .map(O)
                    .map((m) => ({
                        time: S(m.time),
                        type: S(m.meal_type),
                        name: S(m.name),
                        kcal: Math.max(N(m.calories) || 0, 0),
                        p: N(m.protein_g) || 0,
                        cb: N(m.carbs_g) || 0,
                        f: N(m.fat_g) || 0,
                        items: Array.isArray(m.items) ? m.items.map(O) : null,
                    }));
            }
            function mealType(t) {
                const k = S(t).toLowerCase();
                return T.digest.meals.types[k] || (t ? cap(t) : "");
            }
            function itemsHtml(items) {
                if (!items || !items.length)
                    return (
                        '<div class="itr"><span class="in">' +
                        esc(T.digest.gauge.totalOnly) +
                        "</span></div>"
                    );
                return items
                    .map((it) => {
                        const a = N(it.amount);
                        const amt =
                            a == null
                                ? ""
                                : nfmt(
                                      a,
                                      Math.abs(a - Math.round(a)) > 0.05
                                          ? 1
                                          : 0,
                                  ) + (S(it.unit) ? " " + S(it.unit) : "");
                        const k = N(it.calories);
                        return (
                            '<div class="itr"><span class="in">' +
                            esc(S(it.name)) +
                            '</span><span class="ia num">' +
                            esc(amt) +
                            '</span><b class="ik num">' +
                            (k == null ? "" : esc(nf0(k))) +
                            "</b></div>"
                        );
                    })
                    .join("");
            }
            function gaugeBlock(c) {
                const D = T.digest;
                const cal = O(c.d.calories);
                const total = Math.max(N(cal.value) || 0, 0);
                const goal =
                    N(cal.goal) && N(cal.goal) > 0 ? N(cal.goal) : null;
                const meals = dayMeals(c);
                const over = goal != null && total > goal + 0.5;
                const gAll = goal
                    ? Math.max(0, Math.min(total / goal, 1)) * 100
                    : 0;
                const pctNum = goal ? Math.round((total / goal) * 100) : 0;
                const pctTxt = nf0(pctNum) + "%";
                const gPL = Math.max(pctTxt.length * 9.5 - 8, 1) / 3.77;
                const gPEnd = Math.min(Math.max(gAll, gPL), 100);
                const gPStart = gPEnd - gPL;
                const gMid = gPStart + gPL / 2;
                // Meal pieces: the arc is cut at meal boundaries kept only
                // when both sides stay wide enough to tap.
                const segs = [];
                let segKept = 0;
                if (goal && meals.length > 1 && gAll > 0) {
                    const GAP = 1.1;
                    const HG = GAP / 2;
                    const MINL = 2 * sgD(SG.r - SG.w) + 0.6;
                    const end = Math.min(gAll, 100);
                    let cum = 0;
                    const bnd = [];
                    meals.slice(0, -1).forEach((m, i) => {
                        cum += m.kcal;
                        bnd.push({ p: Math.min((cum / goal) * 100, 100), i });
                    });
                    const keep = [];
                    let last = 0;
                    for (const x of bnd) {
                        if (x.p - last >= MINL + HG && end - x.p >= MINL + HG) {
                            keep.push(x);
                            last = x.p;
                        }
                    }
                    segKept = keep.length;
                    const edges = [
                        { p: 0, i: -1 },
                        ...keep,
                        { p: end, i: meals.length - 1 },
                    ];
                    for (let s = 0; s < edges.length - 1; s++) {
                        const s0 = s === 0 ? 0 : edges[s].p + HG;
                        const lastS = s === edges.length - 2;
                        let e0 = lastS ? edges[s + 1].p : edges[s + 1].p - HG;
                        if (s > 0 && e0 <= s0) break;
                        e0 = Math.max(
                            e0,
                            s0 + (s === 0 ? 0.01 : 2 * sgD(SG.r - SG.w)),
                        );
                        const from = edges[s].i + 1;
                        const to = edges[s + 1].i;
                        let rep = from;
                        let kc = -1;
                        for (let mi = from; mi <= to; mi++)
                            if (meals[mi].kcal > kc) {
                                kc = meals[mi].kcal;
                                rep = mi;
                            }
                        segs.push({
                            d: sgPath(s0, e0, s === 0, lastS),
                            rep,
                            from,
                            to,
                        });
                    }
                }
                const useSegs =
                    segKept > 0 && segs.length > 0 && segs.length <= 8;
                const picked = useSegs && ST.gm != null;
                const when = c.past
                    ? tpl(D.gauge.onDate, { date: dS(c.d.start_date) })
                    : D.gauge.soFarToday;
                let aria = goal
                    ? tpl(D.gauge.aria, {
                          kcal: nf0(total),
                          goal: nf0(goal),
                          when,
                          pct: nf0(pctNum),
                      })
                    : tpl(D.gauge.ariaNoGoal, { kcal: nf0(total), when });
                if (meals.length)
                    aria +=
                        " " +
                        tpl(D.gauge.ariaMeals, {
                            list: lst(
                                meals.map((m) =>
                                    tpl(D.gauge.ariaMeal, {
                                        name: m.name,
                                        kcal: nf0(m.kcal),
                                    }),
                                ),
                            ),
                        });
                const ARC = "M 30 146 A 120 120 0 0 1 270 146";
                let svg =
                    '<svg viewBox="11 6 278 160" aria-hidden="' +
                    (useSegs ? "false" : "true") +
                    '"><defs><mask id="dgm" maskUnits="userSpaceOnUse" x="-20" y="-40" width="340" height="240"><path d="' +
                    ARC +
                    '" pathLength="100" class="gmask"/></mask></defs>' +
                    '<path d="' +
                    ARC +
                    '" pathLength="100" class="gtrk" style="fill:none;stroke-width:38;stroke-linecap:round"/>' +
                    '<g mask="url(#dgm)">';
                if (gAll > 0 && !useSegs)
                    svg +=
                        '<path d="' +
                        ARC +
                        '" pathLength="100" class="gadd" style="fill:none;stroke-width:28;stroke-linecap:round;stroke-dasharray:' +
                        Math.max(gAll, 0.8).toFixed(2) +
                        ' 100"/>';
                if (useSegs)
                    for (const s of segs) {
                        const on =
                            ST.gm != null && ST.gm >= s.from && ST.gm <= s.to;
                        const m = meals[s.rep];
                        svg +=
                            '<path d="' +
                            s.d +
                            '" class="gseg' +
                            (on ? " on" : "") +
                            '" role="button" tabindex="0" data-act="seg" data-rep="' +
                            s.rep +
                            '" data-fk="seg-' +
                            s.rep +
                            '" aria-pressed="' +
                            on +
                            '" aria-label="' +
                            esc(
                                tpl(D.gauge.segment, {
                                    name: m.name,
                                    kcal: nf0(m.kcal),
                                }),
                            ) +
                            '"/>';
                    }
                if (gAll > 0)
                    svg +=
                        '<path d="' +
                        ARC +
                        '" pathLength="100" class="gcap" style="fill:none;stroke-width:20;stroke-linecap:round;stroke-dasharray:' +
                        gPL.toFixed(2) +
                        " 100;stroke-dashoffset:" +
                        (-gPStart).toFixed(2) +
                        '"/>';
                svg += "</g></svg>";
                const an = ((180 + 1.8 * gMid) * Math.PI) / 180;
                const pill =
                    gAll > 0
                        ? '<span class="gpt2 num" aria-hidden="true" style="left:' +
                          (
                              ((150 + 120 * Math.cos(an) - 11) / 278) *
                              100
                          ).toFixed(2) +
                          "%;top:" +
                          (
                              ((146 + 120 * Math.sin(an) - 6) / 160) *
                              100
                          ).toFixed(2) +
                          "%;transform:translate(-50%,-50%) rotate(" +
                          (270 + 1.8 * gMid).toFixed(1) +
                          'deg)">' +
                          reels(pctTxt, 0.55) +
                          "</span>"
                        : "";
                const ctr =
                    '<div class="gctr" aria-hidden="true"><span class="gemo">🔥</span><span class="gnum num">' +
                    reels(nf0(total), 0.5) +
                    '</span><span class="glab num">' +
                    esc(
                        goal
                            ? tpl(D.gauge.ofGoal, { goal: nf0(goal) })
                            : D.gauge.kcal,
                    ) +
                    "</span></div>";
                const gw =
                    '<div class="gw' +
                    (over ? " over" : "") +
                    (picked ? " picked" : "") +
                    (goal ? "" : " nogoal") +
                    '" role="group" aria-label="' +
                    esc(aria) +
                    '">' +
                    svg +
                    pill +
                    ctr +
                    "</div>";
                // Under the gauge.
                const mealsTxt = esc(plural(D.mealCount, meals.length));
                let delta;
                if (!goal) delta = tplH(D.gauge.mealsOnly, { meals: mealsTxt });
                else if (c.past)
                    delta = tplH(D.gauge.finished, {
                        b:
                            '<b class="' +
                            (over ? "over" : "") +
                            '">' +
                            esc(
                                tpl(
                                    over ? D.gauge.kcalOver : D.gauge.kcalUnder,
                                    {
                                        x: nf0(Math.abs(goal - total)),
                                    },
                                ),
                            ) +
                            "</b>",
                    });
                else
                    delta = tplH(D.gauge.todayLine, {
                        b:
                            '<b class="' +
                            (over ? "over" : "") +
                            '">' +
                            esc(
                                tpl(
                                    over ? D.gauge.kcalOver : D.gauge.kcalLeft,
                                    {
                                        x: nf0(Math.abs(goal - total)),
                                    },
                                ),
                            ) +
                            "</b>",
                        meals: mealsTxt,
                    });
                let out = gw + '<div class="gdelta num">' + delta + "</div>";
                if (useSegs && ST.gm == null)
                    out += '<div class="ghint">' + esc(D.gauge.hint) + "</div>";
                if (useSegs && ST.gm != null && meals[ST.gm]) {
                    const m = meals[ST.gm];
                    const meta = [m.time ? tm(m.time) : "", mealType(m.type)]
                        .filter(Boolean)
                        .join(SEP());
                    const sub = goal
                        ? tpl(D.gauge.popMeta, {
                              meta,
                              pct: nf0((m.kcal / goal) * 100),
                          })
                        : tpl(D.gauge.popMetaNoGoal, { meta });
                    out +=
                        '<div class="pop' +
                        (over ? " over" : "") +
                        '"><div class="poph"><div class="popt"><b>' +
                        esc(m.name) +
                        '</b><span class="num">' +
                        esc(sub) +
                        '</span></div><span class="popk num">' +
                        esc(nf0(m.kcal)) +
                        " <small>" +
                        esc(D.units.kcal) +
                        '</small></span><button type="button" class="reset popx" data-act="closemeal" data-fk="closemeal" aria-label="' +
                        esc(D.gauge.closeMeal) +
                        '">' +
                        XICON +
                        '</button></div><div class="itl">' +
                        itemsHtml(m.items) +
                        "</div></div>";
                }
                return out;
            }

            // ---------- calories: range bars ----------
            function rangeDays(c) {
                return A(c.d.days)
                    .map(O)
                    .map((x) => ({
                        date: S(x.date),
                        logged: x.logged === true,
                        kcal: N(x.calories),
                        n: N(x.meal_count) || 0,
                        status:
                            STATUSES.includes(x.status) ||
                            ["on", "under"].includes(x.status)
                                ? x.status
                                : "nr",
                        water: N(x.water_ml),
                        meals: A(x.meals).map(O),
                    }));
            }
            function rangeBlock(c) {
                const D = T.digest;
                const cal = O(c.d.calories);
                const avg = N(cal.value);
                const goal =
                    N(cal.goal) && N(cal.goal) > 0 ? N(cal.goal) : null;
                const days = rangeDays(c);
                let out =
                    '<div class="chero"><span class="avgw">' +
                    esc(D.range.avg) +
                    '</span><span class="cbig num" aria-hidden="true">' +
                    reels(nf0(avg || 0), 0.5) +
                    '</span><span class="vh">' +
                    esc(nf0(avg || 0)) +
                    '</span><span class="cu">' +
                    esc(D.range.kcalDay) +
                    "</span></div>";
                if (goal && avg != null) {
                    const diff = avg - goal;
                    const txt =
                        Math.abs(diff) < 0.5
                            ? tpl(D.range.rightOn, { goal: nf0(goal) })
                            : tpl(
                                  diff > 0
                                      ? D.range.overGoal
                                      : D.range.underGoal,
                                  {
                                      x: nf0(Math.abs(diff)),
                                      goal: nf0(goal),
                                  },
                              );
                    out +=
                        '<div class="csub num"><b class="' +
                        (diff > 0.5 ? "over" : avg >= 0.9 * goal ? "" : "lo") +
                        '">' +
                        esc(txt) +
                        "</b></div>";
                }
                if (days.length && c.d.has_data) {
                    const vals = days.map((x) => (x.logged ? x.kcal : null));
                    const mx =
                        Math.max(
                            ...vals.filter((x) => x != null),
                            goal || 0,
                            1,
                        ) * 1.12;
                    const n = days.length;
                    let bars = "";
                    days.forEach((x, j) => {
                        const v = vals[j];
                        const miss = v == null;
                        const cls =
                            "cb" +
                            (miss
                                ? " nr"
                                : x.status === "over"
                                  ? " ov"
                                  : x.status === "under"
                                    ? " lo"
                                    : "") +
                            (ST.bar === j ? " sel" : "");
                        const aria = miss
                            ? tpl(D.range.barNone, { date: dS(x.date) })
                            : tpl(
                                  x.status === "over"
                                      ? D.range.barOver
                                      : x.status === "on"
                                        ? D.range.barOn
                                        : x.status === "under"
                                          ? D.range.barUnder
                                          : D.range.barPlain,
                                  { date: dS(x.date), kcal: nf0(v) },
                              );
                        bars +=
                            '<button type="button" class="reset ' +
                            cls +
                            '" data-act="bar" data-j="' +
                            j +
                            '" data-fk="bar-' +
                            j +
                            '" aria-pressed="' +
                            (ST.bar === j) +
                            '" aria-label="' +
                            esc(aria) +
                            '"><span class="ctrk"><span class="cfill" style="height:' +
                            (miss ? 0 : Math.max((v / mx) * 100, 3)).toFixed(
                                1,
                            ) +
                            "%;animation-delay:" +
                            (0.25 + j * (n > 7 ? 0.025 : 0.06)).toFixed(3) +
                            's"></span></span></button>';
                    });
                    const xl = days
                        .map((x, j) => {
                            const show = n <= 7 || (n - 1 - j) % 7 === 0;
                            return (
                                '<span class="xl' +
                                (j === n - 1 ? " last" : "") +
                                '">' +
                                (show
                                    ? esc(n <= 7 ? dWD(x.date) : dDM(x.date))
                                    : "") +
                                "</span>"
                            );
                        })
                        .join("");
                    const gB = goal ? ((goal / mx) * 100).toFixed(2) : null;
                    out +=
                        '<div class="ch ' +
                        (n > 7 ? "n30" : "n7") +
                        (goal ? "" : " ng") +
                        '"><div class="cbody"><div class="cyl" aria-hidden="true">' +
                        (goal
                            ? '<span class="num" style="bottom:' +
                              gB +
                              '%">' +
                              esc(nf0(goal)) +
                              "</span>"
                            : "") +
                        '</div><div class="cplot">' +
                        (goal
                            ? '<div class="cband" style="bottom:' +
                              ((0.9 * goal * 100) / mx).toFixed(2) +
                              "%;height:" +
                              ((0.1 * goal * 100) / mx).toFixed(2) +
                              '%"></div><div class="cgoal" style="bottom:' +
                              gB +
                              '%"></div>'
                            : "") +
                        '<div class="cbars" style="grid-template-columns:repeat(' +
                        n +
                        ',minmax(0,1fr))">' +
                        bars +
                        '</div></div></div><div class="cx" aria-hidden="true" style="grid-template-columns:repeat(' +
                        n +
                        ',minmax(0,1fr))">' +
                        xl +
                        "</div></div>";
                    if (goal) {
                        const met = N(cal.met_days) || 0;
                        const ov = N(cal.over_days) || 0;
                        const un = N(cal.under_days) || 0;
                        const share = met / Math.max(c.logged, 1);
                        out +=
                            '<div class="cleg" aria-hidden="true"><span><i class="lg on"></i>' +
                            esc(D.range.legendOn) +
                            '</span><span><i class="lg lo"></i>' +
                            esc(D.range.legendUnder) +
                            '</span><span><i class="lg ov"></i>' +
                            esc(D.range.legendOver) +
                            '</span><span><i class="lgz"></i>' +
                            esc(
                                tpl(D.range.zone, {
                                    lo: nf0(0.9 * goal),
                                    hi: nf0(goal),
                                }),
                            ) +
                            "</span></div>" +
                            '<div class="cfoot num"><b class="' +
                            (share >= 0.7
                                ? "s-ok"
                                : share >= 0.3
                                  ? "s-near"
                                  : "s-over") +
                            '">' +
                            esc(tpl(D.range.footMet, { met, n: c.logged })) +
                            "</b><span>" +
                            esc(
                                [
                                    D.range.footRest,
                                    ov ? tpl(D.range.footOver, { n: ov }) : "",
                                    un ? tpl(D.range.footUnder, { n: un }) : "",
                                ]
                                    .filter(Boolean)
                                    .join(SEP()),
                            ) +
                            "</span></div>";
                    }
                    if (N(cal.prev_avg) != null)
                        out +=
                            '<div class="cprev num">' +
                            esc(
                                tpl(D.range.prev, {
                                    n: c.n,
                                    avg: nf0(N(cal.prev_avg)),
                                }),
                            ) +
                            "</div>";
                    if (ST.bar != null && days[ST.bar]) {
                        const x = days[ST.bar];
                        const ov =
                            x.status === "over" && goal && x.kcal != null;
                        const sub = x.logged
                            ? [
                                  tpl(D.range.popSub, {
                                      kcal: nf0(x.kcal || 0),
                                      meals: plural(D.mealCount, x.n),
                                  }),
                                  ov
                                      ? tpl(D.range.popOver, {
                                            x: nf0(x.kcal - goal),
                                        })
                                      : "",
                              ]
                                  .filter(Boolean)
                                  .join(SEP())
                            : D.range.nothingThisDay;
                        const rows = x.meals
                            .map(
                                (m) =>
                                    '<div class="itr"><span class="ia num">' +
                                    esc(tm(m.time)) +
                                    '</span><span class="in">' +
                                    esc(S(m.name)) +
                                    '</span><b class="ik num">' +
                                    esc(nf0(N(m.calories) || 0)) +
                                    "</b></div>",
                            )
                            .join("");
                        out +=
                            '<div class="pop bpop' +
                            (ov ? " over" : "") +
                            '"><div class="poph"><div class="popt"><b>' +
                            esc(dS(x.date)) +
                            '</b><span class="num">' +
                            esc(sub) +
                            '</span></div><button type="button" class="reset popx" data-act="closeday" data-fk="closeday" aria-label="' +
                            esc(D.range.closeDay) +
                            '">' +
                            XICON +
                            "</button></div>" +
                            (rows
                                ? '<div class="itl">' + rows + "</div>"
                                : "") +
                            "</div>";
                    }
                }
                return out;
            }
            function calSection(c) {
                const D = T.digest;
                const meta = c.isRange
                    ? D.meta.dailyAvg
                    : c.past
                      ? D.meta.final
                      : D.meta.soFar;
                return (
                    '<section class="sec cal o-cal" style="--i:1"><div class="sh"><h3 class="st">' +
                    esc(D.sections.calories) +
                    '</h3><span class="sm">' +
                    esc(meta) +
                    "</span></div>" +
                    (c.isDay ? gaugeBlock(c) : rangeBlock(c)) +
                    "</section>"
                );
            }

            // ---------- collapsible section shell ----------
            function sec(k, i, order, title, metaTxt, sumTxt, body) {
                const D = T.digest;
                const open = !ST.fold[k];
                const shown = open ? metaTxt : sumTxt;
                return (
                    '<section class="sec xsec ' +
                    order +
                    (open ? "" : " folded") +
                    '" data-k="' +
                    k +
                    '" style="--i:' +
                    i +
                    '"><h3 class="shh"><button type="button" class="reset sh shb" data-act="fold" data-k="' +
                    k +
                    '" data-fk="fold-' +
                    k +
                    '" aria-expanded="' +
                    open +
                    '" aria-label="' +
                    esc(
                        tpl(open ? D.fold : D.unfold, { section: title }) +
                            (shown ? ", " + shown : ""),
                    ) +
                    '"><span class="st">' +
                    esc(title) +
                    '</span><span class="sm">' +
                    esc(shown) +
                    "</span>" +
                    chev("schev" + (open ? " open" : "")) +
                    "</button></h3>" +
                    (open
                        ? '<div class="sbody' +
                          (ST.animFold === k ? " sb-anim" : "") +
                          '">' +
                          body +
                          "</div>"
                        : "") +
                    "</section>"
                );
            }

            // ---------- goals at a glance ----------
            function goalGroups(c) {
                const D = T.digest;
                const g = O(c.d.groups);
                if (c.isDay) {
                    const L = c.past
                        ? {
                              over: D.groups.over,
                              near: D.groups.near,
                              togo: D.groups.short,
                              ok: D.groups.met,
                          }
                        : {
                              over: D.groups.over,
                              near: D.groups.near,
                              togo: D.groups.togo,
                              ok: D.groups.onTrack,
                          };
                    return ["over", "near", "togo", "ok"]
                        .map((st) => ({
                            st,
                            lbl: L[st],
                            keys: keys(g[st]).filter(
                                (k) => k !== "alcohol_g" || DU,
                            ),
                        }))
                        .filter((x) => x.keys.length);
                }
                return [
                    ["mostly_met", D.groups.mostlyMet, "ok"],
                    ["mixed", D.groups.mixed, "near"],
                    ["mostly_missed", D.groups.mostlyMissed, "over"],
                ]
                    .map(([k, lbl, st]) => ({
                        st,
                        lbl,
                        items: A(g[k])
                            .map(O)
                            .filter(
                                (x) =>
                                    isKey(x.key) &&
                                    (x.key !== "alcohol_g" || DU),
                            ),
                    }))
                    .map((x) =>
                        Object.assign(x, { keys: x.items.map((i) => i.key) }),
                    )
                    .filter((x) => x.items.length);
            }
            function goalsSummary(c) {
                const D = T.digest;
                const gs = goalGroups(c);
                if (!c.d.has_goals) return D.noGoals;
                if (!gs.length) return D.summaries.noGoals;
                const W = c.isDay
                    ? c.past
                        ? {
                              over: D.summaries.over,
                              near: D.summaries.near,
                              togo: D.summaries.short,
                              ok: D.summaries.met,
                          }
                        : {
                              over: D.summaries.over,
                              near: D.summaries.near,
                              togo: D.summaries.togo,
                              ok: D.summaries.onTrack,
                          }
                    : {
                          ok: D.summaries.mostlyMet,
                          near: D.summaries.mixed,
                          over: D.summaries.mostlyMissed,
                      };
                return gs
                    .map((x) => tpl(W[x.st], { n: x.keys.length }))
                    .join(SEP());
            }
            function nrNote(c) {
                const D = T.digest;
                const nr = keys(c.d.not_recorded).filter(
                    (k) => k !== "alcohol_g" || DU,
                );
                if (!nr.length) return "";
                return (
                    '<div class="nrnote">' +
                    esc(
                        plural(
                            c.isDay ? D.groups.nrDay : D.groups.nrRange,
                            nr.length,
                            {
                                list: lst(nr.map(label)),
                            },
                        ),
                    ) +
                    "</div>"
                );
            }
            function goalsBody(c) {
                const D = T.digest;
                if (!c.d.has_goals)
                    return '<div class="nrnote">' + esc(D.noGoals) + "</div>";
                const gs = goalGroups(c);
                let out = "";
                if (c.isDay) {
                    out +=
                        '<div class="glist">' +
                        gs
                            .map(
                                (x) =>
                                    '<div class="gline s-' +
                                    x.st +
                                    '"><b>' +
                                    esc(x.lbl) +
                                    ' <span class="gn num">' +
                                    x.keys.length +
                                    "</span></b><span>" +
                                    esc(x.keys.map(label).join(SEP())) +

                            .join("") +
                        "</div>";
                } else {
                    out += gs
                        .map(

                                x.st +

                                esc(x.lbl) +
                                '</span><div class="rgi">' +
                                x.items
                                    .map((it) => {
                                        const rec = N(it.rec) || 0;
                                        return (
                                            '<span class="gi"><span class="ge" aria-hidden="true">' +
                                            EMOJI[it.key] +
                                            "</span>" +
                                            esc(label(it.key)) +
                                            ' <b class="num">' +
                                            esc((N(it.met) || 0) + "/" + rec) +
                                            "</b><small>" +
                                            esc(plural(D.groups.days, rec)) +
                                            "</small></span>"
                                        );
                                    })
                                    .join("") +
                                "</div></div>",
                        )
                        .join("");
                }
                return out + nrNote(c);
            }
            function goalsMeta(c) {
                const D = T.digest;
                return c.isRange
                    ? D.meta.daysMet
                    : c.past
                      ? D.meta.final
                      : D.meta.rightNow;
            }
            function gMini(c) {
                const D = T.digest;
                const gs = goalGroups(c);
                const body = c.d.has_goals
                    ? '<div class="glist">' +
                      gs
                          .map(
                              (x) =>
                                  '<div class="gline s-' +
                                  x.st +
                                  '"><b>' +
                                  esc(x.lbl) +
                                  "</b><span>" +
                                  esc(x.keys.map(label).join(SEP())) +

                          )

                      nrNote(c)
