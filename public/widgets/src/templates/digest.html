                return (
                    '<section class="sec gmini" style="--i:2"><div class="sh"><h3 class="st">' +
                    esc(D.sections.goals) +
                    '</h3><span class="sm">' +
                    esc(goalsMeta(c)) +
                    "</span></div>" +
                    body +
                    "</section>"
                );
            }

            // ---------- trends ----------
            function trendCards(c) {
                return A(O(c.d.trends).cards)
                    .map(O)
                    .filter(
                        (t) => isTKey(t.key) && (t.key !== "alcohol_g" || DU),
                    )
                    .slice(0, 6);
            }
            const DIRS = {
                rising: "rising",
                falling: "falling",
                no_clear: "noClear",
                steady: "steady",
            };
            function fmtT(key, v) {
                return wu(key, v);
            }
            function trendCaption(c, t) {
                const D = T.digest.trends;
                const a = N(t.a);
                const b = N(t.b);
                const key = t.key;
                if (a == null || b == null) return ["", ""];
                if (c.isDay) {
                    const l1 = tpl(D.avg7, {
                        a: fmtT(key, a),
                        b: key === "weight" ? nfmt(b, 1) : fmtNum(key, b),
                    });
                    const dv = N(t.day_value);
                    let l2;
                    if (dv === 0 && key !== "weight")
                        l2 = c.isToday ? D.noneToday : D.noneDay;
                    else if (dv != null && c.isToday)
                        l2 = tpl(D.todaySoFar, { v: fmtT(key, dv) });
                    else if (dv != null && a) {
                        const p = Math.round(((dv - a) / Math.abs(a)) * 100);
                        l2 =
                            Math.abs(p) < 3
                                ? D.dayAboutAvg
                                : tpl(D.dayVsAvg, {
                                      pct:
                                          (p > 0 ? "+" : "−") +
                                          nf0(Math.abs(p)),
                                  });
                    } else l2 = c.isToday ? D.nothingToday : D.notLoggedDay;
                    return [l1, l2];
                }
                const dv = a - b;
                const sign = dv > 0 ? "+" : dv < 0 ? "−" : "±";
                if (key === "weight")
                    return [
                        sign + wu("weight", Math.abs(dv)),
                        tpl(D.wasAvg, { b: wu("weight", b) }),
                    ];
                return [
                    tpl(D.perDay, { d: sign + wu(key, Math.abs(dv)) }),
                    tpl(D.was, { b: wu(key, b) }),
                ];
            }
            function trendChart(c, t) {
                const ser = A(t.series).map(N);
                const ghost = c.isRange ? A(t.ghost).map(N) : [];
                const n = ser.length;
                if (!n) return "";
                if (t.key !== "weight") {
                    const g = N(t.goal);
                    const mx =
                        Math.max(
                            ...ser.filter((x) => x != null),
                            ...ghost.filter((x) => x != null),
                            g || 0,
                            1e-6,
                        ) * 1.08;
                    const bars = ser
                        .map((v, j) => {
                            const rep = c.isDay && j === n - 1;
                            const gv = ghost[j];
                            return (
                                '<span class="tb' +
                                (v == null ? " nl" : "") +
                                (rep ? (c.isToday ? " sofar" : " rep") : "") +
                                '"><i class="tgh" style="height:' +
                                (gv == null ? 0 : (gv / mx) * 100).toFixed(1) +
                                '%"></i><i class="tv2" style="height:' +
                                (v == null
                                    ? 0
                                    : Math.max((v / mx) * 100, v > 0 ? 3 : 0)
                                ).toFixed(1) +
                                '%"></i></span>'
                            );
                        })
                        .join("");
                    return (
                        '<div class="tcb" aria-hidden="true">' +
                        (g != null
                            ? '<div class="tcg" style="bottom:' +
                              ((g / mx) * 100).toFixed(1) +
                              '%"></div>'
                            : "") +
                        '<div class="tcbs" style="grid-template-columns:repeat(' +
                        n +
                        ',minmax(0,1fr))">' +
                        bars +
                        "</div></div>"
                    );
                }
                const vals = [...ser, ...ghost].filter((x) => x != null);
                if (!vals.length) return "";
                let lo = Math.min(...vals) - 0.15;
                let hi = Math.max(...vals) + 0.15;
                if (hi - lo < 2) {
                    const m = (hi + lo) / 2;
                    lo = m - 1;
                    hi = m + 1;
                }
                lo = Math.floor(lo * 2) / 2;
                hi = Math.ceil(hi * 2) / 2;
                const X = (j) => (n === 1 ? 50 : (j / (n - 1)) * 100);
                const Y = (w) => ((hi - w) / (hi - lo)) * 100;
                const path = (arr) => {
                    let d = "";
                    let pen = false;
                    let lastJ = -9;
                    arr.forEach((v, j) => {
                        if (v == null) return;
                        d +=
                            (pen && j - lastJ <= 4 ? "L" : "M") +
                            X(j).toFixed(2) +
                            " " +
                            Y(v).toFixed(2);
                        pen = true;
                        lastJ = j;
                    });
                    return d || "M0 0";
                };
                let lastJ = -1;
                ser.forEach((v, j) => {
                    if (v != null) lastJ = j;
                });
                const dots =
                    ser
                        .map((v, j) =>
                            v == null
                                ? ""
                                : "M" +
                                  X(j).toFixed(2) +
                                  " " +
                                  Y(v).toFixed(2) +
                                  "h0",
                        )
                        .join(" ") || "M0 0";
                const yl = (v) => nfmt(v, v % 1 ? 1 : 0);
                return (
                    '<div class="tcw" aria-hidden="true"><div class="wy num"><span>' +
                    esc(yl(hi)) +
                    "</span><span>" +
                    esc(yl(lo)) +
                    '</span></div><div class="wpl"><svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M0 0H100M0 100H100" class="wgr" vector-effect="non-scaling-stroke"/>' +
                    (c.isRange
                        ? '<path d="' +
                          path(ghost) +
                          '" class="tgl" vector-effect="non-scaling-stroke" style="stroke-width:1.5"/>'
                        : "") +
                    '<path d="' +
                    path(ser) +
                    '" class="wln" vector-effect="non-scaling-stroke" style="stroke-width:2.5"/><path d="' +
                    dots +
                    '" class="wdt" vector-effect="non-scaling-stroke"/></svg>' +
                    (lastJ >= 0
                        ? '<span class="wend" style="left:' +
                          X(lastJ).toFixed(2) +
                          "%;top:" +
                          Y(ser[lastJ]).toFixed(2) +
                          '%"></span>'
                        : "") +
                    "</div></div>"
                );
            }
            function trendsBody(c) {
                const D = T.digest.trends;
                const tr = O(c.d.trends);
                const cards = trendCards(c);
                let out = "";
                if (cards.length) {
                    out +=
                        '<div class="tgrid">' +
                        cards
                            .map((t) => {
                                const dirK = DIRS[t.dir] || "steady";
                                const tone =
                                    t.tone === "good"
                                        ? "s-ok"
                                        : t.tone === "bad"
                                          ? "s-over"
                                          : "s-nr";
                                const [l1, l2] = trendCaption(c, t);
                                const aria = tpl(D.aria, {
                                    label: label(t.key),
                                    dir: D.dirWord[dirK],
                                    l1,
                                    l2,
                                });
                                return (
                                    '<div class="tcd" style="--mc:var(--' +
                                    CSSVAR[t.key] +
                                    ')" role="img" aria-label="' +
                                    esc(aria) +
                                    '"><div class="tch" aria-hidden="true"><span class="tce">' +
                                    EMOJI[t.key] +
                                    '</span><span class="tcn">' +
                                    esc(label(t.key)) +
                                    '</span><b class="tdir ' +
                                    tone +
                                    '">' +
                                    esc(D[dirK]) +
                                    "</b></div>" +
                                    trendChart(c, t) +
                                    '<div class="tl1 num" aria-hidden="true">' +
                                    esc(l1) +
                                    '</div><div class="tl2 num" aria-hidden="true">' +
                                    esc(l2) +
                                    "</div></div>"
                                );
                            })
                            .join("") +
                        "</div>";
                } else out += '<div class="nrnote">' + esc(D.none) + "</div>";
                const ok = (k) => isTKey(k) && (k !== "alcohol_g" || DU);
                const also = A(tr.also)
                    .map(O)
                    .filter((x) => ok(x.key))
                    .map(
                        (x) =>
                            inl(x.key) + " " + (x.dir === "rising" ? "↑" : "↓"),
                    );
                const mixed = A(tr.mixed).filter(ok).map(inl);
                const steady = A(tr.steady).filter(ok).map(inl);
                const few = A(tr.few).filter(ok).map(inl);
                const notes = [];
                if (also.length)
                    notes.push(tpl(D.alsoNote, { list: also.join(", ") }));
                if (mixed.length)
                    notes.push(tpl(D.mixedNote, { list: lst(mixed) }));
                if (notes.length)
                    out +=
                        '<div class="tnote">' + esc(notes.join(" ")) + "</div>";
                if (steady.length)
                    out +=
                        '<div class="tnote">' +
                        esc(tpl(D.steadyNote, { list: lst(steady) })) +
                        "</div>";
                if (few.length)
                    out +=
                        '<div class="tnote">' +
                        esc(tpl(D.fewNote, { list: lst(few) })) +
                        "</div>";
                return out;
            }
            function trendsMeta(c) {
                const D = T.digest.meta;
                if (c.isDay) return c.isToday ? D.last14Today : D.last14;
                return c.d.sparse ? D.fewDays : tpl(D.vsPrev, { n: c.n });
            }
            function trendsSummary(c) {
                const D = T.digest.summaries;
                const cards = trendCards(c);
                const r = cards.filter((t) => t.dir === "rising").length;
                const f = cards.filter((t) => t.dir === "falling").length;
                const s = cards.filter(
                    (t) => t.dir !== "rising" && t.dir !== "falling",
                ).length;
                const parts = [];
                if (r) parts.push(tpl(D.rising, { n: r }));
                if (f) parts.push(tpl(D.falling, { n: f }));
                if (s) parts.push(tpl(D.steady, { n: s }));
                return parts.length ? parts.join(SEP()) : D.notEnough;
            }

            // ---------- nutrients ----------
            function rowDelta(c, r) {
                const D = T.digest.table;
                const t = N(r.value);
                const g = N(r.goal);
                const k = r.key;
                switch (r.status) {
                    case "nr":
                        return [D.notRecorded, ""];
                    case "none":
                        return ["", ""];
                    case "over":
                        return [tpl(D.over, { x: wu(k, t - g) }), ""];
                    case "togo":
                        return [
                            tpl(c.past ? D.short : D.togo, { x: wu(k, g - t) }),
                            "",
                        ];
                    case "ok":
                    case "near":
                        if (r.kind === "target")
                            return [c.past ? D.met : D.done, ""];
                        if (
                            t === 0 &&
                            (k === "alcohol_g" || k === "caffeine_mg")
                        )
                            return [D.none, ""];
                        // A limit is never a budget to use up: always "under".
                        if (Math.abs(g - t) < (UNIT[k] === "g" ? 0.05 : 0.5))
                            return [D.atLimit, ""];
                        return [
                            tpl(D.under, { x: wu(k, Math.max(g - t, 0)) }),
                            r.status === "near" ? D.nearLimit : "",
                        ];
                }
                return ["", ""];
            }
            function nutsRows(c) {
                return c.rows.filter(
                    (r) => r.key !== "calories" && r.key !== "water_ml",
                );
            }
            function nutsBody(c) {
                const D = T.digest.table;
                const rows = nutsRows(c);
                let out =
                    '<div class="tbl" role="list">' +
                    rows
                        .map((r) => {
                            const nr = r.status === "nr" || N(r.value) == null;
                            const t = N(r.value);
                            const g = N(r.goal);
                            const kind = r.kind;
                            const val = nr ? "—" : fmtNum(r.key, t);
                            const gl = nr
                                ? ""
                                : kind === "target" && g != null
                                  ? tpl(D.target, { g: wu(r.key, g) })
                                  : kind === "limit" && g != null
                                    ? tpl(D.limit, { g: wu(r.key, g) })
                                    : tpl(D.noGoalUnit, { u: unitOf(r.key) });
                            const [delta, sub] = nr
                                ? [D.notRecorded, ""]
                                : rowDelta(c, r);
                            const valU = nr ? D.notRecorded : wu(r.key, t);
                            const aria =
                                g != null &&
                                !nr &&
                                (kind === "target" || kind === "limit")
                                    ? tpl(
                                          kind === "target"
                                              ? D.ariaTarget
                                              : D.ariaLimit,
                                          {
                                              label: label(r.key),
                                              value: valU,
                                              goal: wu(r.key, g),
                                              delta: [delta, sub]
                                                  .filter(Boolean)
                                                  .join(", "),
                                          },
                                      )
                                          // No delta (the no-_meta view
                                          // has no statuses): drop the
                                          // dangling separator.
                                          .replace(/[,、，]\s*$/, "")
                                    : tpl(D.ariaPlain, {
                                          label: label(r.key),
                                          value: valU,
                                      });
                            return (
                                '<div class="tr ' +
                                stCls(r.status) +
                                (nr ? " nr" : "") +
                                '" style="--mc:var(--' +
                                CSSVAR[r.key] +
                                ')" role="listitem" aria-label="' +
                                esc(aria) +
                                '"><span class="te" aria-hidden="true">' +
                                EMOJI[r.key] +
                                '</span><span class="tn" aria-hidden="true">' +
                                esc(label(r.key)) +
                                '</span><span class="tv num" aria-hidden="true"><b>' +
                                esc(val) +
                                "</b> " +
                                esc(gl) +
                                '</span><span class="td num" aria-hidden="true"><b>' +
                                esc(delta) +
                                "</b>" +
                                (sub ? "<small>" + esc(sub) + "</small>" : "") +
                                "</span></div>"
                            );
                        })
                        .join("") +
                    "</div>";
                const notes = [];
                if (c.d.sparse)
                    notes.push(tpl(D.sparse, { n: c.logged, of: c.n }));
                const partial = A(c.d.partial)
                    .map(O)
                    .filter(
                        (p) => isKey(p.key) && (p.key !== "alcohol_g" || DU),
                    );
                if (partial.length)
                    notes.push(
                        tpl(D.partial, {
                            list: partial
                                .map((p) =>
                                    tpl(D.partialItem, {
                                        label: label(p.key),
                                        n: N(p.days) || 0,
                                        of: c.logged,
                                    }),
                                )
                                .join(", "),
                        }),
                    );
                if (notes.length)
                    out +=
                        '<div class="nrnote">' +
                        esc(notes.join(" ")) +
                        "</div>";
                return out;
            }

            // ---------- water & weight ----------
            function waterInfo(c) {
                const w = O(c.d.water);
                return {
                    v: N(w.value_ml),
                    g: N(w.goal_ml) && N(w.goal_ml) > 0 ? N(w.goal_ml) : null,
                    met: N(w.met_days) || 0,
                    rec: N(w.rec_days) || 0,
                };
            }
            function weightInfo(c) {
                const w = O(c.d.weight);
                const pt = (x) => {
                    const o = O(x);
                    return N(o.value) != null && S(o.date)
                        ? { value: N(o.value), date: S(o.date) }
                        : null;
                };
                return {
                    goal: N(w.goal),
                    latest: pt(w.latest),
                    previous: pt(w.previous),
                    count: N(w.count) || 0,
                    on_day: w.on_day === true,
                    last_known: pt(w.last_known),
                };
            }
            function weightChange(wi) {
                if (!wi.latest || !wi.previous) return null;
                const diff = wi.latest.value - wi.previous.value;
                if (Math.abs(diff) < 0.05)
                    return {
                        txt: T.digest.weight.noChange,
                        cls: "s-nr",
                        zero: true,
                    };
                const g = wi.goal;
                const cls =
                    g == null
                        ? "s-nr"
                        : Math.abs(wi.latest.value - g) <
                            Math.abs(wi.previous.value - g)
                          ? "s-ok"
                          : "s-over";
                return {
                    txt: (diff > 0 ? "+" : "−") + wu("weight", Math.abs(diff)),
                    cls,
                    zero: false,
                };
            }
            function cardsBody(c) {
                const D = T.digest;
                const wi = waterInfo(c);
                let water =
                    '<div class="dcard wcard" style="--mc:var(--water)"><div class="ch2"><span aria-hidden="true">💧</span>' +
                    esc(label("water_ml")) +
                    "</div>";
                if (wi.v != null) {
                    const big = nfmt(wi.v / 1000, 1);
                    const unit = c.isDay
                        ? wi.g
                            ? tpl(D.water.of, { goal: wu("water_ml", wi.g) })
                            : D.units.L
                        : D.units.L + " " + D.water.aDay;
                    water +=
                        '<div class="dbig"><span class="bn num" aria-hidden="true">' +
                        reels(big, 0.5) +
                        '</span><span class="vh">' +
                        esc(big) +
                        '</span><span class="bu">' +
                        esc(unit) +
                        "</span></div>";
                    // Day cells are tenths of the goal; with no goal there is
                    // no scale to fill, and a fixed one would read as a target.
                    if (c.isDay && wi.g) {
                        const per = wi.g / 10;
                        const fill = Math.min(wi.v / per, 10);
                        let cells = "";
                        for (let j = 0; j < 10; j++)
                            cells +=
                                '<i class="wc' +
                                (j + 1 <= fill + 1e-6
                                    ? " on"
                                    : j < fill
                                      ? " half"
                                      : "") +
                                '"></i>';
                        water +=
                            '<div class="wcells" aria-hidden="true">' +
                            cells +
                            "</div>";
                    } else if (c.isRange && !c.d.fallback) {
                        const days = rangeDays(c);
                        if (wi.g && wi.rec)
                            water +=
                                '<div class="cmeta">' +
                                esc(
                                    tpl(D.water.metDays, {
                                        n: wi.met,
                                        of: wi.rec,
                                    }),
                                ) +
                                "</div>";
                        water +=
                            '<div class="wdots" aria-hidden="true" style="grid-template-columns:repeat(' +
                            (days.length > 7 ? 10 : 7) +
                            ',minmax(0,1fr))">' +
                            days
                                .map(
                                    (x) =>
                                        '<i class="wdot' +
                                        (x.water == null
                                            ? " nl"
                                            : wi.g && x.water >= wi.g - 5
                                              ? " on"
                                              : "") +
                                        '"></i>',
                                )
                                .join("") +
                            "</div>";
                    }
                } else {
                    water +=
                        '<div class="cnone">' +
                        esc(
                            c.isDay
                                ? c.isToday
                                    ? D.water.noneToday
                                    : D.water.noneDay
                                : D.water.noneRange,
                        ) +
                        "</div>";
                }
                water += "</div>";
                const wi2 = weightInfo(c);
                let weight =
                    '<div class="dcard tcard" style="--mc:var(--weight)"><div class="ch2"><span aria-hidden="true">⚖️</span>' +
                    esc(label("weight")) +
                    "</div>";
                if (wi2.latest) {
                    const big = nfmt(wi2.latest.value, 1);
                    weight +=
                        '<div class="dbig"><span class="bn num" aria-hidden="true">' +
                        reels(big, 0.5) +
                        '</span><span class="vh">' +
                        esc(big) +
                        '</span><span class="bu">' +
                        esc(unitOf("weight")) +
                        "</span></div>";
                    const chg = weightChange(wi2);
                    let sub;
                    if (c.isDay)
                        sub = wi2.previous
                            ? tpl(D.weight.vs, { date: dS(wi2.previous.date) })
                            : D.weight.first;
                    else
                        sub =
                            wi2.count > 1 && wi2.previous
                                ? plural(D.weight.since, wi2.count, {
                                      date: dDM(wi2.previous.date),
                                  })
                                : D.weight.only1;
                    weight +=
                        '<div class="wrow">' +
                        (chg
                            ? '<span class="wchg num ' +
                              chg.cls +
                              '">' +
                              esc(chg.txt) +
                              "</span>"
                            : "") +
                        '<span class="cmeta">' +
                        esc(sub) +
                        "</span></div>";
                    const ago = c.isDay
                        ? wi2.on_day
                            ? c.isToday
                                ? D.weight.thisMorning
                                : D.weight.thatMorning
                            : tpl(D.weight.last, { date: dS(wi2.latest.date) })
                        : tpl(D.weight.latest, { date: dS(wi2.latest.date) });
                    weight +=
                        '<div class="cmeta">' +
                        esc(
                            [
                                ago,
                                wi2.goal != null
                                    ? tpl(D.weight.goal, {
                                          v: wu("weight", wi2.goal),
                                      })
                                    : "",
                            ]
                                .filter(Boolean)
                                .join(SEP()),
                        ) +
                        "</div>";
                } else {
                    const lk = wi2.last_known;
                    weight +=
                        '<div class="cnone">' +
                        esc(
                            lk
                                ? tpl(
                                      c.isDay
                                          ? D.weight.noneRecent
                                          : D.weight.nonePeriod,
                                      {
                                          v: wu("weight", lk.value),
                                          date: dDM(lk.date),
                                      },
                                  )
                                : D.weight.noneYet,
                        ) +
                        "</div>";
                }
                weight += "</div>";
                return (
                    '<div class="cards2">' +
                    water +
                    (c.d.fallback ? "" : weight) +
                    "</div>"
                );
            }
            function cardsSummary(c) {
                const D = T.digest.summaries;
                const wi = waterInfo(c);
                const wi2 = weightInfo(c);
                const w =
                    wi.v != null
                        ? tpl(D.water, {
                              v:
                                  wu("water_ml", wi.v) +
                                  (c.isRange ? " " + T.digest.water.aDay : ""),
                          })
                        : D.noWater;
                if (c.d.fallback) return w;
                const k = wi2.latest
                    ? tpl(D.weight, { v: wu("weight", wi2.latest.value) })
                    : D.noWeigh;
                return w + SEP() + k;
            }

            // ---------- meals / habits ----------
            function topMacro(c, m) {
                const D = T.digest;
                const goals = c.R;
                const cand = [
                    ["protein_g", m.p],
                    ["carbs_g", m.cb],
                    ["fat_g", m.f],
                ].map(([k, v]) => {
                    const g = N(O(goals[k]).goal);
                    return { k, v, s: g ? v / g : v };
                });
                cand.sort((a, b) => b.s - a.s);
                const t = cand[0];
                return t.v > 0
                    ? tpl(D.meals.macro, { x: wu(t.k, t.v), label: inl(t.k) })
                    : "";
            }
            function mealsBody(c) {
                const D = T.digest;
                if (c.isDay) {
                    const meals = dayMeals(c);
                    return (
                        '<div class="mls">' +
                        meals
                            .map((m, j) => {
                                const open = ST.mo === j;
                                const meta = [
                                    mealType(m.type),
                                    topMacro(c, m),
                                    m.items && m.items.length
                                        ? ""
                                        : D.meals.totalOnly,
                                ]
                                    .filter(Boolean)
                                    .join(SEP());
                                return (
                                    '<div class="ml' +
                                    (open ? " open" : "") +
                                    '"><button type="button" class="reset mlh" data-act="meal" data-j="' +
                                    j +
                                    '" data-fk="meal-' +
                                    j +
                                    '" aria-expanded="' +
                                    open +
                                    '"><span class="mt num">' +
                                    esc(tm(m.time)) +
                                    '</span><span class="mn"><span class="mnn">' +
                                    esc(m.name) +
                                    '</span><span class="mm">' +
                                    esc(meta) +
                                    '</span></span><b class="mk num">' +
                                    esc(nf0(m.kcal)) +
                                    "<small> " +
                                    esc(D.units.kcal) +
                                    "</small></b>" +
                                    chev("chv") +
                                    "</button>" +
                                    (open
                                        ? '<div class="itl">' +
                                          itemsHtml(m.items) +
                                          "</div>"
                                        : "") +
                                    "</div>"
                                );
                            })
                            .join("") +
                        "</div>"
                    );
                }
                const h = O(c.d.habits);
                let out =
                    '<div class="mstats"><div class="ms"><span class="msl">' +
                    esc(D.meals.daysLogged) +
                    '</span><b class="num">' +
                    esc(tpl(D.meals.ofDays, { n: c.logged, of: c.n })) +
                    '</b></div><div class="ms"><span class="msl">' +
                    esc(D.meals.mealsADay) +
                    '</span><b class="num">' +
                    esc(nfmt(N(h.meals_per_day) || 0, 1)) +
                    "</b></div></div>";
                const times = A(h.times)
                    .map(O)
                    .filter((x) => S(x.time));
                if (times.length)
                    out +=
                        '<div class="mtimes"><span class="msl">' +
                        esc(D.meals.typical) +
                        '</span><span class="mtl">' +
                        times
                            .map(
                                (x) =>
                                    '<span class="num">' +
                                    tplH(D.meals.typicalItem, {
                                        type: esc(mealType(x.type)),
                                        time: "<b>~" + esc(tm(x.time)) + "</b>",
                                    }) +
                                    "</span>",
                            )
                            .join("") +
                        "</span></div>";
                const top = A(h.top).map(O);
                if (top.length)
                    out +=
                        '<div class="mlab">' +
                        esc(D.meals.topFoods) +
                        '</div><div class="tops">' +
                        top
                            .map((x, j) => {
                                const cnt = N(x.count) || 0;
                                return (
                                    '<div class="topr"><span class="rk num">' +
                                    (j + 1) +
                                    '</span><span class="tnm">' +
                                    esc(S(x.name)) +
                                    (cnt > 1
                                        ? '<small class="num"> ' +
                                          esc(tpl(D.meals.times, { n: cnt })) +
                                          "</small>"
                                        : "") +
                                    '</span><b class="num">' +
                                    esc(
                                        nf0(N(x.calories) || 0) +
                                            " " +
                                            D.units.kcal,
                                    ) +
                                    "</b></div>"
                                );
                            })
                            .join("") +
                        "</div>";
                const bd = (x, kind) => {
                    const o = O(x);
                    if (!S(o.date)) return "";
                    const over = keys(o.over).filter(
                        (k) => k !== "alcohol_g" || DU,
                    );
                    const short = keys(o.short);
                    const why = [];
                    if (over.length)
                        why.push(
                            over.length > 2
                                ? plural(D.meals.whyLimits, over.length)
                                : tpl(D.meals.whyOver, {
                                      list: lst(over.map(inl)),
                                  }),
                        );
                    if (short.length)
                        why.push(
                            tpl(D.meals.whyShort, {
                                list: lst(short.map(inl)),
                            }),
                        );
                    const reason = why.length
                        ? why.join(SEP())
                        : D.meals.whyAll;
                    return (
                        '<button type="button" class="reset btc ' +
                        (kind === "best" ? "s-ok" : "s-over") +
                        '" data-act="pick" data-date="' +
                        esc(o.date) +
                        '" data-fk="pick-' +
                        kind +
                        '"><span class="btl">' +
                        esc(kind === "best" ? D.meals.best : D.meals.tough) +
                        "</span><b>" +
                        esc(dS(o.date)) +
                        '</b><span class="bts num">' +
                        esc(
                            tpl(D.meals.goalsMet, {
                                n: N(o.met) || 0,
                                of: N(o.of) || 0,
                            }),
                        ) +
                        '</span><span class="btw num">' +
                        esc(
                            nf0(N(o.calories) || 0) +
                                " " +
                                D.units.kcal +
                                SEP() +
                                reason,
                        ) +
                        "</span></button>"
                    );
                };
                const best = bd(h.best, "best");
                const tough = bd(h.tough, "tough");
                if (best && tough)
                    out += '<div class="bt">' + best + tough + "</div>";
                return out;
            }
            function mealsSummary(c) {
                const D = T.digest;
                if (c.isDay) {
                    const ms = dayMeals(c);
                    const cnt = plural(D.mealCount, ms.length);
                    return ms.length
                        ? tpl(D.summaries.mealSpan, {
                              meals: cnt,
                              from: tm(ms[0].time),
                              to: tm(ms[ms.length - 1].time),
                          })
                        : cnt;
                }
                return tpl(D.summaries.daysLogged, { n: c.logged, of: c.n });
            }

            // ---------- highlights ----------
            const trim = (n) =>
                n.length > 46 ? n.slice(0, 44).trimEnd() + "…" : n;
            function hlItems(c) {
                const D = T.digest.highlights;
                const out = [];
                for (const h0 of A(c.d.highlights).slice(0, 3)) {
                    const h = O(h0);
                    if (h.code === "sugar_source") {
                        const cnt = N(h.count) || 0;
                        out.push({
                            ic: "🍬",
                            a: c.isToday ? D.sugarAToday : D.sugarA,
                            b:
                                trim(S(h.name)) +
                                (cnt > 1 ? tpl(D.times, { n: cnt }) : ""),
                            c: tpl(
                                c.isRange
                                    ? D.sugarRange
                                    : c.isToday
                                      ? D.sugarToday
                                      : D.sugarDay,
                                {
                                    g: wu("sugar_g", N(h.grams) || 0),
                                    pct: nf0(N(h.share) || 0),
                                },
                            ),
                        });
                    } else if (h.code === "streak") {
                        out.push({
                            ic: "🎯",
                            a: D.streakA,
                            b: plural(D.streakB, N(h.days) || 0),
                            c: c.isToday ? D.streakToday : D.streakPast,
                        });
                    } else if (h.code === "gaps") {
                        out.push({
                            ic: "📅",
                            a: D.gapsA,
                            b: plural(D.gapsB, N(h.days) || 0),
                            c: D.gapsC,
                        });
                    } else if (
                        h.code === "over_source" &&
                        isKey(h.key) &&
                        (h.key !== "alcohol_g" || DU)
                    ) {
                        const days = N(h.days);
                        const cnt = N(h.count) || 0;
                        out.push({
                            ic: "🔎",
                            a: "",
                            b:
                                days != null
                                    ? plural(D.overRange, days, {
                                          label: label(h.key),
                                      })
                                    : tpl(
                                          c.isToday ? D.overToday : D.overPast,
                                          { label: label(h.key) },
                                      ),
                            // `each` is null when the occurrences differ;
                            // the total is then the only true figure.
                            c: tpl(
                                cnt <= 1
                                    ? D.overOnce
                                    : N(h.each) != null
                                      ? D.overEach
                                      : D.overTotal,
                                {
                                    name: trim(S(h.name)),
                                    x: wu(
                                        h.key,
                                        (cnt > 1 ? N(h.each) : null) ??
                                            N(h.total) ??
                                            N(h.each) ??
                                            0,
                                    ),
                                    n: cnt,
                                },
                            ),
                        });
                    } else if (h.code === "short_source" && isKey(h.key)) {
                        const days = N(h.days);
                        out.push({
                            ic: "🔎",
                            a: "",
                            b:
                                days != null
                                    ? plural(D.shortRange, days, {
                                          label: label(h.key),
                                      })
                                    : tpl(
                                          c.isToday
                                              ? D.shortToday
                                              : D.shortPast,
                                          { label: label(h.key) },
                                      ),
                            c: tpl(D.shortFood, {
                                name: trim(S(h.name)),
                                x: wu(h.key, N(h.amount) || 0),
                                kcal: nf0(N(h.calories) || 0),
                            }),
                        });
                    } else if (h.code === "all_met") {
                        out.push({
                            ic: "✅",
                            a: D.allMetA,
                            b: c.isRange
                                ? D.allMetRange
                                : c.past
                                  ? D.allMetPast
                                  : D.allMetToday,
                            c: D.allMetC,
                        });
                    }
                }
                return out;
            }
            function hlBody(items) {
                return (
                    '<ul class="hl">' +
                    items
                        .map(
                            (h) =>
                                '<li><span class="hi" aria-hidden="true">' +
                                h.ic +
                                "</span><span>" +
                                esc(h.a) +
                                "<b>" +
                                esc(h.b) +
                                "</b>" +
                                esc(h.c) +
                                "</span></li>",
                        )
                        .join("") +
                    "</ul>"
                );
            }

            // ---------- rest of today ----------
            function restRows(c) {
                const D = T.digest.rest;
                const r = O(c.d.rest);
                const kv = [];
                if (N(r.kcal_over) != null)
                    kv.push({
                        em: "🔥",
                        k: D.kcalOver,
                        v: wu("calories", N(r.kcal_over)),
                        cls: "s-over",
                    });
                else if (N(r.kcal_left) != null)
                    kv.push({
                        em: "🔥",
                        k: D.kcalLeft,
                        v: wu("calories", N(r.kcal_left)),
                        cls: "s-togo",
                    });
                if (N(r.water_left_ml) != null)
                    kv.push({
                        em: "💧",
                        k: D.water,
                        v: wu("water_ml", N(r.water_left_ml)),
                        cls: "s-togo",
                    });
                for (const t of A(r.togo).map(O))
                    if (isKey(t.key) && N(t.amount) != null)
                        kv.push({
                            em: EMOJI[t.key],
                            k: tpl(D.togo, { label: label(t.key) }),
                            v: wu(t.key, N(t.amount)),
                            cls: "s-togo",
                        });
                return kv;
            }
            function restBody(c) {
                const D = T.digest.rest;
                const r = O(c.d.rest);
                const kv = restRows(c);
                let out = '<div class="rest">';
                if (kv.length)
                    out +=
                        '<div class="kv">' +
                        kv
                            .map(
                                (x) =>
                                    '<div class="kvr ' +
                                    x.cls +
                                    '"><span class="kk"><span class="ke" aria-hidden="true">' +
                                    x.em +
                                    "</span>" +
                                    esc(x.k) +
                                    '</span><b class="kvv num">' +
                                    esc(x.v) +
                                    "</b></div>",
                            )
                            .join("") +
                        "</div>";
                const f = O(r.food);
                if (S(f.name) && isKey(f.key))
                    out +=
                        '<div class="hint"><span class="hi" aria-hidden="true">🍽️</span><span><b>' +
                        esc(D.foodLabel) +
                        "</b> " +
                        esc(
                            tpl(D.food, {
                                name: S(f.name),
                                x: wu(f.key, N(f.amount) || 0),
                                label: inl(f.key),
                                kcal: nf0(N(f.calories) || 0),
                            }),
                        ) +
                        "</span></div>";
                else if (!kv.length)
                    out +=
                        '<div class="hint"><span class="hi" aria-hidden="true">✅</span><span>' +
                        esc(cap(D.reached)) +
                        "</span></div>";
                return out + "</div>";
            }
            function restSummary(c) {
                const kv = restRows(c);
                return kv.length
                    ? plural(T.digest.rest.summary, kv.length)
                    : T.digest.rest.reached;
            }

            // ---------- collapsed facts ----------
            function factsHtml(c) {
                const D = T.digest.facts;
                const facts = [];
                const wi = waterInfo(c);
                if (wi.v != null)
                    facts.push({
                        em: "💧",
                        t: c.isDay
                            ? wi.g
                                ? tpl(D.waterOf, {
                                      v: fmtNum("water_ml", wi.v),
                                      goal: wu("water_ml", wi.g),
                                  })
                                : tpl(D.water, { v: wu("water_ml", wi.v) })
                            : tpl(D.waterDay, { v: wu("water_ml", wi.v) }),
                    });
                const wi2 = weightInfo(c);
                if (wi2.latest) {
                    const chg = weightChange(wi2);
                    const v = wu("weight", wi2.latest.value);
                    facts.push({
                        em: "⚖️",
                        t:
                            chg && !chg.zero
                                ? tpl(D.weightChg, { v, chg: chg.txt })
                                : tpl(D.weight, { v }),
                    });
                }
                const st1 = trendCards(c).find(
                    (t) =>
                        (t.dir === "rising" || t.dir === "falling") &&
                        t.key !== "calories" &&
                        t.key !== "weight",
                );
                if (st1)
                    facts.push({
                        em: EMOJI[st1.key],
                        t: tpl(D.trend, {
                            label: label(st1.key),
                            dir: T.digest.trends.dirWord[st1.dir],
                        }),
                    });
                if (facts.length < 3 && c.isDay) {
                    const ms = dayMeals(c)
                        .slice()
                        .sort((a, b) => b.kcal - a.kcal);
                    if (ms[0]) {
                        const nm =
                            ms[0].name.length > 46
                                ? ms[0].name.slice(0, 44).trimEnd() + "…"
                                : ms[0].name;
                        facts.push({
                            em: "🍽️",
                            t: tpl(D.biggest, { name: nm }),
                        });
                    }
                }
                if (!facts.length) return "";
                return (
                    '<div class="facts sec o-facts" style="--i:2">' +
                    facts
                        .slice(0, 3)
                        .map(
                            (f) =>
                                '<span class="fact num"><span aria-hidden="true">' +
                                f.em +
                                "</span>" +
                                esc(f.t) +
                                "</span>",
                        )
                        .join("") +
                    "</div>"
                );
            }

            // ---------- assembly ----------
            function bigChev(c) {
                const D = T.digest;
                const open = ST.level >= 1;
                return (
                    '<button type="button" class="reset bigchev o-btn" data-act="more" data-fk="more" aria-expanded="' +
                    open +
                    '"><span>' +
                    esc(open ? D.showLess : D.showMore) +
                    '</span><svg class="nchev' +
                    (open ? " open" : "") +
                    '" width="14" height="9" viewBox="0 0 34 22" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round"><path d="M5 5l12 12 12-12"/></svg></button>'
                );
            }
            function html() {
                const c = ctx();
                const D = T.digest;
                let out = header(c);
                if (!c.d.has_data) {
                    return (
                        out +
                        '<section class="sec dempty" style="--i:2"><span aria-hidden="true">🗒️</span><span>' +
                        esc(
                            c.isToday
                                ? D.emptyText.today
                                : c.isDay
                                  ? D.emptyText.day
                                  : D.emptyText.range,
                        ) +
                        '</span></section><section class="sec" style="--i:3"><h3 class="vh">' +
                        esc(D.sections.cardsHidden) +
                        "</h3>" +
                        cardsBody(c) +
                        "</section>"
                    );
                }
                const lv1 = ST.level >= 1;
                out +=
                    '<div class="gcard' + (ST.closing ? " closing" : "") + '">';
                const fb = !!c.d.fallback;
                const fbNote =
                    '<div class="nrnote">' + esc(D.averagesOnly) + "</div>";
                if (!lv1) {
                    out +=
                        '<div class="dg"><div class="dA">' +
                        calSection(c) +
                        '</div><div class="dB">' +
                        (fb ? fbNote : gMini(c)) +
                        "</div></div>" +
                        factsHtml(c) +
                        bigChev(c) +
                        "</div>";
                    return out;
                }
                const goals = fb
                    ? ""
                    : sec(
                          "goals",
                          2,
                          "o-goals",
                          D.sections.goals,
                          goalsMeta(c),
                          goalsSummary(c),
                          goalsBody(c),
                      );
                const cards = sec(
                    "cards",
                    5,
                    "o-cards",
                    D.sections.cards,
                    c.isDay
                        ? c.past
                            ? D.meta.final
                            : D.meta.soFar
                        : D.meta.waterAvg,
                    cardsSummary(c),
                    cardsBody(c),
                );
                const trends = fb
                    ? ""
                    : sec(
                          "trends",
                          3,
                          "o-trends",
                          D.sections.trends,
                          trendsMeta(c),
                          trendsSummary(c),
                          trendsBody(c),
                      );
                const nRows = nutsRows(c);
                const nOver = nRows.filter((r) => r.status === "over").length;
                const nuts = sec(
                    "nuts",
                    4,
                    "o-nuts",
                    D.sections.nutrients,
                    c.isRange
                        ? D.meta.dailyAvg
                        : c.past
                          ? D.meta.dayTotal
                          : D.meta.soFarToday,
                    plural(D.summaries.metrics, nRows.length) +
                        (nOver
                            ? SEP() + tpl(D.summaries.over, { n: nOver })
                            : ""),
                    nutsBody(c) + (fb ? fbNote : ""),
                );
                const meals =
                    fb || (c.isDay && !dayMeals(c).length)
                        ? ""
                        : sec(
                              "meals",
                              6,
                              "o-meals",
                              D.sections.meals,
                              c.isDay ? D.meta.tapMeal : D.meta.habits,
                              mealsSummary(c),
                              mealsBody(c),
                          );
                const items = fb ? [] : hlItems(c);
                const hl = items.length
                    ? sec(
                          "hl",
                          7,
                          "o-hl",
                          D.sections.highlights,
                          "",
                          plural(D.highlights.count, items.length),
                          hlBody(items),
                      )
                    : "";
                const rest =
                    !fb && c.isToday && c.d.rest
                        ? sec(
                              "rest",
                              8,
                              "o-rest",
                              D.sections.rest,
                              "",
                              restSummary(c),
                              restBody(c),
                          )
                        : "";
                out +=
                    '<div class="dg"><div class="dA">' +
                    calSection(c) +
                    '</div><div class="dB">' +
                    goals +
                    (c.isDay ? cards : "") +
                    "</div></div>" +
                    bigChev(c) +
                    trends +
                    '<div class="dg"><div class="dA">' +
                    nuts +
                    meals +
                    '</div><div class="dB">' +
                    (c.isRange ? cards : "") +
                    hl +
                    rest +
                    "</div></div>" +
                    '<button type="button" class="reset collall o-coll" data-act="coll" data-fk="coll"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M7 11l5-5 5 5"/><path d="M7 18l5-5 5 5"/></svg><span>' +
                    esc(D.collapseAll) +
                    "</span></button></div>";
                return out;
            }
            function draw() {
                const el = document.getElementById("dgx");
                if (!el || !ST) return;
                const ae = document.activeElement;
                const fk =
                    ST.focus ||
                    (ae && el.contains(ae) && ae.getAttribute
                        ? ae.getAttribute("data-fk")
                        : null);
                el.className =
                    "digest" +
                    (ST.anim === "entry" && !REDUCED() ? " a-entry" : "") +
                    (ST.anim === "expand" && !REDUCED() ? " a-expand" : "");
                el.innerHTML = html();
                if (fk) {
                    const f = el.querySelector('[data-fk="' + fk + '"]');
                    if (f && f.focus) {
                        try {
                            f.focus({ preventScroll: true });
                        } catch (_) {}
                    }
                }
                ST.anim = null;
                ST.animFold = null;
                ST.focus = null;
            }
            function collapse() {
                if (ST.closing) return;
                const reset = () => {
                    ST.closing = false;
                    ST.level = 0;
                    ST.fold = {};
                    ST.gm = ST.mo = ST.bar = null;
                    ST.focus = "more";
                    draw();
                };
                if (REDUCED()) return reset();
                ST.closing = true;
                const g = document.querySelector("#dgx .gcard");
                if (g) g.classList.add("closing");
                setTimeout(reset, 560);
            }
            function act(name, ds) {
                if (!ST || ST.closing) return;
                switch (name) {
                    case "more":
                        if (ST.level === 0) {
                            ST.level = 1;
                            ST.fold = {};
                            ST.anim = "expand";
                        } else return collapse();
                        break;
                    case "coll":
                        return collapse();
                    case "fold": {
                        const k = ds.k;
                        ST.fold[k] = !ST.fold[k];
                        if (!ST.fold[k]) ST.animFold = k;
                        break;
                    }
                    case "seg": {
                        const r = Number(ds.rep);
                        ST.gm = ST.gm === r ? null : r;
                        break;
                    }
                    case "closemeal":
                        ST.focus = ST.gm != null ? "seg-" + ST.gm : null;
                        ST.gm = null;
                        break;
                    case "bar": {
                        const j = Number(ds.j);
                        ST.bar = ST.bar === j ? null : j;
                        break;
                    }
                    case "closeday":
                        ST.focus = ST.bar != null ? "bar-" + ST.bar : null;
                        ST.bar = null;
                        break;
                    case "meal": {
                        const j = Number(ds.j);
                        ST.mo = ST.mo === j ? null : j;
                        break;
                    }
                    case "pick": {
                        const days = rangeDays(ctx());
                        const j = days.findIndex((x) => x.date === ds.date);
                        if (j >= 0) ST.bar = j;
                        break;
                    }
                    default:
                        return;
                }
                draw();
            }
            // Delegated on #root, which survives repaints.
            const rootEl = document.getElementById("root");
            rootEl.addEventListener("click", (e) => {
                const b =
                    e.target && e.target.closest
                        ? e.target.closest("[data-act]")
                        : null;
                if (!b || !rootEl.contains(b)) return;
                act(b.getAttribute("data-act"), {
                    k: b.getAttribute("data-k"),
                    rep: b.getAttribute("data-rep"),
                    j: b.getAttribute("data-j"),
                    date: b.getAttribute("data-date"),
                });
            });
            // Gauge pieces are SVG paths with role=button: Enter and Space.
            rootEl.addEventListener("keydown", (e) => {
                const t = e.target;
                if (
                    (e.key === "Enter" || e.key === " ") &&
                    t &&
                    t.getAttribute &&
                    t.getAttribute("data-act") === "seg"
                ) {
                    e.preventDefault();
                    act("seg", { rep: t.getAttribute("data-rep") });
                }
            });

            function coerce(p) {
                if (!p || typeof p !== "object") return null;
                if (
                    typeof p.period !== "string" ||
                    typeof p.start_date !== "string"
                )
                    return null;
                return p;
            }
            function render(data, meta) {
                setLocale(
                    pickLocale(
                        data && data.locale,
                        API && API.hostContext ? API.hostContext.locale : null,
                    ),
                );
                const d = readMeta(meta, data);
                DU =
                    d.drink_unit === "us" || d.drink_unit === "uk"
                        ? d.drink_unit
                        : null;
                WU = d.weight_unit === "lb" ? "lb" : "kg";
                ST = freshState(data, d);
                document.getElementById("root").innerHTML =
                    '<div class="digest" id="dgx"></div>';
                draw();
            }

            initWidget({

                    esc(strings.digest.loading) +
