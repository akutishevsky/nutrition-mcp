<!doctype html>
<!--
  Goal progress widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts.

  One card (`.panel`): a header line naming the day and what was logged, the
  shared macro strip (calories, the three macro bars, the limits row and the
  water line), and one compact weight row under a hairline. The weight row is
  the only markup this widget owns — everything above it comes from
  shared/macros.js.

  Data arrives as the `structuredContent` of the get_goal_progress tool result;
  the shared bridge (shared/bridge.js) reads it across host conventions and
  calls render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Goal Progress</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/ring.css@*/

            /*@include shared/macros.css@*/

            /* Weight — a standing metric (latest overall vs target), not a
               per-day total, so it sits below the strip rather than in it. The
               row reuses the strip's own idiom (.wrow / .wlab / .dot / .wnum /
               .wsub from macros.css); only the number line itself is local: a
               track with the span between the two readings highlighted, a
               hollow target marker and a filled current one. Marker positions
               (left %) are set inline from the data. */
            .wtrack {
                position: relative;
                flex: 1;
                height: 5px;
                border-radius: 999px;
                background: var(--track);
            }
            .wseg {
                position: absolute;
                top: 0;
                height: 100%;
                border-radius: 999px;
                background: var(--accent);
                opacity: 0.4;
            }
            .wmark {
                position: absolute;
                top: 50%;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }
            .wmark.tgt {
                background: var(--panel);
                border: 2px solid var(--text-dim);
                z-index: 1;
            }
            .wmark.cur {
                background: var(--accent);
                box-shadow: 0 0 0 3px
                    color-mix(in srgb, var(--accent) 22%, transparent);
                z-index: 2;
            }
            /* The states with nothing to plot — no reading yet, or a reading
               with no target — are one line of text in the same section, never
               a card of their own. */
            .wnote {
                font-size: 11.5px;
                color: var(--text-dim);
            }
        </style>
    </head>
    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                date: "2026-07-10",
                locale: "en",
                meal_count: 5,
                water_entries: 6,
                // The alcohol opt-in, which every payload with an alcohol
                // figure carries. Without it here the preview glosses grams as
                // US drinks by fallback and the UK path is never seen.
                drink_unit: "us",
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: 20,
                    // A ceiling, like sugar and alcohol: EFSA's 400 mg/day.
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1980,
                    protein_g: 148,
                    carbs_g: 231,
                    fat_g: 74,
                    fiber_g: 24.6,
                    // Over its ceiling, so the limits row flags it with --over.
                    sugar_g: 61.3,
                    // Alcohol tracking ON in this sample; null would mean the
                    // user has it off and the limit cell disappears.
                    alcohol_g: 27.7,
                    // Over its ceiling too, so its cell flags it. null here
                    // (nothing recorded today) would drop the cell rather than
                    // claim a 0 mg day against the 400 mg limit.
                    caffeine_mg: 470,
                    water_ml: 2100,
                },
                weight: {
                    current: 78.4,
                    target: 75,
                    unit: "kg",
                    logged_on: "2026-07-09",
                },
                meals: [
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: null,
                        calories: 420,
                        protein_g: 18,
                        carbs_g: 62,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 24.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Grilled chicken & rice bowl",
                        meal_type: "lunch",
                        date: null,
                        calories: 650,
                        protein_g: 52,
                        carbs_g: 78,
                        fat_g: 16,
                        fiber_g: 6.2,
                        sugar_g: 9.4,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: null,
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Salmon with quinoa & veg",
                        meal_type: "dinner",
                        date: null,
                        calories: 650,
                        protein_g: 56,
                        carbs_g: 77,
                        fat_g: 32,
                        fiber_g: 7.9,
                        sugar_g: 14.7,
                        alcohol_g: 27.7,
                        caffeine_mg: null,
                    },
                    {
                        // Where the day's caffeine came from. The food rows
                        // carry null, not 0 — a nutrient nobody filled in is
                        // absent, not zero.
                        description: "Double espresso",
                        meal_type: "snack",
                        date: null,
                        calories: 10,
                        protein_g: 0,
                        carbs_g: 1,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,
                        caffeine_mg: 470,
                    },
                ],
            };

            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            /*@include shared/macros.js@*/

            // "2026-07-10" → "10 Jul", for the header line where the year is
            // noise. Split on the string rather than through Date: the payload
            // is a calendar date already resolved in the user's timezone, and
            // new Date("2026-07-10") is UTC midnight, which renders as the 9th
            // for anyone west of Greenwich. Anything not date-shaped is passed
            // through untouched. Reuses T.nutritionSummary.months (identical
            // Jan..Dec shape) rather than its own MONTHS array.
            function shortDate(iso) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
                if (!m) return String(iso || "");
                return `${Number(m[3])} ${T.nutritionSummary.months[Number(m[2]) - 1]}`;
            }

            // The weight section: one compact row on the strip's own idiom
            // (label · track · figure), or one line of text when there is
            // nothing to plot. Never a card — it is the last section of the
            // widget's single panel.
            function weightRow(w) {
                const cur = w?.current;
                const tgt = w?.target;
                const unit = esc(w?.unit || "kg");
                const hasCur = cur != null;
                const hasTgt = tgt != null;

                // Nothing to plot without a current weight — say which piece is
                // missing and which tool supplies it, rather than dropping the
                // section silently.
                if (!hasCur) {
                    const msg = hasTgt
                        ? tpl(T.goalProgress.weightNoneWithTarget, {
                              target: `${fmt(tgt, 1)} ${unit}`,
                          })
                        : T.goalProgress.weightNoneNoTarget;
                    return `<div class="wnote psec">${msg}</div>`;
                }

                // Have a reading but no target: there is no line to plot it on,
                // so show the reading and prompt for the goal.
                if (!hasTgt) {
                    // The reading is the LATEST one overall, not necessarily
                    // this day's — with no track to hang a tooltip on, the
                    // date has to be in the sentence or it is lost.
                    const when = w.logged_on
                        ? ` (${esc(shortDate(w.logged_on))})`
                        : "";
                    const reading = `${fmt(cur, 1)} ${unit}${when}`;
                    return `<div class="wnote psec">${tpl(T.goalProgress.weightNoGoal, { reading })}</div>`;
                }

                const atTarget = Math.abs(cur - tgt) < 0.05;
                const delta = Math.round((cur - tgt) * 10) / 10;
                const state = atTarget
                    ? T.goalProgress.atTarget
                    : tpl(
                          delta > 0
                              ? T.goalProgress.toLose
                              : T.goalProgress.toGain,
                          { amount: `${fmt(Math.abs(delta), 1)} ${unit}` },
                      );
                // The row shows the two readings; the distance between them and
                // the date behind the current one ride along as the graphic's
                // accessible name and the row's tooltip. "·" separates them
                // visually, but a screen reader either skips it or announces
                // "middle dot", so the spoken name uses commas.
                const metaTxt = w.logged_on
                    ? tpl(T.goalProgress.lastLogged, {
                          date: esc(w.logged_on),
                      })
                    : "";
                const title = metaTxt ? `${state} · ${metaTxt}` : state;
                const aria = tpl(T.goalProgress.weightAria, {
                    current: `${fmt(cur, 1)} ${unit}`,
                    target: `${fmt(tgt, 1)} ${unit}`,
                    state,
                    metaSuffix: metaTxt ? `, ${metaTxt}` : "",
                });

                let pc = 50;
                let pt = 50;
                if (!atTarget) {
                    // Pad the scale beyond the two points so the markers land
                    // inboard (~22% / 78%): an 11px marker centred on 0% or
                    // 100% would hang off the end of its own track.
                    const lo = Math.min(cur, tgt);
                    const hi = Math.max(cur, tgt);
                    const pad = (hi - lo) * 0.4;
                    const smin = lo - pad;
                    const span = hi - lo + pad * 2;
                    const pos = (v) => ((v - smin) / span) * 100;
                    pc = pos(cur);
                    pt = pos(tgt);
                }
                const segL = Math.min(pc, pt);
                const segW = Math.abs(pc - pt);
                const num = atTarget
                    ? `${fmt(cur, 1)}<span class="wsub"> ${unit} · at target</span>`
                    : `${fmt(cur, 1)}<span class="wsub"> → ${fmt(tgt, 1)} ${unit}</span>`;

                return `
          <div class="wrow psec" title="${title}">
            <span class="wlab"><span class="dot" style="background:var(--accent)"></span>${esc(T.goalProgress.weightLabel)}</span>
            <div class="wtrack" role="img" aria-label="${aria}">
              <div class="wseg" style="left:${segL.toFixed(1)}%;width:${segW.toFixed(1)}%"></div>
              <div class="wmark tgt" style="left:${pt.toFixed(1)}%"></div>
              <div class="wmark cur" style="left:${pc.toFixed(1)}%"></div>
            </div>
            <span class="wnum">${num}</span>
          </div>`;
            }

            let __widgetApi = null;

            function render(data) {
                const root = document.getElementById("root");
                setLocaleFrom(data, __widgetApi);
                if (!data || typeof data !== "object") {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">🎯</div>
              <div>${esc(T.goalProgress.empty)}</div>
            </div>`;
                    return;
                }

                const totals = data.totals || {};
                const meals = data.meal_count || 0;
                const water = data.water_entries || 0;
                const w = data.weight;
                const nothingLogged =
                    meals === 0 &&
                    water === 0 &&
                    !(w && (w.current != null || w.target != null));

                const dateOrThisDay =
                    esc(shortDate(data.date)) || T.goalProgress.thisDay;

                if (nothingLogged) {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">🎯</div>
              <div>${tpl(T.goalProgress.nothingLoggedFor, { date: dateOrThisDay })}</div>
            </div>`;
                    return;
                }

                const panel = macroPanel(
                    totals,
                    data.goals,
                    undefined,
                    data.meals,
                    // Nothing sits between the header line and the strip, so no
                    // leading hairline; the label above the calorie figure is
                    // the default "Calories today", which is exactly what this
                    // widget shows.
                    { drinkUnit: data.drink_unit },
                );

                // The day itself and what was logged on it — the context the
                // strip's numbers are read against.
                const meta = `${esc(shortDate(data.date))} · ${plural(T.goalProgress.mealsCount, meals)} · ${plural(T.goalProgress.waterCount, water)}`;
                // A day with a weight reading but no meals or water still shows
                // the strip (all zeros against the goals), so say why.
                const sub =
                    meals === 0 && water === 0
                        ? `<div class="psub">${tpl(T.goalProgress.nothingLoggedFor, { date: dateOrThisDay })}</div>`
                        : "";

                root.innerHTML = `
          <div class="panel">
            <div class="phead">
              <div class="ptitle">${esc(T.goalProgress.title)}</div>
              ${sub}
              <div class="pmeta">${meta}</div>
            </div>
            ${panel}
            ${weightRow(w)}
          </div>`;
            }

            // ---- Rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (payload.totals || payload.date) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "goal-progress-widget",
                loading:
                    '<div class="empty"><div class="big">🎯</div><div>Loading your goal progress…</div></div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
