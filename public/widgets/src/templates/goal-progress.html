<!doctype html>
<!--
  Goal progress widget (MCP Apps), for get_goal_progress.

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, the host bridge and
  the macro strip's `_meta` merges. The result is fully self-contained —
  inline CSS + JS, zero network requests — because the MCP Apps sandbox blocks
  external hosts.

  The view is a goal-status list, not the macro strip: a header (eyebrow and a
  one-line verdict), four status counters that double as filters (over, near
  the limit, to go, on track), a "for the rest of today" card (today only),
  then — once expanded — the goals grouped by status, each opening to its
  largest source, the user's own logged foods richest in a target still to go,
  and the per-meal breakdown with ingredients; and a footer with the latest
  weight and trans fat for reference.

  Mobile and desktop are one markup, laid out by the iframe's own width
  (@media min-width: 640px is the desktop layout; widget-static.ts turns it
  into a container query for the landing cards). Which goal is over, near or
  to go is src/goal-progress-model.ts, inlined below and tested on the server.

  Copy describes the day; it never suggests what to eat. The only foods it
  names are the user's own: the day's ingredients and GOAL_DAY_META_KEY's
  `foods`, which the server builds from the user's recent log.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Goal Progress</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* Theme-dependent tint strengths: the design mixes status and
               metric colours more strongly on dark. Set in the same four
               blocks as tokens.css, so an explicit host theme wins over the
               media query in both directions. */
            :root {
                --gp-ctr: 9%;
                --gp-ctr-hover: 14%;
                --gp-ctr-on: 6%;
                --gp-pill: 11%;
                --gp-em: 15%;
                --gp-em-base: var(--panel);
                --gp-hover: rgba(0, 0, 0, 0.025);
                --gp-btn: color-mix(in srgb, var(--text) 6%, var(--panel));
                --gp-btn-hover: color-mix(
                    in srgb,
                    var(--text) 10%,
                    var(--panel)
                );
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --gp-ctr: 13%;
                    --gp-ctr-hover: 18%;
                    --gp-ctr-on: 9%;
                    --gp-pill: 16%;
                    --gp-em: 22%;
                    --gp-em-base: var(--surface-soft);
                    --gp-hover: rgba(255, 255, 255, 0.03);
                }
            }
            :root[data-theme="light"] {
                --gp-ctr: 9%;
                --gp-ctr-hover: 14%;
                --gp-ctr-on: 6%;
                --gp-pill: 11%;
                --gp-em: 15%;
                --gp-em-base: var(--panel);
                --gp-hover: rgba(0, 0, 0, 0.025);
            }
            :root[data-theme="dark"] {
                --gp-ctr: 13%;
                --gp-ctr-hover: 18%;
                --gp-ctr-on: 9%;
                --gp-pill: 16%;
                --gp-em: 22%;
                --gp-em-base: var(--surface-soft);
                --gp-hover: rgba(255, 255, 255, 0.03);
            }

            /* clip: an entrance animation's offset (gRise starts 14px low)
               must not flash a scrollbar in an iframe sized to the content. */
            .gp-root {
                overflow: clip;
                padding: 16px 16px 18px;
                font-family:
                    -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI",
                    Roboto, sans-serif;
            }
            .num {
                font-variant-numeric: tabular-nums;
            }
            button {
                font: inherit;
                color: inherit;
            }
            :where(button.reset) {
                all: unset;
                box-sizing: border-box;
                cursor: pointer;
                text-align: left;
            }
            button.reset:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
                border-radius: 10px;
            }
            .accH:focus-visible,
            .mlg:focus-visible {
                outline-offset: -2px !important;
                border-radius: 14px !important;
            }

            /* One status colour per status; the metric colour only tints the
               emoji chip. --sc is the hue (dots, rings, tints), --si the ink
               for text on those tints. */
            .s-over {
                --sc: var(--status-over);
                --si: var(--status-over-ink);
            }
            .s-near {
                --sc: var(--status-near);
                --si: var(--status-near-ink);
            }
            .s-togo {
                --sc: var(--status-togo);
                --si: var(--status-togo-ink);
            }
            .s-ok {
                --sc: var(--status-ok);
                --si: var(--status-ok-ink);
            }
            .s-nr,
            .s-none {
                --sc: var(--status-nr);
                --si: var(--status-nr-ink);
            }

            /* Odometer numbers: each digit is a 1em window over a column of
               0–9 three times, resting on the last run. The spin is a CSS
               animation on the first paint only (.intro), so the markup always
               holds the final value: a static render and reduced motion both
               show it as is. */
            .rl {
                display: inline-block;
                height: 1em;
                line-height: 1;
                overflow: hidden;
                vertical-align: top;
            }
            .rs {
                display: flex;
                flex-direction: column;
                transform: translateY(calc((var(--d) + 20) * -1em));
            }
            .rs span {
                display: block;
                height: 1em;
                line-height: 1;
                text-align: center;
            }
            .intro .rs {
                animation: gReel var(--dur, 1.6s) cubic-bezier(0.22, 1, 0.36, 1)
                    var(--dl, 0s) backwards;
            }
            @keyframes gReel {
                from {
                    transform: translateY(calc(var(--d) * -1em));
                }
            }
            @keyframes gRise {
                0% {
                    opacity: 0;
                    transform: translateY(14px) scale(0.96);
                    filter: blur(3px);
                }
                60% {
                    opacity: 1;
                    filter: blur(0);
                }
                100% {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
            }
            @keyframes gUp {
                from {
                    opacity: 0;
                    transform: translateY(10px);
                }
            }
            @keyframes gDrop {
                0% {
                    opacity: 0;
                    transform: translateY(-8px);
                    max-height: 0;
                }
                100% {
                    opacity: 1;
                    transform: none;
                    max-height: 3000px;
                }
            }
            @keyframes gFade {
                0% {
                    opacity: 0;
                    transform: translateY(6px);
                }
                100% {
                    opacity: 1;
                    transform: none;
                }
            }
            @keyframes gOut {
                0% {
                    opacity: 1;
                    transform: none;
                    filter: none;
                }
                100% {
                    opacity: 0;
                    transform: translateY(-12px) scale(0.96);
                    filter: blur(2px);
                }
            }
            @keyframes gFold {
                0% {
                    opacity: 1;
                    max-height: 3000px;
                }
                100% {
                    opacity: 0;
                    max-height: 0;
                    transform: translateY(-8px);
                }
            }

            .gcard {
                display: flex;
                flex-direction: column;
                width: 100%;
                color: var(--text);
            }
            .gtop {
                display: flex;
                flex-direction: column;
                gap: 5px;
                width: 100%;
            }
            .eyb2 {
                font-size: 12.5px;
                font-weight: 600;
                color: var(--text-dim);
                letter-spacing: 0.01em;
            }
            .gtop .t {
                font-size: 17px;
                font-weight: 650;
                line-height: 1.3;
                letter-spacing: -0.01em;
                color: var(--text);
                text-wrap: balance;
            }
            .t-d {
                display: none;
            }

            /* status counters */
            .ctrs {
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                gap: 6px;
                margin-top: 16px;
            }
            .ctr {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                padding: 11px 4px 10px;
                border-radius: 14px;
                background: color-mix(
                    in srgb,
                    var(--sc) var(--gp-ctr),
                    var(--panel)
                );
                box-shadow: inset 0 0 0 2px transparent;
                transition:
                    box-shadow 0.3s ease,
                    background-color 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .intro .ctr {
                animation: gRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards;
                animation-delay: calc(var(--i) * 60ms + 60ms);
            }
            .ctr:hover {
                background: color-mix(
                    in srgb,
                    var(--sc) var(--gp-ctr-hover),
                    var(--panel)
                );
            }
            .ctr:active {
                transform: scale(0.95);
            }
            .ctr.on {
                box-shadow: inset 0 0 0 2px var(--sc);
                background: color-mix(
                    in srgb,
                    var(--sc) var(--gp-ctr-on),
                    var(--panel)
                );
            }
            .ctr .cn {
                display: flex;
                height: 1em;
                font-size: 27px;
                font-weight: 800;
                line-height: 1;
                letter-spacing: -0.02em;
                color: var(--si);
            }
            .ctr .cl {
                display: flex;
                align-items: center;
                gap: 5px;
                font-size: 11.5px;
                font-weight: 650;
                color: var(--text);
                white-space: nowrap;
            }
            .ctr .cl::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 4px;
                background: var(--sc);
                flex: none;
            }
            .ctr.zero {
                background: var(--surface-soft);
                cursor: default;
            }
            .ctr.zero .cn,
            .ctr.zero .cl {
                color: var(--text-mute);
            }
            .ctr.zero .cl::before {
                background: color-mix(
                    in srgb,
                    var(--text-mute) 35%,
                    var(--panel)
                );
            }
            .nrnote {
                font-size: 12.5px;
                color: var(--text-dim);
                margin-top: 8px;
                text-align: center;
                line-height: 1.4;
            }
            .gempty {
                margin-top: 12px;
                padding: 12px 14px;
                border-radius: 14px;
                background: var(--surface-soft);
                font-size: 13.5px;
                line-height: 1.5;
                color: var(--text-dim);
            }

            /* for the rest of today */
            .dbody {
                display: flex;
                flex-direction: column;
            }
            .dleft {
                display: flex;
                flex-direction: column;
                min-width: 0;
            }
            .rest {
                margin-top: 14px;
                padding: 12px 14px;
                border-radius: 16px;
                background: var(--surface-soft);
            }
            .intro .rest {
                animation: gRise 0.7s cubic-bezier(0.22, 1, 0.36, 1) 0.3s
                    backwards;
            }
            .rh {
                font-size: 11.5px;
                font-weight: 750;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--text-dim);
            }
            .kv {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                column-gap: 16px;
                margin-top: 4px;
            }
            .kvr {
                display: flex;
                flex-direction: column;
                gap: 4px;
                min-width: 0;
                padding: 9px 0 8px;
                border-top: 1px solid var(--panel-border);
            }
            .kvr:nth-child(-n + 2) {
                border-top: none;
            }
            .kvr:nth-child(5) {
                display: none;
            }
            .kk {
                font-size: 12.5px;
                color: var(--text-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .kk .ke {
                margin-right: 5px;
            }
            .kvv {
                display: flex;
                height: 1em;
                font-size: 16px;
                font-weight: 800;
                line-height: 1;
                color: var(--si);
                white-space: nowrap;
            }
            .hint {
                display: flex;
                gap: 8px;
                margin-top: 4px;
                padding-top: 10px;
                border-top: 1px solid var(--panel-border);
                font-size: 13.5px;
                line-height: 1.45;
                color: var(--text);
            }
            .hint .hi {
                flex: none;
            }
            .hint b {
                font-weight: 700;
            }

            /* show more / collapse */
            .bigchev {
                display: flex;
                align-self: center;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 40px;
                padding: 0 18px 0 20px;
                margin-top: 14px;
                border-radius: 20px;
                background: var(--pill-bg);
                font-size: 15px;
                font-weight: 800;
                color: var(--text);
                transition:
                    background-color 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .intro .bigchev {
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.55s
                    backwards;
            }
            .bigchev:hover {
                background: var(--pill-bg-hover);
            }
            .bigchev:active {
                transform: scale(0.94);
            }
            .bigchev svg {
                stroke: currentColor;
            }
            .nchev {
                transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
                flex: none;
            }
            .nchev.open {
                transform: rotate(180deg);
            }
            .collall {
                display: flex;
                align-self: center;
                align-items: center;
                gap: 8px;
                height: 40px;
                padding: 0 20px;
                margin-top: 16px;
                margin-bottom: 4px;
                border-radius: 20px;
                background: var(--gp-btn);
                color: var(--text);
                font-size: 14.5px;
                font-weight: 700;
                transition:
                    background-color 0.25s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .collall.new {
                animation: gUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) 0.3s
                    backwards;
            }
            .collall:hover {
                background: var(--gp-btn-hover);
            }
            .collall:active {
                transform: scale(0.95);
            }

            /* grouped list */
            .rows {
                display: flex;
                flex-direction: column;
                gap: 18px;
                margin-top: 20px;
                min-width: 0;
            }
            .sech {
                display: flex;
                align-items: center;
                gap: 8px;
                margin-bottom: 8px;
                min-height: 26px;
            }
            .pill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 26px;
                padding: 0 11px 0 10px;
                border-radius: 13px;
                background: color-mix(
                    in srgb,
                    var(--sc) var(--gp-pill),
                    var(--panel)
                );
                color: var(--si);
                font-size: 13px;
                font-weight: 750;
                white-space: nowrap;
            }
            .pill::before {
                content: "";
                width: 7px;
                height: 7px;
                border-radius: 4px;
                background: var(--sc);
            }
            .secn {
                font-size: 13px;
                font-weight: 650;
                color: var(--text-dim);
            }
            .showall {
                display: inline-flex;
                align-items: center;
                min-height: 32px;
                margin: -3px -8px -3px auto;
                padding: 0 8px;
                border-radius: 10px;
                font-size: 13px;
                font-weight: 700;
                color: var(--status-togo-ink);
            }
            .showall:hover {
                background: color-mix(in srgb, var(--focus) 8%, transparent);
            }
            .srows {
                display: flex;
                flex-direction: column;
                gap: 6px;
            }
            .chips {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
                grid-auto-flow: row dense;
            }
            .chips .acc.sel {
                grid-column: 1 / -1;
            }
            .acc {
                position: relative;
                border-radius: 16px;
                background: var(--surface-soft);
                box-shadow: inset 0 0 0 2px transparent;
                transition:
                    box-shadow 0.35s ease,
                    background-color 0.35s ease;
                overflow: hidden;
                min-width: 0;
            }
            .acc.new,
            .sec.new .sech {
                animation: gRise 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards;
                animation-delay: calc(var(--i) * 35ms);
            }
            .acc.sel {
                box-shadow: inset 0 0 0 2px var(--sc);
            }
            .accH {
                display: grid;
                grid-template-columns: 38px minmax(0, 1fr) auto 16px;
                column-gap: 11px;
                align-items: center;
                width: 100%;
                padding: 10px 12px 10px 10px;
                min-height: 58px;
            }
            .accH:hover {
                background: var(--gp-hover);
            }
            .em {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 38px;
                height: 38px;
                border-radius: 12px;
                background: color-mix(
                    in srgb,
                    var(--mc) var(--gp-em),
                    var(--gp-em-base)
                );
                font-size: 19px;
                line-height: 1;
            }
            .ab {
                display: flex;
                flex-direction: column;
                gap: 3px;
                min-width: 0;
            }
            .lb {
                display: flex;
                align-items: baseline;
                flex-wrap: wrap;
                column-gap: 6px;
                font-size: 15px;
                font-weight: 700;
                color: var(--text);
                line-height: 1.25;
            }
            .lb .kw {
                font-size: 12px;
                font-weight: 600;
                color: var(--text-mute);
            }
            .sec2 {
                font-size: 13px;
                color: var(--text-dim);
                line-height: 1.3;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .pri {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                gap: 1px;
                font-size: 15px;
                font-weight: 800;
                color: var(--si);
                white-space: nowrap;
                text-align: right;
                line-height: 1.2;
            }
            .pri .pw {
                font-size: 12px;
                font-weight: 650;
            }
            .srows .pri {
                flex-direction: row;
                align-items: baseline;
                gap: 4px;
            }
            .srows .pri .pw {
                font-size: 15px;
                font-weight: 800;
            }
            .achev {
                color: var(--text-mute);
                transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .acc.sel .achev {
                transform: rotate(180deg);
                color: var(--text);
            }
            .chips .accH {
                grid-template-columns: 22px minmax(0, 1fr) 12px;
                column-gap: 7px;
                row-gap: 3px;
                padding: 9px 10px 9px 9px;
                min-height: 52px;
            }
            .chips .em {
                grid-column: 1;
                grid-row: 1;
                width: 22px;
                height: 22px;
                border-radius: 7px;
                font-size: 12.5px;
            }
            .chips .ab {
                grid-column: 2;
                grid-row: 1;
            }
            .chips .lb {
                font-size: 13px;
                letter-spacing: -0.005em;
                display: block;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .chips .lb .kw,
            .chips .sec2 {
                display: none;
            }
            .chips .pri {
                grid-column: 1 / 3;
                grid-row: 2;
                display: block;
                font-size: 12.5px;
                font-weight: 700;
                text-align: left;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                line-height: 1.3;
            }
            .chips .pri .pw {
                font-size: inherit;
                font-weight: inherit;
            }
            .chips .achev {
                grid-column: 3;
                grid-row: 1 / 3;
                width: 12px;
            }
            .s-nr .pri {
                color: var(--text-mute);
                font-weight: 600;
            }

            /* a goal's detail */
            .accB {
                padding: 0 12px 12px;
                overflow: hidden;
            }
            .accB.new {
                animation: gDrop 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .ctx {
                display: none;
                font-size: 13px;
                color: var(--text-dim);
                padding: 0 0 8px;
            }
            .chips .accB .ctx {
                display: block;
            }
            .lead {
                font-size: 13px;
                line-height: 1.45;
                padding: 9px 11px;
                border-radius: 12px;
                background: var(--surface-inset);
                color: var(--text);
                margin-bottom: 6px;
                overflow-wrap: anywhere;
            }
            .lead b {
                color: var(--si);
                font-weight: 750;
                margin-right: 4px;
            }
            .gap {
                border-radius: 12px;
                background: var(--surface-inset);
                padding: 7px 11px 3px;
                margin-bottom: 6px;
            }
            .gaph {
                font-size: 12px;
                font-weight: 750;
                color: var(--si);
                padding: 2px 0 3px;
            }
            .gapr {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto;
                gap: 10px;
                padding: 6px 0;
                border-top: 1px solid var(--panel-border);
                font-size: 13px;
                color: var(--text);
                overflow-wrap: anywhere;
            }
            .gaph + .gapr {
                border-top: none;
            }
            .gapr b {
                color: var(--si);
                font-weight: 800;
                white-space: nowrap;
            }
            .mlh {
                font-size: 11.5px;
                font-weight: 750;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--text-dim);
                padding: 10px 0 2px;
            }
            .mls {
                display: flex;
                flex-direction: column;
            }
            .mlg {
                display: grid;
                grid-template-columns: minmax(0, 1fr) auto 36px 14px;
                column-gap: 10px;
                align-items: center;
                width: 100%;
                padding: 9px 0;
                border-top: 1px solid var(--panel-border);
                font-size: 13.5px;
            }
            .accB.new .mlg {
                animation: gFade 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .mls > .mlg:first-child {
                border-top: none;
            }
            .mlg .nmf {
                line-height: 1.35;
                font-weight: 600;
                color: var(--text);
                overflow-wrap: anywhere;
            }
            .mlg .nmf span {
                display: block;
                font-size: 11.5px;
                font-weight: 400;
                color: var(--text-dim);
            }
            .mlg > b {
                justify-self: end;
                font-weight: 750;
                color: var(--text);
                white-space: nowrap;
            }
            .mlg .pc {
                justify-self: end;
                font-size: 12px;
                font-weight: 600;

            /* mobile: once expanded the card keeps only its one-line fact */
            @media (max-width: 639.98px) {

            @media (prefers-reduced-motion: reduce) {
