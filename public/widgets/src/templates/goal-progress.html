    </head>
    <body>
        <div class="gp-root" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            /*@inlinets src/goal-progress-model.ts@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                date: "2026-10-24",
                locale: "en",
                meal_count: 3,
                water_entries: 3,
                drink_unit: "us",
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: 20,
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1250,
                    protein_g: 79,
                    carbs_g: 132,
                    fat_g: 41,
                    fiber_g: 13.5,
                    sugar_g: 42,
                    alcohol_g: 0,
                    caffeine_mg: 126,
                    water_ml: 1050,
                },
                weight: {
                    current: 78.4,
                    target: 75,
                    unit: "kg",
                    logged_on: "2026-10-23",
                },
                meals: [
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: null,
                        calories: 443,
                        protein_g: 16.5,
                        carbs_g: 70,
                        fat_g: 11.9,
                        fiber_g: 13.1,
                        sugar_g: 21.9,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Flat white",
                        meal_type: "snack",
                        date: null,
                        calories: 100,
                        protein_g: 5.4,
                        carbs_g: 7.7,
                        fat_g: 5.3,
                        fiber_g: 0,
                        sugar_g: 7.7,
                        alcohol_g: 0,
                        caffeine_mg: 126,
                    },
                    {
                        description: "Grilled chicken & rice bowl",
                        meal_type: "lunch",
                        date: null,
                        calories: 595,
                        protein_g: 54,
                        carbs_g: 64.7,
                        fat_g: 10.7,
                        fiber_g: 2.8,
                        sugar_g: 8.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                ],
            };
            const SAMPLE_META = {
                "nutrition-mcp.com/added-sugar": {
                    v: 1,
                    goal: 25,
                    days: { "2026-10-24": 12.6 },
                    meals: { a: 5.8, b: 0, c: 6.8 },
                },
                "nutrition-mcp.com/saturated-fat": {
                    v: 1,
                    goal: 20,
                    days: { "2026-10-24": 9.4 },
                    meals: { a: 3.1, b: 3.4, c: 2.3 },
                    trans: { days: { "2026-10-24": 0.3 }, meals: {} },
                },
                "nutrition-mcp.com/sodium": {
                    v: 1,
                    goal: 2300,
                    days: { "2026-10-24": 1251 },
                    meals: { a: 74, b: 78, c: 1025 },
                },
                "nutrition-mcp.com/goal-day": {
                    v: 1,
                    now: "14:20",
                    meals: [
                        { time: "08:10", missing: [] },
                        { time: "10:40", missing: [] },
                        { time: "13:05", missing: [] },
                    ],
                    water: [
                        { time: "07:50", ml: 300 },
                        { time: "09:30", ml: 250 },
                        { time: "11:45", ml: 500 },
                    ],
                    foods: [],
                },
            };

            // macros.js (below) expects these two in scope.
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // Only the `_meta` merges (withAddedSugar, withSaturatedFat,
            // withNutrient, withMealItems, withNutrientSources and their
            // validators) are used here; this view draws no strip.
            /*@include shared/macros.js@*/

            // The `_meta` keys this view reads. A template cannot import, so
            // each must equal its constant in src/widgets.ts (src/mcp.test.ts
            // checks the assembled widget contains them).
            const ADDED_SUGAR_META_KEY = "nutrition-mcp.com/added-sugar";
            const SATURATED_FAT_META_KEY = "nutrition-mcp.com/saturated-fat";
            const SODIUM_META_KEY = "nutrition-mcp.com/sodium";
            const MEAL_ITEMS_META_KEY = "nutrition-mcp.com/meal-items";
            const NUTRIENT_SOURCES_META_KEY =
                "nutrition-mcp.com/nutrient-sources";
            const GOAL_DAY_META_KEY = "nutrition-mcp.com/goal-day";

            // Payload field per model key, and the colour token per key.
            const GP_FIELD = {
                calories: "calories",
                protein: "protein_g",
                carbs: "carbs_g",
                fat: "fat_g",
                fiber: "fiber_g",
                sugar: "sugar_g",
                added_sugar: "added_sugar_g",
                saturated: "saturated_fat_g",
                trans: "trans_fat_g",
                sodium: "sodium_mg",
                caffeine: "caffeine_mg",
                alcohol: "alcohol_g",
                water: "water_ml",
            };
            const GP_COLOR = {
                calories: "calories",
                protein: "protein",
                carbs: "carbs",
                fat: "fat",
                fiber: "fiber",
                sugar: "sugar",
                added_sugar: "added-sugar",
                saturated: "saturated",
                trans: "trans",
                sodium: "sodium",
                caffeine: "caffeine",
                alcohol: "alcohol",
                water: "water",
            };
            const MEAL_KEYS = Object.keys(GP_FIELD).filter(
                (k) => k !== "water",
            );

            // ---- formatting ------------------------------------------------
            function nf(v, dec) {
                try {
                    return new Intl.NumberFormat(WIDGET_LOCALE, {
                        minimumFractionDigits: dec,
                        maximumFractionDigits: dec,
                    }).format(v);
                } catch (_) {
                    return v.toFixed(dec);
                }
            }
            // A figure in its display unit, without the unit: kcal, mg and ml
            // whole; grams under 10 to one decimal when it has one; water in
            // litres, two decimals unless a whole tenth.
            function num(unit, v) {
                if (v == null || !Number.isFinite(v)) return "–";
                if (Math.abs(v) < 0.05) return nf(0, 0);
                if (unit === "L") {
                    const l = v / 1000;
                    return nf(
                        l,
                        Math.abs(l * 10 - Math.round(l * 10)) > 0.01 ? 2 : 1,
                    );
                }
                if (unit === "kcal" || unit === "mg" || unit === "ml")
                    return nf(Math.round(v), 0);
                return nf(
                    v,
                    Math.abs(v) < 10 && Math.abs(v - Math.round(v)) > 0.05
                        ? 1
                        : 0,
                );
            }
            const shown = (unit) => (unit === "ml" ? "L" : unit);
            function wu(unit, v) {
                const u = shown(unit);
                return `${num(u, v)} ${T.goalProgress.units[u]}`;
            }
            function amountText(amount, unit) {
                if (amount == null) return "";
                const n = nf(amount, Number.isInteger(amount) ? 0 : 1);
                return unit ? `${n} ${unit}` : n;
            }
            function dateText(iso) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
                if (!m) return String(iso || "");
                try {
                    return new Intl.DateTimeFormat(
                        WIDGET_LOCALE === "en" ? "en-GB" : WIDGET_LOCALE,
                        {
                            weekday: "short",
                            day: "numeric",
                            month: "short",
                            timeZone: "UTC",
                        },
                    )
                        .format(new Date(Date.UTC(+m[1], +m[2] - 1, +m[3])))
                        .replace(",", "");
                } catch (_) {
                    return iso;
                }
            }
            // The device's own calendar day: only a fallback, for a host that
            // dropped GOAL_DAY_META_KEY (whose `now` is the server's answer).
            function deviceToday(iso) {
                const d = new Date();
                const p = (n) => String(n).padStart(2, "0");
                return (
                    String(iso || "") ===
                    `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`
                );
            }
            function cap(s) {
                return s
                    ? s.charAt(0).toLocaleUpperCase(WIDGET_LOCALE) + s.slice(1)
                    : s;
            }
            function joinList(names) {
                const G = T.goalProgress;
                if (names.length <= 1) return names[0] || "";
                if (names.length === 2)
                    return tpl(G.listPair, { a: names[0], b: names[1] });
                return tpl(G.listMore, {
                    rest: names.slice(0, -1).join(G.listSep),
                    last: names[names.length - 1],
                });
            }
            const nameOf = (r) => T.goalProgress.names[r.key];
            const labelOf = (r) => T.goalProgress.labels[r.key];
            function drinksText(g) {
                const unit = gpDay && gpDay.drinkUnit;
                if (!(g > 0) || !DRINK_GRAMS[unit]) return "";
                const n = Math.round((g / DRINK_GRAMS[unit]) * 10) / 10;
                return plural(T.goalProgress.drinks[unit], n, { n: nf(n, 1) });
            }

            // ---- the day, from the payload and its `_meta` -------------------
            // A part's figure for the day: undefined when the part (or its day)
            // is absent, null when the day is "not recorded", else the value.
            function dayValue(part, date) {
                if (!part || !part.days || typeof part.days !== "object")
                    return undefined;
                if (!Object.prototype.hasOwnProperty.call(part.days, date))
                    return undefined;
                const v = part.days[date];
                return Number.isFinite(v) ? v : null;
            }
            function partOf(raw) {
                return raw &&
                    typeof raw === "object" &&
                    !Array.isArray(raw) &&
                    raw.v === 1
                    ? raw
                    : null;
            }
            function finiteOr(v, d) {
                return typeof v === "number" && Number.isFinite(v) ? v : d;
            }

            let gpDay = null;

            function buildDay(data, meta) {
                const date = data.date;
                const totals = data.totals || {};
                const m = (k) => (meta ? meta[k] : null);
                // The strip's own merges, so this view joins `_meta` exactly as
                // every other widget does: by position, only when counts agree.
                const as = addedSugarPayload(m(ADDED_SUGAR_META_KEY));
                const merged = withAddedSugar(
                    as,
                    addedSugarFor(as, [date]),
                    totals,
                    data.goals,
                    data.meals,
                );
                const sfRaw = m(SATURATED_FAT_META_KEY);
                Object.assign(
                    merged,
                    withSaturatedFat(
                        sfRaw,
                        [date],
                        merged.vals,
                        merged.goal,
                        merged.meals,
                    ),
                );
                const na = partOf(m(SODIUM_META_KEY));
                Object.assign(
                    merged,
                    withNutrient(
                        na,
                        "sodium_mg",
                        recordedMeanFor(na, [date]),
                        merged.vals,
                        merged.goal,
                        merged.meals,
                        true,
                    ),
                );
                const itemsMeta = mealItemsPayload(m(MEAL_ITEMS_META_KEY));
                const rows = withNutrientSources(
                    nutrientSourcesPayload(m(NUTRIENT_SOURCES_META_KEY)),
                    withMealItems(itemsMeta, merged.meals),
                    itemsMeta,
                );
                const dm = gpDayMetaOf(m(GOAL_DAY_META_KEY));
                const rowList = Array.isArray(rows) ? rows : [];
                const dayMeals =
                    dm && dm.meals.length === rowList.length ? dm.meals : null;

                const alcoholOn =
                    data.drink_unit === "us" || data.drink_unit === "uk";
                const g = merged.goal || {};
                const goals = {};
                for (const k of Object.keys(GP_FIELD)) {
                    goals[k] = finiteOr(g[GP_FIELD[k]], null);
                }
                const sf = saturatedFatPayload(sfRaw);
                const all = (field) =>
                    dayMeals &&
                    dayMeals.length > 0 &&
                    dayMeals.every((x) => x.missing.includes(field));
                const tot = {
                    calories: finiteOr(totals.calories, 0),
                    protein: finiteOr(totals.protein_g, 0),
                    carbs: finiteOr(totals.carbs_g, 0),
                    fat: finiteOr(totals.fat_g, 0),
                    fiber: all("fiber_g") ? null : finiteOr(totals.fiber_g, 0),
                    sugar: all("sugar_g") ? null : finiteOr(totals.sugar_g, 0),
                    added_sugar: dayValue(as, date),
                    saturated: dayValue(sf, date),
                    trans: dayValue(sf && sf.trans, date),
                    sodium: dayValue(na, date),
                    caffeine: finiteOr(totals.caffeine_mg, null),
                    alcohol: alcoholOn
                        ? finiteOr(totals.alcohol_g, null)
                        : null,
                    water: finiteOr(totals.water_ml, 0),
                };

                const meals = rowList.map((r, i) => {
                    const missing = dayMeals ? dayMeals[i].missing : [];
                    const v = {};
                    for (const k of MEAL_KEYS) {
                        const f = GP_FIELD[k];
                        v[k] = missing.includes(f)
                            ? null
                            : finiteOr(r[f], null);
                    }
                    if (!alcoholOn) v.alcohol = null;
                    // Ingredients: the strip's validated copies, plus sodium
                    // read from the same raw slot (the shared item validator
                    // predates it), by the same index.
                    let items = null;
                    if (Array.isArray(r.items) && r.items.length) {
                        const raw = itemsMeta ? itemsMeta.meals[i] : null;
                        const entries = mealItemEntries(raw);
                        items = r.items.map((it, k) => {
                            const iv = {};
                            for (const key of MEAL_KEYS) {
                                iv[key] = finiteOr(it[GP_FIELD[key]], null);
                            }
                            const src0 =
                                entries.length === r.items.length
                                    ? raw[entries[k].index]
                                    : null;
                            iv.sodium = finiteOr(src0 && src0.sodium_mg, null);
                            if (!alcoholOn) iv.alcohol = null;
                            const src = {};
                            const tags = it.sourceTags || {};
                            for (const key of MEAL_KEYS) {
                                const t = tags[GP_FIELD[key]] || tags.calories;
                                if (t && t.s) src[key] = t.s;
                            }
                            return {
                                name: it.name,
                                amount: it.amount,
                                unit: it.unit,
                                v: iv,
                                src,
                            };
                        });
                    }
                    return {
                        name:
                            typeof r.description === "string"
                                ? r.description
                                : "",
                        type:
                            typeof r.meal_type === "string"
                                ? r.meal_type
                                : null,
                        time: dayMeals ? dayMeals[i].time : null,
                        items,
                        v,
                    };
                });

                return {
                    date,
                    today: dm ? dm.now != null : deviceToday(date),
                    now: dm ? dm.now : null,
                    alcoholOn,
                    drinkUnit: alcoholOn ? data.drink_unit : null,
                    goals,
                    totals: tot,
                    meals,
                    water: dm ? dm.water : null,
                    waterEntries: finiteOr(data.water_entries, 0),
                    hasLog:
                        finiteOr(data.meal_count, 0) > 0 ||
                        finiteOr(data.water_entries, 0) > 0,
                    foods: dm ? dm.foods : null,
                    weight:
                        data.weight && typeof data.weight === "object"
                            ? data.weight
                            : null,
                };
            }

            // ---- view state ---------------------------------------------------
            // level 0: counters and the card; 1: the goals list. flt: a status
            // filter; sel: the open goal (one at a time); mo: the open meal row.
            let S = { level: 0, flt: null, sel: null, mo: null };
            let prev = null;
            let painted = 0;
            let closing = false;

            const reduceMotion = () => {
                try {
                    return window.matchMedia("(prefers-reduced-motion: reduce)")
                        .matches;
                } catch (_) {
                    return true;
                }
            };
            const isDesktop = () => {
                try {
                    return window.matchMedia("(min-width: 640px)").matches;
                } catch (_) {
                    return false;
                }
            };

            // ---- markup pieces ------------------------------------------------
            const DIGITS = "0123456789"
                .repeat(3)
                .split("")
                .map((d) => `<span>${d}</span>`)
                .join("");
            // An odometer number. `first` staggers the digits from that
            // fraction of the spin to its end, as the design's reel does.
            function reel(str, first, total) {
                const n = (str.match(/[0-9]/g) || []).length;
                let di = 0;
                return String(str)
                    .split("")
                    .map((ch) => {
                        if (!/[0-9]/.test(ch))
                            return `<span>${esc(ch === " " ? " " : ch)}</span>`;
                        const i = di++;
                        const stop =
                            n > 1 ? first + ((1 - first) * i) / (n - 1) : first;
                        const dur = (total * stop).toFixed(2);
                        return `<span class="rl"><span class="rs" style="--d:${ch};--dur:${dur}s">${DIGITS}</span></span>`;
                    })
                    .join("");
            }
            const CHEV_DOWN = `<svg class="achev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M6 9l6 6 6-6"></path></svg>`;
            const CHEV_RIGHT = (cls) =>
                `<svg class="${cls}" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><path d="M9 6l6 6-6 6"></path></svg>`;

            // A goal row's values: the line under its label, and the figure
            // on its right (value + word). A limit is stated as a share of it,
            // never as an allowance left.
            function rowText(r, today) {
                const G = T.goalProgress;
                let pv;
                let pw = "";
                if (r.st === "nr") pv = G.notRecorded;
                else if (r.kind === "target") {
                    if (r.st === "ok") pv = today ? G.done : G.met;
                    else {
                        pv = wu(r.unit, r.g - r.t);
                        pw = today ? G.toGo : G.short;
                    }
                } else if (r.st === "over") {
                    pv = "+" + wu(r.unit, r.t - r.g);
                    pw = G.over;
                } else if (r.kind === "budget") {
                    pv = wu(r.unit, Math.max(r.g - r.t, 0));
                    pw = today ? G.left : G.under;
                } else if (r.g > 0) {
                    pv = nf(Math.round((r.t / r.g) * 100), 0) + "%";
                    pw = G.ofLimit;
                } else {
                    pv = wu(r.unit, r.t);
                }
                let sec =
                    r.st === "nr"
                        ? G.noDayTotal
                        : tpl(G.ofGoal, {
                              value: num(shown(r.unit), r.t),
                              goal: wu(r.unit, r.g),
                          });
                if (r.key === "alcohol" && r.t > 0)
                    sec += " · " + drinksText(r.t);
                return { pv, pw, sec };
            }

            function verdict(day, groups, max) {
                const G = T.goalProgress;
                const { over, near, togo, ok, scored } = groups;
                const names = (rs) => rs.map(nameOf);
                if (!day.hasLog)
                    return day.today ? G.nothingToday : G.nothingPast;
                // Every goal set lacks a day total: nothing to judge.
                if (!scored.length) return G.sections.nr;
                if (!over.length && !togo.length && !near.length) {
                    return plural(
                        day.today ? G.allOnTrack : G.allMet,
                        scored.length,
                        {
                            n: nf(scored.length, 0),
                        },
                    );
                }
                const n = (k) => nf(k, 0);
                const full = [];
                const short = [];
                const mid = [];
                if (!day.today) {
                    if (over.length) {
                        full.push(
                            over.length <= 2
                                ? tpl(G.pastOverNamed, {
                                      list: joinList(names(over)),
                                  })
                                : plural(G.pastOverMany, over.length, {
                                      n: n(over.length),
                                  }),
                        );
                        short.push(
                            plural(G.pastBriefOver, over.length, {
                                n: n(over.length),
                            }),
                        );
                    }
                    if (togo.length) {
                        full.push(
                            togo.length <= 3
                                ? tpl(G.pastShortNamed, {
                                      list: joinList(names(togo)),
                                  })
                                : plural(G.pastShortMany, togo.length, {
                                      n: n(togo.length),
                                  }),
                        );
                        short.push(
                            plural(G.pastBriefShort, togo.length, {
                                n: n(togo.length),
                            }),
                        );
                    }
                    if (!full.length && near.length) {
                        full.push(
                            tpl(G.pastCloseNamed, {
                                list: joinList(names(near)),
                            }),
                        );
                    }
                    short.push(
                        plural(G.pastBriefMet, ok.length, { n: n(ok.length) }),
                    );
                    const f = cap(full.join(G.titleSep));
                    return f.length <= max
                        ? f
                        : cap(short.join(G.titleSepPast));
                }
                if (over.length) {
                    full.push(
                        over.length === 1
                            ? tpl(G.overOne, { a: nameOf(over[0]) })
                            : over.length === 2
                              ? tpl(G.overNamed, {
                                    list: joinList(names(over)),
                                })
                              : plural(G.overMany, over.length, {
                                    n: n(over.length),
                                }),
                    );
                    short.push(
                        over.length === 1
                            ? tpl(G.briefOverOne, { a: nameOf(over[0]) })
                            : plural(G.briefOverMany, over.length, {
                                  n: n(over.length),
                              }),
                    );
                }
                if (!over.length && near.length) {
                    full.push(
                        near.length <= 2
                            ? tpl(G.nearNamed, { list: joinList(names(near)) })
                            : plural(G.nearMany, near.length, {
                                  n: n(near.length),
                              }),
                    );
                    short.push(
                        plural(G.briefNear, near.length, { n: n(near.length) }),
                    );
                }
                if (togo.length) {
                    full.push(
                        togo.length <= 3
                            ? tpl(G.toGoNamed, { list: joinList(names(togo)) })
                            : plural(G.toGoMany, togo.length, {
                                  n: n(togo.length),
                              }),
                    );
                    mid.push(
                        plural(G.toGoMany, togo.length, { n: n(togo.length) }),
                    );
                    short.push(
                        togo.length === 1
                            ? tpl(G.briefToGoOne, { a: nameOf(togo[0]) })
                            : plural(G.briefToGoMany, togo.length, {
                                  n: n(togo.length),
                              }),
                    );
                }
                const f = cap(full.join(G.titleSep));
                if (f.length <= max) return f;
                const m2 = cap(
                    [...full.slice(0, full.length - mid.length), ...mid].join(
                        G.titleSep,
                    ),
                );
                if (mid.length && m2.length <= max) return m2;
                return cap(short.join(G.titleSep));
            }

            function counterHtml(st, i, n, label) {
                const G = T.goalProgress;
                const on = S.level >= 1 && S.flt === st;
                const aria = tpl(n ? G.counterAria : G.counterAriaZero, {
                    label,
                    n: nf(n, 0),
                });
                const d = 0.05 + i * 0.07;
                return `<button type="button" class="reset ctr s-${st}${n ? "" : " zero"}${on ? " on" : ""}" style="--i:${i}" data-act="ctr" data-st="${st}" data-fid="ctr-${st}" aria-pressed="${on}" aria-label="${esc(aria)}"${n ? "" : " disabled"}><b class="cn num" aria-hidden="true">${reel(nf(n, 0), 0.45, 1.8 + d)}</b><span class="cl" aria-hidden="true">${esc(label)}</span></button>`;
            }

            function cellHtml(c, i) {
                const G = T.goalProgress;
                const r = c.row;
                let key;
                let v;
                if (c.kind === "calLeft") {
                    key = G.cellCaloriesLeft;
                    v = wu(r.unit, Math.max(r.g - r.t, 0));
                } else if (c.kind === "calOver") {
                    key = G.cellCalories;
                    v = tpl(G.cellOver, { value: wu(r.unit, r.t - r.g) });
                } else if (c.kind === "toGo") {
                    key = tpl(G.cellToGo, { label: labelOf(r) });
                    v = wu(r.unit, r.g - r.t);
                } else if (c.kind === "over") {
                    key = labelOf(r);
                    v = tpl(G.cellOver, { value: wu(r.unit, r.t - r.g) });
                } else {
                    key = labelOf(r);
                    v = tpl(G.cellPct, {
                        pct: nf(Math.round((r.t / r.g) * 100), 0),
                    });
                }
                return `<div class="kvr s-${r.st}" role="group" aria-label="${esc(tpl(G.cellAria, { key, value: v }))}"><span class="kk" aria-hidden="true"><span class="ke">${r.emoji}</span>${esc(key)}</span><b class="kvv num" aria-hidden="true">${reel(v, 0.5, 2.2 + i * 0.15)}</b></div>`;
            }

            function hintHtml(h, day) {
                if (!h) return "";
                const G = T.goalProgress;
                let k;
                let txt;
                if (h.kind === "over") {
                    k = G.hintOverK;
                    const vars = {
                        over: wu("kcal", h.cal.t - h.cal.g),
                        goal: wu("kcal", h.cal.g),
                    };
                    txt = h.water
                        ? tpl(G.hintOverWater, {
                              ...vars,
                              left: wu("ml", h.water.g - h.water.t),
                          })
                        : tpl(G.hintOver, vars);
                } else if (h.kind === "food") {
                    k = G.hintFoodK;
                    const a = amountText(h.food.amount, h.food.unit);
                    const facts = [
                        `${wu(h.row.unit, h.food.v[h.row.key])} ${nameOf(h.row)}`,
                        wu("kcal", h.food.v.calories),
                    ].join(", ");
                    txt = tpl(G.hintFood, {
                        food: a ? `${h.food.name}, ${a}` : h.food.name,
                        facts,
                    });
                } else if (h.kind === "toGo") {
                    k = G.hintToGoK;
                    txt = tpl(G.hintList, {
                        list: h.rows
                            .map((r) => `${wu(r.unit, r.g - r.t)} ${nameOf(r)}`)
                            .join(" · "),
                    });
                } else if (h.kind === "water") {
                    k = G.hintWaterK;
                    const left = h.row.g - h.row.t;
                    const n = Math.ceil(left / 250);
                    txt = plural(G.waterLeft, n, {
                        left: wu("ml", left),
                        n: nf(n, 0),
                    });
                } else if (h.kind === "limits") {
                    // Crossed limits, then the close ones, each with its lead.
                    const part = (lead, rs) =>
                        `<b>${esc(lead)}</b> ${esc(tpl(G.hintList, { list: joinList(rs.map(nameOf)) }))}`;
                    const parts = [];
                    if (h.over.length)
                        parts.push(part(G.hintOverLimitK, h.over));
                    if (h.near.length) parts.push(part(G.hintNearK, h.near));
                    return `<div class="hint"><span class="hi" aria-hidden="true">🍽️</span><span>${parts.join(" ")}</span></div>`;
                } else {
                    k = G.hintAllK;
                    txt = G.hintAll;
                }
                return `<div class="hint"><span class="hi" aria-hidden="true">🍽️</span><span><b>${esc(k)}</b> ${esc(txt)}</span></div>`;
            }

            function srcWord(s) {
                return T.goalProgress.sources[s] || "";
            }

            function detailHtml(r, day, rows, isNew) {
                const G = T.goalProgress;
                const out = [];
                const t = rowText(r, day.today);
                out.push(
                    `<div class="ctx num">${esc(t.sec)} · ${esc(G.kinds[r.kind] || "")}</div>`,
                );
                if (r.st === "over" || r.st === "near") {
                    const b = gpBiggest(r, day.meals);
                    if (b) {
                        const a = amountText(b.amount, b.unit);
                        const name = a ? `${b.name} (${a})` : b.name;
                        out.push(
                            `<div class="lead"><b>${esc(G.leadK)}</b>${esc(tpl(G.leadV, { name, value: wu(r.unit, b.v) }))}</div>`,
                        );
                    }
                }
                if (r.key === "water") {
                    if (r.st === "togo" && day.today) {
                        const left = r.g - r.t;
                        const n = Math.ceil(left / 250);
                        out.push(
                            `<div class="msg">${esc(plural(G.waterLeft, n, { left: wu("ml", left), n: nf(n, 0) }))}</div>`,
                        );
                    }
                    const w = (day.water || []).slice();
                    if (w.length) {
                        const total = w.reduce((s, x) => s + x.ml, 0) || 1;
                        out.push(
                            `<div class="mlh">${esc(day.today ? G.waterToday : G.waterPast)}</div><div class="mls">${w
                                .map(
                                    (x) =>
                                        `<div class="mlg static"><span class="nmf num">${esc(x.time || "–")}</span><b class="num">${nf(Math.round(x.ml), 0)} ${esc(G.units.ml)}</b><span class="pc num">${nf(Math.round((x.ml / total) * 100), 0)}%</span>${CHEV_RIGHT("mc hide")}</div>`,
                                )
                                .join("")}</div>`,
                        );
                    } else if (!day.waterEntries) {
                        out.push(
                            `<div class="msg">${esc(day.today ? G.noWaterToday : G.noWaterPast)}</div>`,
                        );
                    }
                    return out.join("");
                }
                if (r.st === "togo" && day.today) {
                    const foods = gpFoodsFor(r, rows, day.foods, 2);
                    if (foods.length) {
                        out.push(
                            `<div class="gap"><div class="gaph">${esc(G.gapTitle)}</div>${foods
                                .map((f) => {
                                    const a = amountText(f.amount, f.unit);
                                    return `<div class="gapr"><span>${esc(a ? `${f.name}, ${a}` : f.name)}</span><b class="num">${wu(r.unit, f.v[r.key])}</b></div>`;
                                })
                                .join("")}</div>`,
                        );
                    }
                }
                if (!day.meals.length) {
                    out.push(
                        `<div class="msg">${esc(day.today ? G.noMealsToday : G.noMealsPast)}</div>`,
                    );
                    return out.join("");
                }
                const bd = gpBreakdown(r, day.meals);
                if (r.st === "nr") {
                    const miss = day.meals.filter((m) => m.v[r.key] == null);
                    const vars = {
                        label: labelOf(r),
                        goal: wu(r.unit, r.g),
                        kind: G.kinds[r.kind],
                    };
                    out.push(
                        `<div class="msg">${esc(
                            miss.length === 1
                                ? tpl(G.nrOne, { ...vars, meal: miss[0].name })
                                : plural(G.nrMany, miss.length, {
                                      ...vars,
                                      n: nf(miss.length, 0),
                                  }),
                        )}</div>`,
                    );
                }
                // The open meal: the one picked, else the largest with items.
                let mo = S.mo;
                if (mo === "auto") {
                    const c = bd.rows.find((x) => day.meals[x.i].items && x.v);
                    mo = c ? c.i : null;
                }
                if (bd.rows.length) {
                    out.push(
                        `<div class="mlh">${esc(G.mealsTitle)}</div><div class="mls">`,
                    );
                    for (const x of bd.rows) {
                        const m = day.meals[x.i];
                        const items = m.items ? gpItemsFor(r.key, m.items) : [];
                        const open = mo === x.i && items.length > 0;
                        const metaBits = [
                            m.time,
                            m.type && G.mealTypes[m.type]
                                ? G.mealTypes[m.type]
                                : G.mealFallback,
                        ].filter(Boolean);
                        if (!m.items) metaBits.push(G.totalOnly);
                        const val =
                            x.v == null ? G.notRecorded : wu(r.unit, x.v);
                        const cls =
                            "reset mlg" +
                            (x.v == null ? " nrm" : "") +
                            (open ? " open" : "") +
                            (items.length ? "" : " static");
                        const attrs = items.length
                            ? ` data-act="meal" data-i="${x.i}" data-fid="meal-${r.key}-${x.i}" aria-expanded="${open}"`
                            : ` tabindex="-1" aria-disabled="true"`;
                        const tag = items.length ? "button" : "div";
                        out.push(
                            `<${tag}${tag === "button" ? ' type="button"' : ""} class="${cls}"${attrs}><span class="nmf">${esc(m.name)}<span>${esc(metaBits.join(" · "))}</span></span><b class="num">${esc(val)}</b><span class="pc num">${x.share == null ? "" : nf(x.share, 0) + "%"}</span>${CHEV_RIGHT(items.length ? (open ? "mc open" : "mc") : "mc hide")}</${tag}>`,
                        );
                        if (open) {
                            const itNew =
                                isNew ||
                                !prev ||
                                prev.mo !== S.mo ||
                                prev.sel !== S.sel;
                            out.push(
                                `<div class="itl${itNew ? " new" : ""}">${items
                                    .map((it) => {
                                        const iv = it.v[r.key];
                                        const s = it.src[r.key];
                                        const a = amountText(
                                            it.amount,
                                            it.unit,
                                        );
                                        const srcTxt = s
                                            ? `<span class="${s === "estimate" ? "est" : ""}">${esc(srcWord(s))}</span>`
                                            : "";
                                        const im = [a ? esc(a) : "", srcTxt]
                                            .filter(Boolean)
                                            .join(" · ");
                                        return `<div class="itr"><span>${esc(it.name)}</span><span class="iv num">${iv == null ? "–" : wu(r.unit, iv)}</span>${im ? `<span class="im">${im}</span>` : ""}</div>`;
                                    })
                                    .join("")}</div>`,
                            );
                        }
                    }
                    out.push("</div>");
                }
                if (bd.none) {
                    out.push(
                        `<div class="msg">${esc(plural(G.otherMealsNone, bd.none, { n: nf(bd.none, 0) }))}</div>`,
                    );
                }
                if (bd.missing && r.st !== "nr") {
                    out.push(
                        `<div class="msg">${esc(plural(G.missingNote, bd.missing, { n: nf(bd.missing, 0) }))}</div>`,
                    );
                }
                return out.join("");
            }

            function rowHtml(r, i, chip, day, rows, newKeys) {
                const G = T.goalProgress;
                const sel = S.sel === r.key;
                const t = rowText(r, day.today);
                const label =
                    chip && r.key === "saturated" ? G.satFatShort : labelOf(r);
                const kw = G.kinds[r.kind] || "";
                const aria = tpl(G.rowAria, {
                    label: labelOf(r),
                    kind: kw,
                    status: [t.pv, t.pw].filter(Boolean).join(" "),
                    detail: t.sec,
                });
                const isNew = newKeys.has("acc:" + r.key);
                const detailNew = sel && (!prev || prev.sel !== r.key);
                return `<div class="acc s-${r.st}${sel ? " sel" : ""}${isNew ? " new" : ""}" data-key="${r.key}" style="--mc:var(--${GP_COLOR[r.key]});--i:${i}"><button type="button" class="reset accH" data-act="pick" data-k="${r.key}" data-fid="acc-${r.key}" aria-expanded="${sel}" aria-label="${esc(aria)}"><span class="em" aria-hidden="true">${r.emoji}</span><span class="ab" aria-hidden="true"><span class="lb"><span class="nm">${esc(label)}</span><span class="kw">${esc(kw)}</span></span><span class="sec2 num">${esc(t.sec)}</span></span><span class="pri num" aria-hidden="true"><span class="pv">${esc(t.pv)}</span> <span class="pw">${esc(t.pw)}</span></span>${CHEV_DOWN}</button>${sel ? `<div class="accB${detailNew ? " new" : ""}">${detailHtml(r, day, rows, detailNew)}</div>` : ""}</div>`;
            }

            function footHtml(day, groups, cls) {
                const G = T.goalProgress;
                const lines = [];
                const w = day.weight;
                if (w && (w.current != null || w.target != null)) {
                    const u = G.units[w.unit] || esc(w.unit || "kg");
                    const kg = (v) => `${nf(v, 1)} ${u}`;
                    if (w.current != null) {
                        let state;
                        if (w.target == null) state = G.weightNoGoal;
                        else {
                            const d =
                                Math.round((w.current - w.target) * 10) / 10;
                            state =
                                Math.abs(d) < 0.05
                                    ? tpl(G.weightAt, { target: kg(w.target) })
                                    : tpl(
                                          d > 0 ? G.weightAbove : G.weightBelow,
                                          {
                                              delta: kg(Math.abs(d)),
                                              target: kg(w.target),
                                          },
                                      );
                        }
                        const on = w.logged_on
                            ? ` <span>(${esc(tpl(G.weightLatest, { date: dateText(w.logged_on) }))})</span>`
                            : "";
                        lines.push(
                            `<div><span class="fe" aria-hidden="true">⚖️</span>${esc(G.weight)} <b class="num">${kg(w.current)}</b> · ${esc(state)}${on}</div>`,
                        );
                    } else {
                        lines.push(
                            `<div><span class="fe" aria-hidden="true">⚖️</span>${esc(G.weight)} · ${esc(tpl(G.weightNoneGoal, { target: kg(w.target) }))}</div>`,
                        );
                    }
                }
                if (groups.trans) {
                    lines.push(
                        `<div><span class="fe" aria-hidden="true">🍟</span>${esc(G.labels.trans)} <b class="num">${wu("g", groups.trans.t)}</b> · ${esc(G.transNote)}</div>`,
                    );
                }
                return lines.length
                    ? `<div class="foot ${cls}">${lines.join("")}</div>`
                    : "";
            }

            function totalsList(day) {
                const G = T.goalProgress;
                const parts = [];
                for (const k of ["calories", "protein", "carbs", "fat"]) {
                    const v = day.totals[k];
                    const u = k === "calories" ? "kcal" : "g";
                    parts.push(
                        k === "calories"
                            ? wu(u, v)
                            : tpl(G.goalItem, {
                                  value: wu(u, v),
                                  name: G.names[k],
                              }),
                    );
                }
                if (day.totals.water > 0)
                    parts.push(
                        tpl(G.goalItem, {
                            value: wu("ml", day.totals.water),
                            name: G.names.water,
                        }),
                    );
                return parts.join(" · ");
            }

            function goalsList(rows) {
                const G = T.goalProgress;
                return rows
                    .filter((r) => r.st !== "none")
                    .map((r) =>
                        r.key === "calories"
                            ? wu(r.unit, r.g)
                            : tpl(
                                  r.kind === "limit"
                                      ? G.goalLimitItem
                                      : G.goalItem,
                                  {
                                      value: wu(r.unit, r.g),
                                      name: nameOf(r),
                                  },
                              ),
                    )
                    .join(" · ");
            }

            // ---- the whole view ---------------------------------------------
            function viewHtml(day) {
                const G = T.goalProgress;
                const rows = gpRows(day);
                const groups = gpGroups(rows);
                const goalRows = rows.filter((r) => r.st !== "none");
                const empty = !day.hasLog;
                const noGoals = !empty && goalRows.length === 0;
                const when = day.today
                    ? day.now
                        ? tpl(G.todayAt, { time: day.now })
                        : G.today
                    : dateText(day.date);
                const eyebrow = tpl(G.eyebrow, { when });
                let title;
                if (noGoals) title = `<span>${esc(G.noGoalsTitle)}</span>`;
                else {
                    const td = verdict(day, groups, 74);
                    const tm = verdict(day, groups, 54);
                    title =
                        td === tm
                            ? `<span>${esc(td)}</span>`
                            : `<span class="t-d">${esc(td)}</span><span class="t-m">${esc(tm)}</span>`;
                }
                const interactive = !empty && !noGoals;
                const lv2 = interactive && S.level >= 1;
                const head = interactive
                    ? `<button type="button" class="reset gtop" data-act="tog" data-fid="tog-h" aria-expanded="${lv2}"><span class="eyb2">${esc(eyebrow)}</span><span class="t">${title}</span></button>`
                    : `<div class="gtop"><span class="eyb2">${esc(eyebrow)}</span><span class="t">${title}</span></div>`;

                let counters = "";
                if (interactive) {
                    const labels = day.today ? G.counters : G.countersPast;
                    counters = `<div class="ctrs" role="group" aria-label="${esc(G.countersAria)}">${[
                        "over",
                        "near",
                        "togo",
                        "ok",
                    ]
                        .map((st, i) =>
                            counterHtml(st, i, groups[st].length, labels[st]),
                        )
                        .join("")}</div>`;
                    if (groups.nr.length) {
                        counters += `<div class="nrnote">${esc(tpl(day.today ? G.nrNoteToday : G.nrNotePast, { list: joinList(groups.nr.map(nameOf)) }))}</div>`;
                    }
                }
                const top = `<div class="dtop"><div>${head}</div><div>${counters}</div></div>`;

                if (!interactive) {
                    const msg = empty
                        ? [
                              day.today ? G.emptyToday : G.emptyPast,
                              goalRows.length
                                  ? tpl(G.dailyGoals, { list: goalsList(rows) })
                                  : "",
                          ]
                              .filter(Boolean)
                              .join(" ")
                        : tpl(day.today ? G.noGoalsToday : G.noGoalsPast, {
                              list: totalsList(day),
                          });
                    return `<div class="gcard">${top}<div class="gempty">${esc(msg)}</div>${footHtml(day, groups, "fb")}</div>`;
                }

                const showRest = day.today;
                let rest = "";
                if (showRest) {
                    const cells = gpRestCells(rows, 5);
                    const hint = hintHtml(gpHint(rows, day), day);
                    rest = `<div class="rest" style="--kvn:${cells.length || 1}">${cells.length ? `<div class="rh">${esc(G.restTitle)}</div><div class="kv">${cells.map(cellHtml).join("")}</div>` : ""}${hint}</div>`;
                }
                const big = `<button type="button" class="reset bigchev" data-act="tog" data-fid="tog-b" aria-expanded="${lv2}"><span>${esc(lv2 ? G.showLess : G.showMore)}</span><svg class="nchev${lv2 ? " open" : ""}" width="14" height="9" viewBox="0 0 34 22" aria-hidden="true" style="fill:none;stroke-width:6.5;stroke-linecap:round;stroke-linejoin:round"><path d="M5 5l12 12 12-12"></path></svg></button>`;

                let list = "";
                const newKeys = new Set();
                if (lv2) {
                    const seen =
                        prev && prev.level >= 1 ? prev.keys : new Set();
                    let ri = 0;
                    const SECT = day.today ? G.sections : G.sectionsPast;
                    const secs = ["over", "near", "togo", "ok", "nr"]
                        .map((st) => {
                            const rs = groups[st];
                            if (!rs.length) return "";
                            if (S.flt && S.flt !== st) return "";
                            const chip = st === "ok" || st === "nr";
                            const secNew = !seen.has("sec:" + st);
                            for (const r of rs) {
                                if (!seen.has("acc:" + r.key))
                                    newKeys.add("acc:" + r.key);
                            }
                            const items = rs
                                .map((r) =>
                                    rowHtml(r, ri++, chip, day, rows, newKeys),
                                )
                                .join("");
                            const showAll =
                                S.flt === st
                                    ? `<button type="button" class="reset showall" data-act="all" data-fid="all-${st}">${esc(G.showAll)}</button>`
                                    : "";
                            return `<section class="sec s-${st}${secNew ? " new" : ""}" style="--i:${ri}" aria-label="${esc(SECT[st])}" data-sec="${st}"><div class="sech"><span class="pill">${esc(SECT[st])}</span><span class="secn num">${nf(rs.length, 0)}</span>${showAll}</div><div class="${chip ? "chips" : "srows"}">${items}</div></section>`;
                        })
                        .join("");
                    list = `<div class="rows">${secs}</div>`;
                }
                const keys = new Set();
                if (lv2) {
                    for (const st of ["over", "near", "togo", "ok", "nr"]) {
                        if (S.flt && S.flt !== st) continue;
                        if (groups[st].length) keys.add("sec:" + st);
                        groups[st].forEach((r) => keys.add("acc:" + r.key));
                    }
                }
                paintKeys = keys;

                const dCls =
                    "dbody" +
                    (lv2 ? " lv2" : " lv1") +
                    (showRest ? "" : " nocard");
                const foot = lv2 ? footHtml(day, groups, "fl") : "";
                const footB = lv2 ? footHtml(day, groups, "fb") : "";
                const coll = lv2
                    ? `<button type="button" class="reset collall${prev && prev.level >= 1 ? "" : " new"}" data-act="collapse" data-fid="collall"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><path d="M7 11l5-5 5 5"></path><path d="M7 18l5-5 5 5"></path></svg><span>${esc(G.collapseAll)}</span></button>`
                    : "";
                return `<div class="gcard">${top}<div class="${dCls}"><div class="dleft">${rest}${foot}</div>${big}${list}</div>${footB}${coll}</div>`;
            }
            let paintKeys = new Set();

            // ---- painting and interaction -----------------------------------
            function paint(focusFid) {
                const host = document.getElementById("gp");
                if (!host || !gpDay) return;
                const fid =
                    focusFid ||
                    (document.activeElement &&
                        document.activeElement.dataset &&
                        document.activeElement.dataset.fid);
                host.innerHTML = viewHtml(gpDay);
                host.classList.remove("intro");
                prev = Object.assign({}, S, { keys: paintKeys });
                if (fid) {
                    const el =
                        host.querySelector(`[data-fid="${fid}"]`) ||
                        host.querySelector(".gtop");
                    if (el && el.focus) el.focus({ preventScroll: true });
                }
            }

            // Desktop only: rows slide from where they were to where they are
            // (FLIP), so a filter or an opened goal reads as a reflow rather
            // than a jump. Mobile and reduced motion apply the change at once.
            function flip(apply) {
                const host = document.getElementById("gp");
                if (
                    !host ||
                    reduceMotion() ||
                    !isDesktop() ||
                    !Element.prototype.animate
                ) {
                    apply();
                    return;
                }
                const q = () =>
                    Array.from(host.querySelectorAll(".rows .acc[data-key]"));
                const first = new Map(
                    q().map((e) => [e.dataset.key, e.getBoundingClientRect()]),
                );
                apply();
                q().forEach((e) => {
                    const fr = first.get(e.dataset.key);
                    if (!fr) return;
                    const l = e.getBoundingClientRect();
                    const dx = fr.left - l.left;
                    const dy = fr.top - l.top;
                    const dw = l.width - fr.width;
                    const dh = l.height - fr.height;
                    if (
                        Math.abs(dx) < 0.5 &&
                        Math.abs(dy) < 0.5 &&
                        Math.abs(dw) < 1 &&
                        Math.abs(dh) < 1
                    )
                        return;
                    const k0 = { transform: `translate(${dx}px, ${dy}px)` };
                    const k1 = { transform: "translate(0px, 0px)" };
                    if (dw > 1 || dh > 1) {
                        k0.clipPath = `inset(0px ${Math.max(dw, 0)}px ${Math.max(dh, 0)}px 0px round 16px)`;
                        k1.clipPath = "inset(0px 0px 0px 0px round 16px)";
                    }
                    e.animate([k0, k1], {
                        duration: Math.min(
                            820,
                            560 + Math.hypot(dx, dy) * 0.35,
                        ),
                        easing: "cubic-bezier(.22, 1, .32, 1)",
                        fill: "backwards",
                    });
                });
            }

            function collapse() {
                if (closing) return;
                const done = () => {
                    closing = false;
                    S = { level: 0, flt: null, sel: null, mo: null };
                    paint("tog-h");
                };
                const card = document.querySelector("#gp .gcard");
                if (!card || reduceMotion()) {
                    done();
                    return;
                }
                closing = true;
                card.classList.add("closing");
                setTimeout(done, 520);
            }

            function onClick(e) {
                const el =
                    e.target &&
                    e.target.closest &&
                    e.target.closest("[data-act]");
                if (!el || !gpDay || closing) return;
                const act = el.dataset.act;
                if (act === "tog") {
                    if (S.level === 0) {
                        S = { level: 1, flt: null, sel: null, mo: null };
                        paint();
                    } else collapse();
                } else if (act === "ctr") {
                    if (el.disabled) return;
                    const st = el.dataset.st;
                    if (S.level === 0) {
                        S = { level: 1, flt: st, sel: null, mo: null };
                        paint();
                        setTimeout(() => {
                            const sec = document.querySelector(
                                `#gp [data-sec="${st}"]`,
                            );
                            if (sec && sec.scrollIntoView)
                                sec.scrollIntoView({
                                    behavior: reduceMotion()
                                        ? "auto"
                                        : "smooth",
                                    block: "nearest",
                                });
                        }, 140);
                    } else {
                        const on = S.flt === st;
                        flip(() => {
                            S = {
                                level: 1,
                                flt: on ? null : st,
                                sel: null,
                                mo: null,
                            };
                            paint();
                        });
                    }
                } else if (act === "all") {
                    // The button goes with the filter: focus its counter.
                    const st = S.flt;
                    flip(() => {
                        S = Object.assign({}, S, { flt: null });
                        paint(`ctr-${st}`);
                    });
                } else if (act === "pick") {
                    const k = el.dataset.k;
                    const sel = S.sel === k;
                    flip(() => {
                        S = Object.assign(
                            {},
                            S,
                            sel
                                ? { sel: null, mo: null }
                                : { sel: k, mo: "auto" },
                        );
                        paint();
                    });
                } else if (act === "meal") {
                    const i = Number(el.dataset.i);
                    // "auto" resolved to a row on the last paint; reading the
                    // button's own state makes the second click close it.
                    const open = el.getAttribute("aria-expanded") === "true";
                    S = Object.assign({}, S, { mo: open ? null : i });
                    paint();
                } else if (act === "collapse") {
                    collapse();
                }
            }

            let __widgetApi = null;
            let wired = false;

            // `resultMeta` is the tool result's `_meta` (or null — see
            // bridge.js). Everything it carries is optional: without it the
            // view still shows every goal in structuredContent.
            function render(data, resultMeta) {
                const root = document.getElementById("root");
                setLocale(
                    pickLocale(
                        data && data.locale,
                        __widgetApi && __widgetApi.hostContext
                            ? __widgetApi.hostContext.locale
                            : null,
                    ),
                );
                if (!data || typeof data !== "object") {
                    root.innerHTML = "";
                    return;
                }
                gpDay = buildDay(data, resultMeta);
                S = { level: 0, flt: null, sel: null, mo: null };
                prev = null;
                // One assignment with the whole markup (the static renderer
                // reads root.innerHTML); interactions repaint #gp only, so the
                // bridge's settings footer after it stays.
                root.innerHTML = `<div id="gp" class="intro">${viewHtml(gpDay)}</div>`;
                prev = Object.assign({}, S, { keys: paintKeys });
                painted++;
                if (!wired && root.addEventListener) {
                    wired = true;
                    root.addEventListener("click", onClick);
                }
            }

            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (payload.totals || payload.date) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "goal-progress-widget",
                // A function: bridge.js calls it with the strings for the
                // browser language, since the payload's locale isn't known yet.
                loading: (strings) =>
                    '<div class="empty"><div class="big">🎯</div><div>' +
                    esc(strings.goalProgress.loading) +
                    "</div></div>",
                coerce,
                render,
                sample: SAMPLE,
                sampleMeta: SAMPLE_META,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
