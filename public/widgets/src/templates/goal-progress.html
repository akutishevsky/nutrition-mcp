<!doctype html>
<!--
  Goal progress widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts.

  One Dawn card, on nutrition-summary's tiered strip: a header naming the day
  and what was logged on it, the calorie panel, the energy split three-up, the
  limits a size down, water as the closing bar — and, after water, the weight
  row. Weight is a standing metric (the latest reading overall against the
  target), not a per-day total, so it is not a tile on the ladder; but it IS a
  control on the strip, handed to macroPanel through `opts.extra`, so it opens
  the strip's one shared drawer (the track between reading and target) and
  shares its cross-close, ✕, Escape and focus hand-back with the tiles. The
  only markup this widget owns is that row, its drawer body and the track.

  Data arrives as the `structuredContent` of the get_goal_progress tool result;
  the shared bridge (shared/bridge.js) reads it across host conventions and
  calls render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Goal Progress</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/chip.css@*/

            /* The weight track inside the shared drawer: the span between the
               two readings highlighted, a hollow target marker and a filled
               current one. Marker positions (left %) are set inline from the
               data. The row that opens it is chip.css's `.more.mextra`. */
            .wtrack {
                position: relative;
                margin: 10px 2px 3px;
                height: 5px;
                border-radius: var(--r-pill);
                background: var(--track);
            }
            .wseg {
                position: absolute;
                top: 0;
                height: 100%;
                border-radius: var(--r-pill);
                background: var(--acc);
                opacity: 0.4;
            }
            .wpin {
                position: absolute;
                top: 50%;
                width: 11px;
                height: 11px;
                border-radius: 50%;
                transform: translate(-50%, -50%);
            }
            .wpin.tgt {
                background: var(--panel);
                border: 2px solid var(--ink3);
                z-index: 1;
            }
            .wpin.cur {
                background: var(--acc);
                box-shadow: 0 0 0 3px
                    color-mix(in srgb, var(--acc) 22%, transparent);
                z-index: 2;
            }
            /* The states with nothing to plot — no reading yet — are one line
               of text where the weight row would be, never a button that would
               open an empty drawer. `.wempty`, not `.wnote`: that is the
               bridge's 10px settings note (base.css), and sharing its class
               gave this line the note's size wherever the note's rule won.

               IT IS STILL THE WEIGHT ROW, so it takes the strip's own mark for
               a row that is data rather than a control — `.chip.static`'s
               recessed --bg2 ground (chip.css) — at the water bar's shape and
               the `.more.mextra` rhythm above it. As caption-grey prose it was
               two lines of --ink3 small print with a hairline between them and
               the bridge's --ink3 settings note: the same ink, the same
               register, nothing saying the first was the card's weight row.

               And it deals in like everything else on the strip: macroPanel
               hands `row(i)` the next stagger index, which this row discarded,
               so on a card where every tile deals left to right this one line
               appeared at once. Same animation and step as `.more.mextra`, the
               reading-bearing variant of this very row.

               Rhythm (chip.css, `.more.mextra`): 10px on top once the water
               rail's -2px focus-ring bleed collapses into it, and the same -2px
               below so the foot's 12px (base.css) lands its hairline 10px under
               this row too. */
            .strip > .wempty {
                margin: 10px 0 -2px;
                padding: 7px 12px;
                border-radius: var(--r-in);
                background: var(--bg2);
                color: var(--ink2);
                font-size: 12.5px;
                line-height: 1.4;
                animation: tileIn 0.4s var(--ease-out) both;
                animation-delay: calc(var(--i, 0) * 35ms);
            }

            /* THE WEIGHT DRAWER'S CAPTION IS ITS PAYLOAD, so it may not be the
               thing that gets cut. `.dcap` is one nowrap ellipsised line
               because a metric's drawer carries its meals underneath and the
               caption is a summary of them; this drawer holds the caption and
               the track and nothing else — the distance to target and the date
               of the reading ARE what a tap reveals, since the row itself
               already shows "78.4 → 75.0 kg". `.dname` is `flex: none`, so the
               caption was the only shrinkable item in the head: measured
               clipped at every width a chat card gets in de (355px of text in
               173px at 320px, still cut at 480), and through 420px in uk. It
               takes the head's second row instead, whole.

               chip.css now wraps every drawer head's caption below 420px, for
               the same reason at chat-card widths. This rule stays because THIS
               caption clips past that breakpoint too — it is the drawer's whole
               payload, where a metric's is a summary of the meals listed under
               it. */
            .dhead.whead {
                flex-wrap: wrap;
            }
            .whead .dcap {
                flex-basis: 100%;
                white-space: normal;
                overflow: visible;
                text-overflow: clip;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /* shortDate() for the calorie label and a drawer row's day,
               dayHeader() for the header meta and the weight's "last logged"
               (both need the year once it is not this year's), ymd() for
               whether the date is usable at all, and isToday(). */
            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                date: "2026-07-10",
                locale: "en",
                meal_count: 5,
                water_entries: 6,
                // The alcohol opt-in, which every payload with an alcohol
                // figure carries. Without it here the preview glosses grams as
                // US drinks by fallback and the UK path is never seen.
                drink_unit: "us",
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: 20,
                    // A ceiling, like sugar and alcohol: EFSA's 400 mg/day.
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1980,
                    protein_g: 148,
                    carbs_g: 231,
                    fat_g: 74,
                    fiber_g: 24.6,
                    // Over its ceiling, so its chip flags it with --over.
                    sugar_g: 61.3,
                    // Alcohol tracking ON in this sample; null would mean the
                    // user has it off and the alcohol chip disappears.
                    alcohol_g: 27.7,
                    // Over its ceiling too, so its chip flags it. null here
                    // (nothing recorded today) would drop the chip rather than
                    // claim a 0 mg day against the 400 mg limit.
                    caffeine_mg: 470,
                    water_ml: 2100,
                },
                weight: {
                    current: 78.4,
                    target: 75,
                    unit: "kg",
                    logged_on: "2026-07-09",
                },
                meals: [
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: null,
                        calories: 420,
                        protein_g: 18,
                        carbs_g: 62,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 24.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Grilled chicken & rice bowl",
                        meal_type: "lunch",
                        date: null,
                        calories: 650,
                        protein_g: 52,
                        carbs_g: 78,
                        fat_g: 16,
                        fiber_g: 6.2,
                        sugar_g: 9.4,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: null,
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Salmon with quinoa & veg",
                        meal_type: "dinner",
                        date: null,
                        calories: 650,
                        protein_g: 56,
                        carbs_g: 77,
                        fat_g: 32,
                        fiber_g: 7.9,
                        sugar_g: 14.7,
                        alcohol_g: 27.7,
                        caffeine_mg: null,
                    },
                    {
                        // Where the day's caffeine came from. The food rows
                        // carry null, not 0 — a nutrient nobody filled in is
                        // absent, not zero.
                        description: "Double espresso",
                        meal_type: "snack",
                        date: null,
                        calories: 10,
                        protein_g: 0,
                        carbs_g: 1,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,
                        caffeine_mg: 470,
                    },
                ],
            };

            /* fmt() and esc(), the two helpers shared/macros.js requires in
               scope. Nothing in THIS template calls fmt() any more — the weight
               figures go through macroDecimal — but macros.js still needs it
               defined. After shared/i18n.js because fmt() reads
               WIDGET_LOCALE. */
            /*@include shared/fmt.js@*/
            // A weight reading as the payload sends it (a number, or a number a
            // host stringified), or null for "none". NaN is none too: it would
            // otherwise print "NaN kg" and plot a marker at NaN%.
            function weightNum(v) {
                if (v == null || v === "") return null;
                const x = Number(v);
                return Number.isFinite(x) ? x : null;
            }

            // One weight figure. FIXED tenths through macroDecimal (macros.js),
            // not fmt(): fmt round-trips through toFixed and then Number, which
            // drops the trailing zero, so a 75 kg target printed "75" beside a
            // "78.4" reading — two precisions in one "78.4 → 75 kg". The server
            // already rounds both to tenths (fromGrams), so this never rounds
            // anything away; it only stops the zero from vanishing ("75.0",
            // "78,4 → 75,0 кг" in uk).
            function weightFig(v) {
                return macroDecimal(v, 1);
            }

            // The weight row, as macroPanel's `opts.extra` (macros.js). Four
            // states, all of which must survive — dropping the row when there
            // is no reading was explicitly rejected, because "no weight logged
            // yet" is the state that says which tool to reach for.
            //
            //   no reading (with or without a target) — one line of text: there
            //     is nothing to plot and nothing to disclose, so a button would
            //     promise a drawer with nothing in it (`detail: null`, and the
            //     row is a `.wempty` line rather than a control)
            //   a reading with no target — the reading in the row, the prompt to
            //     set a goal in the drawer
            //   a reading and a target — the reading and the target in the row,
            //     the track between them in the drawer
            //
            // A null `weight` is the first state: the server sends null only
            // when there is neither a reading nor a target.
            //
            // Everything is plain text until the markup is written, and escaped
            // once there — the unit included — so no string is escaped twice.
            function weightExtra(w) {
                const cur = weightNum(w && w.current);
                const tgt = weightNum(w && w.target);
                // The payload's unit is a CODE ("kg" / "lb"); print its label.
                const unit = unitLabel((w && w.unit) || "kg");
                const withUnit = (v) => `${weightFig(v)} ${unit}`;

                // Say which piece is missing and which tool supplies it.
                if (cur == null) {
                    const msg =
                        tgt != null
                            ? tpl(T.goalProgress.weightNoneWithTarget, {
                                  target: withUnit(tgt),
                              })
                            : T.goalProgress.weightNoneNoTarget;
                    return {
                        key: "weight",
                        // `i` is the stagger index macroPanel hands every row
                        // (`extra.row(i)`); this one is not a control but it is
                        // still a row on the strip, and it deals in with them.
                        row: (i) =>
                            `<div class="wempty" style="--i:${i}">${esc(msg)}</div>`,
                        detail: null,
                    };
                }

                // The reading is the LATEST one overall, not necessarily this
                // day's, so the date it was taken on rides with it — through
                // dayHeader, because a reading from last year that printed
                // "20 Nov" would pass for a recent one.
                const day = w.logged_on ? dayHeader(w.logged_on) : "";
                const when = day
                    ? tpl(T.goalProgress.lastLogged, { date: day })
                    : "";
                // The spoken form of the same fact. Its separator is language
                // data (", " in most locales, "、" in ja), so the string owns it.
                const metaSuffix = day
                    ? tpl(T.goalProgress.lastLoggedSuffix, { date: day })
                    : "";

                let value, cap, aria, body;
                if (tgt == null) {
                    // A reading with no target has no line to plot it on, so
                    // the drawer carries the prompt instead of a track.
                    value = withUnit(cur);
                    cap = when;
                    aria = tpl(T.goalProgress.weightAriaNoTarget, {
                        current: withUnit(cur),
                        metaSuffix,
                    });
                    body = `<div class="dempty">${esc(tpl(T.goalProgress.weightNoGoal, { reading: withUnit(cur) }))}</div>`;
                } else {
                    // Tenths on both sides (see weightFig), so this is the
                    // same comparison the printed figures make.
                    const atTarget = Math.abs(cur - tgt) < 0.05;
                    const delta = Math.round((cur - tgt) * 10) / 10;
                    const state = atTarget
                        ? T.goalProgress.atTarget
                        : tpl(
                              delta > 0
                                  ? T.goalProgress.toLose
                                  : T.goalProgress.toGain,
                              { amount: withUnit(Math.abs(delta)) },
                          );
                    // THE ARROW STAYS. Every tile on this strip reads
                    // "value/goal", and on a tile that grammar is a fraction
                    // of a goal — "78.4/75.0 kg" would read as 105% of target,
                    // a breach, and a gain target as a floor not yet met.
                    // Weight is a direction ("from here toward there"), which
                    // is what the arrow says. The distance itself is the
                    // drawer's caption and the accessible name's.
                    value = atTarget
                        ? `${withUnit(cur)} · ${T.goalProgress.atTarget}`
                        : `${weightFig(cur)} → ${weightFig(tgt)} ${unit}`;
                    cap = when ? `${state} · ${when}` : state;
                    // "·" and "→" separate the figures visually, but a screen
                    // reader skips one and says "right arrow" for the other,
                    // so the spoken name is the translated sentence instead.
                    aria = tpl(T.goalProgress.weightAria, {
                        current: withUnit(cur),
                        target: withUnit(tgt),
                        state,
                        metaSuffix,
                    });

                    if (atTarget) {
                        // NOTHING TO PLOT AT TARGET, so nothing is plotted. The
                        // two markers coincide and the span between them is 0
                        // wide, which drew one filled dot dead centre of an
                        // otherwise empty rail — the exact shape of a half-full
                        // progress bar, saying the one thing that is not true of
                        // a reading that has arrived. The reading-with-no-target
                        // state above already escapes the track this way; here
                        // the row says "75.0 kg · at target" and the head's
                        // caption adds the date it was taken on.
                        body = "";
                    } else {
                        // Pad the scale beyond the two points so the markers
                        // land inboard (~22% / 78%): an 11px marker centred on
                        // 0% or 100% would hang off the end of its own track.
                        const lo = Math.min(cur, tgt);
                        const hi = Math.max(cur, tgt);
                        const pad = (hi - lo) * 0.4;
                        const smin = lo - pad;
                        const span = hi - lo + pad * 2;
                        const pos = (v) => ((v - smin) / span) * 100;
                        const pc = pos(cur);
                        const pt = pos(tgt);
                        // THE TRACK IS A PICTURE OF THE LINE ABOVE IT, so it
                        // carries no name of its own. It used to repeat the
                        // row's whole aria-label — the same `aria` string the
                        // button that opened this drawer already announced —
                        // three elements after the head's `.dcap` said the
                        // distance and the date in text, so opening the row
                        // announced one sentence up to three times. The two
                        // sibling states add real content instead (a prompt
                        // with no target, nothing at target); this one plots
                        // what the caption states, which is the definition of
                        // decorative. Everything it shows is in the row's name
                        // and the caption, so hiding it loses nothing.
                        body = `
            <div class="wtrack" aria-hidden="true">
              <div class="wseg" style="left:${Math.min(pc, pt).toFixed(1)}%;width:${Math.abs(pc - pt).toFixed(1)}%"></div>
              <div class="wpin tgt" style="left:${pt.toFixed(1)}%"></div>
              <div class="wpin cur" style="left:${pc.toFixed(1)}%"></div>
            </div>`;
                    }
                }

                return {
                    key: "weight",
                    // The shared drawer's contract for an extra (macros.js,
                    // macroExtraOf): `data-macro-extra` so every strip lookup
                    // finds it as a control, aria-expanded + aria-controls
                    // naming the ONE drawer, and the next `--i` so its entrance
                    // deals in after the last tile. The id comes from the
                    // STRIP (row's second argument), never the module default:
                    // this widget renders one strip per iframe, but the
                    // partial it hands the row to is also the public site's,
                    // where two cards share a document and the default would
                    // address the other card's drawer. `c-acc` sits on the button
                    // so `--c` — the dot, the open tint and ring — resolves.
                    //
                    // The accessible name starts with the visible label
                    // ("Weight …"), so label-in-name holds with the arrow kept
                    // visually.
                    row: (i, drawerId) =>
                        `<button class="more mextra c-acc" type="button" data-macro-extra="weight" aria-expanded="false" aria-controls="${drawerId}" aria-label="${esc(aria)}" style="--i:${i}"><span class="dot"></span>${esc(T.goalProgress.weightLabel)}<span class="mv">${esc(value)}</span><span class="chev">${icon("chev", 10)}</span></button>`,
                    // The drawer body, handed the same strip's name id (see
                    // the row above). Its head names the region, so it carries
                    // that id on its `.dname` and the `[data-macro-close]`
                    // ✕ exactly as a metric's head does; the shared handlers act
                    // on nothing else. The ROLE CLASS goes on the head and the
                    // dot stays bare, as macroDetailBody does it — on the dot
                    // it would set --c on the dot itself.
                    detail: (drawerNameId) => `
              <div class="dhead whead c-acc">
                <span class="dot"></span>
                <b class="dname" id="${drawerNameId}">${esc(T.goalProgress.weightLabel)}</b>
                <span class="dcap">${esc(cap)}</span>
                <button class="dx" type="button" data-macro-close aria-label="${esc(T.macros.closeBreakdown)}">${icon("x", 12)}</button>
              </div>${body}`,
                };
            }

            let __widgetApi = null;

            function render(data) {
                const root = document.getElementById("root");
                setLocaleFrom(data, __widgetApi);
                // Litres or fluid ounces, from the profile (macros.js).
                setWaterUnit(data && data.water_unit);
                // WHAT WAS OPEN — a tile's drawer or the weight's — and where
                // focus was, read before the card is thrown away: a host may
                // re-deliver the tool result while a drawer is open. Put back
                // by macroRestore at the end of render() (shared/macros.js).
                const was = macroSnapshot(root);

                if (!data || typeof data !== "object") {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">🎯</div>
              <div>${esc(T.goalProgress.empty)}</div>
            </div>`;
                    return;
                }

                const totals = data.totals || {};
                const meals = data.meal_count || 0;
                const water = data.water_entries || 0;
                const w = data.weight;
                const nothingLogged =
                    meals === 0 &&
                    water === 0 &&
                    !(w && (w.current != null || w.target != null));
                // "10 Jul" this year, "20 Nov 2025" otherwise; a date that is
                // not a real day passes through as it came (dayHeader).
                const day = dayHeader(data.date);

                if (nothingLogged) {
                    // A day with nothing in it still names the day, in a card
                    // that looks like this widget — nutrition-summary's empty
                    // range does the same. The body line is date-free because
                    // the header already carries the date. Only when the date
                    // is unusable is there no header to put it in, and then
                    // the bare block says it inline as it always did.
                    root.innerHTML = ymd(data.date)
                        ? `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.goalProgress.title)}</h1>
              <span class="cmeta">${esc(day)}</span>
            </header>
            <div class="empty">
              <div class="big">🎯</div>
              <div>${esc(T.goalProgress.nothingLogged)}</div>
            </div>
            <div class="foot" data-widget-foot></div>
          </div>`
                        : `
            <div class="empty">
              <div class="big">🎯</div>
              <div>${esc(tpl(T.goalProgress.nothingLoggedFor, { date: day || T.goalProgress.thisDay }))}</div>
            </div>`;
                    return;
                }

                // The date this widget shows is arbitrary — get_goal_progress
                // takes any date — so the calorie label only says "today" when
                // it actually is the viewer's today (#114); otherwise it names
                // the day. shortDate, not dayHeader: the header meta already
                // carries the year where it matters, and a year in the panel
                // label would be what ellipsises away the metric word (ja).
                const calLabel = isToday(data.date)
                    ? T.macros.caloriesToday
                    : tpl(T.macros.caloriesOn, { date: shortDate(data.date) });

                const strip = macroPanel(
                    totals,
                    data.goals,
                    undefined,
                    data.meals,
                    {
                        // nutrition-summary's three levels: the energy split
                        // three-up under the panel, the ceilings a size down,
                        // water as the closing bar (see "the tiers" in
                        // shared/chip.css). No chartKeys and no onSeries — this
                        // payload is one day, with no series to draw — so a
                        // tile opens its meals and nothing else, and the panel
                        // stays the day's calorie headline.
                        tiers: true,
                        // "us" | "uk" for a user who tracks alcohol, null for
                        // one who does not.
                        drinkUnit: data.drink_unit,
                        calLabel,
                        // The weight row, after water and before the drawer,
                        // opening that same drawer. See weightExtra.
                        extra: weightExtra(w),
                    },
                );

                // A day with a weight reading but no meals or water still shows
                // the strip (all zeros against the goals), so say why. Date-free
                // for the same reason as the empty card: the meta names the day.
                const bare = meals === 0 && water === 0;
                // The day itself and what was logged on it — the context the
                // strip's numbers are read against. A missing date drops its
                // slot rather than opening the line with " · ".
                //
                // …but the counts exist to say what the strip's numbers are made
                // of, and at zero they add nothing the `.csub` directly under
                // them does not already say — in the loudest slot on the card,
                // and at the price of a whole header row on a phone ("15 Jul ·
                // 0 meals · 0 waters" cannot sit beside the title, which cost
                // ~25px at 280px in 8 of 9 locales). The fully-empty card two
                // branches up prints the day alone for exactly this reason, and
                // this is the one state that contradicted it.
                const meta = [
                    day,
                    bare ? "" : plural(T.goalProgress.mealsCount, meals),
                    bare ? "" : plural(T.goalProgress.waterCount, water),
                ]
                    .filter(Boolean)
                    .join(" · ");
                const sub = bare
                    ? `<span class="csub">${esc(T.goalProgress.nothingLogged)}</span>`
                    : "";

                root.innerHTML = `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.goalProgress.title)}</h1>
              <span class="cmeta">${esc(meta)}</span>
              ${sub}
            </header>
            ${strip}
          </div>`;

                // Re-open what was open (a tile's drawer or the weight's) and
                // put focus back only if it was inside the widget — never
                // taken from the host (see macroRestore in shared/macros.js).
                macroRestore(root, was);
            }

            // ---- Rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (payload.totals || payload.date) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            /*@include shared/macros.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "goal-progress-widget",
                // From the dictionary rather than a literal, so the string has
                // one home. T is still English here — this paints before the
                // handshake, when no locale is known yet.
                loading: `<div class="empty"><div class="big">🎯</div><div>${esc(T.goalProgress.loading)}</div></div>`,
