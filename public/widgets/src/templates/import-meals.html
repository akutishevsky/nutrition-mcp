<!doctype html>
<!--
  Bulk meal import widget (MCP Apps).

  The point of this widget is that the MODEL never handles row data. It parses the
  user's export in-browser, shows a mapping and a preview to confirm, then calls
  bulk_import_meals itself via the shared bridge's api.callTool. Structured tool
  results are not added to model context, so hundreds of rows never enter the
  token stream — only a short summary, pushed back deliberately at the end via
  api.updateModelContext.

  Four steps: file -> map columns -> preview -> import.

  Alcohol is opt-in and the opt-in reaches this far: start_meal_import sends
  drink_unit, and with it null the widget neither maps, previews nor sends an
  alcohol column, however loudly the file advertises one. See gatedField below
  for why nothing is written either.

  The CSV parser is NOT written here. `@inlinets src/csv.ts` splices in the real
  tested module (src/csv.test.ts), because a parser facing arbitrary user files
  must not live as untested inline template JS. Same for the row chunker:
  `@inlinets src/chunk.ts` (src/chunk.test.ts) — the boundary logic deciding
  which rows go in which server call was untested inline JS once and had a real
  bug (issue #65).

  Degrades on purpose:
    - api.canCallTools false  -> tells the user to ask Claude to import instead
    - host never answers      -> per-call timeout, reported, retry offered
    - a chunk fails           -> other chunks still land; re-running is a no-op
                                 server-side, so "retry failed rows" is safe
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Import Meals</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/form.css@*/

            /*@include shared/table.css@*/

            /* Page-scoped: only this widget's own layout. Everything with a
               visual opinion above the fold of this block is a shared
               primitive (form.css controls, table.css preview, base.css card),
               never a fork of one. */
            .imp {
                display: grid;
                /* minmax(0,1fr): an auto column would be sized by the nowrap
                   preview table and drag every sibling card wide. */
                grid-template-columns: minmax(0, 1fr);
                gap: 12px;
            }
            /* The shared .card is a flex column with a gap of its own, which
               suits a readout of sibling blocks. This is a form: its children
               already carry their own margins, so it takes the card's surface
               and drops the card's layout. */
            .imp > .card {
                display: block;
                padding: 14px;
            }
            .imp h3 {
                margin: 0 0 12px;
                font-size: 15px;
                font-weight: 800;
                letter-spacing: -0.025em;
                color: var(--ink);
            }
            /* One row per mappable field: the field's name and the first real
               value from the user's own file share a line, the column picker
               sits beside them. What that buys is the long labels — "Time
               (separate column)", "Timezone (from our export)" — which used to
               wrap to a second line above their sample and cost a row each. */
            .map-grid {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                gap: 6px 12px;
                align-items: center;
            }
            /* One wrapping behaviour at EVERY width, not two.
               Layout recheck, MINOR: the previous fix for the 320px mapping
               step put `flex-wrap` + a wrapping `.map-src` inside
               `@media (max-width: 419.98px)`, so from 420px up the two-column
               grid came back and each field was handed ~175px for a label
               needing 235–270px translated — ja `.map-src` lost 101px at 420,
               71 at 480, 31 at 560; pl/it/es/fr/uk/de all lost between 92 and
               8. The field's NAME is the row's identity: it is what the user
               matches against the picker beside it, so it is the one string
               here that must never be cut. It wraps now wherever it has to,
               which is the same rule in one place instead of a breakpoint that
               happened to be measured only from below. */
            .map-field {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 6px;
                min-width: 0;
            }
            .map-src {
                flex: 0 1 auto;
                min-width: 0;
                /* `anywhere` rather than `break-word`: it also drops the
                   element's min-content width to one character, which is what
                   stops a long unbroken compound (de/uk build several) from
                   setting the grid column's floor and pushing the card wide. */
                overflow-wrap: anywhere;
                font-size: 12.5px;
                font-weight: 700;
                letter-spacing: -0.01em;
            }
            .map-sample {
                /* A basis of auto plus a floor, so an ellipsis that would leave
                   "例：" and nothing else drops the sample to its own line
                   instead of pretending to show a value. The field's name is
                   the identity of the row; the sample is reassurance, and it is
                   the one that yields. */
                flex: 1 1 auto;
                min-width: 14ch;
                /* Load-bearing: once the sample is alone on a wrapped line its
                   auto basis is its full content width — measured at 363px
                   inside a 262px row — and `.card`'s overflow:hidden then
                   destroys the tail silently instead of ellipsising it. Capping
                   at the row restores the ellipsis. */
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                font-family: var(--mono);
                font-size: 10.5px;
                color: var(--ink3);
            }
            /* ---- horizontal-scroll affordance for the preview table -------
               Audit finding: at 320px the 10-column preview showed three
               columns behind an unmarked scroll (260px visible of 1085px),
               with `mask-image: none`, `box-shadow: none` and a scrollbar that
               stays invisible on touch until it is dragged. Every nutrient
               figure the preview exists to let the user check was off-screen
               with nothing on screen saying so — the same failure the shelf
               spec rejected for the chip rails.

               The cue cannot live on `.tscroll` itself: a pseudo-element
               inside a scroll container scrolls away with the content it is
               meant to mark. So the scroller sits inside a `.tedge` wrapper
               whose ::before/::after are painted over the scroller's own
               edges, and wireScrollEdges() toggles them from scrollLeft.
               `.tscroll` keeps its name and every rule table.css gives it.

               Only `opacity` transitions here. Never height/margin/padding:
               bridge.js re-measures documentElement at max-content on a
               ResizeObserver tick, so an animated layout property becomes a
               60Hz size-changed storm and a lurching iframe. */
            .tedge {
                position: relative;
                /* Same reason .tscroll needs it: a grid item's min-width:auto
                   would let the nowrap table set the column's width. */
                min-width: 0;
            }
            .tedge::before,
            .tedge::after {
                position: absolute;
                /* Inset by the scroller's own 1px border so the fade covers
                   the rows, never the frame around them. */
                top: 1px;
                bottom: 1px;
                width: 34px;
                display: flex;
                align-items: center;
                pointer-events: none;
                opacity: 0;
                transition: opacity 0.15s ease;
                /* Above .tbl thead th, which table.css sticks at z-index 1. */
                z-index: 2;
                font-family: var(--mono);
                font-size: 18px;
                font-weight: 700;
                /* --ink2, not --ink3: on a light table the gradient itself is
                   white-on-white and barely reads, so the glyph is carrying
                   the affordance and needs the contrast of real text. */
                color: var(--ink2);
            }
            /* The gradient alone reads as a rendering artefact to some people,
               so each edge also carries a chevron: direction stated in a glyph,
               not in a soft colour ramp. */
            .tedge::before {
                content: "‹";
                /* see the @supports block below */
                left: 1px;
                justify-content: flex-start;
                padding-left: 5px;
                border-radius: var(--r-in) 0 0 var(--r-in);
                background: linear-gradient(
                    to right,
                    var(--panel) 30%,
                    color-mix(in srgb, var(--panel) 55%, transparent) 65%,
                    transparent
                );
            }
            .tedge::after {
                content: "›";
                right: 1px;
                justify-content: flex-end;
                padding-right: 5px;
                border-radius: 0 var(--r-in) var(--r-in) 0;
                background: linear-gradient(
                    to left,
                    var(--panel) 30%,
                    color-mix(in srgb, var(--panel) 55%, transparent) 65%,
                    transparent
                );
            }
            .tedge.more-left::before,
            .tedge.more-right::after {
                opacity: 1;
            }
            /* Measured on the preview step's a11y tree: both chevrons were
               exposed as StaticText "‹" / "›" sitting either side of the table's
               region, so a screen reader read two stray glyphs mid-table. They
               are a visual duplicate of an affordance the region already
               announces (a named, focusable scroller), so their alternative
               text is empty.

               Behind @supports on purpose: `content: "x" / "alt"` is the newer
               two-value syntax, and an engine that cannot parse it drops the
               WHOLE declaration — which would delete the chevron rather than
               just its alt text, taking the scroll cue with it. The plain
               single-value `content` above stays as the floor. */
            @supports (content: "x" / "y") {
                .tedge::before {
                    content: "‹" / "";
                }
                .tedge::after {
                    content: "›" / "";
                }
            }
            /* A permanently drawn thin scrollbar, so the third cue (the bar
               itself) is there before anything is dragged — overlay scrollbars
               on touch and on macOS are hidden until then. */
            .tedge > .tscroll {
                scrollbar-width: thin;
                scrollbar-color: var(--line2) transparent;
            }

            @media (max-width: 419.98px) {
                /* Buy columns back before asking anyone to scroll at all: at
                   320px the preview measured 1085px wide. Tighter cells, a
                   smaller type size and a lower floor under the one wrapping
                   column cut that materially — see the measured numbers in the
                   handover notes. */
                .tbl {
                    font-size: 11.5px;
                }
                .tbl th,
                .tbl td {
                    padding: 6px 6px;
                }
                .tbl .wide {
                    min-width: 104px;
                }

                /* Audit finding: the mapping step was unreadable here. Two
                   equal grid columns left each `<select>` 125px — narrow enough
                   that every unmapped one rendered its "(not in this file)"
                   option as "（このファイ" — while `.map-src` was ellipsised by
                   up to 158px and `.map-sample` by 527px. One column instead:
                   the field name and its sample take the full width, the
                   picker sits under them. */
                .map-grid {
                    display: flex;
                    flex-direction: column;
                    gap: 4px;
                    /* Overrides the two-column rule's `align-items: center`,
                       which in a column flex container is a CROSS-axis rule:
                       it shrink-wraps each row to its content, so a long
                       sample made `.map-field` 363px inside a 262px card and
                       `.card`'s overflow:hidden ate the tail. Stretch puts
                       every row at the card's width, which is what makes the
                       ellipsis below possible at all. */
                    align-items: stretch;
                }
                /* 4px binds a label to its own select; the extra 8px separates
                   one field from the next, so the rows still read as pairs
                   without a second grid track to align.
                   `.map-src` / `.map-sample` need nothing here any more — they
                   wrap the same way at every width (see their base rules), and
                   they stay adjacent siblings with these exact class names,
                   because macros.test.ts pins the pair as one literal string. */
                .map-field:not(:first-child) {
                    margin-top: 8px;
                }
            }

            .stat-row {
                display: flex;
                gap: 4px 14px;
                flex-wrap: wrap;
                margin-bottom: 12px;
                font-size: 12px;
                color: var(--ink2);
            }
            .stat-row b {
                color: var(--ink);
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            /* The copy-paste support dump. user-select: all makes one click
               select the whole block, which is the entire point of it.

               a11y recheck, MINOR: this failed AA at 4.19:1 light. It only
               renders after a CSV with unreadable rows is parsed, which is why
               three audits swept the widget and none of them reached it — the
               state where a user is being asked to read 10.5px mono and retype
               it into an email is exactly the state that must not be faint.

               The fix is the surface, not the ink. The old
               `color-mix(--ink 5%, transparent)` tint was TRANSLUCENT, so the
               block inherited whatever `.notice` variant wrapped it — here
               --bg2, giving rgb(227,227,232) under --ink3 = 4.19:1. An opaque
               --panel means the ratio quoted here is the ratio that ships no
               matter which notice ever hosts it (the same argument table.css
               makes for the status pills), and it lifts --ink3 to 5.36:1 light
               / 5.58:1 dark with the recess now drawn by the --line border
               instead of by a wash. --ink3 stays: a diagnostics dump is the
               quietest thing on the card, and it can be quiet and legible. */
            .diag {
                display: block;
                margin-top: 8px;
                padding: 8px 10px;
                border-radius: 10px;
                background: var(--panel);
                border: 1px solid var(--line);
                font-family: var(--mono);
                font-size: 10.5px;
                line-height: 1.5;
                white-space: pre-wrap;
                user-select: all;
                color: var(--ink3);
            }
        </style>
    </head>
    <body>
        <div class="wrap page" id="root"></div>
        <script>
            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/bridge.js@*/

            // The real, unit-tested CSV parser (src/csv.ts + src/csv.test.ts).
            /*@inlinets src/csv.ts@*/

            // ---- config from start_meal_import -------------------------------
            //
            // drink_unit is the alcohol opt-in, exactly as every other
            // widget-backed tool carries it: "us" / "uk" when the user tracks
            // alcohol, null when they do not. It DEFAULTS to null and an absent
            // field therefore reads as tracking-off, deliberately: a widget is
            // assembled from source by the same process that serves the tool, so
            // a payload with no drink_unit means a host or harness synthesised
            // it, and guessing "on" there would surface per-row ethanol to the
            // one user the opt-in exists to protect. Failing closed costs a
            // column; failing open costs the thing the gate is for.
            let CFG = {
                tz: "UTC",
                today: "",
                max_rows_per_call: 50,
                import_tool_name: "bulk_import_meals",
                known_source_apps: [],
                tz_configured: true,
                drink_unit: null,
                locale: "en",
            };
            let API = null;

            // Strict allowlist, not truthiness: only the two values the server's
            // schema can emit turn alcohol on.
            function alcoholTracked() {
                return CFG.drink_unit === "us" || CFG.drink_unit === "uk";
            }

            // Support contact, shown only when something has actually gone wrong.
            // Plain text, NOT a mailto: link — the widget runs in a
            // sandbox="allow-scripts" iframe and Chrome blocks navigation to
            // external protocols from one, so a mailto anchor silently does
            // nothing while still looking clickable.
            // depersonalize.ts strips this block; keep the marker comments.
            /* support-contact:start */
            const SUPPORT_EMAIL = "anton@nutrition-mcp.com";
            /* support-contact:end */

            // A short, copyable description of the file and what went wrong.
            // "Email me" on its own costs two round trips — the first reply is
            // always "what does your file look like?" — so the answer ships with
            // the question.
            function diagnosticsBlock() {
                if (!SUPPORT_EMAIL) return "";
                const t = S.table;
                const lines = [];
                if (t) {
                    lines.push(
                        t.headers.length +
                            " columns: " +
                            t.headers.slice(0, 8).join(" | ") +
                            (t.headers.length > 8 ? " | …" : ""),
                    );
                    lines.push(
                        "encoding " +
                            t.encoding +
                            " · delimiter " +
                            (t.delimiter === "\t" ? "tab" : t.delimiter) +
                            " · decimal " +
                            t.decimalSeparator +
                            " · " +
                            t.rows.length +
                            " rows",
                    );
                    lines.push(
                        "dates read as " +
                            (DATE_FORMAT_ENGLISH_LABELS[S.dateFormat] ||
                                S.dateFormat) +
                            " · energy " +
                            S.energyUnit +
                            (S.dateAmbiguous ? " · format was ambiguous" : ""),
                    );
                }
                const r = S.result;
                if (r) {
                    lines.push(
                        "imported " +
                            r.created +
                            " · already logged " +
                            r.deduplicated +
                            " · failed " +
                            r.failed +
                            " · skipped " +
                            S.skipped,
                    );
                    const first = (r.rowErrors || [])[0];
                    if (first)
                        lines.push(
                            "first error, line " +
                                first.line +
                                ": " +
                                first.message,
                        );
                    for (const e of (r.chunkErrors || []).slice(0, 2))
                        lines.push("batch error: " + e);
                } else if (S.badDates > 0) {
                    lines.push(
                        S.badDates +
                            " row(s) have an unreadable date" +
                            (S.badDateSample
                                ? " (line " +
                                  S.badDateSample.line +
                                  ": " +
                                  S.badDateSample.value +
                                  ")"
                                : ""),
                    );
                }
                return notice(
                    "",
                    tpl(T.importMeals.emailNotice, {
                        email: "<b>" + esc(SUPPORT_EMAIL) + "</b>",
                    }) +
                        '<span class="diag">' +
                        esc(lines.join("\n")) +
                        "</span>",
                    "✉",
                );
            }

            // ---- state -------------------------------------------------------
            // Plain data — labels are looked up from T.importMeals.fieldLabels
            // by key at the one call site that renders them (mapStep()), so a
            // locale switch relabels these without rebuilding the array.
            const FIELDS = [
                { key: "logged_at", required: true },
                { key: "description" },
                { key: "meal_type" },
                { key: "calories" },
                { key: "protein_g" },
                { key: "carbs_g" },
                { key: "fat_g" },
                { key: "fiber_g" },
                { key: "sugar_g" },
                // Only offered when the user tracks alcohol — see gatedField.
                { key: "alcohol_g", alcoholOnly: true },
                // Milligrams, and the label says so. Caffeine has no opt-in
                // flag of any kind — unlike alcohol it is offered to everyone,
                // always; it is the read side that stays quiet until there is
                // caffeine to talk about.
                { key: "caffeine_mg" },
                { key: "notes" },
                { key: "time" },
                { key: "deleted" },
                // Only meaningful in this app's own export, where it is the
                // meal's id and is what lets a restored backup be recognized
                // instead of duplicated. Offered like any other field so it can
                // be re-pointed or unset; a foreign app's id column maps here
                // harmlessly, because the server ignores anything that is not
                // one of this user's meal ids.
                { key: "source_id" },
                // Same reasoning as source_id: only meaningful when the file
                // is this app's own export, offered like any other field so
                // it can be re-pointed or unset.
                { key: "timezone" },
            ];
            // Header aliases for the exports surveyed. Matched with
            // normalizeHeader from csv.ts, so "Fat (g)" and "fat_g" both hit.
            const ALIASES = {
                logged_at: ["date", "day", "logged_at", "datum", "timestamp"],
                time: ["time", "uhrzeit"],
                description: [
                    "food_name",
                    "description",
                    "name",
                    "food",
                    "item",
                    "lebensmittel",
                ],
                meal_type: ["meal", "meal_type", "type", "group", "mahlzeit"],
                calories: [
                    "calories",
                    "energy_kcal",
                    "energy",
                    "kcal",
                    "calories_kcal",
                    "kalorien",
                ],
                protein_g: ["protein_g", "protein", "eiweiss"],
                carbs_g: [
                    "carbs_g",
                    "carbohydrates_g",
                    "carbs",
                    "carbohydrates",
                    "net_carbs_g",
                    "kohlenhydrate",
                ],
                fat_g: ["fat_g", "fat", "total_fat", "fett"],
                // normalizeHeader turns "Fiber (g)" into "fiber_g" but leaves
                // "Fiber" as "fiber", so both spellings are listed. Localised
                // headers usually ship the unit too ("Ballaststoffe (g)"), so
                // the non-English words get the _g form as well.
                fiber_g: [
                    "fiber_g",
                    "fiber",
                    "fibre_g",
                    "fibre",
                    "dietary_fiber",
                    "dietary_fibre",
                    "total_fiber",
                    "total_fibre",
                    "ballaststoffe",
                    "ballaststoffe_g",
                    "fibra",
                    "fibres",
                ],
                // TOTAL sugars only. "Added sugar" / "free sugars" is a
                // different quantity and is deliberately absent here — see
                // ADDED_SUGAR_RE below. Matching is exact per normalized
                // header, so Cronometer's "Sugar Alcohols (g)" (a polyol, not
                // sugar and not ethanol) cannot land in this field either.
                sugar_g: [
                    "sugar_g",
                    "sugar",
                    "sugars_g",
                    "sugars",
                    "total_sugar",
                    "total_sugars",
                    "total_sugars_g",
                    "zucker",
                    "zucker_g",
                    "azucar",
                    "azucares",
                    "sucres",
                    "zuccheri",
                    "suikers",
                ],
                // Grams of pure ethanol. NOT a drink volume, an ABV percentage
                // or a sugar-alcohol count, so "abv" / "alcohol_by_volume" /
                // "sugar_alcohols" are excluded on purpose. "alcohol_ethyl" is
                // the USDA field name Cronometer inherits.
                alcohol_g: [
                    "alcohol_g",
                    "alcohol",
                    "alcohol_ethyl",
                    "ethanol",
                    "ethanol_g",
                    "alkohol",
                    "alkohol_g",
                ],
                // MILLIGRAMS. normalizeHeader turns "Caffeine (mg)" — what
                // Cronometer and every other exporter that carries it writes —
                // into "caffeine_mg", and a bare "Caffeine" into "caffeine";
                // both are listed, and both are read as mg because no surveyed
                // export states caffeine in grams. What is deliberately NOT
                // listed is any *_g spelling: matching is exact per normalized
                // header, so "Caffeine (g)" cannot land here by accident, and
                // caffeineGramsColumns below says so out loud rather than
                // leaving the row silently blank. Localised headers usually
                // ship the unit too, hence the _mg forms alongside the bare
                // words.
                caffeine_mg: [
                    "caffeine_mg",
                    "caffeine",
                    "koffein",
                    "koffein_mg",
                    "cafeina",
                    "cafeina_mg",
                    "caffeina",
                    "caffeina_mg",
                    "cafeine",
                    "cafeine_mg",
                ],
                notes: ["note", "notes", "comment", "kommentar"],
                deleted: ["deleted"],
                // Deliberately narrow. "meal_id" and "entry_id" are NOT here:
                // a foreign app's identifier under one of those names would be
                // sent and then dropped server-side anyway, and each extra
                // alias is another chance to bind this to a column that is not
                // an id at all. Our own export writes exactly "id".
                source_id: ["id"],
                // Deliberately narrow, same reasoning as source_id above:
                // our own export writes exactly "timezone".
                timezone: ["timezone"],
            };

            // Columns that hold ADDED sugar rather than total sugar. The server
            // stores total sugars (including what is naturally in fruit and
            // milk), so an added-sugar column is not a substitute: mapping it
            // would under-report every row while looking like a clean import.
            // It never auto-maps; when a file has one and nothing filled the
            // Sugar row, say why rather than leaving a silent blank.
            const ADDED_SUGAR_RE =
                /added_sugar|sugar_added|free_sugar|zugesetzt|zusatz/;
            function addedSugarColumns() {
                if (!S.table) return [];
                return S.table.headers.filter((h) =>
                    ADDED_SUGAR_RE.test(normalizeHeader(h)),
                );
            }

            // Caffeine columns whose header states GRAMS. The server stores
            // milligrams, so mapping one would record 0.18 where the user meant
            // 180 — a thousandfold under-report that looks like a clean import
            // and that no bound can catch, since 0.18 mg is a perfectly legal
            // value. Never auto-mapped (the ALIASES list holds no _g spelling);
            // named here so the blank Caffeine row has a stated reason — and,
            // like the alcohol notice, so does the fact that the omission is
            // permanent: caffeine_mg sits outside the import digest, so a second
            // run of a corrected file dedupes to a no-op and back-fills nothing.
            const CAFFEINE_GRAMS_RE =
                /^(caffeine|koffein|cafeina|caffeina|cafeine)_(g|gram|grams|gramm)$/;
            function caffeineGramsColumns() {
                if (!S.table) return [];
                return S.table.headers.filter((h) =>
                    CAFFEINE_GRAMS_RE.test(normalizeHeader(h)),
                );
            }

            // Alcohol is opt-in (CONTRACT §7). With tracking off this widget
            // does not auto-map an alcohol column, does not offer one to map,
            // does not preview one, and — the decision worth stating — does not
            // SEND one either.
            //
            // The "never silently drop user data" rule governs values a caller
            // explicitly passes: bulk_import_meals still stores alcohol_g for
            // anyone who supplies it, tracking or not, so the write layer stays
            // ungated. Here the widget IS the caller, and declining to map a
            // column is a mapping decision, not a dropped field. Writing it
            // anyway would put a number into the user's log that never appeared
            // in the preview they confirmed — this whole flow exists so that
            // what is written is what was shown — and it would sit there
            // unreviewable until the day they turn tracking on. Turning
            // tracking on first and importing then is the supported path.
            function gatedField(f) {
                return f.alcoholOnly && !alcoholTracked();
            }
            // The gate is silent by construction — with tracking off the field
            // is never offered, so a file's alcohol column simply is not there
            // to notice. That silence is only safe if the data can be got back,
            // and it cannot: alcohol_g is deliberately outside the import
            // idempotency digest (CONTRACT §2), so importing now and re-running
            // the same file after turning tracking on is a clean no-op that
            // back-fills nothing. The user would have to delete and re-import.
            // So say it once, here, while the choice is still free.
            //
            // Same ALIASES entry the gate maps by, so the notice cannot drift
            // from what would actually have been imported. It fires on the
            // column's PRESENCE only and names its header — the user's own file
            // text. It never reads a cell: per-row ethanol figures are the one
            // thing the opt-in exists to keep off this screen.
            function alcoholColumn() {
                if (!S.table) return "";
                const i = findColumn(S.table.headers, ALIASES.alcohol_g);
                return i >= 0 ? S.table.headers[i] : "";
            }
            function mappableFields() {
                return FIELDS.filter((f) => !gatedField(f));
            }

            const S = {
                step: "file", // file | map | preview | done
                fileName: "",
                table: null, // ParsedTable from csv.ts
                mapping: {}, // field key -> column index (-1 = unmapped)
                sourceApp: "",
                dateFormat: "iso", // iso | dmy | mdy — sniffed, user-confirmable
                dateAmbiguous: false, // sniff could not tell day-first from month-first
                energyUnit: "kcal", // kcal | kj — unit of the calories column
                rows: [], // built import rows
                skipped: 0,
                badDates: 0, // rows dropped because their date would not parse
                badDateSample: null, // { line, value } of the first such row
                errors: [], // local pre-flight problems
                busy: false,
                progress: null, // { done, total, label }
                result: null, // aggregate of every chunk
            };

            function esc(s) {
                return String(s == null ? "" : s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }
            // Escapes a translated "{n} rows"-style string, then bolds the
            // digit run wherever it landed — robust to word order, unlike
            // hardcoding "<b>N</b> rows" around a fixed English shape.
            // A number in the WIDGET's locale. A bare toLocaleString() keys
            // off the host browser's language, so a French card on an English
            // browser read "12,345 kcal au total" (twelve point three…), and a
            // raw JS number always prints a dot ("2092.5 kJ", "12.5" in a
            // Polish table). Every digit kept (maximumFractionDigits: 20 is
            // the shortest round-trip, same as String(n)) — this re-punctuates
            // what the file said, it does not round it. Grouping only where
            // asked: a table cell stays compact.
            function numLocale(n, grouping) {
                const x = Number(n);
                if (!Number.isFinite(x)) return String(n);
                try {
                    return new Intl.NumberFormat(WIDGET_LOCALE || "en", {
                        maximumFractionDigits: 20,
                        useGrouping: !!grouping,
                    }).format(x);
                } catch (_) {
                    return String(x);
                }
            }
            function cellNum(v) {
                return v == null ? "—" : esc(numLocale(v, false));
            }
            function boldCount(text) {
                return esc(text).replace(
                    /\d[\d,.\s ]*\d|\d/,
                    (m) => "<b>" + m + "</b>",
                );
            }

            // Every notice is the same object: a leading mark naming the
            // severity by SHAPE, then the message. The shape is what carries
            // it — the tint alone would leave "warning" and "error" identical
            // to anyone who cannot separate the two hues. `glyph` overrides the
            // drawn icon with a character, used only for the envelope, which
            // the shared nine-icon set has no path for.
            function notice(kind, bodyHtml, glyph) {
                const mark = glyph
                    ? '<span class="nico">' + glyph + "</span>"
                    : icon(
                          { warn: "warn", error: "x", ok: "check" }[kind] ||
                              "info",
                          15,
                      );
                return (
                    '<div class="notice' +
                    (kind ? " notice-" + kind : "") +
                    '">' +
                    mark +
                    "<span>" +
                    bodyHtml +
                    "</span></div>"
                );
            }

            // ---- step 1: file ------------------------------------------------
            async function loadFile(file) {
                S.fileName = file.name;
                try {
                    const buf = new Uint8Array(await file.arrayBuffer());
                    S.table = parseCsv(buf);
                } catch (e) {
                    S.errors = [
                        tpl(T.importMeals.couldNotReadFile, {
                            msg: e.message,
                        }),
                    ];
                    render();
                    return;
                }
                if (!S.table.rows.length) {
                    S.errors = [
                        T.importMeals.noDataRows +
                            (S.table.warnings[0]
                                ? " " + S.table.warnings[0]
                                : ""),
                    ];
                    render();
                    return;
                }
                S.errors = [];
                autoMap();
                guessSourceApp();
                resniffDateFormat();
                resniffEnergyUnit();
                S.step = "map";
                render();
            }

            function autoMap() {
                S.mapping = {};
                for (const f of FIELDS) {
                    // A gated field is pinned to -1 rather than skipped: every
                    // key must exist, because buildRows' num() only treats a
                    // real negative index as "not in this file".
                    S.mapping[f.key] = gatedField(f)
                        ? -1
                        : findColumn(
                              S.table.headers,
                              ALIASES[f.key] || [f.key],
                          );
                }
            }
            // A MyFitnessPal export has a Meal column but no food name; knowing
            // which app it came from lets the server label those rows.
            function guessSourceApp() {
                const h = S.table.headers.map(normalizeHeader).join("|");
                if (h.includes("food_name") && h.includes("amount"))
                    S.sourceApp = "cronometer";
                else if (
                    S.mapping.description === -1 &&
                    S.mapping.meal_type >= 0
                )
                    S.sourceApp = "myfitnesspal";
                else if (h.includes("deleted")) S.sourceApp = "loseit";
                else if (h.includes("serving_size"))
                    S.sourceApp = "macrofactor";
                else S.sourceApp = "";
            }

            // ---- date format & energy unit -----------------------------------
            //
            // The server accepts ISO dates and kcal only, so a DD/MM/YYYY or
            // kilojoule export has to be converted here. Both settings are sniffed
            // from the file (sniffDateFormat / sniffEnergyUnit in csv.ts) and then
            // stay editable, because a sniff is a guess and both failure modes are
            // silent: day/month order is genuinely undecidable for a column of
            // 05/06/2026, and a column headed "Calories" may hold kJ, which would
            // store every row 4.184x too high while reporting success. So each
            // control is shown next to a worked example from the user's own first
            // row — a wrong setting is then visible before anything is written.
            // Functions, not static arrays, so a locale switch (setLocale runs
            // before every render()) relabels these without rebuilding them.
            function dateFormatOptions() {
                return [
                    ["iso", `${T.importMeals.dateFormatYmd} (2026-07-18)`],
                    ["dmy", `${T.importMeals.dateFormatDmy} (18/07/2026)`],
                    ["mdy", `${T.importMeals.dateFormatMdy} (07/18/2026)`],
                ];
            }
            function energyUnitOptions() {
                return [
                    [
                        "kcal",
                        `${T.importMeals.energyUnitKcal} (${unitLabel("kcal")})`,
                    ],
                    [
                        "kj",
                        `${T.importMeals.energyUnitKj} (${unitLabel("kj")})`,
                    ],
                ];
            }

            // Some exports put the whole timestamp in the date column. toIsoDate
            // tolerates a trailing time but returns the date alone, so the time is
            // captured here and re-appended after conversion — dropping it would
            // quietly move every meal to midday. Mirrors csv.ts's TRAILING_TIME_RE
            // so exactly what toIsoDate discards is what gets put back.
            const CELL_TIME_RE =
                /[T ]\s*(\d{1,2}:\d{2}(?::\d{2})?(?:\.\d+)?\s*[ap]?\.?m?\.?)$/i;
            function timeInDateCell(raw) {
                const m = CELL_TIME_RE.exec(
                    String(raw == null ? "" : raw).trim(),
                );
                return m ? m[1].trim() : "";
            }

            function dateFormatLabel(fmt) {
                const o = dateFormatOptions().find((x) => x[0] === fmt);
                return o ? o[1].replace(/\s*\(.*\)$/, "") : String(fmt);
            }
            // English-only, for diagnosticsBlock() alone: that block is a
            // copy-paste dump addressed to the (English-speaking) maintainer
            // regardless of the widget's locale, but dateFormatLabel() now
            // returns the user's own translated text since it reads from
            // dateFormatOptions(). Keep this lookup separate rather than
            // changing dateFormatLabel() itself, whose other call sites
            // (dateExampleHtml(), the "Dates read as…" line, the bad-dates
            // warning) are correctly meant to show the user's locale.
            const DATE_FORMAT_ENGLISH_LABELS = {
                iso: "Year-Month-Day",
                dmy: "Day/Month/Year",
                mdy: "Month/Day/Year",
            };

            // Cells / numbers of the column currently mapped to `fieldKey`
            // (limit 0 = all of them).
            function columnCells(fieldKey, limit) {
                const t = S.table;
                const idx = S.mapping[fieldKey];
                const out = [];
                if (!t || !(idx >= 0)) return out;
                for (const r of t.rows) {
                    if (isBlankCell(r[idx])) continue;
                    out.push(r[idx].trim());
                    if (limit && out.length >= limit) break;
                }
                return out;
            }
            function columnNumbers(fieldKey, limit) {
                const t = S.table;
                const idx = S.mapping[fieldKey];
                const out = [];
                if (!t || !(idx >= 0)) return out;
                for (const r of t.rows) {
                    const v = parseNumber(r[idx], t.decimalSeparator);
                    if (v === null) continue;
                    out.push(v);
                    if (limit && out.length >= limit) break;
                }
                return out;
            }

            // Sniff the whole column, not a sample: one 18/07/2026 anywhere in the
            // file is what settles day-first, and the energy median is steadier
            // over every row. Re-run on load AND whenever the user remaps
            // logged_at / calories, since the evidence came from that column.
            function resniffDateFormat() {
                const values = columnCells("logged_at", 0);
                if (!values.length) {
                    S.dateFormat = "iso";
                    S.dateAmbiguous = false;
                    return;
                }
                const sniffed = sniffDateFormat(values);
                S.dateFormat = sniffed.format;
                S.dateAmbiguous = sniffed.ambiguous;
            }
            function resniffEnergyUnit() {
                const t = S.table;
                const idx = S.mapping.calories;
                if (!t || !(idx >= 0)) {
                    S.energyUnit = "kcal";
                    return;
                }
                S.energyUnit = sniffEnergyUnit(
                    t.headers[idx] || "",
                    columnNumbers("calories", 0),
                );
            }

            // ---- step 2 -> 3: build rows -------------------------------------
            function buildRows() {
                const t = S.table;
                const m = S.mapping;
                const dec = t.decimalSeparator;
                const cell = (row, idx) =>
                    idx >= 0 && !isBlankCell(row[idx])
                        ? row[idx].trim()
                        : undefined;
                const num = (row, idx) => {
                    if (idx < 0) return undefined;
                    const v = parseNumber(row[idx], dec);
                    return v === null ? undefined : v;
                };

                const rows = [];
                let skipped = 0;
                let badDates = 0;
                let badDateSample = null;
                for (let i = 0; i < t.rows.length; i++) {
                    const r = t.rows[i];
                    if (m.deleted >= 0 && isDeletedRow(r, m.deleted)) {
                        skipped++;
                        continue;
                    }
                    const rawWhen = cell(r, m.logged_at);
                    if (rawWhen === undefined) {
                        skipped++;
                        continue;
                    }
                    // The server only accepts ISO, so convert with the format the
                    // column agreed on. A cell that will not parse is dropped and
                    // counted rather than sent — the server would reject it row by
                    // row anyway, and the count is surfaced in the preview so a
                    // wrong format setting cannot pass as a successful import.
                    const iso = toIsoDate(rawWhen, S.dateFormat);
                    if (iso === null) {
                        badDates++;
                        if (!badDateSample) {
                            badDateSample = {
                                line: t.sourceLines[i],
                                value: rawWhen,
                            };
                        }
                        skipped++;
                        continue;
                    }
                    let when = iso;
                    // A separate time column is common (Cronometer: Day + Time);
                    // otherwise keep a time that rode along in the date cell,
                    // which toIsoDate drops. Either can be unpadded 12-hour
                    // ("9:15 AM") — the server only accepts zero-padded 24-hour
                    // HH:MM, so normalizeTime converts it. A time that fails to
                    // parse is dropped rather than failing the whole row: the
                    // meal still imports, dated but timeless (server default:
                    // local noon), and shows up in the noTime notice below.
                    const rawTime = cell(r, m.time) || timeInDateCell(rawWhen);
                    const time = rawTime ? normalizeTime(rawTime) : null;
                    if (time) when = when + " " + time;

                    // Calories only: protein/carbs/fat/fiber/sugar/alcohol are
                    // all grams in every export and caffeine is milligrams in
                    // every export that carries it — each already the unit the
                    // server stores, so none of them convert. A caffeine column
                    // headed in grams is the one shape that would need
                    // converting, and it is refused rather than scaled (see
                    // CAFFEINE_GRAMS_RE): guessing the factor for a column we
                    // are not sure about is how a 1000x error gets written.
                    const energy = num(r, m.calories);

                    rows.push({
                        source_line: t.sourceLines[i],
                        logged_at: when,
                        description: cell(r, m.description),
                        meal_type: cell(r, m.meal_type),
                        calories:
                            energy === undefined
                                ? undefined
                                : toKcal(energy, S.energyUnit),
                        protein_g: num(r, m.protein_g),
                        carbs_g: num(r, m.carbs_g),
                        fat_g: num(r, m.fat_g),
                        fiber_g: num(r, m.fiber_g),
                        sugar_g: num(r, m.sugar_g),
                        // The mapping is already -1 when tracking is off; this
                        // is the belt to that braces, because this line is the
                        // one that decides what leaves the browser.
                        alcohol_g: alcoholTracked()
                            ? num(r, m.alcohol_g)
                            : undefined,
                        // No gate of any kind, deliberately: caffeine has no
                        // opt-in, so the only thing that keeps it out of a row
                        // is the file not having the column.
                        caffeine_mg: num(r, m.caffeine_mg),
                        notes: cell(r, m.notes),
                        // Passed through untouched. The server decides whether
                        // it names one of this user's meals; the widget must
                        // not, because it cannot see their history.
                        source_id: cell(r, m.source_id),
                        // Also passed through untouched: the server decides
                        // whether to use it, falling back to the account's
                        // timezone when it is absent or not a recognized
                        // IANA identifier.
                        timezone: cell(r, m.timezone),
                    });
                }
                S.rows = rows;
                S.badDates = badDates;
                S.badDateSample = badDateSample;
                S.skipped = skipped + t.skippedTotalsRows + t.skippedBlankRows;
            }

            // The real, unit-tested chunker (src/chunk.ts + src/chunk.test.ts).
            // Not written here: the boundary logic deciding which rows land in
            // which server call was hand-copied inline JS with no test coverage
            // and had a real bug (issue #65) — a run of same-date rows
            // straddling the 50-row cap kept absorbing more rows instead of
            // closing the chunk, so the server's hard MAX_ROWS_PER_CALL reject
            // hit silently.
            /*@inlinets src/chunk.ts@*/

            // ---- step 3: import ----------------------------------------------
            async function runImport() {
                if (!API || !API.canCallTools) return;
                S.busy = true;
                S.result = {
                    created: 0,
                    deduplicated: 0,
                    failed: 0,
                    chunks: 0,
                    chunkErrors: [],
                    rowErrors: [],
                    warnings: [],
                };
                const { chunks } = chunkRows(S.rows, CFG.max_rows_per_call);
                S.progress = { done: 0, total: chunks.length, label: "" };
                render();

                for (let i = 0; i < chunks.length; i++) {
                    const rows = chunks[i];
                    const kcal = rows.reduce(
                        (a, r) => a + (r.calories ?? 0),
                        0,
                    );
                    const everyHasKcal = rows.every(
                        (r) => r.calories !== undefined,
                    );
                    const args = {
                        meals: rows,
                        expected_row_count: rows.length,
                        rows_skipped: i === 0 ? S.skipped : 0,
                        source_app: S.sourceApp || undefined,
                        // Dry-run the FIRST chunk only. A full second pass would
                        // double the call count, and at 60 requests/min a large
                        // file would hit the rate limit; the preview above has
                        // already shown the user what will be written.
                        dry_run: i === 0,
                    };
                    if (everyHasKcal) args.expected_total_kcal = kcal;

                    S.progress.label = tpl(
                        i === 0
                            ? T.importMeals.checkingRows
                            : T.importMeals.importingRows,
                        { n: rows.length },
                    );
                    render();

                    try {
                        const res = await API.callTool(
                            CFG.import_tool_name,
                            args,
                            { timeoutMs: 90000 },
                        );
                        const sc = res && res.structuredContent;
                        if (!sc) throw new Error("no result payload");
                        collect(sc);

                        if (i === 0) {
                            // Dry run: abort on failure rather than writing.
                            // Surfaced through chunkErrors (rendered right on
                            // this step) rather than a bare return — collect()
                            // already put the server's reason in S.result.warnings,
                            // but the preview step never renders that list, so a
                            // silent return here left the user staring at an
                            // unchanged preview with no visible explanation
                            // (issue #65).
                            if (sc.status === "failed") {
                                S.result.chunkErrors.push(
                                    tpl(T.importMeals.rowsRange, {
                                        a: rows[0].source_line,
                                        b: rows[rows.length - 1].source_line,
                                        msg:
                                            sc.warnings && sc.warnings.length
                                                ? sc.warnings.join("; ")
                                                : T.importMeals.preflightFailed,
                                    }),
                                );
                                S.busy = false;
                                S.progress = null;
                                render();
                                return;
                            }
                            // Passed — now write this chunk for real.
                            args.dry_run = false;
                            const real = await API.callTool(
                                CFG.import_tool_name,
                                args,
                                { timeoutMs: 90000 },
                            );
                            const rsc = real && real.structuredContent;
                            if (rsc) collect(rsc);
                        }
                    } catch (e) {
                        S.result.chunkErrors.push(
                            tpl(T.importMeals.rowsRange, {
                                a: rows[0].source_line,
                                b: rows[rows.length - 1].source_line,
                                msg: e.message,
                            }),
                        );
                    }
                    S.progress.done = i + 1;
                    render();
                }

                S.busy = false;
                S.progress = null;
                S.step = "done";
                render();

                // Tell the model what happened — a summary only, never rows.
                if (API.updateModelContext) {
                    const r = S.result;
                    API.updateModelContext(
                        "Bulk meal import finished: " +
                            r.created +
                            " meals imported, " +
                            r.deduplicated +
                            " already logged, " +
                            r.failed +
                            " failed" +
                            (S.skipped
                                ? ", " + S.skipped + " rows skipped"
                                : "") +
                            ". Source: " +
                            (S.fileName || "pasted data") +
                            ".",
                    );
                }
            }

            // Every failing row is reported TWICE — once by the dry run and
            // again by the real pass, which return identical per-row errors for
            // the same lines — into one array that is built once in runImport()
            // and never reset between the passes. The summary counter took only
            // the real pass's `failed`, so the card read "2 failed" above four
            // entries. A source_line is unique within an import (chunks do not
            // overlap lines), so keying on it is exact rather than approximate.
            function pushRowError(r, row) {
                if (r.rowErrors.some((e) => e.line === row.source_line)) return;
                r.rowErrors.push({
                    line: row.source_line,
                    message: row.error.message,
                });
            }

            function collect(sc) {
                const r = S.result;
                r.chunks++;
                if (sc.dry_run) {
                    for (const w of sc.warnings || []) {
                        if (r.warnings.indexOf(w) === -1) r.warnings.push(w);
                    }
                    for (const row of sc.results || []) {
                        if (row.error) pushRowError(r, row);
                    }
                    return;
                }
                r.created += sc.summary.created;
                r.deduplicated += sc.summary.deduplicated;
                r.failed += sc.summary.failed;
                for (const w of sc.warnings || []) {
                    if (r.warnings.indexOf(w) === -1) r.warnings.push(w);
                }
                for (const row of sc.results || []) {
                    if (row.error) pushRowError(r, row);
                }
            }

            // ---- rendering ---------------------------------------------------
            // A 3px progress rail and one mono line, in place of the four
            // numbered pills that used to sit here. Two reasons: the pills cost
            // ~26px of a card that has a form under it, and they were the one
            // element in this widget that could not fit 320px — four labels,
            // three arrows and four counters on one nowrap row overflowed in
            // every locale with a word longer than "Preview".
            // The two nodes share an unstyled wrapper so .imp's grid gap falls
            // between the rail and the card, not between the rail and its own
            // caption.
            function steps() {
                const order = ["file", "map", "preview", "done"];
                const names = [
                    T.importMeals.stepFile,
                    T.importMeals.stepMap,
                    T.importMeals.stepPreview,
                    T.importMeals.stepImport,
                ];
                // Guard the -1: render() only ever passes one of the four, but
                // a width of -0% and "step 0 of 4" is a nasty way to find out.
                const at = Math.max(0, order.indexOf(S.step));
                return (
                    '<div><div class="steps"><span style="width:' +
                    Math.round(((at + 1) / order.length) * 100) +
                    '%"></span></div><div class="slab">' +
                    esc(
                        tpl(T.importMeals.stepOf, {
                            n: at + 1,
                            total: order.length,
                            label: names[at],
                        }),
                    ) +
                    "</div></div>"
                );
            }

            function fileStep() {
                const noTools =
                    API && !API.canCallTools
                        ? notice("warn", esc(T.importMeals.noToolsWarning)) +
                          (SUPPORT_EMAIL
                              ? notice(
                                    "",
                                    tpl(T.importMeals.emailFallback, {
                                        email:
                                            "<b>" + esc(SUPPORT_EMAIL) + "</b>",
                                    }),
                                    "✉",
                                )
                              : "")
                        : "";
                const tzWarn = !CFG.tz_configured
                    ? notice("warn", esc(T.importMeals.tzWarning))
                    : "";
                return (
                    '<section class="card"><h3>' +
                    esc(T.importMeals.chooseExportHeading) +
                    "</h3>" +
                    noTools +
                    tzWarn +
                    (S.errors.length ? notice("error", esc(S.errors[0])) : "") +
                    '<label class="drop" id="drop">' +
                    icon("file", 22) +
                    "<strong>" +
                    esc(T.importMeals.dropChoose) +
                    "</strong><span>" +
                    esc(T.importMeals.dropOr) +
                    "</span>" +
                    '<input type="file" class="drop-input" id="file" accept=".csv,text/csv,text/plain" />' +
                    "</label>" +
                    '<div class="hint" style="margin-top:8px">' +
                    esc(T.importMeals.recognizedHint) +
                    "</div>" +
                    "</section>"
                );
            }

            // Worked examples: the first real value from the user's own file, run
            // through the very functions the import will use. Returns escaped HTML.
            function dateExampleHtml() {
                if (!(S.mapping.logged_at >= 0))
                    return esc(T.importMeals.dateMapHint);
                const raw = columnCells("logged_at", 1)[0];
                if (raw === undefined) return esc(T.importMeals.dateNoneHint);
                const iso = toIsoDate(raw, S.dateFormat);
                if (iso === null)
                    return esc(
                        tpl(T.importMeals.dateUnreadable, {
                            raw,
                            format: dateFormatLabel(S.dateFormat),
                        }),
                    );
                const time = normalizeTime(timeInDateCell(raw));
                return esc(
                    tpl(T.importMeals.dateConverted, {
                        raw,
                        result: iso + (time ? " " + time : ""),
                    }),
                );
            }
            function energyExampleHtml() {
                if (!(S.mapping.calories >= 0))
                    return esc(T.importMeals.energyMapHint);
                const v = columnNumbers("calories", 1)[0];
                if (v === undefined) return esc(T.importMeals.energyNoneHint);
                if (S.energyUnit === "kj")
                    return esc(
                        tpl(T.importMeals.energyConverted, {
                            v: numLocale(v, true),
                            kcal: numLocale(toKcal(v, "kj"), true),
                        }),
                    );
                return esc(
                    tpl(T.importMeals.energyNoConversion, {
                        v: numLocale(v, true),
                    }),
                );
            }

            function formatFieldsHtml() {
                const select = (id, options, sel) =>
                    '<select class="select" id="' +
                    id +
                    '">' +
                    options
                        .map(
                            (o) =>
                                '<option value="' +
                                o[0] +
                                '"' +
                                (sel === o[0] ? " selected" : "") +
                                ">" +
                                esc(o[1]) +
                                "</option>",
                        )
                        .join("") +
                    "</select>";
                return (
                    '<div style="margin-top:12px">' +
                    // Undecidable, so it must not be dressed up as auto-detected.
                    (S.dateAmbiguous
                        ? notice(
                              "warn",
                              esc(T.importMeals.dateAmbiguousWarning),
                          )
                        : "") +
                    '<div class="field"><label class="label" for="dateFormat">' +
                    esc(T.importMeals.dateFormatLabel) +
                    "</label>" +
                    select("dateFormat", dateFormatOptions(), S.dateFormat) +
                    '<span class="hint">' +
                    dateExampleHtml() +
                    "</span></div>" +
                    '<div class="field"><label class="label" for="energyUnit">' +
                    esc(T.importMeals.energyUnitLabel) +
                    "</label>" +
                    select("energyUnit", energyUnitOptions(), S.energyUnit) +
                    '<span class="hint">' +
                    energyExampleHtml() +
                    "</span></div>" +
                    "</div>"
                );
            }

            function mapStep() {
                const t = S.table;
                const opts = (sel) =>
                    '<option value="-1"' +
                    (sel === -1 ? " selected" : "") +
                    ">" +
                    esc(T.importMeals.notInFile) +
                    "</option>" +
                    t.headers
                        .map(
                            (h, i) =>
                                '<option value="' +
                                i +
                                '"' +
                                (sel === i ? " selected" : "") +
                                ">" +
                                esc(
                                    h ||
                                        tpl(T.importMeals.columnFallback, {
                                            n: i + 1,
                                        }),
                                ) +
                                "</option>",
                        )
                        .join("");
                return (
                    '<section class="card"><h3>' +
                    esc(T.importMeals.mapColumnsHeading) +
                    "</h3>" +
                    '<div class="stat-row"><span>' +
                    boldCount(plural(T.importMeals.rowsCount, t.rows.length)) +
                    "</span><span>" +
                    boldCount(
                        plural(T.importMeals.columnsCount, t.headers.length),
                    ) +
                    "</span><span>" +
                    esc(t.encoding) +
                    ", " +
                    esc(T.importMeals.delimiterLabel) +
                    " <b>" +
                    esc(
                        t.delimiter === "\t"
                            ? T.importMeals.tabLabel
                            : t.delimiter,
                    ) +
                    "</b></span></div>" +
                    t.warnings.map((w) => notice("warn", esc(w))).join("") +
                    (S.mapping.sugar_g === -1 && addedSugarColumns().length
                        ? notice(
                              "",
                              esc(
                                  tpl(T.importMeals.addedSugarNotice, {
                                      column: addedSugarColumns()[0],
                                  }),
                              ),
                          )
                        : "") +
                    (S.mapping.caffeine_mg === -1 &&
                    caffeineGramsColumns().length
                        ? notice(
                              "",
                              esc(
                                  tpl(T.importMeals.caffeineGramsNotice, {
                                      column: caffeineGramsColumns()[0],
                                  }),
                              ),
                          )
                        : "") +
                    (!alcoholTracked() && alcoholColumn()
                        ? notice(
                              "",
                              esc(
                                  tpl(T.importMeals.alcoholNotice, {
                                      column: alcoholColumn(),
                                  }),
                              ),
                          )
                        : "") +
                    '<div class="map-grid">' +
                    mappableFields()
                        .map((f) => {
                            const sel = S.mapping[f.key];
                            const sample =
                                sel >= 0 && t.rows[0] ? t.rows[0][sel] : "";
                            return (
                                '<div class="map-field"><div class="map-src">' +
                                esc(T.importMeals.fieldLabels[f.key]) +
                                (f.required
                                    ? ' <span style="color:var(--over)">*</span>'
                                    : "") +
                                '</div><div class="map-sample">' +
                                esc(
                                    sample
                                        ? tpl(T.importMeals.sampleValue, {
                                              sample,
                                          })
                                        : "",
                                ) +
                                "</div></div>" +
                                '<select class="select map-sel" data-field="' +
                                f.key +
                                '">' +
                                opts(sel) +
                                "</select>"
                            );
                        })
                        .join("") +
                    "</div>" +
                    formatFieldsHtml() +
                    '<div class="field"><label class="label">' +
                    esc(T.importMeals.sourceAppLabel) +
                    "</label>" +
                    '<input class="input" id="srcapp" value="' +
                    esc(S.sourceApp) +
                    '" placeholder="myfitnesspal" />' +
                    '<span class="hint">' +
                    esc(T.importMeals.sourceAppHint) +
                    "</span></div>" +
                    '<div class="actions"><button class="btn btn-primary" id="toPreview">' +
                    esc(T.importMeals.previewButton) +
                    "</button>" +
                    '<button class="btn" id="backToFile">' +
                    esc(T.importMeals.chooseAnotherButton) +
                    "</button></div>" +
                    "</section>"
                );
            }

            function previewStep() {
                const shown = S.rows.slice(0, 30);
                const kcal = S.rows.reduce((a, r) => a + (r.calories ?? 0), 0);
                const noTime = S.rows.filter(
                    (r) => !/\d\d:\d\d/.test(String(r.logged_at)),
                ).length;
                const { chunks: previewChunks, splitDates } = chunkRows(
                    S.rows,
                    CFG.max_rows_per_call,
                );
                const chunks = previewChunks.length;
                // Fiber, sugar, alcohol and caffeine are missing from most
                // exports, so their columns appear only when this file actually
                // carries them — four columns of "—" would push the macros that
                // do have values off the visible width for no information.
                // Alcohol additionally never appears with tracking off: the
                // rows carry none by then, but the column is filtered by the
                // opt-in as well as by the data, so a stray value could not
                // put ethanol on screen. Caffeine has no such gate; it is
                // filtered by the data alone.
                //
                // Column labels come from T.importMeals.col* (they were English
                // literals — "C" and "Sug" mean nothing in Polish or French),
                // escaped here, so c[1] is HTML: the unit sits in a .u span
                // that the uppercase header leaves alone (table.css).
                const extra = [
                    ["fiber_g", esc(T.importMeals.colFiber)],
                    ["sugar_g", esc(T.importMeals.colSugar)],
                    ["alcohol_g", esc(T.importMeals.colAlcohol), true],
                    [
                        "caffeine_mg",
                        `${esc(T.importMeals.colCaffeine)} <span class="u">${esc(unitLabel("mg"))}</span>`,
                    ],
                ].filter(
                    (c) =>
                        (!c[2] || alcoholTracked()) &&
                        S.rows.some((r) => r[c[0]] !== undefined),
                );
                return (
                    '<section class="card"><h3>' +
                    esc(T.importMeals.previewHeading) +
                    "</h3>" +
                    '<div class="stat-row"><span>' +
                    boldCount(
                        plural(T.importMeals.mealsToImport, S.rows.length),
                    ) +
                    "</span><span>" +
                    boldCount(
                        tpl(T.importMeals.kcalTotal, {
                            kcal: numLocale(kcal, true),
                        }),
                    ) +
                    "</span>" +
                    (S.skipped
                        ? "<span>" +
                          boldCount(
                              tpl(T.importMeals.rowsSkipped, {
                                  n: S.skipped,
                              }),
                          ) +
                          "</span>"
                        : "") +
                    "<span>" +
                    boldCount(plural(T.importMeals.batchCount, chunks)) +
                    "</span></div>" +
                    // State the two conversions applied, so the confirmation step
                    // shows what will be sent rather than what the file said.
                    '<div class="hint" style="margin-bottom:10px">' +
                    esc(
                        tpl(T.importMeals.datesReadAs, {
                            format: dateFormatLabel(S.dateFormat),
                            conversion:
                                S.energyUnit === "kj"
                                    ? T.importMeals.energyConvertedNote
                                    : T.importMeals.energyReadAsKcal,
                        }),
                    ) +
                    "</div>" +
                    // Importing fewer rows than the file holds is the exact failure
                    // this flow exists to prevent, so never let it pass silently.
                    (S.badDates
                        ? notice(
                              "warn",
                              esc(
                                  tpl(T.importMeals.badDatesWarning, {
                                      n: S.badDates,
                                      format: dateFormatLabel(S.dateFormat),
                                      sample: S.badDateSample
                                          ? tpl(T.importMeals.badDateSample, {
                                                line: S.badDateSample.line,
                                                value: S.badDateSample.value,
                                            })
                                          : "",
                                  }),
                              ),
                          )
                        : "") +
                    (noTime
                        ? notice(
                              "warn",
                              esc(
                                  tpl(T.importMeals.noTimeWarning, {
                                      n: noTime,
                                  }),
                              ),
                          )
                        : "") +
                    // A calendar date with more than max_rows_per_call rows on
                    // its own has to be split across more than one import
                    // call — max_rows_per_call and "keep every date together"
                    // cannot both hold there. Flagged so the user knows why,
                    // and because two identical rows for that date landing in
                    // different calls can dedupe against each other instead of
                    // both being written (see chunkRows in src/chunk.ts).
                    (splitDates.length
                        ? notice(
                              "warn",
                              esc(
                                  plural(
