                                      T.importMeals.splitDatesCount,
                                      splitDates.length,
                                  ) +
                                      tpl(T.importMeals.splitDatesWarning, {
                                          max: CFG.max_rows_per_call,
                                          date: splitDates[0],
                                      }),
                              ),
                          )
                        : "") +
                    // .tedge wraps the scroller so its edge fades stay put
                    // while the rows move under them; wireScrollEdges() turns
                    // them on from scrollLeft.
                    //
                    // role/tabindex/aria-label, not decoration: the scroller is
                    // a real tab stop (browsers focus a keyboard-scrollable box
                    // whether or not we ask them to), and it was announcing as
                    // an unnamed group ahead of every button on this step. The
                    // name is the step's own heading — the widest column of the
                    // table is off-screen at 320px, so "Preview" is what the
                    // thing being scrolled is called on screen. tabindex="0" is
                    // explicit because focusable-scroller is Chrome behaviour,
                    // not a guarantee; table.css draws the ring.
                    '<div class="tedge"><div class="tscroll" role="region" tabindex="0" aria-label="' +
                    esc(T.importMeals.previewHeading) +
                    '"><table class="tbl"><thead><tr>' +
                    "<th>" +
                    esc(T.importMeals.tableLine) +
                    "</th><th>" +
                    esc(T.importMeals.tableWhen) +
                    "</th><th>" +
                    esc(T.importMeals.tableMeal) +
                    "</th><th class='wide'>" +
                    esc(T.importMeals.tableFood) +
                    "</th>" +
                    '<th class="num"><span class="u">' +
                    esc(unitLabel("kcal")) +
                    '</span></th><th class="num">' +
                    esc(T.importMeals.colProtein) +
                    '</th><th class="num">' +
                    esc(T.importMeals.colCarbs) +
                    '</th><th class="num">' +
                    esc(T.importMeals.colFat) +
                    "</th>" +
                    extra
                        .map((c) => '<th class="num">' + c[1] + "</th>")
                        .join("") +
                    "</tr></thead><tbody>" +
                    shown
                        .map(
                            (r) =>
                                "<tr><td class='dim'>" +
                                r.source_line +
                                "</td><td>" +
                                esc(r.logged_at) +
                                "</td><td>" +
                                esc(r.meal_type || "—") +
                                "</td><td class='wide'>" +
                                esc(
                                    r.description ||
                                        T.importMeals.noNameFallback,
                                ) +
                                '</td><td class="num">' +
                                cellNum(r.calories) +
                                '</td><td class="num">' +
                                cellNum(r.protein_g) +
                                '</td><td class="num">' +
                                cellNum(r.carbs_g) +
                                '</td><td class="num">' +
                                cellNum(r.fat_g) +
                                "</td>" +
                                extra
                                    .map(
                                        (c) =>
                                            '<td class="num">' +
                                            cellNum(r[c[0]]) +
                                            "</td>",
                                    )
                                    .join("") +
                                "</tr>",
                        )
                        .join("") +
                    "</tbody></table>" +
                    (S.rows.length > shown.length
                        ? '<div class="tmore">' +
                          esc(
                              tpl(T.importMeals.showingRows, {
                                  shown: shown.length,
                                  total: S.rows.length,
                              }),
                          ) +
                          "</div>"
                        : "") +
                    "</div></div>" +
                    (S.progress
                        ? '<div style="margin-top:12px"><div class="bar"><span style="width:' +
                          Math.round(
                              (S.progress.done / S.progress.total) * 100,
                          ) +
                          '%"></span></div><div class="hint" style="margin-top:6px">' +
                          esc(
                              tpl(T.importMeals.batchProgress, {
                                  label: S.progress.label,
                                  done: S.progress.done,
                                  total: S.progress.total,
                              }),
                          ) +
                          "</div></div>"
                        : "") +
                    (S.result && S.result.chunkErrors.length
                        ? S.result.chunkErrors
                              .map((e) => notice("error", esc(e)))
                              .join("")
                        : "") +
                    (S.result && S.result.rowErrors.length && !S.busy
                        ? notice(
                              "error",
                              esc(
                                  tpl(T.importMeals.rowsWouldFail, {
                                      n: S.result.rowErrors.length,
                                      line: S.result.rowErrors[0].line,
                                      message: S.result.rowErrors[0].message,
                                  }),
                              ),
                          )
                        : "") +
                    (S.badDates > 0 ? diagnosticsBlock() : "") +
                    '<div class="actions"><button class="btn btn-primary" id="doImport"' +
                    (S.busy || !(API && API.canCallTools) ? " disabled" : "") +
                    ">" +
                    esc(
                        S.busy
                            ? T.importMeals.importingEllipsis
                            : tpl(T.importMeals.importButton, {
                                  n: S.rows.length,
                              }),
                    ) +
                    "</button>" +
                    '<button class="btn" id="backToMap"' +
                    (S.busy ? " disabled" : "") +
                    ">" +
                    esc(T.importMeals.backToMapping) +
                    "</button></div>" +
                    "</section>"
                );
            }

            function doneStep() {
                const r = S.result || {
                    created: 0,
                    deduplicated: 0,
                    failed: 0,
                };
                const ok = r.failed === 0 && !r.chunkErrors.length;
                const tail =
                    (r.deduplicated
                        ? tpl(T.importMeals.resultAlreadyLogged, {
                              n: r.deduplicated,
                          })
                        : "") +
                    (r.failed
                        ? tpl(T.importMeals.resultFailed, { n: r.failed })
                        : "") +
                    (S.skipped
                        ? tpl(T.importMeals.resultSkipped, { n: S.skipped })
                        : "");
                return (
                    '<section class="card"><h3>' +
                    esc(T.importMeals.importCompleteHeading) +
                    "</h3>" +
                    notice(
                        ok ? "ok" : "warn",
                        boldCount(
                            tpl(T.importMeals.resultMealsImported, {
                                n: r.created,
                            }),
                        ) +
                            esc(tail) +
                            ".",
                    ) +
                    (r.warnings || []).map((w) => notice("", esc(w))).join("") +
                    (r.rowErrors && r.rowErrors.length
                        ? // Same contract as the preview scroller above: a
                          // named, ringed tab stop rather than an anonymous one.
                          // Named with the table's own "Problem" column header —
                          // the one translated leaf that says what these rows
                          // are. A dedicated leaf would read better; adding one
                          // touches all 9 copy files, which are another agent's
                          // this round (noted in the handover).
                          '<div class="tedge"><div class="tscroll" role="region" tabindex="0" aria-label="' +
                          esc(T.importMeals.tableProblem) +
                          '" style="max-height:160px"><table class="tbl"><thead><tr><th>' +
                          esc(T.importMeals.tableLine) +
                          '</th><th class="wide">' +
                          esc(T.importMeals.tableProblem) +
                          "</th></tr></thead><tbody>" +
                          r.rowErrors
                              .slice(0, 20)
                              .map(
                                  (e) =>
                                      "<tr class='bad'><td class='dim'>" +
                                      e.line +
                                      "</td><td class='wide'>" +
                                      esc(e.message) +
                                      "</td></tr>",
                              )
                              .join("") +
                          "</tbody></table></div></div>"
                        : "") +
                    (ok ? "" : diagnosticsBlock()) +
                    '<div class="actions"><button class="btn" id="restart">' +
                    esc(T.importMeals.restartButton) +
                    "</button></div>" +
                    "</section>"
                );
            }

            function render() {
                const el = document.getElementById("root");
                if (!el) return;
                let body = "";
                if (S.step === "file") body = fileStep();
                else if (S.step === "map") body = mapStep();
                else if (S.step === "preview") body = previewStep();
                else body = doneStep();
                el.innerHTML = '<div class="imp">' + steps() + body + "</div>";
                wire();
            }

            // Turn each .tedge's edge fades on and off from its scroller's
            // position. Called from wire() after every render(), because
            // render() replaces the whole subtree and the listeners with it.
            //
            // Toggling a class that only changes `opacity` is deliberate: this
            // runs on scroll and on resize, and anything that moved a box here
            // would feed straight back into bridge.js's ResizeObserver.
            function wireScrollEdges() {
                for (const edge of document.querySelectorAll(".tedge")) {
                    const sc = edge.querySelector(".tscroll");
                    if (!sc) continue;
                    const paint = () => {
                        // 1px of slack: a fractional scrollWidth on a
                        // fully-scrolled container otherwise leaves the right
                        // fade on forever.
                        const max = sc.scrollWidth - sc.clientWidth - 1;
                        edge.classList.toggle("more-left", sc.scrollLeft > 1);
                        edge.classList.toggle(
                            "more-right",
                            max > 0 && sc.scrollLeft < max,
                        );
                        // The scroller is a named, focusable region (see the
                        // markup) so a keyboard user can scroll it at all. It
                        // earns that tab stop only while there is something to
                        // scroll: at 560px the done step's two-column error
                        // table fits, and a stop that does nothing is noise
                        // ahead of the only button on the step. Re-asked on
                        // every resize, because whether it overflows is the
                        // host's decision, not ours. Writes one property that
                        // changes no box, so it cannot feed bridge.js's
                        // ResizeObserver.
                        sc.tabIndex =
                            sc.scrollWidth > sc.clientWidth ||
                            sc.scrollHeight > sc.clientHeight
                                ? 0
                                : -1;
                    };
                    sc.addEventListener("scroll", paint, { passive: true });
                    // The widget is resized by the host, not by the user, so
                    // "does this still overflow?" has to be re-asked whenever
                    // the container changes width. Safe against a feedback
                    // loop: paint() writes only class names.
                    if (typeof ResizeObserver === "function") {
                        new ResizeObserver(paint).observe(sc);
                    }
                    paint();
                }
            }

            function wire() {
                wireScrollEdges();
                const file = document.getElementById("file");
                if (file)
                    file.onchange = (e) => {
                        const f = e.target.files && e.target.files[0];
                        if (f) loadFile(f);
                    };
                const drop = document.getElementById("drop");
                if (drop) {
                    drop.ondragover = (e) => {
                        e.preventDefault();
                        drop.classList.add("over");
                    };
                    drop.ondragleave = () => drop.classList.remove("over");
                    drop.ondrop = (e) => {
                        e.preventDefault();
                        drop.classList.remove("over");
                        const f =
                            e.dataTransfer &&
                            e.dataTransfer.files &&
                            e.dataTransfer.files[0];
                        if (f) loadFile(f);
                    };
                }
                for (const sel of document.querySelectorAll(".map-sel")) {
                    sel.onchange = (e) => {
                        const field = e.target.dataset.field;
                        S.mapping[field] = Number(e.target.value);
                        // The date format and energy unit were read off the column
                        // that was mapped a moment ago, so a remap invalidates
                        // them: sniff the newly chosen column instead.
                        if (field === "logged_at") resniffDateFormat();
                        if (field === "calories") resniffEnergyUnit();
                        render();
                    };
                }
                // Re-rendering on change is what makes the worked example live.
                const dateFormat = document.getElementById("dateFormat");
                if (dateFormat)
                    dateFormat.onchange = (e) => {
                        S.dateFormat = e.target.value;
                        // The user has now stated it, so stop asking.
                        S.dateAmbiguous = false;
                        render();
                    };
                const energyUnit = document.getElementById("energyUnit");
                if (energyUnit)
                    energyUnit.onchange = (e) => {
                        S.energyUnit = e.target.value;
                        render();
                    };
                const srcapp = document.getElementById("srcapp");
                if (srcapp)
                    srcapp.oninput = (e) => {
                        S.sourceApp = e.target.value.trim();
                    };
                const toPreview = document.getElementById("toPreview");
                if (toPreview)
                    toPreview.onclick = () => {
                        buildRows();
                        S.step = "preview";
                        S.result = null;
                        render();
                    };
                const backToFile = document.getElementById("backToFile");
                if (backToFile)
                    backToFile.onclick = () => {
                        S.step = "file";
                        render();
                    };
                const backToMap = document.getElementById("backToMap");
                if (backToMap)
                    backToMap.onclick = () => {
                        S.step = "map";
                        render();
                    };
                const doImport = document.getElementById("doImport");
                if (doImport) doImport.onclick = () => runImport();
                const restart = document.getElementById("restart");
                if (restart)
                    restart.onclick = () => {
                        S.step = "file";
                        S.table = null;
                        S.rows = [];
                        S.result = null;
                        S.errors = [];
                        S.dateFormat = "iso";
                        S.dateAmbiguous = false;
                        S.energyUnit = "kcal";
                        S.badDates = 0;
                        S.badDateSample = null;
                        render();
                    };
            }

            initWidget({
                name: "import-meals-widget",
                loading:
                    '<div class="empty"><div class="big">📥</div><div>Preparing import…</div></div>',
                coerce: (payload) => {
                    if (!payload || typeof payload !== "object") return null;
                    // start_meal_import's own payload, or a wrapper round it.
                    if (payload.import_tool_name || payload.tz) return payload;
                    if (payload.structuredContent)
                        return payload.structuredContent;
                    return null;
                },
                render: (data) => {
                    if (data && data.import_tool_name) {
                        CFG = Object.assign({}, CFG, data);
                    }
                    setLocale(
                        pickLocale(
                            CFG.locale,
                            API && API.hostContext
                                ? API.hostContext.locale
                                : null,
                        ),
                    );
                    render();
                },
                sample: {
                    tz: "Europe/Kyiv",
                    today: "2026-07-25",
                    max_rows_per_call: 50,
                    import_tool_name: "bulk_import_meals",
                    known_source_apps: ["myfitnesspal", "cronometer"],
                    tz_configured: true,
                    // Tracking off is the default account state, so it is what
                    // the standalone preview shows.
                    drink_unit: null,
                    locale: "en",
                },
                onReady: (api) => {
                    API = api;
                    render();
                },
            });
        </script>
    </body>
</html>
