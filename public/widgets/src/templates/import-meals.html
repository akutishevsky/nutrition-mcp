                                CFG.import_tool_name,
                                args,
                                { timeoutMs: 90000 },
                            );
                            const rsc = real && real.structuredContent;
                            if (rsc) collect(rsc);
                        }
                    } catch (e) {
                        S.result.chunkErrors.push(
                            tpl(T.importMeals.rowsRange, {
                                a: rows[0].source_line,
                                b: rows[rows.length - 1].source_line,
                                msg: e.message,
                            }),
                        );
                    }
                    S.progress.done = i + 1;
                    render();
                }

                S.busy = false;
                S.progress = null;
                S.step = "done";
                S.focus = ".ptitle";
                announce(
                    plural(T.importMeals.liveDone, S.result.created, {
                        n: fmtCount(S.result.created),
                    }),
                );

                // Tell the model what happened — a summary only, never rows.
                // Kept on S too: the done step shows the user this exact
                // sentence, so they can see that nothing more left the panel.
                // English on purpose, like every tool's model-facing text.
                const r = S.result;
                const summary =
                    "Bulk meal import finished: " +
                    r.created +
                    " meals imported, " +
                    r.deduplicated +
                    " already logged, " +
                    r.failed +
                    " failed" +
                    (S.skipped ? ", " + S.skipped + " rows skipped" : "") +
                    ". Source: " +
                    (S.fileName || "pasted data") +
                    ".";
                render();
                // The done step quotes the summary as what the assistant was
                // told, so show it only once the host accepted it: the
                // bridge resolves false when the request fails or times out
                // (a host without ui/update-model-context, say).
                if (API.updateModelContext)
                    Promise.resolve(API.updateModelContext(summary)).then(
                        (ok) => {
                            if (ok === false || S.result !== r) return;
                            S.modelSummary = summary;
                            if (S.step === "done") render();
                        },
                    );
            }

            function collect(sc) {
                const r = S.result;
                r.chunks++;
                if (sc.dry_run) {
                    // A dry run that passes is followed at once by the real
                    // write of the same rows, which reports its own warnings
                    // and row errors. Keeping the dry run's too would count
                    // every failed row twice and show dry-run-only advice
                    // ("repeat this dry run") after the rows were written.
                    // Only a failed dry run, where the flow stops, keeps them.
                    if (sc.status !== "failed") return;
                    for (const w of sc.warnings || []) {
                        if (r.warnings.indexOf(w) === -1) r.warnings.push(w);
                    }
                    for (const row of sc.results || []) {
                        if (row.error) {
                            r.rowErrors.push({
                                line: row.source_line,
                                message: row.error.message,
                            });
                        }
                    }
                    return;
                }
                r.created += sc.summary.created;
                r.deduplicated += sc.summary.deduplicated;
                r.failed += sc.summary.failed;
                for (const w of sc.warnings || []) {
                    if (r.warnings.indexOf(w) === -1) r.warnings.push(w);
                }
                for (const row of sc.results || []) {
                    if (row.error) {
                        r.rowErrors.push({
                            line: row.source_line,
                            message: row.error.message,
                        });
                    }
                }
            }

            // ---- rendering ---------------------------------------------------
            //
            // Every string below comes from T.importMeals (or T.macros for
            // nutrient names and units); numbers go through Intl.NumberFormat
            // in the widget's locale. The only literals left are brand names,
            // the date-format examples (numbers, the same in every language)
            // and glue punctuation between already-translated pieces.

            // Polite live region outside #root (see the markup). Setting the
            // same text twice is not re-announced, so clear it first.
            function announce(text) {
                const el =
                    typeof document !== "undefined" &&
                    document.getElementById("imp-live");
                if (!el) return;
                el.textContent = "";
                setTimeout(() => {
                    el.textContent = text;
                }, 30);
            }
            function stepAnnouncement() {
                const order = ["file", "map", "preview", "done"];
                const i = order.indexOf(S.step);
                return tpl(T.importMeals.liveStep, {
                    i: i + 1,
                    name: stepNames()[i],
                });
            }

            const NUMBER_FORMATS = {};
            function numberFormat(maxDigits) {
                const key = WIDGET_LOCALE + ":" + maxDigits;
                if (!NUMBER_FORMATS[key]) {
                    try {
                        NUMBER_FORMATS[key] = new Intl.NumberFormat(
                            WIDGET_LOCALE,
                            { maximumFractionDigits: maxDigits },
                        );
                    } catch (_) {
                        NUMBER_FORMATS[key] = { format: (v) => String(v) };
                    }
                }
                return NUMBER_FORMATS[key];
            }
            // A count (rows, meals, batches): whole numbers, grouped.
            function fmtCount(n) {
                return numberFormat(0).format(n);
            }
            // A nutrient value as read from the file, or "—" when the row has
            // none (absent, never a fabricated 0).
            function fmtVal(v) {
                return v === undefined || v === null
                    ? "—"
                    : numberFormat(2).format(v);
            }

            const ICON = {
                chev: '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.6" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>',
                left: '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.6" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
                right: '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.6" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
                check: '<svg class="ico ck" width="14" height="14" viewBox="0 0 24 24" stroke-width="3.2" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
                lock: '<svg class="ico" width="14" height="14" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
                info: '<svg class="ico" width="15" height="15" viewBox="0 0 24 24" stroke-width="2.2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.01"/></svg>',
            };
            // The CSV document: a page with a folded corner and a green
            // label. Drawn from theme tokens, so it follows light and dark.
            function docIcon() {
                return (
                    '<svg class="dic" viewBox="0 0 46 54" aria-hidden="true">' +
                    '<path class="doc-page" d="M6 2h24l14 14v32a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V6a4 4 0 0 1 4-4z"/>' +
                    '<path class="doc-fold" d="M30 2v10a4 4 0 0 0 4 4h10"/>' +
                    '<rect class="doc-bar" x="9" y="27" width="28" height="15" rx="3"/>' +
                    '<path class="doc-lines" d="M14 31.5h18M14 37.5h12"/>' +
                    "</svg>"
                );
            }

            // One notice. kind: info | warn | bad | mail. `html` is already
            // escaped by the caller.
            function nt(kind, html, role) {
                const ic = { info: "i", warn: "!", bad: "✕", mail: "✉" }[kind];
                return (
                    '<div class="nt ' +
                    kind +
                    '" role="' +
                    (role || (kind === "bad" ? "alert" : "note")) +
                    '"><i aria-hidden="true">' +
                    ic +
                    "</i><span>" +
                    html +
                    "</span></div>"
                );
            }
            function notices(list) {
                return list.length
                    ? '<div class="nts">' + list.join("") + "</div>"
                    : "";
            }

            function stepNames() {
                return [
                    T.importMeals.stepFile,
                    T.importMeals.stepMap,
                    T.importMeals.stepPreview,
                    T.importMeals.stepImport,
                ];
            }
            function header() {
                const order = ["file", "map", "preview", "done"];
                const at = order.indexOf(S.step);
                const names = stepNames();
                const steps = names
                    .map((name, i) => {
                        const cls =
                            "st" +
                            (i === at ? " cur" : i < at ? " done" : "") +
                            (i < at && i >= PAINT.prevAt ? " pop" : "") +
                            (i === 3 && S.busy ? " run" : "");
                        const aria = tpl(
                            i < at
                                ? T.importMeals.stepAriaDone
                                : i === at
                                  ? T.importMeals.stepAriaCurrent
                                  : T.importMeals.stepAriaUpcoming,
                            { i: i + 1, name },
                        );
                        return (
                            '<li class="' +
                            cls +
                            '"' +
                            (i === at ? ' aria-current="step"' : "") +
                            '><span class="sd" aria-hidden="true"><span class="sn">' +
                            (i + 1) +
                            "</span>" +
                            ICON.check +
                            '</span><span class="sl" aria-hidden="true">' +
                            esc(name) +
                            '</span><span class="vh">' +
                            esc(aria) +
                            "</span></li>"
                        );
                    })
                    .join("");
                const title = {
                    file: T.importMeals.chooseExportHeading,
                    map: T.importMeals.mapColumnsHeading,
                    preview: T.importMeals.previewHeading,
                    done: T.importMeals.importCompleteHeading,
                }[S.step];
                const eyebrow =
                    S.fileName && S.step !== "file"
                        ? tpl(T.importMeals.eyebrowWithFile, {
                              file: S.fileName,
                          })
                        : T.importMeals.eyebrow;
                return (
                    '<span class="eyb2">' +
                    esc(eyebrow) +
                    "</span>" +
                    '<ol class="stp" aria-label="' +
                    esc(T.importMeals.stepsLabel) +
                    '">' +
                    steps +
                    "</ol>" +
                    '<h2 class="ptitle" tabindex="-1">' +
                    esc(title) +
                    "</h2>"
                );
            }

            // The action bar: secondary then primary. Disabled buttons stay
            // focusable (aria-disabled), so the reason under them is
            // reachable; the click handler ignores them.
            function actionBar(o) {
                const btn = (b, prim) => {
                    if (!b) return "";
                    const cls =
                        "reset " +
                        (prim
                            ? "prim" +
                              (b.soft ? " soft" : "") +
                              (b.busy ? " busy" : "")
                            : "sec") +
                        (b.dis ? " dis" : "");
                    return (
                        '<button type="button" class="' +
                        cls +
                        '" id="' +
                        b.id +
                        '" data-act="' +
                        b.id +
                        '" data-k="' +
                        b.id +
                        '"' +
                        (b.dis ? ' aria-disabled="true"' : "") +
                        ">" +
                        (b.busy
                            ? '<span class="spin" aria-hidden="true"></span>'
                            : "") +
                        "<span>" +
                        esc(b.txt) +
                        "</span></button>"
                    );
                };
                return (
                    '<div class="abar">' +
                    (o.prog || "") +
                    (o.why ? '<p class="why">' + esc(o.why) + "</p>" : "") +
                    '<div class="abtns">' +
                    btn(o.sec, false) +
                    btn(o.pri, true) +
                    "</div></div>"
                );
            }

            // ---- file step ----
            function fileStep() {
                const list = [];
                if (API && !API.canCallTools) {
                    list.push(nt("warn", esc(T.importMeals.noToolsWarning)));
                    if (SUPPORT_EMAIL)
                        list.push(
                            nt(
                                "mail",
                                tpl(esc(T.importMeals.emailFallback), {
                                    email: "<b>" + esc(SUPPORT_EMAIL) + "</b>",
                                }),
                            ),
                        );
                }
                if (!CFG.tz_configured)
                    list.push(nt("warn", esc(T.importMeals.tzWarning)));
                const err = S.errors.length
                    ? '<div class="errs" tabindex="-1">' +
                      nt(
                          "bad",
                          (S.fileName
                              ? "<b>" + esc(S.fileName) + "</b> · "
                              : "") + esc(S.errors[0]),
                      ) +
                      "</div>"
                    : "";
                return (
                    '<div class="pane">' +
                    notices(list) +
                    err +
                    '<button type="button" class="reset drop' +
                    (S.over ? " over" : "") +
                    '" id="drop" data-act="choose" data-k="drop" aria-label="' +
                    esc(T.importMeals.dropAria) +
                    '">' +
                    docIcon() +
                    '<span class="dt">' +
                    esc(T.importMeals.dropChoose) +
                    '</span><span class="dor">' +
                    esc(T.importMeals.dropOr) +
                    '</span><span class="dpill">' +
                    esc(T.importMeals.browseFiles) +
                    '</span><span class="dacc">' +
                    esc(T.importMeals.dropAccept) +
                    "</span></button>" +
                    // The real chooser, behind the button. Out of the tab order
                    // and the accessibility tree: the button above is the one
                    // control, and it forwards the click.
                    '<input type="file" class="vh" id="file" tabindex="-1" aria-hidden="true" accept=".csv,.tsv,.txt,text/csv,text/plain,text/tab-separated-values" />' +
                    '<p class="hint2">' +
                    esc(T.importMeals.recognizedHint) +
                    "</p>" +
                    // The note describes the in-panel path. With no tool
                    // access the user is sent to the chat instead, where the
                    // rows do pass through the assistant, so it would mislead.
                    (API && !API.canCallTools
                        ? ""
                        : '<div class="priv">' +
                          ICON.lock +
                          "<span>" +
                          esc(T.importMeals.privacyNote) +
                          "</span></div>") +
                    "</div>"
                );
            }

            // ---- map step ----

            // Worked examples: the first real value from the user's own file, run
            // through the very functions the import will use. Returns
            // [escaped HTML, hint class].
            function dateExample() {
                if (!(S.mapping.logged_at >= 0))
                    return [esc(T.importMeals.dateMapHint), "hint"];
                const raw = columnCells("logged_at", 1)[0];
                if (raw === undefined)
                    return [esc(T.importMeals.dateNoneHint), "hint"];
                const iso = toIsoDate(raw, S.dateFormat);
                if (iso === null)
                    return [
                        esc(
                            tpl(T.importMeals.dateUnreadable, {
                                raw,
                                format: dateFormatLabel(S.dateFormat),
                            }),
                        ),
                        "hint bad",
                    ];
                const time = normalizeTime(timeInDateCell(raw));
                return [
                    esc(
                        tpl(T.importMeals.dateConverted, {
                            raw,
                            result: iso + (time ? " " + time : ""),
                        }),
                    ),
                    "hint ok",
                ];
            }
            function energyExample() {
                if (!(S.mapping.calories >= 0))
                    return [esc(T.importMeals.energyMapHint), "hint"];
                const v = columnNumbers("calories", 1)[0];
                if (v === undefined)
                    return [esc(T.importMeals.energyNoneHint), "hint"];
                if (S.energyUnit === "kj")
                    return [
                        esc(
                            tpl(T.importMeals.energyConverted, {
                                v: fmtVal(v),
                                kcal: fmtVal(toKcal(v, "kj")),
                            }),
                        ),
                        "hint ok",
                    ];
                return [
                    esc(
                        tpl(T.importMeals.energyNoConversion, {
                            v: fmtVal(v),
                        }),
                    ),
                    "hint ok",
                ];
            }

            // A segmented radio group. act: the data-act of its options.
            function segGroup(act, label, options, selected, vertical) {
                return (
                    '<div class="seg' +
                    (vertical ? " v" : "") +
                    '" role="radiogroup" aria-label="' +
                    esc(label) +
                    '">' +
                    options
                        .map(
                            (o) =>
                                '<button type="button" class="reset sgb' +
                                (o.v === selected ? " on" : "") +
                                '" role="radio" aria-checked="' +
                                (o.v === selected) +
                                '" tabindex="' +
                                (o.v === selected ? "0" : "-1") +
                                '" data-act="' +
                                act +
                                '" data-v="' +
                                o.v +
                                '" data-k="' +
                                act +
                                ":" +
                                o.v +
                                '"><span>' +
                                esc(o.label) +
                                "</span><small>" +
                                esc(o.ex) +
                                "</small></button>",
                        )
                        .join("") +
                    "</div>"
                );
            }
            function dateFormatBlock() {
                const [hint, cls] = dateExample();
                // Undecidable, so it must not be dressed up as auto-detected:
                // the box turns amber and says so until the user picks one.
                return (
                    '<div class="fmt' +
                    (S.dateAmbiguous ? " amb" : "") +
                    '">' +
                    (S.dateAmbiguous
                        ? nt("warn", esc(T.importMeals.dateAmbiguousWarning))
                        : "") +
                    '<span class="fl" aria-hidden="true">' +
                    esc(T.importMeals.dateFormatLabel) +
                    "</span>" +
                    segGroup(
                        "df",
                        T.importMeals.dateFormatLabel,
                        [
                            {
                                v: "iso",
                                label: T.importMeals.dateFormatYmd,
                                ex: "2026-07-18",
                            },
                            {
                                v: "dmy",
                                label: T.importMeals.dateFormatDmy,
                                ex: "18/07/2026",
                            },
                            {
                                v: "mdy",
                                label: T.importMeals.dateFormatMdy,
                                ex: "07/18/2026",
                            },
                        ],
                        S.dateFormat,
                        true,
                    ) +
                    '<span class="' +
                    cls +
                    '">' +
                    hint +
                    "</span></div>"
                );
            }
            function energyBlock() {
                const [hint, cls] = energyExample();
                return (
                    '<div class="fmt"><span class="fl" aria-hidden="true">' +
                    esc(T.importMeals.energyUnitLabel) +
                    "</span>" +
                    segGroup(
                        "eu",
                        T.importMeals.energyUnitLabel,
                        [
                            {
                                v: "kcal",
                                label: T.importMeals.energyUnitKcal,
                                ex: "kcal",
                            },
                            {
                                v: "kj",
                                label: T.importMeals.energyUnitKj,
                                ex: "kJ",
                            },
                        ],
                        S.energyUnit,
                        false,
                    ) +
                    '<span class="' +
                    cls +
                    '">' +
                    hint +
                    "</span></div>"
                );
            }
            // `where` keeps the two copies' ids apart (one shows per layout).
            function sourceAppBlock(where) {
                const id = "srcapp-" + where;
                return (
                    '<div class="fld"><label class="fl" for="' +
                    id +
                    '">' +
                    esc(T.importMeals.sourceAppLabel) +
                    '</label><input class="inp" type="text" id="' +
                    id +
                    '" data-act="srcapp" data-k="' +
                    id +
                    '" value="' +
                    esc(S.sourceApp) +
                    '" placeholder="myfitnesspal" autocomplete="off" spellcheck="false" /><span class="hint">' +
                    esc(T.importMeals.sourceAppHint) +
                    "</span></div>"
                );
            }

            const APP_NAMES = {
                cronometer: "Cronometer",
                myfitnesspal: "MyFitnessPal",
                loseit: "Lose It!",
                macrofactor: "MacroFactor",
            };
            function columnName(i) {
                return (
                    S.table.headers[i] ||
                    tpl(T.importMeals.columnFallback, { n: i + 1 })
                );
            }
            function fieldLabel(key) {
                return T.importMeals.fieldLabels[key];
            }

            function mapRow(f, used, row1) {
                const k = f.key;
                const sel = S.mapping[k];
                const mapped = sel >= 0;
                const open = S.open === k;
                const sampleCell = mapped && row1 ? row1[sel] : "";
                const hasSample = mapped && !isBlankCell(sampleCell);
                const sample = hasSample
                    ? tpl(T.importMeals.sampleValue, {
                          sample: sampleCell.trim(),
                      })
                    : "";
                const others = mapped
                    ? (used[sel] || []).filter((x) => x !== k)
                    : [];
                const label = fieldLabel(k);
                const cls =
                    "mrow" +
                    (mapped ? " on" : " off") +
                    (open ? " open" : "") +
                    (f.required && !mapped ? " need" : "");
                const colNo = mapped
                    ? tpl(
                          sel === S.autoMapping[k]
                              ? T.importMeals.colNumberAuto
                              : T.importMeals.colNumberManual,
                          { n: sel + 1 },
                      )
                    : "";
                const aria = tpl(T.importMeals.mapRowAria, {
                    field: label,
                    required: f.required ? T.importMeals.requiredAria : "",
                    column: mapped
                        ? tpl(T.importMeals.columnAria, {
                              n: sel + 1,
                              name: columnName(sel),
                          })
                        : T.importMeals.notInFileAria,
                    sample: hasSample
                        ? tpl(T.importMeals.sampleAria, { sample })
                        : "",
                });
                let opts = "";
                if (open) {
                    const choices = [-1].concat(
                        S.table.headers.map((_, i) => i),
                    );
                    opts =
                        '<div class="opts' +
                        (PAINT.optsEnter ? " enter" : "") +
                        '" role="radiogroup" id="opts-' +
                        k +
                        '" aria-label="' +
                        esc(
                            tpl(T.importMeals.columnForAria, { field: label }),
                        ) +
                        '">' +
                        choices
                            .map((i) => {
                                const on = i === sel || (i === -1 && !mapped);
                                const also =
                                    i >= 0
                                        ? (used[i] || []).filter((x) => x !== k)
                                        : [];
                                const cell = i >= 0 && row1 ? row1[i] : "";
                                return (
                                    '<button type="button" class="reset opt' +
                                    (on ? " on" : "") +
                                    (i < 0 ? " none" : "") +
                                    '" role="radio" aria-checked="' +
                                    on +
                                    '" tabindex="' +
                                    (on ? "0" : "-1") +
                                    '" data-act="pick" data-field="' +
                                    k +
                                    '" data-col="' +
                                    i +
                                    '" data-k="opt:' +
                                    k +
                                    ":" +
                                    i +
                                    '"><span class="orad" aria-hidden="true"></span><span class="otx">' +
                                    (i >= 0
                                        ? '<span class="ono">' +
                                          esc(
                                              tpl(T.importMeals.colNumber, {
                                                  n: i + 1,
                                              }),
                                          ) +
                                          "</span>"
                                        : "") +
                                    '<span class="onm">' +
                                    esc(
                                        i < 0
                                            ? T.importMeals.notInFile
                                            : columnName(i),
                                    ) +
                                    "</span></span>" +
                                    (also.length
                                        ? '<span class="ous">' +
                                          esc(
                                              tpl(T.importMeals.alsoUsed, {
                                                  field: fieldLabel(also[0]),
                                              }),
                                          ) +
                                          "</span>"
                                        : "") +
                                    (i >= 0
                                        ? '<span class="osm">' +
                                          esc(
                                              isBlankCell(cell)
                                                  ? T.importMeals.row1Empty
                                                  : tpl(
                                                        T.importMeals
                                                            .sampleValue,
                                                        { sample: cell.trim() },
                                                    ),
                                          ) +
                                          "</span>"
                                        : "") +
                                    "</button>"
                                );
                            })
                            .join("") +
                        "</div>";
                }
                return (
                    '<div class="' +
                    cls +
                    '" role="listitem">' +
                    '<button type="button" class="reset mbtn" data-act="toggle" data-field="' +
                    k +
                    '" data-k="row:' +
                    k +
                    '" aria-expanded="' +
                    open +
                    '"' +
                    (open ? ' aria-controls="opts-' + k + '"' : "") +
                    ' aria-label="' +
                    esc(aria) +
                    '"><span class="mlab"><span class="ml"><span>' +
                    esc(label) +
                    "</span>" +
                    (f.required
                        ? '<em class="req" aria-hidden="true">*</em>'
                        : "") +
                    (f.isNew
                        ? '<span class="newt">' +
                          esc(T.importMeals.badgeNew) +
                          "</span>"
                        : "") +
                    "</span>" +
                    (hasSample
                        ? '<span class="ms only-m">' + esc(sample) + "</span>"
                        : "") +
                    '</span><span class="mcol">' +
                    (mapped
                        ? '<span class="cno">' + esc(colNo) + "</span>"
                        : "") +
                    '<span class="ctx">' +
                    esc(mapped ? columnName(sel) : T.importMeals.notInFile) +
                    "</span></span>" +
                    '<span class="mval num only-d">' +
                    esc(hasSample ? sampleCell.trim() : "") +
                    "</span>" +
                    '<span class="mchev">' +
                    ICON.chev +
                    "</span></button>" +
                    (others.length
                        ? '<div class="mwarn">' +
                          esc(
                              tpl(T.importMeals.sameColumn, {
                                  fields: others.map(fieldLabel).join(", "),
                              }),
                          ) +
                          "</div>"
                        : "") +
                    opts +
                    // On a phone the two read settings sit right under the
                    // column they apply to; on desktop they are in the sidebar.
                    (k === "logged_at"
                        ? '<div class="only-m">' + dateFormatBlock() + "</div>"
                        : "") +
                    (k === "calories"
                        ? '<div class="only-m">' + energyBlock() + "</div>"
                        : "") +
                    "</div>"
                );
            }

            function mapStep() {
                const t = S.table;
                const fields = mappableFields();
                const row1 = t.rows[0] || [];
                const used = {};
                for (const f of fields) {
                    const i = S.mapping[f.key];
                    if (i >= 0) (used[i] = used[i] || []).push(f.key);
                }
                const mappedN = fields.filter(
                    (f) => S.mapping[f.key] >= 0,
                ).length;
                const list = t.warnings.map((w) => nt("warn", esc(w)));
                if (
                    S.mapping.caffeine_mg === -1 &&
                    caffeineGramsColumns().length
                )
                    list.push(
                        nt(
                            "info",
                            esc(
                                tpl(T.importMeals.caffeineGramsNotice, {
                                    column: caffeineGramsColumns()[0],
                                }),
                            ),
                        ),
                    );
                if (!alcoholTracked() && alcoholColumn())
                    list.push(
                        nt(
                            "info",
                            esc(
                                tpl(T.importMeals.alcoholNotice, {
                                    column: alcoholColumn(),
                                }),
                            ),
                        ),
                    );
                const app = S.sourceApp
                    ? tpl(T.importMeals.appExport, {
                          app: APP_NAMES[S.sourceApp] || S.sourceApp,
                      })
                    : "";
                return (
                    '<div class="pane">' +
                    '<div class="fsum">' +
                    docIcon() +
                    '<div class="fsb"><b class="fn" title="' +
                    esc(S.fileName) +
                    '">' +
                    esc(S.fileName) +
                    '</b><span class="fmeta">' +
                    (app ? '<span class="appb">' + esc(app) + "</span>" : "") +
                    "<span>" +
                    boldCount(
                        plural(T.importMeals.rowsCount, t.rows.length, {
                            n: fmtCount(t.rows.length),
                        }),
                    ) +
                    "</span><span>" +
                    boldCount(
                        plural(T.importMeals.columnsCount, t.headers.length, {
                            n: fmtCount(t.headers.length),
                        }),
                    ) +
                    "</span><span>" +
                    esc(t.encoding) +
                    ", " +
                    esc(T.importMeals.delimiterLabel) +
                    ' <b class="dlm">' +
                    esc(
                        t.delimiter === "\t"
                            ? T.importMeals.tabLabel
                            : t.delimiter,
                    ) +
                    "</b></span></span></div></div>" +
                    notices(list) +
                    '<div class="mgrid"><div class="mleft">' +
                    '<div class="mhd"><span class="sec-t">' +
                    esc(T.importMeals.columnsHeading) +
                    '</span><span class="mcount">' +
                    esc(
                        plural(T.importMeals.fieldsMatched, fields.length, {
                            n: fmtCount(mappedN),
                            total: fmtCount(fields.length),
                        }),
                    ) +
                    "</span></div>" +
                    '<div class="mth only-d" aria-hidden="true"><span>' +
                    esc(T.importMeals.tableFieldHead) +
                    "</span><span>" +
                    esc(T.importMeals.tableColumnHead) +
                    "</span><span>" +
                    esc(T.importMeals.tableRow1Head) +
                    "</span><span></span></div>" +
                    '<div class="mlist" role="list">' +
                    fields.map((f) => mapRow(f, used, row1)).join("") +
                    "</div>" +
                    '<div class="only-m">' +
                    sourceAppBlock("m") +
                    "</div>" +
                    "</div>" +
                    '<aside class="mside only-d" aria-label="' +
                    esc(T.importMeals.howRead) +
                    '"><span class="sec-t" aria-hidden="true">' +
                    esc(T.importMeals.howRead) +
                    "</span>" +
                    dateFormatBlock() +
                    energyBlock() +
                    '<div class="fmt">' +
                    sourceAppBlock("d") +
                    "</div></aside></div>" +
                    actionBar({
                        sec: {
                            id: "backToFile",
                            txt: T.importMeals.chooseAnotherButton,
                        },
                        pri: {
                            id: "toPreview",
                            txt: T.importMeals.previewButton,
                        },
                    }) +
                    "</div>"
                );
            }

            // ---- preview step ----

            // Saturated and trans fat, fiber, sugar, added sugar, sodium,
            // alcohol and caffeine are missing from most exports, so their
            // columns appear only when this file actually carries them — five
            // columns of "—" would push the macros that do have values off the
            // visible width for no information. Alcohol additionally never
            // appears with tracking off: the rows carry none by then, but the
            // column is filtered by the opt-in as well as by the data, so a
            // stray value could not put ethanol on screen. Caffeine and sodium
            // have no such gate; they are filtered by the data alone.
            function previewColumns() {
                const extra = [
                    ["saturated_fat_g"],
                    ["trans_fat_g"],
                    ["fiber_g"],
                    ["sugar_g"],
                    ["added_sugar_g"],
                    ["sodium_mg"],
                    ["alcohol_g", true],
                    ["caffeine_mg"],
                ].filter(
                    (c) =>
                        (!c[1] || alcoholTracked()) &&
                        S.rows.some((r) => r[c[0]] !== undefined),
                );
                return ["calories", "protein_g", "carbs_g", "fat_g"].concat(
                    extra.map((c) => c[0]),
                );
            }

            // A calendar date, e.g. "Wed 1 Oct", in the widget's language
            // (dfmt, shared/date.js: Intl, UTC, so no zone shifts the day).
            function dayLabel(iso) {
                return dfmt(iso, {
                    weekday: "short",
                    day: "numeric",
                    month: "short",
                });
            }

            function previewTable(shown, cols) {
                const widths =
                    "grid-template-columns:44px 146px 82px minmax(220px,1fr) repeat(" +
                    cols.length +
                    ",54px)";
                const minW = 44 + 146 + 82 + 220 + cols.length * 54 + 40;
                return (
                    '<div class="tscroll" id="tscroll" role="region" tabindex="0" aria-label="' +
                    esc(T.importMeals.previewRegionAria) +
                    '"><div class="tbl" role="table" style="min-width:' +
                    minW +
                    'px"><div class="thr" role="row" style="' +
                    widths +
                    '"><span class="th" role="columnheader">' +
                    esc(T.importMeals.tableLine) +
                    '</span><span class="th" role="columnheader">' +
                    esc(T.importMeals.tableWhen) +
                    '</span><span class="th" role="columnheader">' +
                    esc(T.importMeals.tableMeal) +
                    '</span><span class="th" role="columnheader">' +
                    esc(T.importMeals.tableFood) +
                    "</span>" +
                    cols.map(nutrientTh).join("") +
                    "</div>" +
                    shown
                        .map(
                            (r, z) =>
                                '<div class="tr' +
                                (z % 2 ? " z" : "") +
                                '" role="row" style="' +
                                widths +
                                '"><span class="td dim num" role="cell">' +
                                r.source_line +
                                '</span><span class="td" role="cell">' +
                                esc(r.logged_at) +
                                '</span><span class="td" role="cell">' +
                                esc(r.meal_type || "—") +
                                '</span><span class="td food' +
                                (r.description ? "" : " anon") +
                                '" role="cell">' +
                                esc(
                                    r.description ||
                                        T.importMeals.noNameFallback,
                                ) +
                                "</span>" +
                                cols
                                    .map(
                                        (c) =>
                                            '<span class="td num' +
                                            (r[c] === undefined
                                                ? " miss"
                                                : "") +
                                            (c === "calories" ? " kc" : "") +
                                            '" role="cell">' +
                                            esc(fmtVal(r[c])) +
                                            "</span>",
                                    )
                                    .join("") +
                                "</div>",
                        )
                        .join("") +
                    "</div></div>"
                );
            }

            // Phone preview: the same rows, grouped by calendar date. The first
            // two days start open; the user's own toggles win after that.
            // One group per date, in order of first appearance, so an
            // unsorted export still shows each date once. A day's row count
            // and energy come from every row in the file, not just the shown
            // ones, so a day the row limit cuts still states its real total.
            function dayGroups(shown, all) {
                const byIso = new Map();
                for (const r of shown) {
                    const iso = String(r.logged_at).slice(0, 10);
                    let g = byIso.get(iso);
                    if (!g) {
                        g = { iso, rows: [], count: 0, kcal: 0 };
                        byIso.set(iso, g);
                    }
                    g.rows.push(r);
                }
                for (const r of all) {
                    const g = byIso.get(String(r.logged_at).slice(0, 10));
                    if (!g) continue;
                    g.count++;
                    g.kcal += r.calories ?? 0;
                }
                return [...byIso.values()];
            }

            function previewDays(shown, cols) {
                const groups = dayGroups(shown, S.rows);
                const isOpen = (g, gi) =>
                    S.dayOpen[g.iso] != null ? S.dayOpen[g.iso] : gi < 2;
                const allOpen = groups.every(isOpen);
                const prevDays = PAINT.prevDays;
                const kcalUnit = T.macros.units.kcal;
                const body = groups
                    .map((g, gi) => {
                        const open = isOpen(g, gi);
                        PAINT.days[g.iso] = open;
                        // Rows fade in only when their day opens, not on
                        // every repaint.
                        const enterDay =
                            open && !!prevDays && prevDays[g.iso] === false;
                        const kc = Math.round(g.kcal);
                        const sub = kc
                            ? plural(T.importMeals.dayRowsKcal, g.count, {
                                  n: fmtCount(g.count),
                                  kcal: fmtCount(kc),
                              })
                            : plural(T.importMeals.dayRows, g.count, {
                                  n: fmtCount(g.count),
                              });
                        // The row limit cut this day: say how many of its
                        // rows the list shows.
                        const cut =
                            open && g.rows.length < g.count
                                ? '<p class="dgcut">' +
                                  esc(
                                      tpl(T.importMeals.showingRows, {
                                          shown: fmtCount(g.rows.length),
                                          total: fmtCount(g.count),
                                      }),
                                  ) +
                                  "</p>"
                                : "";
                        const items = open
                            ? '<ul class="rlist" id="day-' +
                              g.iso +
                              '">' +
                              g.rows
                                  .map((r) => {
                                      const time = String(r.logged_at).slice(
                                          11,
                                      );
                                      const aria = tpl(
                                          T.importMeals.rowCardAria,
                                          {
                                              line: r.source_line,
                                              when: r.logged_at,
                                              meal:
                                                  r.meal_type ||
                                                  T.importMeals.noMealAria,
                                              food:
                                                  r.description ||
                                                  T.importMeals.noNameFallback,
                                              kcal:
                                                  r.calories === undefined
                                                      ? T.importMeals.noKcalAria
                                                      : fmtVal(r.calories) +
                                                        " " +
                                                        kcalUnit,
                                          },
                                      );
                                      return (
                                          '<li class="rc"><span class="vh">' +
                                          esc(aria) +
                                          '</span><div class="rc1" aria-hidden="true"><span class="rtime' +
                                          (time ? "" : " none") +
                                          '">' +
                                          esc(
                                              time || T.importMeals.noTimeShort,
                                          ) +
                                          "</span>" +
                                          (r.meal_type
                                              ? '<span class="rmeal">' +
                                                esc(r.meal_type) +
                                                "</span>"
                                              : "") +
                                          '<span class="rline">' +
                                          esc(
                                              tpl(T.importMeals.lineN, {
                                                  n: r.source_line,
                                              }),
                                          ) +
                                          '</span></div><div class="food' +
                                          (r.description ? "" : " anon") +
                                          '" aria-hidden="true">' +
                                          esc(
                                              r.description ||
                                                  T.importMeals.noNameFallback,
                                          ) +
                                          '</div><div class="rc3" aria-hidden="true"><span class="rk' +
                                          (r.calories === undefined
                                              ? " miss"
                                              : "") +
                                          '"><b>' +
                                          esc(fmtVal(r.calories)) +
                                          "</b> " +
                                          esc(kcalUnit) +
                                          "</span>" +
                                          cols
                                              .slice(1)
                                              .map(
                                                  (c) =>
                                                      '<span class="mc' +
                                                      (r[c] === undefined
                                                          ? " miss"
                                                          : "") +
                                                      '"><i>' +
                                                      esc(
                                                          T.importMeals
                                                              .tableAbbr[c],
                                                      ) +
                                                      "</i> " +
                                                      esc(fmtVal(r[c])) +
                                                      (c.endsWith("_mg") &&
                                                      r[c] !== undefined
                                                          ? "\u2009" +
                                                            esc(
                                                                T.macros.units
                                                                    .mg,
                                                            )
                                                          : "") +
                                                      "</span>",
                                              )
                                              .join("") +
                                          "</div></li>"
                                      );
                                  })
                                  .join("") +
                              "</ul>"
                            : "";
                        return (
                            '<div class="dg' +
                            (open ? " open" : "") +
                            (enterDay ? " enter" : "") +
                            '"><button type="button" class="reset dgh" data-act="day" data-v="' +
                            g.iso +
                            '" data-k="day:' +
                            g.iso +
                            '" aria-expanded="' +
                            open +
                            '"' +
                            (open ? ' aria-controls="day-' + g.iso + '"' : "") +
                            '><span class="dgl">' +
                            esc(dayLabel(g.iso)) +
                            '</span><span class="dgs num">' +
                            esc(sub) +
                            "</span>" +
                            ICON.chev +
                            "</button>" +
                            items +
                            cut +
                            "</div>"
                        );
                    })
                    .join("");
                return {
                    tools:
                        '<div class="dtools only-m"><span class="sec-t">' +
                        esc(T.importMeals.rowsHeading) +
                        "</span>" +
                        (groups.length > 2
                            ? '<button type="button" class="reset lnk" data-act="allDays" data-k="allDays">' +
                              esc(
                                  allOpen
                                      ? T.importMeals.collapseAllDays
                                      : T.importMeals.expandAllDays,
                              ) +
                              "</button>"
                            : "") +
                        "</div>",
                    body: '<div class="dgs-wrap only-m">' + body + "</div>",
                };
            }

            function previewStep() {
                const shown = S.rows.slice(0, 30);
                const kcal = S.rows.reduce((a, r) => a + (r.calories ?? 0), 0);
                const noTime = S.rows.filter(
                    (r) => !/\d\d:\d\d/.test(String(r.logged_at)),
                ).length;
                const { chunks: previewChunks, splitDates } = chunkRows(
                    S.rows,
                    CFG.max_rows_per_call,
                );
                const chunks = previewChunks.length;
                const cols = previewColumns();
                const canImport = !!(API && API.canCallTools);

                const tiles = [
                    [
                        "tile main",
                        S.rows.length,
                        plural(T.importMeals.tileMeals, S.rows.length),
                    ],
                    ["tile", kcal, T.importMeals.tileKcal],
                ];
                if (S.skipped)
                    tiles.push([
                        "tile warn",
                        S.skipped,
                        plural(T.importMeals.tileSkipped, S.skipped),
                    ]);
                tiles.push([
                    "tile",
                    chunks,
                    plural(T.importMeals.tileBatches, chunks),
                ]);
                // An odd count: the first tile takes the full row on a phone.
                if (tiles.length % 2) tiles[0][0] += " span";

                const warns = [];
                // Importing fewer rows than the file holds is the exact failure
                // this flow exists to prevent, so never let it pass silently.
                if (S.badDates)
                    warns.push(
                        nt(
                            "warn",
                            esc(
                                plural(
                                    T.importMeals.badDatesWarning,
                                    S.badDates,
                                    {
                                        n: fmtCount(S.badDates),
                                        format: dateFormatLabel(S.dateFormat),
                                        sample: S.badDateSample
                                            ? tpl(T.importMeals.badDateSample, {
                                                  line: S.badDateSample.line,
                                                  value: S.badDateSample.value,
                                              })
                                            : "",
                                    },
                                ),
                            ),
                        ),
                    );
                if (noTime)
                    warns.push(
                        nt(
                            "warn",
                            esc(
                                plural(T.importMeals.noTimeWarning, noTime, {
                                    n: fmtCount(noTime),
                                }),
                            ),
                        ),
                    );
                // A calendar date with more than max_rows_per_call rows on
                // its own has to be split across more than one import
                // call — max_rows_per_call and "keep every date together"
                // cannot both hold there. Flagged so the user knows why,
                // and because two identical rows for that date landing in
                // different calls can dedupe against each other instead of
                // both being written (see chunkRows in src/chunk.ts).
                if (splitDates.length)
                    warns.push(
                        nt(
                            "warn",
                            esc(
                                plural(
                                    T.importMeals.splitDatesCount,
                                    splitDates.length,
                                ) +
                                    tpl(T.importMeals.splitDatesWarning, {
                                        max: CFG.max_rows_per_call,
                                        date: splitDates[0],
                                    }),
                            ),
                        ),
                    );

                const errs = [];
                if (S.result && S.result.chunkErrors.length)
                    for (const e of S.result.chunkErrors)
                        errs.push(nt("bad", esc(e), "presentation"));
                if (S.result && S.result.rowErrors.length && !S.busy)
                    errs.push(
                        nt(
                            "bad",
                            esc(
                                plural(
                                    T.importMeals.rowsWouldFail,
                                    S.result.rowErrors.length,
                                    {
                                        line: S.result.rowErrors[0].line,
                                        message: S.result.rowErrors[0].message,
                                    },
                                ),
                            ),
                            "presentation",
                        ),
                    );

                let rowsHtml = "";
                if (shown.length) {
                    const days = previewDays(shown, cols);
                    rowsHtml =
                        '<div class="tnav only-d"><span class="sec-t">' +
                        esc(T.importMeals.rowsHeading) +
                        '</span><span class="sb"><button type="button" class="reset sbtn2" data-act="scrollL" data-k="scrollL" aria-label="' +
                        esc(T.importMeals.scrollLeft) +
                        '">' +
                        ICON.left +
                        '</button><button type="button" class="reset sbtn2" data-act="scrollR" data-k="scrollR" aria-label="' +
                        esc(T.importMeals.scrollRight) +
                        '">' +
                        ICON.right +
                        "</button></span></div>" +
                        days.tools +
                        '<div class="only-d">' +
                        previewTable(shown, cols) +
                        "</div>" +
                        days.body +
                        (S.rows.length > shown.length
                            ? '<div class="tmore">' +
                              esc(
                                  tpl(T.importMeals.showingRows, {
                                      shown: fmtCount(shown.length),
                                      total: fmtCount(S.rows.length),
                                  }),
                              ) +
                              "</div>"
                            : "");
                }

                let prog = "";
                if (S.progress) {
                    const p = S.progress;
                    const pct = p.total
                        ? Math.round((p.done / p.total) * 100)
                        : 0;
                    prog =
                        '<div class="prog"><div class="pbar" role="progressbar" aria-label="' +
                        esc(T.importMeals.progressAria) +
                        '" aria-valuemin="0" aria-valuemax="' +
                        p.total +
                        '" aria-valuenow="' +
                        p.done +
                        '"><span style="width:' +
                        Math.max(4, pct) +
                        '%"></span></div><div class="ptxt"><span class="spin" aria-hidden="true"></span><span>' +
                        esc(
                            tpl(T.importMeals.batchProgress, {
                                label: p.label,
                                done: fmtCount(p.done),
                                total: fmtCount(p.total),
                            }),
                        ) +
                        "</span></div></div>";
                }

                return (
                    '<div class="pane">' +
                    '<div class="tiles">' +
                    tiles
                        .map(
                            (t) =>
                                '<div class="' +
                                t[0] +
                                '"><b class="num">' +
                                esc(fmtCount(t[1])) +
                                "</b><span>" +
                                esc(t[2]) +
                                "</span></div>",
                        )
                        .join("") +
                    "</div>" +
                    // State the two conversions applied, so the confirmation step
                    // shows what will be sent rather than what the file said.
                    '<div class="readas">' +
                    ICON.info +
                    "<span>" +
                    esc(
                        tpl(T.importMeals.datesReadAs, {
                            format: dateFormatLabel(S.dateFormat),
                            conversion:
                                S.energyUnit === "kj"
                                    ? T.importMeals.energyConvertedNote
                                    : T.importMeals.energyReadAsKcal,
                        }),
                    ) +
                    "</span></div>" +
                    notices(warns) +
                    (errs.length
                        ? '<div class="errs" tabindex="-1" role="alert">' +
                          errs.join("") +
                          "</div>"
                        : "") +
                    (S.rows.length
                        ? ""
                        : '<div class="imp-empty">' +
                          esc(T.importMeals.noRowsToImport) +
                          "</div>") +
                    rowsHtml +
                    (S.badDates > 0 ? diagnosticsBlock() : "") +
                    actionBar({
                        prog,
                        why:
                            API && !API.canCallTools
                                ? T.importMeals.importOff
                                : S.busy
                                  ? T.importMeals.backBusy
                                  : "",
                        sec: {
                            id: "backToMap",
                            txt: T.importMeals.backToMapping,
                            dis: S.busy,
                        },
                        pri: {
                            id: "doImport",
                            txt: S.busy
                                ? T.importMeals.importingEllipsis
                                : plural(
                                      T.importMeals.importButton,
                                      S.rows.length,
                                      { n: fmtCount(S.rows.length) },
                                  ),
                            dis: S.busy || !canImport || !S.rows.length,
                            busy: S.busy,
                        },
                    }) +
                    "</div>"
                );
            }

            // ---- done step ----
            function doneStep() {
                const r = S.result || {
                    created: 0,
                    deduplicated: 0,
                    failed: 0,
                    chunkErrors: [],
                    rowErrors: [],
                    warnings: [],
                };
                const ok = r.failed === 0 && !r.chunkErrors.length;
                const tail =
                    (r.deduplicated
                        ? plural(
                              T.importMeals.resultAlreadyLogged,
                              r.deduplicated,
                              { n: fmtCount(r.deduplicated) },
                          )
                        : "") +
                    (r.failed
                        ? plural(T.importMeals.resultFailed, r.failed, {
                              n: fmtCount(r.failed),
                          })
                        : "") +
                    (S.skipped
                        ? plural(T.importMeals.resultSkipped, S.skipped, {
                              n: fmtCount(S.skipped),
                          })
                        : "");
                return (
                    '<div class="pane">' +
                    '<div class="sum' +
                    (ok ? "" : " warn") +
                    '" role="status"><span class="sic" aria-hidden="true">' +
                    (ok ? "✓" : "!") +
                    "</span><span>" +
                    boldCount(
                        plural(T.importMeals.resultMealsImported, r.created, {
                            n: fmtCount(r.created),
                        }),
                    ) +
                    esc(tail) +
                    ".</span></div>" +
                    notices((r.warnings || []).map((w) => nt("info", esc(w)))) +
                    (r.rowErrors && r.rowErrors.length
                        ? '<div class="etbl" role="table" tabindex="0" aria-label="' +
                          esc(T.importMeals.failedRowsAria) +
                          '"><div class="etr h" role="row"><span role="columnheader">' +
                          esc(T.importMeals.tableLine) +
                          '</span><span role="columnheader">' +
                          esc(T.importMeals.tableProblem) +
                          "</span></div>" +
                          r.rowErrors
                              .slice(0, 20)
                              .map(
                                  (e) =>
                                      '<div class="etr" role="row"><span role="cell">' +
                                      esc(e.line) +
                                      '</span><span role="cell">' +
                                      esc(e.message) +
                                      "</span></div>",
                              )
                              .join("") +
                          "</div>"
                        : "") +
                    (ok ? "" : diagnosticsBlock()) +
                    (S.modelSummary
                        ? '<p class="ctxl">' +
                          tpl(esc(T.importMeals.toldOnly), {
                              summary: "<q>" + esc(S.modelSummary) + "</q>",
                          }) +
                          "</p>"
                        : "") +
                    actionBar({
                        pri: {
                            id: "restart",
                            txt: T.importMeals.restartButton,
                            soft: true,
                        },
                    }) +
                    "</div>"
                );
            }

            // ---- paint + events ----

            // The visible copy of a control: both layouts are in the DOM, CSS
            // hides one, and a hidden element cannot take focus.
            function visible(sel) {
                const all = document.querySelectorAll(sel);
                for (const el of all) if (el.getClientRects().length) return el;
                return all[0] || null;
            }

            let wired = false;
            // What the last paint showed, and the per-paint flags the
            // builders read: prevAt (steps at or past it get the check-mark
            // pop), optsEnter (a column list just opened), prevDays (which
            // day groups were open; null on a step change) and days (filled
            // in by previewDays for the next paint to compare against).
            const painted = { step: null, open: null, days: null, pct: null };
            const PAINT = {
                prevAt: 9,
                optsEnter: false,
                prevDays: null,
                days: {},
            };

            function progressPct() {
                const p = S.progress;
                if (!p) return null;
                return Math.max(
                    4,
                    p.total ? Math.round((p.done / p.total) * 100) : 0,
                );
            }

            // The rebuilt view arrives already in its new state, so a CSS
            // transition (chevron turn, row highlight, progress width) would
            // never run. Paint what changed in its previous state, force one
            // style flush, then flip it: the transition then plays as if the
            // element had been changed in place.
            function replayTransitions(root, prev) {
                if (!root.querySelectorAll) return;
                const flips = [];
                const rowOf = (k) =>
                    k == null
                        ? []
                        : [...root.querySelectorAll('[data-k="row:' + k + '"]')]
                              .map((b) => b.closest(".mrow"))
                              .filter(Boolean);
                if (prev.open !== S.open)
                    for (const el of rowOf(prev.open).concat(rowOf(S.open)))
                        flips.push(() => el.classList.toggle("open"));
                if (prev.days)
                    for (const b of root.querySelectorAll(".dgh")) {
                        const iso = b.dataset.v;
                        const was = prev.days[iso];
                        const g = b.closest(".dg");
                        if (g && was != null && was !== PAINT.days[iso])
                            flips.push(() => g.classList.toggle("open"));
                    }
                const pct = progressPct();
                const bar = root.querySelector(".pbar span");
                let barTo = null;
                if (
                    bar &&
                    prev.pct != null &&
                    pct != null &&
                    prev.pct !== pct
                ) {
                    bar.style.width = prev.pct + "%";
                    barTo = pct + "%";
                }
                if (!flips.length && barTo == null) return;
                for (const f of flips) f();
                void root.offsetWidth;
                for (const f of flips) f();
                if (barTo != null) bar.style.width = barTo;
            }
            // `fromHost`: a paint the bridge drives (a tool result), which
            // appends its settings footer to #root right after. Only those
            // rebuild #root; every other repaint replaces #imp-view inside
            // it, so the footer survives the user's clicks instead of
            // vanishing at the first one.
            function render(fromHost) {
                const root = document.getElementById("root");
                if (!root) return;
                // The view is rebuilt wholesale, so carry focus and the
                // table's sideways scroll across the repaint by key.
                const ae = document.activeElement;
                const keepKey =
                    ae && ae.getAttribute ? ae.getAttribute("data-k") : null;
                const ts = document.getElementById("tscroll");
                const scrollLeft = ts ? ts.scrollLeft : 0;

                // Entrance motion is for mounting only: the view is rebuilt
                // on every click, and an animation restarts whenever its
                // element is newly inserted. So mark only what is new since
                // the last paint (see PAINT).
                const prev = {
                    step: painted.step,
                    open: painted.open,
                    days: painted.days,
                    pct: painted.pct,
                };
                const enter = !!fromHost || S.step !== prev.step;
                const order = ["file", "map", "preview", "done"];
                PAINT.prevAt =
                    enter && prev.step
                        ? order.indexOf(prev.step)
                        : enter
                          ? 0
                          : 9;
                PAINT.optsEnter = !!S.open && (enter || S.open !== prev.open);
                PAINT.prevDays = enter ? null : prev.days;
                PAINT.days = {};

                let body = "";
                if (S.step === "file") body = fileStep();
                else if (S.step === "map") body = mapStep();
                else if (S.step === "preview") body = previewStep();
                else body = doneStep();
                const markup =
                    '<div class="imp' +
                    (enter ? " enter" : "") +
                    '">' +
                    header() +
                    body +
                    "</div>";
                const view = document.getElementById("imp-view");
                if (fromHost || !view || view.parentNode !== root) {
                    root.innerHTML = '<div id="imp-view">' + markup + "</div>";
                } else {
                    view.innerHTML = markup;
                }
                if (!enter) replayTransitions(root, prev);
                painted.step = S.step;
                painted.open = S.open;
                painted.days = PAINT.days;
                painted.pct = progressPct();

                const ts2 = document.getElementById("tscroll");
                if (ts2 && scrollLeft) ts2.scrollLeft = scrollLeft;
                if (!wired) {
                    wire(root);
                    wired = true;
                }
                const want = S.focus;
                S.focus = null;
                const target = want
                    ? visible(want)
                    : keepKey
                      ? visible('[data-k="' + keepKey + '"]')
                      : null;
                if (target && target.focus) {
                    try {
                        target.focus({ preventScroll: !want });
                    } catch (_) {
                        target.focus();
                    }
                }
            }

            function goStep(step, focusSel) {
                S.step = step;
                S.open = null;
                S.focus = focusSel || ".ptitle";
                announce(stepAnnouncement());
                render();
            }
            function resetAll() {
                S.table = null;
                S.fileName = "";
                S.rows = [];
                S.result = null;
                S.errors = [];
                S.dateFormat = "iso";
                S.dateAmbiguous = false;
                S.energyUnit = "kcal";
                S.badDates = 0;
                S.badDateSample = null;
                S.skipped = 0;
                S.mapping = {};
                S.autoMapping = {};
                S.dayOpen = {};
                S.modelSummary = "";
            }

            const ACTIONS = {
                choose() {
                    const input = document.getElementById("file");
                    if (input) {
                        input.value = "";
                        input.click();
                    }
                },
                toggle(b) {
                    const k = b.dataset.field;
                    S.open = S.open === k ? null : k;
                    // Opening lands on the chosen option, so arrow keys work
                    // at once; closing stays on the row.
                    S.focus =
                        S.open === k
                            ? "#opts-" + k + ' [aria-checked="true"]'
                            : '[data-k="row:' + k + '"]';
                    render();
                },
                pick(b) {
                    const k = b.dataset.field;
                    const i = Number(b.dataset.col);
                    S.mapping[k] = i;
