                    // The date format and energy unit were read off the column
                    // that was mapped a moment ago, so a remap invalidates
                    // them: sniff the newly chosen column instead.
                    if (k === "logged_at") resniffDateFormat();
                    if (k === "calories") resniffEnergyUnit();
                    S.open = null;
                    S.focus = '[data-k="row:' + k + '"]';
                    announce(
                        tpl(T.importMeals.liveMapped, {
                            field: fieldLabel(k),
                            column:
                                i >= 0
                                    ? columnName(i)
                                    : T.importMeals.notInFileAria,
                        }),
                    );
                    render();
                },
                // Re-rendering on change is what makes the worked example live.
                df(b) {
                    S.dateFormat = b.dataset.v;
                    // The user has now stated it, so stop asking.
                    S.dateAmbiguous = false;
                    S.focus = '[data-k="df:' + b.dataset.v + '"]';
                    render();
                },
                eu(b) {
                    S.energyUnit = b.dataset.v;
                    S.focus = '[data-k="eu:' + b.dataset.v + '"]';
                    render();
                },
                toPreview() {
                    buildRows();
                    S.result = null;
                    S.dayOpen = {};
                    goStep("preview");
                },
                backToFile() {
                    S.errors = [];
                    goStep("file", "#drop");
                },
                backToMap() {
                    if (S.busy) return;
                    goStep("map");
                },
                doImport(b) {
                    if (b.getAttribute("aria-disabled") === "true") return;
                    runImport();
                },
                restart() {
                    resetAll();
                    goStep("file", "#drop");
                },
                day(b) {
                    const iso = b.dataset.v;
                    S.dayOpen[iso] = b.getAttribute("aria-expanded") !== "true";
                    render();
                },
                allDays() {
                    const btns = document.querySelectorAll(".dgh");
                    const allOpen = [...btns].every(
                        (x) => x.getAttribute("aria-expanded") === "true",
                    );
                    for (const x of btns) S.dayOpen[x.dataset.v] = !allOpen;
                    render();
                },
                scrollL() {
                    scrollTable(-260);
                },
                scrollR() {
                    scrollTable(260);
                },
            };
            function scrollTable(dx) {
                const t = document.getElementById("tscroll");
                if (!t) return;
                const still =
                    window.matchMedia &&
                    window.matchMedia("(prefers-reduced-motion: reduce)")
                        .matches;
                t.scrollBy({ left: dx, behavior: still ? "auto" : "smooth" });
            }

            // Roving focus inside a radio group: arrows move, Home/End jump.
            // In the date/energy segments moving also selects (they are
            // plain radios); in a column list it only moves, because choosing
            // a column closes the list — Enter or Space picks.
            function radioKeys(e, b) {
                const group = b.closest('[role="radiogroup"]');
                if (!group) return false;
                const items = [...group.querySelectorAll('[role="radio"]')];
                const at = items.indexOf(b);
                let to = -1;
                if (e.key === "ArrowDown" || e.key === "ArrowRight")
                    to = (at + 1) % items.length;
                else if (e.key === "ArrowUp" || e.key === "ArrowLeft")
                    to = (at - 1 + items.length) % items.length;
                else if (e.key === "Home") to = 0;
                else if (e.key === "End") to = items.length - 1;
                if (to < 0) return false;
                e.preventDefault();
                const next = items[to];
                if (next.dataset.act === "pick") {
                    for (const x of items) x.tabIndex = -1;
                    next.tabIndex = 0;
                    next.focus();
                } else {
                    next.click();
                }
                return true;
            }

            function wire(root) {
                root.addEventListener("click", (e) => {
                    const b = e.target.closest("[data-act]");
                    if (!b || !root.contains(b)) return;
                    const fn = ACTIONS[b.dataset.act];
                    if (fn) fn(b);
                });
                root.addEventListener("keydown", (e) => {
                    const b =
                        e.target.closest && e.target.closest("[data-act]");
                    if (b && b.getAttribute("role") === "radio")
                        if (radioKeys(e, b)) return;
                    // Escape closes an open column list and returns to its row.
                    if (e.key === "Escape" && S.open) {
                        const k = S.open;
                        S.open = null;
                        S.focus = '[data-k="row:' + k + '"]';
                        e.preventDefault();
                        render();
                    }
                });
                root.addEventListener("change", (e) => {
                    const t = e.target;
                    if (t.id === "file") {
                        const f = t.files && t.files[0];
                        if (f) loadFile(f);
                    }
                    if (t.dataset && t.dataset.act === "srcapp") {
                        S.sourceApp = t.value.trim();
                    }
                });
                root.addEventListener("input", (e) => {
                    const t = e.target;
                    if (t.dataset && t.dataset.act === "srcapp")
                        S.sourceApp = t.value.trim();
                });
                // Drag and drop on the drop zone. The class is toggled on the
                // element directly rather than through render(), which would
                // rebuild the target mid-drag.
                const dropOf = (e) =>
                    e.target && e.target.closest && e.target.closest("#drop");
                root.addEventListener("dragover", (e) => {
                    const d = dropOf(e);
                    if (!d) return;
                    e.preventDefault();
                    if (!S.over) {
                        S.over = true;
                        d.classList.add("over");
                    }
                });
                root.addEventListener("dragleave", (e) => {
                    const d = dropOf(e);
                    if (!d || d.contains(e.relatedTarget)) return;
                    S.over = false;
                    d.classList.remove("over");
                });
                root.addEventListener("drop", (e) => {
                    const d = dropOf(e);
                    if (!d) return;
                    e.preventDefault();
                    S.over = false;
                    d.classList.remove("over");
                    const f =
                        e.dataTransfer &&
                        e.dataTransfer.files &&
                        e.dataTransfer.files[0];
                    if (f) loadFile(f);
                });
            }

            initWidget({
                name: "import-meals-widget",
                // A function: bridge.js calls it with the strings for the
                // browser language, since the payload's locale isn't known yet.
                loading: (strings) =>
                    '<div class="imp"><div class="loadg" role="status"><div class="big" aria-hidden="true">📥</div><div>' +
                    esc(strings.importMeals.loading) +
                    "</div></div></div>",
                coerce: (payload) => {
                    if (!payload || typeof payload !== "object") return null;
                    // start_meal_import's own payload, or a wrapper round it.
                    if (payload.import_tool_name || payload.tz) return payload;
                    if (payload.structuredContent)
                        return payload.structuredContent;
                    return null;
                },
                render: (data) => {
                    if (data && data.import_tool_name) {
                        CFG = Object.assign({}, CFG, data);
                    }
                    setLocale(
                        pickLocale(
                            CFG.locale,
                            API && API.hostContext
                                ? API.hostContext.locale
                                : null,
                        ),
                    );
                    render(true);
                },
                sample: {
                    tz: "Europe/Kyiv",
                    today: "2026-07-25",
                    max_rows_per_call: 50,
                    import_tool_name: "bulk_import_meals",
                    known_source_apps: ["myfitnesspal", "cronometer"],
                    tz_configured: true,
                    // Tracking off is the default account state, so it is what
                    // the standalone preview shows.
                    drink_unit: null,
                    locale: "en",
                },
                onReady: (api) => {
                    API = api;
                    render();
                },
            });
        </script>
    </body>
</html>
