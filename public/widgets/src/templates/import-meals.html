<!doctype html>
<!--
  Bulk meal import widget (MCP Apps).

  The point of this widget is that the MODEL never handles row data. It parses the
  user's export in-browser, shows a mapping and a preview to confirm, then calls
  bulk_import_meals itself via the shared bridge's api.callTool. Structured tool
  results are not added to model context, so hundreds of rows never enter the
  token stream — only a short summary, pushed back deliberately at the end via
  api.updateModelContext.

  Four steps: file -> map columns -> preview -> import.

  Alcohol is opt-in and the opt-in reaches this far: start_meal_import sends
  drink_unit, and with it null the widget neither maps, previews nor sends an
  alcohol column, however loudly the file advertises one. See gatedField below
  for why nothing is written either.

  The CSV parser is NOT written here. `@inlinets src/csv.ts` splices in the real
  tested module (src/csv.test.ts), because a parser facing arbitrary user files
  must not live as untested inline template JS. Same for the row chunker:
  `@inlinets src/chunk.ts` (src/chunk.test.ts) — the boundary logic deciding
  which rows go in which server call was untested inline JS once and had a real
  bug (issue #65).

  Layout (the 2026-10 redesign, artboards W5-Import-M / W5-Import-D): a stepper,
  a title and one pane per step, then an action bar that bleeds to the widget's
  edges. Phone and desktop differ in two places only — the map step gets a
  sticky "how values are read" sidebar and the preview a scrolling table at
  640px and wider, where a phone gets the date and energy controls inline under
  their own rows and the preview as collapsible days. The breakpoint is a width
  media query, i.e. the iframe's OWN width (and a container query on the
  landing page, where scripts/widget-static.ts rewrites it), never a JS
  constant. Both layouts are in the markup; CSS shows one.

  Degrades on purpose:
    - api.canCallTools false  -> tells the user to ask Claude to import instead
    - host never answers      -> per-call timeout, reported, retry offered
    - a chunk fails           -> other chunks still land; re-running is a no-op
                                 server-side, so "retry failed rows" is safe
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Import Meals</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* ---- the import palette ------------------------------------
               Every colour here is a shared token or a mix of tokens, so
               light, dark and the host's explicit data-theme all follow
               tokens.css. Short local names keep the rules below readable;
               the design's variable each one stands for is in brackets. */
            .imp {
                --g: var(--status-ok); /* [--g] action green */
                --on-g: var(--gauge-cap); /* text on --g: white / near-black */
                --gh: color-mix(in srgb, var(--status-ok) 84%, var(--text));
                --gink: color-mix(in srgb, var(--gauge-ink) 80%, var(--text));
                --gpale: var(--pill-bg);
                --gpale2: var(--pill-bg-hover);
                --ink: var(--text);
                --sub: var(--text-dim);
                --mute: var(--text-mute);
                --line: var(--panel-border);
                --page: var(--bg);
                --soft: var(--surface-soft); /* [--panel] inset surfaces */
                --tint: var(--track);
                --fieldb: var(--status-nr);
                --ring: var(--focus);
                --warnbg: color-mix(in srgb, var(--status-near) 13%, var(--bg));
                --warnink: color-mix(
                    in srgb,
                    var(--status-near-ink) 70%,
                    var(--text)
                );
                --warnline: color-mix(
                    in srgb,
                    var(--status-near) 55%,
                    var(--bg)
                );
                --badbg: color-mix(in srgb, var(--status-over) 11%, var(--bg));
                --badink: color-mix(
                    in srgb,
                    var(--status-over-ink) 72%,
                    var(--text)
                );
                --badline: color-mix(
                    in srgb,
                    var(--status-over) 45%,
                    var(--bg)
                );
                --tagink: color-mix(in srgb, var(--sodium) 72%, var(--text));
                --tagbg: color-mix(in srgb, var(--sodium) 16%, var(--bg));

                padding: 14px;
                display: flex;
                flex-direction: column;
                min-width: 0;
                color: var(--ink);
            }
            .imp .num {
                font-variant-numeric: tabular-nums;
            }
            .imp button {
                font: inherit;
                color: inherit;
            }
            .imp :where(button.reset) {
                all: unset;
                box-sizing: border-box;
                cursor: pointer;
                text-align: left;
            }
            .imp button.reset:focus-visible,
            .imp .inp:focus-visible,
            .imp .tscroll:focus-visible,
            .imp .etbl:focus-visible,
            .imp .ptitle:focus-visible,
            .imp .errs:focus-visible {
                outline: 2.5px solid var(--ring);
                outline-offset: 2px;
                border-radius: 12px;
            }
            /* top/left pin the hidden box to the top-left corner. Without them an
               absolutely positioned box takes its static position, which for the
               #imp-live region is just below #root, and that 1px box extends the
               document's scrollable overflow past the height the bridge measures:
               the iframe then scrolls by a pixel or two and clips the footer. */
            .vh {
                position: absolute;
                top: 0;
                left: 0;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }
            /* One layout or the other: below 640px only the .only-m half
               shows, at 640px and wider only the .only-d half. */
            @media (max-width: 639.98px) {
                /* !important: these must beat each block's own display. */
                .imp .only-d {
                    display: none !important;
                }
            }

            /* ---- header + stepper ---- */
            .imp .eyb2 {
                display: block;
                font-size: 12.5px;
                font-weight: 600;
                color: var(--sub);
                letter-spacing: 0.01em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                max-width: 100%;
                min-height: 1.45em;
            }
            .imp .stp {
                list-style: none;
                margin: 12px 0 0;
                padding: 0;
                display: grid;
                grid-template-columns: repeat(4, minmax(0, 1fr));
                position: relative;
            }
            .imp .st {
                position: relative;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .imp .st:not(:last-child):after {
                content: "";
                position: absolute;
                top: 13px;
                left: calc(50% + 17px);
                right: calc(-50% + 17px);
                height: 3px;
                border-radius: 2px;
                background: var(--line);
            }
            .imp .st.done:not(:last-child):after {
                background: var(--g);
            }
            .imp .sd {
                position: relative;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--page);
                box-shadow: inset 0 0 0 2px var(--fieldb);
                font-size: 13px;
                font-weight: 800;
                color: var(--sub);
                transition:
                    background-color 0.3s,
                    box-shadow 0.3s;
            }
            .imp .sd .ck {
                display: none;
            }
            .imp .st.cur .sd {
                background: var(--g);
                box-shadow: 0 0 0 4px var(--gpale);
                color: var(--on-g);
            }
            .imp .st.done .sd {
                background: var(--gpale);
                box-shadow: inset 0 0 0 2px var(--g);
                color: var(--gink);
            }
            .imp .st.done .sn {
                display: none;
            }
            .imp .st.done .ck {
                display: block;
            }
            /* Entrance motion plays only when something mounts (a step
               change, a list opening, a day expanding), never on the
               repaint every click causes: render() marks the mounting
               element with .pop / .enter. */
            .imp .st.done.pop .ck {
                animation: imp-pop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) both;
            }
            .imp .st.run .sd {
                box-shadow:
                    inset 0 0 0 2px var(--g),
                    0 0 0 4px var(--gpale);
                color: var(--gink);
            }
            .imp .sl {
                font-size: 12px;
                font-weight: 650;
                color: var(--sub);
                text-align: center;
                line-height: 1.2;
                max-width: 100%;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .imp .st.cur .sl {
                color: var(--ink);
                font-weight: 800;
            }
            .imp .st.done .sl {
                color: var(--gink);
            }
            .imp .ptitle {
                margin: 16px 0 0;
                font-size: 17px;
                font-weight: 650;
                letter-spacing: -0.015em;
                line-height: 1.3;
                color: var(--ink);
                outline: none;
            }
            .imp .pane {
                display: flex;
                flex-direction: column;
                gap: 12px;
                margin-top: 12px;
                min-width: 0;
            }
            .imp.enter .pane {
                animation: imp-rise 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }

            /* ---- notices ---- */
            .imp .nts {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            .imp .nt {
                display: grid;
                grid-template-columns: 22px minmax(0, 1fr);
                gap: 9px;
                align-items: start;
                font-size: 13px;
                line-height: 1.45;
                color: var(--ink);
                padding: 10px 12px;
                border-radius: 14px;
                background: var(--tint);
            }
            .imp .nt > i {
                font-style: normal;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 22px;
                height: 22px;
                border-radius: 11px;
                font-size: 12px;
                font-weight: 800;
                background: color-mix(in srgb, var(--text) 13%, var(--bg));
                color: var(--ink);
            }
            .imp .nt > span {
                min-width: 0;
                overflow-wrap: anywhere;
            }
            .imp .nt.warn {
                background: var(--warnbg);
                color: var(--warnink);
            }
            .imp .nt.warn > i {
                background: color-mix(
                    in srgb,
                    var(--status-near) 32%,
                    var(--bg)
                );
                color: var(--warnink);
            }
            .imp .nt.bad {
                background: var(--badbg);
                color: var(--badink);
            }
            .imp .nt.bad > i {
                background: color-mix(
                    in srgb,
                    var(--status-over) 28%,
                    var(--bg)
                );
                color: var(--badink);
            }
            .imp .nt b {
                font-weight: 750;
                color: inherit;
            }
            .imp .diag {
                display: block;
                margin-top: 8px;
                padding: 8px 10px;
                border-radius: 10px;
                background: var(--page);
                box-shadow: inset 0 0 0 1px var(--line);
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 11px;
                line-height: 1.55;
                white-space: pre-wrap;
                user-select: all;
                color: var(--sub);
                overflow-wrap: anywhere;
            }
            .imp .errs {
                display: flex;
                flex-direction: column;
                gap: 8px;
                outline: none;
            }

            /* ---- file step ---- */
            .imp .drop {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 4px;
                width: 100%;
                padding: 26px 16px 22px;
                border-radius: 20px;
                border: 2px dashed var(--fieldb);
                background: var(--soft);
                text-align: center;
                transition:
                    border-color 0.25s,
                    background-color 0.25s,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .imp .drop:hover,
            .imp .drop.over {
                border-color: var(--g);
                background: color-mix(in oklab, var(--gpale) 70%, var(--page));
            }
            .imp .drop.over {
                transform: scale(1.01);
            }
            .imp .drop:active {
                transform: scale(0.985);
            }
            .imp .dic {
                width: 46px;
                height: 54px;
                margin-bottom: 8px;
                display: block;
            }
            .imp .doc-page {
                fill: var(--page);
                stroke: var(--g);
                stroke-width: 2.5;
            }
            .imp .doc-fold {
                fill: none;
                stroke: var(--g);
                stroke-width: 2.5;
            }
            .imp .doc-bar {
                fill: var(--g);
            }
            .imp .doc-lines {
                stroke: var(--page);
                stroke-width: 2;
                stroke-linecap: round;
            }
            .imp .ico {
                fill: none;
                stroke: currentColor;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none;
            }
            .imp .dt {
                font-size: 16px;
                font-weight: 800;
                color: var(--ink);
            }
            .imp .dor {
                font-size: 13.5px;
                color: var(--sub);
            }
            .imp .dpill {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 36px;
                padding: 0 18px;
                margin-top: 12px;
                border-radius: 18px;
                background: var(--g);
                color: var(--on-g);
                font-size: 14px;
                font-weight: 800;
            }
            .imp .drop:hover .dpill {
                background: var(--gh);
            }
            .imp .dacc {
                font-size: 11.5px;
                color: var(--mute);
                margin-top: 8px;
            }
            .imp .hint2 {
                margin: 0;
                font-size: 13px;
                line-height: 1.45;
                color: var(--sub);
            }
            .imp .priv {
                display: flex;
                gap: 8px;
                align-items: flex-start;
                font-size: 12.5px;
                line-height: 1.45;
                color: var(--sub);
                padding-top: 10px;
                border-top: 1px solid var(--line);
            }
            .imp .priv svg {
                margin-top: 1px;
            }
            .imp .loadg {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                padding: 34px 0 30px;
                font-size: 14px;
                color: var(--text-dim);
            }
            .imp .loadg .big {
                font-size: 34px;
                animation: imp-pulse 1.6s ease-in-out infinite;
            }

            /* ---- map step ---- */
            .imp .fsum {
                display: grid;
                grid-template-columns: 36px minmax(0, 1fr);
                gap: 10px;
                align-items: center;
                padding: 10px 12px;
                border-radius: 16px;
                background: var(--soft);
            }
            .imp .fsum .dic {
                width: 32px;
                height: 38px;
                margin: 0;
            }
            .imp .fsb {
                min-width: 0;
                display: flex;
                flex-direction: column;
                gap: 3px;
            }
            .imp .fn {
                font-size: 14px;
                font-weight: 750;
                color: var(--ink);
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .imp .fmeta {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 4px 10px;
                font-size: 12.5px;
                color: var(--sub);
            }
            .imp .fmeta b {
                color: var(--ink);
                font-weight: 750;
            }
            .imp .dlm {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 18px;
                height: 18px;
                padding: 0 4px;
                margin-left: 2px;
                border-radius: 5px;
                background: var(--tint);
                font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                font-size: 12px;
                vertical-align: 1px;
            }
            .imp .appb {
                display: inline-flex;
                align-items: center;
                height: 20px;
                padding: 0 8px;
                border-radius: 10px;
                background: var(--gpale);
                color: var(--gink);
                font-size: 11.5px;
                font-weight: 800;
            }
            .imp .mhd {
                display: flex;
                align-items: baseline;
                justify-content: space-between;
                gap: 10px;
                margin-top: 8px;
            }
            .imp .sec-t {
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--sub);
            }
            .imp .mcount {
                font-size: 12.5px;
                color: var(--sub);
            }
            .imp .mleft {
                display: flex;
                flex-direction: column;
                gap: 6px;
                min-width: 0;
            }
            .imp .mlist {
                display: flex;
                flex-direction: column;
                gap: 6px;
                margin-top: 6px;
            }
            .imp .mrow {
                border-radius: 14px;
                background: var(--soft);
                box-shadow: inset 0 0 0 1.5px transparent;
                transition:
                    box-shadow 0.25s,
                    background-color 0.25s;
            }
            .imp .mrow.on {
                background: color-mix(in oklab, var(--gpale) 55%, var(--page));
            }
            .imp .mrow.open {
                box-shadow: inset 0 0 0 2px var(--g);
            }
            .imp .mrow.need {
                background: var(--badbg);
                box-shadow: inset 0 0 0 1.5px var(--badline);
            }
            .imp .mbtn {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) 14px;
                gap: 10px;
                align-items: center;
                width: 100%;
                min-height: 50px;
                padding: 8px 12px;
                border-radius: 14px;
            }
            .imp .mlab {
                display: flex;
                flex-direction: column;
                gap: 1px;
                min-width: 0;
            }
            .imp .ml {
                display: flex;
                flex-wrap: wrap;
                align-items: center;
                gap: 4px 6px;
                font-size: 14px;
                font-weight: 700;
                color: var(--ink);
                line-height: 1.25;
            }
            .imp .req {
                font-style: normal;
                color: var(--over);
                font-weight: 800;
            }
            .imp .newt {
                display: inline-flex;
                align-items: center;
                height: 16px;
                padding: 0 6px;
                border-radius: 8px;
                background: var(--tagbg);
                color: var(--tagink);
                font-size: 10px;
                font-weight: 800;
                letter-spacing: 0.05em;
                text-transform: uppercase;
            }
            .imp .ms {
                font-size: 11.5px;
                color: var(--sub);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-variant-numeric: tabular-nums;
            }
            .imp .mcol {
                display: flex;
                flex-direction: column;
                align-items: flex-end;
                min-width: 0;
                text-align: right;
            }
            .imp .cno {
                font-size: 10.5px;
                font-weight: 800;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                color: var(--sub);
            }
            .imp .ctx {
                max-width: 100%;
                font-size: 13.5px;
                font-weight: 700;
                color: var(--ink);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .imp .mrow.off .ctx {
                font-weight: 500;
                color: var(--mute);
            }
            .imp .mrow.need .ctx {
                color: var(--badink);
                font-weight: 700;
            }
            .imp .mval {
                font-size: 12.5px;
                color: var(--sub);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .imp .mchev {
                color: var(--sub);
                transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .imp .mrow.open .mchev {
                transform: rotate(180deg);
            }
            .imp .mwarn {
                margin: -2px 12px 8px;
                font-size: 12px;
                color: var(--warnink);
                font-weight: 600;
            }
            .imp .opts {
                display: flex;
                flex-direction: column;
                gap: 2px;
                margin: 0 6px 6px;
                padding: 4px;
                border-radius: 12px;
                background: var(--page);
                box-shadow: inset 0 0 0 1px var(--line);
                max-height: 332px;
                overflow: auto;
            }
            .imp .opts.enter {
                animation: imp-drop 0.35s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .imp .opt {
                display: grid;
                grid-template-columns: 18px minmax(0, 1fr) auto;
                gap: 2px 10px;
                align-items: center;
                width: 100%;
                padding: 8px 10px;
                border-radius: 9px;
                transition: background-color 0.15s;
            }
            .imp .opt:hover {
                background: var(--tint);
            }
            .imp .orad {
                grid-row: 1 / span 2;
                width: 16px;
                height: 16px;
                border-radius: 50%;
                box-shadow: inset 0 0 0 2px var(--fieldb);
            }
            .imp .opt.none .orad {
                grid-row: auto;
            }
            .imp .opt.on {
                background: var(--gpale);
            }
            .imp .opt.on .orad {
                box-shadow: inset 0 0 0 5px var(--g);
            }
            .imp .otx {
                display: flex;
                align-items: baseline;
                gap: 6px;
                min-width: 0;
            }
            .imp .ono {
                flex: none;
                font-size: 10.5px;
                font-weight: 800;
                color: var(--sub);
                text-transform: uppercase;
                letter-spacing: 0.03em;

                font-weight: 650;

            .imp .etr span:first-child {

            .imp .ctxl {

            /* ---- action bar ---- */
            .imp .abar {

                border-top: 1px solid var(--line);

                font-size: 15px;

            .imp .prim:hover {

            .imp .prim.soft {
                background: var(--gpale);
                color: var(--ink);
            }
            .imp .prim.soft:hover {
                background: var(--gpale2);

            .imp .prim.dis {
                cursor: not-allowed;

                color: var(--sub);
                outline: 1.5px dashed var(--fieldb);
                outline-offset: -1.5px;
                transform: none;

            .imp .prim.dis.busy {
                background: var(--gpale);
                color: var(--gink);

                outline: none;

            .imp .sec {
                flex: none;
                white-space: nowrap;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 44px;
                padding: 0 16px;
                border-radius: 22px;
                background: var(--tint);
                color: var(--ink);
                font-size: 14px;
                font-weight: 750;

            .imp .sec.dis {

            .imp .spin {

            .imp .ptxt {

            @keyframes imp-rise {

                0% {
                    opacity: 0;

                100% {

            /* ---- desktop: the iframe is 640px or wider ---- */
            @media (min-width: 640px) {
                .imp .only-m {
                    display: none !important;

                .imp .stp {
                    max-width: 620px;
                }
                .imp .ptitle {
                    font-size: 21px;
                }
                .imp .tiles {
                    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));

                .imp .mside {

                .imp .mside .fmt {
                    margin: 0;
                }
                .imp .mth {
                    display: grid;
                    grid-template-columns:
                        minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.8fr)
                        14px;
                    gap: 12px;
                    padding: 0 12px;
                    font-size: 11px;
                    font-weight: 700;
                    letter-spacing: 0.06em;
                    text-transform: uppercase;
                    color: var(--sub);
                }
                .imp .mbtn {
                    grid-template-columns:
                        minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.8fr)
                        14px;
                    gap: 12px;
                    min-height: 44px;
                }
                .imp .mbtn:hover {
                    background: color-mix(
                        in oklab,
                        var(--tint) 60%,
                        transparent
                    );
                }
                .imp .mcol {
                    align-items: flex-start;
                    text-align: left;
                }
                .imp .opts {
                    display: grid;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    max-height: 300px;
                }
                .imp .opt.none {
                    grid-column: 1 / -1;
                }
                .imp .abar {
                    flex-direction: row;
                    flex-wrap: wrap;
                    align-items: center;
                    justify-content: flex-end;
                }
                .imp .abar .prog {
                    flex: 1 1 100%;
                }
                .imp .abar .why {
                    flex: 1 1 260px;
                }
                .imp .abtns {
                    flex: none;

                .imp .abtns > .sec,
                .imp .abtns > .prim {

            /* The design's entrance, pop and pulse motion, the chevron and
               button overshoot, the bar sweep: all off. The spinner keeps
               turning (it is the only sign of life during a long import),
               three times slower. */
            @media (prefers-reduced-motion: reduce) {
                .imp.enter .pane,
                .imp.enter .rc,
                .imp .dg.enter .rc,
                .imp .opts.enter,
                .imp .st.done.pop .ck,
                .imp.enter .sum .sic,

                    animation: none;

                    animation-duration: 2.4s;

                .imp .sd,
                .imp .mrow,
                .imp .mchev,
                .imp .dgh svg,
                .imp .pbar span,
                .imp .drop,
                .imp .prim,
                .imp .sec,
                .imp .sgb,
                .imp .opt {
                    transition: none;
                }
                .imp .drop.over,
                .imp .drop:active,
                .imp .prim:active {
                    transform: none;
                }
            }

        <div id="root"></div>
        <!-- Outside #root on purpose: render() replaces #root wholesale, and a
             live region rebuilt on every paint is not reliably announced. -->
        <div id="imp-live" class="vh" aria-live="polite"></div>
        <script>
            /*@i18n@*/
            /*@include shared/i18n.js@*/
            /*@include shared/date.js@*/

            /*@include shared/bridge.js@*/

            // The real, unit-tested CSV parser (src/csv.ts + src/csv.test.ts).
            /*@inlinets src/csv.ts@*/

            // ---- config from start_meal_import -------------------------------
            //
            // drink_unit is the alcohol opt-in, exactly as every other
            // widget-backed tool carries it: "us" / "uk" when the user tracks
            // alcohol, null when they do not. It DEFAULTS to null and an absent
            // field therefore reads as tracking-off, deliberately: a widget is
            // assembled from source by the same process that serves the tool, so
            // a payload with no drink_unit means a host or harness synthesised
            // it, and guessing "on" there would surface per-row ethanol to the
            // one user the opt-in exists to protect. Failing closed costs a
            // column; failing open costs the thing the gate is for.
            let CFG = {
                tz: "UTC",
                today: "",
                max_rows_per_call: 50,
                import_tool_name: "bulk_import_meals",
                known_source_apps: [],
                tz_configured: true,
                drink_unit: null,
                locale: "en",
            };
            let API = null;

            // Strict allowlist, not truthiness: only the two values the server's
            // schema can emit turn alcohol on.
            function alcoholTracked() {
                return CFG.drink_unit === "us" || CFG.drink_unit === "uk";
            }

            // Support contact, shown only when something has actually gone wrong.
            // Plain text, NOT a mailto: link — the widget runs in a
            // sandbox="allow-scripts" iframe and Chrome blocks navigation to
            // external protocols from one, so a mailto anchor silently does
            // nothing while still looking clickable.
            // depersonalize.ts strips this block; keep the marker comments.
            /* support-contact:start */
            const SUPPORT_EMAIL = "anton@nutrition-mcp.com";
            /* support-contact:end */

            // A short, copyable description of the file and what went wrong.
            // "Email me" on its own costs two round trips — the first reply is
            // always "what does your file look like?" — so the answer ships with
            // the question.
            function diagnosticsBlock() {
                if (!SUPPORT_EMAIL) return "";
                const t = S.table;
                const lines = [];
                if (t) {
                    lines.push(
                        t.headers.length +
                            " columns: " +
                            t.headers.slice(0, 8).join(" | ") +
                            (t.headers.length > 8 ? " | …" : ""),
                    );
                    lines.push(
                        "encoding " +
                            t.encoding +
                            " · delimiter " +
                            (t.delimiter === "\t" ? "tab" : t.delimiter) +
                            " · decimal " +
                            t.decimalSeparator +
                            " · " +
                            t.rows.length +
                            " rows",
                    );
                    lines.push(
                        "dates read as " +
                            (DATE_FORMAT_ENGLISH_LABELS[S.dateFormat] ||
                                S.dateFormat) +
                            " · energy " +
                            S.energyUnit +
                            (S.dateAmbiguous ? " · format was ambiguous" : ""),
                    );
                }
                const r = S.result;
                if (r) {
                    lines.push(
                        "imported " +
                            r.created +
                            " · already logged " +
                            r.deduplicated +
                            " · failed " +
                            r.failed +
                            " · skipped " +
                            S.skipped,
                    );
                    const first = (r.rowErrors || [])[0];
                    if (first)
                        lines.push(
                            "first error, line " +
                                first.line +
                                ": " +
                                first.message,
                        );
                    for (const e of (r.chunkErrors || []).slice(0, 2))
                        lines.push("batch error: " + e);
                } else if (S.badDates > 0) {
                    lines.push(
                        S.badDates +
                            " row(s) have an unreadable date" +
                            (S.badDateSample
                                ? " (line " +
                                  S.badDateSample.line +
                                  ": " +
                                  S.badDateSample.value +
                                  ")"
                                : ""),
                    );
                }
                return (
                    '<div class="nt mail" role="note"><i aria-hidden="true">✉</i><span>' +
                    tpl(esc(T.importMeals.emailNotice), {
                        email: "<b>" + esc(SUPPORT_EMAIL) + "</b>",
                    }) +
                    '<code class="diag">' +
                    esc(lines.join("\n")) +
                    "</code></span></div>"
                );
            }

            // ---- state -------------------------------------------------------
            // Plain data — labels are looked up from T.importMeals.fieldLabels
            // by key at the one call site that renders them (mapStep()), so a
            // locale switch relabels these without rebuilding the array.
            const FIELDS = [
                { key: "logged_at", required: true },
                { key: "description" },
                { key: "meal_type" },
                { key: "calories" },
                { key: "protein_g" },
                { key: "carbs_g" },
                { key: "fat_g" },
                // Parts of fat_g. Optional, never a gate: a file without them
                // imports with the value not recorded.
                { key: "saturated_fat_g" },
                { key: "trans_fat_g" },
                { key: "fiber_g" },
                { key: "sugar_g" },
                // The part of sugar_g that was added; the server refuses a
                // row whose added sugar exceeds its total.
                { key: "added_sugar_g" },
                // Only offered when the user tracks alcohol — see gatedField.
                { key: "alcohol_g", alcoholOnly: true },
                // Milligrams, and the label says so. Caffeine has no opt-in
                // flag of any kind — unlike alcohol it is offered to everyone,
                // always; it is the read side that stays quiet until there is
                // caffeine to talk about.
                { key: "caffeine_mg" },
                // Milligrams of sodium (not salt). Optional, never a gate: a
                // file without it imports with sodium not recorded.
                // isNew: the map step badges it, since sodium is the newly
                // tracked nutrient and most users will not expect the row.
                { key: "sodium_mg", isNew: true },
                { key: "notes" },
                { key: "time" },
                { key: "deleted" },
                // Only meaningful in this app's own export, where it is the
                // meal's id and is what lets a restored backup be recognized
                // instead of duplicated. Offered like any other field so it can
                // be re-pointed or unset; a foreign app's id column maps here
                // harmlessly, because the server ignores anything that is not
                // one of this user's meal ids.
                { key: "source_id" },
                // Same reasoning as source_id: only meaningful when the file
                // is this app's own export, offered like any other field so
                // it can be re-pointed or unset.
                { key: "timezone" },
            ];
            // Header aliases for the exports surveyed. Matched with
            // normalizeHeader from csv.ts, so "Fat (g)" and "fat_g" both hit.
            const ALIASES = {
                logged_at: ["date", "day", "logged_at", "datum", "timestamp"],
                time: ["time", "uhrzeit"],
                description: [
                    "food_name",
                    "description",
                    "name",
                    "food",
                    "item",
                    "lebensmittel",
                ],
                meal_type: ["meal", "meal_type", "type", "group", "mahlzeit"],
                calories: [
                    "calories",
                    "energy_kcal",
                    "energy",
                    "kcal",
                    "calories_kcal",
                    "kalorien",
                ],
                protein_g: ["protein_g", "protein", "eiweiss"],
                carbs_g: [
                    "carbs_g",
                    "carbohydrates_g",
                    "carbs",
                    "carbohydrates",
                    "net_carbs_g",
                    "kohlenhydrate",
                ],
                fat_g: ["fat_g", "fat", "total_fat", "fett"],
                // SATURATED and TRANS fat are parts of fat_g. Cronometer writes
                // "Saturated (g)" and "Trans-Fats (g)"; MyFitnessPal writes
                // "Saturated Fat" and "Trans Fat". Matched exactly per
                // normalized header, so "Saturated Fat" never reaches fat_g.
                saturated_fat_g: [
                    "saturated_fat_g",
                    "saturated_fat",
                    "saturated_g",
                    "saturated_fats_g",
                    "saturated_fats",
                    "saturates_g",
                    "saturates",
                    "gesattigte_fettsauren",
                    "gesattigte_fettsauren_g",
                    "grasas_saturadas",
                    "grasas_saturadas_g",
                    "acides_gras_satures",
                    "acides_gras_satures_g",
                    "grassi_saturi",
                    "grassi_saturi_g",
                ],
                trans_fat_g: [
                    "trans_fat_g",
                    "trans_fat",
                    "trans_fats_g",
                    "trans_fats",
                    "trans_g",
                    "trans_fatty_acids_g",
                    "trans_fatty_acids",
                    "transfettes",
                    "transfettes_g",
                    "grasas_trans",
                    "grasas_trans_g",
                    "acides_gras_trans",
                    "acides_gras_trans_g",
                    "grassi_trans",
                    "grassi_trans_g",
                ],
                // normalizeHeader turns "Fiber (g)" into "fiber_g" but leaves
                // "Fiber" as "fiber", so both spellings are listed. Localised
                // headers usually ship the unit too ("Ballaststoffe (g)"), so
                // the non-English words get the _g form as well.
                fiber_g: [
                    "fiber_g",
                    "fiber",
                    "fibre_g",
                    "fibre",
                    "dietary_fiber",
                    "dietary_fibre",
                    "total_fiber",
                    "total_fibre",
                    "ballaststoffe",
                    "ballaststoffe_g",
                    "fibra",
                    "fibres",
                ],
                // TOTAL sugars only. "Added sugar" / "free sugars" maps to
                // the added_sugar_g field below, never this one. Matching is
                // exact per normalized header, so Cronometer's "Sugar Alcohols (g)" (a polyol, not
                // sugar and not ethanol) cannot land in this field either.
                sugar_g: [
                    "sugar_g",
                    "sugar",
                    "sugars_g",
                    "sugars",
                    "total_sugar",
                    "total_sugars",
                    "total_sugars_g",
                    "zucker",
                    "zucker_g",
                    "azucar",
                    "azucares",
                    "sucres",
                    "zuccheri",
                    "suikers",
                ],
                // ADDED sugars, a subset of sugar_g. The exact spellings here
                // cover the common exports; ADDED_SUGAR_RE below catches the
                // rest when none of these matched.
                added_sugar_g: [
                    "added_sugar_g",
                    "added_sugar",
                    "added_sugars_g",
                    "added_sugars",
                    "sugar_added",
                    "sugars_added",
                    "free_sugars",
                    "free_sugars_g",
                    "zugesetzter_zucker",
                    "zugesetzter_zucker_g",
                    "azucares_anadidos",
                    "azucares_anadidos_g",
                    "sucres_ajoutes",
                    "sucres_ajoutes_g",
                    "zuccheri_aggiunti",
                    "zuccheri_aggiunti_g",
                    "toegevoegde_suiker",
                    "toegevoegde_suiker_g",
                    "toegevoegde_suikers",
                    "toegevoegde_suikers_g",
                    "cukry_dodane",
                    "cukry_dodane_g",
                ],
                // Grams of pure ethanol. NOT a drink volume, an ABV percentage
                // or a sugar-alcohol count, so "abv" / "alcohol_by_volume" /
                // "sugar_alcohols" are excluded on purpose. "alcohol_ethyl" is
                // the USDA field name Cronometer inherits.
                alcohol_g: [
                    "alcohol_g",
                    "alcohol",
                    "alcohol_ethyl",
                    "ethanol",
                    "ethanol_g",
                    "alkohol",
                    "alkohol_g",
                ],
                // MILLIGRAMS. normalizeHeader turns "Caffeine (mg)" — what
                // Cronometer and every other exporter that carries it writes —
                // into "caffeine_mg", and a bare "Caffeine" into "caffeine";
                // both are listed, and both are read as mg because no surveyed
                // export states caffeine in grams. What is deliberately NOT
                // listed is any *_g spelling: matching is exact per normalized
                // header, so "Caffeine (g)" cannot land here by accident, and
                // caffeineGramsColumns below says so out loud rather than
                // leaving the row silently blank. Localised headers usually
                // ship the unit too, hence the _mg forms alongside the bare
                // words.
                caffeine_mg: [
                    "caffeine_mg",
                    "caffeine",
                    "koffein",
                    "koffein_mg",
                    "cafeina",
                    "cafeina_mg",
                    "caffeina",
                    "caffeina_mg",
                    "cafeine",
                    "cafeine_mg",
                ],
                // MILLIGRAMS of SODIUM. Cronometer writes "Sodium (mg)"
                // (normalized "sodium_mg") and MyFitnessPal a bare "Sodium",
                // which is milligrams too. Salt is a different figure (about
                // 2.5x sodium by weight), so no salt/salz/sel spelling is here,
                // and no *_g spelling either: matching is exact per normalized
                // header, so "Sodium (g)" cannot land here by accident. The
                // Polish "Sód" folds to "sod".
                sodium_mg: [
                    "sodium_mg",
                    "sodium",
                    "natrium",
                    "natrium_mg",
                    "sodio",
                    "sodio_mg",
                    "sod",
                    "sod_mg",
                    "sodyum",
                    "sodyum_mg",
                ],
                notes: ["note", "notes", "comment", "kommentar"],
                deleted: ["deleted"],
                // Deliberately narrow. "meal_id" and "entry_id" are NOT here:
                // a foreign app's identifier under one of those names would be
                // sent and then dropped server-side anyway, and each extra
                // alias is another chance to bind this to a column that is not
                // an id at all. Our own export writes exactly "id".
                source_id: ["id"],
                // Deliberately narrow, same reasoning as source_id above:
                // our own export writes exactly "timezone".
                timezone: ["timezone"],
            };

            // Looser net for added-sugar headers no ALIASES spelling matched
            // ("Added Sugars, incl. syrups (g)"). Only consulted by autoMap
            // when the exact aliases found nothing, and never for the column
            // already holding total sugar. Each alternative names sugar
            // explicitly, so a bare "Zusatzstoffe" (additives) cannot match.
            const ADDED_SUGAR_RE =
                /added_sugar|sugars?_added|free_sugar|zugesetzte[rn]?_zucker|zuckerzusatz/;
            function addedSugarColumn() {
                const sugarCol = S.mapping.sugar_g;
                return S.table.headers.findIndex(
                    (h, i) =>
                        i !== sugarCol &&
                        ADDED_SUGAR_RE.test(normalizeHeader(h)),
                );
            }

            // Caffeine columns whose header states GRAMS. The server stores
            // milligrams, so mapping one would record 0.18 where the user meant
            // 180 — a thousandfold under-report that looks like a clean import
            // and that no bound can catch, since 0.18 mg is a perfectly legal
            // value. Never auto-mapped (the ALIASES list holds no _g spelling);
            // named here so the blank Caffeine row has a stated reason — and,
            // like the alcohol notice, so does the fact that the omission is
            // permanent: caffeine_mg sits outside the import digest, so a second
            // run of a corrected file dedupes to a no-op and back-fills nothing.
            const CAFFEINE_GRAMS_RE =
                /^(caffeine|koffein|cafeina|caffeina|cafeine)_(g|gram|grams|gramm)$/;
            function caffeineGramsColumns() {
                if (!S.table) return [];
                return S.table.headers.filter((h) =>
                    CAFFEINE_GRAMS_RE.test(normalizeHeader(h)),
                );
            }

            // Alcohol is opt-in (CONTRACT §7). With tracking off this widget
            // does not auto-map an alcohol column, does not offer one to map,
            // does not preview one, and — the decision worth stating — does not
            // SEND one either.
            //
            // The "never silently drop user data" rule governs values a caller
            // explicitly passes: bulk_import_meals still stores alcohol_g for
            // anyone who supplies it, tracking or not, so the write layer stays
            // ungated. Here the widget IS the caller, and declining to map a
            // column is a mapping decision, not a dropped field. Writing it
            // anyway would put a number into the user's log that never appeared
            // in the preview they confirmed — this whole flow exists so that
            // what is written is what was shown — and it would sit there
            // unreviewable until the day they turn tracking on. Turning
            // tracking on first and importing then is the supported path.
            function gatedField(f) {
                return f.alcoholOnly && !alcoholTracked();
            }
            // The gate is silent by construction — with tracking off the field
            // is never offered, so a file's alcohol column simply is not there
            // to notice. That silence is only safe if the data can be got back,
            // and it cannot: alcohol_g is deliberately outside the import
            // idempotency digest (CONTRACT §2), so importing now and re-running
            // the same file after turning tracking on is a clean no-op that
            // back-fills nothing. The user would have to delete and re-import.
            // So say it once, here, while the choice is still free.
            //
            // Same ALIASES entry the gate maps by, so the notice cannot drift
            // from what would actually have been imported. It fires on the
            // column's PRESENCE only and names its header — the user's own file
            // text. It never reads a cell: per-row ethanol figures are the one
            // thing the opt-in exists to keep off this screen.
            function alcoholColumn() {
                if (!S.table) return "";
                const i = findColumn(S.table.headers, ALIASES.alcohol_g);
                return i >= 0 ? S.table.headers[i] : "";
            }
            function mappableFields() {
                return FIELDS.filter((f) => !gatedField(f));
            }

            const S = {
                step: "file", // file | map | preview | done
                fileName: "",
                table: null, // ParsedTable from csv.ts
                mapping: {}, // field key -> column index (-1 = unmapped)
                sourceApp: "",
                dateFormat: "iso", // iso | dmy | mdy — sniffed, user-confirmable
                dateAmbiguous: false, // sniff could not tell day-first from month-first
                energyUnit: "kcal", // kcal | kj — unit of the calories column
                rows: [], // built import rows
                skipped: 0,
                badDates: 0, // rows dropped because their date would not parse
                badDateSample: null, // { line, value } of the first such row
                errors: [], // local pre-flight problems
                busy: false,
                progress: null, // { done, total, label }
                result: null, // aggregate of every chunk
                // ---- view state (the redesign) ----
                autoMapping: {}, // what autoMap() picked, for "auto" vs "set by you"
                open: null, // field key whose column list is open, one at a time
                dayOpen: {}, // preview day groups the user toggled, by ISO date
                over: false, // a file is being dragged over the drop zone
                modelSummary: "", // the exact text handed to updateModelContext
                focus: null, // selector to focus after the next render()
            };

            function esc(s) {
                return String(s == null ? "" : s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#39;");
            }
            // Escapes a translated "{n} rows"-style string, then bolds the
            // digit run wherever it landed — robust to word order, unlike
            // hardcoding "<b>N</b> rows" around a fixed English shape.
            function boldCount(text) {
                return esc(text).replace(
                    /\d[\d,.\s ]*\d|\d/,
                    (m) => "<b>" + m + "</b>",
                );
            }

            // A preview-table nutrient header: the short translated
            // abbreviation, with the full label as its tooltip. Caffeine and
            // sodium are the columns in milligrams, so their headers name the
            // unit.
            function nutrientAbbr(key) {
                if (key === "calories") return T.macros.units.kcal;
                return (
                    T.importMeals.tableAbbr[key] +
                    (key.endsWith("_mg") ? " " + T.macros.units.mg : "")
                );
            }
            // Sodium is the newly tracked nutrient, so its header carries the
            // same quiet slate tint as the map step's "new" badge.
            function nutrientTh(key) {
                return (
                    '<span class="th num' +
                    (key === "sodium_mg" ? " new" : "") +
                    '" role="columnheader" title="' +
                    esc(T.macros.labels[key]) +
                    '">' +
                    esc(nutrientAbbr(key)) +
                    "</span>"
                );
            }

            // ---- step 1: file ------------------------------------------------
            // A spreadsheet saved as .xlsx (a ZIP), or any file with NUL
            // bytes in its head, is not text. parseCsv would still "parse" it
            // into a column or two of mojibake, which then reads as a mapping
            // problem; naming the actual cause up front is the useful answer.
            function looksBinary(buf) {
                if (
                    buf.length >= 4 &&
                    buf[0] === 0x50 &&
                    buf[1] === 0x4b &&
                    buf[2] === 0x03 &&
                    buf[3] === 0x04
                )
                    return true;
                // Old .xls (OLE2 compound file).
                if (buf.length >= 4 && buf[0] === 0xd0 && buf[1] === 0xcf)
                    return true;
                // UTF-16 text legitimately carries NULs, and decodeBytes
                // handles it when it has a BOM; only BOM-less heads are judged.
                const bom16 =
                    buf.length >= 2 &&
                    ((buf[0] === 0xff && buf[1] === 0xfe) ||
                        (buf[0] === 0xfe && buf[1] === 0xff));
                if (bom16) return false;
                const n = Math.min(buf.length, 1024);
                for (let i = 0; i < n; i++) if (buf[i] === 0) return true;
                return false;
            }
            function fileError(message) {
                S.errors = [message];
                S.over = false;
                S.focus = ".errs";
                announce(T.importMeals.liveFileError);
                render();
            }
            async function loadFile(file) {
                S.fileName = file.name;
                let buf;
                try {
                    buf = new Uint8Array(await file.arrayBuffer());
                    if (looksBinary(buf)) {
                        fileError(T.importMeals.binaryFile);
                        return;
                    }
                    S.table = parseCsv(buf);
                } catch (e) {
                    fileError(
                        tpl(T.importMeals.couldNotReadFile, {
                            msg: e.message,
                        }),
                    );
                    return;
                }
                if (!S.table.rows.length) {
                    fileError(
                        T.importMeals.noDataRows +
                            (S.table.warnings[0]
                                ? " " + S.table.warnings[0]
                                : ""),
                    );
                    return;
                }
                S.errors = [];
                S.over = false;
                S.open = null;
                autoMap();
                guessSourceApp();
                resniffDateFormat();
                resniffEnergyUnit();
                S.step = "map";
                // The first row is where the work is; the title is one
                // Tab away above it.
                S.focus = ".mbtn";
                announce(stepAnnouncement());
                render();
            }

            function autoMap() {
                S.mapping = {};
                for (const f of FIELDS) {
                    // A gated field is pinned to -1 rather than skipped: every
                    // key must exist, because buildRows' num() only treats a
                    // real negative index as "not in this file".
                    S.mapping[f.key] = gatedField(f)
                        ? -1
                        : findColumn(
                              S.table.headers,
                              ALIASES[f.key] || [f.key],
                          );
                }
                if (S.mapping.added_sugar_g === -1)
                    S.mapping.added_sugar_g = addedSugarColumn();
                S.autoMapping = Object.assign({}, S.mapping);
            }
            // A MyFitnessPal export has a Meal column but no food name; knowing
            // which app it came from lets the server label those rows.
            function guessSourceApp() {
                const h = S.table.headers.map(normalizeHeader).join("|");
                if (h.includes("food_name") && h.includes("amount"))
                    S.sourceApp = "cronometer";
                else if (
                    S.mapping.description === -1 &&
                    S.mapping.meal_type >= 0
                )
                    S.sourceApp = "myfitnesspal";
                else if (h.includes("deleted")) S.sourceApp = "loseit";
                else if (h.includes("serving_size"))
                    S.sourceApp = "macrofactor";
                else S.sourceApp = "";
            }

            // ---- date format & energy unit -----------------------------------
            //
            // The server accepts ISO dates and kcal only, so a DD/MM/YYYY or
            // kilojoule export has to be converted here. Both settings are sniffed
            // from the file (sniffDateFormat / sniffEnergyUnit in csv.ts) and then
            // stay editable, because a sniff is a guess and both failure modes are
            // silent: day/month order is genuinely undecidable for a column of
            // 05/06/2026, and a column headed "Calories" may hold kJ, which would
            // store every row 4.184x too high while reporting success. So each
            // control is shown next to a worked example from the user's own first
            // row — a wrong setting is then visible before anything is written.
            // Functions, not static arrays, so a locale switch (setLocale runs
            // before every render()) relabels these without rebuilding them.
            function dateFormatOptions() {
                return [
                    ["iso", `${T.importMeals.dateFormatYmd} (2026-07-18)`],
                    ["dmy", `${T.importMeals.dateFormatDmy} (18/07/2026)`],
                    ["mdy", `${T.importMeals.dateFormatMdy} (07/18/2026)`],
                ];
            }

            // Some exports put the whole timestamp in the date column. toIsoDate
            // tolerates a trailing time but returns the date alone, so the time is
            // captured here and re-appended after conversion — dropping it would
            // quietly move every meal to midday. Mirrors csv.ts's TRAILING_TIME_RE
            // so exactly what toIsoDate discards is what gets put back.
            const CELL_TIME_RE =
                /[T ]\s*(\d{1,2}:\d{2}(?::\d{2})?(?:\.\d+)?\s*[ap]?\.?m?\.?)$/i;
            function timeInDateCell(raw) {
                const m = CELL_TIME_RE.exec(
                    String(raw == null ? "" : raw).trim(),
                );
                return m ? m[1].trim() : "";
            }

            function dateFormatLabel(fmt) {
                const o = dateFormatOptions().find((x) => x[0] === fmt);
                return o ? o[1].replace(/\s*\(.*\)$/, "") : String(fmt);
            }
            // English-only, for diagnosticsBlock() alone: that block is a
            // copy-paste dump addressed to the (English-speaking) maintainer
            // regardless of the widget's locale, but dateFormatLabel() now
            // returns the user's own translated text since it reads from
            // dateFormatOptions(). Keep this lookup separate rather than
            // changing dateFormatLabel() itself, whose other call sites
            // (dateExampleHtml(), the "Dates read as…" line, the bad-dates
            // warning) are correctly meant to show the user's locale.
            const DATE_FORMAT_ENGLISH_LABELS = {
                iso: "Year-Month-Day",
                dmy: "Day/Month/Year",
                mdy: "Month/Day/Year",
            };

            // Cells / numbers of the column currently mapped to `fieldKey`
            // (limit 0 = all of them).
            function columnCells(fieldKey, limit) {
                const t = S.table;
                const idx = S.mapping[fieldKey];
                const out = [];
                if (!t || !(idx >= 0)) return out;
                for (const r of t.rows) {
                    if (isBlankCell(r[idx])) continue;
                    out.push(r[idx].trim());
                    if (limit && out.length >= limit) break;
                }
                return out;
            }
            function columnNumbers(fieldKey, limit) {
                const t = S.table;
                const idx = S.mapping[fieldKey];
                const out = [];
                if (!t || !(idx >= 0)) return out;
                for (const r of t.rows) {
                    const v = parseNumber(r[idx], t.decimalSeparator);
                    if (v === null) continue;
                    out.push(v);
                    if (limit && out.length >= limit) break;
                }
                return out;
            }

            // Sniff the whole column, not a sample: one 18/07/2026 anywhere in the
            // file is what settles day-first, and the energy median is steadier
            // over every row. Re-run on load AND whenever the user remaps
            // logged_at / calories, since the evidence came from that column.
            function resniffDateFormat() {
                const values = columnCells("logged_at", 0);
                if (!values.length) {
                    S.dateFormat = "iso";
                    S.dateAmbiguous = false;
                    return;
                }
                const sniffed = sniffDateFormat(values);
                S.dateFormat = sniffed.format;
                S.dateAmbiguous = sniffed.ambiguous;
            }
            function resniffEnergyUnit() {
                const t = S.table;
                const idx = S.mapping.calories;
                if (!t || !(idx >= 0)) {
                    S.energyUnit = "kcal";
                    return;
                }
                S.energyUnit = sniffEnergyUnit(
                    t.headers[idx] || "",
                    columnNumbers("calories", 0),
                );
            }

            // ---- step 2 -> 3: build rows -------------------------------------
            function buildRows() {
                const t = S.table;
                const m = S.mapping;
                const dec = t.decimalSeparator;
                const cell = (row, idx) =>
                    idx >= 0 && !isBlankCell(row[idx])
                        ? row[idx].trim()
                        : undefined;
                const num = (row, idx) => {
                    if (idx < 0) return undefined;
                    const v = parseNumber(row[idx], dec);
                    return v === null ? undefined : v;
                };
                // Provenance columns, written only by this server's own export
                // (src/export.ts). They are not mapped or previewed: the server
                // reads them only when provenance_version says the file is ours,
                // and re-checks every record-backed label itself. A file without
                // the marker sends none of them.
                const provHeader = {
                    version: findColumn(t.headers, ["provenance_version"]),
                    nutrient_sources: findColumn(t.headers, [
                        "nutrient_sources",
                    ]),
                    source_detail: findColumn(t.headers, ["source_detail"]),
                };
                const provenance = (row) =>
                    provHeader.version < 0 ||
                    cell(row, provHeader.version) === undefined
                        ? {}
                        : {
                              provenance_version: cell(row, provHeader.version),
                              nutrient_sources: cell(
                                  row,
                                  provHeader.nutrient_sources,
                              ),
                              source_detail: cell(
                                  row,
                                  provHeader.source_detail,
                              ),
                          };

                const rows = [];
                let skipped = 0;
                let badDates = 0;
                let badDateSample = null;
                for (let i = 0; i < t.rows.length; i++) {
                    const r = t.rows[i];
                    if (m.deleted >= 0 && isDeletedRow(r, m.deleted)) {
                        skipped++;
                        continue;
                    }
                    const rawWhen = cell(r, m.logged_at);
                    if (rawWhen === undefined) {
                        skipped++;
                        continue;
                    }
                    // The server only accepts ISO, so convert with the format the
                    // column agreed on. A cell that will not parse is dropped and
                    // counted rather than sent — the server would reject it row by
                    // row anyway, and the count is surfaced in the preview so a
                    // wrong format setting cannot pass as a successful import.
                    const iso = toIsoDate(rawWhen, S.dateFormat);
                    if (iso === null) {
                        badDates++;
                        if (!badDateSample) {
                            badDateSample = {
                                line: t.sourceLines[i],
                                value: rawWhen,
                            };
                        }
                        skipped++;
                        continue;
                    }
                    let when = iso;
                    // A separate time column is common (Cronometer: Day + Time);
                    // otherwise keep a time that rode along in the date cell,
                    // which toIsoDate drops. Either can be unpadded 12-hour
                    // ("9:15 AM") — the server only accepts zero-padded 24-hour
                    // HH:MM, so normalizeTime converts it. A time that fails to
                    // parse is dropped rather than failing the whole row: the
                    // meal still imports, dated but timeless (server default:
                    // local noon), and shows up in the noTime notice below.
                    const rawTime = cell(r, m.time) || timeInDateCell(rawWhen);
                    const time = rawTime ? normalizeTime(rawTime) : null;
                    if (time) when = when + " " + time;

                    // Calories only: protein/carbs/fat/saturated/trans/fiber/
                    // sugar/added sugar/alcohol are all grams in every export and
                    // caffeine is milligrams in every export that carries it — each already the unit the
                    // server stores, so none of them convert. A caffeine column
                    // headed in grams is the one shape that would need
                    // converting, and it is refused rather than scaled (see
                    // CAFFEINE_GRAMS_RE): guessing the factor for a column we
                    // are not sure about is how a 1000x error gets written.
                    const energy = num(r, m.calories);

                    rows.push({
                        source_line: t.sourceLines[i],
                        logged_at: when,
                        description: cell(r, m.description),
                        meal_type: cell(r, m.meal_type),
                        calories:
                            energy === undefined
                                ? undefined
                                : toKcal(energy, S.energyUnit),
                        protein_g: num(r, m.protein_g),
                        carbs_g: num(r, m.carbs_g),
                        fat_g: num(r, m.fat_g),
                        saturated_fat_g: num(r, m.saturated_fat_g),
                        trans_fat_g: num(r, m.trans_fat_g),
                        fiber_g: num(r, m.fiber_g),
                        sugar_g: num(r, m.sugar_g),
                        added_sugar_g: num(r, m.added_sugar_g),
                        // The mapping is already -1 when tracking is off; this
                        // is the belt to that braces, because this line is the
                        // one that decides what leaves the browser.
                        alcohol_g: alcoholTracked()
                            ? num(r, m.alcohol_g)
                            : undefined,
                        // No gate of any kind, deliberately: caffeine has no
                        // opt-in, so the only thing that keeps it out of a row
                        // is the file not having the column.
                        caffeine_mg: num(r, m.caffeine_mg),
                        // Milligrams in every export that carries it, as the
                        // server stores it: no conversion.
                        sodium_mg: num(r, m.sodium_mg),
                        notes: cell(r, m.notes),
                        // Passed through untouched. The server decides whether
                        // it names one of this user's meals; the widget must
                        // not, because it cannot see their history.
                        source_id: cell(r, m.source_id),
                        // Also passed through untouched: the server decides
                        // whether to use it, falling back to the account's
                        // timezone when it is absent or not a recognized
                        // IANA identifier.
                        timezone: cell(r, m.timezone),
                        // Passed through untouched, like source_id: the server
                        // decides whether the file is this app's own export.
                        ...provenance(r),
                    });
                }
                S.rows = rows;
                S.badDates = badDates;
                S.badDateSample = badDateSample;
                S.skipped = skipped + t.skippedTotalsRows + t.skippedBlankRows;
            }

            // The real, unit-tested chunker (src/chunk.ts + src/chunk.test.ts).
            // Not written here: the boundary logic deciding which rows land in
            // which server call was hand-copied inline JS with no test coverage
            // and had a real bug (issue #65) — a run of same-date rows
            // straddling the 50-row cap kept absorbing more rows instead of
            // closing the chunk, so the server's hard MAX_ROWS_PER_CALL reject
            // hit silently.
            /*@inlinets src/chunk.ts@*/

            // ---- step 3: import ----------------------------------------------
            async function runImport() {
                if (!API || !API.canCallTools) return;
                S.busy = true;
                S.result = {
                    created: 0,
                    deduplicated: 0,
                    failed: 0,
                    chunks: 0,
                    chunkErrors: [],
                    rowErrors: [],
                    warnings: [],
                };
                const { chunks } = chunkRows(S.rows, CFG.max_rows_per_call);
                S.progress = { done: 0, total: chunks.length, label: "" };
                S.modelSummary = "";
                announce(
                    plural(T.importMeals.liveImporting, chunks.length, {
                        n: fmtCount(chunks.length),
                    }),
                );
                render();

                for (let i = 0; i < chunks.length; i++) {
                    const rows = chunks[i];
                    const kcal = rows.reduce(
                        (a, r) => a + (r.calories ?? 0),
                        0,
                    );
                    const everyHasKcal = rows.every(
                        (r) => r.calories !== undefined,
                    );
                    const args = {
                        meals: rows,
                        expected_row_count: rows.length,
                        rows_skipped: i === 0 ? S.skipped : 0,
                        source_app: S.sourceApp || undefined,
                        // Dry-run the FIRST chunk only. A full second pass would
                        // double the call count, and at 60 requests/min a large
                        // file would hit the rate limit; the preview above has
                        // already shown the user what will be written.
                        dry_run: i === 0,
                    };
                    if (everyHasKcal) args.expected_total_kcal = kcal;

                    S.progress.label = plural(
                        i === 0
                            ? T.importMeals.checkingRows
                            : T.importMeals.importingRows,
                        rows.length,
                    );
                    render();

                    try {
                        const res = await API.callTool(
                            CFG.import_tool_name,
                            args,
                            { timeoutMs: 90000 },
                        );
                        const sc = res && res.structuredContent;
                        if (!sc) throw new Error("no result payload");
                        collect(sc);

                        if (i === 0) {
                            // Dry run: abort on failure rather than writing.
                            // Surfaced through chunkErrors (rendered right on
                            // this step) rather than a bare return — collect()
                            // already put the server's reason in S.result.warnings,
                            // but the preview step never renders that list, so a
                            // silent return here left the user staring at an
                            // unchanged preview with no visible explanation
                            // (issue #65).
                            if (sc.status === "failed") {
                                S.result.chunkErrors.push(
                                    tpl(T.importMeals.rowsRange, {
                                        a: rows[0].source_line,
                                        b: rows[rows.length - 1].source_line,
                                        msg:
                                            sc.warnings && sc.warnings.length
                                                ? sc.warnings.join("; ")
                                                : T.importMeals.preflightFailed,
                                    }),
                                );
                                S.busy = false;
                                S.progress = null;
                                S.focus = ".errs";
                                announce(T.importMeals.liveNoWrite);
                                render();
                                return;
                            }
                            // Passed — now write this chunk for real.
                            args.dry_run = false;
                            const real = await API.callTool(
