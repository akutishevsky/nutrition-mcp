<!doctype html>
<!--
  Meal-logged widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  Shown after log_meal AND update_meal (both tools link this same widget and emit
  the same structuredContent shape via buildMealProgress in src/mcp.ts): one card
  whose header names the meal just logged and the calories it added, and whose
  body is the shared strip on its TIERED layout — the day's calorie panel, then
  the macro, limit and water rails, each tile opening the meals behind it. The
  `action` field ("logged" or "updated") only changes the header wording. Per
  product decision, it renders NOTHING when no nutrition goals are set (there
  is no target to show progress against); base.css's paddingless `.wrap` is
  the other half of that contract — an empty #root has no height of its own to
  hold the host's frame open, and bridge.js drops its settings note from an
  empty root.

  Data arrives as the `structuredContent` of the log_meal / update_meal tool
  result; the shared bridge (shared/bridge.js) reads it across host conventions
  and calls render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meal Logged</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/chip.css@*/

            /* No local `.csub` rule. This card's subtitle is not context, it IS
               the confirmation — the only place the widget says what was just
               logged — and it needs two lines rather than one ellipsised one.
               That clamp now lives in base.css's own `.csub`, because keeping
               it here made the component-gallery specimen stop matching the
               card it is the reference for (recheck, minor). Nothing to
               override: edit base.css if the subtitle's shape has to change. */
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                action: "logged",
                date: "2026-07-11",
                locale: "en",
                logged_meal: {
                    description: "Grilled chicken salad",
                    meal_type: "lunch",
                    calories: 520,
                    protein_g: 42,
                    carbs_g: 28,
                    fat_g: 22,
                    fiber_g: 7.4,
                    sugar_g: 6.1,
                    // null = this user has alcohol tracking off, which is also
                    // why the strip below shows no alcohol chip.
                    alcohol_g: null,
                    // Caffeine is NOT gated on that opt-in — there is no
                    // caffeine flag at all — so it shows in the same strip that
                    // hides alcohol. Its own suppression is the data: null on
                    // this salad, a figure on the coffee below.
                    caffeine_mg: null,
                },
                // Alcohol tracking OFF, which is what every `alcohol_g: null`
                // below is saying; the two must agree or the sample previews a
                // state the server cannot produce.
                drink_unit: null,
                has_goals: true,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: null,
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1600,
                    protein_g: 125,
                    carbs_g: 175,
                    fat_g: 58,
                    fiber_g: 21.8,
                    sugar_g: 38.4,
                    // Alcohol tracking OFF in this sample (the other widgets'
                    // samples have it on): null is the opt-in's "hide this
                    // entirely", distinct from a 0 that means an alcohol-free
                    // day. No chip renders.
                    alcohol_g: null,
                    caffeine_mg: 165,
                    water_ml: 1600,
                },
                meals: [
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: null,
                        calories: 420,
                        protein_g: 18,
                        carbs_g: 62,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 24.6,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: null,
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Turkey sandwich",
                        meal_type: "lunch",
                        date: null,
                        calories: 280,
                        protein_g: 36,
                        carbs_g: 61,
                        fat_g: 4,
                        fiber_g: 3.8,
                        sugar_g: 5.2,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Flat white",
                        meal_type: "snack",
                        date: null,
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: null,
                        caffeine_mg: 165,
                    },
                    {
                        description: "Grilled chicken salad",
                        meal_type: "lunch",
                        date: null,
                        calories: 520,
                        protein_g: 42,
                        carbs_g: 28,
                        fat_g: 22,
                        fiber_g: 7.4,
                        sugar_g: 6.1,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                ],
            };

            /* fmt() and esc(), the two helpers shared/macros.js requires in
               scope. After shared/i18n.js because fmt() reads WIDGET_LOCALE. */
            /*@include shared/fmt.js@*/
            // `mealTypeLabel()` — the stored meal_type in the viewer's
            // language — lives in shared/macros.js, because this card prints
            // the same value twice: here on the header line and again on every
            // drawer row. It was the ONE string left in English inside an
            // otherwise fully translated card ("7月15日 · lunch · …").

            let __widgetApi = null;

            function render(data) {
                const root = document.getElementById("root");

                // Per product decision: with no goals there is no target to show
                // progress against, so the widget shows nothing at all. Ahead of
                // setLocale on purpose — there is no string to translate on this
                // path, and the host collapses the frame to nothing.
                if (!data || !data.has_goals || !data.goals) {
                    root.innerHTML = "";
                    return;
                }
                // WHAT WAS OPEN, and where focus was, read before the card is
                // thrown away — a host may re-deliver the tool result while a
                // drawer is open (rare here: every log_meal is a new call and
                // usually a new iframe, but nothing stops a host replaying
                // one). Below the early return on purpose: the no-goals card
                // has no strip to restore into. Put back by macroRestore at
                // the end of render(); both live in shared/macros.js.
                const was = macroSnapshot(root);
                setLocaleFrom(data, __widgetApi);
                // Litres or fluid ounces, from the profile (macros.js).
                setWaterUnit(data.water_unit);

                // The card itself — header and tiered strip — is
                // shared/meal-logged-card.js, which the public site's landing
                // page renders from too.
                root.innerHTML = mealLoggedCard(data);
                // After the card exists: macroRestore re-opens through
                // macroToggle on the NEW strip, and only ever restores focus,
                // never takes it from the host (see shared/macros.js).
                macroRestore(root, was);
            }

            // Pull the meal progress out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                // "has_goals" is sniffed as well as the totals: a payload that
                // says has_goals:false carries no totals at all and still has
                // to be recognised, or the widget sits on its loading state.
                if (
                    payload.totals ||
                    payload.logged_meal ||
                    "has_goals" in payload
                )
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            /*@include shared/macros.js@*/

            /*@include shared/meal-logged-card.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "meal-logged-widget",
                // No loading state: the widget may legitimately end up empty
                // (no goals), so we start blank and only fill in on data.
                loading: "",
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
