<!doctype html>
<!--
  Meal-logged widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  Shown after log_meal AND update_meal (both tools link this same widget and emit
  the same structuredContent shape via buildMealProgress in src/mcp.ts): one card
  whose header names the meal just logged and the calories it added, and whose
  body is the shared strip — the day's calorie hero, then the rails of nutrient
  chips, each opening the meals behind it. The `action` field ("logged" or
  "updated") only changes the header wording. Per product decision, it renders
  NOTHING when no nutrition goals are set (there is no target to show progress
  against); base.css's `.wrap:empty` is the other half of that contract.

  Data arrives as the `structuredContent` of the log_meal / update_meal tool
  result; the shared bridge (shared/bridge.js) reads it across host conventions
  and calls render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meal Logged</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/chip.css@*/

            /* No local `.csub` rule. This card's subtitle is not context, it IS
               the confirmation — the only place the widget says what was just
               logged — and it needs two lines rather than one ellipsised one.
               That clamp now lives in base.css's own `.csub`, because keeping
               it here made the component-gallery specimen stop matching the
               card it is the reference for (recheck, minor). Nothing to
               override: edit base.css if the subtitle's shape has to change. */
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                action: "logged",
                date: "2026-07-11",
                locale: "en",
                logged_meal: {
                    description: "Grilled chicken salad",
                    meal_type: "lunch",
                    calories: 520,
                    protein_g: 42,
                    carbs_g: 28,
                    fat_g: 22,
                    fiber_g: 7.4,
                    sugar_g: 6.1,
                    // null = this user has alcohol tracking off, which is also
                    // why the strip below shows no alcohol chip.
                    alcohol_g: null,
                    // Caffeine is NOT gated on that opt-in — there is no
                    // caffeine flag at all — so it shows in the same strip that
                    // hides alcohol. Its own suppression is the data: null on
                    // this salad, a figure on the coffee below.
                    caffeine_mg: null,
                },
                // Alcohol tracking OFF, which is what every `alcohol_g: null`
                // below is saying; the two must agree or the sample previews a
                // state the server cannot produce.
                drink_unit: null,
                has_goals: true,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: null,
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1600,
                    protein_g: 125,
                    carbs_g: 175,
                    fat_g: 58,
                    fiber_g: 21.8,
                    sugar_g: 38.4,
                    // Alcohol tracking OFF in this sample (the other widgets'
                    // samples have it on): null is the opt-in's "hide this
                    // entirely", distinct from a 0 that means an alcohol-free
                    // day. No chip renders.
                    alcohol_g: null,
                    caffeine_mg: 165,
                    water_ml: 1600,
                },
                meals: [
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: null,
                        calories: 420,
                        protein_g: 18,
                        carbs_g: 62,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 24.6,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: null,
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Turkey sandwich",
                        meal_type: "lunch",
                        date: null,
                        calories: 280,
                        protein_g: 36,
                        carbs_g: 61,
                        fat_g: 4,
                        fiber_g: 3.8,
                        sugar_g: 5.2,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Flat white",
                        meal_type: "snack",
                        date: null,
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: null,
                        caffeine_mg: 165,
                    },
                    {
                        description: "Grilled chicken salad",
                        meal_type: "lunch",
                        date: null,
                        calories: 520,
                        protein_g: 42,
                        carbs_g: 28,
                        fat_g: 22,
                        fiber_g: 7.4,
                        sugar_g: 6.1,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                ],
            };

            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // `mealTypeLabel()` — the stored meal_type in the viewer's
            // language — lives in shared/macros.js, because this card prints
            // the same value twice: here on the header line and again on every
            // drawer row. It was the ONE string left in English inside an
            // otherwise fully translated card ("7月15日 · lunch · …").

            let __widgetApi = null;

            function render(data) {
                const root = document.getElementById("root");

                // Per product decision: with no goals there is no target to show
                // progress against, so the widget shows nothing at all. Ahead of
                // setLocale on purpose — there is no string to translate on this
                // path, and the host collapses the frame to nothing.
                if (!data || !data.has_goals || !data.goals) {
                    root.innerHTML = "";
                    return;
                }
                setLocaleFrom(data, __widgetApi);
                // Litres or fluid ounces, from the profile (macros.js).
                setWaterUnit(data.water_unit);

                const totals = data.totals || {};
                // update_meal (and log_meal, via a backdated logged_at) can
                // show a day that is not the viewer's today, so the hero only
                // claims "today" when data.date actually is that day (#114);
                // otherwise it names the day, which is also why that day is
                // on the header line below.
                const calLabel = isToday(data.date)
                    ? T.macros.caloriesToday
                    : tpl(T.macros.caloriesOn, { date: shortDate(data.date) });
                const strip = macroPanel(
                    totals,
                    data.goals,
                    undefined,
                    data.meals,
                    // `drink_unit` is null for a user who does not track
                    // alcohol, which is also the case in which no alcohol
                    // figure reaches the strip; macroCtxOf falls back to the
                    // server's own default of "us". No chart here, so no
                    // chartKeys: a chip opens meals and nothing else.
                    { drinkUnit: data.drink_unit, calLabel },
                );

                // The meal that was just logged names itself on the header
                // line, alongside the day it landed on (#114) — the strip
                // below is that whole day's totals, not necessarily today's.
                const meal = data.logged_meal;
                const bits = [];
                if (data.date) bits.push(esc(shortDate(data.date)));
                // Meal type BEFORE the description, not after it. The
                // description is the only unbounded string on this line, so
                // anything behind it is what a clamp eats first — a 150-char
                // meal name used to take the trailing "· lunch" with it and
                // the card lost the one word that classified the entry
                // (layout audit, minor). Both are still shown in full
                // whenever they fit; only the ordering changed.
                if (meal && meal.description) {
                    if (meal.meal_type)
                        bits.push(esc(mealTypeLabel(meal.meal_type)));
                    bits.push(esc(meal.description));
                }
                const sub = bits.join(" · ");
                // The one header meta that is a value rather than context, so
                // it takes .kcal — the calories this meal added, in the calorie
                // colour, beside the day total the hero shows.
                const added =
                    meal && meal.calories != null
                        ? tpl(T.mealLogged.addedKcal, {
                              kcal: fmt(meal.calories, 0),
                          })
                        : "";

                // Same widget for log_meal and update_meal — the action only
                // changes the header wording.
                const title =
                    data.action === "updated"
                        ? T.mealLogged.titleUpdated
                        : T.mealLogged.titleLogged;

                root.innerHTML = `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(title)}</h1>
              ${added ? `<span class="cmeta kcal">${esc(added)}</span>` : ""}
              ${sub ? `<span class="csub">${sub}</span>` : ""}
            </header>
            ${strip}
          </div>`;
            }

            // Pull the meal progress out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                // "has_goals" is sniffed as well as the totals: a payload that
                // says has_goals:false carries no totals at all and still has
                // to be recognised, or the widget sits on its loading state.
                if (
                    payload.totals ||
                    payload.logged_meal ||
                    "has_goals" in payload
                )
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            /*@include shared/macros.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "meal-logged-widget",
                // No loading state: the widget may legitimately end up empty
                // (no goals), so we start blank and only fill in on data.
                loading: "",
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
