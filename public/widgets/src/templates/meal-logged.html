<!doctype html>
<!--
  Meal-logged widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  Shown after log_meal, update_meal AND log_saved_meal (all three link this same
  widget and emit the same structuredContent shape via buildMealProgress in
  src/mcp.ts). The 2026-10 redesign (artboards MG1 / MG2): the meal's name over
  a half-gauge of the day's calories, the part eaten before this meal light and
  this meal's part strong; a delta line ("+520 kcal this meal · 600 kcal left
  today"), on desktop a stat row instead; Show more opens the day's nutrients
  as an accordion (shared/nutrients.js) with each nutrient's meals and
  ingredients, and the centre of the gauge opens the calories by meal. The
  `action` field ("logged" or "updated") changes the eyebrow word and drops the
  "+" sign. Per product decision, it renders NOTHING when no nutrition goals are
  set (there is no target to show progress against). save_meal writes no meal
  and links no widget.

  Data arrives as the `structuredContent` of the tool result, with the
  figures its frozen schema cannot carry in `_meta` (added sugar, the fats,
  sodium, ingredients, sources, each meal's time and which row is this meal),
  every one validated as untrusted and optional; the shared bridge
  (shared/bridge.js) reads it across host conventions and calls render().
  Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Meal Logged</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* No goals → nothing to show. Collapse the gutter so an empty
               widget takes up as little of the host frame as possible. */
            .wrap.tight:empty {
                padding: 0;
            }

            /*@include shared/gauge.css@*/

            /*@include shared/nutrients.css@*/
        </style>
    </head>
    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/date.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                action: "logged",
                date: "2026-10-24",
                locale: "en",
                logged_meal: {
                    description: "Grilled chicken salad",
                    meal_type: "dinner",
                    calories: 520,
                    protein_g: 42,
                    carbs_g: 28,
                    fat_g: 22,
                    fiber_g: 3.5,
                    sugar_g: 5,
                    // null = this user has alcohol tracking off.
                    alcohol_g: null,
                    caffeine_mg: null,
                },
                drink_unit: null,
                has_goals: true,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: null,
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                totals: {
                    calories: 1600,
                    protein_g: 125,
                    carbs_g: 175,
                    fat_g: 58,
                    fiber_g: 21.8,
                    sugar_g: 38.4,
                    alcohol_g: null,
                    caffeine_mg: 128,
                    water_ml: 1600,
                },
                meals: [
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: null,
                        calories: 420,
                        protein_g: 18,
                        carbs_g: 62,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 18.2,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: null,
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 2.4,
                        sugar_g: 9.1,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Turkey sandwich",
                        meal_type: "lunch",
                        date: null,
                        calories: 280,
                        protein_g: 36,
                        carbs_g: 61,
                        fat_g: 4,
                        fiber_g: 7,
                        sugar_g: 6.2,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                    {
                        description: "Flat white",
                        meal_type: "snack",
                        date: null,
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 10.1,
                        alcohol_g: null,
                        caffeine_mg: 128,
                    },
                    {
                        description: "Grilled chicken salad",
                        meal_type: "dinner",
                        date: null,
                        calories: 520,
                        protein_g: 42,
                        carbs_g: 28,
                        fat_g: 22,
                        fiber_g: 3.5,
                        sugar_g: 5,
                        alcohol_g: null,
                        caffeine_mg: null,
                    },
                ],
            };

            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }
            // macros.js's own helpers still format with fmt(); the day view
            // formats through nvFmt (shared/nutrients.js).
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString(WIDGET_LOCALE);
            }

            // The `_meta` validators and merges (withAddedSugar & co.), and
            // DRINK_GRAMS. Its strip is not drawn here, and its delegated
            // click handlers only answer its own data-macro / data-meal-open /
            // data-src-open attributes, which this card never uses.
            /*@include shared/macros.js@*/

            /*@include shared/gauge.js@*/

            /*@include shared/nutrients.js@*/

            let __widgetApi = null;

            // Where log_meal / update_meal put the day's added-sugar figures
            // (AddedSugarMeta, src/added-sugar.ts) — in the result's `_meta`,
            // because the frozen outputSchema can gain no field. Must equal
            // ADDED_SUGAR_META_KEY in src/widgets.ts.
            const ADDED_SUGAR_META_KEY = "nutrition-mcp.com/added-sugar";
            // Saturated and trans fat (SaturatedFatMeta, src/saturated-fat.ts),
            // same reasoning. Must equal SATURATED_FAT_META_KEY.
            const SATURATED_FAT_META_KEY = "nutrition-mcp.com/saturated-fat";
            // Sodium (SodiumMeta, src/sodium.ts), milligrams with an optional
            // daily ceiling. Must equal SODIUM_META_KEY.
            const SODIUM_META_KEY = "nutrition-mcp.com/sodium";
            // Each listed meal's ingredients ({ v: 1, meals: [items | null, …] },
            // aligned with data.meals by position). Must equal
            // MEAL_ITEMS_META_KEY.
            const MEAL_ITEMS_META_KEY = "nutrition-mcp.com/meal-items";
            // Each value's source, position-aligned with the meals and their
            // items. Must equal NUTRIENT_SOURCES_META_KEY.
            const NUTRIENT_SOURCES_META_KEY =
                "nutrition-mcp.com/nutrient-sources";
            // Each row's local time and which row is the meal just written
            // ({ v: 1, times, current }, src/meal-times.ts). Must equal
            // MEAL_TIMES_META_KEY.
            const MEAL_TIMES_META_KEY = "nutrition-mcp.com/meal-times";

            function capFirst(s) {
                const str = String(s || "");
                return str
                    ? str.charAt(0).toLocaleUpperCase(WIDGET_LOCALE) +
                          str.slice(1)
                    : str;
            }

            // Which breakdown row is the meal just written: `_meta` says so;
            // without it, the last row that matches the logged meal (a new
            // meal is usually the latest), else none.
            function currentRow(data, times) {
                if (times && times.current != null) return times.current;
                const lm = data.logged_meal;
                const rows = Array.isArray(data.meals) ? data.meals : [];
                if (!lm) return -1;
                for (let i = rows.length - 1; i >= 0; i--) {
                    const r = rows[i];
                    if (
                        r &&
                        r.description === lm.description &&
                        Math.round(r.calories) === Math.round(lm.calories ?? 0)
                    )
                        return i;
                }
                return -1;
            }

            // `meta` is the tool result's `_meta` (or null — see bridge.js).
            function render(data, meta) {
                const root = document.getElementById("root");

                // Per product decision: with no goals there is no target to show
                // progress against, so the widget shows nothing at all.
                if (!data || !data.has_goals || !data.goals) {
                    root.innerHTML = "";
                    return;
                }
                setLocale(
                    pickLocale(
                        data.locale,
                        __widgetApi && __widgetApi.hostContext
                            ? __widgetApi.hostContext.locale
                            : null,
                    ),
                );
                const S = T.nutritionSummary;
                const L = T.mealLogged;
                const m = meta || {};
                const dates = [data.date];
                const totals = data.totals || {};

                // The `_meta` figures join the payload's own: added sugar,
                // then the fats, then sodium, then ingredients and sources.
                // Each merge leaves its inputs untouched when its key is
                // missing or malformed.
                const as = addedSugarPayload(m[ADDED_SUGAR_META_KEY]);
                const merged = withAddedSugar(
                    as,
                    addedSugarFor(as, dates),
                    totals,
                    data.goals,
                    data.meals,
                );
                const sf = withSaturatedFat(
                    m[SATURATED_FAT_META_KEY],
                    dates,
                    merged.vals,
                    merged.goal,
                    merged.meals,
                );
                const na = withSodium(
                    m[SODIUM_META_KEY],
                    dates,
                    sf.vals,
                    sf.goal,
                    sf.meals,
                );
                const itemsMeta = mealItemsPayload(m[MEAL_ITEMS_META_KEY]);
                const rows = withItemSodium(
                    itemsMeta,
                    withNutrientSources(
                        nutrientSourcesPayload(m[NUTRIENT_SOURCES_META_KEY]),
                        withMealItems(itemsMeta, na.meals),
                        itemsMeta,
                    ),
                );
                const times = mealTimesPayload(
                    m[MEAL_TIMES_META_KEY],
                    Array.isArray(rows) ? rows.length : 0,
                );
                const cur = currentRow(data, times);

                const lm = data.logged_meal || {};
                const today = isToday(data.date);
                const updated = data.action === "updated";
                // This meal's part of each figure: its own logged values, and
                // for the `_meta` nutrients its row's.
                const curRow =
                    cur >= 0 && Array.isArray(rows) ? rows[cur] : null;
                const delta = {};
                for (const def of NV_DEFS) {
                    const v =
                        def.key in lm
                            ? lm[def.key]
                            : curRow
                              ? curRow[def.key]
                              : null;
                    delta[def.key] = Number.isFinite(v) ? v : null;
                }
                const vals = Object.assign({}, na.vals);
                const goal = na.goal || {};

                const t = Number(totals.calories) || 0;
                const a = Number(lm.calories) || 0;
                const g = Number(goal.calories) || 0;
                const over = g > 0 && t > g;
                const leftN = Math.abs(g - t);
                const leftAmt = nvWithUnit("kcal", leftN);
                const kcalTxt = (n) => nvWithUnit("kcal", n);
                const sign = updated ? "" : "+";

                // Gauge: eaten before this meal (light), this meal (strong),
                // both against the goal and capped at it.
                const pre = g > 0 ? gaugeClamp01((t - a) / g) * 100 : 0;
                const all = g > 0 ? gaugeClamp01(t / g) * 100 : 0;
                const add = Math.max(all - pre, a > 0 && g > 0 ? 0.8 : 0);
                const pct = g > 0 ? Math.round((t / g) * 100) : null;
                const status =
                    g > 0
                        ? tpl(over ? S.over : S.left, { amount: leftAmt })
                        : "";
                const aria =
                    g > 0
                        ? tpl(today ? S.gaugeAriaToday : S.gaugeAriaThatDay, {
                              eaten: nvFmt("kcal", t),
                              goal: nvFmt("kcal", g),
                              pct: nvNum(pct, 0),
                              status,
                          })
                        : tpl(S.gaugeAriaNoGoal, { eaten: nvFmt("kcal", t) });

                const eyebrow = capFirst(
                    [
                        nvMealTypeLabel(lm.meal_type),
                        updated ? L.edited : L.logged,
                        today ? "" : shortDate(data.date),
                    ]
                        .filter(Boolean)
                        .join(" · "),
                );
                const leftKey = over
                    ? today
                        ? "overToday"
                        : "overThatDay"
                    : today
                      ? "leftToday"
                      : "leftThatDay";
                const deltaHtml =
                    tpl(esc(L.thisMeal), {
                        amount: `<b>${esc(sign + kcalTxt(a))}</b>`,
                    }) +
                    (g > 0
                        ? `<span class="dot" aria-hidden="true">·</span><b class="${over ? "over" : ""}">${esc(tpl(S[leftKey], { amount: leftAmt }))}</b>`
                        : "");
                const stats = [
                    {
                        label: L.statThisMeal,
                        value: sign + nvFmt("kcal", a),
                        small: nvUnitLabel("kcal"),
                    },
                    {
                        label: today ? L.statToday : shortDate(data.date),
                        value: nvFmt("kcal", t),
                        small: g > 0 ? `/ ${kcalTxt(g)}` : nvUnitLabel("kcal"),
                        over,
                    },
                ];
                if (g > 0)
                    stats.push({
                        label: over
                            ? S.statOverGoal
                            : today
                              ? L.statLeftToday
                              : L.statLeftThatDay,
                        value: nvFmt("kcal", leftN),
                        small: nvUnitLabel("kcal"),
                        over,
                    });

                const meals = nvMealsFrom(
                    rows,
                    (r, i) => (times ? times.times[i] : ""),
                    cur,
                );
                const V = {
                    mode: "meal",
                    dayWord: today ? "today" : "thatDay",
                    hasData: true,
                    // "us" | "uk" for a user who tracks alcohol, null when
                    // they do not — which is also when every alcohol figure
                    // in the payload is null and the row is left out.
                    drinkUnit: data.drink_unit,
                    alcoholOn:
                        data.drink_unit != null ||
                        Number.isFinite(totals.alcohol_g),
                    vals,
                    goal,
                    delta,
                    zeroMeansUnknown: ["fiber_g", "sugar_g"],
                    cal: { t, g },
                    meals,
                    hero: {
                        eyebrow,
                        title: lm.description || T.macros.untitledMeal,
                        deltaHtml,
                        stats,
                        gauge: {
                            over,
                            pre,
                            add,
                            addOff: -pre,
                            segs: null,
                            pctTxt: pct == null ? null : `${nvNum(pct, 0)}%`,
                            numTxt: nvFmt("kcal", t),
                            glab:
                                g > 0
                                    ? tpl(S.ofGoal, { goal: nvFmt("kcal", g) })
                                    : nvUnitLabel("kcal"),
                            aria,
                            btnLabel: tpl(T.macros.byMealTitle, {
                                label: nvLabel("calories"),
                            }),
                        },
                    },
                };
                nvMount(root, V);
            }

            // Pull the meal progress out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (
                    payload.totals ||
                    payload.logged_meal ||
                    "has_goals" in payload
                )
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "meal-logged-widget",
                // No loading state: the widget may legitimately end up empty
                // (no goals), so we start blank and only fill in on data.
                loading: "",
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
