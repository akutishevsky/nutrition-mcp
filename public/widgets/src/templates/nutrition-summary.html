<!doctype html>
<!--
  Nutrition summary dashboard widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  One card (`.panel`): a header line naming the range and how much of it was
  logged, the compact calories-per-day chart, then the shared macro strip
  averaged over the logged days.

  Data arrives as the `structuredContent` of the get_nutrition_summary tool
  result; the shared bridge (shared/bridge.js) reads it across host conventions
  and calls render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition Summary</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/ring.css@*/

            /*@include shared/macros.css@*/

            /*@include shared/trend.css@*/
        </style>
    </head>
    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                start_date: "2026-07-05",
                end_date: "2026-07-07",
                logged_days: 3,
                drink_unit: "us",
                locale: "en",
                days_in_range: 3,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: 20,
                    // EFSA's 400 mg/day, the limit almost everyone who sets one
                    // sets. A ceiling, like sugar and alcohol.
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                averages: {
                    calories: 2035,
                    protein_g: 148,
                    carbs_g: 205,
                    fat_g: 74,
                    fiber_g: 26.4,
                    sugar_g: 58.2,
                    // Alcohol tracking ON in this sample. null here (the
                    // opt-in's "off") drops the limit cell entirely.
                    alcohol_g: 12.5,
                    // Averaged over the days that recorded caffeine, never over
                    // all of them. null here (nothing ever recorded) drops the
                    // cell rather than claiming a 0 mg day.
                    caffeine_mg: 187,
                    water_ml: 2100,
                },
                days: [
                    {
                        date: "2026-07-05",
                        meal_count: 4,
                        calories: 2180,
                        protein_g: 155,
                        carbs_g: 230,
                        fat_g: 72,
                        fiber_g: 31.2,
                        sugar_g: 64.5,
                        alcohol_g: 27.7,
                        caffeine_mg: 245,
                        water_ml: 2400,
                    },
                    {
                        date: "2026-07-06",
                        meal_count: 3,
                        calories: 1890,
                        protein_g: 138,
                        carbs_g: 188,
                        fat_g: 68,
                        fiber_g: 22.8,
                        sugar_g: 51.4,
                        alcohol_g: 0,
                        // Nothing caffeinated logged this day — null, not 0,
                        // so it drops out of the average instead of dragging
                        // it down.
                        caffeine_mg: null,
                        water_ml: 1800,
                    },
                    {
                        date: "2026-07-07",
                        meal_count: 4,
                        calories: 2035,
                        protein_g: 151,
                        carbs_g: 197,
                        fat_g: 82,
                        fiber_g: 25.1,
                        sugar_g: 58.8,
                        alcohol_g: 9.8,
                        caffeine_mg: 128,
                        water_ml: 2100,
                    },
                ],
                meals: [
                    {
                        description: "Grilled chicken & rice bowl",
                        meal_type: "lunch",
                        date: "2026-07-05",
                        calories: 650,
                        protein_g: 52,
                        carbs_g: 78,
                        fat_g: 16,
                        fiber_g: 6.2,
                        sugar_g: 9.4,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Salmon with quinoa & veg",
                        meal_type: "dinner",
                        date: "2026-07-05",
                        calories: 640,
                        protein_g: 55,
                        carbs_g: 74,
                        fat_g: 30,
                        fiber_g: 7.1,
                        sugar_g: 6.8,
                        alcohol_g: 13.9,
                        caffeine_mg: null,
                    },
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: "2026-07-06",
                        calories: 430,
                        protein_g: 19,
                        carbs_g: 63,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 24.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Steak burrito",
                        meal_type: "dinner",
                        date: "2026-07-06",
                        calories: 720,
                        protein_g: 48,
                        carbs_g: 66,
                        fat_g: 30,
                        fiber_g: 8.2,
                        sugar_g: 7.9,
                        alcohol_g: 13.8,
                        caffeine_mg: null,
                    },
                    {
                        description: "Protein shake",
                        meal_type: "snack",
                        date: "2026-07-06",
                        calories: 210,
                        protein_g: 40,
                        carbs_g: 8,
                        fat_g: 3,
                        fiber_g: 0.8,
                        sugar_g: 4.2,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Egg & avocado toast",
                        meal_type: "breakfast",
                        date: "2026-07-07",
                        calories: 480,
                        protein_g: 24,
                        carbs_g: 42,
                        fat_g: 26,
                        fiber_g: 5.4,
                        sugar_g: 3.1,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Turkey & hummus wrap",
                        meal_type: "lunch",
                        date: "2026-07-07",
                        calories: 560,
                        protein_g: 44,
                        carbs_g: 58,
                        fat_g: 18,
                        fiber_g: 6.9,
                        sugar_g: 11.2,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: 9.8,
                        caffeine_mg: null,
                    },
                    {
                        // The two rows the caffeine total comes from. Every
                        // other row above carries null — a meal logged before
                        // caffeine existed, or one nobody bothered to fill in —
                        // which is exactly the partial-nutrient case the panel
                        // must not average as zero.
                        description: "Flat white",
                        meal_type: "snack",
                        date: "2026-07-05",
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: 0,
                        caffeine_mg: 245,
                    },
                    {
                        description: "Cold brew",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 15,
                        protein_g: 0,
                        carbs_g: 2,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,
                        caffeine_mg: 128,
                    },
                ],
            };

            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            /*@include shared/macros.js@*/

            // ---- Header dates -------------------------------------------------
            // The header line is one nowrap run, so the range is written the way
            // a person would say it ("5–7 Jul") rather than as two ISO strings.
            // Parsed by hand rather than through Date: these are calendar dates
            // in the USER's timezone, and new Date("2026-07-05") is UTC midnight,
            // which formats as the 4th for anyone west of Greenwich.
            // Month abbreviations come from T.nutritionSummary.months (set once
            // the widget's locale is known), not a hardcoded MONTHS array.
            function ymd(s) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? ""));
                if (!m) return null;
                const mon = Number(m[2]);
                if (mon < 1 || mon > 12) return null;
                return { y: Number(m[1]), m: mon, d: Number(m[3]) };
            }
            // Every supported locale except Japanese happens to share
            // English's day-before-month order ("5 Jul"/"5 juillet"/"5
            // Juli"...), so only `ja` gets a distinct branch here rather
            // than a per-locale date-order field in WidgetStrings — Y-M-D
            // with 年/月/日 particles, no separating spaces.
            function dayLabel(s, withYear) {
                const p = ymd(s);
                if (!p) return String(s ?? "");
                const month = T.nutritionSummary.months[p.m - 1];
                return WIDGET_LOCALE === "ja"
                    ? `${withYear ? `${p.y}年` : ""}${month}${p.d}日`
                    : `${p.d} ${month}${withYear ? ` ${p.y}` : ""}`;
            }
            // "5–7 Jul" within a month, "28 Jun – 4 Jul" across two. The year
            // shows when the range crosses one (where it is the whole point)
            // and when the range is not in the current year — a summary of last
            // autumn labelled "28 Jun – 4 Jul" names no year at all, and this
            // tool is routinely asked for a past window.
            function rangeLabel(start, end) {
                const a = ymd(start),
                    b = ymd(end);
                if (!a || !b) return `${start} → ${end}`;
                // The payload dates are already resolved in the user's
                // timezone, and so is the local year here; a date-line
                // disagreement at worst prints a year that did not need
                // printing.
                const thisYear = new Date().getFullYear();
                if (a.y !== b.y)
                    return `${dayLabel(start, true)} – ${dayLabel(end, true)}`;
                const yr = b.y === thisYear ? "" : ` ${b.y}`;
                if (a.m === b.m) {
                    if (a.d === b.d) return `${dayLabel(end, false)}${yr}`;
                    // "7月5日〜7日": every other branch above and below just
                    // joins two dayLabel() calls, which is already
                    // locale-correct — this is the one case where the month
                    // is factored out once, and English's "day–day month"
                    // order is backwards for Japanese's "month day〜day".
                    if (WIDGET_LOCALE === "ja") {
                        const yearPrefix = b.y === thisYear ? "" : `${b.y}年`;
                        return `${yearPrefix}${T.nutritionSummary.months[b.m - 1]}${a.d}日〜${b.d}日`;
                    }
                    return `${a.d}–${b.d} ${T.nutritionSummary.months[b.m - 1]}${yr}`;
                }
                return `${dayLabel(start, false)} – ${dayLabel(end, false)}${yr}`;
            }

            // Calories-per-day trend: SVG area + line that scales to any range
            // (3 days to a year), drawn at the compact 480×54 scale that sits
            // inside the panel rather than on a card of its own. Uniform scaling
            // — no preserveAspectRatio distortion — so it keeps its aspect ratio
            // at any container width. No <text>: every label is HTML above it.
            function trendChart(days, goal) {
                const W = 480,
                    H = 54,
                    padL = 5,
                    padR = 5,
                    padT = 5,
                    padB = 4;
                const n = days.length;
                const vals = days.map((d) => d.calories || 0);
                const maxV = Math.max(...vals, goal || 0, 1) * 1.15;
                const plotW = W - padL - padR;
                const plotH = H - padT - padB;
                const base = padT + plotH;
                const x = (i) =>
                    n === 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1);
                const y = (v) => padT + plotH - (v / maxV) * plotH;
                const pts = vals.map((v, i) => [x(i), y(v)]);

                const line = pts
                    .map(
                        (p, i) =>
                            `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`,
                    )
                    .join(" ");
                const area =
                    `M${pts[0][0].toFixed(1)} ${base} ` +
                    pts
                        .map((p) => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`)
                        .join(" ") +
                    ` L${pts[n - 1][0].toFixed(1)} ${base} Z`;

                const goalLine =
                    goal && goal > 0
                        ? `<line class="goalline" x1="${padL}" y1="${y(goal).toFixed(1)}" x2="${W - padR}" y2="${y(goal).toFixed(1)}"/>`
                        : "";
                // Dots only while they still read as individual days: at 10
                // points they are ~52 units apart, at a fortnight they crowd the
                // line into a beaded string and at a month they are noise.
                const dots =
                    n <= 10
                        ? pts
                              .map(
                                  (p) =>
                                      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--calories)"/>`,
                              )
                              .join("")
                        : "";
                const avg = Math.round(vals.reduce((a, b) => a + b, 0) / n);

                return `
          <div class="chart">
            <div class="chead">
              <span class="ctitle">${esc(T.nutritionSummary.caloriesPerDay)}</span>
              <span class="cmeta">${esc(T.nutritionSummary.avg)} ${fmt(avg, 0)}${goal && goal > 0 ? ` · ${esc(T.nutritionSummary.goal)} ${fmt(goal, 0)}` : ""}</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Calories per day over the selected range">
              <line class="axis" x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}"/>
              ${goalLine}
              <path d="${area}" fill="var(--calories)" opacity="0.16"/>
              <path d="${line}" fill="none" stroke="var(--calories)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
              ${dots}
            </svg>
          </div>`;
            }

            // "3 days logged", or "15 of 30 days logged" when the payload also
            // says how wide the window was. `days_in_range` is OPTIONAL — a host
            // replaying a tool result from before it existed has no such field,
            // and older payloads must render exactly as they always did, so it
            // is only used when it is a real number larger than logged_days.
            function loggedDaysCaption(data) {
                const logged = data.logged_days;
                const span = Number(data.days_in_range);
                return Number.isFinite(span) && span > logged
                    ? tpl(T.nutritionSummary.daysOfLogged, {
                          logged,
                          span,
                      })
                    : plural(T.nutritionSummary.daysLogged, logged);
            }

            function render(data) {
                const root = document.getElementById("root");
                // structuredContent.locale (the user's saved get_language /
                // set_language preference, resolved server-side) wins over
                // the host's ambient hostContext.locale — see pickLocale in
                // shared/i18n.js.
                setLocale(
                    pickLocale(
                        data && data.locale,
                        __widgetApi && __widgetApi.hostContext
                            ? __widgetApi.hostContext.locale
                            : null,
                    ),
                );
                if (
                    !data ||
                    !Array.isArray(data.days) ||
                    data.days.length === 0
                ) {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">🍽️</div>
              <div>${esc(T.nutritionSummary.empty)}</div>
            </div>`;
                    return;
                }
                const days = data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const multi = days.length > 1;
                // Name the denominator: this average divides by the days that
                // actually have a log, while the trends widget's rings divide
                // by every calendar day in the window. Same macros, different
                // number — labelling both is the fix for issue #70.
                const calLabel = multi
                    ? T.nutritionSummary.dailyAvgLoggedDays
                    : T.nutritionSummary.total;
                const meta = multi
                    ? `${rangeLabel(data.start_date, data.end_date)} · ${loggedDaysCaption(data)}`
                    : dayLabel(days[0].date, false);

                const trend =
                    multi && days.length >= 2
                        ? trendChart(days, data.goals?.calories ?? null)
                        : "";

                // Calorie ring + figure, the three macro bars, the limits row
                // (sugar / alcohol / caffeine / fiber, whichever have data) and
                // the water line. Tapping a tile reveals the meals behind it.
                const panel = macroPanel(
                    data.averages,
                    data.goals,
                    undefined,
                    data.meals,
                    {
                        // "us" | "uk" for a user who tracks alcohol, null for
                        // one who does not — and null is also the case in which
                        // no alcohol figure reaches the strip at all.
                        drinkUnit: data.drink_unit,
                        calLabel,
                        // Only the chart sits between the header line and the
                        // strip; a single-day summary has nothing there and
                        // needs no hairline above it.
                        divided: !!trend,
                    },
                );

                root.innerHTML = `
          <div class="panel">
            <div class="phead">
              <div class="ptitle">${esc(T.nutritionSummary.title)}</div>
              <div class="pmeta">${esc(meta)}</div>
            </div>
            ${trend}
            ${panel}
          </div>`;
            }

            // Pull the summary out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (Array.isArray(payload.days) || payload.averages)
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // Stashed by onReady so render() can fall back to the host's
            // ambient locale (hostContext.locale) when structuredContent
            // carries none. Not used for the initial "Loading…" text below:
            // that is set synchronously before the ui/initialize handshake
            // (and so before hostContext is known at all) and is shown only
            // briefly — see shared/i18n.js's doc comment for the full
            // locale-resolution order.
            let __widgetApi = null;

            initWidget({
                name: "nutrition-summary-widget",
                loading:
                    '<div class="empty"><div class="big">🍽️</div><div>Loading your nutrition summary…</div></div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
