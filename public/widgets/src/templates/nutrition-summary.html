<!doctype html>
<!--
  Nutrition summary dashboard widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  One Dawn card: a header naming the range and how much of it was logged, the
  calorie hero, the trend chart, then the rails of nutrient chips. Tapping a chip
  does two things at once — it opens the meals behind that nutrient, and it
  re-strokes the chart in that nutrient's colour against that nutrient's goal
  line. The payload already carries every macro for every day, so switching
  series costs no second round trip.

  Data arrives as the `structuredContent` of the get_nutrition_summary tool
  result; the shared bridge (shared/bridge.js) reads it across host conventions
  and calls render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition Summary</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /*@include shared/chip.css@*/

            /*@include shared/chart.css@*/

            /* No page-scoped rules: everything on this card is a shared
               primitive. The sparkline's once-only entrance
               (`.fspark .cwrap.still`) lives in chip.css beside the motion it
               stops, now that trends paints the same chart. */
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /* shortDate(), used by shared/macros.js for a drawer row's day,
               plus the header's date helpers (ymd, rangeLabel, and
               daysLoggedCaption behind loggedDaysCaption below) and the UTC
               day arithmetic (utcDay, DAY_MS) the calendar x axis is stepped
               with. */
            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/svg.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                start_date: "2026-07-05",
                end_date: "2026-07-07",
                logged_days: 3,
                drink_unit: "us",
                locale: "en",
                days_in_range: 3,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    fiber_g: 30,
                    sugar_g: 45,
                    alcohol_g: 20,
                    // EFSA's 400 mg/day, the limit almost everyone who sets one
                    // sets. A ceiling, like sugar and alcohol.
                    caffeine_mg: 400,
                    water_ml: 2500,
                },
                averages: {
                    calories: 2035,
                    protein_g: 148,
                    carbs_g: 205,
                    fat_g: 74,
                    fiber_g: 26.4,
                    sugar_g: 58.2,
                    // Alcohol tracking ON in this sample. null here (the
                    // opt-in's "off") drops the alcohol chip entirely.
                    alcohol_g: 12.5,
                    // Averaged over the days that recorded caffeine, never over
                    // all of them. null here (nothing ever recorded) drops the
                    // chip rather than claiming a 0 mg day.
                    caffeine_mg: 187,
                    water_ml: 2100,
                },
                days: [
                    {
                        date: "2026-07-05",
                        meal_count: 4,
                        calories: 2180,
                        protein_g: 155,
                        carbs_g: 230,
                        fat_g: 72,
                        fiber_g: 31.2,
                        sugar_g: 64.5,
                        alcohol_g: 27.7,
                        caffeine_mg: 245,
                        water_ml: 2400,
                    },
                    {
                        date: "2026-07-06",
                        meal_count: 3,
                        calories: 1890,
                        protein_g: 138,
                        carbs_g: 188,
                        fat_g: 68,
                        fiber_g: 22.8,
                        sugar_g: 51.4,
                        alcohol_g: 0,
                        // Nothing caffeinated logged this day — null, not 0,
                        // so it drops out of the average instead of dragging
                        // it down, and the chart breaks its line here rather
                        // than drawing a 0 mg day nobody recorded.
                        caffeine_mg: null,
                        water_ml: 1800,
                    },
                    {
                        date: "2026-07-07",
                        meal_count: 4,
                        calories: 2035,
                        protein_g: 151,
                        carbs_g: 197,
                        fat_g: 82,
                        fiber_g: 25.1,
                        sugar_g: 58.8,
                        alcohol_g: 9.8,
                        caffeine_mg: 128,
                        water_ml: 2100,
                    },
                ],
                meals: [
                    {
                        description: "Grilled chicken & rice bowl",
                        meal_type: "lunch",
                        date: "2026-07-05",
                        calories: 650,
                        protein_g: 52,
                        carbs_g: 78,
                        fat_g: 16,
                        fiber_g: 6.2,
                        sugar_g: 9.4,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Salmon with quinoa & veg",
                        meal_type: "dinner",
                        date: "2026-07-05",
                        calories: 640,
                        protein_g: 55,
                        carbs_g: 74,
                        fat_g: 30,
                        fiber_g: 7.1,
                        sugar_g: 6.8,
                        alcohol_g: 13.9,
                        caffeine_mg: null,
                    },
                    {
                        description: "Overnight oats with berries",
                        meal_type: "breakfast",
                        date: "2026-07-06",
                        calories: 430,
                        protein_g: 19,
                        carbs_g: 63,
                        fat_g: 12,
                        fiber_g: 9.4,
                        sugar_g: 24.6,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Steak burrito",
                        meal_type: "dinner",
                        date: "2026-07-06",
                        calories: 720,
                        protein_g: 48,
                        carbs_g: 66,
                        fat_g: 30,
                        fiber_g: 8.2,
                        sugar_g: 7.9,
                        alcohol_g: 13.8,
                        caffeine_mg: null,
                    },
                    {
                        description: "Protein shake",
                        meal_type: "snack",
                        date: "2026-07-06",
                        calories: 210,
                        protein_g: 40,
                        carbs_g: 8,
                        fat_g: 3,
                        fiber_g: 0.8,
                        sugar_g: 4.2,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Egg & avocado toast",
                        meal_type: "breakfast",
                        date: "2026-07-07",
                        calories: 480,
                        protein_g: 24,
                        carbs_g: 42,
                        fat_g: 26,
                        fiber_g: 5.4,
                        sugar_g: 3.1,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Turkey & hummus wrap",
                        meal_type: "lunch",
                        date: "2026-07-07",
                        calories: 560,
                        protein_g: 44,
                        carbs_g: 58,
                        fat_g: 18,
                        fiber_g: 6.9,
                        sugar_g: 11.2,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: 9.8,
                        caffeine_mg: null,
                    },
                    {
                        // The two rows the caffeine total comes from. Every
                        // other row above carries null — a meal logged before
                        // caffeine existed, or one nobody bothered to fill in —
                        // which is exactly the partial-nutrient case the strip
                        // must not average as zero.
                        description: "Flat white",
                        meal_type: "snack",
                        date: "2026-07-05",
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: 0,
                        caffeine_mg: 245,
                    },
                    {
                        description: "Cold brew",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 15,
                        protein_g: 0,
                        carbs_g: 2,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,
                        caffeine_mg: 128,
                    },
                ],
            };

            // WIDGET_LOCALE, not the host browser's. `toLocaleString()` with no
            // argument keys off navigator.language, so a German user whose
            // browser is English read "58.2" and "2,035" inside German copy —
            // and beside macroNum's own figures, which now group and separate
            // through the same locale (macroDecimal, shared/macros.js). The
            // locale is only known after setLocale() runs inside render(), so
            // it is read per call rather than captured.
            //
            // Coerced through Number first: a payload replayed through a host
            // that stringified its numbers hands over "58.2", and "58.2"
            // .toFixed is a TypeError that took the whole card down.
            function fmt(n, decimals) {
                const x = Number(n);
                if (n == null || !Number.isFinite(x)) return "0";
                const r = decimals ? x.toFixed(decimals) : Math.round(x);
                try {
                    return Number(r).toLocaleString(WIDGET_LOCALE || "en");
                } catch (_) {
                    return Number(r).toLocaleString();
                }
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // ---- The trend chart ----------------------------------------------
            // Lives in shared/spark.js (included after macros.js, below):
            // seriesValue, chartableKeys, the chart markup and the paint state.
            // render() resets it per card (sparkReset) and paints it into the
            // focus panel (sparkPaint); a tile's onSeries repaints it.

            // "3 days logged", or "15 of 30 days logged" when the payload also
            // says how wide the window was. The wording and the span rules
            // live in daysLoggedCaption (shared/date.js); this card only reads
            // its payload. `days_in_range` is OPTIONAL — a host replaying a
            // tool result from before it existed has no such field, and older
            // payloads must render exactly as they always did, which is why
            // it is handed over raw for daysLoggedCaption to vet.
            //
            // `logged_days` falls back to the rows actually held: without it
            // the caption printed "DAYS LOGGED" with no number in front.
            // Kept here, same name and signature, because
            // public/widgets/summary-caption.test.ts extracts it by name.
            function loggedDaysCaption(data) {
                const raw = data.logged_days;
                const logged =
                    raw != null && raw !== "" && Number.isFinite(Number(raw))
                        ? Number(raw)
                        : Array.isArray(data.days)
                          ? data.days.length
                          : 0;
                return daysLoggedCaption(logged, data.days_in_range);
            }

            function render(data) {
                const root = document.getElementById("root");
                // structuredContent.locale wins over the host's ambient
                // hostContext.locale — see pickLocale in shared/i18n.js, which
                // setLocaleFrom is the wrapper for. The four templates ported
                // out of this one all call the helper; this one inlined the
                // same expression and was the copy a change to the resolution
                // order would have missed.
                setLocaleFrom(data, __widgetApi);
                // Litres or fluid ounces, from the profile (macros.js).
                setWaterUnit(data && data.water_unit);
                // WHAT WAS OPEN, and where focus was, read before the card is
                // thrown away — a host may re-deliver the tool result while a
                // drawer is open. Put back by macroRestore at the end of
                // render(); both live in shared/macros.js.
                const was = macroSnapshot(root);

                const hasRange = !!(
                    ymd(data && data.start_date) && ymd(data && data.end_date)
                );
                if (
                    !data ||
                    !Array.isArray(data.days) ||
                    data.days.length === 0
                ) {
                    // A range with nothing in it still names the range: the
                    // empty message alone could not say WHICH week was empty,
                    // and a card with no header was the only one of this
                    // widget's states that did not look like this widget.
                    const empty = `
              <div class="empty">
                <div class="big">🍽️</div>
                <div>${esc(T.nutritionSummary.empty)}</div>
              </div>`;
                    root.innerHTML = hasRange
                        ? `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.nutritionSummary.title)}</h1>
              <span class="cmeta">${esc(rangeLabel(data.start_date, data.end_date))}</span>
            </header>
            ${empty}
            <div class="foot" data-widget-foot></div>
          </div>`
                        : empty;
                    return;
                }
                const days = data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const multi = days.length > 1;
                // Name the denominator: this average divides by the days that
                // actually have a log, while the trends widget's figures divide
                // by every calendar day in the window. Same macros, different
                // number — labelling both is the fix for issue #70. Keyed on
                // LOGGED days, not on the range: a week with one logged day
                // averages over that one day, whose figure is also, exactly,
                // the week's total.
                const calLabel = multi
                    ? T.nutritionSummary.dailyAvgLoggedDays
                    : T.nutritionSummary.total;
                // The HEADER, though, is keyed on the RANGE. A seven-day window
                // with one logged day printed "7 JUL" alone, which reads as a
                // single-day summary and hides the six empty days — the range
                // plus "1 of 7 days logged" is what was actually asked for.
                // Without a usable start/end (an old payload) the logged count
                // decides, as it always did. A single day goes through
                // rangeLabel(d, d) so a past year still shows.
                const ranged = hasRange
                    ? data.start_date !== data.end_date
                    : multi;
                const single = hasRange ? data.end_date : days[0].date;
                const meta = ranged
                    ? `${rangeLabel(hasRange ? data.start_date : days[0].date, hasRange ? data.end_date : days[days.length - 1].date)} · ${loggedDaysCaption(data)}`
                    : rangeLabel(single, single);

                // Two logged days is the least that draws a line; one is a
                // card with no chart at all rather than a chart with nothing
                // in it — however wide the range around it.
                const charted = days.length >= 2;
                // A new card: a new axis, calories, and the chart's entrance
                // owed again (see `.fspark .cwrap.still` in chip.css).
                sparkReset(
                    charted
                        ? calendarSlots(days, data.start_date, data.end_date)
                        : [],
                    data.goals,
                );

                // Calorie hero, the macro rail, the limits rail and the drawer.
                // Tapping a chip opens the meals behind it and hands the chart
                // that nutrient; closing it gives the chart back to calories.
                const strip = macroPanel(
                    data.averages,
                    data.goals,
                    undefined,
                    data.meals,
                    {
                        // THREE VISUAL LEVELS instead of one flat rail of
                        // eight identical tiles: the energy split (protein /
                        // carbs / fat) three-up under the hero, water as a
                        // full-width bar of its own because it is not food and
                        // no meal carries it, and the four ceilings last,
                        // behind a hairline and a size down. See "the tiers"
                        // in shared/chip.css for what each level is made of.
                        // Opt-in while the other widgets are still on the flat
                        // rail — this one is the pilot.
                        tiers: true,
                        // "us" | "uk" for a user who tracks alcohol, null for
                        // one who does not — and null is also the case in which
                        // no alcohol figure reaches the strip at all.
                        drinkUnit: data.drink_unit,
                        calLabel,
                        chartKeys: charted ? chartableKeys(days) : [],
                        // The panel is found inside THIS card's root, never
                        // document-wide — see sparkPaint in shared/spark.js.
                        // No label: the panel is a button, whose own name
                        // already carries every figure the line draws.
                        onSeries: (key, opened) =>
                            sparkPaint(
                                root.querySelector(".focus"),
                                opened ? key : "calories",
                                opened,
                            ),
                    },
                );

                root.innerHTML = `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.nutritionSummary.title)}</h1>
              <span class="cmeta">${esc(meta)}</span>
            </header>
            ${strip}
          </div>`;

                // The chart goes INSIDE the focus panel, under the figure row:
                // the panel is the figure and its own chart as one object, so
                // the number and the series it came from can never disagree
                // (see focusInner in shared/macros.js). macroPanel emits the
                // panel as part of one strip, so the chart is painted into its
                // `.fspark` slot afterwards rather than spliced into another
                // module's markup as a string.
                if (charted && root.querySelector(".focus")) {
                    sparkPaint(root.querySelector(".focus"), "calories", false);
                }
                // AFTER the first paint, not before it: re-opening a tile goes
                // through macroToggle, whose onSeries repaints the panel for
                // that metric — restored first, the calorie paint above would
                // then overwrite it. Focus is only ever restored, never taken
                // (see macroRestore in shared/macros.js).
                macroRestore(root, was);
            }

            // Pull the summary out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (Array.isArray(payload.days) || payload.averages)
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // Stashed by onReady so render() can fall back to the host's
            // ambient locale (hostContext.locale) when structuredContent
            // carries none. Not used for the initial "Loading…" text below:
            // that is set synchronously before the ui/initialize handshake
            // (and so before hostContext is known at all) and is shown only
            // briefly — see shared/i18n.js's doc comment for the full
            // locale-resolution order.
            let __widgetApi = null;

            /*@include shared/macros.js@*/

            /* The sparkline in the focus panel: seriesValue, chartableKeys,
               sparkReset and sparkPaint. After macros.js, whose MACROS,
               focusApply and macroCtx it calls — and included from here, never
               from inside another partial. */
            /*@include shared/spark.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "nutrition-summary-widget",
                // From the dictionary rather than a literal, so the string has
                // one home. T is still English here — this paints before the
                // handshake, when no locale is known yet — which is the same
                // text the literal was.
                loading: `<div class="empty"><div class="big">🍽️</div><div>${esc(T.nutritionSummary.loading)}</div></div>`,
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
