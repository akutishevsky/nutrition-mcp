<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition Summary</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            /*@include shared/facts.css@*/
            .f-section-title {
                font-size: 15px;
                font-weight: 650;
                margin: 14px 0 4px;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            /*@include shared/facts.js@*/
            const SAMPLE = {
                start_date: "2026-07-30",
                end_date: "2026-08-05",
                logged_days: 6,
                goals: {
                    calories: 2200,
                    protein_g: 160,
                    carbs_g: 220,
                    fat_g: 70,
                    water_ml: 2500,
                },
                averages: {
                    calories: 2035,
                    protein_g: 148,
                    carbs_g: 205,
                    fat_g: 74,
                    water_ml: 2110,
                },
                days: [
                    {
                        date: "2026-07-30",
                        meal_count: 4,
                        calories: 2180,
                        protein_g: 155,
                    },
                    {
                        date: "2026-07-31",
                        meal_count: 3,
                        calories: 1890,
                        protein_g: 138,
                    },
                    {
                        date: "2026-08-01",
                        meal_count: 4,
                        calories: 2035,
                        protein_g: 151,
                    },
                    {
                        date: "2026-08-02",
                        meal_count: 4,
                        calories: 2260,
                        protein_g: 163,
                    },
                    {
                        date: "2026-08-03",
                        meal_count: 3,
                        calories: 1940,
                        protein_g: 142,
                    },
                    {
                        date: "2026-08-05",
                        meal_count: 4,
                        calories: 1905,
                        protein_g: 139,
                    },
                ],
            };
            let DATA = null;
            let API = null;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.error || payload.__error)
                    return {
                        __error:
                            payload.error?.message ||
                            payload.error ||
                            payload.__error,
                    };
                if (payload.averages || Array.isArray(payload.days))
                    return payload;
                if (payload.structuredContent)
                    return coerce(payload.structuredContent);
                return null;
            }
            function observation(data) {
                const avg = data.averages || {};
                const goals = data.goals || {};
                const proteinDelta =
                    goals.protein_g != null
                        ? avg.protein_g - goals.protein_g
                        : null;
                const caloriesDelta =
                    goals.calories != null
                        ? avg.calories - goals.calories
                        : null;
                if (proteinDelta != null && Math.abs(proteinDelta) >= 5)
                    return `Protein averaged ${fmt(Math.abs(proteinDelta), 1)} g ${proteinDelta < 0 ? "below" : "above"} target.`;
                if (caloriesDelta != null && Math.abs(caloriesDelta) >= 75)
                    return `Calories averaged ${fmt(Math.abs(caloriesDelta))} kcal ${caloriesDelta < 0 ? "below" : "above"} target.`;
                return "Logged-day averages were close to the selected targets.";
            }
            function metricRow(name, value, goal, unit) {
                return factsLabelRow({
                    name,
                    ofText:
                        goal != null
                            ? `of ${fmt(goal, unit === "ml" ? 0 : 1)} ${unit}`
                            : "no target set",
                    valueText: `${fmt(value, unit === "kcal" || unit === "ml" ? 0 : 1)} ${unit}`,
                    value,
                    goal,
                });
            }
            function render(data) {
                DATA = data;
                const rangeLabel = humanRange(data.start_date, data.end_date);
                if (data.__error) {
                    document.getElementById("root").innerHTML = factsCardState(
                        "Nutrition summary",
                        rangeLabel,
                        "error",
                        "Could not load this summary",
                        String(data.__error) ||
                            "Something went wrong reading your logged meals. Try again in chat.",
                    );
                    return;
                }
                const days = Array.isArray(data.days)
                    ? data.days
                          .slice()
                          .sort((a, b) => a.date.localeCompare(b.date))
                    : [];
                if (!days.length) {
                    document.getElementById("root").innerHTML =
                        `<article class="card">${factsBand("Nutrition summary", rangeLabel)}${factsState("empty", "No nutrition data in this range", "Log a meal or choose another date range.")}<div class="f-foot"><span>Every number traces to its source</span><span>Your logged meals</span></div></article>`;
                    return;
                }
                const avg = data.averages || {};
                const goals = data.goals || {};
                const rangeDays = Math.max(
                    1,
                    Math.round(
                        (new Date(`${data.end_date}T12:00:00`) -
                            new Date(`${data.start_date}T12:00:00`)) /
                            86400000,
                    ) + 1,
                );
                const logged =
                    data.logged_days ??
                    days.filter((day) => Number(day.meal_count || 0) > 0)
                        .length;
                const partial = logged < rangeDays;
                const points = days.map((day) => ({
                    value: day.calories || 0,
                }));
                const dayRows = days
                    .map((day) =>
                        factsCompactRow({
                            name: humanDate(day.date),
                            meta: `${Number(day.meal_count || 0)} meal${Number(day.meal_count || 0) === 1 ? "" : "s"}`,
                            valueText: `${fmt(day.calories)} kcal`,
                        }),
                    )
                    .join("");
                const insight = partial
                    ? factsBanner(
                          "warn",
                          `<b>Partial — ${logged} of ${rangeDays} days logged.</b> ${esc(observation(data))}`,
                      )
                    : `<div class="f-note">${esc(observation(data))}</div>`;
                const recorded = data.recorded_days;
                const recordedNote =
                    recorded &&
                    (recorded.fiber_g != null || recorded.sugar_g != null)
                        ? `<div class="f-note">Fiber recorded on ${fmt(recorded.fiber_g)} of ${fmt(logged)} logged days · Sugar recorded on ${fmt(recorded.sugar_g)} of ${fmt(logged)} logged days. Averages for those nutrients cover recorded days only.</div>`
                        : "";
                document.getElementById("root").innerHTML =
                    `<article class="card">
        ${factsBand("Nutrition summary", rangeLabel)}
        <div class="f-body">
        ${factsHero(`${fmt(avg.calories)} <span class="f-hero-unit">kcal</span>`, "average per logged day", `${logged} of ${rangeDays}`, "days logged")}
        <div class="f-src">Source · <b>Your logged meals</b></div>
        <div class="f-rule-heavy"></div>
        ${metricRow("Protein", avg.protein_g || 0, goals.protein_g, "g")}
        ${metricRow("Carbs", avg.carbs_g || 0, goals.carbs_g, "g")}
        ${metricRow("Fat", avg.fat_g || 0, goals.fat_g, "g")}
        ${avg.water_ml != null || goals.water_ml != null ? metricRow("Water", avg.water_ml || 0, goals.water_ml, "ml") : ""}
        ${insight}
        <button class="f-more-row inline-only" id="details">View daily breakdown</button>
        <div class="fullscreen-only">
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Daily calories</h2>
        ${sparkline(points, { goal: goals.calories, label: "Calories by logged day" })}
        <div class="row-between caption"><span>${esc(humanDate(days[0].date))}</span><span>${esc(humanDate(days[days.length - 1].date))}</span></div>
        <div>${dayRows}</div>
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Average versus target</h2>
        ${metricRow("Calories", avg.calories || 0, goals.calories, "kcal")}
        ${metricRow("Protein", avg.protein_g || 0, goals.protein_g, "g")}
        ${metricRow("Carbs", avg.carbs_g || 0, goals.carbs_g, "g")}
        ${metricRow("Fat", avg.fat_g || 0, goals.fat_g, "g")}
        ${avg.fiber_g != null || goals.fiber_g != null ? metricRow("Fiber", avg.fiber_g || 0, goals.fiber_g, "g") : ""}
        ${avg.sugar_g != null || goals.sugar_g != null ? metricRow("Sugar", avg.sugar_g || 0, goals.sugar_g, "g") : ""}
        ${avg.water_ml != null || goals.water_ml != null ? metricRow("Water", avg.water_ml || 0, goals.water_ml, "ml") : ""}
        ${recordedNote}
        <div class="actions"><button class="btn" id="close">Return to chat</button></div>
        </div>
        </div>
        <div class="f-foot"><span>Every number traces to its source</span><span>Logged meals · USDA FoodData Central · Open Food Facts</span></div>
    </article>`;
                document
                    .getElementById("details")
                    ?.addEventListener("click", async () => {
                        const result = await API?.requestDisplayMode(
                            "fullscreen",
                        ).catch(() => null);
                        if (!result || result.unsupported)
                            document.getElementById("details").textContent =
                                "Details unavailable";
                    });
                document
                    .getElementById("close")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("inline"),
                    );
            }
            initWidget({
                name: "nutrition-summary-widget",
                displayModes: ["inline", "fullscreen"],
                loading:
                    '<article class="card"><div class="f-band"><span class="f-band-title">Nutrition summary</span></div><div class="f-state"><strong>Loading summary</strong><span>Reading your logged meals…</span></div></article>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
