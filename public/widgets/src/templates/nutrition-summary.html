<!doctype html>
<!--
  Nutrition summary dashboard widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  One Dawn card: a header naming the range and how much of it was logged, the
  calorie hero, the trend chart, then the rails of nutrient chips. Tapping a chip
  does two things at once — it opens the meals behind that nutrient, and it
  re-strokes the chart in that nutrient's colour against that nutrient's goal
  line. The payload already carries every macro for every day, so switching
  series costs no second round trip.

  THE CARD ITSELF is composed in shared/summary-card.js, not here: the public
  landing page renders the same card from the same payload at build time, with
  no DOM. This template owns what needs one — the locale, the water unit, the
  chart paint and the focus restore.

  Data arrives as the `structuredContent` of the get_nutrition_summary tool
  result; the shared bridge (shared/bridge.js) reads it across host conventions
  and calls render(). Standalone preview uses the SAMPLE below.
-->

               primitive. The sparkline's once-only entrance
               (`.fspark .cwrap.still`) lives in chip.css beside the motion it
               stops, now that trends paints the same chart. */
        </style>
    </head>

            /*@i18n@*/

                        caffeine_mg: null,
                        water_ml: 1800,
                    },
                    {

                        meal_count: 4,
                        calories: 2035,
                        protein_g: 151,
                        carbs_g: 197,

                    },
                    {

                    },
                    {

                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: 9.8,
                        caffeine_mg: null,
                    },
                    {
                        // The two rows the caffeine total comes from. Every
                        // other row above carries null — a meal logged before
                        // caffeine existed, or one nobody bothered to fill in —
                        // which is exactly the partial-nutrient case the strip
                        // must not average as zero.
                        description: "Flat white",
                        meal_type: "snack",
                        date: "2026-07-05",
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: 0,

                    },
                    {

                        calories: 15,
                        protein_g: 0,
                        carbs_g: 2,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,

                    },
                ],
            };

            /* fmt() and esc(), the two helpers shared/macros.js requires in
               scope. After shared/i18n.js because fmt() reads WIDGET_LOCALE —
               see that partial for why a figure must not go through a bare
               toLocaleString(). */
            /*@include shared/fmt.js@*/
            // ---- The card ------------------------------------------------
            // Its whole composition — the header, the empty-state branch, the
            // caption and the tiered strip — lives in shared/summary-card.js
            // (summaryCard), because the public landing page renders the same
            // card from the same payload at build time. This template owns
            // only what needs a DOM: the locale, the unit, the chart paint and
            // the restore.
            //
            // The chart itself lives in shared/spark.js (included after
            // macros.js, below): seriesValue, chartableKeys, the chart markup
            // and the paint state. summaryCard resets it per card
            // (sparkReset); render() paints it into the focus panel
            // (sparkPaint) and a tile's onSeries repaints it.

            function render(data) {
                const root = document.getElementById("root");
                // structuredContent.locale wins over the host's ambient
                // hostContext.locale — see pickLocale in shared/i18n.js, which
                // setLocaleFrom is the wrapper for. The four templates ported
                // out of this one all call the helper; this one inlined the
                // same expression and was the copy a change to the resolution
                // order would have missed.
                setLocaleFrom(data, __widgetApi);
                // Litres or fluid ounces, from the profile (macros.js).
                setWaterUnit(data && data.water_unit);
                // WHAT WAS OPEN, and where focus was, read before the card is
                // thrown away — a host may re-deliver the tool result while a
                // drawer is open. Put back by macroRestore at the end of
                // render(); both live in shared/macros.js.
                const was = macroSnapshot(root);

                root.innerHTML = summaryCard(data, {
                    // The panel is found inside THIS card's root, never
                    // document-wide — see sparkPaint in shared/spark.js.
                    // No label: the panel is a button, whose own name
                    // already carries every figure the line draws.
                    onSeries: (key, opened) =>
                        sparkPaint(
                            root.querySelector(".focus"),
                            opened ? key : "calories",
                            opened,
                        ),
                });
                // The empty-state card has no strip to restore into, and
                // returning here is what it always did. The same test
                // summaryCard branches on, `!data` included — a host can hand
                // over nothing at all.
                if (!data || !Array.isArray(data.days) || !data.days.length)
                    return;

                // The chart goes INSIDE the focus panel, under the figure row:
                // the panel is the figure and its own chart as one object, so
                // the number and the series it came from can never disagree
                // (see focusInner in shared/macros.js). macroPanel emits the
                // panel as part of one strip, so the chart is painted into its
                // `.fspark` slot afterwards rather than spliced into another
                // module's markup as a string — which is exactly what
                // summaryCard's `inlineChart` does for the caller that has no
                // DOM at all, and why this path does not use it (SPARK.painted
                // must stay honest, so the entrance runs once).
                if (summaryCharted(data) && root.querySelector(".focus")) {
                    sparkPaint(root.querySelector(".focus"), "calories", false);
                }
                // AFTER the first paint, not before it: re-opening a tile goes
                // through macroToggle, whose onSeries repaints the panel for
                // that metric — restored first, the calorie paint above would
                // then overwrite it. Focus is only ever restored, never taken
                // (see macroRestore in shared/macros.js).
                macroRestore(root, was);
            }

            // Pull the summary out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (Array.isArray(payload.days) || payload.averages)
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // Stashed by onReady so render() can fall back to the host's
            // ambient locale (hostContext.locale) when structuredContent
            // carries none. Not used for the initial "Loading…" text below:
            // that is set synchronously before the ui/initialize handshake
            // (and so before hostContext is known at all) and is shown only
            // briefly — see shared/i18n.js's doc comment for the full
            // locale-resolution order.
            let __widgetApi = null;

            /*@include shared/macros.js@*/

            /* The sparkline in the focus panel: seriesValue, chartableKeys,
               sparkReset and sparkPaint. After macros.js, whose MACROS,
               focusApply and macroCtx it calls — and included from here, never
               from inside another partial. */
            /*@include shared/spark.js@*/

            /* The card itself — summaryCard, loggedDaysCaption,
               summaryCharted — after macros.js and spark.js, whose macroPanel,
               sparkReset, chartableKeys and sparkInline it calls. */
            /*@include shared/summary-card.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "nutrition-summary-widget",
                // From the dictionary rather than a literal, so the string has
                // one home. T is still English here — this paints before the
                // handshake, when no locale is known yet — which is the same
                // text the literal was.
                loading: `<div class="empty"><div class="big">🍽️</div><div>${esc(T.nutritionSummary.loading)}</div></div>`,
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
