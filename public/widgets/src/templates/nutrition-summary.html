<!doctype html>
<!--
  Nutrition summary dashboard widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  One Dawn card: a header naming the range and how much of it was logged, the
  calorie hero, the trend chart, then the rails of nutrient chips. Tapping a chip
  does two things at once — it opens the meals behind that nutrient, and it
  re-strokes the chart in that nutrient's colour against that nutrient's goal
  line. The payload already carries every macro for every day, so switching
  series costs no second round trip.

  Data arrives as the `structuredContent` of the get_nutrition_summary tool
  result; the shared bridge (shared/bridge.js) reads it across host conventions
  and calls render(). Standalone preview uses the SAMPLE below.
-->

                    },
                    {

                        carbs_g: 42,

                    },
                    {

                        meal_type: "lunch",
                        date: "2026-07-07",
                        calories: 560,
                        protein_g: 44,
                        carbs_g: 58,

                    },
                    {
                        description: "Greek yogurt & almonds",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 260,
                        protein_g: 22,
                        carbs_g: 14,
                        fat_g: 14,
                        fiber_g: 1.1,
                        sugar_g: 12.6,
                        alcohol_g: 9.8,
                        caffeine_mg: null,
                    },
                    {
                        // The two rows the caffeine total comes from. Every
                        // other row above carries null — a meal logged before
                        // caffeine existed, or one nobody bothered to fill in —
                        // which is exactly the partial-nutrient case the strip
                        // must not average as zero.
                        description: "Flat white",
                        meal_type: "snack",
                        date: "2026-07-05",
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: 0,
                        caffeine_mg: 245,
                    },
                    {
                        description: "Cold brew",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 15,
                        protein_g: 0,
                        carbs_g: 2,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,
                        caffeine_mg: 128,
                    },
                ],
            };

            // WIDGET_LOCALE, not the host browser's. `toLocaleString()` with no
            // argument keys off navigator.language, so a German user whose
            // browser is English read "58.2" and "2,035" inside German copy —
            // and beside macroNum's own figures, which now group and separate
            // through the same locale (macroDecimal, shared/macros.js). The
            // locale is only known after setLocale() runs inside render(), so
            // it is read per call rather than captured.
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                try {
                    return Number(r).toLocaleString(WIDGET_LOCALE || "en");
                } catch (_) {
                    return Number(r).toLocaleString();
                }
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // ---- Header dates -------------------------------------------------
            // The header line is one nowrap run, so the range is written the way
            // a person would say it ("5–7 Jul") rather than as two ISO strings.
            // Parsed by hand rather than through Date: these are calendar dates
            // in the USER's timezone, and new Date("2026-07-05") is UTC midnight,
            // which formats as the 4th for anyone west of Greenwich.
            // Month abbreviations come from T.nutritionSummary.months (set once
            // the widget's locale is known), not a hardcoded MONTHS array.
            function ymd(s) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? ""));
                if (!m) return null;
                const mon = Number(m[2]);
                if (mon < 1 || mon > 12) return null;
                return { y: Number(m[1]), m: mon, d: Number(m[3]) };
            }
            // Every supported locale except Japanese happens to share
            // English's day-before-month order ("5 Jul"/"5 juillet"/"5
            // Juli"...), so only `ja` gets a distinct branch here rather
            // than a per-locale date-order field in WidgetStrings — Y-M-D
            // with 年/月/日 particles, no separating spaces.
            function dayLabel(s, withYear) {
                const p = ymd(s);
                if (!p) return String(s ?? "");
                const month = T.nutritionSummary.months[p.m - 1];
                return WIDGET_LOCALE === "ja"
                    ? `${withYear ? `${p.y}年` : ""}${month}${p.d}日`
                    : `${p.d} ${month}${withYear ? ` ${p.y}` : ""}`;
            }
            // "5–7 Jul" within a month, "28 Jun – 4 Jul" across two. The year
            // shows when the range crosses one (where it is the whole point)
            // and when the range is not in the current year — a summary of last
            // autumn labelled "28 Jun – 4 Jul" names no year at all, and this
            // tool is routinely asked for a past window.
            function rangeLabel(start, end) {
                const a = ymd(start),
                    b = ymd(end);
                if (!a || !b) return `${start} → ${end}`;
                // The payload dates are already resolved in the user's
                // timezone, and so is the local year here; a date-line
                // disagreement at worst prints a year that did not need
                // printing.
                const thisYear = new Date().getFullYear();
                if (a.y !== b.y)
                    return `${dayLabel(start, true)} – ${dayLabel(end, true)}`;
                const yr = b.y === thisYear ? "" : ` ${b.y}`;
                if (a.m === b.m) {
                    if (a.d === b.d) return `${dayLabel(end, false)}${yr}`;
                    // "7月5日〜7日": every other branch above and below just
                    // joins two dayLabel() calls, which is already
                    // locale-correct — this is the one case where the month
                    // is factored out once, and English's "day–day month"
                    // order is backwards for Japanese's "month day〜day".
                    if (WIDGET_LOCALE === "ja") {
                        const yearPrefix = b.y === thisYear ? "" : `${b.y}年`;
                        return `${yearPrefix}${T.nutritionSummary.months[b.m - 1]}${a.d}日〜${b.d}日`;
                    }
                    return `${a.d}–${b.d} ${T.nutritionSummary.months[b.m - 1]}${yr}`;
                }
                return `${dayLabel(start, false)} – ${dayLabel(end, false)}${yr}`;
            }

            // ---- The trend chart ----------------------------------------------
            // One series at a time, drawn from the days the payload already
            // carries. Calories by default; a chip takes it over while it is
            // open and hands it back when it closes (see onSeries in render()).
            const CHART = { days: [], goals: null, key: "calories" };

            // The chart draws whatever it has a reading for. A metric with no
            // reading on any day in the range would be a flat line at zero
            // pretending to be data, so it is not offered as a series at all —
            // and offering none of them (a single-day range, where there is no
            // chart) leaves every chip a pure disclosure control.
            function chartableKeys(days) {
                return MACROS.filter((m) => m.role !== "cal")
                    .map((m) => m.key)
                    .filter((k) => days.some((d) => d[k] != null));
            }

            function chartMarkup() {
                const key = CHART.key;
                const m = MACROS.find((mm) => mm.key === key);
                const days = CHART.days;
                // null is "nobody recorded this that day" and must not become a
                // zero: it drops out of the average and breaks the line, exactly
                // as it drops out of the server's own average (#78).
                const raw = days.map((d) =>
                    d[key] == null ? null : Number(d[key]) || 0,
                );
                const seen = raw.filter((v) => v !== null);
                const goal = CHART.goals ? (CHART.goals[key] ?? null) : null;
                // Zero-based, with headroom over the taller of the data and the
                // goal: a nutrient total's distance from zero is meaningful, so
                // the axis is never floated to the data's own floor.
                const top = Math.max(...seen, goal || 0, 1) * 1.15;
                const pts = chPoints(
                    raw.map((v) => (v === null ? 0 : v)),
                    0,
                    top,
                );

                // Built here rather than with chPath(), which has no way to
                // express a gap: a run of readings is one subpath, and a
                // reading alone between two gaps gets a zero-length segment so
                // the round line cap paints it as a dot instead of nothing.
                let d = "";
                let last = -1;
                for (let i = 0; i < raw.length; i++) {
                    if (raw[i] === null) continue;
                    const xy = `${pts[i][0].toFixed(1)} ${pts[i][1].toFixed(1)}`;
                    const joined = i > 0 && raw[i - 1] !== null;
                    d += (joined ? "L" : "M") + xy;
                    if (
                        !joined &&
                        (i + 1 >= raw.length || raw[i + 1] === null)
                    ) {
                        d += "L" + xy;
                    }
                    last = i;
                }

                // The wash under the line, gapped exactly as `d` is: a day with
                // no reading gets no fill rather than the area bridging it.
                // Zero-based domain, so the box's floor really is 0 — see
                // .carea in chart.css.
                const area = chAreaMarkup(
                    chArea(raw.map((v, i) => (v === null ? null : pts[i]))),
                );

                const goalLine =
                    goal && goal > 0
                        ? `<line class="cgoal" x1="${CH_PL}" y1="${chY(goal, 0, top).toFixed(1)}" x2="${CH_W - CH_PR}" y2="${chY(goal, 0, top).toFixed(1)}"/>`
                        : "";
                // One dot, on the last reading: it is the only thing that says
                // which end of the line is now.
                const dot =
                    last >= 0
                        ? `<circle class="chalo" cx="${pts[last][0].toFixed(1)}" cy="${pts[last][1].toFixed(1)}" r="5"/><circle class="cdot" cx="${pts[last][0].toFixed(1)}" cy="${pts[last][1].toFixed(1)}" r="3"/>`
                        : "";

                // NO CHART FOOT, so no average and no goal figure are computed
                // here any more — the two locals that held them survived the
                // foot's removal by a whole release and were read by nothing.
                // The rule they enforced still stands wherever a figure IS
                // printed: every one goes through macroNum()/macroUnit()
                // (macros.js), never fmt() + m.unit, because that is the single
                // place a metric's DISPLAY unit is decided and water is the one
                // metric whose display unit is not its stored one. Bypassing it
                // is what made the old foot read "Water avg 2,100 ml · goal
                // 2,500" two lines under a chip saying "2.1 L".
                //
                // NO aria-label ON THE CHART, and none needed. It lives inside
                // the focus panel's button, which makes its children
                // presentational — so a label here would be announced to
                // nobody. The button's own name (tileLabel, shared/macros.js)
                // already carries the value, the goal and the distance left,
                // which is every figure this line draws; the SHAPE is the part
                // that does not survive, and there is no honest short sentence
                // for it. Marked aria-hidden rather than left to be ignored,
                // so that is a decision on the record.
                //
                // NO DATE FOOT either: the card header prints the range
                // ("5-7 Jul · 3 days logged") three lines above, and this was
                // the third place on one card saying the same thing.
                return `
          <div class="cwrap ${m.color}">
            <svg viewBox="0 0 ${CH_W} ${CH_H}" preserveAspectRatio="none" aria-hidden="true">
              ${goalLine}${area}
              <path class="cline" pathLength="1" d="${d}"/>
              ${dot}
            </svg>
          </div>`;
            }

            // Hand the whole focus panel a metric: its figure, goal, delta,
            // colour, ring and sparkline all switch together. This is the fix
            // for the oldest fault in this layout — the chart restroking to
            // protein while the figure above it went on saying calories.
            //
            // render() owns the whole card, so rebuilding it from here would
            // throw away the tile that was just tapped and the drawer it
            // opened; only the panel's own children are replaced. The
            // sparkline has its own full-width row at every width (`.fspark`,
            // chip.css), so a series switch changes no height and cannot start
            // a size-changed storm.
            //
            // `selected` is whether the metric arrives SELECTED — this widget is
            // the one that mirrors a tile's metric on the panel, so the panel's
            // own aria state has to be told what the tile's is, or it announces
            // "collapsed" over the drawer it just opened and can never be
            // toggled shut (see focusApply).
            function paintSeries(key, selected) {
                const fx = document.querySelector(".focus");
                if (!fx) return;
                const m =
                    MACROS.find((x) => x.key === key) ||
                    MACROS.find((x) => x.role === "cal");
                CHART.key = m.key;
                // One call moves the button, the colour role class the chart
                // inherits --c from, the over state and the wash's `--p`
                // together — see focusApply in shared/macros.js.
                focusApply(fx, m, macroCtx(), !!selected);
                // focusApply rebuilt the panel's children, so the sparkline
                // slot is a fresh empty node every time.
                const box = fx.querySelector(".fspark");
                if (box && CHART.days.length) box.innerHTML = chartMarkup();
            }

            // "3 days logged", or "15 of 30 days logged" when the payload also
            // says how wide the window was. `days_in_range` is OPTIONAL — a host
            // replaying a tool result from before it existed has no such field,
            // and older payloads must render exactly as they always did, so it
            // is only used when it is a real number larger than logged_days.
            function loggedDaysCaption(data) {
                const logged = data.logged_days;
                const span = Number(data.days_in_range);
                return Number.isFinite(span) && span > logged
                    ? tpl(T.nutritionSummary.daysOfLogged, {
                          logged,
                          span,
                      })
                    : plural(T.nutritionSummary.daysLogged, logged);
            }

            function render(data) {
                const root = document.getElementById("root");
                // structuredContent.locale (the user's saved get_language /
                // set_language preference, resolved server-side) wins over
                // the host's ambient hostContext.locale — see pickLocale in
                // shared/i18n.js.
                setLocale(
                    pickLocale(
                        data && data.locale,
                        __widgetApi && __widgetApi.hostContext
                            ? __widgetApi.hostContext.locale
                            : null,
                    ),
                );
                if (
                    !data ||
                    !Array.isArray(data.days) ||
                    data.days.length === 0
                ) {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">🍽️</div>
              <div>${esc(T.nutritionSummary.empty)}</div>
            </div>`;
                    return;
                }
                const days = data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const multi = days.length > 1;
                // Name the denominator: this average divides by the days that
                // actually have a log, while the trends widget's figures divide
                // by every calendar day in the window. Same macros, different
                // number — labelling both is the fix for issue #70.
                const calLabel = multi
                    ? T.nutritionSummary.dailyAvgLoggedDays
                    : T.nutritionSummary.total;
                const meta = multi
                    ? `${rangeLabel(data.start_date, data.end_date)} · ${loggedDaysCaption(data)}`
                    : dayLabel(days[0].date, false);

                // Two points is the least that draws a line; one day is a card
                // with no chart at all rather than a chart with nothing in it.
                const charted = days.length >= 2;
                CHART.days = charted ? days : [];
                CHART.goals = data.goals || null;
                CHART.key = "calories";

                // Calorie hero, the macro rail, the limits rail and the drawer.
                // Tapping a chip opens the meals behind it and hands the chart
                // that nutrient; closing it gives the chart back to calories.
                const strip = macroPanel(
                    data.averages,
                    data.goals,
                    undefined,
                    data.meals,
                    {
                        // THREE VISUAL LEVELS instead of one flat rail of
                        // eight identical tiles: the energy split (protein /
                        // carbs / fat) three-up under the hero, water as a
                        // full-width bar of its own because it is not food and
                        // no meal carries it, and the four ceilings last,
                        // behind a hairline and a size down. See "the tiers"
                        // in shared/chip.css for what each level is made of.
                        // Opt-in while the other widgets are still on the flat
                        // rail — this one is the pilot.
                        tiers: true,
                        // "us" | "uk" for a user who tracks alcohol, null for
                        // one who does not — and null is also the case in which
                        // no alcohol figure reaches the strip at all.
                        drinkUnit: data.drink_unit,
                        calLabel,
                        chartKeys: charted ? chartableKeys(days) : [],
                        onSeries: (key, opened) =>
                            paintSeries(opened ? key : "calories", opened),
                    },
                );

                root.innerHTML = `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.nutritionSummary.title)}</h1>
              <span class="cmeta">${esc(meta)}</span>
            </header>
            ${strip}
          </div>`;

                if (!charted) return;
                // The chart reads as the hero's own evidence, so it belongs
                // between the hero and the rails — and macroPanel emits that
                // whole strip as one block. Moving the node into place is the
                // honest way to do that; splicing a string into another
                // module's markup would break the moment its shape changed.
                // The chart goes INSIDE the focus panel, under the figure
                // row: the panel is the figure and its own chart as one object,
                // so the number and the series it came from can never disagree
                // (see focusInner in shared/macros.js). macroPanel emits the
                // panel as part of one strip, so the node is MOVED into place
                // rather than spliced into another module's markup as a string.
                if (!root.querySelector(".focus")) return;
                paintSeries("calories");
            }

            // Pull the summary out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (Array.isArray(payload.days) || payload.averages)
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // Stashed by onReady so render() can fall back to the host's
            // ambient locale (hostContext.locale) when structuredContent
            // carries none. Not used for the initial "Loading…" text below:
            // that is set synchronously before the ui/initialize handshake
            // (and so before hostContext is known at all) and is shown only
            // briefly — see shared/i18n.js's doc comment for the full
            // locale-resolution order.
            let __widgetApi = null;

            /*@include shared/macros.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "nutrition-summary-widget",
                loading:
                    '<div class="empty"><div class="big">🍽️</div><div>Loading your nutrition summary…</div></div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
