<!doctype html>
<!--
  Nutrition summary dashboard widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts. Styling follows
  public/widgets/STYLE_GUIDE.md so it matches the other widgets.

  The 2026-10 redesign (artboards W1 mobile / desktop), the same visual system
  as meal-logged (shared/gauge.js, shared/nutrients.js): the period over a
  half-gauge of calories. One day splits the arc into its meals (tap a piece
  for that meal); a range draws the daily average over its peak day. Show more
  opens the nutrients as an accordion, each with its meals (a range: its
  by-day strip and its top meals) and their ingredients, and the centre of the
  gauge opens calories by meal (a range: by day). Every average divides by the
  days that recorded the figure, as the tool's text does.

  Data arrives as the `structuredContent` of the get_nutrition_summary tool
  result, with the figures its frozen schema cannot carry in `_meta` (counts,
  added sugar, the fats, sodium, ingredients, sources, each meal's time), all
  validated as untrusted and optional; the shared bridge (shared/bridge.js)
  reads it across host conventions and calls render(). Standalone preview uses
  the SAMPLE below.
-->
<html lang="en">

    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            const SAMPLE = {
                start_date: "2026-07-05",
                end_date: "2026-07-07",
                logged_days: 3,
                drink_unit: "us",
                locale: "en",

                    fiber_g: 26.4,
                    sugar_g: 58.2,

                },

                    alcohol_g: 3,
                    caffeine_mg: 2,
                },
                days: [
                    {
                        date: "2026-07-05",
                        meal_count: 3,
                        calories: 2180,
                        protein_g: 155,
                        carbs_g: 230,
                        fat_g: 72,
                        fiber_g: 31.2,
                        sugar_g: 64.5,
                        alcohol_g: 27.7,
                        caffeine_mg: 245,
                        water_ml: 2400,
                    },
                    {
                        date: "2026-07-06",
                        meal_count: 3,
                        calories: 1890,
                        protein_g: 138,
                        carbs_g: 188,
                        fat_g: 68,
                        fiber_g: 22.8,
                        sugar_g: 51.4,
                        alcohol_g: 0,
                        caffeine_mg: null,
                        water_ml: 1800,
                    },
                    {
                        date: "2026-07-07",
                        meal_count: 2,
                        calories: 2035,
                        protein_g: 151,
                        carbs_g: 197,
                        fat_g: 82,
                        fiber_g: 25.1,
                        sugar_g: 58.8,
                        alcohol_g: 9.8,
                        caffeine_mg: 128,
                        water_ml: 2100,
                    },
                ],
                meals: [
                    {
                        description: "Grilled chicken & rice bowl",
                        meal_type: "lunch",
                        date: "2026-07-05",
                        calories: 650,
                        protein_g: 52,
                        carbs_g: 78,
                        fat_g: 16,
                        fiber_g: 6.2,
                        sugar_g: 9.4,
                        alcohol_g: 0,
                        caffeine_mg: null,
                    },
                    {
                        description: "Salmon with quinoa & veg",
                        meal_type: "dinner",
                        date: "2026-07-05",
                        calories: 640,
                        protein_g: 55,
                        carbs_g: 74,
                        fat_g: 30,
                        fiber_g: 7.1,
                        sugar_g: 6.8,
                        alcohol_g: 13.9,
                        caffeine_mg: null,
                    },
                    {
                        description: "Flat white",
                        meal_type: "snack",
                        date: "2026-07-05",
                        calories: 120,
                        protein_g: 7,
                        carbs_g: 10,
                        fat_g: 6,
                        fiber_g: 0,
                        sugar_g: 9.8,
                        alcohol_g: 0,
                        caffeine_mg: 245,
                    },
                    {
                        description: "Steak burrito",
                        meal_type: "dinner",
                        date: "2026-07-06",
                        calories: 720,
                        protein_g: 48,
                        carbs_g: 66,
                        fat_g: 30,
                        fiber_g: 8.2,
                        sugar_g: 7.9,
                        alcohol_g: 13.8,
                        caffeine_mg: null,
                    },
                    {
                        description: "Cold brew",
                        meal_type: "snack",
                        date: "2026-07-07",
                        calories: 15,
                        protein_g: 0,
                        carbs_g: 2,
                        fat_g: 0,
                        fiber_g: 0,
                        sugar_g: 0,
                        alcohol_g: 0,
                        caffeine_mg: 128,
                    },
                ],
            };

            // The CallToolResult `_meta` key get_nutrition_summary puts the
            // per-metric counts under (MEAL_CONTRIBUTORS_META_KEY in
            // src/mcp.ts). Not structuredContent: hosts validate that against
            // a cached outputSchema, so it can never gain a field.
            const CONTRIBUTORS_META_KEY = "nutrition-mcp.com/meal-contributors";
            // And the added-sugar figures (AddedSugarMeta, src/added-sugar.ts),
            // under ADDED_SUGAR_META_KEY in src/widgets.ts — the same `_meta`
            // object, for the same frozen-schema reason.
            const ADDED_SUGAR_META_KEY = "nutrition-mcp.com/added-sugar";
            // Saturated and trans fat (SaturatedFatMeta, src/saturated-fat.ts).
            // Must equal SATURATED_FAT_META_KEY in src/widgets.ts.
            const SATURATED_FAT_META_KEY = "nutrition-mcp.com/saturated-fat";
            // Sodium (SodiumMeta, src/sodium.ts), milligrams with an optional
            // daily ceiling. Must equal SODIUM_META_KEY.
            const SODIUM_META_KEY = "nutrition-mcp.com/sodium";
            // Each listed meal's ingredients ({ v: 1, meals: [items | null, …] },
            // aligned with data.meals by position). Must equal
            // MEAL_ITEMS_META_KEY in src/widgets.ts.
            const MEAL_ITEMS_META_KEY = "nutrition-mcp.com/meal-items";
            // Each value's source, position-aligned with the meals and their
            // items. Must equal NUTRIENT_SOURCES_META_KEY in src/widgets.ts.
            const NUTRIENT_SOURCES_META_KEY =
                "nutrition-mcp.com/nutrient-sources";
            // Each listed meal's local time ({ v: 1, times }, aligned with
            // data.meals). Must equal MEAL_TIMES_META_KEY in src/widgets.ts.
            const MEAL_TIMES_META_KEY = "nutrition-mcp.com/meal-times";

            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString(WIDGET_LOCALE);
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // The `_meta` validators and merges (withAddedSugar & co.), and
            // DRINK_GRAMS. Its strip is not drawn here, and its delegated
            // click handlers only answer its own data attributes, which this
            // card never uses.
            /*@include shared/macros.js@*/

            /*@include shared/gauge.js@*/

            /*@include shared/nutrients.js@*/

            // ---- Dates --------------------------------------------------------
            // Calendar dates in the USER's timezone, parsed by hand: new
            // Date("2026-07-05") is UTC midnight, which formats as the 4th for
            // anyone west of Greenwich. Formatting goes through Intl with
            // timeZone UTC on a UTC-noon instant, which names the same day.
            function ymd(s) {
                const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(s ?? ""));
                if (!m) return null;
                const mon = Number(m[2]);
                if (mon < 1 || mon > 12) return null;
                return { y: Number(m[1]), m: mon, d: Number(m[3]) };
            }
            function utcNoon(s) {
                const p = ymd(s);
                return p ? new Date(Date.UTC(p.y, p.m - 1, p.d, 12)) : null;
            }
            function intlDate(s, opts) {
                const d = utcNoon(s);
                if (!d) return String(s ?? "");
                try {
                    // English day-before-month, as every other date on the
                    // widgets ("24 Oct"), not en-US's "October 24".
                    return new Intl.DateTimeFormat(
                        WIDGET_LOCALE === "en" ? "en-GB" : WIDGET_LOCALE,
                        Object.assign({ timeZone: "UTC" }, opts),
                    ).format(d);
                } catch (_) {
                    return String(s);
                }
            }
            // Every supported locale except Japanese shares English's
            // day-before-month order, so only `ja` gets a distinct branch.
            function dayLabel(s, withYear) {
                const p = ymd(s);
                if (!p) return String(s ?? "");
                const month = T.nutritionSummary.months[p.m - 1];
                return WIDGET_LOCALE === "ja"
                    ? `${withYear ? `${p.y}年` : ""}${month}${p.d}日`
                    : `${p.d} ${month}${withYear ? ` ${p.y}` : ""}`;
            }
            // "5–7 Jul" within a month, "28 Jun – 4 Jul" across two; the year
            // when the range crosses one or is not the current year.
            function rangeLabel(start, end) {
                const a = ymd(start),
                    b = ymd(end);
                if (!a || !b) return `${start} → ${end}`;
                const thisYear = new Date().getFullYear();
                if (a.y !== b.y)
                    return `${dayLabel(start, true)} – ${dayLabel(end, true)}`;
                const yr = b.y === thisYear ? "" : ` ${b.y}`;
                if (a.m === b.m) {
                    if (a.d === b.d) return `${dayLabel(end, false)}${yr}`;
                    if (WIDGET_LOCALE === "ja") {
                        const yearPrefix = b.y === thisYear ? "" : `${b.y}年`;
                        return `${yearPrefix}${T.nutritionSummary.months[b.m - 1]}${a.d}日〜${b.d}日`;
                    }
                    return `${a.d}–${b.d} ${T.nutritionSummary.months[b.m - 1]}${yr}`;
                }
                return `${dayLabel(start, false)} – ${dayLabel(end, false)}${yr}`;
            }
            // "Saturday, 24 October" (the year when it is not this one).
            function fullDayLabel(s) {
                const p = ymd(s);
                const opts = { weekday: "long", day: "numeric", month: "long" };
                if (p && p.y !== new Date().getFullYear())
                    opts.year = "numeric";
                return intlDate(s, opts);
            }
            function isTodayIso(s) {
                const now = new Date();
                const iso = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
                return s === iso;
            }
            // Every calendar date from start to end (at most a quarter).
            function datesBetween(start, end) {
                const a = utcNoon(start),
                    b = utcNoon(end);
                if (!a || !b || b < a) return [];
                const out = [];
                for (
                    let t = a.getTime();
                    t <= b.getTime() && out.length < 400;
                    t += 86400000
                )
                    out.push(new Date(t).toISOString().slice(0, 10));
                return out;
            }

            // "3 days logged", or "15 of 30 days logged" when the payload also
            // says how wide the window was. `days_in_range` is OPTIONAL — a host
            // replaying a tool result from before it existed has no such field,
            // and older payloads must render exactly as they always did, so it
            // is only used when it is a real number larger than logged_days.
            function loggedDaysCaption(data) {
                const logged = data.logged_days;
                const span = Number(data.days_in_range);
                return Number.isFinite(span) && span > logged
                    ? tpl(T.nutritionSummary.daysOfLogged, {
                          logged,
                          span,
                      })
                    : plural(T.nutritionSummary.daysLogged, logged);
            }

            // The nutrients whose per-day value comes from a `_meta` part
            // (its `days` map), by payload key.
            function metaDayParts(m) {
                const as = addedSugarPayload(m[ADDED_SUGAR_META_KEY]);
                const sf = saturatedFatPayload(m[SATURATED_FAT_META_KEY]);
                const na = m[SODIUM_META_KEY];
                const ok = (p) =>
                    p &&
                    typeof p === "object" &&
                    p.days &&
                    typeof p.days === "object"
                        ? p
                        : null;
                return {
                    added_sugar_g: ok(as),
                    saturated_fat_g: ok(sf),
                    trans_fat_g: ok(sf && sf.trans),
                    sodium_mg: ok(na && na.v === 1 ? na : null),
                };
            }

            // `resultMeta` is the tool result's `_meta` (or null — see bridge.js).
            function render(data, resultMeta) {
                const root = document.getElementById("root");
                // structuredContent.locale (the user's saved set_language
                // preference, resolved server-side) wins over the host's
                // ambient hostContext.locale — see pickLocale in
                // shared/i18n.js.
                setLocale(
                    pickLocale(
                        data && data.locale,
                        __widgetApi && __widgetApi.hostContext
                            ? __widgetApi.hostContext.locale
                            : null,
                    ),
                );
                if (!data || !Array.isArray(data.days)) {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">🍽️</div>
              <div>${esc(T.nutritionSummary.empty)}</div>
            </div>`;
                    return;
                }
                const S = T.nutritionSummary;
                const m = resultMeta || {};
                const days = data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const isRange =
                    data.start_date &&
                    data.end_date &&
                    data.start_date !== data.end_date;
                const single = !isRange;
                const theDay = data.start_date || (days[0] && days[0].date);
                const today = single && isTodayIso(theDay);
                const dates = days.map((d) => d.date);
                const nLogged = days.length;
                const mealCount = days.every((d) =>
                    Number.isFinite(d && d.meal_count),
                )
                    ? days.reduce((n, d) => n + d.meal_count, 0)
                    : null;
                const hasData = mealCount == null ? nLogged > 0 : mealCount > 0;
                const rec = data.recorded_days || {};

                // The payload's own averages (one day: that day's totals), then
                // added sugar, the fats and sodium from `_meta`, each the mean
                // over the days that recorded it; then ingredients and sources.
                const base = Object.assign({}, data.averages || {});
                // Fiber and sugar read 0 on a day nothing recorded them; the
                // count says whether any day did.
                for (const k of ["fiber_g", "sugar_g"])
                    if (rec[k] === 0) base[k] = null;
                const as = addedSugarPayload(m[ADDED_SUGAR_META_KEY]);
                const merged = withAddedSugar(
                    as,
                    addedSugarFor(as, dates),
                    base,
                    data.goals,
                    data.meals,
                );
                const sf = withSaturatedFat(
                    m[SATURATED_FAT_META_KEY],
                    dates,
                    merged.vals,
                    merged.goal,
                    merged.meals,
                );
                const na = withSodium(
                    m[SODIUM_META_KEY],
                    dates,
                    sf.vals,
                    sf.goal,
                    sf.meals,
                );
                // The fats' and sodium's own extra rows join added sugar's (each
                // nutrient's ranked list reads only its own).
                merged.extraRows = Object.assign(
                    {},
                    merged.extraRows,
                    sf.extraRows,
                    na.extraRows,
                );
                const itemsMeta = mealItemsPayload(m[MEAL_ITEMS_META_KEY]);
                const rows = withItemSodium(
                    itemsMeta,
                    withNutrientSources(
                        nutrientSourcesPayload(m[NUTRIENT_SOURCES_META_KEY]),
                        withMealItems(itemsMeta, na.meals),
                        itemsMeta,
                    ),
                );
                const times = mealTimesPayload(
                    m[MEAL_TIMES_META_KEY],
                    Array.isArray(rows) ? rows.length : 0,
                );
                const contributors = Object.assign(
                    {},
                    withAddedSugarContributors(
                        as,
                        m[CONTRIBUTORS_META_KEY] &&
                            typeof m[CONTRIBUTORS_META_KEY] === "object"
                            ? m[CONTRIBUTORS_META_KEY]
                            : null,
                    ),
                    sf.contributors,
                    na.contributors,
                );

                // Per-day values (a range's strip and peaks), the `_meta`
                // nutrients from their own day maps.
                const parts = metaDayParts(m);
                const byDate = new Map(days.map((d) => [d.date, d]));
                const dayVals = (date) => {
                    const d = byDate.get(date);
                    if (!d) return null;
                    const v = Object.assign({}, d);
                    for (const [k, p] of Object.entries(parts)) {
                        const x = p ? p.days[date] : undefined;
                        v[k] = Number.isFinite(x) ? x : null;
                    }
                    return v;
                };
                const peak = {};
                const recCount = {};
                for (const def of NV_DEFS.concat([{ key: "calories" }])) {
                    const xs = dates
                        .map((dt) => {
                            const v = dayVals(dt);
                            return v ? v[def.key] : null;
                        })
                        .filter((x) => Number.isFinite(x));
                    peak[def.key] = xs.length ? Math.max(...xs) : null;
                    recCount[def.key] = Number.isFinite(rec[def.key])
                        ? rec[def.key]
                        : parts[def.key] !== undefined
                          ? xs.length
                          : nLogged;
                }

                const goal = na.goal || {};
                const t = Number(base.calories) || 0;
                const g = Number(goal.calories) || 0;
                const over = g > 0 && t > g;
                const leftN = Math.abs(g - t);
                const kcalTxt = (n) => nvWithUnit("kcal", n);
                const peakKcal = peak.calories || 0;
                const peakDay = isRange
                    ? days.reduce(
                          (b, d) => (!b || d.calories > b.calories ? d : b),
                          null,
                      )
                    : null;

                const meals = nvMealsFrom(
                    rows,
                    (r, i) =>
                        isRange
                            ? r.date
                                ? dayLabel(r.date, false)
                                : ""
                            : times
                              ? times.times[i]
                              : "",
                    -1,
                );

                // One day: the arc split into its meals, when every meal of
                // the day is listed (the server trims only past 8 per metric).
                let segs = null;
                if (
                    single &&
                    hasData &&
                    g > 0 &&
                    mealCount != null &&
                    meals.length === mealCount
                ) {
                    segs = gaugeSegments(
                        meals.map((x) => ({ kcal: x.kcal || 0, name: x.name })),
                        g,
                    );
                    if (segs)
                        for (const s of segs)
                            s.tip = `${s.names.join(" + ")} · ${kcalTxt(s.kcal)}`;
                }
                const pct = g > 0 ? Math.round((t / g) * 100) : null;
                const status =
                    g > 0
                        ? tpl(
                              isRange
                                  ? over
                                      ? S.overGoal
                                      : S.underGoal
                                  : over
                                    ? S.over
                                    : S.left,
                              { amount: kcalTxt(leftN) },
                          )
                        : "";
                let aria =
                    g > 0
                        ? tpl(
                              isRange
                                  ? S.gaugeAriaRange
                                  : today
                                    ? S.gaugeAriaToday
                                    : S.gaugeAriaThatDay,
                              {
                                  eaten: nvFmt("kcal", t),
                                  goal: nvFmt("kcal", g),
                                  pct: nvNum(pct, 0),
                                  status,
                              },
                          )
                        : tpl(S.gaugeAriaNoGoal, { eaten: nvFmt("kcal", t) });
                if (single && meals.length)
                    aria +=
                        " " +
                        tpl(S.gaugeAriaMeals, {
                            list: meals
                                .map((x) => `${x.name} ${kcalTxt(x.kcal || 0)}`)
                                .join(", "),
                        });

                const dayWord = isRange ? "range" : today ? "today" : "thatDay";
                const eyebrow = `${S.title} · ${
                    isRange
                        ? loggedDaysCaption(data)
                        : today
                          ? S.periodToday
                          : S.periodPastDay
                }`;
                const title = isRange
                    ? rangeLabel(data.start_date, data.end_date)
                    : fullDayLabel(theDay);
                const dot = `<span class="dot" aria-hidden="true">·</span>`;
                let deltaHtml = "";
                if (isRange) {
                    deltaHtml =
                        (g > 0
                            ? `<b class="${over ? "over" : ""}">${esc(status)}</b>${dot}`
                            : "") +
                        esc(tpl(S.peak, { amount: kcalTxt(peakKcal) }));
                } else {
                    const leftKey = over
                        ? today
                            ? "overToday"
                            : "overThatDay"
                        : today
                          ? "leftToday"
                          : "leftThatDay";
                    deltaHtml =
                        `<b>${esc(plural(S.mealsCount, mealCount ?? meals.length))}</b>` +
                        (g > 0
                            ? `${dot}<b class="${over ? "over" : ""}">${esc(tpl(S[leftKey], { amount: kcalTxt(leftN) }))}</b>`
                            : "");
                }
                const stats = isRange
                    ? [
                          {
                              label: S.statAvgDay,
                              value: nvFmt("kcal", t),
                              small: g > 0 ? `/ ${nvFmt("kcal", g)}` : "",
                              over,
                          },
                          {
                              label: S.statPeakDay,
                              value: nvFmt("kcal", peakKcal),
                              small: peakDay
                                  ? dayLabel(peakDay.date, false)
                                  : "",
                          },
                          {
                              label: S.statLoggedDays,
                              value: nvNum(nLogged, 0),
                              small: tpl(S.statOfDays, {
                                  n: nvNum(
                                      Number(data.days_in_range) ||
                                          datesBetween(
                                              data.start_date,
                                              data.end_date,
                                          ).length ||
                                          nLogged,
                                      0,
                                  ),
                              }),
                          },
                      ]
                    : [
                          {
                              label: today ? S.statEatenSoFar : S.statEaten,
                              value: nvFmt("kcal", t),
                              small: g > 0 ? `/ ${nvFmt("kcal", g)}` : "",
                              over,
                          },
                          ...(g > 0
                              ? [
                                    {
                                        label: over
                                            ? S.statOverGoal
                                            : S.statRemaining,
                                        value: nvFmt("kcal", leftN),
                                        small: nvUnitLabel("kcal"),
                                        over,
                                    },
                                ]
                              : []),
                          {
                              label: S.statMeals,
                              value: nvNum(mealCount ?? meals.length, 0),
                              small: S.statLogged,
                          },
                      ];

                const stripDates = isRange
                    ? datesBetween(data.start_date, data.end_date)
                    : [];
                const V = {
                    mode: isRange ? "range" : "day",
                    dayWord,
                    hasData,
                    // "us" | "uk" for a user who tracks alcohol, null for one
                    // who does not — and null is also the case in which every
                    // alcohol figure is null and the row is left out.
                    drinkUnit: data.drink_unit,
                    alcoholOn:
                        data.drink_unit != null ||
                        Number.isFinite(base.alcohol_g),
                    vals: na.vals,
                    goal,
                    delta: null,
                    peak: isRange ? peak : null,
                    rec: recCount,
                    nLogged,
                    zeroMeansUnknown: [],
                    cal: { t, g, peak: peakKcal },
                    meals,
                    // Added sugar's, the fats' and sodium's own top meals that
                    // the kept rows miss; each joins only its nutrient's list.
                    extraRows: merged.extraRows,
                    extraSub: (r) => (r.date ? dayLabel(r.date, false) : ""),
                    days: stripDates.map((dt) => ({
                        date: dt,
                        short: intlDate(dt, { weekday: "narrow" }),
                        label: dayLabel(dt, false),
                        logged: byDate.has(dt),
                        vals: dayVals(dt),
                    })),
                    contributors,
                    // data.meals is bounded to each metric's top 8, so a ranked
                    // list's "N more" counts against `_meta`'s true counts and
                    // — when a host dropped them — hedges.
                    bounded: true,
                    mealTotal: mealCount,
                    hero: {
                        eyebrow,
                        title,
                        deltaHtml,
                        emptyText: isRange
                            ? S.emptyRange
                            : today
                              ? S.emptyToday
                              : S.emptyThatDay,
                        stats,
                        gauge: {
                            over,
                            pre:
                                isRange && g > 0
                                    ? gaugeClamp01(peakKcal / g) * 100
                                    : 0,
                            add:
                                g > 0
                                    ? Math.max(
                                          gaugeClamp01(t / g) * 100,
                                          t > 0 ? 0.8 : 0,
                                      )
                                    : 0,
                            addOff: null,
                            segs,
                            pctTxt: pct == null ? null : `${nvNum(pct, 0)}%`,
                            numTxt: nvFmt("kcal", t),
                            glab:
                                g > 0
                                    ? tpl(isRange ? S.avgOfGoal : S.ofGoal, {
                                          goal: nvFmt("kcal", g),
                                      })
                                    : nvUnitLabel("kcal"),
                            aria,
                            btnLabel: isRange
                                ? S.caloriesByDay
                                : tpl(T.macros.byMealTitle, {
                                      label: nvLabel("calories"),
                                  }),
                        },
                    },
                };
                nvMount(root, V);
            }

            // Pull the summary out of whatever wrapper the host used.
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                // The structuredContent object itself, or a wrapper around it.
                if (Array.isArray(payload.days) || payload.averages)
                    return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // Stashed by onReady so render() can fall back to the host's
            // ambient locale (hostContext.locale) when structuredContent
            // carries none.
            let __widgetApi = null;

            initWidget({
                name: "nutrition-summary-widget",
                // A function: bridge.js calls it with the strings for the
                // browser language, since the payload's locale isn't known yet.
                loading: (strings) =>
                    '<div class="empty"><div class="big">🍽️</div><div>' +
                    esc(strings.nutritionSummary.loading) +
                    "</div></div>",
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
