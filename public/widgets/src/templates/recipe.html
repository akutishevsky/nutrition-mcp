<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Recipe</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            /*@include shared/facts.css@*/
            .f-section-title {
                font-size: 15px;
                font-weight: 650;
                margin: 10px 0 2px;
            }
            .rc-name-line {
                font-size: 17px;
                font-weight: 700;
                line-height: 1.25;
            }
            .rc-row {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                padding: 10px 0 11px;
                border-bottom: 1px solid var(--panel-border);
            }
            .rc-row:last-child {
                border-bottom: 0;
            }
            .rc-main {
                min-width: 0;
            }
            .rc-name {
                font-weight: 650;
                line-height: 1.3;
            }
            .rc-meta {
                font-size: 12.5px;
                color: var(--text-dim);
                margin-top: 2px;
            }
            .rc-val {
                margin-left: auto;
                font-weight: 750;
                font-variant-numeric: tabular-nums;
                white-space: nowrap;
                padding-top: 1px;
            }
            .rc-step {
                display: flex;
                gap: 12px;
                padding: 9px 0;
                border-bottom: 1px solid var(--panel-border);
            }
            .rc-step:last-child {
                border-bottom: 0;
            }
            .rc-step-num {
                flex: none;
                font-weight: 750;
                font-variant-numeric: tabular-nums;
                color: var(--text-dim);
            }
            .rc-step-text {
                line-height: 1.45;
            }
            .rc-compact .f-crow {
                min-height: 38px;
                padding: 6px 0;
            }
            .f-banner {
                margin-top: 8px;
            }
            .f-hero-cap {
                margin-top: 3px;
            }
            .f-rule-heavy {
                margin-top: 8px;
            }
            .nutrient-rows .f-lrow {
                padding: 5px 0 6px;
            }
            .nutrient-rows .f-src {
                margin-top: 3px;
            }
            .f-sticky-status:empty {
                display: none;
            }
            .f-sticky-status {
                font-size: 12.5px;
                color: var(--text-dim);
                padding: 0 20px 10px;
            }
            .f-sticky-status.error {
                color: var(--over);
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            /*@include shared/facts.js@*/
            const SAMPLE = {
                recipes: [
                    {
                        recipe_id: "11111111-1111-4111-8111-111111111111",
                        name: "Lemon Herb Chicken and Rice",
                        servings: 4,
                        nutrition_status: "complete",
                        nutrition_per_serving: {
                            calories: 512,
                            protein_g: 38,
                            carbs_g: 46,
                            fat_g: 18,
                        },
                        preparation_minutes: 15,
                        cooking_minutes: 30,
                        ownership: "personal",
                    },
                    {
                        recipe_id: "22222222-2222-4222-8222-222222222222",
                        name: "Black Bean Soup",
                        servings: 6,
                        nutrition_status: "partial",
                        nutrition_per_serving: {
                            calories: 288,
                            protein_g: 14,
                            carbs_g: 48,
                            fat_g: 5,
                        },
                        preparation_minutes: 10,
                        cooking_minutes: 40,
                        ownership: "personal",
                    },
                ],
            };
            let API = null;
            let DRAFT = null;
            let BUSY = false;
            const NUTRIENTS = [
                ["Protein", "protein_g", "g", 1],
                ["Carbs", "carbs_g", "g", 1],
                ["Fat", "fat_g", "g", 1],
                ["Fiber", "fiber_g", "g", 1],
                ["Sugar", "sugar_g", "g", 1],
                ["Sodium", "sodium_mg", "mg", 0],
            ];
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.error || payload.__error)
                    return {
                        __error:
                            payload.error?.message ||
                            payload.error ||
                            payload.__error,
                    };
                if (payload.structuredContent)
                    return coerce(payload.structuredContent);
                if (payload.draft?.recipe)
                    return { mode: "review", draft: payload.draft };
                if (Array.isArray(payload.recipes)) {
                    const extra = (payload.pantry_candidates || []).map(
                        (candidate) => ({
                            recipe_id: candidate.recipe_id,
                            name: candidate.name,
                            servings: candidate.servings,
                            nutrition_status: candidate.nutrition_status,
                            nutrition_per_serving:
                                candidate.nutrition_per_serving,
                            preparation_minutes: candidate.preparation_minutes,
                            cooking_minutes: candidate.cooking_minutes,
                            pantry: true,
                        }),
                    );
                    return {
                        mode: "list",
                        recipes: [...payload.recipes, ...extra],
                    };
                }
                if ("recipe" in payload) {
                    if (!payload.recipe)
                        return {
                            __empty: {
                                title: "Recipe not found",
                                body: "That recipe is no longer available. Search your recipes to pick another.",
                            },
                        };
                    if (
                        Array.isArray(payload.recipe.ingredients) &&
                        Array.isArray(payload.recipe.instructions)
                    )
                        return { mode: "view", recipe: payload.recipe };
                    return {
                        __empty: {
                            title: "Recipe saved",
                            body: "The recipe is in your library. Ask for it by name to see the full card.",
                        },
                    };
                }
                return null;
            }
            function timeMeta(entry) {
                const parts = [];
                if (entry.preparation_minutes != null)
                    parts.push(`prep ${entry.preparation_minutes} min`);
                if (entry.cooking_minutes != null)
                    parts.push(`cook ${entry.cooking_minutes} min`);
                return parts.join(" · ");
            }
            function bindExpand() {
                document
                    .getElementById("details")
                    ?.addEventListener("click", async () => {
                        const result = await API?.requestDisplayMode(
                            "fullscreen",
                        ).catch(() => null);
                        if (!result || result.unsupported)
                            document.getElementById("details").textContent =
                                "Details unavailable";
                    });
                document
                    .getElementById("close")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("inline"),
                    );
            }
            function renderList(data) {
                const recipes = data.recipes || [];
                if (!recipes.length) {
                    document.getElementById("root").innerHTML =
                        `<article class="card">${factsBand("Recipes", "")}${factsState("empty", "No recipes found", "No saved recipes match. Try a different search, or import a recipe from a link.")}<div class="f-foot"><span>Every number traces to its source</span><span>Your saved recipes</span></div></article>`;
                    return;
                }
                const richRow = (entry) => {
                    const per = entry.nutrition_per_serving || {};
                    const meta = [
                        `${fmt(entry.servings)} serving${entry.servings === 1 ? "" : "s"}`,
                        timeMeta(entry),
                        entry.pantry ? "pantry match" : null,
                        entry.nutrition_status === "partial"
                            ? "nutrition estimated"
                            : null,
                    ]
                        .filter(Boolean)
                        .join(" · ");
                    return `<div class="rc-row"><div class="rc-main"><div class="rc-name">${esc(entry.name || "Recipe")}</div><div class="rc-meta">${esc(meta)}</div><div class="f-src">Source · <b>${entry.ownership === "household" ? "Household recipes" : "Your saved recipes"}</b></div></div><div class="rc-val num">${per.calories == null ? "—" : `${fmt(per.calories)} kcal`}</div></div>`;
                };
                const compactRow = (entry) => {
                    const per = entry.nutrition_per_serving || {};
                    return factsCompactRow({
                        name: entry.name || "Recipe",
                        meta: `${fmt(entry.servings)} servings`,
                        valueText:
                            per.calories == null
                                ? "—"
                                : `${fmt(per.calories)} kcal`,
                    });
                };
                const compact = recipes.length > 6;
                const folded = recipes.length > 12;
                const inlineItems = folded ? recipes.slice(0, 5) : recipes;
                document.getElementById("root").innerHTML =
                    `<article class="card">
        ${factsBand("Recipes", `${recipes.length} recipe${recipes.length === 1 ? "" : "s"}`)}
        <div class="f-body">
        <div>${inlineItems.map((entry) => (compact ? compactRow(entry) : richRow(entry))).join("")}</div>
        ${folded ? `<button class="f-more-row inline-only" id="details">…and ${recipes.length - 5} more</button>` : `<button class="f-more-row inline-only" id="details">Recipe details</button>`}
        <div class="fullscreen-only">
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">All ${recipes.length} recipes</h2>
        <div>${recipes.map((entry) => richRow(entry)).join("")}</div>
        <div class="actions"><button class="btn" id="close">Return to chat</button></div>
        </div>
        </div>
        <div class="f-foot"><span>Every number traces to its source</span><span>Your saved recipes · per-serving nutrition from recipe ingredients</span></div>
    </article>`;
                bindExpand();
            }
            function ingredientLine(ingredient) {
                const parts = [];
                if (ingredient.quantity != null)
                    parts.push(fmt(ingredient.quantity, 2));
                if (ingredient.unit) parts.push(ingredient.unit);
                parts.push(ingredient.name || "Ingredient");
                let line = parts.join(" ");
                if (ingredient.preparation)
                    line += `, ${ingredient.preparation}`;
                if (ingredient.optional) line += " (optional)";
                return line;
            }
            function ingredientSource(ingredient) {
                const provider = ingredient.provider || "";
                if (/usda/i.test(provider)) return "USDA FoodData Central";
                if (/open_food_facts/i.test(provider)) return "Open Food Facts";
                if (provider) return provider;
                const type = ingredient.source_type || "";
                if (/usda/i.test(type)) return "USDA FoodData Central";
                if (/open_food_facts/i.test(type)) return "Open Food Facts";
                if (/saved_food/i.test(type)) return "Saved food";
                if (/past_meal/i.test(type)) return "Past meal";
                if (/model_estimate/i.test(type)) return "Estimate";
                if (/user_supplied/i.test(type)) return "Recipe as written";
                if (/published_restaurant/i.test(type)) return "Published menu";
                return type ? type.replaceAll("_", " ") : "Recipe as written";
            }
            function nutritionRows(values, source) {
                return NUTRIENTS.filter(([, key]) => values?.[key] != null).map(
                    ([name, key, unit, digits]) =>
                        factsLabelRow({
                            name,
                            valueText: `${fmt(values[key], digits)} ${unit}`,
                            showBar: false,
                            source,
                        }),
                );
            }
            function statusBanner(status, subject) {
                if (status === "partial")
                    return factsBanner(
                        "warn",
                        `<b>Estimated nutrition.</b> Some ${subject} could not be matched to a food record, so the numbers cover the matched ones only.`,
                    );
                if (status === "unavailable")
                    return factsBanner(
                        "warn",
                        `<b>Nutrition not available yet.</b> The ${subject} have no matched nutrition to total.`,
                    );
                return "";
            }
            function renderView(data) {
                const recipe = data.recipe;
                const per = recipe.nutrition_per_serving || {};
                const total = recipe.nutrition_total || {};
                const sourceLabel =
                    recipe.source?.title ||
                    (recipe.source?.type === "imported"
                        ? "Imported recipe"
                        : "Your saved recipes");
                const ingredients = recipe.ingredients || [];
                const steps = recipe.instructions || [];
                const compact = ingredients.length > 6;
                // Inline carries the first 5 ingredients; the rest are
                // fullscreen detail alongside the steps and full nutrition.
                const inlineIngredients = ingredients.slice(0, 5);
                const ingredientRow = (ingredient) => {
                    const kcal = ingredient.nutrients?.calories;
                    return compact
                        ? factsCompactRow({
                              name: ingredientLine(ingredient),
                              valueText:
                                  kcal == null ? "—" : `${fmt(kcal)} kcal`,
                          })
                        : `<div class="rc-row"><div class="rc-main"><div class="rc-name">${esc(ingredientLine(ingredient))}</div><div class="f-src">Source · <b>${esc(ingredientSource(ingredient))}</b></div></div><div class="rc-val num">${kcal == null ? "—" : `${fmt(kcal)} kcal`}</div></div>`;
                };
                const macroLine = [
                    per.protein_g != null
                        ? `P ${fmt(per.protein_g, 1)}g`
                        : null,
                    per.carbs_g != null ? `C ${fmt(per.carbs_g, 1)}g` : null,
                    per.fat_g != null ? `F ${fmt(per.fat_g, 1)}g` : null,
                ]
                    .filter(Boolean)
                    .join(" · ");
                document.getElementById("root").innerHTML =
                    `<article class="card">
        ${factsBand("Recipe", `${fmt(recipe.servings)} serving${recipe.servings === 1 ? "" : "s"}`)}
        <div class="f-body">
        <div class="rc-name-line">${esc(recipe.name || "Recipe")}</div>
        ${factsHero(per.calories == null ? "—" : `${fmt(per.calories)} <span class="f-hero-unit">kcal</span>`, macroLine ? `per serving · ${macroLine}` : "per serving", "", "")}
        ${statusBanner(recipe.nutrition_status, "ingredients")}
        <div class="f-rule-heavy"></div>
        <h2 class="f-section-title">Ingredients</h2>
        <div class="${compact ? "rc-compact" : ""}">${inlineIngredients.map((ingredient) => ingredientRow(ingredient)).join("")}</div>
        ${ingredients.length > 5 ? `<button class="f-more-row inline-only" id="details">…and ${ingredients.length - 5} more</button>` : `<button class="f-more-row inline-only" id="details">Steps and full nutrition</button>`}
        <div class="fullscreen-only">
        ${ingredients.length > 5 ? `<h2 class="f-section-title">All ingredients</h2><div>${ingredients.map((ingredient) => `<div class="rc-row"><div class="rc-main"><div class="rc-name">${esc(ingredientLine(ingredient))}</div><div class="f-src">Source · <b>${esc(ingredientSource(ingredient))}</b></div></div><div class="rc-val num">${ingredient.nutrients?.calories == null ? "—" : `${fmt(ingredient.nutrients.calories)} kcal`}</div></div>`).join("")}</div>` : ""}
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Steps</h2>
        <div>${steps.map((step, index) => `<div class="rc-step"><span class="rc-step-num">${index + 1}</span><span class="rc-step-text">${esc(step)}</span></div>`).join("") || '<div class="f-note">No steps recorded.</div>'}</div>
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Nutrition per serving</h2>
        <div class="nutrient-rows">${nutritionRows(per, sourceLabel).join("") || '<div class="f-note">No per-serving nutrition recorded.</div>'}</div>
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Nutrition, whole recipe</h2>
        <div class="nutrient-rows">${nutritionRows(total, sourceLabel).join("") || '<div class="f-note">No whole-recipe nutrition recorded.</div>'}</div>
        ${recipe.description ? `<div class="f-note">${esc(recipe.description)}</div>` : ""}
        <div class="actions"><button class="btn" id="close">Return to chat</button></div>
        </div>
        </div>
        <div class="f-foot"><span>Every number traces to its source</span><span>${esc(sourceLabel)}</span></div>
    </article>`;
                bindExpand();
            }
            function hashText(value) {
                let hash = 0;
                const text = String(value || "");
                for (let index = 0; index < text.length; index++)
                    hash = (hash * 31 + text.charCodeAt(index)) | 0;
                return Math.abs(hash).toString(36);
            }
            function saveArgs(draft) {
                const recipe = draft.recipe;
                return {
                    scope: "personal",
                    recipe: {
                        name: recipe.name,
                        servings: recipe.servings,
                        description: recipe.description,
                        instructions: recipe.instructions || [],
                        preparation_minutes: recipe.preparation_minutes,
                        cooking_minutes: recipe.cooking_minutes,
                        source_type: "imported",
                        source_title:
                            recipe.source_title ||
                            draft.source?.title ||
                            undefined,
                        source_url:
                            recipe.source_url || draft.source?.final_url,
                        ingredients: (recipe.ingredients || []).map(
                            (ingredient) => ({
                                name: ingredient.name,
                                quantity: ingredient.quantity,
                                unit: ingredient.unit,
                                preparation: ingredient.preparation,
                                optional: ingredient.optional,
                                gram_weight: ingredient.gram_weight,
                                nutrients: ingredient.nutrients,
                                provider: ingredient.provider,
                                provider_food_id: ingredient.provider_food_id,
                                source_type: ingredient.source_type,
                                source_url: ingredient.source_url,
                                confidence: ingredient.confidence,
                                source_snapshot:
                                    ingredient.source_snapshot || {},
                            }),
                        ),
                    },
                    idempotency_key: `recipe-import-${hashText(`${draft.source?.final_url || ""}|${recipe.name}`)}`,
                };
            }
            function setBusy(value, message, isError) {
                BUSY = value;
                const save = document.getElementById("save");
                const cancel = document.getElementById("cancel");
                if (save) save.disabled = value;
                if (cancel) cancel.disabled = value;
                const status = document.getElementById("status");
                if (status) {
                    status.textContent = message || "";
                    status.classList.toggle("error", !!isError);
                }
            }
            function renderReview(data) {
                const draft = data.draft;
                DRAFT = draft;
                BUSY = false;
                const recipe = draft.recipe || {};
                const review = draft.ingredient_review || [];
                const resolutionByPosition = new Map(
                    review.map((entry) => [entry.position, entry]),
                );
                const needsLook = review.filter(
                    (entry) =>
                        entry.resolution === "unresolved" ||
                        entry.resolution === "ambiguous",
                );
                const assumed = review.filter(
                    (entry) => entry.resolution === "assumed",
                );
                const per = draft.nutrition?.per_serving || {};
                const ingredients = recipe.ingredients || [];
                // Inline carries the first 5 ingredients as compact rows;
                // fullscreen carries every ingredient as a rich row with
                // its source and review flag on the row.
                const inlineIngredients = ingredients.slice(0, 5);
                const reviewRow = (ingredient, index, rich) => {
                    const entry = resolutionByPosition.get(index);
                    const kcal = ingredient.nutrients?.calories;
                    const flag =
                        entry &&
                        (entry.resolution === "unresolved" ||
                            entry.resolution === "ambiguous")
                            ? ` · ${entry.resolution} — check in chat`
                            : entry?.resolution === "assumed"
                              ? " · assumed match"
                              : "";
                    if (!rich)
                        return factsCompactRow({
                            name: ingredientLine(ingredient),
                            meta: flag ? flag.replace(" · ", "") : undefined,
                            valueText: kcal == null ? "—" : `${fmt(kcal)} kcal`,
                        });
                    return `<div class="rc-row"><div class="rc-main"><div class="rc-name">${esc(ingredientLine(ingredient))}</div><div class="f-src">Source · <b>${esc(ingredientSource(ingredient))}</b>${flag ? esc(flag) : ""}</div></div><div class="rc-val num">${kcal == null ? "—" : `${fmt(kcal)} kcal`}</div></div>`;
                };
                const warnings = (draft.warnings || []).filter(
                    (warning) =>
                        warning.severity === "warning" || warning.blocking,
                );
                // One combined banner inline: the write surface's height
                // budget cannot carry a banner per finding. Every finding
                // repeats in the fullscreen checks section.
                const bannerParts = [];
                if (draft.nutrition?.status === "partial")
                    bannerParts.push(
                        "Estimated nutrition — some ingredients could not be matched, so the numbers cover the matched ones only.",
                    );
                if (draft.nutrition?.status === "unavailable")
                    bannerParts.push(
                        "Nutrition is not available yet — the ingredients have no matched nutrition to total.",
                    );
                for (const warning of warnings)
                    bannerParts.push(warning.message);
                if (needsLook.length)
                    bannerParts.push(
                        `${needsLook.length} ingredient${needsLook.length === 1 ? "" : "s"} need a look: ${needsLook.map((entry) => entry.raw_text).join("; ")}.`,
                    );
                if (assumed.length)
                    bannerParts.push(
                        `${assumed.length} ingredient${assumed.length === 1 ? "" : "s"} matched by assumption — labeled on their rows.`,
                    );
                const checkBanner = bannerParts.length
                    ? factsBanner(
                          "warn",
                          `<b>Check before saving.</b> ${esc(bannerParts.join(" "))}`,
                      )
                    : "";
                const steps = recipe.instructions || [];
                const assumptions = draft.assumptions || [];
                const host = (() => {
                    try {
                        return new URL(draft.source?.final_url || "").hostname;
                    } catch (_) {
                        return draft.source?.site_name || "the source page";
                    }
                })();
                document.getElementById("root").innerHTML =
                    `<article class="card">
        ${factsBand("Review recipe", draft.source?.site_name || "Import")}
        <div class="f-body">
        <div class="rc-name-line">${esc(recipe.name || "Imported recipe")}</div>
        <div class="f-src">Source · <b>${esc(host)}</b></div>
        ${factsHero(per.calories == null ? "—" : `${fmt(per.calories)} <span class="f-hero-unit">kcal</span>`, `per serving · ${fmt(recipe.servings)} servings${timeMeta(recipe) ? ` · ${timeMeta(recipe)}` : ""}`, "", "")}
        ${checkBanner}
        <div class="f-rule-heavy"></div>
        <h2 class="f-section-title">Ingredients to save</h2>
        <div class="rc-compact">${inlineIngredients.map((ingredient, index) => reviewRow(ingredient, index, false)).join("")}</div>
        ${ingredients.length > 5 ? `<button class="f-more-row inline-only" id="details">…and ${ingredients.length - 5} more</button>` : `<button class="f-more-row inline-only" id="details">Steps and details</button>`}
        <div class="fullscreen-only">
        ${ingredients.length > 5 ? `<h2 class="f-section-title">All ingredients</h2><div>${ingredients.map((ingredient, index) => reviewRow(ingredient, index, true)).join("")}</div>` : ""}
        ${warnings.length ? `<div class="f-rule-med"></div><h2 class="f-section-title">Checks before saving</h2>${warnings.map((warning) => `<div class="f-note" style="margin-top:6px">${esc(warning.message)}</div>`).join("")}` : ""}
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Steps</h2>
        <div>${steps.map((step, index) => `<div class="rc-step"><span class="rc-step-num">${index + 1}</span><span class="rc-step-text">${esc(step)}</span></div>`).join("") || '<div class="f-note">No steps were found on the page.</div>'}</div>
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Nutrition per serving</h2>
        <div class="nutrient-rows">${nutritionRows(per, host).join("") || '<div class="f-note">No per-serving nutrition could be totaled.</div>'}</div>
        ${assumptions.length ? `<div class="f-rule-med"></div><h2 class="f-section-title">Assumptions</h2>${assumptions.map((entry) => `<div class="f-note" style="margin-top:6px"><b>${esc(entry.raw_text)}</b> — ${esc(entry.message)}</div>`).join("")}` : ""}
        <div class="actions"><button class="btn" id="close">Return to chat</button></div>
        </div>
        </div>
        <div class="f-sticky-status" id="status" role="status" aria-live="polite"></div>
        ${factsStickyBar("save", "Save recipe", "cancel", "Cancel", "<b>Nothing is saved until you tap Save recipe.</b> Check the ingredients above first.")}
    </article>`;
                document
                    .getElementById("save")
                    ?.addEventListener("click", saveRecipe);
                document
                    .getElementById("cancel")
                    ?.addEventListener("click", cancelImport);
                bindExpand();
            }
            async function saveRecipe() {
                if (BUSY || !DRAFT) return;
                if (!API?.canCallTools) {
                    setBusy(
                        false,
                        "Saving is not available in this view. Confirm in chat instead.",
                        true,
                    );
                    return;
                }
                setBusy(true, "Saving recipe…");
                try {
                    await API.callTool("save_recipe", saveArgs(DRAFT));
                    await API.updateModelContext(
                        `Recipe “${DRAFT.recipe.name}” was reviewed and saved from ${DRAFT.source?.final_url || "an imported page"}.`,
                    ).catch(() => {});
                    const per = DRAFT.nutrition?.per_serving || {};
                    document.getElementById("root").innerHTML =
                        `<article class="card">${factsBand("Recipe saved", "")}<div class="f-body"><div class="rc-name-line">${esc(DRAFT.recipe.name || "Recipe")}</div><div class="f-note">Saved to your recipes${per.calories != null ? ` · ${fmt(per.calories)} kcal per serving` : ""} · ${fmt(DRAFT.recipe.servings)} servings.</div><div class="f-src">Source · <b>${esc(DRAFT.source?.site_name || "Imported page")}</b></div></div><div class="f-foot"><span>Every number traces to its source</span><span>Your saved recipes</span></div></article>`;
                } catch (error) {
                    setBusy(
                        false,
                        error?.message ||
                            "Could not save the recipe. Nothing was saved — try again.",
                        true,
                    );
                }
            }
            async function cancelImport() {
                if (BUSY || !DRAFT) return;
                setBusy(true, "Cancelling…");
                try {
                    if (API?.canSendMessages)
                        await API.sendMessage(
                            "Cancel this recipe import. Do not save the recipe.",
                        );
                } catch (_) {}
                document.getElementById("root").innerHTML =
                    `<article class="card">${factsBand("Import cancelled", "")}${factsState("empty", "Nothing was saved", "The parsed recipe was discarded. Paste another link whenever you are ready.")}<div class="f-foot"><span>Every number traces to its source</span><span>Your saved recipes</span></div></article>`;
            }
            function render(data) {
                if (data.__error) {
                    const title =
                        data.mode === "review" ? "Review recipe" : "Recipe";
                    document.getElementById("root").innerHTML = factsCardState(
                        title,
                        "",
                        "error",
                        "Could not load this recipe",
                        String(data.__error) ||
                            "Something went wrong reading the recipe. Try again in chat.",
                    );
                    return;
                }
                if (data.__empty) {
                    document.getElementById("root").innerHTML =
                        `<article class="card">${factsBand("Recipe", "")}${factsState("empty", data.__empty.title, data.__empty.body)}<div class="f-foot"><span>Every number traces to its source</span><span>Your saved recipes</span></div></article>`;
                    return;
                }
                if (data.mode === "list") renderList(data);
                else if (data.mode === "view") renderView(data);
                else if (data.mode === "review") renderReview(data);
            }
            initWidget({
                name: "recipe-widget",
                displayModes: ["inline", "fullscreen"],
                loading:
                    '<article class="card"><div class="f-band"><span class="f-band-title">Recipe</span></div><div class="f-state"><strong>Loading recipe</strong><span>Reading the recipe…</span></div></article>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
            });
        </script>
    </body>
</html>
