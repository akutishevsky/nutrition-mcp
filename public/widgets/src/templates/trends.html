        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            // fmt + esc: the bridge's connect-failure notice and period.js
            // (the Week / Month / Quarter / Year rows) both need them.
            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }

            // periodsFrom() + the period row builders. Requires fmt + esc
            // above and T / tpl / plural from shared/i18n.js.
            /*@include shared/period.js@*/

            const RANGES = [7, 14, 30];

            // Where get_trends puts what its frozen outputSchema cannot carry
            // (each must equal its constant in src/widgets.ts; a widget
            // cannot import, so src/mcp.test.ts checks these literals).
            const ADDED_SUGAR_META_KEY = "nutrition-mcp.com/added-sugar";
            const SATURATED_FAT_META_KEY = "nutrition-mcp.com/saturated-fat";
            const SODIUM_META_KEY = "nutrition-mcp.com/sodium";
            const LOCAL_TODAY_META_KEY = "nutrition-mcp.com/local-today";

            // Grams of alcohol per drink, by the account's drink unit. Must
            // equal DRINK_GRAMS in src/units.ts (and shared/macros.js).
            const DRINK_GRAMS = { us: 14, uk: 7.893 };

            // ---- untrusted `_meta` -----------------------------------------
            const isNum = (v) => typeof v === "number" && isFinite(v);
            const isDate = (v) =>
                typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
            // A `{ v: 1, goal, days }` series (added sugar, saturated fat,
            // sodium, and saturated fat's `.trans`): rebuilt from its fields,
            // a day kept only as a finite value >= 0, anything else "not
            // recorded". Null when the payload is unusable — the nutrient is
            // then not offered at all.
            function seriesPayload(raw, needV) {
                if (!raw || typeof raw !== "object") return null;
                if (needV && raw.v !== 1) return null;
                const days = {};
                const src =
                    raw.days &&
                    typeof raw.days === "object" &&
                    !Array.isArray(raw.days)
                        ? raw.days
                        : null;
                if (!src) return null;
                for (const k of Object.keys(src)) {
                    if (isDate(k) && isNum(src[k]) && src[k] >= 0)
                        days[k] = src[k];
                }
                return {
                    goal: isNum(raw.goal) && raw.goal >= 0 ? raw.goal : null,
                    days,
                };
            }
            function todayFrom(meta) {
                const t = meta && meta[LOCAL_TODAY_META_KEY];
                return t && t.v === 1 && isDate(t.today) ? t.today : null;
            }
            // Fallback when the host dropped `_meta`: the viewer's own date.
            function deviceToday() {
                const now = new Date();
                const p = (n) => String(n).padStart(2, "0");
                return `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
            }

            // ---- the nutrients, in strip order ------------------------------
            // [key, strings key, unit code, emoji, ceiling?, averaging]
            // 'all' = averaged over the logged days (says "days logged"),
            // 'rec' = over the days that recorded it ("days recorded").
            const DEF = [
                ["calories", "calories", "kcal", "🔥", true, "all"],
                ["protein", "protein", "g", "🥩", false, "all"],
                ["carbs", "carbs", "g", "🍞", false, "all"],
                ["fat", "fat", "g", "🥑", false, "all"],
                ["fiber", "fiber", "g", "🌾", false, "rec"],
                ["sugar", "sugar", "g", "🍬", true, "rec"],
                ["added-sugar", "addedSugar", "g", "🍭", true, "rec"],
                ["saturated", "saturated", "g", "🧈", true, "rec"],
                ["trans", "trans", "g", "🍟", false, "rec"],
                ["sodium", "sodium", "mg", "🧂", true, "rec"],
                ["caffeine", "caffeine", "mg", "☕", true, "rec"],
                ["water", "water", "L", "💧", false, "all"],
                ["alcohol", "alcohol", "drinks", "🍷", true, "rec"],
            ];
            // Never offered when not one day of the 30 recorded them.
            const HIDE_IF_NEVER = ["trans", "caffeine", "alcohol"];
            // Calories' colour is the calorie gauge's green (the design's
            // --kcal); every other nutrient has its own token.
            const colourOf = (k) =>
                k === "calories" ? "var(--gauge-fill)" : `var(--${k})`;
            const varsOf = (k) => `--mc: ${colourOf(k)}`;

            // ---- state -------------------------------------------------------
            // level: 0 collapsed, 1 cards shown, 2 one card open (sel).
            const STATE = {
                data: null,
                model: null,
                periods: null,
                mode: "days",
                range: 30,
                metric: "calories",
                level: 0,
                sel: null,
                day: null,
                dayOpen: null,
                all: false,
                closing: false,
            };
            let __widgetApi = null;
            let painted = false;

            // ---- formatting ----------------------------------------------------
            const NF = {};
            function nf(d) {
                const k = WIDGET_LOCALE + d;
                if (!NF[k]) {
                    try {
                        NF[k] = new Intl.NumberFormat(WIDGET_LOCALE, {
                            minimumFractionDigits: d,
                            maximumFractionDigits: d,
                        });
                    } catch (_) {
                        NF[k] = new Intl.NumberFormat("en", {
                            minimumFractionDigits: d,
                            maximumFractionDigits: d,
                        });
                    }
                }
                return NF[k];
            }
            // L one decimal; kcal and mg whole; anything else one decimal
            // under 10 when it is not whole, else whole.
            function fmtU(u, v) {
                if (v == null) return "—";
                if (u === "L") return nf(1).format(v);
                if (u === "kcal" || u === "mg") return nf(0).format(v);
                return v < 10 && Math.abs(v - Math.round(v)) > 0.05
                    ? nf(1).format(v)
                    : nf(0).format(v);
            }
            function pctF(p) {
                try {
                    return new Intl.NumberFormat(WIDGET_LOCALE, {
                        style: "percent",
                        maximumFractionDigits: 0,
                    }).format(p / 100);
                } catch (_) {
                    return Math.round(p) + "%";
                }
            }
            function unitOf(u) {
                if (u === "drinks") {
                    const du = STATE.model && STATE.model.drinkUnit;
                    return (T.trends.drinkUnit && T.trends.drinkUnit[du]) || u;
                }
                const units = (T.macros && T.macros.units) || {};
                return units[u] || u;
            }
            const withU = (u, v) => fmtU(u, v) + " " + unitOf(u);
            // tpl() with some values already HTML (a bold figure); every
            // other part of the template is escaped.
            function tplHtml(s, html) {
                return String(s)
                    .split(/(\{\w+\})/)
                    .map((part) => {
                        const m = /^\{(\w+)\}$/.exec(part);
                        return m && html[m[1]] != null ? html[m[1]] : esc(part);
                    })
                    .join("");
            }

            // Dates arrive as local YYYY-MM-DD; read them at UTC noon and
            // format in UTC so no timezone can move them a day.
            const DF = {};
            function dfmt(iso, opts) {
                const k = WIDGET_LOCALE + JSON.stringify(opts);
                if (!DF[k]) {
                    const o = Object.assign({ timeZone: "UTC" }, opts);
                    try {
                        DF[k] = new Intl.DateTimeFormat(WIDGET_LOCALE, o);
                    } catch (_) {
                        DF[k] = new Intl.DateTimeFormat("en", o);
                    }
                }
                return DF[k].format(new Date(iso + "T12:00:00Z"));
            }
            const wdShort = (iso) => dfmt(iso, { weekday: "short" });
            const dShort = (iso) =>
                dfmt(iso, { day: "numeric", month: "short" });
            const domOf = (iso) => dfmt(iso, { day: "numeric" });
            const dLong = (iso) =>
                dfmt(iso, { weekday: "short", day: "numeric", month: "short" });
            function spanOf(a, b) {
                const o = { day: "numeric", month: "short", timeZone: "UTC" };
                try {
                    const f = new Intl.DateTimeFormat(WIDGET_LOCALE, o);
                    if (typeof f.formatRange === "function")
                        return f.formatRange(
                            new Date(a + "T12:00:00Z"),
                            new Date(b + "T12:00:00Z"),
                        );
                } catch (_) {}
                return dShort(a) + " – " + dShort(b);
            }

            // ---- the model: 30 days of every nutrient -----------------------
            function buildModel(data, meta) {
                const days = (Array.isArray(data.days) ? data.days : [])
                    .filter((d) => d && isDate(d.date))
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1))
                    .slice(-30);
                const num = (v) => (isNum(v) && v >= 0 ? v : 0);
                const opt = (v) => (isNum(v) && v >= 0 ? v : null);
                const drinkUnit =
                    data.drink_unit === "us" || data.drink_unit === "uk"
                        ? data.drink_unit
                        : null;
                const g =
                    data.goals && typeof data.goals === "object"
                        ? data.goals
                        : {};
                const goalOf = (v) => (isNum(v) && v >= 0 ? v : null);
                const added = seriesPayload(
                    meta && meta[ADDED_SUGAR_META_KEY],
                    true,
                );
                const satRaw = meta && meta[SATURATED_FAT_META_KEY];
                const sat = seriesPayload(satRaw, true);
                const trans =
                    sat && satRaw && satRaw.trans
                        ? seriesPayload(satRaw.trans, false)
                        : null;
                const sodium = seriesPayload(
                    meta && meta[SODIUM_META_KEY],
                    true,
                );
                const mealDay = days.map(
                    (d) =>
                        num(d.calories) > 0 ||
                        num(d.protein_g) > 0 ||
                        num(d.carbs_g) > 0 ||
                        num(d.fat_g) > 0,
                );
                const logged = days.map(
                    (d, i) => mealDay[i] || num(d.water_ml) > 0,
                );
                const meal = (k) =>
                    days.map((d, i) => (mealDay[i] ? num(d[k]) : null));
                const rec = (k) =>
                    days.map((d, i) => (logged[i] ? opt(d[k]) : null));
                const fromMeta = (p) =>
                    p
                        ? days.map((d, i) =>
                              logged[i] && d.date in p.days
                                  ? p.days[d.date]
                                  : null,
                          )
                        : null;
                const perDrink = drinkUnit ? DRINK_GRAMS[drinkUnit] : null;
                const series = {
                    calories: meal("calories"),
                    protein: meal("protein_g"),
                    carbs: meal("carbs_g"),
                    fat: meal("fat_g"),
                    fiber: rec("fiber_g"),
                    sugar: rec("sugar_g"),
                    "added-sugar": fromMeta(added),
                    saturated: fromMeta(sat),
                    trans: fromMeta(trans),
                    sodium: fromMeta(sodium),
                    caffeine: rec("caffeine_mg"),
                    water: days.map((d, i) =>
                        logged[i] ? num(d.water_ml) / 1000 : null,
                    ),
                    // Alcohol only while tracking is on (the server nulls it
                    // otherwise), in the account's drink unit.
                    alcohol: perDrink
                        ? rec("alcohol_g").map((v) =>
                              v == null ? null : v / perDrink,
                          )
                        : null,
                };
                const goals = {
                    calories: goalOf(g.calories),
                    protein: goalOf(g.protein_g),
                    carbs: goalOf(g.carbs_g),
                    fat: goalOf(g.fat_g),
                    fiber: goalOf(g.fiber_g),
                    sugar: goalOf(g.sugar_g),
                    "added-sugar": added ? added.goal : null,
                    saturated: sat ? sat.goal : null,
                    trans: null,
                    sodium: sodium ? sodium.goal : null,
                    caffeine: goalOf(g.caffeine_mg),
                    water:
                        goalOf(g.water_ml) == null ? null : g.water_ml / 1000,
                    alcohol:
                        perDrink && goalOf(g.alcohol_g) != null
                            ? g.alcohol_g / perDrink
                            : null,
                };
                const today = todayFrom(meta) || deviceToday();
                return {
                    days,
                    dates: days.map((d) => d.date),
                    logged,
                    series,
                    goals,
                    drinkUnit,
                    endsToday:
                        days.length > 0 && days[days.length - 1].date === today,
                    anyLogged: logged.some(Boolean),
                };
            }

            // One nutrient over the current window.
            function statOf(def, W) {
                const [key, sk, u, emoji, ceil, mode] = def;
                const M = STATE.model;
                const all30 = M.series[key] || M.days.map(() => null);
                const vals = all30.slice(-W.n);
                const g = M.goals[key];
                const isPart = (i) => W.endsToday && i === W.n - 1;
                const rec = vals.filter((v) => v != null);
                const fullV = vals.filter((v, i) => v != null && !isPart(i));
                const full = fullV.length ? fullV : rec;
                const partEx = full.length < rec.length;
                const never = all30.every((v) => v == null);
                const nr = rec.length === 0;
                const avg = nr
                    ? null
                    : full.reduce((a, b) => a + b, 0) / full.length;
                const hasGoal = g != null && !nr;
                const band = key === "calories" ? 1.1 : 1;
                const over = hasGoal && ceil && avg > g * band;
                const nearT = (v) => Math.abs(v - g) <= 0.1 * g;
                const limitLike = ceil && key !== "calories";
                const onT = hasGoal
                    ? full.filter((v) => (limitLike ? v <= g : nearT(v))).length
                    : 0;
                const overN =
                    hasGoal && ceil ? full.filter((v) => v > g).length : 0;
                // Trend: the second half of the window against the first,
                // finished days only.
                const tv = vals.map((v, i) => (isPart(i) ? null : v));
                const h = Math.floor(W.n / 2);
                const h1 = tv.slice(0, h).filter((v) => v != null);
                const h2 = tv.slice(h).filter((v) => v != null);
                const av = (a) => a.reduce((x, y) => x + y, 0) / a.length;
                let dTxt = "";
                let dCls = "zero";
                if (!nr && h1.length && h2.length) {
                    const dd = av(h2) - av(h1);
                    const thr = 0.04 * (g || avg || 1);
                    if (
                        Math.abs(dd) < thr ||
                        /^0([.,]0)?$/.test(fmtU(u, Math.abs(dd)))
                    ) {
                        dTxt = T.trends.steady;
                    } else {
                        dTxt = (dd > 0 ? "↑ " : "↓ ") + withU(u, Math.abs(dd));
                        dCls = "up";
                    }
                }
                return {
                    key,
                    u,
                    emoji,
                    ceil,
                    mode,
                    g,
                    vals,
                    rec,
                    full,
                    partEx,
                    never,
                    nr,
                    avg,
                    hasGoal,
                    over,
                    onT,
                    overN,
                    limitLike,
                    dTxt,
                    dCls,
                    label: T.trends.metricLabel[sk],
                    inTitle: T.trends.metricInTitle[sk],
                };
            }
            const isOv = (m, v) =>
                v != null &&
                m.hasGoal &&
                m.ceil &&
                v > m.g * (m.key === "calories" ? 1.1 : 1);
            const pctOf = (m, v) =>
                v != null && m.hasGoal && m.g > 0
                    ? Math.round((v / m.g) * 100)
                    : null;

            // ---- markup builders ---------------------------------------------
            function dayName(W, i) {
                return W.endsToday && i === W.n - 1
                    ? T.trends.today
                    : dLong(W.dates[i]);
            }
            function xLabels(W) {
                const n = W.n;
                const step = n <= 7 ? 1 : n <= 14 ? 2 : 7;
                const out = [];
                W.dates.forEach((iso, i) => {
                    if ((n - 1 - i) % step !== 0) return;
                    if (n > 14 && i < 3) return;
                    const td = W.endsToday && i === n - 1;
                    const txt = td
                        ? T.trends.today
                        : n <= 7
                          ? wdShort(iso)
                          : n <= 14
                            ? domOf(iso)
                            : dShort(iso);
                    const cls =
                        (i === n - 1 ? "en" : i === 0 ? "st" : "") +
                        (td ? " td" : "");
                    out.push(
                        `<span class="${cls}" style="grid-column: ${i + 1}">${esc(txt)}</span>`,
                    );
                });
                return out.join("");
            }
            function chartOf(m, W, kind, sel) {
                const n = W.n;
                const mx =
                    Math.max(
                        ...m.vals.map((v) => v || 0),
                        m.hasGoal ? m.g : 0,
                        0.0001,
                    ) * 1.1;
                const ncls = "n" + (n <= 7 ? 7 : n <= 14 ? 14 : 30);
                const bars = m.vals
                    .map((v, i) => {
                        const s = i === sel;
                        const ov = isOv(m, v);
                        const cls =
                            (s ? " sel" : "") +
                            (ov ? " ov" : "") +
                            (v == null ? " nr" : "");
                        const what =
                            v == null
                                ? W.logged[i]
                                    ? T.trends.notRecorded
                                    : T.trends.nothingLogged
                                : withU(m.u, v);
                        const aria = tpl(T.trends.dayAria, {
                            day: dayName(W, i),
                            value: what,
                        });
                        const h = v == null ? 0 : ((v / mx) * 100).toFixed(1);
                        const delay = (
                            0.15 +
                            (0.9 * i) / Math.max(n - 1, 1)
                        ).toFixed(2);
                        return `<button type="button" class="reset cb${cls}" data-act="day" data-i="${i}" data-fid="${kind}-day-${i}" aria-pressed="${s}" aria-label="${esc(aria)}"><span class="ctrk"><span class="cfill" style="height: ${h}%; animation-delay: ${delay}s"></span></span></button>`;
                    })
                    .join("");
                const sv = m.vals[sel];
                const td = W.endsToday && sel === n - 1;
                const pct = pctOf(m, sv);
                const rDay =
                    td && sv != null
                        ? tpl(T.trends.daySoFar, { day: dayName(W, sel) })
                        : dayName(W, sel);
                const rUnit =
                    sv == null
                        ? W.logged[sel]
                            ? T.trends.notRecorded
                            : T.trends.nothingLogged
                        : unitOf(m.u) + (pct != null ? " · " + pctF(pct) : "");
                const goalY = m.hasGoal ? ((m.g / mx) * 100).toFixed(1) : "0";
                const title = tpl(T.trends.chartTitle, { metric: m.label });
                return `
          <div class="ch ${kind} ${ncls}" role="group" aria-label="${esc(tpl(T.trends.chartAria, { metric: m.label, n }))}">
            <div class="chd"><span class="chl">${esc(title)}</span><span class="chr num">${esc(rDay)} · <b class="${isOv(m, sv) ? "over" : ""}">${esc(sv == null ? "—" : fmtU(m.u, sv))}</b> ${esc(rUnit)}</span></div>
            <div class="cbody">
              <div class="cyl" aria-hidden="true">${m.hasGoal ? `<span class="num" style="bottom: ${goalY}%">${esc(fmtU(m.u, m.g))}</span>` : ""}</div>
              <div class="cplot">${m.hasGoal ? `<div class="cgoal" style="bottom: ${goalY}%"></div>` : ""}<div class="cbars" style="grid-template-columns: repeat(${n}, minmax(0, 1fr))">${bars}</div></div>
            </div>
            <div class="cx num" aria-hidden="true" style="grid-template-columns: repeat(${n}, minmax(0, 1fr))">${xLabels(W)}</div>
          </div>`;
            }

            // The odometer: each digit a reel of 0–9,0 translated by -y em.
            // Painted at its final value; runReel() spins it in from rAF, so a
            // renderer without animation frames (the landing page's static
            // cards) keeps the true figure.
            function reelHtml(str) {
                let di = 0;
                return str
                    .split("")
                    .map((ch) => {
                        if (!/[0-9]/.test(ch)) return `<span>${esc(ch)}</span>`;
                        const i = di++;
                        return `<span class="rl"><span class="rs" data-d="${ch}" data-i="${i}" style="transform: translateY(-${ch}em)"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span>0</span></span></span>`;
                    })
                    .join("");
            }
            const reduced = () => {
                try {
                    return (
                        !!window.matchMedia &&
                        window.matchMedia("(prefers-reduced-motion: reduce)")
                            .matches
                    );
                } catch (_) {
                    return true;
                }
            };
            let reelId = 0;
            function runReel(ms) {
                if (reduced() || typeof requestAnimationFrame !== "function")
                    return;
                const id = ++reelId;
                const first = 0.5;
                const eo = (x) => 1 - Math.pow(1 - x, 3);
                const card = document.getElementById("tw");
                if (!card || typeof card.querySelectorAll !== "function")
                    return;
                const reels = Array.from(card.querySelectorAll(".hnum .rs"));
                if (!reels.length) return;
                let t0 = null;
                // Frame 0 at once, so the true figure never flashes first.
                const put = (at) => {
                    const nd = reels.length;
                    const stepR = nd > 1 ? (1 - first) / (nd - 1) : 0;
                    for (const el of reels) {
                        const i = Number(el.dataset.i);
                        const stop = Math.min(first + stepR * i, 1);
                        const lt = Math.min(at / stop, 1);
                        const r =
                            Number(el.dataset.d) +
                            (10 * (3 + i) + 5) * (1 - eo(lt));
                        el.style.transform = `translateY(-${(r % 10).toFixed(3)}em)`;
                    }
                };
                const step = (now) => {
                    if (id !== reelId) return;
                    if (t0 === null) t0 = now;
                    const at = Math.min((now - t0) / ms, 1);
                    put(at);
                    if (at < 1) requestAnimationFrame(step);
                };
                put(0);
                requestAnimationFrame(step);
            }

            function dayList(m, W) {
                const n = W.n;
                const idx = W.dates.map((d, i) => i).reverse();
                const shown = STATE.all || n <= 7 ? idx : idx.slice(0, 7);
                const OTHERS = ["calories", "protein", "carbs", "fat", "water"];
                const rows = shown
                    .map((i) => {
                        const v = m.vals[i];
                        const td = W.endsToday && i === n - 1;
                        const lg = W.logged[i];
                        const open = STATE.dayOpen === i && lg;
                        let meta;
                        let metaCls = "";
                        const pct = pctOf(m, v);
                        if (!lg) meta = T.trends.nothingLogged;
                        else if (v == null) meta = T.trends.notRecorded;
                        else if (!m.hasGoal) meta = T.trends.noGoal;
                        else if (isOv(m, v)) {
                            meta = tpl(
                                m.limitLike
                                    ? T.trends.amountOverLimit
                                    : T.trends.amountOverGoal,
                                { amount: withU(m.u, v - m.g) },
                            );
                            metaCls = " over";
                        } else if (pct == null) meta = T.trends.noGoal;
                        else if (!m.limitLike && Math.abs(v - m.g) <= 0.1 * m.g)
                            meta = tpl(T.trends.onTargetPct, {
                                pct: pctF(pct),
                            });
                        else
                            meta = tpl(
                                m.limitLike
                                    ? T.trends.pctOfLimit
                                    : T.trends.pctOfGoal,
                                { pct: pctF(pct) },
                            );
                        if (td && lg) meta += " · " + T.trends.soFar;
                        const ring =
                            v == null
                                ? 0
                                : Math.min(
                                      m.hasGoal && m.g > 0
                                          ? (v / m.g) * 100
                                          : 100,
                                      100,
                                  );
                        const cls =
                            (lg ? "" : " unl") +
                            (td ? " cur" : "") +
                            (isOv(m, v) ? " ov" : "");
                        const inner = `<span class="nmf">${esc(dayName(W, i))}<span class="mmeta${metaCls}">${esc(meta)}</span></span><span class="mring" aria-hidden="true"><svg viewBox="0 0 24 24"><circle class="rt" cx="12" cy="12" r="9" style="fill: none; stroke-width: 5"></circle><circle class="ra" cx="12" cy="12" r="9" pathLength="100" transform="rotate(-90 12 12)" style="fill: none; stroke-linecap: round; stroke-dasharray: ${ring.toFixed(1)} 100; stroke-width: ${v ? 5 : 0}"></circle></svg></span><b class="num">${esc(fmtU(m.u, v))} <span>${v == null ? "" : esc(unitOf(m.u))}</span></b><svg class="mc${lg ? (open ? " open" : "") : " hide"}" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round"><path d="M9 6l6 6-6 6"></path></svg>`;
                        // A day with nothing logged has nothing to open.
                        if (!lg) return `<div class="mlg${cls}">${inner}</div>`;
                        let panel = "";
                        if (open) {
                            const items = OTHERS.filter(
                                (k) => k !== m.key && STATE.model.series[k],
                            )
                                .map((k) => {
                                    const def = DEF.find((d) => d[0] === k);
                                    const o = statOf(def, W);
                                    const ov = o.vals[i];
                                    const p = pctOf(o, ov);
                                    const im =
                                        ov == null
                                            ? T.trends.notRecorded
                                            : p == null
                                              ? T.trends.noGoal
                                              : tpl(T.trends.pctOfGoal, {
                                                    pct: pctF(p),
                                                });
                                    return `<div class="itr"><span>${esc(o.label)}</span><span class="iv num">${esc(ov == null ? "—" : withU(o.u, ov))}</span><span class="im">${esc(im)}</span></div>`;
                                })
                                .join("");
                            panel = `<div class="itl">${items}</div>`;
                        }
                        return `<button type="button" class="reset mlg${cls}" data-act="dayopen" data-i="${i}" data-fid="dayopen-${i}" aria-expanded="${open}">${inner}</button>${panel}`;
                    })
                    .join("");
                const more =
                    !STATE.all && n > 7
                        ? `<button type="button" class="reset pmore" data-act="all" data-fid="all">${esc(tpl(T.trends.showAllDays, { n }))}<svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg></button>`
                        : "";
                return `<div class="mls">${rows}</div>${more}`;
            }
            function chipsOf(m, W) {
                if (m.nr) return "";
                let pairs = m.vals
                    .map((v, i) => [v, i])
                    .filter((p) => p[0] != null);
                if (pairs.length > 1)
                    pairs = pairs.filter(
                        (p) => !(W.endsToday && p[1] === W.n - 1),
                    );
                const hi = pairs.reduce((a, b) => (b[0] > a[0] ? b : a));
                const lo = pairs.reduce((a, b) => (b[0] < a[0] ? b : a));
                const dayOf = (i) =>
                    W.endsToday && i === W.n - 1
                        ? T.trends.today
                        : dShort(W.dates[i]);
                const chip = (cls, s, vars) =>
                    `<span class="${cls}">${tplHtml(s, vars)}</span>`;
                const out = [
                    chip(isOv(m, hi[0]) ? "bad" : "", T.trends.chipHigh, {
                        value: `<b>${esc(withU(m.u, hi[0]))}</b>`,
                        day: esc(dayOf(hi[1])),
                    }),
                ];
                if (hi[1] !== lo[1])
                    out.push(
                        chip("", T.trends.chipLow, {
                            value: `<b>${esc(withU(m.u, lo[0]))}</b>`,
                            day: esc(dayOf(lo[1])),
                        }),
                    );
                if (m.hasGoal) {
                    const M = m.full.length;
                    const k = m.limitLike ? m.overN : m.onT;
                    const forms = m.limitLike
                        ? T.trends.chipOverLimit
                        : T.trends.chipOnTarget;
                    out.push(
                        chip(
                            m.limitLike && m.overN ? "bad" : "",
                            plural(forms, M, { value: "{value}" }),
                            {
                                value: `<b>${esc(nf(0).format(k) + " / " + nf(0).format(M))}</b>`,
                            },
                        ),
                    );
                }
                return out.join("");
            }

            function heroHtml(hm, W) {
                const hU = hm.u;
                const has = !hm.nr;
                const hNum = has ? fmtU(hU, hm.avg) : "—";
                const unitDay = tpl(T.trends.perDay, { unit: unitOf(hU) });
                const pct = has ? pctOf(hm, hm.avg) : null;
                const pctB = `<b>${esc(pct == null ? "—" : pctF(pct))}</b>`;
                const goalTxt = hm.hasGoal ? esc(withU(hU, hm.g)) : "";
                const goalLine = !hm.hasGoal
                    ? esc(T.trends.heroNoGoal)
                    : tplHtml(
                          hm.limitLike
                              ? T.trends.heroLimit
                              : pct != null && pct > 100
                                ? T.trends.heroGoalOver
                                : T.trends.heroGoal,
                          { goal: goalTxt, pct: pctB },
                      );
                const hd = hm.hasGoal ? hm.avg - hm.g : 0;
                const word = !hm.hasGoal
                    ? T.trends.noGoalSet
                    : hm.limitLike
                      ? hd > 0
                          ? T.trends.overLimit
                          : T.trends.underLimit
                      : hd > 0
                        ? T.trends.overGoal
                        : T.trends.belowGoal;
                const leftCls = hm.over ? "over" : hd > 0 ? "nt" : "";
                const recWord =
                    hm.mode === "rec"
                        ? T.trends.daysRecordedWord
                        : T.trends.daysLoggedWord;
                const delta = `<div class="gdelta num"><b>${esc(tpl(T.trends.loggedOf, { a: nf(0).format(hm.rec.length), n: nf(0).format(W.n) }))}</b> ${esc(recWord)}<span class="dot">·</span>${hm.hasGoal ? `<b class="${leftCls}">${esc(withU(hU, Math.abs(hd)))}</b> ` : ""}${esc(word)}</div>`;
                const frac = (a, b) =>
                    `${nf(0).format(a)} / ${nf(0).format(b)}`;
                const daysW = (n) => esc(plural(T.trends.daysUnit, n));
                const statLabel = !hm.hasGoal
                    ? T.trends.statNoGoal
                    : hm.limitLike
                      ? hd > 0
                          ? T.trends.statOverLimit
                          : T.trends.statUnderLimit
                      : hd > 0
                        ? T.trends.statOverGoal
                        : T.trends.statBelowGoal;
                const onLab = hm.limitLike
                    ? T.trends.statDaysOverLimit
                    : T.trends.statOnTarget;
                const onN = hm.limitLike ? hm.overN : hm.onT;
                const stats = `
            <div class="gstats">
              <div class="gs"><span class="gsl">${esc(hm.mode === "rec" ? T.trends.statDaysRecorded : T.trends.statDaysLogged)}</span><b class="num">${frac(hm.rec.length, W.n)} <small>${daysW(W.n)}</small></b></div>
              <div class="gs"><span class="gsl">${esc(onLab)}</span><b class="num${hm.limitLike && hm.overN ? " over" : ""}">${hm.hasGoal ? frac(onN, hm.full.length) : "—"} ${hm.hasGoal ? `<small>${daysW(hm.full.length)}</small>` : ""}</b></div>
              <div class="gs"><span class="gsl">${esc(statLabel)}</span><b class="num${hm.over ? " over" : ""}">${hm.hasGoal ? esc(fmtU(hU, Math.abs(hd))) : "—"} ${hm.hasGoal ? `<small>${esc(unitOf(hU))}</small>` : ""}</b></div>
            </div>`;
                const aria = `${T.trends.avgWord} ${hNum} ${unitDay}`;
                return {
                    top: `
          <div class="dnum">
            <div class="dnL">
              <div class="hnum${hm.over ? " over" : ""}"><span class="hp">${esc(T.trends.avgWord)}</span><span class="gnum num" role="img" aria-label="${esc(aria)}">${reelHtml(hNum)}</span><span class="hu num">${esc(unitDay)}</span></div>
              <div class="hgoal num">${goalLine}</div>
              ${hm.partEx ? `<div class="hnote">${esc(T.trends.todayNote)}</div>` : ""}
            </div>${stats}
          </div>`,
                    delta,
                };
            }

            function cardsHtml(visible, W) {
                const selK = STATE.sel;
                // Desktop grid balance: three cards a row, the trailing ones
                // widened so no row is left with an orphan.
                const unsel = visible
                    .filter((m) => m.key !== selK)
                    .map((m) => m.key);
                const remR = unsel.length % 3;
                const halfK =
                    remR === 1 && unsel.length >= 4
                        ? unsel.slice(-4)
                        : remR === 2
                          ? unsel.slice(-2)
                          : [];
                const n = W.n;
                return visible
                    .map((m) => {
                        const sel = selK === m.key;
                        const gauge =
                            m.nr || !m.hasGoal || !(m.g > 0)
                                ? 0
                                : Math.max(0, Math.min(m.avg / m.g, 1)) * 100;
                        const smx =
                            Math.max(
                                ...m.vals.map((v) => v || 0),
                                m.hasGoal ? m.g : 0,
                                0.0001,
                            ) * 1.08;
                        const pct = m.nr ? null : pctOf(m, m.avg);
                        const stCls = m.nr ? "dim" : m.over ? "over" : "";
                        const slash = m.nr
                            ? " · " + T.trends.notRecorded
                            : m.hasGoal
                              ? " / " + withU(m.u, m.g)
                              : " " + unitOf(m.u) + " · " + T.trends.noGoal;
                        const spark = m.vals
                            .map((v, i) => {
                                const td = i === n - 1 ? " td" : "";
                                const h =
                                    v == null
                                        ? 0
                                        : Math.max(
                                              (v / smx) * 100,
                                              v > 0 ? 16 : 0,
                                          ).toFixed(1);
                                return `<span class="${td}${v == null ? " nr" : ""}${isOv(m, v) ? " ov" : ""}" style="height: ${h}%"></span>`;
                            })
                            .join("");
                        let body = "";
                        if (sel) {
                            body = m.nr
                                ? `<div class="accB"><div class="msg">${esc(tpl(T.trends.notRecordedInRange, { metric: m.label }))}</div></div>`
                                : `<div class="accB"><div class="nwrap"><div class="nleft">${chartOf(m, W, "nut", selDay(W))}<div class="nstat num">${chipsOf(m, W)}</div></div><div class="nright">${dayList(m, W)}</div></div></div>`;
                        }
                        const cls =
                            (sel ? " sel" : "") +
                            (m.over ? " over" : "") +
                            (halfK.includes(m.key) ? " half" : "");
                        return `<div class="acc${cls}" data-key="${m.key}" style="${varsOf(m.key)}"><button type="button" class="reset accH" data-act="acc" data-k="${m.key}" data-fid="acc-${m.key}" aria-expanded="${sel}"><span class="em" aria-hidden="true">${m.emoji}</span><span class="ab"><span class="lb"><span class="lbn">${esc(m.label)}</span><span class="dl num ${m.dCls}">${esc(m.dTxt)}</span></span><span class="vl num"><b class="${stCls}">${esc(m.nr ? "—" : fmtU(m.u, m.avg))}</b><span class="gl">${esc(slash)}</span></span></span><span class="mg"><svg viewBox="0 0 60 34" aria-hidden="true"><path class="mgt" d="M 6 30 A 24 24 0 0 1 54 30" pathLength="100" style="fill: none; stroke-width: 11; stroke-linecap: round"></path><path class="mga" d="M 6 30 A 24 24 0 0 1 54 30" pathLength="100" style="fill: none; stroke-width: ${gauge > 0 ? 7 : 0}; stroke-linecap: round; stroke-dasharray: ${gauge.toFixed(1)} 100"></path></svg><b class="num ${stCls}">${esc(pct == null ? "—" : pctF(pct))}</b></span><svg class="achev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M6 9l6 6 6-6"></path></svg><span class="spk" aria-hidden="true">${m.hasGoal ? `<i style="bottom: ${((m.g / smx) * 100).toFixed(1)}%"></i>` : ""}${spark}</span></button>${body}</div>`;
                    })
                    .join("");
            }

            function windowOf() {
                const M = STATE.model;
                const n = Math.min(STATE.range, M.days.length);
                return {
                    n,
                    dates: M.dates.slice(-n),
                    logged: M.logged.slice(-n),
                    endsToday: M.endsToday,
                };
            }
            const selDay = (W) =>
                STATE.day == null ? W.n - 1 : Math.min(STATE.day, W.n - 1);

            // The day view's card markup (without its own wrapper element).
            function cardInner() {
                const M = STATE.model;
                const W = windowOf();
                const ALL = DEF.map((d) => statOf(d, W));
                // A nutrient with no data source at all (no `_meta`, alcohol
                // tracking off) is never offered; trans fat, caffeine and
                // alcohol also not when none of the 30 days recorded them.
                const visible = ALL.filter(
                    (m) =>
                        M.series[m.key] &&
                        !(m.never && HIDE_IF_NEVER.includes(m.key)),
                );
                const swList = visible.filter((m) => !m.nr);
                const cal = ALL[0];
                const hm = swList.find((m) => m.key === STATE.metric) || cal;
                STATE.metric = hm.key;
                const title = tpl(T.trends.titleMetric, {
                    n: W.n,
                    metric: hm.inTitle,
                });
                const L = STATE.level;
                if (!M.anyLogged) {
                    return {
                        vars: varsOf("calories"),
                        html: `
          <div class="hrow"><div class="gtop"><span class="t">${esc(title)}</span></div></div>
          <div class="tempty"><span class="big" aria-hidden="true">📈</span><b>${esc(T.trends.emptyTitle)}</b><span>${esc(T.trends.emptyBody)}</span></div>`,
                    };
                }
                const eyebrow =
                    tpl(W.endsToday ? T.trends.lastNDays : T.trends.nDays, {
                        n: W.n,
                    }) + " · ";
                const span = spanOf(W.dates[0], W.dates[W.n - 1]).replace(
                    / /g,
                    " ",
                );
                const pills = RANGES.map((r) => {
                    const on = r === STATE.range;
                    return `<button type="button" class="reset rpill num${on ? " on" : ""}" data-act="range" data-r="${r}" data-fid="range-${r}" aria-pressed="${on}" aria-label="${esc(tpl(T.trends.pillAria, { n: r }))}">${esc(tpl(T.trends.pill, { n: r }))}</button>`;
                }).join("");
                const chips = swList
                    .map((m) => {
                        const on = m.key === hm.key;
                        return `<button type="button" class="reset mchip${on ? " on" : ""}" style="${varsOf(m.key)}" data-act="metric" data-k="${m.key}" data-fid="metric-${m.key}" aria-pressed="${on}"><span class="e" aria-hidden="true">${m.emoji}</span><span>${esc(m.label)}</span></button>`;
                    })
                    .join("");
                const chev = (dir) =>
                    `<svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round"><path d="${dir < 0 ? "M15 6l-6 6 6 6" : "M9 6l6 6-6 6"}"></path></svg>`;
                const hero = heroHtml(hm, W);
                const swS = STATE.swS || "start";
                const open = L >= 1;
                const html = `
          <div class="hrow"><button type="button" class="reset gtop" data-act="toggle" data-fid="gtop" aria-expanded="${open}"><span class="eyb2">${esc(eyebrow)}<span class="nw">${esc(span)}</span></span><span class="t">${esc(title)}</span></button><div class="rseg" role="group" aria-label="${esc(T.trends.windowAriaLabel)}">${pills}</div></div>
          <div class="mswW" data-s="${swS}"><button type="button" class="reset msa l" data-act="swl" aria-label="${esc(T.trends.scrollLeft)}"${arrowOff(swS, "l") ? ARROW_OFF : ""}>${chev(-1)}</button><div class="msw" role="group" aria-label="${esc(T.trends.metricsAria)}">${chips}</div><button type="button" class="reset msa r" data-act="swr" aria-label="${esc(T.trends.scrollRight)}"${arrowOff(swS, "r") ? ARROW_OFF : ""}>${chev(1)}</button></div>
          ${hero.top}
          ${chartOf(hm, W, "hero", selDay(W))}
          ${hero.delta}
          <button type="button" class="reset bigchev" data-act="toggle" data-fid="bigchev" aria-expanded="${open}"><span>${esc(open ? T.trends.showLess : T.trends.showMore)}</span><svg class="nchev${open ? " open" : ""}" width="14" height="9" viewBox="0 0 34 22" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 6.5; stroke-linecap: round; stroke-linejoin: round"><path d="M5 5l12 12 12-12"></path></svg></button>
          ${open ? `<div class="rows">${cardsHtml(visible, W)}</div><button type="button" class="reset collall" data-act="collapse" data-fid="collall"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"><path d="M7 11l5-5 5 5"></path><path d="M7 18l5-5 5 5"></path></svg><span>${esc(T.trends.collapseAll)}</span></button>` : ""}`;
                return { vars: varsOf(hm.key), html };
            }

            // ---- painting ------------------------------------------------------
            function periodSeg() {
                const p = STATE.periods;
                const label = {
                    week: [T.trends.segWeek, T.trends.segWeekAria],
                    month: [T.trends.segMonth, T.trends.segMonthAria],
                    quarter: [T.trends.segQuarter, T.trends.segQuarterAria],
                    year: [T.trends.segYear, T.trends.segYearAria],
                    days: [T.trends.segDays, T.trends.segDaysAria],
                };
                return `<div class="seg seg-sm" role="group" aria-label="${esc(T.trends.windowAriaLabel)}">${p.available
                    .concat(["days"])
                    .map((id) => {
                        const on = id === STATE.mode;
                        return `<button class="seg-btn${on ? " active" : ""}" data-mode="${id}" aria-pressed="${on}" aria-label="${esc(label[id][1])}">${esc(label[id][0])}</button>`;
                    })
                    .join("")}</div>`;
            }
            function periodHtml() {
                const p = STATE.periods;
                const g = STATE.mode;
                const title = {
                    week: T.trends.periodTitleWeek,
                    month: T.trends.periodTitleMonth,
                    quarter: T.trends.periodTitleQuarter,
                    year: T.trends.periodTitleYear,
                }[g];
                return `
          <div class="panel">
            <div class="phead mid">
              <div class="ptitle">${esc(title)}</div>
              ${periodSeg()}
            </div>
            ${periodListHtml(p.periods[g], g, { targetsFrom: p.targetsFrom })}
          </div>`;
            }
            function cardHtml(flags) {
                const c = cardInner();
                const cls =
                    "gcard" +
                    (painted ? " calm" : "") +
                    (STATE.closing ? " closing" : "") +
                    flags.map((f) => " f-" + f).join("");
                return `<div class="${cls}" id="tw" style="${c.vars}">${c.html}</div>`;
            }
            // The whole view: what render() writes into #root.
            function viewHtml() {
                if (STATE.periods && STATE.mode !== "days") return periodHtml();
                const top = STATE.periods
                    ? `<div class="pbar">${periodSeg()}</div>`
                    : "";
                return top + cardHtml([]);
            }

            // Repaint after a tap: only the card, keeping the element (so
            // --mc cross-fades), the chip strip's scroll and the focus.
            function repaint(flags) {
                const card = document.getElementById("tw");
                if (!card || typeof card.querySelector !== "function") return;
                const strip = card.querySelector(".msw");
                const scroll = strip ? strip.scrollLeft : 0;
                const active = document.activeElement;
                const fid =
                    active && active.dataset ? active.dataset.fid : null;
                const c = cardInner();
                card.className =
                    "gcard calm" +
                    (STATE.closing ? " closing" : "") +
                    (flags || []).map((f) => " f-" + f).join("");
                card.setAttribute("style", c.vars);
                card.innerHTML = c.html;
                const s2 = card.querySelector(".msw");
                if (s2) {
                    s2.style.scrollBehavior = "auto";
                    s2.scrollLeft = scroll;
                    s2.style.scrollBehavior = "";
                }
                if (fid) {
                    const el = card.querySelector(`[data-fid="${fid}"]`);
                    if (el) el.focus({ preventScroll: true });
                }
                measureStrip();
            }

            // Whether a strip arrow is hidden in a scroll state (matches the
            // .mswW[data-s] rules in the CSS).
            const arrowOff = (s, side) =>
                s === "none" ||
                (s === "start" && side === "l") ||
                (s === "end" && side === "r");
            const ARROW_OFF = ' tabindex="-1" aria-hidden="true"';
            // Which ends of the chip strip have more chips (start | mid |
            // end | none) — drives the fade mask and the arrows.
            function measureStrip() {
                const card = document.getElementById("tw");
                if (!card || typeof card.querySelector !== "function") return;
                const wrap = card.querySelector(".mswW");
                const el = wrap && wrap.querySelector(".msw");
                if (!el || typeof el.scrollWidth !== "number") return;
                const max = el.scrollWidth - el.clientWidth;
                const s =
                    max <= 4
                        ? "none"
                        : el.scrollLeft <= 4
                          ? "start"
                          : el.scrollLeft >= max - 4
                            ? "end"
                            : "mid";
                STATE.swS = s;
                wrap.dataset.s = s;
                // A hidden arrow leaves the tab order and the a11y tree too,
                // not just the screen.
                for (const side of ["l", "r"]) {
                    const b = wrap.querySelector(".msa." + side);
                    if (!b) continue;
                    if (arrowOff(s, side)) {
                        // Focus never stays on an arrow that just vanished:
                        // it moves to the selected chip.
                        if (document.activeElement === b) {
                            const on = el.querySelector(".mchip.on");
                            if (on) on.focus({ preventScroll: true });
                        }
                        b.setAttribute("tabindex", "-1");
                        b.setAttribute("aria-hidden", "true");
                    } else {
                        b.removeAttribute("tabindex");
                        b.removeAttribute("aria-hidden");
                    }
                }
            }

            const desktop = () => {
                try {
                    return (
                        !!window.matchMedia &&
                        window.matchMedia("(min-width: 640px)").matches
                    );
                } catch (_) {
                    return false;
                }
            };
            // Desktop only: cards slide to their new grid places when one
            // opens or closes (FLIP), rather than jumping.
            function flip(apply) {
                const card = document.getElementById("tw");
                if (
                    !card ||
                    reduced() ||
                    !desktop() ||
                    typeof Element === "undefined" ||
                    !Element.prototype.animate
                ) {
                    apply();
                    return;
                }
                const q = () =>
                    Array.from(card.querySelectorAll(".rows .acc[data-key]"));
                const first = new Map(
                    q().map((e) => [e.dataset.key, e.getBoundingClientRect()]),
                );
                apply();
                const go = () =>
                    q().forEach((e) => {
                        const f = first.get(e.dataset.key);
                        if (!f) return;
                        const l = e.getBoundingClientRect();
                        const dx = f.left - l.left;
                        const dy = f.top - l.top;
                        const grow =
                            l.width - f.width > 2 || l.height - f.height > 2;
                        const shrink =
                            f.width - l.width > 2 || f.height - l.height > 2;
                        if (
                            Math.abs(dx) < 1 &&
                            Math.abs(dy) < 1 &&
                            !grow &&
                            !shrink
                        )
                            return;
                        const kf = [
                            { transform: `translate(${dx}px, ${dy}px)` },
                            { transform: "translate(0, 0)" },
                        ];
                        if (grow) {
                            kf[0].clipPath = `inset(0 ${Math.max(l.width - f.width, 0)}px ${Math.max(l.height - f.height, 0)}px 0 round 18px)`;
                            kf[1].clipPath = "inset(0 0 0 0 round 18px)";
                        }
                        e.animate(kf, {
                            duration: 560,
                            easing: "cubic-bezier(.22,1,.36,1)",
                        });
                    });
                requestAnimationFrame(() => requestAnimationFrame(go));
            }

            function collapse() {
                if (STATE.closing) return;
                const done = () => {
                    STATE.closing = false;
                    STATE.level = 0;
                    STATE.sel = null;
                    STATE.dayOpen = null;
                    STATE.all = false;
                    const lost =
                        !document.activeElement ||
                        document.activeElement === document.body;
                    repaint([]);
                    // The collapse button is gone: keep a keyboard user on
                    // the expand button rather than at the top of the page.
                    if (lost) {
                        const b = document.querySelector(
                            '[data-fid="bigchev"]',
                        );
                        if (b) b.focus({ preventScroll: true });
                    }
                };
                if (reduced()) {
                    done();
                    return;
                }
                STATE.closing = true;
                repaint([]);
                setTimeout(done, 560);
            }

            function render(data, meta) {
                STATE.data = data;
                setLocaleFrom(data, __widgetApi);
                STATE.periods = periodsFrom(meta);
                STATE.model = buildModel(data, meta);
                STATE.range = RANGES.includes(data && data.default_range)
                    ? data.default_range
                    : 30;
                STATE.mode = STATE.periods ? STATE.periods.groupBy : "days";
                STATE.metric = "calories";
                STATE.level = 0;
                STATE.sel = null;
                STATE.day = null;
                STATE.dayOpen = null;
                STATE.all = false;
                STATE.closing = false;
                STATE.swS = "start";
                painted = false;
                const root = document.getElementById("root");
                root.innerHTML = `<div id="tmode">${viewHtml()}</div>`;
                painted = true;
                measureStrip();
                // Spin the hero figure in (a no-op without animation frames).
                runReel(3000);
            }

            // Period mode switches repaint the whole view (not the card).
            function paintMode() {
                const box = document.getElementById("tmode");
                if (!box) return;
                painted = false;
                box.innerHTML = viewHtml();
                painted = true;
                measureStrip();
                if (STATE.mode === "days") runReel(1400);
            }

            // ---- interaction ---------------------------------------------------
            // Delegated on #root, which persists across every repaint.
            const rootEl = document.getElementById("root");
            rootEl.addEventListener("click", (e) => {
                if (!STATE.model) return;
                const seg = e.target.closest(".seg-btn");
                if (seg && seg.dataset.mode) {
                    if (seg.dataset.mode !== STATE.mode) {
                        STATE.mode = seg.dataset.mode;
                        paintMode();
                    }
                    return;
                }
                const b = e.target.closest("[data-act]");
                if (!b || STATE.closing) return;
                const act = b.dataset.act;
                if (act === "range") {
                    const r = RANGES.find((x) => String(x) === b.dataset.r);
                    if (!r || r === STATE.range) return;
                    STATE.range = r;
                    STATE.day = null;
                    STATE.dayOpen = null;
                    STATE.all = false;
                    repaint(["regrow"]);
                    runReel(1600);
                } else if (act === "metric") {
                    const k = b.dataset.k;
                    if (!k || k === STATE.metric) return;
                    STATE.metric = k;
                    STATE.day = null;
                    repaint([]);
                    runReel(1400);
                } else if (act === "swl" || act === "swr") {
                    const el = b.closest(".mswW").querySelector(".msw");
                    const max = el.scrollWidth - el.clientWidth;
                    if (max <= 4) return measureStrip();
                    const dir = act === "swl" ? -1 : 1;
                    const target =
                        el.scrollLeft +
                        dir * Math.max(el.clientWidth - 110, 140);
                    el.scrollTo({ left: Math.max(0, Math.min(target, max)) });
                } else if (act === "day") {
                    const i = Number(b.dataset.i);
                    if (i === STATE.day) return;
                    STATE.day = i;
                    repaint([]);
                } else if (act === "toggle") {
                    if (STATE.level === 0) {
                        STATE.level = 1;
                        repaint(["rows"]);
                    } else collapse();
                } else if (act === "collapse") {
                    collapse();
                } else if (act === "acc") {
                    const k = b.dataset.k;
                    flip(() => {
                        STATE.dayOpen = null;
                        STATE.all = false;
                        if (STATE.sel === k) {
                            STATE.sel = null;
                            STATE.level = 1;
                            repaint([]);
                        } else {
                            STATE.sel = k;
                            STATE.level = 2;
                            repaint(["body"]);
                        }
                    });
                } else if (act === "dayopen") {
                    const i = Number(b.dataset.i);
                    STATE.dayOpen = STATE.dayOpen === i ? null : i;
                    repaint(STATE.dayOpen == null ? [] : ["itl"]);
                } else if (act === "all") {
                    STATE.all = true;
                    repaint([]);
                }
            });
            // scroll does not bubble: capture it, for the strip's arrows.
            rootEl.addEventListener(
                "scroll",
                (e) => {
                    if (
                        e.target &&
                        e.target.classList &&
                        e.target.classList.contains("msw")
                    )
                        measureStrip();
                },
                true,
            );
            try {
                window.addEventListener("resize", () => measureStrip());
            } catch (_) {}

            // ---- sample (standalone preview) ----------------------------------
            // 30 days ending today-ish with a few unlogged days, fiber/sugar
            // missing on some, caffeine most days, alcohol on a weekly cycle.
            function buildSample() {
                const days = [];
                const added = {};
                const sat = {};
                const trans = {};
                const sod = {};
                const end = new Date("2026-10-24T12:00:00Z");
                const r1 = (n) => Math.round(n * 10) / 10;
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(end.getTime() - i * 864e5);
                    const date = d.toISOString().slice(0, 10);
                    const w = Math.sin(i / 2.2 + 1) * 0.55;
                    const skip = i === 4 || i === 11 || i === 19;
                    const nofs = !skip && (i === 2 || i === 9 || i === 23);
                    const part = i === 0 ? 0.64 : 1;
                    days.push({
                        date,
                        calories: skip
                            ? 0
                            : Math.round((2060 + w * 260) * part),
                        protein_g: skip ? 0 : Math.round((146 + w * 24) * part),
                        carbs_g: skip ? 0 : Math.round((214 + w * 34) * part),
                        fat_g: skip ? 0 : Math.round((68 + w * 11) * part),
                        fiber_g: skip || nofs ? null : r1((24 + w * 7) * part),
                        sugar_g: skip || nofs ? null : r1((41 + w * 13) * part),
                        alcohol_g: skip
                            ? null
                            : i % 6 === 1
                              ? r1(12 + w * 6)
                              : 0,
                        caffeine_mg:
                            skip || i % 5 === 3
                                ? null
                                : Math.round(190 + w * 70),
                        water_ml: skip
                            ? 0
                            : Math.round((2100 + w * 380) * part),
                    });
                    added[date] = skip || nofs ? null : r1((17 + w * 8) * part);
                    sat[date] = skip ? null : r1((17 + w * 5) * part);
                    trans[date] = skip ? null : r1(0.4 + w * 0.2);
                    sod[date] =
                        skip || i === 1 || i === 8
                            ? null
                            : Math.round((2080 + w * 380) * part);
                }
                return {
                    data: {
                        end_date: days[days.length - 1].date,
                        default_range: 14,
                        drink_unit: "us",
                        locale: "en",
                        goals: {
                            calories: 2200,
                            protein_g: 160,
                            carbs_g: 220,
                            fat_g: 70,
                            fiber_g: 30,
                            sugar_g: 45,
                            alcohol_g: 20,
                            caffeine_mg: 400,
                            water_ml: 2500,
                        },
                        days,
                    },
                    meta: {
                        [ADDED_SUGAR_META_KEY]: { v: 1, goal: 25, days: added },
                        [SATURATED_FAT_META_KEY]: {
                            v: 1,
                            goal: 20,
                            days: sat,
                            trans: { goal: null, days: trans },
                        },
                        [SODIUM_META_KEY]: { v: 1, goal: 2300, days: sod },
                        [LOCAL_TODAY_META_KEY]: {
                            v: 1,
                            today: days[days.length - 1].date,
                        },
                    },
                };
            }
            const SAMPLE = buildSample();

            // ---- rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "trends-widget",
                // A function: bridge.js calls it with the strings for the
                // browser language, since the payload's locale isn't known yet.
                loading: (strings) =>
                    '<div class="empty"><div class="big">📈</div><div>' +
                    esc(strings.trends.loading) +
                    "</div></div>",
                coerce,
                render,
                sample: SAMPLE.data,
                sampleMeta: SAMPLE.meta,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
