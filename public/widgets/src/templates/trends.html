<!doctype html>
<!--
  Trends widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, chart
  grammar and host bridge. The result is fully self-contained — inline CSS + JS,
  zero network requests — because the MCP Apps sandbox blocks external hosts.

  Shown after get_trends. ONE Dawn card: a header line carrying the title and
  the 7 / 14 / 30-day toggle, a flat calorie hero (no gauge — a range average
  against a daily goal is not a "how full is today" question), the chart, then
  the shared rails of nutrient chips.

  The tool sends up to 30 days of daily series and the toggle slices it
  CLIENT-SIDE and re-renders — no host round-trip, so switching ranges is
  instant.

  The chips here have no meals behind them (a trends payload carries none), so
  every one of them would be a static tile — except that this widget passes
  opts.chartKeys / opts.onSeries, which makes each chip the chart's series
  selector instead. Tapping Protein re-strokes the line in protein's colour and
  moves the goal line to protein's goal; tapping it again returns the chart to
  calories. That is the same rail doing a different job in a widget with a chart
  and no breakdown, with no branch in macros.js.

  The denominator is EVERY CALENDAR DAY in the window, not just the logged ones:
  these averages answer "how am I doing across this stretch of time?", so a
  skipped day pulls the average down. That deliberately differs from the
  get_nutrition_summary dashboard, whose figures divide by logged days only and
  answer "how does a day I actually log look?" (issue #70). Both are correct for
  their question and both name their denominator on screen — here that is the
  hero's calorie label ("14-day avg · all days"), which is the only place it is
  said, so keep it explicit if you touch it. Note the two averaging rules that
  coexist under it: calories, protein, carbs, fat and water count an empty day
  as 0, while fiber, sugar, alcohol and caffeine average only over the days that
  recorded them — see avgOf below, which matches the tool's text output.

  Data arrives as the `structuredContent` of the get_trends tool result; the
  shared bridge (shared/bridge.js) reads it across host conventions and calls
  render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trends</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* Rails, chips, the hero and the segmented control. */
            /*@include shared/chip.css@*/

            /* The line, the dashed goal, the single last-point dot, the foot. */
            /*@include shared/chart.css@*/

            /* The line and its labels are ONE block: dropped straight into the
               card, the 10px column gap would push .cfoot's own 5px offset away
               from the chart it labels. */
            .cblock {
                min-width: 0;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/svg.js@*/

            /*@include shared/bridge.js@*/

            const RANGES = [7, 14, 30];

            // ---- Sample data so the file renders on its own (browser preview) ----
            function buildSample() {
                const days = [];
                const end = new Date("2026-07-11T00:00:00Z");
                let date = "2026-07-11";
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(end);
                    d.setUTCDate(d.getUTCDate() - i);
                    date = d.toISOString().slice(0, 10);
                    const w = Math.sin(i / 3);
                    const skip = i === 4 || i === 11; // a couple of unlogged days
                    // A few extra days with meals logged but no fiber/sugar on
                    // them — pre-feature-style rows — so the sample exercises
                    // the "recorded on some but not all days" case that this
                    // widget must average correctly (null, not 0).
                    const noFiberSugar =
                        !skip && (i === 2 || i === 18 || i === 25);
                    const r = (n) => Math.round(n * 10) / 10;
                    days.push({
                        date,
                        calories: skip ? 0 : Math.round(2010 + w * 250),
                        protein_g: skip ? 0 : Math.round(150 + w * 18),
                        carbs_g: skip ? 0 : Math.round(212 + w * 28),
                        fat_g: skip ? 0 : Math.round(68 + w * 9),
                        fiber_g: skip || noFiberSugar ? null : r(26 + w * 6),
                        sugar_g: skip || noFiberSugar ? null : r(58 + w * 14),
                        // Alcohol tracking ON in this sample: null on an
                        // unlogged day (no data), 0 on a real alcohol-free
                        // day (still shows), a value on the rest. null on
                        // every day (tracking off) hides the alcohol chip.
                        alcohol_g: skip ? null : i % 7 ? 0 : r(13.9 + w * 4),
                        // Caffeine on most days but not all, and never a 0 on
                        // a day that simply has none: avgOf must divide by the
                        // days that recorded it, not by the window. null on
                        // every day (nobody ever logged any) hides the chip —
                        // there is no opt-in flag to hide it any other way.
                        caffeine_mg:
                            skip || i % 5 === 0
                                ? null
                                : Math.round(185 + w * 60),
                        water_ml: skip ? 0 : Math.round(2200 + w * 320),
                    });
                }
                return {
                    end_date: date,
                    default_range: 14,
                    drink_unit: "us",
                    locale: "en",
                    goals: {
                        calories: 2200,
                        protein_g: 160,
                        carbs_g: 220,
                        fat_g: 70,
                        fiber_g: 30,
                        sugar_g: 45,
                        alcohol_g: 20,
                        caffeine_mg: 400,
                        water_ml: 2500,
                    },
                    days,
                };
            }
            const SAMPLE = buildSample();

            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }
            // Trailing average over the days that actually carry this key:
            // sum / count of non-null days — matches computeTrends'
            // coveredSeries (src/insights.ts), which is where the tool's text
            // trailingAverage comes from. Calories/protein/carbs/fat/water are
            // never null (every day counts, as always), but fiber_g, sugar_g,
            // alcohol_g and caffeine_mg arrive null on a day that never
            // recorded them — dividing by days.length there would count a
            // no-data day as a real zero, exactly the drift this fixes.
            //
            // A key that is null on EVERY day averages to null, not 0, which is
            // what hides a metric the user has nothing to say about: alcohol_g
            // when tracking is off, caffeine_mg when it was never recorded. A 0
            // there would claim an alcohol-free / caffeine-free window instead.
            function avgOf(days, key) {
                if (!days.length) return 0;
                let sum = 0;
                let seen = 0;
                for (const d of days) {
                    if (d[key] == null) continue;
                    seen++;
                    sum += d[key] || 0;
                }
                if (!seen) return null;
                return sum / seen;
            }

            // ---- The chart -----------------------------------------------------

            // Everything the chart draws for ONE metric.
            //
            // A day that never recorded the metric is dropped rather than drawn
            // as a zero: a line dipping to the axis would claim a measured zero
            // where the payload said "nobody measured this". That is also why
            // the foot's end dates come from the days actually drawn and not
            // from the window — the labels always describe the line above them.
            //
            // Safe to call for any key in chartKeys (see paint) plus calories:
            // both are guaranteed at least one non-null day, so `days` is never
            // empty here.
            function seriesOf(key) {
                const m = MACROS.find((x) => x.key === key);
                const days = STATE.slice.filter((d) => d[key] != null);
                const vals = days.map((d) => d[key] || 0);
                const goal = (STATE.data.goals && STATE.data.goals[key]) || 0;
                // Zero-based, unlike weight-trends: a nutrient total's distance
                // from zero is the thing being read. The 1.15 keeps the peak
                // clear of the top edge.
                const yMax = Math.max(...vals, goal, 1) * 1.15;
                const pts = chPoints(vals, 0, yMax);
                const dot = pts[pts.length - 1];
                const isCal = key === "calories";
                // The same average the chip above shows — avgOf over the days
                // that recorded the metric, which is exactly `vals` here.
                const avg = vals.length
                    ? vals.reduce((a, b) => a + b, 0) / vals.length
                    : 0;
                // macroNum()/macroUnit() (macros.js), never fmt() + m.unit:
                // that pair is the ONE place a metric's display unit is
                // decided, and water is the one metric stored in a different
                // unit from the one it reads in. Bypassing it here printed
                // "Water avg 1,957 ml · goal 2,500" directly above a chip
                // reading "2.0 L / 2.5 L" — the same metric in two units on the
                // same card (all three recheck agents measured it). The goal is
                // the same measurement as the average, so it converts too.
                const goalPart = goal > 0 ? macroNum(m, goal) : null;
                return {
                    color: m.color,
                    // role="img" makes this string the chart's ENTIRE
                    // description, so a switched series gets the same sentence
                    // as the default one with its own metric in it. It used to
                    // fall back to a bare macroLabel(m) — a screen reader heard
                    // the single word "Protein" for a 30-day chart (a11y audit
                    // + regression audit, both minor). T.trends.metricOverRange
                    // is the one leaf added for it, in all 9 copy files, and it
                    // deliberately carries no count: Intl.PluralRules falls
                    // back to "other" for Polish/Ukrainian few/many, so a
                    // PluralForms key would read wrong at n = 2–4.
                    label: isCal
                        ? tpl(T.trends.caloriesOverRange, {
                              range: STATE.range,
                          })
                        : tpl(T.trends.metricOverRange, {
                              metric: macroLabel(m),
                              range: STATE.range,
                          }),
                    d: chPath(pts),
                    // Zero-based, so the box's floor is the value 0 and the
                    // wash measures the real thing — see .carea in chart.css.
                    area: chArea(pts),
                    goalY: goal > 0 ? chY(goal, 0, yMax).toFixed(1) : null,
                    x: dot[0].toFixed(1),
                    y: dot[1].toFixed(1),
                    from: shortDate(days[0].date),
                    to: shortDate(days[days.length - 1].date),
                    // The foot's middle label. On the default series it is the
                    // window's own coverage, which is where this widget names
                    // it. On a SWITCHED series it names the metric, its average
                    // and its goal instead — without this the foot was
                    // byte-identical across a series change, so a purple
                    // protein line sat above a calorie hero with an unlabelled
                    // dashed reference and nothing on the card said which
                    // series was drawn (layout audit, minor). Same shape
                    // nutrition-summary's foot already uses, and it reads the
                    // same two shared caption words.
                    mid: isCal
                        ? esc(STATE.loggedLabel)
                        : `<b>${esc(macroLabel(m))}</b> ${esc(T.nutritionSummary.avg)} ${esc(macroAmount(m, avg))}` +
                          (goalPart
                              ? ` · ${esc(T.nutritionSummary.goal)} ${goalPart}`
                              : ""),
                };
            }

            // The foot's three labels: the first day drawn, what the line is,
            // the last day drawn. See `mid` in seriesOf for what the middle one
            // says in each state.
            function footHtml(s) {
                return `<span>${esc(s.from)}</span><span>${s.mid}</span><span>${esc(s.to)}</span>`;
            }

            function chartMarkup(s) {
                // The goal line is always in the DOM and merely hidden when the
                // metric has no goal, so switching series only ever writes
                // attributes — never adds or removes a node, which is what lets
                // .cline's stroke transition run across the switch.
                const hidden = s.goalY ? "" : ' style="display:none"';
                const gy = s.goalY || 0;
                return `
          <div class="cwrap ${s.color}">
            <svg viewBox="0 0 ${CH_W} ${CH_H}" preserveAspectRatio="none" role="img" aria-label="${esc(s.label)}">
              <line class="cgoal" x1="${CH_PL}" y1="${gy}" x2="${CH_W - CH_PR}" y2="${gy}"${hidden}/>
              ${chAreaMarkup(s.area)}
              <path class="cline" d="${s.d}"/>
              <circle class="chalo" cx="${s.x}" cy="${s.y}" r="5"/>
              <circle class="cdot" cx="${s.x}" cy="${s.y}" r="3"/>
            </svg>
          </div>
          <div class="cfoot">${footHtml(s)}</div>`;
            }

            // Re-point the chart at another metric IN PLACE. Rebuilding the
            // block would work but would throw away .cline's stroke transition,
            // and that colour cross-fade is what reads as "same chart, other
            // series". The shape snaps rather than morphing, deliberately: a
            // path tweening between two nutrients would imply a relationship
            // between them that isn't there.
            function applySeries(key) {
                const block = document.getElementById("chart");
                if (!block) return;
                const s = seriesOf(key);
                block.querySelector(".cwrap").className = `cwrap ${s.color}`;
                block.querySelector("svg").setAttribute("aria-label", s.label);
                block.querySelector(".cline").setAttribute("d", s.d);
                // Re-pointed like the line, never rebuilt: the gradient the
                // fill references was minted with this node and a fresh <defs>
                // would orphan the id.
                block.querySelector(".carea").setAttribute("d", s.area);
                const goal = block.querySelector(".cgoal");
                goal.style.display = s.goalY ? "" : "none";
                if (s.goalY) {
                    goal.setAttribute("y1", s.goalY);
                    goal.setAttribute("y2", s.goalY);
                }
                block.querySelectorAll(".chalo, .cdot").forEach((c) => {
                    c.setAttribute("cx", s.x);
                    c.setAttribute("cy", s.y);
                });
                block.querySelector(".cfoot").innerHTML = footHtml(s);
                // The card's glow reads --c, so the whole surface takes the
                // selected metric's colour — the confirmation you get without
                // having to look at the line.
                const card = block.closest(".card");
                if (card) card.className = `card ${s.color}`;
            }

            // What macroPanel calls when a chip is tapped. Deselecting returns
            // the chart to calories: the metric the hero is about, and the one
            // every other state of this widget shows.
            function onSeries(key, opened) {
                applySeries(opened ? key : "calories");
            }

            // ---- State + rendering ---------------------------------------------
            const STATE = { data: null, range: 30, slice: [], loggedLabel: "" };
            let __widgetApi = null;

            function render(data) {
                STATE.data = data;
                const root = document.getElementById("root");
                // The tool sends a bucket for every calendar day (zeros for
                // unlogged days), so the array is basically never empty — treat
                // an all-zero series (nothing logged) as empty too.
                // dayHasData (shared/macros.js) derives the test from MACROS,
                // so it covers exactly the top-level metrics — fiber, sugar,
                // alcohol and caffeine never appear without a meal that already
                // contributes calories, and a null on any of them must not
                // count as a logged day.
                const anyLogged =
                    data &&
                    Array.isArray(data.days) &&
                    data.days.some(dayHasData);
                setLocaleFrom(data, __widgetApi);
                if (!anyLogged) {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">📈</div>
              <div>${esc(T.trends.empty)}</div>
            </div>`;
                    return;
                }
                // Only here, never in paint(): the range is the user's choice
                // once they have made one, and re-reading default_range on
                // every repaint would undo every tap of the toggle.
                STATE.range = RANGES.includes(data.default_range)
                    ? data.default_range
                    : 30;
                paint();
            }

            // Everything BELOW the header — the chart block and the strip —
            // derived from STATE.range. Split out of paint() so a range change
            // can rewrite this alone and leave the header, and the seg button
            // the user is standing on, in place.
            function bodyHtml() {
                const data = STATE.data;
                const all = data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const range = STATE.range;
                const slice = all.slice(-range);
                STATE.slice = slice;

                const avg = {};
                for (const m of MACROS) avg[m.key] = avgOf(slice, m.key);

                const logged = slice.filter(dayHasData).length;
                STATE.loggedLabel = tpl(T.trends.loggedOfTotal, {
                    logged,
                    total: slice.length,
                });

                // The metrics the chart can draw, i.e. every one with at least
                // one day that recorded it (a null average means nothing did).
                // Calories is deliberately absent: it is the hero and the
                // default series, and deselecting any chip returns to it, so
                // giving it a control of its own would be two switches for one
                // job — and would turn the hero into a button.
                const chartKeys = MACROS.filter(
                    (m) => m.role !== "cal" && avg[m.key] != null,
                ).map((m) => m.key);

                // No per-meal rows in a trends payload, so nothing here
                // discloses meals — chartKeys/onSeries are what keep the chips
                // interactive, as the chart's series selector. `divided` gives
                // the strip the hairline that separates it from the chart above;
                // `flatHero` drops the gauge. The floor-metric averaged wording
                // uses its own dedicated string (T.trends.avgUnder) — distinct
                // from macros.floorUnder's live "still left today" framing and
                // macros.ceilingUnder's safety-margin framing, neither of which
                // fits a historical average's shortfall. See macroBits' wording.
                const panel = macroPanel(
                    avg,
                    data.goals,
                    { under: T.trends.avgUnder },
                    null,
                    {
                        drinkUnit: data.drink_unit,
                        divided: true,
                        flatHero: true,
                        // The one place the denominator is named: these are
                        // averages over every calendar day in the window,
                        // skipped days included.
                        calLabel: tpl(T.trends.avgAllDays, { range }),
                        chartKeys,
                        onSeries,
                    },
                );

                // seriesOf() reads STATE.slice and STATE.loggedLabel, both set
                // above — so the chart is built last, after the range's own
                // numbers exist.
                return `
            <div class="cblock" id="chart">${chartMarkup(seriesOf("calories"))}</div>
            ${panel}`;
            }

            function paint() {
                const root = document.getElementById("root");
                const range = STATE.range;

                const seg = RANGES.map(
                    (r) =>
                        `<button type="button" data-range="${r}" aria-pressed="${r === range}" aria-label="${esc(tpl(T.trends.rangeDaysAriaLabel, { n: r }))}">${r}</button>`,
                ).join("");

                root.innerHTML = `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.trends.title)}</h1>
              <div class="seg" role="group" aria-label="${esc(T.trends.windowAriaLabel)}">${seg}</div>
            </header>
            <div id="tr-body">${bodyHtml()}</div>
          </div>`;
            }

            // A range change is an attribute flip plus a body repaint — NEVER a
            // full paint(). Rewriting root.innerHTML from the toggle's own click
            // handler destroyed the seg button that was being operated, so
            // document.activeElement fell to <body> and a keyboard user was
            // dumped to the top of the document on every range change (a11y
            // audit, major). The seg buttons are toggle buttons: their pressed
            // state is the only header state a range owns, and setAttribute
            // moves it without touching the node the user is standing on.
            function setRange(n) {
                STATE.range = n;
                const root = document.getElementById("root");
                root.querySelectorAll("[data-range]").forEach((b) => {
                    b.setAttribute(
                        "aria-pressed",
                        String(Number(b.dataset.range) === n),
                    );
                });
                const body = document.getElementById("tr-body");
                // No body element means the card was never painted by paint()
                // (an empty-state render); fall back rather than silently
                // dropping the range change.
                if (!body) {
                    paint();
                    return;
                }
                body.innerHTML = bodyHtml();
                // The new body draws calories again, so the card's tint has to
                // come back with it — applySeries may have left it on the
                // previously selected metric's role class.
                const card = body.closest(".card");
                if (card) card.className = "card c-cal";
            }

            // Delegated on #root, which persists across paint()'s innerHTML
            // rewrites, so it's attached once.
            document.getElementById("root").addEventListener("click", (e) => {
                const btn = e.target.closest("[data-range]");
                if (!btn) return;
                const n = Number(btn.dataset.range);
                if (n && n !== STATE.range && STATE.data) setRange(n);
            });

            // ---- Rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // MACROS, the chip rails and the hero. Requires fmt + esc + icon
            // above; supplies dayHasData/macroLabel/macroPanel to the code that
            // runs after the host delivers a payload.
            /*@include shared/macros.js@*/

            initWidget({
                name: "trends-widget",
                loading:
                    '<div class="empty"><div class="big">📈</div><div>Loading your trends…</div></div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
