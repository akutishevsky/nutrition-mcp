<!doctype html>
<!--
  Trends widget (MCP Apps), shown after get_trends.

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens and the host bridge.
  The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts.

  LAYOUT (the 2026-10 redesign, W3-Trends-M / W3-Trends-D). One card, no
  panel border: a title (which nutrient, over how many days) beside 7d / 14d /
  30d pills, a horizontal strip of nutrient chips, a big average that rolls in
  like an odometer, a bar chart of that nutrient per day, then "Show more",
  which opens one card per nutrient (mini gauge + sparkline; opening a card
  shows its own chart, high/low/on-target chips and a per-day list). From
  640px wide (the iframe's own width, a media query — never a JS constant) the
  hero splits into the average and three stats, and the cards sit in a
  six-column grid.

  DATA. structuredContent is get_trends' frozen shape: up to 30 days of daily
  totals the pills slice CLIENT-SIDE (no round trip). Everything newer rides in
  the result's `_meta`, validated here as untrusted and optional:
    - "nutrition-mcp.com/added-sugar"    per-day added sugar + its limit
    - "nutrition-mcp.com/saturated-fat"  per-day saturated fat + its limit,
                                         and trans fat (`.trans`, no limit)
    - "nutrition-mcp.com/sodium"         per-day sodium (mg) + its limit
    - "nutrition-mcp.com/local-today"    which day is still running in the
                                         profile timezone
  A nutrient whose payload is missing (a host that dropped `_meta`) is simply
  not offered; a missing local-today falls back to the device date.

  AVERAGES. Every average divides by the days that carry a value: a day with
  no meal is a gap, not a zero (calories, protein, carbs and fat need a meal
  that day, water any log; fiber, sugar, the `_meta` nutrients, caffeine and
  alcohol a recorded figure). A still-running today is drawn but left out of
  the averages and the on-target counts while a finished day exists, and the
  hero says so. The denominator is always on screen: "12 of 14 days logged"
  (mobile) or the Days logged stat (desktop). This differs from get_trends'
  own text, which divides the always-present nutrients by every calendar day;
  both name what they divide by.

  PERIOD MODE. get_trends called with `group_by` also sends rows for every
  granularity under "nutrition-mcp.com/period-averages" (shared/period.js).
  The widget then opens on the requested one, with a Week · Month · Qtr ·
  Year · Days seg on top; Days is the day view above. Without that `_meta` the
  widget is the day view alone.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trends</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* The period view's Week / Month / Qtr / Year / Days control. */
            /*@include shared/seg.css@*/

            /* Period rows (Week / Month / Quarter / Year view). */
            /*@include shared/period.css@*/

            /* The period rows' calorie bar (period.js emits .mbar/.mfill,
               which the macro strip styles; this widget no longer includes
               the strip). */
            .prow .mbar {
                position: relative;
                height: 5px;
                border-radius: 999px;
                background: var(--track);
                overflow: hidden;
            }
            .prow .mfill {
                position: absolute;
                top: 0;
                bottom: 0;
                left: 0;
                border-radius: 999px;
            }

            /* ===== shell ===== */
            .tw {
                padding: 14px 16px 12px;
                max-width: 1100px;
                margin: 0 auto;
            }
            .pbar {
                display: flex;
                justify-content: flex-end;
            }
            .pbar .seg {
                margin-bottom: 12px;
            }
            .num {
                font-variant-numeric: tabular-nums;
            }
            button {
                font: inherit;
                color: inherit;
            }
            :where(button.reset) {
                all: unset;
                box-sizing: border-box;
                cursor: pointer;
                text-align: left;
            }
            button.reset:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
                border-radius: 8px;
            }
            .msg {
                font-size: 13px;
                color: var(--text-dim);
                padding: 10px 0;
                line-height: 1.45;
            }

            /* ===== the metric tint =====
               --mc is the selected nutrient's colour; everything else derives
               from it, mixed toward the panel (tints) or toward --text (ink),
               so one set of rules serves both themes. Registered so a
               nutrient switch cross-fades. */
            @property --mc {
                syntax: "<color>";
                inherits: true;
                initial-value: #1d9751;
            }
            .gcard,
            .acc,
            .mchip {
                --mcm: var(--mc);
                --mcs: color-mix(in oklab, var(--mc) 64%, var(--text));
                --mci: color-mix(in oklab, var(--mc) 62%, var(--text));
                --mch: color-mix(in oklab, var(--mc) 80%, var(--text));
                --ovsel: color-mix(in oklab, var(--over) 70%, var(--text));
                --nrdot: var(--status-nr);
                --nrsel: var(--status-nr-ink);
            }
            .gcard {
                display: flex;
                flex-direction: column;
                width: 100%;
                transition: --mc 0.5s ease;
            }

            /* ===== header + range pills ===== */
            .hrow {
                display: flex;
                align-items: flex-start;
                gap: 12px;
                width: 100%;
            }
            .gtop {
                display: flex;
                flex-direction: column;
                flex: 1;
                min-width: 0;
            }
            .eyb2 {
                font-size: 12.5px;
                font-weight: 600;
                color: var(--text-dim);
                letter-spacing: 0.01em;
                margin-bottom: 5px;
                overflow-wrap: anywhere;
            }
            .eyb2 .nw {
                white-space: nowrap;
            }
            .gtop .t {
                font-size: 17px;
                font-weight: 650;
                letter-spacing: -0.015em;
                line-height: 1.3;
                color: var(--text);
                overflow-wrap: anywhere;
            }
            .rseg {
                flex: none;
                display: inline-flex;
                gap: 2px;
                padding: 3px;
                border-radius: 999px;
                background: color-mix(in oklab, var(--mc) 15%, var(--panel));
                margin-top: 2px;
            }
            .rpill {
                height: 32px;
                min-width: 40px;
                padding: 0 10px;
                border-radius: 999px;
                display: inline-flex;
                align-items: center;
                justify-content: center;
                font-size: 12.5px;
                font-weight: 800;
                color: var(--mci);
                text-align: center !important;
                white-space: nowrap;
                transition:
                    background-color 0.3s ease,
                    color 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .rpill:hover {
                background: color-mix(in oklab, var(--mc) 26%, var(--panel));
            }
            .rpill:active {
                transform: scale(0.92);
            }
            .rpill.on {
                background: var(--mcs);
                color: var(--bg);
                box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
            }

            /* ===== nutrient chip strip ===== */
            .mswW {
                position: relative;
                margin: 14px -16px 0;
            }
            .msw {
                display: flex;
                gap: 8px;
                overflow-x: auto;
                overscroll-behavior-x: contain;
                scrollbar-width: none;
                scroll-behavior: smooth;
                padding: 3px 16px 5px;
                scroll-snap-type: x proximity;
                scroll-padding: 0 16px;
                -webkit-mask-image: linear-gradient(
                    90deg,
                    #000 calc(100% - 64px),
                    transparent calc(100% - 28px)
                );
                mask-image: linear-gradient(
                    90deg,
                    #000 calc(100% - 64px),
                    transparent calc(100% - 28px)
                );
            }
            .msw::-webkit-scrollbar {
                display: none;
            }
            .mswW[data-s="mid"] .msw {
                -webkit-mask-image: linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 28px,
                    #000 64px,
                    #000 calc(100% - 64px),
                    transparent calc(100% - 28px)
                );
                mask-image: linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 28px,
                    #000 64px,
                    #000 calc(100% - 64px),
                    transparent calc(100% - 28px)
                );
            }
            .mswW[data-s="end"] .msw {
                -webkit-mask-image: linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 28px,
                    #000 64px
                );
                mask-image: linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 28px,
                    #000 64px
                );
            }
            .mswW[data-s="none"] .msw {
                -webkit-mask-image: none;
                mask-image: none;
            }
            .mchip {
                flex: none;
                display: inline-flex;
                align-items: center;
                gap: 6px;
                height: 36px;
                padding: 0 14px 0 11px;
                border-radius: 999px;
                background: color-mix(in oklab, var(--mc) 14%, var(--panel));
                color: var(--mci);
                font-size: 13.5px;
                font-weight: 700;
                white-space: nowrap;
                scroll-snap-align: start;
                transition:
                    background-color 0.3s ease,
                    color 0.3s ease,
                    box-shadow 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
                animation: gUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
            }
            .mchip:hover {
                background: color-mix(in oklab, var(--mc) 22%, var(--panel));
            }
            .mchip:active {
                transform: scale(0.93);
            }
            .mchip .e {
                font-size: 16px;
                line-height: 1;
            }
            .mchip.on {
                background: var(--mcs);
                color: var(--bg);
                box-shadow: 0 2px 6px
                    color-mix(in oklab, var(--mc) 35%, transparent);
            }
            .mchip:nth-child(1) {
                animation-delay: 0.05s;
            }
            .mchip:nth-child(2) {
                animation-delay: 0.09s;
            }
            .mchip:nth-child(3) {
                animation-delay: 0.13s;
            }
            .mchip:nth-child(4) {
                animation-delay: 0.17s;
            }
            .mchip:nth-child(5) {
                animation-delay: 0.21s;
            }
            .mchip:nth-child(6) {
                animation-delay: 0.25s;
            }
            .mchip:nth-child(7) {
                animation-delay: 0.29s;
            }
            .mchip:nth-child(8) {
                animation-delay: 0.33s;
            }
            .mchip:nth-child(n + 9) {
                animation-delay: 0.37s;
            }
            .msa {
                position: absolute;
                top: calc(50% + 1px);
                transform: translateY(-50%);
                z-index: 3;
                width: 34px;
                height: 34px;
                border-radius: 50%;
                display: grid !important;
                place-items: center;
                background: color-mix(in oklab, var(--text) 4%, var(--panel));
                color: var(--text);
                box-shadow:
                    0 0 0 1px var(--panel-border),
                    0 2px 8px rgba(0, 0, 0, 0.16);
                transition:
                    opacity 0.22s ease,
                    transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                    background-color 0.2s;
            }
            .msa.l {
                left: 8px;
            }
            .msa.r {
                right: 8px;
            }
            .msa:hover {
                background: color-mix(in oklab, var(--text) 9%, var(--panel));
            }
            .msa:active {
                transform: translateY(-50%) scale(0.9);
            }
            .msa:focus-visible {
                border-radius: 50%;
            }
            .mswW[data-s="start"] .msa.l,
            .mswW[data-s="end"] .msa.r,
            .mswW[data-s="none"] .msa {
                opacity: 0;
                pointer-events: none;
                transform: translateY(-50%) scale(0.7);
            }

            /* ===== hero average ===== */
            .dnum {
                display: flex;
                flex-direction: column;
                align-items: center;
                margin-top: 18px;
            }
            .dnL {
                display: flex;
                flex-direction: column;
                align-items: center;
                min-width: 0;
                max-width: 100%;
            }
            .hnum {
                display: flex;
                align-items: flex-end;
                justify-content: center;
                gap: 8px;
                min-width: 0;
            }
            .hnum .hp,
            .hnum .hu {
                font-size: 15px;
                font-weight: 600;
                color: var(--text-dim);
                padding-bottom: 5px;
                white-space: nowrap;
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
            }
            .gnum {
                display: inline-flex;
                height: 1em;
                font-size: 44px;
                font-weight: 800;
                letter-spacing: -0.03em;
                line-height: 1;
                color: var(--mch);
            }
            .hnum.over .gnum {
                color: var(--over);
            }
            .rl {
                display: inline-block;
                height: 1em;
                line-height: 1;
                overflow: hidden;
                vertical-align: top;
            }
            .rs {
                display: flex;
                flex-direction: column;
                will-change: transform;
            }
            .rs span {
                display: block;
                height: 1em;
                line-height: 1;
                text-align: center;
            }
            .hgoal {
                text-align: center;
                font-size: 13px;
                color: var(--text-dim);
                margin-top: 5px;
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
            }
            .hgoal b {
                color: var(--text);
                font-weight: 700;
            }
            .hnote {
                text-align: center;
                font-size: 12px;
                color: var(--text-dim);
                margin-top: 4px;
                line-height: 1.4;
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.4s both;
            }
            .gstats {
                display: none;
            }
            .gdelta {
                text-align: center;
                font-size: 13.5px;
                color: var(--text-dim);
                margin-top: 16px;
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.3s both;
                overflow-wrap: anywhere;
            }
            .gdelta b {
                color: var(--mci);
                font-weight: 800;
                transition: color 0.3s;
            }
            .gdelta b.over {
                color: var(--over);
            }
            .gdelta b.nt {
                color: var(--text);
            }
            .gdelta .dot {
                margin: 0 6px;
                color: var(--text-mute);
            }

            /* ===== daily bar chart: thick rounded bars with pale halos ===== */
            .ch {
                --ct: var(--track);
                --cf: var(--mcm);
                --cs: var(--mcs);
                --co: var(--over);
                --cos: var(--ovsel);
                --cg: color-mix(in oklab, var(--text) 70%, transparent);
                --bw: 22px;
                --hw: 4px;
                display: flex;
                flex-direction: column;
                width: 100%;
            }
            .ch.hero {
                margin-top: 16px;
                --ct: color-mix(in oklab, var(--mc) 15%, var(--panel));
                --cg: color-mix(in oklab, var(--mc) 70%, var(--text));
                animation: gIn 0.4s ease 0.1s both;
            }
            .ch.hero .cyl span {
                color: var(--mci);
            }
            .ch.hero .chr b {
                color: var(--mch);
            }
            .ch.n7 {
                --bw: 26px;
                --hw: 4px;
            }
            .ch.n14 {
                --bw: 12px;
                --hw: 3px;
            }
            .ch.n30 {
                --bw: 5px;
                --hw: 1.5px;
            }
            .ch.nut {
                margin: 6px 0 2px;
                --ct: color-mix(in oklab, var(--mc) 16%, var(--panel));
            }
            .ch.nut.n7 {
                --bw: 22px;
                --hw: 4px;
            }
            .ch.nut.n14 {
                --bw: 10px;
                --hw: 3px;
            }
            .ch.nut.n30 {
                --bw: 4px;
                --hw: 1.5px;
            }
            .chd {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                justify-content: space-between;
                gap: 4px 10px;
                margin-bottom: 12px;
                font-size: 12.5px;
            }
            .chl {
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--text-dim);
                white-space: nowrap;
                min-width: 0;
            }
            .chr {
                color: var(--text-dim);
                white-space: nowrap;
                flex: none;
                margin-left: auto;
            }
            .chr b {
                color: var(--text);
                font-weight: 800;
                font-size: 14px;
            }
            .ch .chr b.over {
                color: var(--over);
            }
            .cbody {
                display: grid;
                grid-template-columns: 36px minmax(0, 1fr);
                column-gap: 6px;
            }
            .cplot,
            .cyl {
                position: relative;
                height: 200px;
            }
            .ch.nut .cplot,
            .ch.nut .cyl {
                height: 84px;
            }
            .cyl span {
                position: absolute;
                right: 0;
                transform: translateY(50%);
                font-size: 10.5px;
                font-weight: 700;
                color: var(--text-dim);
                white-space: nowrap;
                transition: bottom 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .cgoal {
                position: absolute;
                left: -4px;
                right: -4px;
                height: 0;
                border-top: 2px dashed var(--cg);
                z-index: 3;
                pointer-events: none;
                transition: bottom 0.6s cubic-bezier(0.22, 1, 0.36, 1);
            }
            .cbars {
                position: absolute;
                inset: 0;
                display: grid;
            }
            .cb {
                display: flex !important;
                justify-content: center;
                height: 100%;
                border-radius: 8px;
            }
            .ctrk {
                position: relative;
                display: block;
                width: var(--bw);
                height: 100%;
                border-radius: calc(var(--bw) / 2);
                background: var(--ct);
                box-shadow: 0 0 0 var(--hw) var(--ct);
                transition:
                    background-color 0.3s ease,
                    box-shadow 0.3s ease;
            }
            .cfill {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                min-height: var(--bw);
                border-radius: calc(var(--bw) / 2);
                background: var(--cf);
                transform-origin: 50% 100%;
                animation: cr 1s cubic-bezier(0.22, 1, 0.36, 1) both;
                transition:
                    height 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                    background-color 0.3s ease;
            }
            .cb.ov .cfill {
                background: var(--co);
            }
            .cb.sel .cfill {
                background: var(--cs);
            }
            .cb.sel.ov .cfill {
                background: var(--cos);
            }
            .cb.sel .ctrk {
                box-shadow: 0 0 0 var(--hw) var(--cf);
            }
            .cb.nr .ctrk {
                background: transparent;
                box-shadow: none;
            }
            .cb.nr .cfill {
                display: none;
            }
            .cb.nr .ctrk:after {
                content: "";
                position: absolute;
                left: 50%;
                bottom: 0;
                width: 6px;
                height: 6px;
                margin-left: -3px;
                border-radius: 3px;
                background: var(--nrdot);
            }
            .cb.nr.sel .ctrk:after {
                background: var(--nrsel);
                box-shadow: 0 0 0 3px var(--track);
            }
            .cx {
                display: grid;
                margin: 9px 0 0 42px;
                height: 14px;
                font-size: 11px;
                color: var(--text-dim);
            }
            .cx span {
                white-space: nowrap;
                justify-self: center;
                line-height: 14px;
            }
            .cx span.st {
                justify-self: start;
            }
            .cx span.en {
                justify-self: end;
            }
            .cx span.td {
                font-weight: 800;
                color: var(--text);
            }

            /* ===== buttons ===== */
            .bigchev {
                display: flex !important;
                align-self: center;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 40px;
                padding: 0 18px 0 20px;
                margin-top: 18px;
                border-radius: 20px;
                background: color-mix(in oklab, var(--mc) 15%, var(--panel));
                font-size: 15px;
                font-weight: 800;
                color: var(--text);
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.5s both;
                transition:
                    background-color 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .bigchev:hover {
                background: color-mix(in oklab, var(--mc) 23%, var(--panel));
            }
            .bigchev:active {
                transform: scale(0.94);
            }
            .bigchev svg {
                transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .nchev.open {
                transform: rotate(180deg);
            }
            .collall {
                display: flex !important;
                align-self: center;
                align-items: center;
                gap: 8px;
                height: 40px;
                padding: 0 20px;
                margin-top: 16px;
                margin-bottom: 4px;
                border-radius: 20px;
                background: var(--surface-soft);
                color: var(--text);
                font-size: 14.5px;
                font-weight: 700;
                transition:

            }
            .collall:hover {
                background: var(--track);
            }
            .collall:active {
                transform: scale(0.95);

            /* ===== empty ===== */
            .tempty {
                display: flex;
                flex-direction: column;
                align-items: center;
                text-align: center;
                gap: 6px;

            .acc {
                border-radius: 18px;
