<!doctype html>
<!--
  Trends widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, chart
  grammar and host bridge. The result is fully self-contained — inline CSS + JS,
  zero network requests — because the MCP Apps sandbox blocks external hosts.

  Shown after get_trends. ONE Dawn card, laid out exactly like the
  get_nutrition_summary dashboard: a header carrying the title, the 7 / 14 /
  30-day toggle and — on its own second row — the window and how much of it was
  logged; then the tiered strip, whose calorie focus panel holds the ring, the
  figure, the averaging label and the sparkline as one object; then the macro,
  limit and water rails, and the foot.

  The tool sends up to 30 days of daily series and the toggle slices it
  CLIENT-SIDE and repaints only the body — no host round trip, so switching
  ranges is instant, and the seg button being operated is never rebuilt.

  The tiles here have no meals behind them (a trends payload carries none), so
  none of them discloses anything. What makes them controls is opts.chartKeys /
  opts.onSeries: each is an aria-pressed toggle that hands the WHOLE focus panel
  — figure, ring, colour and line — to its metric, and a second tap (or Escape)
  hands it back to calories. The panel itself is a plain <span> (calories has
  neither meals nor a chart key of its own), so its sparkline is role="img" with
  a sentence of its own (sparkMarkup, shared/spark.js).

  The denominator is EVERY CALENDAR DAY in the window, not just the logged ones:
  these averages answer "how am I doing across this stretch of time?", so a
  skipped day pulls the average down. That deliberately differs from the
  get_nutrition_summary dashboard, whose figures divide by logged days only and
  answer "how does a day I actually log look?" (issue #70). Both are correct for
  their question and both name their denominator on screen — here that is the
  focus panel's label ("14-day avg · all days"), which follows the panel when a
  tile moves it ("Protein · 14-day avg · all days"), so keep it explicit if you
  touch it. Two averaging rules coexist under it: calories, protein, carbs, fat
  and water count an empty day as 0, while fiber, sugar, alcohol and caffeine
  average only over the days that recorded them ("· days recorded") — see avgOf
  below, which matches the tool's text output. The chart draws what the average
  counts: an empty day is a 0 on the line, and only a real null is a gap.

  Data arrives as the `structuredContent` of the get_trends tool result; the
  shared bridge (shared/bridge.js) reads it across host conventions and calls
  render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trends</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* The strip, the focus panel and its sparkline slot, the tiles,
               the segmented control. */
            /*@include shared/chip.css@*/

            /* The sparkline's line, goal, day hairlines and last-reading dot. */
            /*@include shared/chart.css@*/

            /* The body a range change repaints: a plain block, so the strip
               inside it lays out exactly as nutrition-summary's, which sits in
               the card directly. min-width: 0 so a long locale's tile can never
               widen a flex item past the card. */
            #tr-body {
                min-width: 0;
            }
            /* The range-empty body's foot is a GRANDCHILD of the card, so
               base.css' `.card > .foot` cannot reach it — and it has no rail's
               -2px pulling it up, so the strip foot's 12px would read as 12.
               10px is the card's own gap, which is what the whole-empty card's
               foot (a direct child) gets, so the two empty states match. */
            #tr-body > .foot {
                margin-top: 10px;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /* The header's rangeLabel and daysLoggedCaption, the empty card's
               shiftDay, and the UTC day arithmetic (utcDay, DAY_MS) the
               sparkline's calendar axis is stepped with. */
            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /* Chart geometry plus calendarSlots / hairlineSlot. */
            /*@include shared/svg.js@*/

            /*@include shared/bridge.js@*/

            const RANGES = [7, 14, 30];

            // ---- Sample data so the file renders on its own (browser preview) ----
            function buildSample() {
                const days = [];
                const end = new Date("2026-07-11T00:00:00Z");
                let date = "2026-07-11";
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(end);
                    d.setUTCDate(d.getUTCDate() - i);
                    date = d.toISOString().slice(0, 10);
                    const w = Math.sin(i / 3);
                    const skip = i === 4 || i === 11; // a couple of unlogged days
                    // A few extra days with meals logged but no fiber/sugar on
                    // them — pre-feature-style rows — so the sample exercises
                    // the "recorded on some but not all days" case that this
                    // widget must average correctly (null, not 0).
                    const noFiberSugar =
                        !skip && (i === 2 || i === 18 || i === 25);
                    const r = (n) => Math.round(n * 10) / 10;
                    days.push({
                        date,
                        calories: skip ? 0 : Math.round(2010 + w * 250),
                        protein_g: skip ? 0 : Math.round(150 + w * 18),
                        carbs_g: skip ? 0 : Math.round(212 + w * 28),
                        fat_g: skip ? 0 : Math.round(68 + w * 9),
                        fiber_g: skip || noFiberSugar ? null : r(26 + w * 6),
                        sugar_g: skip || noFiberSugar ? null : r(58 + w * 14),
                        // Alcohol tracking ON in this sample: null on an
                        // unlogged day (no data), 0 on a real alcohol-free
                        // day (still shows), a value on the rest. null on
                        // every day (tracking off) hides the alcohol chip.
                        alcohol_g: skip ? null : i % 7 ? 0 : r(13.9 + w * 4),
                        // Caffeine on most days but not all, and never a 0 on
                        // a day that simply has none: avgOf must divide by the
                        // days that recorded it, not by the window. null on
                        // every day (nobody ever logged any) hides the chip —
                        // there is no opt-in flag to hide it any other way.
                        caffeine_mg:
                            skip || i % 5 === 0
                                ? null
                                : Math.round(185 + w * 60),
                        water_ml: skip ? 0 : Math.round(2200 + w * 320),
                    });
                }
                return {
                    end_date: date,
                    default_range: 14,
                    drink_unit: "us",
                    locale: "en",
                    goals: {
                        calories: 2200,
                        protein_g: 160,
                        carbs_g: 220,
                        fat_g: 70,
                        fiber_g: 30,
                        sugar_g: 45,
                        alcohol_g: 20,
                        caffeine_mg: 400,
                        water_ml: 2500,
                    },
                    days,
                };
            }
            const SAMPLE = buildSample();

            // WIDGET_LOCALE, not the host browser's: a bare toLocaleString()
            // keys off navigator.language, so a German profile on an English
            // browser printed "1,850/2,200 kcal" (read as 1.85) beside
            // macroDecimal's "1,5/2,5 l" on the same rail. Same helper as
            // nutrition-summary.html; the locale is read per call because
            // setLocale() only runs inside render().
            function fmt(n, decimals) {
                const x = Number(n);
                if (n == null || !Number.isFinite(x)) return "0";
                const r = decimals ? x.toFixed(decimals) : Math.round(x);
                try {
                    return Number(r).toLocaleString(WIDGET_LOCALE || "en");
                } catch (_) {
                    return Number(r).toLocaleString();
                }
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }
            // Trailing average over the days that actually carry this key:
            // sum / count of non-null days — matches computeTrends'
            // coveredSeries (src/insights.ts), which is where the tool's text
            // trailingAverage comes from. Calories/protein/carbs/fat/water are
            // never null (every day counts, as always), but fiber_g, sugar_g,
            // alcohol_g and caffeine_mg arrive null on a day that never
            // recorded them — dividing by days.length there would count a
            // no-data day as a real zero, exactly the drift this fixes.
            //
            // A key that is null on EVERY day averages to null, not 0, which is
            // what hides a metric the user has nothing to say about: alcohol_g
            // when tracking is off, caffeine_mg when it was never recorded. A 0
            // there would claim an alcohol-free / caffeine-free window instead.
            function avgOf(days, key) {
                if (!days.length) return 0;
                let sum = 0;
                let seen = 0;
                for (const d of days) {
                    if (d[key] == null) continue;
                    seen++;
                    sum += d[key] || 0;
                }
                if (!seen) return null;
                return sum / seen;
            }

            // ---- Labels ----------------------------------------------------------

            // The focus panel's label once a tile has moved it to another metric
            // (opts.metricLabel, shared/macros.js). It keeps the DENOMINATOR on
            // the card: without it a selected panel read the bare "Protein" and
            // nothing said any more that the figure is a range average. Two
            // wordings, because two averaging rules coexist (see avgOf): the
            // limits — fiber, sugar, alcohol, caffeine — are the metrics that
            // arrive null on a day that did not record them, so they average
            // over "days recorded"; everything else counts every day. Keyed on
            // `role` rather than on a key list, like the rest of the strip.
            function metricLabelFor(n) {
                return (m) =>
                    tpl(
                        m.role === "limit"
                            ? T.trends.metricAvgRecorded
                            : T.trends.metricAvgAllDays,
                        { metric: macroLabel(m), range: n },
                    );
            }

            // The sparkline's accessible name, as a function of the metric it
            // is drawing (sparkPaint's opts.label). The panel is a <span>, not a
            // button, so nothing else names the chart: this sentence is its
            // entire description, and it switches with the series.
            // metricOverRange deliberately carries no count-agreeing noun:
            // Intl.PluralRules falls back to "other" for Polish/Ukrainian
            // few/many, so a PluralForms key would read wrong at n = 2–4.
            function chartLabelFor(n) {
                return (m) =>
                    m.role === "cal"
                        ? tpl(T.trends.caloriesOverRange, { range: n })
                        : tpl(T.trends.metricOverRange, {
                              metric: macroLabel(m),
                              range: n,
                          });
            }

            // ---- State + rendering ---------------------------------------------

            // `range` is what is on screen. `userRange` is the range the user
            // picked with the toggle, or null if they have not; `prevKey` names
            // the payload it was picked on (end_date|default_range), so a host
            // re-delivering the SAME result keeps the user's pick while a new
            // result — a different window, or the model asking for a different
            // default — adopts the tool's choice again.
            const STATE = {
                data: null,
                range: 30,
                userRange: null,
                prevKey: null,
            };
            let __widgetApi = null;

            // The days in the last `range` calendar days, oldest first. The
            // tool sends a bucket for every calendar day (zeros for unlogged
            // days), so this is a window of the calendar, not of the logs.
            function sliceFor(range) {
                return STATE.data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1))
                    .slice(-range);
            }

            // The header's window line for ONE range, on its own — the only
            // piece of header state a range change rewrites, and the only one
            // whose height can move (a label carrying a year takes a second row
            // where a short one does not). Split out so render() can measure
            // every candidate before it paints; viewFor reads the same function,
            // so the measured string and the printed one cannot differ.
            function metaFor(range) {
                const data = STATE.data;
                const slice = sliceFor(range);
                if (!slice.length) return "";
                const end = ymd(data.end_date)
                    ? data.end_date
                    : slice[slice.length - 1].date;
                return `${rangeLabel(slice[0].date, end)} · ${daysLoggedCaption(
                    slice.filter(dayHasData).length,
                    slice.length,
                )}`;
            }

            // Everything a range owns, derived from STATE.data alone and
            // WRITING NOTHING — so a range change can build it first and give
            // up cleanly if it throws (see setRange). Returns the header meta,
            // the body's markup, and what the sparkline needs once that markup
            // is in the document: its calendar axis (null for a range with
            // nothing in it, which has no strip) and its accessible names.
            //
            // One exception to "writes nothing": macroPanel stashes its ctx for
            // the delegated handlers. That is harmless here because every
            // caller writes this body into the document straight after.
            function viewFor(range) {
                const data = STATE.data;
                const slice = sliceFor(range);
                const n = slice.length;
                const last = slice[n - 1];
                // The header names the tool's window when it can: end_date is
                // the day the series was cut at, and the buckets run up to it.
                const end = ymd(data.end_date) ? data.end_date : last.date;
                // dayHasData (shared/macros.js) derives its test from MACROS,
                // so it covers exactly the top-level metrics — fiber, sugar,
                // alcohol and caffeine never appear without a meal that already
                // contributes calories, and a null on any of them must not
                // count as a logged day.
                const logged = slice.filter(dayHasData).length;
                // "5–11 Jul · 5 of 7 days logged": the window, then how much of
                // it was logged. This used to be the chart's own foot; it is the
                // same header line nutrition-summary prints, and it is the one
                // place the count of skipped days is said out loud. Built by
                // metaFor, so render() can measure every range's candidate
                // before painting one (see the reserveLine call there).
                const meta = metaFor(range);

                if (!logged) {
                    // A range with nothing in it while a wider one has data (the
                    // whole-empty card is render()'s). The header still names
                    // the window and says "0 of 7 days logged"; the body says to
                    // widen it. The foot is emitted so the bridge's settings note
                    // keeps its home at the end of the card — without one it
                    // falls back to the root, under the card instead of in it.
                    return {
                        meta,
                        body: `
              <div class="empty">
                <div class="big">📈</div>
                <div>${esc(tpl(T.trends.rangeEmpty, { range: n }))}</div>
              </div>
              <div class="foot" data-widget-foot></div>`,
                        slots: null,
                    };
                }

                const avg = {};
                for (const m of MACROS) avg[m.key] = avgOf(slice, m.key);

                const chartLabel = chartLabelFor(n);
                // The panel is found inside THIS card's body, never
                // document-wide — see sparkPaint in shared/spark.js.
                const onSeries = (key, opened) =>
                    sparkPaint(
                        document.querySelector("#tr-body .focus"),
                        opened ? key : "calories",
                        opened,
                        { label: chartLabel },
                    );

                // No per-meal rows in a trends payload, so nothing here
                // discloses meals — chartKeys/onSeries are what keep the tiles
                // interactive, as the panel's series selector. chartableKeys
                // (shared/spark.js) is recomputed per range, so a metric whose
                // every reading in THIS window is null or zero is a static tile
                // rather than a toggle that draws a flat line on the floor.
                // Calories is never among them: it is the default series, and
                // deselecting any tile returns to it.
                //
                // The floor-metric averaged wording uses its own dedicated
                // string (T.trends.avgUnder) — distinct from macros.floorUnder's
                // live "still left today" framing and macros.ceilingUnder's
                // safety-margin framing, neither of which fits a historical
                // average's shortfall. See macroBits' wording.
                //
                // THE RING IS KEPT on purpose (the old layout dropped it for a
                // flat hero): every tile on this card shows its average as a
                // fraction of its goal, so a calorie headline without one would
                // be the only exception on the card.
                const body = macroPanel(
                    avg,
                    data.goals,
                    { under: T.trends.avgUnder },
                    null,
                    {
                        tiers: true,
                        drinkUnit: data.drink_unit,
                        // The one place the denominator is named: these are
                        // averages over every calendar day in the window,
                        // skipped days included.
                        calLabel: tpl(T.trends.avgAllDays, { range: n }),
                        metricLabel: metricLabelFor(n),
                        chartKeys: chartableKeys(slice),
                        onSeries,
                    },
                );
                return {
                    meta,
                    body,
                    slots: calendarSlots(slice, slice[0].date, end),
                    label: chartLabel,
                };
            }

            // Put a freshly written body's sparkline in: a new axis and the
            // entrance owed again (sparkReset), then either calories or — when
            // a range change is carrying a pressed series across — that
            // series, re-pressed THROUGH its tile so the tile's state, the
            // panel and the line all move by the path a tap takes. Only if the
            // tile is still a control in this window: chartableKeys differs per
            // range, and a metric with nothing to draw here comes back released.
            function paintChart(view, heldKey) {
                const fx = document.querySelector("#tr-body .focus");
                if (!view.slots || !fx) return;
                sparkReset(view.slots, STATE.data.goals);
                const tile = heldKey
                    ? document.querySelector(
                          `#tr-body [data-macro="${heldKey}"]:not(.focus)`,
                      )
                    : null;
                if (tile) macroToggle(tile);
                else sparkPaint(fx, "calories", false, { label: view.label });
            }

            function render(data) {
                STATE.data = data;
                const root = document.getElementById("root");
                setLocaleFrom(data, __widgetApi);
                // Litres or fluid ounces, from the profile (macros.js).
                setWaterUnit(data && data.water_unit);

                // WHICH RANGE. The tool's default_range, unless this is the
                // same result coming back (a host re-delivering it while the
                // card is on screen) and the user had already picked another —
                // re-reading default_range then would undo their tap.
                const def =
                    data && RANGES.includes(data.default_range)
                        ? data.default_range
                        : 30;
                const key = `${data && data.end_date}|${data && data.default_range}`;
                if (key !== STATE.prevKey) STATE.userRange = null;
                STATE.prevKey = key;
                STATE.range = STATE.userRange || def;

                // WHAT WAS OPEN, and where focus was, read before the card is
                // thrown away — the pressed series comes back through
                // macroRestore at the end (shared/macros.js).
                const was = macroSnapshot(root);

                const days = data && Array.isArray(data.days) ? data.days : [];
                if (!days.some(dayHasData)) {
                    // Nothing in all 30 days. With a real end date the card
                    // still names the window it looked at — the empty message
                    // alone could not say WHICH stretch was empty — and keeps
                    // the card, glow and foot so it looks like this widget.
                    // There is no toggle: every range of an empty series is the
                    // same empty card. Without a usable end date there is no
                    // window to name, and the bare empty block is the honest
                    // state (flattened against the host's frame by base.css).
                    const empty = `
              <div class="empty">
                <div class="big">📈</div>
                <div>${esc(T.trends.empty)}</div>
              </div>`;
                    const end = ymd(data && data.end_date)
                        ? data.end_date
                        : null;
                    root.innerHTML = end
                        ? `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.trends.title)}</h1>
              <span class="cmeta">${esc(rangeLabel(shiftDay(end, -(STATE.range - 1)), end))}</span>
            </header>
            ${empty}
            <div class="foot" data-widget-foot></div>
          </div>`
                        : empty;
                    return;
                }

                const range = STATE.range;
                const view = viewFor(range);
                const seg = RANGES.map(
                    (r) =>
                        `<button type="button" data-range="${r}" aria-pressed="${r === range}" aria-label="${esc(tpl(T.trends.rangeDaysAriaLabel, { n: r }))}">${r}</button>`,
                ).join("");

                // keepFocus (shared/bridge.js) puts focus back on the seg button
                // that held it — found again by its data-range — when a
                // re-delivery rebuilds the header under it. A tile is not its
                // business: macroRestore owns those.
                //
                // The meta is emitted BEFORE the seg, so a screen reader hears
                // which window the figures cover before the control that
                // changes it; `.cmeta.crow` (base.css) puts it back on the
                // header's second row visually.
                //
                // The glow stays calorie-tinted whatever series is selected:
                // the panel's own colour moves with the series, and a whole
                // card changing hue on every tap was a second, louder copy of
                // that one signal.
                keepFocus(root, () => {
                    root.innerHTML = `
          <div class="card c-cal">
            <div class="glow"></div>
            <header class="chead">
              <h1 class="ctitle">${esc(T.trends.title)}</h1>
              <span class="cmeta crow" id="tr-meta">${esc(view.meta)}</span>
              <div class="seg" role="group" aria-label="${esc(T.trends.windowAriaLabel)}">${seg}</div>
            </header>
            <div id="tr-body">${view.body}</div>
          </div>`;
                    paintChart(view, "");
                    // AFTER the first paint, not before it: re-pressing a tile
                    // goes through macroToggle, whose onSeries repaints the
                    // panel for that metric — restored first, the calorie paint
                    // above would then overwrite it. Focus is only ever
                    // restored, never taken.
                    macroRestore(root, was);
                });
                // A range toggle may not change the card's height, and the
                // window line is the one part of the header it rewrites — see
                // reserveLine (shared/bridge.js) for what it was doing without
                // this. Measured once per payload, after the header exists.
                reserveLine(
                    root.querySelector("#tr-meta"),
                    RANGES.map(metaFor),
                );
            }

            // A range change is an attribute flip, a meta text swap and a BODY
            // repaint — never a full render(). Rewriting root.innerHTML from the
            // toggle's own click handler destroyed the seg button that was
            // being operated, so document.activeElement fell to <body> and a
            // keyboard user was dumped to the top of the document on every
            // range change (a11y audit, major). The seg buttons are toggle
            // buttons: their pressed state and the meta beside them are the
            // only header state a range owns, and both move without touching
            // the node the user is standing on.
            function setRange(n) {
                const root = document.getElementById("root");
                const body = document.getElementById("tr-body");
                // No body means the card was never painted with a toggle (an
                // empty-state render has none), so there is nothing to switch.
                if (!body) return;
                // The series the user was comparing, carried across: a user
                // looking at protein over 7 days and then 30 should not have to
                // re-tap it after every range change.
                const held = body.querySelector(
                    '[data-macro][aria-pressed="true"]',
                );
                const heldKey = held ? held.dataset.macro : "";
                // Built BEFORE anything is written, so a throw leaves the card
                // exactly as it was — the old range, pressed and painted —
                // rather than a card whose toggle says 30 over 7 days of data.
                let view = null;
                if (!tryRender(() => (view = viewFor(n)))) return;
                STATE.range = n;
                STATE.userRange = n;
                root.querySelectorAll("[data-range]").forEach((b) => {
                    b.setAttribute(
                        "aria-pressed",
                        String(Number(b.dataset.range) === n),
                    );
                });
                const meta = document.getElementById("tr-meta");
                if (meta) meta.textContent = view.meta;
                body.innerHTML = view.body;
                paintChart(view, heldKey);
            }

            // Delegated on #root, which persists across render()'s innerHTML
            // rewrites, so it's attached once.
            document.getElementById("root").addEventListener("click", (e) => {
                const btn = e.target.closest("[data-range]");
                if (!btn) return;
                const n = Number(btn.dataset.range);
                if (n && n !== STATE.range && STATE.data) setRange(n);
            });

            // ---- Rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            // MACROS, the strip and its focus panel. Requires fmt + esc + icon
            // above; supplies dayHasData/macroLabel/macroPanel to the code that
            // runs after the host delivers a payload.
            /*@include shared/macros.js@*/

            /* The sparkline in the focus panel: chartableKeys, sparkReset and
               sparkPaint. After macros.js, whose MACROS, focusApply and
               macroCtx it calls — and included from here, never from inside
               another partial. */
            /*@include shared/spark.js@*/

            // Last, after every partial above has finished evaluating: with no
            // host, initWidget paints config.sample synchronously, and render()
            // reaches straight into macros.js's MACROS — a const, so calling it
            // any earlier is a TDZ ReferenceError rather than a hoisted call.
            initWidget({
                name: "trends-widget",
                // From the dictionary rather than a literal, so the string has
                // one home. T is still English here — this paints before the
                // handshake, when no locale is known yet.
                loading: `<div class="empty"><div class="big">📈</div><div>${esc(T.trends.loading)}</div></div>`,
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
