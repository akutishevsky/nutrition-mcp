<!doctype html>
<!--
  Trends widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, components, and host
  bridge. The result is fully self-contained — inline CSS + JS, zero network
  requests — because the MCP Apps sandbox blocks external hosts.

  Shown after get_trends. The whole widget is ONE panel: a header line carrying
  the title and the 7 / 14 / 30-day toggle, the calories-per-day chart, then the
  shared macro strip. The tool sends up to 30 days of daily series and the
  toggle slices it CLIENT-SIDE and re-renders — no host round-trip, so switching
  ranges is instant. The strip shows the trailing average vs goal (calories,
  protein, carbs, fat and water count empty days as 0, while fiber, sugar,
  alcohol and caffeine average only over the days that recorded them — see avgOf
  below — matching the tool's text output).

  The denominator is EVERY CALENDAR DAY in the window, not just the logged ones:
  these averages answer "how am I doing across this stretch of time?", so a
  skipped day pulls the average down. That deliberately differs from the
  get_nutrition_summary dashboard, whose figures divide by logged days only and
  answer "how does a day I actually log look?" (issue #70). Both are correct for
  their question and both name their denominator on screen — here that is the
  strip's calorie label ("14-day avg · all days"), which is the only place it is
  said, so keep it explicit if you touch it.

  Data arrives as the `structuredContent` of the get_trends tool result; the
  shared bridge (shared/bridge.js) reads it across host conventions and calls
  render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Trends</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* Segmented control (7 / 14 / 30-day toggle), riding at the right
               end of the panel header at its .seg-sm pill scale. The active
               label uses var(--bg) on the accent fill so it stays
               high-contrast in both themes. */
            /*@include shared/seg.css@*/

            /* Calories trend chart (hand-built SVG area + line) */
            /*@include shared/trend.css@*/

            /* Ring gauge + macro strip (calorie gauge, protein/carbs/fat bars,
               limits row, water line) — shared across widgets. */
            /*@include shared/ring.css@*/

            /*@include shared/macros.css@*/
        </style>
    </head>
    <body>
        <div class="wrap tight" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/bridge.js@*/

            const RANGES = [7, 14, 30];

            // ---- Sample data so the file renders on its own (browser preview) ----
            function buildSample() {
                const days = [];
                const end = new Date("2026-07-11T00:00:00Z");
                let date = "2026-07-11";
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(end);
                    d.setUTCDate(d.getUTCDate() - i);
                    date = d.toISOString().slice(0, 10);
                    const w = Math.sin(i / 3);
                    const skip = i === 4 || i === 11; // a couple of unlogged days
                    // A few extra days with meals logged but no fiber/sugar on
                    // them — pre-feature-style rows — so the sample exercises
                    // the "recorded on some but not all days" case that this
                    // widget must average correctly (null, not 0).
                    const noFiberSugar =
                        !skip && (i === 2 || i === 18 || i === 25);
                    const r = (n) => Math.round(n * 10) / 10;
                    days.push({
                        date,
                        calories: skip ? 0 : Math.round(2010 + w * 250),
                        protein_g: skip ? 0 : Math.round(150 + w * 18),
                        carbs_g: skip ? 0 : Math.round(212 + w * 28),
                        fat_g: skip ? 0 : Math.round(68 + w * 9),
                        fiber_g: skip || noFiberSugar ? null : r(26 + w * 6),
                        sugar_g: skip || noFiberSugar ? null : r(58 + w * 14),
                        // Alcohol tracking ON in this sample: null on an
                        // unlogged day (no data), 0 on a real alcohol-free
                        // day (still shows), a value on the rest. null on
                        // every day (tracking off) hides the alcohol cell.
                        alcohol_g: skip ? null : i % 7 ? 0 : r(13.9 + w * 4),
                        // Caffeine on most days but not all, and never a 0 on
                        // a day that simply has none: avgOf must divide by the
                        // days that recorded it, not by the window. null on
                        // every day (nobody ever logged any) hides the cell —
                        // there is no opt-in flag to hide it any other way.
                        caffeine_mg:
                            skip || i % 5 === 0
                                ? null
                                : Math.round(185 + w * 60),
                        water_ml: skip ? 0 : Math.round(2200 + w * 320),
                    });
                }
                return {
                    end_date: date,
                    default_range: 14,
                    drink_unit: "us",
                    locale: "en",
                    goals: {
                        calories: 2200,
                        protein_g: 160,
                        carbs_g: 220,
                        fat_g: 70,
                        fiber_g: 30,
                        sugar_g: 45,
                        alcohol_g: 20,
                        caffeine_mg: 400,
                        water_ml: 2500,
                    },
                    days,
                };
            }
            const SAMPLE = buildSample();

            function fmt(n, decimals) {
                if (n == null || isNaN(n)) return "0";
                const r = decimals ? n.toFixed(decimals) : Math.round(n);
                return Number(r).toLocaleString();
            }
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }
            // Trailing average over the days that actually carry this key:
            // sum / count of non-null days — matches computeTrends'
            // coveredSeries (src/insights.ts), which is where the tool's text
            // trailingAverage comes from. Calories/protein/carbs/fat/water are
            // never null (every day counts, as always), but fiber_g, sugar_g,
            // alcohol_g and caffeine_mg arrive null on a day that never
            // recorded them — dividing by days.length there would count a
            // no-data day as a real zero, exactly the drift this fixes.
            //
            // A key that is null on EVERY day averages to null, not 0, which is
            // what hides a metric the user has nothing to say about: alcohol_g
            // when tracking is off, caffeine_mg when it was never recorded. A 0
            // there would claim an alcohol-free / caffeine-free window instead.
            function avgOf(days, key) {
                if (!days.length) return 0;
                let sum = 0;
                let seen = 0;
                for (const d of days) {
                    if (d[key] == null) continue;
                    seen++;
                    sum += d[key] || 0;
                }
                if (!seen) return null;
                return sum / seen;
            }

            // MACROS + the macro strip builder (calorie gauge, protein/carbs/fat
            // bars, limits row, water line). Defines the shared MACROS array the
            // averaging loop reads. Requires fmt + esc above.
            /*@include shared/macros.js@*/

            // Calories-per-day trend: SVG area + line that scales to any range
            // (7 to 30 days). Compact — a 54-unit-tall viewBox sitting inside
            // the widget's panel, not a card of its own. Uniform scaling — no
            // preserveAspectRatio distortion — so it keeps its aspect ratio at
            // any container width.
            function trendChart(days, goal, range, logged) {
                const W = 480,
                    H = 54,
                    padL = 8,
                    padR = 8,
                    padT = 6,
                    padB = 4;
                const n = days.length;
                const vals = days.map((d) => d.calories || 0);
                const maxV = Math.max(...vals, goal || 0, 1) * 1.15;
                const plotW = W - padL - padR;
                const plotH = H - padT - padB;
                const base = padT + plotH;
                const x = (i) =>
                    n === 1 ? padL + plotW / 2 : padL + (plotW * i) / (n - 1);
                const y = (v) => padT + plotH - (v / maxV) * plotH;
                const pts = vals.map((v, i) => [x(i), y(v)]);

                const line = pts
                    .map(
                        (p, i) =>
                            `${i ? "L" : "M"}${p[0].toFixed(1)} ${p[1].toFixed(1)}`,
                    )
                    .join(" ");
                const area =
                    `M${pts[0][0].toFixed(1)} ${base} ` +
                    pts
                        .map((p) => `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`)
                        .join(" ") +
                    ` L${pts[n - 1][0].toFixed(1)} ${base} Z`;

                const goalLine =
                    goal && goal > 0
                        ? `<line class="goalline" x1="${padL}" y1="${y(goal).toFixed(1)}" x2="${W - padR}" y2="${y(goal).toFixed(1)}"/>`
                        : "";
                // Point markers only on the shortest range: at 14 and 30 days
                // they crowd the line at this height and read as noise.
                const dots =
                    n <= 7
                        ? pts
                              .map(
                                  (p) =>
                                      `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.2" fill="var(--calories)"/>`,
                              )
                              .join("")
                        : "";
                const md = (d) => esc(d.date.slice(5)); // MM-DD

                return `
          <div class="chart">
            <div class="chead">
              <span class="ctitle">${esc(T.nutritionSummary.caloriesPerDay)}</span>
              <span class="cmeta">${tpl(T.trends.loggedOfTotal, { logged, total: n })}</span>
            </div>
            <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(tpl(T.trends.caloriesOverRange, { range }))}">
              <line class="axis" x1="${padL}" y1="${base}" x2="${W - padR}" y2="${base}"/>
              ${goalLine}
              <path d="${area}" fill="var(--calories)" opacity="0.16"/>
              <path d="${line}" fill="none" stroke="var(--calories)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
              ${dots}
            </svg>
            <div class="tdates">
              <span>${md(days[0])}</span>
              <span>${md(days[n - 1])}</span>
            </div>
          </div>`;
            }

            // ---- State + rendering ---------------------------------------------
            const STATE = { data: null, range: 30 };
            let __widgetApi = null;

            function render(data) {
                STATE.data = data;
                const root = document.getElementById("root");
                // The tool sends a bucket for every calendar day (zeros for
                // unlogged days), so the array is basically never empty — treat
                // an all-zero series (nothing logged) as empty too.
                // dayHasData (shared/macros.js) derives the test from MACROS,
                // so it covers exactly the top-level metrics — fiber, sugar,
                // alcohol and caffeine never appear without a meal that already
                // contributes calories, and a null on any of them must not
                // count as a logged day.
                const anyLogged =
                    data &&
                    Array.isArray(data.days) &&
                    data.days.some(dayHasData);
                setLocaleFrom(data, __widgetApi);
                if (!anyLogged) {
                    root.innerHTML = `
            <div class="empty">
              <div class="big">📈</div>
              <div>${esc(T.trends.empty)}</div>
            </div>`;
                    return;
                }
                STATE.range = RANGES.includes(data.default_range)
                    ? data.default_range
                    : 30;
                paint();
            }

            function paint() {
                const root = document.getElementById("root");
                const data = STATE.data;
                const all = data.days
                    .slice()
                    .sort((a, b) => (a.date < b.date ? -1 : 1));
                const range = STATE.range;
                const slice = all.slice(-range);

                const avg = {};
                for (const m of MACROS) avg[m.key] = avgOf(slice, m.key);

                const logged = slice.filter(dayHasData).length;

                const seg = RANGES.map(
                    (r) =>
                        `<button class="seg-btn${r === range ? " active" : ""}" data-range="${r}" aria-pressed="${r === range}" aria-label="${esc(tpl(T.trends.rangeDaysAriaLabel, { n: r }))}">${r}</button>`,
                ).join("");

                // No per-meal rows in a trends payload, so the strip is static
                // — macroPanel only makes tiles tappable when meals are passed.
                // `divided` gives it the leading hairline that separates it from
                // the chart above. The floor-metric averaged wording uses its
                // own dedicated string (T.trends.avgUnder) — distinct from
                // macros.floorUnder's live "still left today" framing and
                // macros.ceilingUnder's safety-margin framing, neither of which
                // fits a historical average's shortfall. See macroBits'
                // wording.under in shared/macros.js.
                const panel = macroPanel(
                    avg,
                    data.goals,
                    { under: T.trends.avgUnder },
                    null,
                    {
                        drinkUnit: data.drink_unit,
                        divided: true,
                        // The one place the denominator is named: these are
                        // averages over every calendar day in the window, skipped
                        // days included.
                        calLabel: tpl(T.trends.avgAllDays, { range }),
                    },
                );
                const chart = trendChart(
                    slice,
                    data.goals?.calories ?? null,
                    range,
                    logged,
                );

                root.innerHTML = `
          <div class="panel">
            <div class="phead mid">
              <div class="ptitle">${esc(T.trends.title)}</div>
              <div class="seg seg-sm" role="group" aria-label="${esc(T.trends.windowAriaLabel)}">${seg}</div>
            </div>
            ${chart}
            ${panel}
          </div>`;
            }

            // Delegated on #root, which persists across paint()'s innerHTML
            // rewrites, so it's attached once.
            document.getElementById("root").addEventListener("click", (e) => {
                const btn = e.target.closest(".seg-btn");
                if (!btn) return;
                const n = Number(btn.dataset.range);
                if (n && n !== STATE.range && STATE.data) {
                    STATE.range = n;
                    paint();
                }
            });

            // ---- Rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "trends-widget",
                loading:
                    '<div class="empty"><div class="big">📈</div><div>Loading your trends…</div></div>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
