<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Nutrition Trends</title>
        <style>
            /*@include shared/tokens.css@*/
            /*@include shared/base.css@*/
            /*@include shared/facts.css@*/
            /* Slice-3 density trims for the known height offender: the fold
               is enforced by the inline cut (3 label rows, detail moves to
               fullscreen) plus these small local spacing reductions. The
               shared grammar in facts.css is untouched. */
            .f-body {
                padding: 12px 20px 14px;
            }
            .f-lrow {
                padding: 5px 0 6px;
            }
            .f-rule-heavy {
                margin-top: 8px;
            }
            .f-section-title {
                font-size: 15px;
                font-weight: 650;
                margin: 14px 0 4px;
            }
            .t-spark {
                width: 100%;
                height: 58px;
                display: block;
                margin-top: 4px;
            }
            .t-spark .gap-dot {
                fill: var(--panel);
                stroke: var(--text-subtle);
                stroke-width: 1.5;
            }
            .t-spark .seg-dot {
                fill: var(--accent);
            }
            .t-spark .goal-label {
                font-size: 10px;
                fill: var(--text-dim);
            }
            .range-controls {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-bottom: 14px;
            }
            .range-controls .btn[aria-pressed="true"] {
                background: var(--facts-band);
                color: var(--facts-band-ink);
                border-color: var(--facts-band);
            }
            .day-table {
                max-height: min(48vh, 520px);
                overflow: auto;
            }
            .gap-cell {
                color: var(--text-dim);
                font-weight: 650;
                letter-spacing: 0.04em;
                text-transform: uppercase;
                font-size: 10.5px;
            }
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>
        <script>
            "use strict";
            /*@include shared/bridge.js@*/
            /*@include shared/ui.js@*/
            /*@include shared/facts.js@*/
            function buildSample() {
                const days = [];
                const end = new Date("2026-08-05T12:00:00Z");
                for (let i = 29; i >= 0; i--) {
                    const d = new Date(end);
                    d.setUTCDate(d.getUTCDate() - i);
                    const wave = Math.sin(i / 3);
                    const gap = i === 10 || i === 23;
                    days.push({
                        date: d.toISOString().slice(0, 10),
                        calories: gap ? 0 : Math.round(2050 + wave * 230),
                        protein_g: gap ? 0 : Math.round(148 + wave * 16),
                        carbs_g: gap ? 0 : Math.round(210 + wave * 24),
                        fat_g: gap ? 0 : Math.round(68 + wave * 8),
                        water_ml: gap ? 0 : Math.round(2100 + wave * 300),
                    });
                }
                return {
                    end_date: "2026-08-05",
                    default_range: 14,
                    goals: {
                        calories: 2200,
                        protein_g: 160,
                        carbs_g: 220,
                        fat_g: 70,
                        water_ml: 2500,
                    },
                    days,
                };
            }
            const SAMPLE = buildSample();
            let DATA = null,
                API = null,
                RANGE = 14;
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (payload.error || payload.__error)
                    return {
                        __error:
                            payload.error?.message ||
                            payload.error ||
                            payload.__error,
                    };
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent)
                    return coerce(payload.structuredContent);
                return null;
            }
            function hasData(day) {
                return [
                    "calories",
                    "protein_g",
                    "carbs_g",
                    "fat_g",
                    "water_ml",
                ].some((key) => Number(day[key] || 0) > 0);
            }
            // Averages cover logged days only. A day with no log is a gap:
            // it never enters a mean, and the note under the chart is
            // computed the same way, so the two always agree.
            function average(days, key) {
                const logged = days.filter(hasData);
                if (!logged.length) return 0;
                return (
                    logged.reduce(
                        (sum, day) => sum + Number(day[key] || 0),
                        0,
                    ) / logged.length
                );
            }
            function sliceForRange(data, range) {
                const sorted = data.days
                    .slice()
                    .sort((a, b) => a.date.localeCompare(b.date));
                return sorted.slice(-range);
            }
            function changeText(slice) {
                const logged = slice.filter(hasData);
                if (logged.length < 4)
                    return "Not enough logged days to compare periods.";
                const midpoint = Math.floor(logged.length / 2);
                const first = average(logged.slice(0, midpoint), "calories");
                const second = average(logged.slice(midpoint), "calories");
                const delta = Math.round(second - first);
                if (Math.abs(delta) < 50)
                    return "Average calories were stable across this window.";
                return `Average calories moved ${fmt(Math.abs(delta))} kcal ${delta > 0 ? "higher" : "lower"} in the newer half (${fmt(second)} vs ${fmt(first)} kcal per logged day).`;
            }
            // Gap-aware sparkline: the line breaks at days with no log and
            // each gap day gets a hollow marker on the axis, so a missing
            // day is visible instead of silently interpolated. Replaces the
            // shared sparkline() for this surface only.
            function gapSparkline(slice, goal, label) {
                const loggedValues = slice
                    .filter(hasData)
                    .map((day) => Number(day.calories || 0));
                if (!loggedValues.length) return "";
                const width = 520,
                    height = 58,
                    pad = 5;
                let min = Math.min(...loggedValues),
                    max = Math.max(...loggedValues);
                if (goal != null && Number.isFinite(Number(goal))) {
                    min = Math.min(min, Number(goal));
                    max = Math.max(max, Number(goal));
                }
                if (max === min) {
                    max += 1;
                    min -= 1;
                }
                const spread = max - min;
                min -= spread * 0.12;
                max += spread * 0.12;
                const x = (index) =>
                    slice.length === 1
                        ? width / 2
                        : pad +
                          (index * (width - pad * 2)) / (slice.length - 1);
                const y = (value) =>
                    pad + ((max - value) * (height - pad * 2)) / (max - min);
                const axisY = height - pad;
                let shapes = `<line class="axis" x1="${pad}" y1="${axisY}" x2="${width - pad}" y2="${axisY}"></line>`;
                if (goal != null && Number.isFinite(Number(goal))) {
                    const gy = y(Number(goal));
                    shapes += `<line class="goal" x1="${pad}" y1="${gy.toFixed(1)}" x2="${width - pad}" y2="${gy.toFixed(1)}"></line><text class="goal-label" x="${width - pad}" y="${Math.max(10, gy - 4).toFixed(1)}" text-anchor="end">goal ${esc(fmt(goal))}</text>`;
                }
                let run = [];
                const flush = () => {
                    if (run.length >= 2) {
                        const line = run
                            .map(
                                (point, index) =>
                                    `${index ? "L" : "M"}${point[0].toFixed(1)} ${point[1].toFixed(1)}`,
                            )
                            .join(" ");
                        const area = `M${run[0][0].toFixed(1)} ${axisY} ${run.map((point) => `L${point[0].toFixed(1)} ${point[1].toFixed(1)}`).join(" ")} L${run[run.length - 1][0].toFixed(1)} ${axisY} Z`;
                        shapes += `<path class="area" d="${area}"></path><path class="line" d="${line}"></path>`;
                    } else if (run.length === 1) {
                        shapes += `<circle class="seg-dot" cx="${run[0][0].toFixed(1)}" cy="${run[0][1].toFixed(1)}" r="3"></circle>`;
                    }
                    run = [];
                };
                slice.forEach((day, index) => {
                    if (hasData(day)) {
                        run.push([x(index), y(Number(day.calories || 0))]);
                    } else {
                        flush();
                        shapes += `<circle class="gap-dot" cx="${x(index).toFixed(1)}" cy="${axisY}" r="3"></circle>`;
                    }
                });
                flush();
                return `<svg class="spark t-spark" viewBox="0 0 ${width} ${height}" role="img" aria-label="${esc(label)}">${shapes}</svg>`;
            }
            function metricRow(name, value, goal, unit) {
                return factsLabelRow({
                    name,
                    ofText:
                        goal != null
                            ? `avg of ${fmt(goal, unit === "ml" ? 0 : 1)} ${unit} goal`
                            : "no target set",
                    valueText: `${fmt(value, unit === "kcal" || unit === "ml" ? 0 : 1)} ${unit}`,
                    value,
                    goal,
                });
            }
            function bindChrome() {
                document
                    .getElementById("details")
                    ?.addEventListener("click", async () => {
                        const result = await API?.requestDisplayMode(
                            "fullscreen",
                        ).catch(() => null);
                        if (!result || result.unsupported)
                            document.getElementById("details").textContent =
                                "Details unavailable";
                    });
                document
                    .getElementById("close")
                    ?.addEventListener("click", () =>
                        API?.requestDisplayMode("inline"),
                    );
                document.querySelectorAll("[data-range]").forEach((button) =>
                    button.addEventListener("click", () => {
                        RANGE = Number(button.dataset.range);
                        paint();
                    }),
                );
            }
            function paint() {
                const rangeLabel = `Last ${RANGE} days`;
                if (DATA.__error) {
                    document.getElementById("root").innerHTML = factsCardState(
                        "Trends",
                        rangeLabel,
                        "error",
                        "Could not load trends",
                        String(DATA.__error) ||
                            "Something went wrong reading your logged meals. Try again in chat.",
                    );
                    return;
                }
                const slice = sliceForRange(DATA, RANGE);
                const logged = slice.filter(hasData);
                const gaps = slice.length - logged.length;
                if (!logged.length) {
                    document.getElementById("root").innerHTML =
                        `<article class="card">${factsBand("Trends", rangeLabel)}${factsState("empty", "No trend data yet", "Log meals on several days to build a trend.")}<div class="f-foot"><span>Averages use logged days only</span><span>Your logged meals</span></div></article>`;
                    return;
                }
                const goals = DATA.goals || {};
                const avg = {
                    calories: average(slice, "calories"),
                    protein_g: average(slice, "protein_g"),
                    carbs_g: average(slice, "carbs_g"),
                    fat_g: average(slice, "fat_g"),
                    water_ml: average(slice, "water_ml"),
                    fiber_g: average(slice, "fiber_g"),
                    sugar_g: average(slice, "sugar_g"),
                };
                const start = slice[0]?.date,
                    end = slice[slice.length - 1]?.date;
                const rowDefs = [
                    ["Calories", avg.calories, goals.calories, "kcal"],
                    ["Protein", avg.protein_g, goals.protein_g, "g"],
                    ["Carbs", avg.carbs_g, goals.carbs_g, "g"],
                    ["Fat", avg.fat_g, goals.fat_g, "g"],
                    ["Water", avg.water_ml, goals.water_ml, "ml"],
                ];
                if (goals.fiber_g != null || avg.fiber_g > 0)
                    rowDefs.push(["Fiber", avg.fiber_g, goals.fiber_g, "g"]);
                if (goals.sugar_g != null || avg.sugar_g > 0)
                    rowDefs.push(["Sugar", avg.sugar_g, goals.sugar_g, "g"]);
                const inlineRows = rowDefs
                    .slice(0, 3)
                    .map((def) => metricRow(def[0], def[1], def[2], def[3]))
                    .join("");
                const remainingRows = rowDefs
                    .slice(3)
                    .map((def) => metricRow(def[0], def[1], def[2], def[3]))
                    .join("");
                const allRows = rowDefs
                    .map((def) => metricRow(def[0], def[1], def[2], def[3]))
                    .join("");
                const dayRows = slice
                    .slice()
                    .reverse()
                    .map((day) =>
                        hasData(day)
                            ? `<tr><td>${esc(humanDate(day.date))}</td><td class="num">${fmt(day.calories)}</td><td class="num">${fmt(day.protein_g, 1)}</td><td class="num">${fmt(day.carbs_g, 1)}</td><td class="num">${fmt(day.fat_g, 1)}</td></tr>`
                            : `<tr><td>${esc(humanDate(day.date))}</td><td class="gap-cell" colspan="4">No log</td></tr>`,
                    )
                    .join("");
                const controls = [7, 14, 30]
                    .map(
                        (range) =>
                            `<button class="btn btn-sm" data-range="${range}" aria-pressed="${RANGE === range}">${range} days</button>`,
                    )
                    .join("");
                const gapLegend =
                    gaps > 0
                        ? `<span>○ ${gaps} day${gaps === 1 ? "" : "s"} with no log</span>`
                        : `<span>Every day logged</span>`;
                document.getElementById("root").innerHTML =
                    `<article class="card">
        ${factsBand("Trends", rangeLabel)}
        <div class="f-body">
        ${factsHero(`${fmt(avg.calories)} <span class="f-hero-unit">kcal</span>`, `average per logged day · ${esc(humanRange(start, end))}`, `${logged.length} of ${slice.length}`, "days logged")}
        <div class="f-src">Source · <b>Your logged meals</b></div>
        ${gapSparkline(slice, goals.calories, `Daily calories over ${RANGE} days${gaps > 0 ? `, ${gaps} days with no log shown as gaps` : ""}`)}
        <div class="row-between caption"><span>${esc(humanDate(start))}</span>${gapLegend}<span>${esc(humanDate(end))}</span></div>
        <div class="f-note" style="margin-top:8px">${esc(changeText(slice))}</div>
        <div class="f-rule-heavy"></div>
        ${inlineRows}
        <button class="f-more-row inline-only" id="details">View full trends</button>
        <div class="fullscreen-only">
        <div class="fullscreen-only range-controls" role="group" aria-label="Trend range">${controls}</div>
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">More averages</h2>
        ${remainingRows}
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Daily values</h2>
        <div class="table-wrap day-table" style="margin-top:10px"><table><thead><tr><th>Date</th><th>kcal</th><th>Protein</th><th>Carbs</th><th>Fat</th></tr></thead><tbody>${dayRows}</tbody></table></div>
        <div class="f-rule-med"></div>
        <h2 class="f-section-title">Average versus target</h2>
        ${allRows}
        <div class="actions"><button class="btn" id="close">Return to chat</button></div>
        </div>
        </div>
        <div class="f-foot"><span>Averages use logged days only</span><span>Your logged meals</span></div>
    </article>`;
                bindChrome();
            }
            function render(data) {
                DATA = data;
                RANGE = [7, 14, 30].includes(Number(data.default_range))
                    ? Number(data.default_range)
                    : 14;
                paint();
            }
            initWidget({
                name: "trends-widget",
                displayModes: ["inline", "fullscreen"],
                loading:
                    '<article class="card"><div class="f-band"><span class="f-band-title">Trends</span></div><div class="f-state"><strong>Loading trends</strong><span>Reading your logged meals…</span></div></article>',
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    API = api;
                },
                onHostContext() {
                    if (DATA) paint();
                },
            });
        </script>
    </body>
</html>
