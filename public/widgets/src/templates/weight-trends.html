                const text = open ? W.showLess : W.showMore;
                // The accessible name starts with the visible text.
                const aria = tpl(
                    M.meas ? W.detailsAria : W.detailsAriaWeighIns,
                    { action: text },
                );
                return `<button type="button" class="reset bigchev${open ? " open" : ""}" data-act="tog" data-f="tog" aria-expanded="${open}" aria-label="${esc(aria)}"><span>${esc(text)}</span><svg width="14" height="9" viewBox="0 0 34 22" aria-hidden="true"><path d="M5 5l12 12 12-12"></path></svg></button>`;
            }

            function footHtml(M, R) {
                const sum = summaryOf(M, R);
                const stats = statsOf(M, R);
                const dot = '<span class="dot" aria-hidden="true">·</span>';
                const line = sum.parts.length
                    ? sum.parts.join(dot)
                    : esc(sum.hint);
                const mobile = `
          <div class="only-m">
            ${line ? `<div class="gdelta">${line}</div>` : ""}
            ${toggleBtn(M)}
          </div>`;
                const statsHtml = stats.length
                    ? `<div class="gstats">${stats
                          .map(
                              (s) =>
                                  `<div class="gs"><span class="gsl">${esc(s.k)}</span><b class="num${s.cls ? " " + s.cls : ""}">${esc(s.v)}${s.u ? ` <small>${esc(s.u)}</small>` : ""}</b></div>`,
                          )
                          .join("")}</div>`
                    : "";
                const desk = `
          <div class="dfoot only-d">
            <div class="dleft">${statsHtml}${sum.hint ? `<div class="dhint">${esc(sum.hint)}</div>` : ""}</div>
            ${toggleBtn(M)}
          </div>`;
                return mobile + desk;
            }

            // ---- Details: weigh-ins ----
            // The weigh-in list covers the daily data the payload carries; a
            // range reaching further back than that is named by the range it
            // actually covers.
            function listingOf(M, R) {
                const cut = cutoffOf(R.id);
                const days = M.days.filter((d) => d.date >= cut);
                let copy = R.copy;
                const covStart = M.days.length ? M.days[0].date : null;
                if (
                    covStart &&
                    M.firstDate &&
                    M.firstDate < covStart &&
                    (!cut || cut < covStart)
                ) {
                    copy =
                        T.weightTrends.ranges[
                            M.s && M.s.year.length ? "1y" : M.s ? "90" : "30"
                        ];
                }
                return { days, copy };
            }

            function weighInsHtml(M, R) {
                const W = T.weightTrends;
                const L = listingOf(M, R);
                const ds = L.days;
                const n = ds.length;
                const open = VIEW.wo && n > 0;
                const readings = ds.reduce(
                    (s, d) => s + (d.ins ? d.ins.length : 1),
                    0,
                );
                const ws = ds.map((d) => d.w);
                const avg = n ? ws.reduce((a, b) => a + b, 0) / n : 0;
                const label = n
                    ? plural(W.accLabel, readings, { range: L.copy.inRange })
                    : tpl(W.accEmpty, { range: L.copy.inRange });
                let sub = "";
                if (n > 1)
                    sub = tpl(W.accAvgRange, {
                        avg: `${f1(avg)} ${M.unit}`,
                        min: f1(Math.min(...ws)),
                        max: f1(Math.max(...ws)),
                    });
                else if (n === 1) {
                    const d = ds[0].date;
                    sub =
                        d === M.today
                            ? W.loggedToday
                            : d === shiftDate(M.today, -1)
                              ? W.loggedYesterday
                              : tpl(W.loggedOn, { date: shortDate(d) });
                }
                const chev = `<svg class="achev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>`;
                const inner = `<span class="em" aria-hidden="true">⚖️</span><span class="ab"><span class="lb num">${esc(label)}</span>${sub ? `<span class="vl num">${esc(sub)}</span>` : ""}</span>`;
                const head = n
                    ? `<button type="button" class="reset accH" data-act="wi" data-f="wi" aria-expanded="${open}">${inner}${chev}</button>`
                    : `<div class="accH">${inner}<span></span></div>`;
                let body = "";
                if (open)
                    body = `<div class="accB${FRESH.has("wi") ? " fresh" : ""}">${weeksHtml(M, ds)}</div>`;
                return `
          <section class="sec swi">
            <div class="sech">${esc(W.sectionWeighIns)}</div>
            <div class="acc${open ? " sel" : ""}" data-key="wi">${head}${body}</div>
          </section>`;
            }

            function weekName(k) {
                const W = T.weightTrends;
                const cur = weekStart(M_today());
                if (k === cur) return W.weekThis;
                if (k === shiftDate(cur, -7)) return W.weekLast;
                return dateRange(k, shiftDate(k, 6), "none");
            }
            function M_today() {
                return MODEL.today;
            }

            function weeksHtml(M, ds) {
                const W = T.weightTrends;
                const unit = M.unit;
                // Week averages over every known day (so a week cut by the
                // range edge still compares against the full previous week).
                const byWk = new Map();
                for (const d of M.days) {
                    const k = weekStart(d.date);
                    const a = byWk.get(k) || [];
                    a.push(d.w);
                    byWk.set(k, a);
                }
                const avgOf = (k) => {
                    const a = byWk.get(k);
                    return a ? a.reduce((s, x) => s + x, 0) / a.length : null;
                };
                const idx = new Map(M.days.map((d, i) => [d.date, i]));
                const R = RANGE_NOW;
                const groups = [];
                ds.slice()
                    .reverse()
                    .forEach((d) => {
                        const k = weekStart(d.date);
                        let g = groups[groups.length - 1];
                        if (!g || g.k !== k) {
                            g = { k, days: [] };
                            groups.push(g);
                        }
                        g.days.push(d);
                    });
                const shown = VIEW.allW ? groups : groups.slice(0, WEEKS_CAP);
                const more = groups.length - shown.length;
                const cur = weekStart(M.today);
                const html = shown
                    .map((g, gi) => {
                        const a = avgOf(g.k),
                            pv = avgOf(shiftDate(g.k, -7));
                        const c = pv != null ? a - pv : null;
                        const cTxt =
                            c != null
                                ? tpl(
                                      g.k === cur
                                          ? W.weekVsLast
                                          : W.weekVsBefore,
                                      { change: sg(c) },
                                  )
                                : "";
                        const days = g.days
                            .map((d) => {
                                const i = idx.get(d.date);
                                const pd = i > 0 ? M.days[i - 1] : null;
                                const multi = !!(d.ins && d.ins.length > 1);
                                const openD = multi && VIEW.mo === d.date;
                                const meta = multi
                                    ? plural(W.dayMulti, d.ins.length)
                                    : d.ins
                                      ? d.ins[0].t
                                      : "";
                                const note =
                                    !multi && d.ins && d.ins[0].note
                                        ? d.ins[0].note
                                        : "";
                                const chip = pd
                                    ? `<span class="num wchip ${R.dir(d.w - pd.w)}">${esc(sg(d.w - pd.w))}</span>`
                                    : `<span class="wchip none"></span>`;
                                const inner = `<span class="wdt"><b>${esc(dLong(d.date))}</b>${meta ? `<span class="wdm num">${esc(meta)}</span>` : ""}${note ? `<span class="wdn">${esc(note)}</span>` : ""}</span><b class="wdv num">${esc(f1(d.w))} <small>${esc(unit)}</small></b>${chip}<svg class="mc${!multi ? " hide" : openD ? " open" : ""}" width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>`;
                                const row = multi
                                    ? `<button type="button" class="reset wdr" data-act="day" data-d="${d.date}" data-f="d${d.date}" aria-expanded="${openD}">${inner}</button>`
                                    : `<div class="wdr">${inner}</div>`;
                                const list = openD
                                    ? `<div class="itl${FRESH.has("mo") ? " fresh" : ""}">${d.ins
                                          .map(
                                              (x) =>
                                                  `<div class="itr"><span class="num">${esc(x.t)}</span><span class="iv num">${esc(f1(x.w))} ${esc(unit)}</span>${x.note ? `<span class="im">${esc(x.note)}</span>` : ""}</div>`,
                                          )
                                          .join("")}</div>`
                                    : "";
                                return `<div class="wd">${row}${list}</div>`;
                            })
                            .join("");
                        return `<div class="wk" data-key="wk${g.k}" style="--n:${gi}"><div class="wkh"${VIEW.allW && gi === WEEKS_CAP ? ' tabindex="-1" data-f="wkmore"' : ""}><b>${esc(weekName(g.k))}</b><span class="num">${esc(tpl(W.weekAvg, { value: `${f1(a)} ${unit}` }))}</span>${cTxt ? `<span class="num wkc ${R.dir(c)}">${esc(cTxt)}</span>` : ""}</div>${days}</div>`;
                    })
                    .join("");
                const moreBtn =
                    more > 0
                        ? `<button type="button" class="reset pmore" data-act="wmore" data-f="wmore">${esc(plural(W.showEarlierWeeks, more))}</button>`
                        : "";
                return html + moreBtn;
            }

            // ---- Details: body measurements ----
            function measHtml(M, R) {
                const W = T.weightTrends;
                const cut = cutoffOf(R.id);
                const sites = M.meas.sites;
                const arrow = (c, unit) =>
                    Math.abs(c) < 0.05
                        ? W.changeFlat
                        : tpl(c < 0 ? W.changeDown : W.changeUp, {
                              delta: `${f1(Math.abs(c))} ${unit}`,
                          });
                const cards = SITES.filter(([k]) => sites[k]).map(
                    ([k, emoji], ci) => {
                        const site = sites[k];
                        const unit = site.unit;
                        const all = site.entries;
                        const inR = all.filter((e) => e.date >= cut);
                        const lastE = all[all.length - 1];
                        const stale = inR.length === 0;
                        let chg;
                        if (stale)
                            chg = tpl(W.measStale, {
                                date: shortDate(lastE.date),
                            });
                        else {
                            const i0 = all.indexOf(inR[0]);
                            const base =
                                inR.length >= 2
                                    ? inR[0]
                                    : i0 > 0
                                      ? all[i0 - 1]
                                      : null;
                            chg = base
                                ? tpl(W.measSince, {
                                      change: arrow(lastE.v - base.v, unit),
                                      date: shortDate(base.date),
                                  })
                                : tpl(W.measFirst, {
                                      date: shortDate(lastE.date),
                                  });
                        }
                        const label = W.sites[k] || k;
                        const open = VIEW.mk === k;
                        let body = "";
                        if (open) {
                            const src = (stale ? all.slice(-3) : inR)
                                .slice()
                                .reverse();
                            const shown = VIEW.allM
                                ? src
                                : src.slice(0, CARD_ROWS_CAP);
                            const more = src.length - shown.length;
                            const rows = shown
                                .map((e, ri) => {
                                    const i = all.indexOf(e),
                                        pe = i > 0 ? all[i - 1] : null;
                                    const fk =
                                        VIEW.allM && ri === CARD_ROWS_CAP
                                            ? ' tabindex="-1" data-f="mrmore"'
                                            : "";
                                    return `<div class="mle"${fk}><span>${esc(dLong(e.date))}</span><b class="num">${esc(f1(e.v))} <small>${esc(unit)}</small></b><span class="mld num">${esc(pe ? arrow(e.v - pe.v, unit) : W.measFirstRow)}</span></div>`;
                                })
                                .join("");
                            const head = stale
                                ? W.measEarlier
                                : tpl(W.measHeading, {
                                      site: label,
                                      range: R.copy.heading,
                                  });
                            body = `<div class="mcB${FRESH.has("mk") ? " fresh" : ""}"><div class="mch">${esc(head)}</div>${rows}${more > 0 ? `<button type="button" class="reset pmore" data-act="mmore" data-f="mmore">${esc(plural(W.showMoreN, more))}</button>` : ""}</div>`;
                        }
                        return `<div class="mcard${open ? " open" : ""}${stale ? " stale" : ""}" data-key="m${k}" style="--n:${ci}"><button type="button" class="reset mcH" data-act="card" data-k="${k}" data-f="c${k}" aria-expanded="${open}"><span class="mct"><span class="mce" aria-hidden="true">${emoji}</span><span class="mcn">${esc(label)}</span><svg class="achev" width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span><span class="mcv num"><b>${esc(f1(lastE.v))}</b> ${esc(unit)}</span><span class="mcd num">${esc(chg)}</span></button>${body}</div>`;
                    },
                );
                const inner = cards.length
                    ? `<div class="mgrid${cards.length === 1 ? " one" : ""}">${cards.join("")}</div>`
                    : `<div class="nomeas">${esc(W.noMeasurements)}</div>`;
                return `
          <section class="sec sms">
            <div class="sech">${esc(tpl(W.sectionMeasurements, { range: R.copy.heading }))}</div>
            ${inner}
          </section>`;
            }

            function detailsHtml(M, R) {
                if (VIEW.level < 1) return "";
                const W = T.weightTrends;
                const meas = M.meas ? measHtml(M, R) : "";
                return `
          <div class="dets${FRESH.has("dets") ? " fresh" : ""}${meas ? "" : " solo"}">
            ${weighInsHtml(M, R)}
            ${meas}
          </div>
          <button type="button" class="reset collall" data-act="coll" data-f="coll"><svg width="14" height="14" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 11l5-5 5 5"></path><path d="M7 18l5-5 5 5"></path></svg><span>${esc(W.collapseAll)}</span></button>`;
            }

            // ---- Paint ----
            const STATE = {
                data: null,
                series: null,
                entries: null,
                meas: null,
                range: "30",
            };
            let VIEW = freshView();
            let FRESH = new Set();
            let RANGE_NOW = null;
            let __widgetApi = null;

            function freshView() {
                return {
                    level: 0,
                    wo: false,
                    mk: null,
                    mo: null,
                    allW: false,
                    allM: false,
                    scrub: null,
                };
            }

            function markup() {
                const W = T.weightTrends;
                const M = buildModel();
                if (!M.last) {
                    return `<div class="empty"><div class="big">⚖️</div><div>${esc(W.empty)}</div></div>`;
                }
                if (!M.ranges.some((r) => r.id === STATE.range))
                    STATE.range = "30";
                const R = rangeModel(M, STATE.range);
                RANGE_NOW = R;
                const eyebrow =
                    M.last.kind === "day" && M.last.date === M.today
                        ? W.eyebrowToday
                        : tpl(W.eyebrowLast, {
                              date:
                                  M.last.kind === "day"
                                      ? shortDate(M.last.date)
                                      : monthYear(M.last.date),
                          });
                const open = VIEW.level >= 1;
                return `
          <div class="panel wt${FRESH.has("intro") ? " intro" : ""}">
            <button type="button" class="reset gtop" data-act="tog" data-f="gtop" aria-expanded="${open}"><span class="eyb2">${esc(eyebrow)}</span><span class="t">${esc(titleOf(M, R))}</span></button>
            ${heroHtml(M, R)}
            <div class="hchart">${chartHtml(M, R)}</div>
            ${footHtml(M, R)}
            ${detailsHtml(M, R)}
          </div>`;
            }

            function paint() {
                const host = document.getElementById("wt");
                if (!host) return;
                const active = document.activeElement;
                const fkey = active && active.dataset ? active.dataset.f : null;
                host.innerHTML = markup();
                FRESH = new Set();
                // Focus survives the repaint: the phone and desktop layouts
                // share focus keys, and the visible twin gets it.
                if (fkey) {
                    const el = Array.from(
                        host.querySelectorAll(`[data-f="${fkey}"]`),
                    ).find((x) => x.offsetParent !== null);
                    if (el) el.focus({ preventScroll: true });
                }
                resetScrollbar();
            }

            function focusKey(k) {
                const host = document.getElementById("wt");
                const el = host
                    ? Array.from(host.querySelectorAll(`[data-f="${k}"]`)).find(
                          (x) => x.offsetParent !== null,
                      )
                    : null;
                if (el) el.focus({ preventScroll: true });
            }

            function reduced() {
                try {
                    return window.matchMedia("(prefers-reduced-motion: reduce)")
                        .matches;
                } catch (_) {
                    return false;
                }
            }
            function isDesk() {
                try {
                    return window.matchMedia("(min-width: 640px)").matches;
                } catch (_) {
                    return false;
                }
            }

            // Desktop: animate details cards from their old boxes to their
            // new ones when a card or the weigh-ins accordion opens/closes.
            function flip(apply) {
                const host = document.getElementById("wt");
                if (
                    !host ||
                    !isDesk() ||
                    reduced() ||
                    typeof Element === "undefined" ||
                    !Element.prototype.animate
                ) {
                    apply();
                    return;
                }
                const q = () =>
                    Array.from(host.querySelectorAll(".dets [data-key]"));
                const before = new Map(
                    q().map((e) => [e.dataset.key, e.getBoundingClientRect()]),
                );
                apply();
                const go = () =>
                    q().forEach((e) => {
                        const f = before.get(e.dataset.key);
                        if (!f) return;
                        const l = e.getBoundingClientRect();
                        const dx = f.left - l.left,
                            dy = f.top - l.top;
                        const grow =
                            l.width - f.width > 2 || l.height - f.height > 2;
                        const shrink =
                            f.width - l.width > 2 || f.height - l.height > 2;
                        if (
                            Math.abs(dx) < 1 &&
                            Math.abs(dy) < 1 &&
                            !grow &&
                            !shrink
                        )
                            return;
                        const kf = [
                            { transform: `translate(${dx}px, ${dy}px)` },
                            { transform: "translate(0, 0)" },
                        ];
                        if (grow) {
                            kf[0].clipPath = `inset(0 ${Math.max(l.width - f.width, 0)}px ${Math.max(l.height - f.height, 0)}px 0 round 16px)`;
                            kf[1].clipPath = "inset(0 0 0 0 round 16px)";
                        }
                        e.animate(kf, {
                            duration: 560,
                            easing: "cubic-bezier(.22,1,.36,1)",
                        });
                    });
                requestAnimationFrame(() => requestAnimationFrame(go));
            }

            let closingTimer = 0;
            function collapse() {
                if (closingTimer) return;
                const done = () => {
                    closingTimer = 0;
                    VIEW = freshView();
                    paint();
                    const t = document.querySelector('[data-f="gtop"]');
                    if (t && document.activeElement === document.body)
                        t.focus({ preventScroll: true });
                };
                const panel = document.querySelector("#wt .panel");
                if (reduced() || !panel) {
                    done();
                    return;
                }
                panel.classList.add("closing");
                closingTimer = setTimeout(done, 460);
            }

            function act(btn) {
                const a = btn.dataset.act;
                if (a === "tog") {
                    if (VIEW.level === 0) {
                        VIEW.level = 1;
                        FRESH.add("dets");
                        paint();
                    } else collapse();
                    return;
                }
                if (a === "coll") return collapse();
                if (a === "range") {
                    const r = btn.dataset.r;
                    if (r && r !== STATE.range) {
                        STATE.range = r;
                        VIEW.scrub = null;
                        VIEW.mo = null;
                        VIEW.allW = false;
                        VIEW.allM = false;
                        paint();
                    }
                    return;
                }
                if (a === "hit") {
                    const i = Number(btn.dataset.i);
                    VIEW.scrub = VIEW.scrub === i ? null : i;
                    if (VIEW.scrub != null) FRESH.add("scrub");
                    paint();
                    return;
                }
                if (a === "sx") {
                    VIEW.scrub = null;
                    paint();
                    return;
                }
                if (a === "wi") {
                    flip(() => {
                        VIEW.wo = !VIEW.wo;
                        VIEW.level = VIEW.wo ? 2 : 1;
                        VIEW.mo = null;
                        VIEW.allW = false;
                        if (VIEW.wo) FRESH.add("wi");
                        paint();
                    });
                    return;
                }
                // The button disappears with the repaint, so focus moves to
                // the first row it revealed instead of falling to <body>.
                if (a === "wmore") {
                    VIEW.allW = true;
                    paint();
                    focusKey("wkmore");
                    return;
                }
                if (a === "day") {
                    const d = btn.dataset.d;
                    VIEW.mo = VIEW.mo === d ? null : d;
                    if (VIEW.mo) FRESH.add("mo");
                    paint();
                    return;
                }
                if (a === "card") {
                    const k = btn.dataset.k;
                    flip(() => {
                        VIEW.mk = VIEW.mk === k ? null : k;
                        VIEW.allM = false;
                        if (VIEW.mk) FRESH.add("mk");
                        paint();
                    });
                    return;
                }
                if (a === "mmore") {
                    VIEW.allM = true;
                    paint();
                    focusKey("mrmore");
                }
            }

            // Chrome can keep a classic scrollbar it drew while the document
            // briefly overflowed the iframe — the host's 130px starting frame,
            // or an in-widget repaint that is taller for a frame before the
            // host catches up with size-changed — even once nothing
            // overflows. Toggling overflow makes it recompute; a host that
            // caps the height still scrolls. Run after every resize and
            // every repaint. (Guarded: the landing page's static renderer
            // has no rAF or listeners.)
            function resetScrollbar() {
                if (typeof requestAnimationFrame !== "function") return;
                requestAnimationFrame(() => {
                    const de = document.documentElement;
                    if (!de || !de.style) return;
                    de.style.overflow = "hidden";
                    void de.offsetHeight;
                    requestAnimationFrame(() => (de.style.overflow = ""));
                });
            }
            // Entrance animations (translateY rises, the reel) can overflow
            // the frame mid-flight, so once a burst of them has ended, reset
            // again.
            let animEndTimer = 0;
            if (typeof window.addEventListener === "function")
                window.addEventListener("resize", resetScrollbar);
            if (typeof document.addEventListener === "function")
                document.addEventListener("animationend", () => {
                    clearTimeout(animEndTimer);
                    animEndTimer = setTimeout(resetScrollbar, 120);
                });

            // Delegated on #root, which survives every repaint of #wt.
            document.getElementById("root").addEventListener("click", (e) => {
                const btn =
                    e.target && e.target.closest
                        ? e.target.closest("[data-act]")
                        : null;
                if (!btn || !STATE.data) return;
                act(btn);
            });

            function render(data, meta) {
                STATE.data = data || {};
                STATE.series = seriesFrom(meta);
                STATE.entries = entriesFrom(meta);
                STATE.meas = measFrom(meta);
                setLocale(
                    pickLocale(
                        data && data.locale,
                        __widgetApi && __widgetApi.hostContext
                            ? __widgetApi.hostContext.locale
                            : null,
                    ),
                );
                VIEW = freshView();
                FRESH = new Set(["intro"]);
                buildModel();
                STATE.range = MODEL.last ? initialRange(data) : "30";
                // One string into #root (the static renderer reads it back);
                // later repaints rewrite #wt only.
                document.getElementById("root").innerHTML =
                    `<div id="wt">${markup()}</div>`;
                FRESH = new Set();
                resetScrollbar();
            }

            // ---- Standalone preview sample (no host) ----
            function buildSample() {
                const days = [];
                for (let i = 120; i >= 0; i--) {
                    if (i % 3 === 1) continue;
                    const date = shiftDate("2026-10-24", -i);
                    const w =
                        86 - ((120 - i) / 120) * 4 + Math.sin(i * 1.3) * 0.4;
                    days.push({ date, weight: Math.round(w * 10) / 10 });
                }
                return {
                    end_date: "2026-10-24",
                    unit: "kg",
                    target: 78,
                    default_range: 30,
                    locale: "en",
                    days,
                };
            }
            const SAMPLE = buildSample();
            function buildSampleMeta() {
                let t = SAMPLE.days[0].weight;
                let prev = null;
                const pts = SAMPLE.days.map((d) => {
                    if (prev)
                        t +=
                            (1 -
                                Math.pow(0.85, dayNum(d.date) - dayNum(prev))) *
                            (d.weight - t);
                    prev = d.date;
                    return {
                        date: d.date,
                        weight: d.weight,
                        trend: Math.round(t * 10) / 10,
                    };
                });
                return {
                    [SERIES_KEY]: {
                        v: 1,
                        unit: "kg",
                        daily: pts.filter(
                            (p) => p.date >= shiftDate("2026-10-24", -89),
                        ),
                        daily_year: pts,
                        weekly: [],
                        monthly: [],
                        first: { date: pts[0].date, weight: pts[0].weight },
                        trend_latest: pts[pts.length - 1].trend,
                        trend_date: "2026-10-24",
                        weekly_rate: -0.24,
                    },
                    [ENTRIES_KEY]: {
                        v: 1,
                        unit: "kg",
                        today: "2026-10-24",
                        entries: SAMPLE.days.map((d) => ({
                            date: d.date,
                            time: "07:30",
                            weight: d.weight,
                            note: null,
                        })),
                    },
                    [MEAS_KEY]: {
                        v: 1,
                        sites: {
                            waist: {
                                unit: "cm",
                                entries: [
                                    { date: "2026-08-01", value: 92.5 },
                                    { date: "2026-09-01", value: 91.0 },
                                    { date: "2026-10-20", value: 89.5 },
                                ],
                            },
                        },
                    },
                };
            }

            // ---- Rendering intake ----
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "weight-trends-widget",
                // A function: bridge.js calls it with the strings for the
                // browser language, since the payload's locale isn't known yet.
                loading: (strings) =>
                    '<div class="empty"><div class="big">⚖️</div><div>' +
                    esc(strings.weightTrends.loading) +
                    "</div></div>",
                coerce,
                render,
                sample: SAMPLE,
                sampleMeta: buildSampleMeta(),
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
