<!doctype html>
<!--
  Weight-trends widget (MCP Apps), the 2026-10 redesign (W4).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, the widget shell and
  the host bridge. The result is fully self-contained — inline CSS + JS, zero
  network requests — because the MCP Apps sandbox blocks external hosts.

  Shown after get_weight_trends. ONE panel, top to bottom:

  - a header button (eyebrow + one-line status title) that opens the details;
  - the hero row: the latest weigh-in as a big reel-animated number, a chip
    with the change over the selected range, and 7d · 30d · 90d · 1y · All
    range pills;
  - a date-proportional chart: faint daily dots, the smoothed trend line with
    an area under it, dashed segments across gaps, a dashed goal line with a
    goal pill (pinned to an edge when the goal is off the data range), and a
    tap/hover scrub tooltip. One weigh-in in range is a "cone" card, none an
    empty card;
  - a summary line (phone) or a stats row (from 640px wide), and the
    Show more / Show less button;
  - details: Weigh-ins (an accordion of the range's weigh-ins grouped by week,
    with expandable multi-reading days) and Body measurements (one card per
    site, one open at a time). Side by side from 640px.

  The layout switch is a CSS media query on the iframe's own width; the chart
  is drawn twice (a 287×172 and an 814×200 geometry) and CSS shows one.

  Data, all treated as untrusted and every piece optional beyond
  structuredContent (frozen: end_date, unit, target, default_range, locale,
  30 days of daily averages):

  - _meta "nutrition-mcp.com/weight-series": the server's EWMA trend, weekly
    rate and the long series (daily 90 d, daily_year 365 d, weekly, monthly).
    Without it the widget draws structuredContent.days only (7d/30d), with a
    centred moving average for the line.
  - _meta "nutrition-mcp.com/weight-entries": every weigh-in of the last year
    with its local time and note (multi-reading days, times, notes).
  - _meta "nutrition-mcp.com/body-measurements": per-site measurement
    history. Absent → the Body measurements section is not shown.

  Every range, toggle and scrub is client-side; nothing round-trips to the
  host. Interactions repaint #wt (inside #root), so the bridge's settings
  footer, appended to #root after render(), survives them.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Weight Trends</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* ---- Local, theme-aware mixes (no hexes: tokens only) ---- */
            :root {
                --wt-chip: color-mix(in srgb, var(--text) 6%, var(--panel));
                --wt-chip-h: color-mix(in srgb, var(--text) 10%, var(--panel));
                --wt-acc: 9%;
                --wt-acc-sel: 6%;
                --wt-ring: 32%;
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --wt-acc: 13%;
                    --wt-acc-sel: 9%;
                    --wt-ring: 38%;
                }
            }
            :root[data-theme="light"] {
                --wt-acc: 9%;
                --wt-acc-sel: 6%;
                --wt-ring: 32%;
            }
            :root[data-theme="dark"] {
                --wt-acc: 13%;
                --wt-acc-sel: 9%;
                --wt-ring: 38%;
            }

            .panel.wt {
                display: block;
                padding: 14px 16px 12px;
            }
            .num {
                font-variant-numeric: tabular-nums;
            }
            button {
                font: inherit;
                color: inherit;
            }
            :where(button.reset) {
                all: unset;
                box-sizing: border-box;
                cursor: pointer;
                text-align: left;
            }
            button.reset:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: 2px;
                border-radius: 8px;
            }
            .vh {
                position: absolute;
                width: 1px;
                height: 1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
            }
            .only-d {
                display: none !important;
            }

            /* ---- Header ---- */
            .gtop {
                display: flex !important;
                flex-direction: column;
                gap: 2px;
                width: 100%;
            }
            .eyb2 {
                font-size: 12.5px;
                font-weight: 600;
                color: var(--text-dim);
                letter-spacing: 0.01em;
                margin-bottom: 3px;
            }
            .gtop .t {
                font-size: 17px;
                font-weight: 650;
                letter-spacing: -0.015em;
                line-height: 1.3;
                color: var(--text);
                overflow-wrap: anywhere;
            }

            /* ---- Hero row ---- */
            .wtop {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
                margin-top: 14px;
            }
            .wnow {
                display: flex;
                align-items: baseline;
                flex-wrap: wrap;
                gap: 4px 0;
                min-width: 0;
            }
            .wbig {
                display: inline-flex;
                line-height: 1;
                height: 1em;
                font-size: 44px;
                font-weight: 800;
                letter-spacing: -0.03em;
                color: var(--text);
            }
            /* The reel: each digit is a column of 0–9 four times, parked on
               the fourth cycle's digit; the intro animation spins it there
               from 0. Without the animation (reduced motion, or any repaint
               after the first) it simply sits on its final digit. */
            .rl {
                display: inline-block;
                height: 1em;
                line-height: 1;
                overflow: hidden;
                vertical-align: top;
            }
            .rs {
                display: flex;
                flex-direction: column;
                transform: translateY(calc((30 + var(--d)) * -1em));
            }
            .rs span {
                display: block;
                height: 1em;
                line-height: 1;
                text-align: center;
            }
            .intro .rs {
                animation: reel calc(1.4s + var(--i) * 0.3s)
                    cubic-bezier(0.22, 1, 0.36, 1) 0.2s both;
            }
            @keyframes reel {
                from {
                    transform: translateY(0);
                }
            }
            .wunit {
                font-size: 17px;
                font-weight: 650;
                color: var(--text-dim);
                margin-left: 5px;
                margin-right: 12px;
            }
            .dchip {
                align-self: center;
                display: inline-flex;
                align-items: center;
                height: 28px;
                padding: 0 11px;
                border-radius: 14px;
                font-size: 13px;
                font-weight: 800;
                white-space: nowrap;
                font-variant-numeric: tabular-nums;
            }
            .intro .dchip {
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.6s both;
            }
            .dchip.good,
            .wchip.g {
                background: var(--gauge-track);
                color: var(--status-ok-ink);
            }
            .dchip.bad,
            .wchip.b {
                background: var(--gauge-over-track);
                color: var(--status-over-ink);
            }
            .dchip.neu,
            .wchip.n,
            .wchip.z {
                background: var(--wt-chip);
                color: var(--text-dim);
            }
            .rpills {
                display: flex;
                gap: 6px;
                flex-wrap: wrap;
            }
            .rp {
                height: 32px;
                min-width: 44px;
                padding: 0 12px !important;
                border-radius: 16px;
                background: var(--wt-chip);
                color: var(--text);
                font-size: 13.5px;
                font-weight: 700;
                display: inline-flex !important;
                align-items: center;
                justify-content: center;
                transition:
                    background-color 0.25s ease,
                    color 0.25s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .rp:hover {
                background: var(--wt-chip-h);
            }
            .rp:active {
                transform: scale(0.94);
            }
            .rp.on,
            .rp.on:hover {
                background: var(--weight-strong);
                color: var(--on-weight);
            }

            /* ---- Chart ---- */
            .hchart {
                position: relative;
                margin-top: 14px;
            }
            .wplot {
                position: relative;
                -webkit-tap-highlight-color: transparent;
            }
            .cbody {
                display: grid;
                grid-template-columns: 30px minmax(0, 1fr);
                column-gap: 6px;
                row-gap: 7px;
            }
            .cyl {
                position: relative;
                min-height: 0;
            }
            .cyl span {
                position: absolute;
                right: 0;
                transform: translateY(-50%);
                font-size: 11px;
                font-weight: 600;
                line-height: 1;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .cplot {
                position: relative;
                width: 100%;
            }
            .wch {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                overflow: visible;
            }
            .cu {
                font-size: 11px;
                font-weight: 700;
                line-height: 14px;
                color: var(--text-dim);
                text-align: right;
            }
            .cx {
                position: relative;
                height: 14px;
                font-size: 11.5px;
                font-weight: 600;
                line-height: 14px;
                color: var(--text-dim);
            }
            .cx span {
                position: absolute;
                top: 0;
                white-space: nowrap;
            }
            .cx span.md,
            .cgp.md {
                transform: translateX(-50%);
            }
            .cx span.en {
                transform: translateX(-100%);
            }
            .cg {
                fill: none;
                stroke: var(--track);
                stroke-width: 1;
                vector-effect: non-scaling-stroke;
            }
            .cgoal {
                fill: none;
                stroke: var(--text);
                stroke-width: 1.5;
                stroke-dasharray: 5 5;
                opacity: 0.6;
                vector-effect: non-scaling-stroke;
            }
            .carea {
                fill: var(--weight);
                fill-opacity: 0.09;
                stroke: none;
            }
            .cdot {
                fill: none;
                stroke: var(--weight);
                stroke-width: 5;
                stroke-linecap: round;
                opacity: 0.42;
                vector-effect: non-scaling-stroke;
            }
            .cdot.tiny {
                stroke-width: 4;
            }
            .cdot.few {
                stroke-width: 9;
                opacity: 1;
            }
            .cline {
                fill: none;
                stroke: var(--weight);
                stroke-width: 3;
                stroke-linecap: round;
                stroke-linejoin: round;
                stroke-dasharray: 100;
                stroke-dashoffset: 0;
            }
            .cline.dash {
                stroke-width: 2;
                stroke-dasharray: 4 6;
                opacity: 0.85;
                vector-effect: non-scaling-stroke;
            }
            .intro .carea {
                animation: gIn 1s ease 0.7s both;
            }
            .intro .cgoal {
                animation: gIn 0.6s ease 1s both;
            }
            .intro .cdot {
                animation: gIn 0.6s ease 0.3s both;
            }
            .intro .cline {
                animation: cDraw 1.6s cubic-bezier(0.45, 0.05, 0.25, 1) 0.15s
                    both;
            }
            .intro .cline.dash {
                animation: gIn 0.8s ease 0.9s both;
            }
            .cval {
                position: absolute;
                transform: translateY(-100%);
                font-size: 11.5px;
                font-weight: 700;
                line-height: 1;
                color: var(--text-dim);
                white-space: nowrap;
                pointer-events: none;
            }
            .cval.md {
                transform: translate(-50%, -100%);
            }
            .cval.en {
                transform: translate(-100%, -100%);
            }
            .cval.bl {
                transform: none;
            }
            .cval.md.bl {
                transform: translateX(-50%);
            }
            .cval.en.bl {
                transform: translateX(-100%);
            }
            .cgp {
                position: absolute;
                display: inline-flex;
                align-items: center;
                height: 20px;
                padding: 0 9px;
                border-radius: 10px;
                background: var(--panel);
                box-shadow: inset 0 0 0 1px
                    color-mix(in srgb, var(--text) 16%, var(--panel));
                font-size: 11.5px;
                font-weight: 700;
                color: var(--text);
                white-space: pre;
                font-variant-numeric: tabular-nums;
                pointer-events: none;
            }
            .cgp.en {
                transform: translateX(-100%);
            }
            .intro .cval,
            .intro .cgp {
                animation: gIn 0.6s ease 1.1s both;
            }
            .cend {
                position: absolute;
                width: 12px;
                height: 12px;
                margin: -6px 0 0 -6px;
                border-radius: 50%;
                background: var(--panel);
                border: 3.5px solid var(--weight);
                box-shadow: 0 0 0 6px
                    color-mix(in srgb, var(--weight) 18%, transparent);
                pointer-events: none;
            }
            .intro .cend,
            .intro .conedot {
                animation: gPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 1.6s both;
            }
            .chits {
                position: absolute;
                inset: 0;
                z-index: 1;
            }
            .chit {
                position: absolute !important;
                top: 0;
                bottom: 0;
                cursor: pointer;
                border-radius: 4px;
            }
            .chit:hover {
                background: color-mix(in srgb, var(--weight) 7%, transparent);
            }
            button.reset.chit:focus-visible {
                outline: 2px solid var(--focus);
                outline-offset: -2px;
                border-radius: 4px;
            }
            .shair {
                position: absolute;
                top: 0;
                bottom: 0;
                width: 1px;
                margin-left: -0.5px;
                background: var(--text);
                opacity: 0.5;
                pointer-events: none;
            }
            .sdot {
                position: absolute;
                width: 11px;
                height: 11px;
                margin: -5.5px 0 0 -5.5px;
                border-radius: 50%;
                background: var(--weight);
                border: 2px solid var(--panel);
                pointer-events: none;
                z-index: 2;
            }
            .stip {
                position: absolute;
                z-index: 3;
                display: flex;
                align-items: center;
                gap: 4px;
                height: 30px;
                margin-top: -12px;
                padding: 0 0 0 11px;
                border-radius: 14px;
                background: var(--text);
                color: var(--panel);
                font-size: 12px;
                white-space: nowrap;
                box-shadow: 0 4px 12px rgba(16, 24, 40, 0.18);
                transform: translateY(-100%);
            }
            .stip.fresh {
                animation: gIn 0.15s ease both;
            }
            .stip b {
                font-weight: 800;
            }
            .stip > span {
                font-weight: 600;
            }
            .stip.st {
                transform: translate(-14px, -100%);
            }
            .stip.md {
                transform: translate(-50%, -100%);
            }
            .stip.en {
                transform: translate(calc(-100% + 14px), -100%);
            }
            .stip.bl {
                margin-top: 12px;
            }
            .stip.st.bl {
                transform: translateX(-14px);
            }
            .stip.md.bl {
                transform: translateX(-50%);
            }
            .stip.en.bl {
                transform: translateX(calc(-100% + 14px));
            }
            .sx {
                width: 32px;
                height: 32px;
                margin: -2px 0;
                display: inline-flex !important;
                align-items: center;
                justify-content: center;
                border-radius: 16px;
                font-size: 17px;
                line-height: 1;
                opacity: 0.8;
                text-align: center !important;
            }
            .sx:hover {
                opacity: 1;
                background: color-mix(in srgb, var(--panel) 16%, transparent);
            }
            .cone {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
                padding: 22px 16px 20px;
                border-radius: 16px;
                background: color-mix(in srgb, var(--weight) 8%, var(--panel));
                text-align: center;
                font-size: 13px;
                color: var(--text-dim);
                line-height: 1.4;
            }
            .cone b {
                font-size: 14.5px;
                font-weight: 750;
                color: var(--text);
            }
            .cone .coneh {
                margin-top: 2px;
            }
            .conedot {
                width: 12px;
                height: 12px;
                margin-bottom: 9px;
                border-radius: 50%;
                background: var(--panel);
                border: 3.5px solid var(--weight);
                box-shadow: 0 0 0 6px
                    color-mix(in srgb, var(--weight) 18%, transparent);
            }
            .cempty {
                border-radius: 16px;
                background: color-mix(in srgb, var(--weight) 7%, var(--panel));
                padding: 28px 20px;
                text-align: center;
                font-size: 13.5px;
                line-height: 1.45;
                color: var(--text-dim);
            }

            /* ---- Summary (phone) ---- */
            .gdelta {
                text-align: center;
                font-size: 13.5px;
                color: var(--text-dim);
                margin-top: 14px;
                line-height: 1.45;
            }
            .gdelta b {
                color: var(--text);
                font-weight: 700;
            }
            .gdelta b.over,
            .gs b.over {
                color: var(--over);
            }
            .gdelta .dot {
                margin: 0 6px;
                color: color-mix(in srgb, var(--text) 30%, var(--panel));
            }
            .intro .gdelta {
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.3s both;
            }

            /* ---- Show more / less ---- */
            .bigchev {
                display: flex !important;
                align-self: center;
                align-items: center;
                justify-content: center;
                gap: 8px;
                height: 40px;
                padding: 0 18px 0 20px !important;
                margin: 16px auto 0;
                width: max-content;
                border-radius: 20px;
                background: var(--pill-bg);
                font-size: 15px;
                font-weight: 800;
                color: var(--text);
                transition:
                    background-color 0.3s ease,
                    transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .bigchev:hover {
                background: var(--pill-bg-hover);
            }
            .bigchev:active {
                transform: scale(0.94);
            }
            .bigchev svg {
                fill: none;
                stroke: currentColor;
                stroke-width: 6.5;
                stroke-linecap: round;
                stroke-linejoin: round;
                flex: none;
                transition: transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
            }
            .bigchev.open svg {
                transform: rotate(180deg);
            }
            .closing .bigchev svg {
                transform: none;
            }
            .intro .bigchev {
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.6s both;
            }

            /* ---- Desktop footer row (stats + button) ---- */
            .dfoot {
                align-items: center;
                justify-content: space-between;
                gap: 24px;
                margin-top: 14px;
                padding-top: 14px;
                border-top: 1px solid var(--track);
            }
            .dfoot .bigchev {
                margin: 0;
                flex: none;
            }
            .dleft {
                min-width: 0;
            }
            .dhint {
                font-size: 13.5px;
                color: var(--text-dim);
            }
            .gstats + .dhint {
                margin-top: 10px;
            }
            .gstats {
                display: grid;
                grid-auto-flow: column;
                grid-auto-columns: max-content;
                gap: 10px 44px;
                min-width: 0;
            }
            .gs {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }
            .gsl {
                font-size: 11.5px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                color: var(--text-dim);
                white-space: nowrap;
            }
            .gs b {
                font-size: 20px;
                font-weight: 800;
                color: var(--text);
                letter-spacing: -0.01em;
                white-space: nowrap;
            }
            .gs b small {
                font-size: 12.5px;
                font-weight: 500;
                color: var(--text-dim);
            }
            .intro .gs {
                animation: gUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 2.1s both;
            }

            /* ---- Details ---- */
            .dets {
                display: flex;
                flex-direction: column;
                gap: 22px;
                padding-top: 22px;
            }
            .sec {
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-width: 0;
            }
            .sech {
                font-size: 11.5px;
                font-weight: 700;
                color: var(--text-dim);
                letter-spacing: 0.06em;
                text-transform: uppercase;
                line-height: 1.3;
                padding-left: 2px;
                margin-bottom: 2px;
            }
            .acc {
                --mc: var(--weight);
                border-radius: 16px;
                background: color-mix(
                    in oklab,
                    var(--mc) var(--wt-acc),
                    var(--panel)
                );
                box-shadow: inset 0 0 0 4px transparent;
                transition:
                    box-shadow 0.35s ease,
                    background-color 0.35s ease;
                overflow: hidden;
            }
            .acc.sel {
                box-shadow: inset 0 0 0 4px
                    color-mix(in oklab, var(--mc) var(--wt-ring), var(--panel));
                background: color-mix(
                    in oklab,
                    var(--mc) var(--wt-acc-sel),
                    var(--panel)
                );
            }
            .accH {
                display: grid !important;
                grid-template-columns: 30px minmax(0, 1fr) 16px;
                column-gap: 10px;
                align-items: center;
                width: 100%;
                padding: 12px 14px;
                min-height: 56px;
            }
            .accH .em {
                font-size: 22px;
                line-height: 1;
            }
            .accH .ab {
                display: flex;
                flex-direction: column;
                gap: 2px;
                min-width: 0;
            }

                font-size: 15px;
                font-weight: 700;
                color: var(--text);
                overflow-wrap: anywhere;
            }

                color: var(--text-dim);

            .wk {
                padding-top: 4px;

            .wkh {
                display: flex;
                flex-wrap: wrap;
                align-items: baseline;
                gap: 2px 8px;
                padding: 10px 0 6px;

                outline: none;

                outline-offset: 2px;
                border-radius: 6px;
            }
            .wkh b {
                font-size: 13.5px;
                font-weight: 800;
                color: var(--text);
            }

            }

            /* Entrance animations for what an interaction just opened. */

            @keyframes gIn {

            /* ---- Desktop: from 640px of iframe width ---- */

                /* base.css caps .wrap at 760px. The desktop artboard (W4-Weight-D)
                   is a 920px frame, and the 814x200 chart plus the two-column
                   details are drawn for it. Scoped to this widget's root, like

    </head>
    <body>
        <div class="wrap tight wt-wide" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/date.js@*/

            /*@include shared/bridge.js@*/

            // ---- _meta keys (src/widgets.ts). Repeated as literals because
            // a widget cannot import; src/mcp.test.ts asserts the assembled
            // HTML contains each one. ----
            const SERIES_KEY = "nutrition-mcp.com/weight-series";
            const ENTRIES_KEY = "nutrition-mcp.com/weight-entries";
            const MEAS_KEY = "nutrition-mcp.com/body-measurements";

            const RANGES = [
                { id: "7", days: 7 },
                { id: "30", days: 30 },
                { id: "90", days: 90 },
                { id: "1y", days: 365 },
                { id: "all", days: null },
            ];
            // Display order and emoji of the nine stored sites.
            const SITES = [
                ["waist", "📏"],
                ["hips", "🍑"],
                ["chest", "👕"],
                ["shoulders", "🧥"],
                ["neck", "🧣"],
                ["upper_arm", "💪"],
                ["forearm", "✊"],
                ["thigh", "🦵"],
                ["calf", "🦶"],
            ];
            // How many week groups / card rows show before "Show N more".
            const WEEKS_CAP = 3;
            const CARD_ROWS_CAP = 6;
            // The two chart geometries (phone / desktop), in SVG units.
            const GEOMS = [
                { v: "m", cw: 287, ch: 172 },
                { v: "d", cw: 814, ch: 200 },
            ];

            // ---- Small helpers ----
            function esc(s) {
                return String(s).replace(
                    /[&<>"]/g,
                    (c) =>
                        ({
                            "&": "&amp;",
                            "<": "&lt;",
                            ">": "&gt;",
                            '"': "&quot;",
                        })[c],
                );
            }
            // A translated template whose text is escaped and whose
            // placeholders take ready-made HTML (e.g. a <b> figure).
            function tplHtml(s, vars) {
                return String(s)
                    .split(/(\{\w+\})/)
                    .map((part) => {
                        const m = /^\{(\w+)\}$/.exec(part);
                        if (!m) return esc(part);
                        return vars && vars[m[1]] != null ? vars[m[1]] : "";
                    })
                    .join("");
            }
            const isNum = (v) => typeof v === "number" && isFinite(v);
            const isDate = (v) =>
                typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v);
            const dayNum = (iso) => Date.parse(iso + "T00:00:00Z") / 864e5;
            function shiftDate(date, delta) {
                const d = new Date(date + "T00:00:00Z");
                d.setUTCDate(d.getUTCDate() + delta);
                return d.toISOString().slice(0, 10);
            }
            function dateOfDayNum(n) {
                return new Date(Math.round(n) * 864e5)
                    .toISOString()
                    .slice(0, 10);
            }
            function weekStart(iso) {
                const dow = (new Date(iso + "T00:00:00Z").getUTCDay() + 6) % 7;
                return shiftDate(iso, -dow);
            }
            function localToday() {
                const now = new Date();
                const p = (n) => String(n).padStart(2, "0");
                return `${now.getFullYear()}-${p(now.getMonth() + 1)}-${p(now.getDate())}`;
            }
            const NF = {};
            function nf(dp) {
                const k = WIDGET_LOCALE + dp;
                if (!NF[k]) {
                    try {
                        NF[k] = new Intl.NumberFormat(WIDGET_LOCALE, {
                            minimumFractionDigits: dp,
                            maximumFractionDigits: dp,
                        });
                    } catch (_) {
                        NF[k] = { format: (v) => Number(v).toFixed(dp) };
                    }
                }
                return NF[k];
            }
            // Every weight on screen carries exactly one decimal (77.0, not
            // 77): this widget has no whole-number figures.
            function f1(v) {
                return nf(1).format(Math.round(Number(v) * 10) / 10);
            }
            // Signed with a real minus (U+2212); ± for a change that rounds
            // to zero.
            function sg(v, dp) {
                const d = dp == null ? 1 : dp;
                const n = Number(Math.abs(v).toFixed(d));
                const s = n === 0 ? "±" : v < 0 ? "−" : "+";
                return s + nf(d).format(n);
            }
            // Intl formatters from shared/date.js (UTC, cached per locale).
            function dtf(opts) {
                try {
                    return dateFmt(opts);
                } catch (_) {
                    return null;
                }
            }
            function utc(iso) {
                return new Date(iso + "T12:00:00Z");
            }
            function weekday(iso) {
                const f = dtf({ weekday: "short" });
                return f ? f.format(utc(iso)) : "";
            }
            // "Mar 2025".
            function monthYear(iso) {
                const f = dtf({ month: "short", year: "numeric" });
                return f ? f.format(utc(iso.slice(0, 7) + "-15")) : iso;
            }
            // "Mar ’25" — the long ranges' axis labels. A bare two-digit
            // year ("Mar 25") reads as a day of the month, so where the
            // locale puts the month first the year gets an apostrophe;
            // elsewhere (ja: "2025年3月") the full month-year is unambiguous.
            function monthYear2(iso) {
                const f = dtf({ month: "short", year: "2-digit" });
                if (!f || typeof f.formatToParts !== "function")
                    return monthYear(iso);
                const parts = f.formatToParts(utc(iso.slice(0, 7) + "-15"));
                const mi = parts.findIndex((p) => p.type === "month");
                const yi = parts.findIndex((p) => p.type === "year");
                if (mi < 0 || yi < 0 || yi < mi) return monthYear(iso);
                return `${parts[mi].value} ’${parts[yi].value}`;
            }
            // "Today", "Yesterday", else "Mon 20 Oct".
            function dLong(iso) {
                const today = MODEL.today;
                if (iso === today) return T.weightTrends.today;
                if (iso === shiftDate(today, -1))
                    return T.weightTrends.yesterday;
                return `${weekday(iso)} ${shortDate(iso)}`;
            }
            function dFull(iso) {
                return `${weekday(iso)} ${shortDate(iso)}`;
            }

            // ---- Payload intake: every _meta field is optional and checked ----
            function rowsOf(arr, key, ok) {
                return (Array.isArray(arr) ? arr : [])
                    .filter(
                        (r) =>
                            r &&
                            ok(r[key]) &&
                            isNum(r.weight) &&
                            isNum(r.trend),
                    )
                    .slice()
                    .sort((a, b) => (a[key] < b[key] ? -1 : 1));
            }
            function seriesFrom(meta) {
                const s = meta && meta[SERIES_KEY];
                if (!s || typeof s !== "object") return null;
                const out = {
                    hasDaily: Array.isArray(s.daily),
                    daily: rowsOf(s.daily, "date", isDate),
                    year: rowsOf(s.daily_year, "date", isDate),
                    weekly: rowsOf(s.weekly, "start", isDate),
                    monthly: rowsOf(s.monthly, "month", (m) =>
                        /^\d{4}-\d{2}$/.test(String(m)),
                    ),
                    first:
                        s.first && isDate(s.first.date) && isNum(s.first.weight)
                            ? { date: s.first.date, w: s.first.weight }
                            : null,
                    trendDate: isDate(s.trend_date) ? s.trend_date : null,
                    weeklyRate: isNum(s.weekly_rate) ? s.weekly_rate : null,
                };
                if (
                    !out.daily.length &&
                    !out.year.length &&
                    !out.weekly.length &&
                    !out.monthly.length
                ) {
                    return null;
                }
                return out;
            }
            function entriesFrom(meta) {
                const e = meta && meta[ENTRIES_KEY];
                if (!e || typeof e !== "object" || !Array.isArray(e.entries))
                    return null;
                const byDate = new Map();
                for (const r of e.entries) {
                    if (
                        !r ||
                        !isDate(r.date) ||
                        !isNum(r.weight) ||
                        typeof r.time !== "string" ||
                        !/^\d{2}:\d{2}$/.test(r.time)
                    )
                        continue;
                    const note =
                        typeof r.note === "string" && r.note.trim()
                            ? r.note.trim().slice(0, 300)
                            : null;
                    const list = byDate.get(r.date) || [];
                    list.push({ t: r.time, w: r.weight, note });
                    byDate.set(r.date, list);
                }
                for (const list of byDate.values())
                    list.sort((a, b) => (a.t < b.t ? -1 : a.t > b.t ? 1 : 0));
                return {
                    today: isDate(e.today) ? e.today : null,
                    byDate,
                };
            }
            function measFrom(meta) {
                const m = meta && meta[MEAS_KEY];
                if (!m || typeof m !== "object") return null;
                const src =
                    m.sites && typeof m.sites === "object" ? m.sites : null;
                if (!src) return null;
                const sites = {};
                for (const [kind] of SITES) {
                    const s = src[kind];
                    if (!s || (s.unit !== "cm" && s.unit !== "in")) continue;
                    const entries = (Array.isArray(s.entries) ? s.entries : [])
                        .filter(
                            (r) =>
                                r &&
                                isDate(r.date) &&
                                isNum(r.value) &&
                                r.value > 0,
                        )
                        .map((r) => ({ date: r.date, v: r.value }))
                        .sort((a, b) =>
                            a.date < b.date ? -1 : a.date > b.date ? 1 : 0,
                        );
                    if (entries.length) sites[kind] = { unit: s.unit, entries };
                }
                return { sites };
            }

            // ---- The model: everything one paint needs, rebuilt per paint ----
            let MODEL = { today: "" };

            function baseDays(data, s, ent) {
                let src;
                if (s) src = s.year.length ? s.year : s.daily;
                else
                    src = (Array.isArray(data.days) ? data.days : [])
                        .filter((d) => d && isDate(d.date) && isNum(d.weight))
                        .slice()
                        .sort((a, b) => (a.date < b.date ? -1 : 1));
                const end = MODEL.end;
                return src
                    .filter((d) => !end || d.date <= end)
                    .map((d) => {
                        const ins = ent ? ent.byDate.get(d.date) || null : null;
                        return {
                            x: d.date,
                            date: d.date,
                            w: d.weight,
                            tr: s ? d.trend : null,
                            ins,
                            kind: "day",
                        };
                    });
            }

            function availableRanges(s, days) {
                if (!s)
                    return RANGES.filter((r) => r.id === "7" || r.id === "30");
                const span = MODEL.span;
                return RANGES.filter((r) => {
                    if (r.id === "7" || r.id === "30") return true;
                    if (r.id === "90") return s.hasDaily;
                    if (r.id === "1y")
                        return (
                            span > 90 &&
                            (s.year.length > 0 || s.weekly.length > 0)
                        );
                    return (
                        span > 365 &&
                        (s.monthly.length > 0 || s.weekly.length > 0)
                    );
                });
            }

            function cutoffOf(id) {
                const r = RANGES.find((x) => x.id === id);
                return r && r.days && MODEL.end
                    ? shiftDate(MODEL.end, -(r.days - 1))
                    : "";
            }

            // A bucketed range (weekly or monthly averages) ends on the
            // latest logged day itself, not on the newest bucket's average,
            // so the end dot, the "Today" label and the change chip agree
            // with the big number. Buckets centred on or after that day are
            // dropped: their average is the same recent stretch.
            function withLatest(b) {
                const D = MODEL.days;
                const L = D.length ? D[D.length - 1] : null;
                if (!L || !b.length) return b;
                return b.filter((p) => p.x < L.date).concat([L]);
            }

            // The points a range plots, oldest first.
            function rangePoints(id) {
                const s = MODEL.s;
                const days = MODEL.days;
                if (id === "1y" && s && !s.year.length) {
                    return withLatest(
                        s.weekly.map((w) => ({
                            x: shiftDate(w.start, 3),
                            date: w.start,
                            w: w.weight,
                            tr: w.trend,
                            ins: null,
                            kind: "week",
                        })),
                    );
                }
                if (id === "all" && s) {
                    const start = MODEL.firstDate;
                    if (s.year.length && start && s.year[0].date <= start) {
                        return days;
                    }
                    const weeklyCovers =
                        s.weekly.length > 0 &&
                        start != null &&
                        s.weekly[0].start <= start;
                    return withLatest(
                        weeklyCovers
                            ? s.weekly.map((w) => ({
                                  x: shiftDate(w.start, 3),
                                  date: w.start,
                                  w: w.weight,
                                  tr: w.trend,
                                  ins: null,
                                  kind: "week",
                              }))
                            : s.monthly.map((m) => ({
                                  x: m.month + "-15",
                                  date: m.month + "-01",
                                  w: m.weight,
                                  tr: m.trend,
                                  ins: null,
                                  kind: "month",
                              })),
                    );
                }
                const cut = cutoffOf(id);
                return days.filter((d) => d.date >= cut);
            }

            function initialRange(data) {
                const want =
                    { 7: "7", 14: "30", 30: "30", 90: "90", 365: "1y" }[
                        data && data.default_range
                    ] || "30";
                const ids = MODEL.ranges.map((r) => r.id);
                const pick = ids.includes(want) ? want : "30";
                const has = (id) => rangePoints(id).length > 0;
                if (has(pick)) return pick;
                const wider = ids.slice(ids.indexOf(pick) + 1).find(has);
                return wider || pick;
            }

            // Least-squares slope × 7 over the range: only when there is no
            // server series (a host that dropped `_meta`), and only for a
            // range long and dense enough to mean something.
            function legacyRate(pts) {
                const n = pts.length;
                if (n < 4) return null;
                const xs = pts.map((p) => dayNum(p.x));
                if (xs[n - 1] - xs[0] < 10) return null;
                const ys = pts.map((p) => p.w);
                const mx = xs.reduce((a, b) => a + b, 0) / n;
                const my = ys.reduce((a, b) => a + b, 0) / n;
                let num = 0,
                    den = 0;
                xs.forEach((x, i) => {
                    num += (x - mx) * (ys[i] - my);
                    den += (x - mx) * (x - mx);
                });
                return den ? (num / den) * 7 : null;
            }

            function buildModel() {
                const data = STATE.data || {};
                const s = STATE.series;
                const ent = STATE.entries;
                const M = { s, ent, meas: STATE.meas };
                MODEL = M;
                M.code = data.unit || (s && s.unit) || "kg";
                M.unit = weightUnit(M.code);
                M.goal = isNum(data.target) ? data.target : null;
                M.end = isDate(data.end_date)
                    ? data.end_date
                    : s && s.trendDate
                      ? s.trendDate
                      : null;
                // Without `_meta`, end_date is the profile-timezone today
                // (unless the call named a past end date); the device clock
                // is the last resort.
                M.today =
                    (ent && ent.today) ||
                    (isDate(data.end_date) ? data.end_date : localToday());
                M.days = baseDays(data, s, ent);
                if (!M.end && M.days.length)
                    M.end = M.days[M.days.length - 1].date;
                M.firstDate =
                    s && s.first
                        ? s.first.date
                        : M.days.length
                          ? M.days[0].date
                          : null;
                M.firstW =
                    s && s.first
                        ? s.first.w
                        : M.days.length
                          ? M.days[0].w
                          : null;
                M.span =
                    M.firstDate && M.end
                        ? dayNum(M.end) - dayNum(M.firstDate)
                        : 0;
                // Latest weigh-in: the newest logged day; with no day in the
                // daily coverage, the newest bucket.
                M.last = M.days.length ? M.days[M.days.length - 1] : null;
                if (!M.last && s) {
                    const b = s.monthly[s.monthly.length - 1];
                    if (b)
                        M.last = {
                            x: b.month + "-15",
                            date: b.month + "-15",
                            w: b.weight,
                            kind: "month",
                        };
                }
                M.ranges = availableRanges(s, M.days);
                return M;
            }

            // Everything that depends on the selected range.
            function rangeModel(M, id) {
                const R = {};
                R.id = id;
                R.copy =
                    T.weightTrends.ranges[id] || T.weightTrends.ranges["30"];
                R.days = (RANGES.find((r) => r.id === id) || {}).days || null;
                R.pts = rangePoints(id);
                const n = R.pts.length;
                R.n = n;
                const hasG = M.goal != null;
                const G = M.goal;
                const lastW = M.last.w;
                R.single =
                    M.days.length <= 1 &&
                    (!M.firstDate || M.firstDate === M.last.date);
                R.losing = hasG && M.firstW != null && G < M.firstW;
                const toward = (v) => (!hasG ? 0 : R.losing ? -v : v);
                R.toward = toward;
                R.reached = hasG && (R.losing ? lastW <= G : lastW >= G);
                R.left = hasG ? Math.abs(lastW - G) : 0;
                // From raw readings, like the "Since" stat: All starts at the
                // first weigh-in ever even when its first point is a bucket
                // average. (1y without daily_year has no raw start in range,
                // so it starts at the first weekly average.)
                const first =
                    id === "all" && M.firstW != null
                        ? M.firstW
                        : n
                          ? R.pts[0].w
                          : 0;
                R.chg = n >= 2 ? R.pts[n - 1].w - first : 0;
                R.enough = n >= 4;
                R.rate = M.s ? M.s.weeklyRate : legacyRate(R.pts);
                const rate = R.rate;
                R.away =
                    hasG &&
                    R.enough &&
                    rate != null &&
                    !R.reached &&
                    toward(rate) < -0.02;
                R.dir = (v) =>
                    Math.abs(v) < 0.05
                        ? "z"
                        : !hasG
                          ? "n"
                          : toward(v) > 0
                            ? "g"
                            : "b";
                R.wk =
                    hasG &&
                    !R.reached &&
                    R.enough &&
                    rate != null &&
                    toward(rate) > 0.02
                        ? Math.ceil(R.left / Math.abs(rate))
                        : null;
                R.reachDay = null;
                if (hasG && R.reached) {
                    const ok = (d) => (R.losing ? d.w <= G : d.w >= G);
                    const D = M.days;
                    for (let i = D.length - 1; i > 0; i--) {
                        if (ok(D[i]) && !ok(D[i - 1])) {
                            R.reachDay = D[i];
                            break;
                        }
                    }
                    if (!R.reachDay && D.length) R.reachDay = D[0];
                }
                return R;
            }

            // ---- Header ----
            function titleOf(M, R) {
                const W = T.weightTrends;
                if (R.single) return W.titleFirst;
                // The server's weekly rate is range-independent, so with it
                // the title speaks for the whole history, not for how many
                // points the selected range holds (an empty 7-day range is not
                // "a few weigh-ins so far" for a user with months of them).
                const enough = M.s
                    ? M.days.length >= 4 || M.s.weekly.length >= 4
                    : R.enough;
                if (!enough) return W.titleFew;
                if (R.rate == null)
                    return R.reached ? W.titleGoalReached : W.titleNoRate;
                if (M.goal == null)
                    return Math.abs(R.rate) < 0.03
                        ? W.titleSteady
                        : R.rate < 0
                          ? W.titleDown
                          : W.titleUp;
                if (R.reached) return W.titleGoalReached;
                if (R.toward(R.rate) < -0.02) return W.titleAway;
                if (R.toward(R.rate) > 0.02) return W.titleOnTrack;
                return W.titleShortSteady;
            }

            function reelHtml(str) {
                let i = 0;
                const col = [];
                for (let c = 0; c < 4; c++)
                    for (let d = 0; d <= 9; d++) col.push(`<span>${d}</span>`);
                col.push("<span>0</span>");
                const colHtml = col.join("");
                return str
                    .split("")
                    .map((ch) => {
                        if (!/[0-9]/.test(ch)) return `<span>${esc(ch)}</span>`;
                        const html = `<span class="rl"><span class="rs" style="--d:${ch};--i:${i}">${colHtml}</span></span>`;
                        i++;
                        return html;
                    })
                    .join("");
            }

            function heroHtml(M, R) {
                const W = T.weightTrends;
                const value = f1(M.last.w);
                let chip = "";
                if (!R.single && R.n >= 2) {
                    const dc = R.dir(R.chg);
                    const cls =
                        dc === "g"
                            ? "good"
                            : dc === "b" && !R.reached
                              ? "bad"
                              : "neu";
                    chip = `<span class="dchip ${cls}">${esc(
                        tpl(W.chip, {
                            change: `${sg(R.chg)} ${M.unit}`,
                            range: R.copy.chip,
                        }),
                    )}</span>`;
                }
                const pills = M.ranges
                    .map((r) => {
                        const c = W.ranges[r.id];
                        const on = r.id === R.id;
                        return `<button type="button" class="reset rp${on ? " on" : ""}" data-act="range" data-r="${r.id}" data-f="r${r.id}" aria-pressed="${on}" aria-label="${esc(c.aria)}">${esc(c.label)}</button>`;
                    })
                    .join("");
                return `
          <div class="wtop">
            <div class="wnow">
              <span class="wbig num" role="img" aria-label="${esc(`${value} ${M.unit}`)}"><span aria-hidden="true" style="display:inline-flex">${reelHtml(value)}</span></span><span class="wunit" aria-hidden="true">${esc(M.unit)}</span>${chip}
            </div>
            ${M.ranges.length > 1 ? `<div class="rpills" role="group" aria-label="${esc(W.rangeGroupAriaLabel)}">${pills}</div>` : ""}
          </div>`;
            }

            // ---- Chart ----
            function niceDomain(lo, hi, lb) {
                const minSp = lb ? 6 : 3;
                const steps = lb
                    ? [1, 2, 5, 10, 20, 50]
                    : [0.5, 1, 2, 5, 10, 20];
                const pad = Math.max((hi - lo) * 0.08, lb ? 0.4 : 0.2);
                lo -= pad;
                hi += pad;
                if (hi - lo < minSp) {
                    const m = (hi + lo) / 2;
                    lo = m - minSp / 2;
                    hi = m + minSp / 2;
                }
                for (const s of steps) {
                    const a = Math.floor(lo / s + 1e-9) * s;
                    let b = Math.ceil(hi / s - 1e-9) * s;
                    let c = Math.round((b - a) / s) + 1;
                    if (c <= 5) {
                        while (c < 3) {
                            b += s;
                            c++;
                        }
                        return { lo: a, hi: b, step: s };
                    }
                }
                const s = steps[steps.length - 1];
                return {
                    lo: Math.floor(lo / s) * s,
                    hi: Math.ceil(hi / s) * s,
                    step: s,
                };
            }

            // The line's values: the server's EWMA when present, else (no
            // `_meta`) the design's centred moving average over the range.
            function smoothOf(pts) {
                const n = pts.length;
                if (pts.every((p) => isNum(p.tr))) return pts.map((p) => p.tr);
                const K = n > 120 ? 4 : n > 20 ? 2 : 1;
                return pts.map((_, i) => {
                    let s = 0,
                        c = 0;
                    for (
                        let j = Math.max(0, i - K);
                        j <= Math.min(n - 1, i + K);
                        j++
                    ) {
                        s += pts[j].w;
                        c++;
                    }
                    return s / c;
                });
            }

            function pointDateLabel(p) {
                if (p.kind === "month") return monthYear(p.date);
                if (p.kind === "week") return shortDate(p.date);
                return dFull(p.date);
            }
            function pointValue(p, withAvg) {
                const v = `${f1(p.w)} ${MODEL.unit}`;
                const k = p.ins ? p.ins.length : 1;
                return withAvg && k > 1
                    ? tpl(T.weightTrends.scrubAvg, { value: v, n: k })
                    : v;
            }

            function chartGeom(M, R, G) {
                const W = T.weightTrends;
                const CW = G.cw,
                    CH = G.ch;
                const pts = R.pts;
                const n = pts.length;
                const lb = M.code === "lb";
                const hasG = M.goal != null;
                const goal = M.goal;
                const few = n < 4;
                const padL = 8,
                    padR = 10,
                    padT = 10,
                    padB = 8,
                    band = 30;
                const pc = (v, of) => ((v / of) * 100).toFixed(2);
                const raw = pts.map((p) => p.w);
                const sm = few ? raw : smoothOf(pts);
                const all = raw.concat(sm);
                const dLo = Math.min(...all),
                    dHi = Math.max(...all);
                let Dm = niceDomain(dLo, dHi, lb),
                    goalIn = false,
                    pin = "";
                if (hasG) {
                    const Dg = niceDomain(
                        Math.min(dLo, goal),
                        Math.max(dHi, goal),
                        lb,
                    );
                    const share = (dHi - dLo) / (Dg.hi - Dg.lo);
                    // A goal the data's own axis already spans is drawn in
                    // place (the design pinned one sitting on the axis
                    // floor to the top edge, pointing the wrong way).
                    if (goal >= Dm.lo && goal <= Dm.hi) goalIn = true;
                    else if (
                        share >= 0.45 ||
                        Dg.hi - Dg.lo <= (Dm.hi - Dm.lo) * 1.15
                    ) {
                        Dm = Dg;
                        goalIn = true;
                    } else pin = goal < Dm.lo ? "down" : "up";
                }
                const top0 = padT + (pin === "up" ? band : 0),
                    bot0 = CH - padB - (pin === "down" ? band : 0);
                const ph = bot0 - top0,
                    pw = CW - padL - padR;
                const x0 = dayNum(pts[0].x),
                    x1 = dayNum(pts[n - 1].x);
                const xs = (d) => padL + ((d - x0) / (x1 - x0 || 1)) * pw;
                const ys = (v) => top0 + ((Dm.hi - v) / (Dm.hi - Dm.lo)) * ph;
                const Rp = pts.map((p) => [xs(dayNum(p.x)), ys(p.w)]);
                const P = few
                    ? Rp
                    : pts.map((p, i) => [xs(dayNum(p.x)), ys(sm[i])]);
                const q = (p) => p[0].toFixed(1) + " " + p[1].toFixed(1);
                const cr = (i) => {
                    const p0 = P[i - 2] || P[i - 1],
                        p1 = P[i - 1],
                        p2 = P[i],
                        p3 = P[i + 1] || P[i];
                    return (
                        " C" +
                        (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) +
                        " " +
                        (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) +
                        " " +
                        (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) +
                        " " +
                        (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) +
                        " " +
                        q(p2)
                    );
                };
                const gapDays =
                    pts[0].kind === "month"
                        ? 45
                        : pts[0].kind === "week"
                          ? 10
                          : 4;
                let solid = "",
                    dash = "",
                    full = "M" + q(P[0]),
                    lastKind = null;
                for (let i = 1; i < n; i++) {
                    const kind =
                        few || dayNum(pts[i].x) - dayNum(pts[i - 1].x) > gapDays
                            ? "d"
                            : "s";
                    const cmd = few ? " L" + q(P[i]) : cr(i);
                    full += cmd;
                    if (kind === "s") {
                        if (lastKind !== "s")
                            solid += (solid ? " " : "") + "M" + q(P[i - 1]);
                        solid += cmd;
                    } else {
                        if (lastKind !== "d")
                            dash += (dash ? " " : "") + "M" + q(P[i - 1]);
                        dash += cmd;
                    }
                    lastKind = kind;
                }
                const area = !few
                    ? full +
                      " L" +
                      P[n - 1][0].toFixed(1) +
                      " " +
                      bot0 +
                      " L" +
                      P[0][0].toFixed(1) +
                      " " +
                      bot0 +
                      " Z"
                    : "";
                const ticks = [];
                for (let v = Dm.lo; v <= Dm.hi + 1e-9; v += Dm.step)
                    ticks.push(Math.round(v * 10) / 10);
                const tf = (v) =>
                    Dm.step < 1 ? nf(1).format(v) : nf(0).format(Math.round(v));
                const grid = ticks
                    .map((v) => "M0 " + ys(v).toFixed(1) + "H" + CW)
                    .join(" ");
                const lp = Rp[n - 1];

                // Goal: dashed line inside the domain with a pill placed off
                // the line, or pinned in a band at the edge.
                let goalEl = null;
                const goalTxt = hasG ? `${f1(goal)} ${M.unit}` : "";
                const leftTxt = `${f1(R.left)} ${M.unit}`;
                if (hasG && goalIn) {
                    const gy = ys(goal);
                    const txt = R.reached
                        ? tpl(W.goalPillReached, { goal: goalTxt })
                        : tpl(W.goalPill, { goal: goalTxt, left: leftTxt });
                    const w = txt.length * 6.3 + 18,
                        hgt = 20;
                    const yAt = (x) => {
                        const i = P.findIndex((p) => p[0] >= x);
                        if (i < 0) return P[n - 1][1];
                        if (i === 0) return P[0][1];
                        const a = P[i - 1],
                            b = P[i];
                        return (
                            a[1] +
                            ((b[1] - a[1]) * (x - a[0])) / (b[0] - a[0] || 1)
                        );
                    };
                    const hits = (x, y) => {
                        for (let xx = x - 4; xx <= x + w + 4; xx += 3) {
                            const ly = yAt(xx);
                            if (ly > y - 6 && ly < y + hgt + 6) return true;
                        }
                        return (
                            Rp.some(
                                (p) =>
                                    p[0] > x - 6 &&
                                    p[0] < x + w + 6 &&
                                    p[1] > y - 5 &&
                                    p[1] < y + hgt + 5,
                            ) ||
                            (lp[0] > x - 14 &&
                                lp[0] < x + w + 14 &&
                                lp[1] > y - 14 &&
                                lp[1] < y + hgt + 14)
                        );
                    };
                    const cands = [];
                    [
                        ["st", padL],
                        ["en", CW - padR - w],
                        ["md", padL + (pw - w) / 2],
                    ].forEach(([a, x]) => {
                        cands.push({ a, x, y: gy - hgt - 5 });
                        cands.push({ a, x, y: gy + 5 });
                    });
                    [
                        ["en", CW - padR - w],
                        ["st", padL],
                    ].forEach(([a, x]) => {
                        cands.push({ a, x, y: top0 - 6 });
                        cands.push({ a, x, y: bot0 - hgt + 4 });
                    });
                    const ok = cands.filter((c) => c.y >= 0 && c.y + hgt <= CH);
                    const c =
                        ok.find((c) => !hits(c.x, c.y)) || ok[0] || cands[0];
                    const ax =
                        c.a === "st" ? padL : c.a === "en" ? CW - padR : CW / 2;
                    goalEl = {
                        d: "M0 " + gy.toFixed(1) + "H" + CW,
                        l: pc(ax, CW),
                        t: pc(c.y, CH),
                        cls: "cgp " + c.a,
                        txt,
                    };
                } else if (hasG) {
                    const ly =
                        pin === "down" ? CH - band / 2 - 2 : band / 2 + 2;
                    const txt = tpl(
                        pin === "down" ? W.goalBelow : W.goalAbove,
                        {
                            goal: goalTxt,
                            left: leftTxt,
                        },
                    );
                    goalEl = {
                        d: "M0 " + ly.toFixed(1) + "H" + CW,
                        l: pc(0, CW),
                        t: pc(ly - 10, CH),
                        cls: "cgp st",
                        txt,
                    };
                }

                // Value labels for sparse data; the last value is the hero
                // number, so it gets none.
                const vlabels = few
                    ? Rp.slice(0, -1).map((p, i) => {
                          const below = p[1] - 24 < 0;
                          const a =
                              p[0] < 22 ? "st" : p[0] > CW - 22 ? "en" : "md";
                          return `<span class="cval ${a}${below ? " bl" : ""}" style="left:${pc(p[0], CW)}%;top:${pc(below ? p[1] + 8 : p[1] - 8, CH)}%">${esc(f1(pts[i].w))}</span>`;
                      })
                    : [];

                // X labels: start, middle, end.
                const longR = R.days == null || R.days >= 365;
                const xl = [x0, (x0 + x1) / 2, x1];
                const xlab = (d, i) => {
                    const iso =
                        i === 0
                            ? pts[0].date
                            : i === 2
                              ? pts[n - 1].date
                              : dateOfDayNum(d);
                    if (i === 2 && pts[n - 1].kind === "day" && iso === M.today)
                        return W.today;
                    if (longR && i < 2) return monthYear2(iso);
                    if (pts[0].kind === "month") return monthYear2(iso);
                    return shortDate(iso);
                };
                const xlabels =
                    n === 1
                        ? ""
                        : xl
                              .map((d, i) => {
                                  const cls =
                                      i === 0 ? "st" : i === 1 ? "md" : "en";
                                  const l = pc(
                                      i === 0
                                          ? padL
                                          : i === 1
                                            ? CW / 2
                                            : CW - padR,
                                      CW,
                                  );
                                  return `<span class="${cls}" style="left:${l}%">${esc(xlab(d, i))}</span>`;
                              })
                              .join("");

                // Hit columns: one button per point, spanning midpoint to
                // midpoint.
                const si = VIEW.scrub;
                const hits = Rp.map((p, i) => {
                    const a = i === 0 ? 0 : (Rp[i - 1][0] + p[0]) / 2,
                        b = i === n - 1 ? CW : (p[0] + Rp[i + 1][0]) / 2;
                    const pt = pts[i];
                    const k = pt.ins ? pt.ins.length : 1;
                    const aria =
                        k > 1
                            ? tpl(W.hitLabelAvg, {
                                  date: pointDateLabel(pt),
                                  value: `${f1(pt.w)} ${M.unit}`,
                                  n: k,
                              })
                            : tpl(W.hitLabel, {
                                  date: pointDateLabel(pt),
                                  value: `${f1(pt.w)} ${M.unit}`,
                              });
                    const on = si === i;
                    return `<button type="button" class="reset chit${on ? " on" : ""}" data-act="hit" data-i="${i}" data-f="h${i}" style="left:${pc(a, CW)}%;width:${pc(b - a, CW)}%" aria-pressed="${on}" aria-label="${esc(aria)}"></button>`;
                }).join("");

                let scrub = "";
                if (si != null && si < n) {
                    const pt = pts[si],
                        p = Rp[si];
                    const xr = p[0] / CW;
                    const below = p[1] < 44;
                    const cls =
                        "stip " +
                        (xr < 0.3 ? "st" : xr > 0.7 ? "en" : "md") +
                        (below ? " bl" : "") +
                        (FRESH.has("scrub") ? " fresh" : "");
                    scrub = `
              <span class="shair" style="left:${pc(p[0], CW)}%"></span>
              <span class="sdot" style="left:${pc(p[0], CW)}%;top:${pc(p[1], CH)}%"></span>
              <div class="${cls}" style="left:${pc(p[0], CW)}%;top:${pc(p[1], CH)}%"><span class="num"><b>${esc(pointDateLabel(pt))}</b> · ${esc(pointValue(pt, true))}</span><button type="button" class="reset sx" data-act="sx" data-f="sx" aria-label="${esc(W.close)}">×</button></div>`;
                }

                const yl = ticks
                    .map(
                        (v) =>
                            `<span class="num" style="top:${pc(ys(v), CH)}%">${esc(tf(v))}</span>`,
                    )
                    .reverse()
                    .join("");
                const dotCls = few ? "cdot few" : n > 90 ? "cdot tiny" : "cdot";
                const dots = Rp.map((p) => "M" + q(p) + "h0").join(" ");
                return `
          <div class="cbody">
            <div class="cyl" aria-hidden="true">${yl}</div>
            <div class="cplot" style="aspect-ratio:${CW} / ${CH}">
              <svg class="wch" viewBox="0 0 ${CW} ${CH}" aria-hidden="true">
                <path d="${grid}" class="cg"></path>
                ${area ? `<path d="${area}" class="carea"></path>` : ""}
                ${goalEl ? `<path d="${goalEl.d}" class="cgoal"></path>` : ""}
                <path d="${dots}" class="${dotCls}"></path>
                ${dash ? `<path d="${dash}" class="cline dash"></path>` : ""}
                ${solid ? `<path d="${solid}" pathLength="100" class="cline"></path>` : ""}
              </svg>
              ${vlabels.join("")}
              ${goalEl ? `<span class="${goalEl.cls}" style="left:${goalEl.l}%;top:${goalEl.t}%">${esc(goalEl.txt)}</span>` : ""}
              <span class="cend" style="left:${pc(lp[0], CW)}%;top:${pc(lp[1], CH)}%" aria-hidden="true"></span>
              <div class="chits">${hits}</div>
              ${scrub}
            </div>
            <span class="cu" aria-hidden="true">${esc(M.unit)}</span>
            <div class="cx num" aria-hidden="true">${xlabels}</div>
          </div>`;
            }

            function chartHtml(M, R) {
                const W = T.weightTrends;
                const n = R.n;
                if (n === 0) {
                    const last = M.last;
                    const txt =
                        last && last.kind === "day"
                            ? tpl(W.emptyRangeLast, {
                                  range: R.copy.word,
                                  date: shortDate(last.date),
                              })
                            : tpl(W.emptyRange, { range: R.copy.word });
                    return `<div class="cempty">${esc(txt)}</div>`;
                }
                if (n === 1) {
                    const p = R.pts[0];
                    const recent =
                        p.kind === "day" &&
                        p.ins &&
                        p.ins.length === 1 &&
                        dayNum(M.today) - dayNum(p.date) < 2;
                    const when = recent
                        ? tpl(W.whenTime, {
                              date: dLong(p.date),
                              time: p.ins[0].t,
                          })
                        : p.kind === "day"
                          ? dLong(p.date)
                          : pointDateLabel(p);
                    const value = `${f1(p.w)} ${M.unit}`;
                    let title, line, hint;
                    if (R.single) {
                        title = W.oneTitleFirst;
                        line = tpl(W.oneFirst, { when, value });
                        hint = W.oneHintFirst;
                    } else {
                        title = tpl(W.oneTitle, { range: R.copy.word });
                        line = tpl(W.oneLine, { when, value });
                        const earlier = M.days.filter(
                            (d) => d.date < p.date,
                        ).length;
                        hint =
                            earlier > 0
                                ? plural(W.oneHintEarlier, earlier)
                                : "";
                    }
                    return `
          <div class="cone">
            <span class="conedot" aria-hidden="true"></span>
            <b>${esc(title)}</b>
            <span class="num">${esc(line)}</span>
            ${hint ? `<span class="coneh">${esc(hint)}</span>` : ""}
          </div>`;
                }
                const hasG = M.goal != null;
                const aria = tpl(W.chartAriaLabel, {
                    latest: `${f1(M.last.w)} ${M.unit}`,
                    goal: hasG
                        ? tpl(W.chartAriaGoal, {
                              goal: `${f1(M.goal)} ${M.unit}`,
                          })
                        : "",
                    change: tpl(W.chartAriaChange, {
                        change: `${sg(R.chg)} ${M.unit}`,
                        range: R.copy.inRange,
                    }),
                });
                let live = "";
                if (VIEW.scrub != null && VIEW.scrub < n) {
                    const pt = R.pts[VIEW.scrub];
                    live = `${pointDateLabel(pt)} · ${pointValue(pt, true)}`;
                }
                return `
          <div class="wplot" role="group" aria-label="${esc(aria)}">
            <div class="only-m">${chartGeom(M, R, GEOMS[0])}</div>
            <div class="only-d">${chartGeom(M, R, GEOMS[1])}</div>
            <span class="vh" aria-live="polite">${esc(live)}</span>
          </div>`;
            }

            // ---- Summary (phone) and stats (desktop) ----
            function summaryOf(M, R) {
                const W = T.weightTrends;
                const parts = [];
                let hint = "";
                const b = (txt, cls) =>
                    `<b class="num${cls ? " " + cls : ""}">${esc(txt)}</b>`;
                const reachedPart = () =>
                    tplHtml(W.reachedOn, {
                        date: b(shortDate(R.reachDay.date)),
                    });
                if (R.n <= 1) return { parts, hint };
                if (!R.enough) hint = W.hintFew;
                else if (R.rate == null) {
                    if (R.reachDay) parts.push(reachedPart());
                    else hint = W.hintNoRate;
                } else {
                    const amount = b(
                        `${sg(R.rate, 2)} ${M.unit}`,
                        R.away ? "over" : "",
                    );
                    parts.push(
                        tplHtml(M.goal != null ? W.perWeek : W.perWeekAvg, {
                            amount,
                        }),
                    );
                    if (R.wk != null)
                        parts.push(
                            tplHtml(W.toGoal, {
                                value: b(
                                    R.wk > 104
                                        ? W.yearsPlus
                                        : plural(W.weeksApprox, R.wk),
                                ),
                            }),
                        );
                    else if (R.reachDay) parts.push(reachedPart());
                    else if (R.away) parts.push(esc(W.movingAway));
                    else if (M.goal != null) parts.push(esc(W.tooFlat));
                }
                return { parts, hint };
            }

            function statsOf(M, R) {
                const W = T.weightTrends;
                const stats = [];
                if (R.enough && R.rate != null) {
                    stats.push({
                        k: W.statPerWeek,
                        v: sg(R.rate, 2),
                        u: M.unit,
                        cls: R.away ? "over" : "",
                    });
                    if (R.wk != null)
                        stats.push({
                            k: W.statGoalPace,
                            v: R.wk > 104 ? "2+" : "~" + R.wk,
                            u:
                                R.wk > 104
                                    ? W.unitYears
                                    : plural(W.unitWeeks, R.wk),
                        });
                    else if (R.reachDay)
                        stats.push({
                            k: W.statGoalReached,
                            v: shortDate(R.reachDay.date),
                            u: "",
                        });
                } else if (R.enough && R.reachDay) {
                    stats.push({
                        k: W.statGoalReached,
                        v: shortDate(R.reachDay.date),
                        u: "",
                    });
                }
                if (M.goal != null && !R.reached && !R.enough)
                    stats.push({ k: W.statToGoal, v: f1(R.left), u: M.unit });
                const cut = cutoffOf(R.id);
                if (
                    !R.single &&
                    R.n &&
                    M.firstDate &&
                    cut &&
                    M.firstDate < cut &&
                    M.firstW != null
                ) {
                    const old = dayNum(M.today) - dayNum(M.firstDate) > 300;
                    stats.push({
                        k: tpl(W.statSince, {
                            date: old
                                ? monthYear(M.firstDate)
                                : shortDate(M.firstDate),
                        }),
                        v: sg(M.last.w - M.firstW),
                        u: M.unit,
                    });
                }
                return stats;
            }

            function toggleBtn(M) {
                const W = T.weightTrends;
                const open = VIEW.level >= 1;
