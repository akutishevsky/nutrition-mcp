<!doctype html>
<!--
  Weight-trends widget (MCP Apps).

  Assembled from shared partials at server startup (see src/widgets.ts); the
  @include markers below inline the shared design tokens, the card shell, the
  focus panel and segmented control, the chart grammar and the host bridge. The
  result is fully self-contained — inline CSS + JS, zero network requests —
  because the MCP Apps sandbox blocks external hosts.

  Shown after get_weight_trends. ONE Dawn card, in nutrition-summary's anatomy:
  a header carrying the title, the 7 / 14 / 30-day toggle and — on a row of its
  own — which window the figures cover and how many readings are in it; then
  the latest reading as a focus panel with its own chart inside it; then the
  card foot the bridge's settings note lands in.

  There is NO chip rail, NO drawer and NO ring, and that is the point: this
  widget has a single series, a rail of one chip would be ceremony, and a
  weight is not a fraction of its target. So it includes neither macros.js nor
  spark.js — the panel is written out of chip.css's class names
  (`span.focus.solo`), which are the shared contract, in
  shared/weight-trends-card.js. Interaction-led does not
  mean interaction-everywhere.

  The tool sends up to 30 days of per-day weight (same-day weigh-ins averaged),
  and the toggle filters it CLIENT-SIDE and re-renders — no host round-trip.
  Unlike the calorie chart, the weight axis is scaled to the DATA range (not
  zero-based) so a 1 kg move over a month is still visible.

  Data arrives as the `structuredContent` of the get_weight_trends tool result;
  the shared bridge (shared/bridge.js) reads it across host conventions and calls
  render(). Standalone preview uses the SAMPLE below.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Weight Trends</title>
        <style>
            /*@include shared/tokens.css@*/

            /*@include shared/base.css@*/

            /* The focus panel (`.focus.solo`), its meta lines and the
               segmented control. */
            /*@include shared/chip.css@*/

            /* The line, the dashed target, the per-reading marks, the
               last-reading dot. */
            /*@include shared/chart.css@*/
        </style>
    </head>
    <body>
        <div class="wrap" id="root"></div>

        <script>
            "use strict";

            /*@i18n@*/
            /*@include shared/i18n.js@*/

            /*@include shared/date.js@*/

            /*@include shared/icon.js@*/

            /*@include shared/svg.js@*/

            /*@include shared/bridge.js@*/

            // ---- Sample data so the file renders on its own (browser preview) ----
            function buildSample() {
                const days = [];
                const end = new Date("2026-07-11T00:00:00Z");
                for (let i = 30; i >= 0; i -= 2) {
                    const d = new Date(end);
                    d.setUTCDate(d.getUTCDate() - i);
                    const date = d.toISOString().slice(0, 10);
                    const t = (30 - i) / 30;
                    const w = 80 - t * 3 + Math.sin(i) * 0.25;
                    days.push({ date, weight: Math.round(w * 10) / 10 });
                }
                return {
                    end_date: "2026-07-11",
                    unit: "kg",
                    target: 75,
                    default_range: 30,
                    locale: "en",
                    days,
                };
            }
            const SAMPLE = buildSample();

            /* fmt() and esc() — esc is what the card partial below escapes
               with. After shared/i18n.js because fmt() reads WIDGET_LOCALE. */
            /*@include shared/fmt.js@*/

            // The card — header, panel, chart, and the 7 / 14 / 30 windows
            // (WEIGHT_RANGES) — as pure functions of the payload and the range:
            // shared/weight-trends-card.js, which the public site's landing
            // page renders from too. This template keeps the state and the
            // DOM writes.
            /*@include shared/weight-trends-card.js@*/

            // ---- State + rendering ---------------------------------------------

            // `picked` is the range the user chose with the toggle (null until
            // they do); `endDate` and `defaultRange` the payload's end_date and
            // default_range it was chosen against. `painted` is whether the
            // chart has drawn once since the last render(): every paint after
            // that is `.still`, so a range switch is instant and only a new
            // tool result replays the draw-in.
            const STATE = {
                data: null,
                range: 30,
                picked: null,
                endDate: null,
                defaultRange: null,
                painted: false,
            };
            let __widgetApi = null;

            function render(data) {
                // An object always, so every reader below can ask it for a field
                // — a missing payload is just the empty state.
                STATE.data = data && typeof data === "object" ? data : {};
                data = STATE.data;
                const root = document.getElementById("root");
                setLocaleFrom(data, __widgetApi);
                // Keep the range the user picked across a re-delivered result
                // with the same end_date AND default_range — a host handing the
                // same result back while the card is on screen must not undo
                // their tap. A different end_date (a different window) or a
                // different default_range (the model asking for another view) is
                // the tool answering a different question, and its default is
                // adopted — the rule trends.html keys on the same two fields.
                // Compared as sent, not as resolved: an end_date that changed
                // from one bad value to another is still a new result.
                const def = WEIGHT_RANGES.includes(data && data.default_range)
                    ? data.default_range
                    : 30;
                const endDate = data.end_date == null ? null : data.end_date;
                if (
                    STATE.picked == null ||
                    def !== STATE.defaultRange ||
                    endDate !== STATE.endDate
                ) {
                    STATE.picked = null;
                    STATE.range = def;
                } else {
                    STATE.range = STATE.picked;
                }
                STATE.endDate = endDate;
                STATE.defaultRange = def;
                // A new tool result is a new card, and owes the chart its
                // entrance again.
                STATE.painted = false;
                const html = weightTrendsCard(data, STATE.range, {
                    still: STATE.painted,
                });
                // keepFocus (bridge.js): a seg button that held focus before the
                // rewrite gets it back afterwards (keyed on data-range), and a
                // re-delivery never takes focus from the host.
                keepFocus(root, () => {
                    root.innerHTML = html;
                });
                if (root.querySelector("#wt-body .cwrap")) STATE.painted = true;
                // A range toggle may not change the card's height (the panel's
                // three fixed lines are the other half of that rule), and the
                // window line is the one part of the header a range rewrites:
                // "22 Okt. – 20. Nov. 2025 · 30 Wiegungen" takes a second row
                // where the 7-day label takes one. reserveLine (shared/bridge.js)
                // floors the box at the tallest candidate once per payload.
                reserveLine(
                    root.querySelector("#wt-meta"),
                    WEIGHT_RANGES.map((r) => weightTrendsMeta(data, r)),
                );
            }

            // A range change is an attribute flip, a body repaint and a
            // textContent update on the header's window line — NEVER a full
            // paint. Rewriting root.innerHTML from the toggle's own click
            // handler destroyed the seg button that was being operated, so
            // document.activeElement fell to <body> and a keyboard user was
            // dumped to the top of the document on every range change (a11y
            // audit, major).
            //
            // A THROW LEAVES THE CARD AS IT WAS. The body is built as a string
            // before anything is written, inside tryRender (bridge.js); on
            // failure the range and the pressed button go back to what they
            // were and the body the user was already reading stays. Blanking the
            // card — the bridge's rule for a FIRST paint, which has nothing to
            // keep — would delete the widget, and the button under the user's
            // finger with it, because they tapped "7".
            function setRange(n) {
                const root = document.getElementById("root");
                const body = document.getElementById("wt-body");
                const meta = document.getElementById("wt-meta");
                if (!root || !body || !meta) return;
                const prev = STATE.range;
                STATE.range = n;
                const ok = tryRender(() => {
                    const html = weightTrendsBody(
                        STATE.data,
                        STATE.range,
                        STATE.painted,
                    );
                    const text = weightTrendsMeta(STATE.data, STATE.range);
                    body.innerHTML = html;
                    meta.textContent = text;
                });
                if (ok) {
                    STATE.picked = n;
                    STATE.painted = true;
                } else {
                    STATE.range = prev;
                }
                root.querySelectorAll("[data-range]").forEach((b) => {
                    b.setAttribute(
                        "aria-pressed",
                        String(Number(b.dataset.range) === STATE.range),
                    );
                });
            }

            // Delegated on #root, which survives render()'s innerHTML rewrites.
            document.getElementById("root").addEventListener("click", (e) => {
                const btn = e.target.closest("[data-range]");
                if (!btn) return;
                const n = Number(btn.dataset.range);
                if (n && n !== STATE.range && STATE.data) setRange(n);
            });

            // ---- Rendering intake ----------------------------------------------
            function coerce(payload) {
                if (!payload || typeof payload !== "object") return null;
                if (Array.isArray(payload.days)) return payload;
                if (payload.structuredContent) return payload.structuredContent;
                return null;
            }

            initWidget({
                name: "weight-trends-widget",
                // T is English until a payload names a locale (shared/i18n.js
                // initialises it to WIDGET_STRINGS.en), which is all a loading
                // line can know.
                loading: `<div class="empty"><div class="big">⚖️</div><div>${esc(T.weightTrends.loading)}</div></div>`,
                coerce,
                render,
                sample: SAMPLE,
                onReady(api) {
                    __widgetApi = api;
                },
            });
        </script>
    </body>
</html>
